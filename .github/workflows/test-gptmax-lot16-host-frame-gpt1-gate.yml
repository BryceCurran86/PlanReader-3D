name: GPT MAX Lot16 Host Frame Dimensions GPT1 Gate

concurrency:
  group: test-gptmax-lot16-host-frame-gpt1-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gptmax_lot16_host_frame_gpt1_handoff.py
      - tests/test_gptmax_lot16_host_frame_gpt1_handoff.py
      - tests/test_gptmax_independent_axes_figured_pair_handoff.py
      - docs/engineering/gptmax_lot16_host_frame_dimensions_20261015.md
      - .github/workflows/test-gptmax-lot16-host-frame-gpt1-gate.yml
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  source-integrity-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q             tests/test_gptmax_lot16_host_frame_gpt1_handoff.py             tests/test_gptmax_independent_axes_figured_pair_handoff.py
          ruff check --select F821,F823             tools/diag_gptmax_lot16_host_frame_gpt1_handoff.py             tests/test_gptmax_lot16_host_frame_gpt1_handoff.py             tests/test_gptmax_independent_axes_figured_pair_handoff.py

  immutable-original-production-replay:
    # Public CI has no client-owned original PDFs. Skipped means NOT VERIFIED,
    # not a pass. Only enable after the private SHA-pinned source has been
    # provisioned through an authorised separate workflow/owner runner.
    if: ${{ vars.PLANREADER_OWNER_ORIGINAL_SOURCE_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Replay original Lot16 original SHA and live source-gated host/frame/dimensions
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum -c
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_host_frame_gpt1_handoff.py \
            --pdf "$PDF" --page-id 3 \
            --sha256 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output artifacts/gptmax-original-lot16-host-frame-dimension-gate.json
      - name: Verify all 21 own-host/own-frame records and refuse unowned dimensions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/gptmax-original-lot16-host-frame-dimension-gate.json').read_text())
          assert r['status']=='UNPUBLISHED_SOURCE_REPROVED_OPENING_GPT1_QUEUE'
          assert r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['snapshot_id']=='source_snapshot_3fcb6bc5c44b51d930e9600080501d27'
          assert r['same_root_f07']['status']=='SOURCE_VIEW_CANDIDATE_SAME_ROOT_ONLY'
          assert r['same_root_f07']['selected_view_id']=='source_plan_view_67db409f1a44214bbf0766ac'
          # Preserve historical 21/15/9/8 as minimum predecessor coverage.
          # A legitimate new original source host/axis is not a regression;
          # rejecting every new GPT1 *review candidate* would freeze recall.
          decisions=r['opening_decisions']
          assert r['original_physical_opening_count']>=21
          assert r['original_authenticated_hosts']>=15
          assert r['original_complete_host_frames']>=9
          assert r['original_signed_area_quantities']>=8
          assert r['source_snapshot_and_original_sealed_receipts_unchanged']
          assert len({x['physical_opening_id'] for x in decisions})==len(decisions)
          assert len(decisions)==r['original_physical_opening_count']
          assert sum(r['first_gate_counts'].values())==len(decisions)
          assert sum(bool(x['authenticated_frame_record_id']) for x in decisions)==r['original_complete_host_frames']
          assert sum(bool(x['authenticated_host_record_id']) for x in decisions)==r['original_authenticated_hosts']
          # No quantity rekey: every PREVIOUSLY signed opening must remain in
          # the exact immutable eight-row archive. This does not authorize
          # extra FIRM rows; GPT1/GPT3 still have independent source+seal gates.
          archived=json.loads(Path(
            'docs/engineering/lot16_original_signed_eight_row_20261015/'
            'production/source_sealed_run.json').read_text())
          old_ids={x['quantity_id'] for x in archived['quantities']}
          current_ids={x['prior_signed_quantity_id'] for x in decisions
                       if x['prior_signed_quantity_id']}
          assert len(old_ids)==8 and old_ids.issubset(current_ids)
          assert not r['signed_customer_publisher_activated']
          assert not r['signed_source_lineage_handoff_granted']
          assert not r['global_opening_count_granted']
          assert all(not x['measurement_published']
              and not x['customer_seal_granted']
              and not x['opening_count_granted'] for x in decisions)
          for x in r['gpt1_new_handoff_candidates']:
            assert x in decisions
            assert x['new_gpt1_candidate_handoff'] is True
            assert x['prior_signed_quantity_id'] is None
            assert x['authenticated_host_record_id']
            assert x['authenticated_frame_record_id']
            assert x['filling_kind_source_supported']
            assert x['figured_pair_area_support']
            assert x['independent_axes_agree_with_original_pair']
            assert x['first_remaining_gate']=='independent_gpt1_measurement_validation_required'
          print('Original source replay and 8 historical ids retained; '
                'independent new GPT1 reviews:',len(r['gpt1_new_handoff_candidates']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-lot16-original-host-frame-dimension-first-gates
          path: artifacts/gptmax-original-lot16-host-frame-dimension-gate.json
          retention-days: 21
