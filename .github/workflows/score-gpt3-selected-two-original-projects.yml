name: SCORE GPT3 Two Original Selected V2 Projects

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/report_gpt3_selected_two_project_original_evidence.py"
      - "tools/report_gpt3_four_project_evidence.py"
      - "tests/test_gpt3_strict_signed_json_ingress.py"
      - "tests/test_gpt3_selected_two_project_original_evidence.py"
      - ".github/workflows/score-gpt3-selected-two-original-projects.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Public standard runners are free; cancel only superseded runs of THIS
# diagnostic workflow for the SAME PR, never a distinct PR or mandatory CI.
concurrency:
  group: score-gpt3-selected-two-original-projects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Selected project nonpublication and duplicate-source negative tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt3_selected_two_project_original_evidence.py tests/test_gpt3_four_project_evidence.py tests/test_gpt3_original_byte_gated_exact_project.py tests/test_gpt3_strict_signed_json_ingress.py
          ruff check --select F821,F823 tools/report_gpt3_selected_two_project_original_evidence.py tests/test_gpt3_selected_two_project_original_evidence.py tools/report_gpt3_four_project_evidence.py tests/test_gpt3_strict_signed_json_ingress.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

  # The public PR can verify synthetic contracts without access to private
  # PDFs. Original-source replay is OWNER-INVOKED only: a missing token/source
  # fails closed and never produces a false four-project score.
