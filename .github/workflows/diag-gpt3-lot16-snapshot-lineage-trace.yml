name: DIAG GPT3 Lot16 Snapshot Lineage Trace

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run snapshot-lineage trace
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_snapshot_lineage_trace.py \
            | tee lot16-snapshot-lineage-trace.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-snapshot-lineage-trace
          path: lot16-snapshot-lineage-trace.json
          retention-days: 2
