name: Canonical Five-Project Parallel Benchmark

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - benchmark_id: tenders_ke_kstvet_cbc_classroom
            filename: 1727358888238-bq-nd-drawing.pdf
            url: https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
            sha256: 6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc
          - benchmark_id: tenders_ke_murera_science_lab
            filename: 1785347143869-bqs-drawings.pdf
            url: https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf
            sha256: 84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b
          - benchmark_id: tenders_ke_ghazi_science_lab
            filename: 1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            url: https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            sha256: c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f
          - benchmark_id: tenders_ke_lamu_ishakani_ecd_classrooms
            filename: lamu-ishakani-ecd-classrooms-boq.pdf
            url: https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf
            sha256: fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2
          - benchmark_id: tenders_ke_umma_hostels
            filename: umma-university-hostels-builders-work.pdf
            url: https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf
            sha256: f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify source
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_FILENAME: ${{ matrix.filename }}
          SOURCE_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import requests

          url = os.environ["SOURCE_URL"]
          filename = os.environ["SOURCE_FILENAME"]
          expected = os.environ["SOURCE_SHA256"]
          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0 PlanReader-Benchmark/1.0"},
              timeout=120,
          )
          r.raise_for_status()
          path = Path("benchmarks/sources") / filename
          path.write_bytes(r.content)
          actual = hashlib.sha256(r.content).hexdigest()
          print(f"{filename}: {len(r.content)} bytes sha256={actual}")
          if actual != expected:
              raise SystemExit(f"SHA mismatch: expected {expected}, got {actual}")
          PY

      - name: Run canonical project evaluator
        env:
          BENCHMARK_ID: ${{ matrix.benchmark_id }}
          SOURCE_FILENAME: ${{ matrix.filename }}
        run: |
          set -euo pipefail
          OUT="/tmp/benchmark-${BENCHMARK_ID}"
          mkdir -p "$OUT"
          PYTHONPATH=. python pb_benchmark_accuracy_engine.py             --benchmark "$BENCHMARK_ID"             --pdf "benchmarks/sources/$SOURCE_FILENAME"             --auto-extract             --output-dir "$OUT" | tee "$OUT/console.txt"

      - name: Upload project benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.benchmark_id }}
          path: /tmp/benchmark-${{ matrix.benchmark_id }}
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-tenders_ke_*
          path: /tmp/project-results
          merge-multiple: true

      - name: Aggregate exact five-project metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          reports = []
          for path in sorted(Path("/tmp/project-results").glob("*_accuracy_report.json")):
              data = json.loads(path.read_text())
              if data.get("benchmark_id", "").startswith("tenders_ke_"):
                  reports.append(data)

          ids = {
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          }
          reports = [r for r in reports if r.get("benchmark_id") in ids]
          print(f"reports_found={len(reports)}")
          for r in reports:
              print(r["benchmark_id"], json.dumps(r["summary"], sort_keys=True))

          metrics = {
              "expected": sum(r["summary"]["total_measurable_expected"] for r in reports),
              "compared": sum(r["summary"]["total_items_compared"] for r in reports),
              "exact": sum(r["summary"]["exact_matches"] for r in reports),
              "within_5": sum(r["summary"]["within_5_percent"] for r in reports),
              "gross": sum(r["summary"]["gross_mismatches"] for r in reports),
              "missed": sum(r["summary"]["missed_items"] for r in reports),
              "hallucinated": sum(r["summary"]["hallucinated_items"] for r in reports),
          }
          metrics["accepted"] = metrics["exact"] + metrics["within_5"]
          metrics["accuracy"] = (
              round(metrics["accepted"] / metrics["compared"] * 100.0, 2)
              if metrics["compared"]
              else None
          )
          print("FIVE_PROJECT_METRICS=" + json.dumps(metrics, sort_keys=True))
          Path("/tmp/five-project-metrics.json").write_text(json.dumps(metrics, indent=2))
          if len(reports) != 5:
              raise SystemExit("did not receive all five project reports")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: five-project-aggregate
          path: /tmp/five-project-metrics.json
          retention-days: 7
