name: DIAG GPT2 Freezer Fast Proof 1989

on:
  push:
    branches:
      - diag/gpt2-freezer-fast-proof-1989

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Prove page11 wall scope and Freezer
        shell: bash
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_live_canonical_wall_composition import compose_live_canonical_walls
          from pb_live_canonical_room_composition import compose_live_canonical_rooms
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateSelector

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          payload=path.read_bytes()
          source=SourceVisibilityProducer(
              producer_method="diag-gpt2-freezer-fast-proof-1989",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="diag-gpt2-freezer-fast-proof-1989",
              source_bytes=payload,
              source_locator="memory://maryborough.pdf",
              page_ids=("11",),
          )
          wall_opening=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("11",),
              evidence_page_ids=(),
          )
          walls=compose_live_canonical_walls(
              source_visibility_producer=source,
              wall_opening_composition=wall_opening,
          )
          rooms=compose_live_canonical_rooms(
              source_visibility_producer=source,
              wall_opening_composition=wall_opening,
              canonical_wall_ids_by_candidate=walls.candidate_to_canonical_wall_id,
              unresolved_wall_candidate_ids=walls.unresolved_wall_candidate_ids,
          )
          current=source.published_snapshot_for_revision(published.revision.revision_id)
          wall_scope=wall_opening.physical_wall_authority.resolve_scope(
              PhysicalWallCandidateSelector(
                  document_id=current.revision.document_id,
                  revision_id=current.revision.revision_id,
                  source_sha256=current.revision.source_sha256,
                  snapshot_id=current.snapshot.snapshot_id,
                  page_id="11",
                  decision_scope_id="wall-source:page-11",
              )
          )
          def status(v): return getattr(v,"value",str(v))
          def norm(v): return " ".join(str(v or "").strip().upper().split())
          labelled=[
              {
                  "label":norm(r.room_label),
                  "page_id":r.page_id,
                  "source_room_face_record_id":r.source_room_face_record_id,
                  "vertex_count":len(r.polygon_pdf_pts),
                  "area_page_pts2":r.area_page_pts2,
                  "geometry_complete":bool(r.geometry_complete),
              }
              for r in rooms.rooms
              if r.geometry_complete and norm(r.room_label)
          ]
          freezer=[r for r in labelled if r["label"]=="FREEZER"]
          out={
              "wall_scope_status":status(wall_scope.status),
              "wall_scope_complete":bool(wall_scope.scope_complete),
              "wall_scope_reason_codes":list(wall_scope.reason_codes),
              "wall_scope_record_count":len(wall_scope.records),
              "wall_opening_status":status(wall_opening.status),
              "wall_opening_reason_codes":list(wall_opening.reason_codes),
              "canonical_room_status":status(rooms.status),
              "canonical_room_reason_codes":list(rooms.reason_codes),
              "canonical_room_count":len(rooms.rooms),
              "labelled_room_count":len(labelled),
              "freezer":freezer,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          assert wall_scope.scope_complete is True, out
          assert "physical_wall_candidate_scope_cropped_at_viewport_boundary" not in wall_scope.reason_codes, out
          assert "physical_wall_candidate_scope_bounds_unresolved" not in wall_scope.reason_codes, out
          assert len(freezer)==1, out
          assert freezer[0]["geometry_complete"] is True, out
          assert freezer[0]["vertex_count"] == 6, out
          assert abs(float(freezer[0]["area_page_pts2"]) - 3666.592524411564) < 1e-6, out
          PY
