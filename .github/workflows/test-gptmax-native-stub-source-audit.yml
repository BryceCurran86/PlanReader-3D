name: GPT MAX Original Native Interior Stub Source Audit
on:
  pull_request:
    paths:
      - scripts/gptmax_native_stub_source_audit.py
      - docs/engineering/gptmax_native_stub_source_audit.md
      - docs/engineering/gptmax_native_stub_source_checkpoint_20261012.json
      - .github/workflows/test-gptmax-native-stub-source-audit.yml
concurrency:
  group: gptmax-native-stub-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Read the immutable proposed producer function
        run: git fetch --no-tags origin af58690c6b664a329ef24452414ded2240a616e8
      - name: Reauthenticate original source geometry and literal paint without promotion
        run: |
          ruff check --select F821,F823 scripts/gptmax_native_stub_source_audit.py
          PYTHONPATH=. python -u scripts/gptmax_native_stub_source_audit.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --baseline-ref 46be9c4995fc2e9590a70e04205914b72222fe2a \
            --candidate-ref af58690c6b664a329ef24452414ded2240a616e8 \
            --output original-native-stub-source-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('original-native-stub-source-audit.json').read_bytes())
          assert r['original_source_observations_reauthenticated'] is True
          assert r['original_source_snapshot_unchanged'] is True
          assert r['current_main_strong_discovery_matches_archived_baseline'] is True
          assert 0 < r['input_source_count'] <= r['independently_authenticated_ordinary_source_count'] <= r['source_primitive_safety_cap'] == 20000
          assert r['audit_stage'] == 'isolated_native_only_low_level_nomination_not_production_closure'
          for k in ('solid_structural_wall_role_proven','original_source_parity_gate_passed',
                    'source_candidate_universe_complete','physical_nonexistence_proven',
                    'host_publication_allowed','metric_quantity_publication_allowed',
                    'opening_count_publication_allowed'):
              assert r[k] is False
          assert r['benchmark_accuracy'] is None
          for row in r['removed_strong_rows']:
              assert row['removal_is_source_authority_approved'] is False
              assert row['host_publication_allowed'] is False
              for witness in row['interior_source_witnesses']:
                  assert witness['original_source_geometry_reauthenticated'] is True
                  assert witness['positive_stroked_wall_ink_proven'] is False
                  assert witness['solid_structural_wall_role_proven'] is False
                  assert witness['physical_nonexistence_proven'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-native-stub-source-audit
          retention-days: 30
          path: original-native-stub-source-audit.json
