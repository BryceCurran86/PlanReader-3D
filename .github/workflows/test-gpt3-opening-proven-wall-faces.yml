name: TEST GPT3 Opening-Proven Wall Faces

on:
  pull_request:
    branches:
      - main

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused wall/opening regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_physical_wall_candidate_drafting_motif_filter.py             tests/test_physical_wall_candidate_authority_scope_v1.py             tests/test_opening_host_binding_authority_v1.py
      - name: Run real Lot16 W4 face coverage
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_w4_face_coverage.py             | tee lot16-w4-face-coverage.json
      - name: Upload Lot16 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-opening-proven-wall-face-lot16
          path: lot16-w4-face-coverage.json
          retention-days: 3
