name: TEST GPT3 Two Face Lineage Host

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run host-binding regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_opening_host_binding_review_hardening_v3.py \
            tests/test_opening_host_binding_cross_role_same_v3.py \
            tests/test_opening_host_binding_equivalence_source_integration_v3.py
