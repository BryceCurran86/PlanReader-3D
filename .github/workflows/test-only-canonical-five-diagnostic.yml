name: TEST-ONLY Canonical Five Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  canonical-five:
    if: startsWith(github.head_ref, 'diag/canonical-five-after-live-ceiling')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify five pinned public tender PDFs
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources diagnostic_results
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          benchmark_ids = (
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          )
          root = Path("benchmarks/public_tenders")
          out = Path("benchmarks/sources")

          for benchmark_id in benchmark_ids:
              manifest = json.loads(
                  (root / benchmark_id / "download_manifest.json").read_text(encoding="utf-8")
              )
              url = str(manifest["source_url"])
              docs = manifest.get("documents") or []
              drawing = next(
                  doc for doc in docs
                  if doc.get("role") in {"architectural_drawings", "drawings", "tender_drawings"}
              )
              filename = str(drawing["filename"])
              expected_sha = str(drawing["sha256"]).lower()
              target = out / filename

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 PlanReader canonical benchmark diagnostic",
                      "Accept": "application/pdf,*/*;q=0.8",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read()

              actual_sha = hashlib.sha256(payload).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"{benchmark_id}: sha256 mismatch expected={expected_sha} actual={actual_sha}"
                  )
              target.write_bytes(payload)
              print(
                  f"{benchmark_id}: verified {filename} "
                  f"sha256={actual_sha} bytes={len(payload)}"
              )
          PY

      - name: Run unchanged canonical evaluator on trusted five
        env:
          EVALUATED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine

          benchmark_ids = (
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          )
          engine = BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="diagnostic_results/project_reports",
          )

          projects = []
          total_accepted = 0
          total_exact = 0
          total_denominator = 0
          for benchmark_id in benchmark_ids:
              report = engine.evaluate_benchmark(
                  benchmark_id=benchmark_id,
                  auto_extract=True,
              )
              if not report.is_scored:
                  raise SystemExit(
                      f"{benchmark_id}: evaluator did not produce a scored report: "
                      f"status={report.status} errors={report.errors}"
                  )
              accepted = int(report.exact_matches + report.within_5_percent)
              denominator = int(report.total_items_compared)
              total_accepted += accepted
              total_exact += int(report.exact_matches)
              total_denominator += denominator
              projects.append(
                  {
                      "benchmark_id": benchmark_id,
                      "accepted": accepted,
                      "denominator": denominator,
                      "accuracy_percentage": report.overall_accuracy_percentage,
                      "strict_exact_percentage": report.strict_exact_accuracy_percentage,
                      "exact_matches": report.exact_matches,
                      "within_5_percent": report.within_5_percent,
                      "within_10_percent": report.within_10_percent,
                      "within_20_percent": report.within_20_percent,
                      "gross_mismatches": report.gross_mismatches,
                      "missed_items": report.missed_items,
                      "hallucinated_items": report.hallucinated_items,
                  }
              )
              engine.save_report(
                  report,
                  output_dir="diagnostic_results/project_reports",
              )
              print(
                  f"{benchmark_id}: {accepted}/{denominator} "
                  f"accuracy={report.overall_accuracy_percentage}% "
                  f"exact={report.strict_exact_accuracy_percentage}%"
              )

          if total_denominator <= 0:
              raise SystemExit("canonical five denominator is empty")

          summary = {
              "evaluated_commit_sha": os.environ.get("EVALUATED_COMMIT_SHA", ""),
              "total_accepted": total_accepted,
              "total_denominator": total_denominator,
              "accuracy_percentage": round(total_accepted / total_denominator * 100.0, 2),
              "strict_exact_count": total_exact,
              "strict_exact_percentage": round(total_exact / total_denominator * 100.0, 2),
              "projects": projects,
          }
          Path("diagnostic_results/canonical_five_summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-five-after-live-ceiling
          path: diagnostic_results/
          if-no-files-found: warn
