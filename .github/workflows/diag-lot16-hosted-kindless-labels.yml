name: DIAG Lot16 Hosted Kindless Labels

on:
  pull_request:
    branches:
      - gpt4/raster-registration-detector-integration

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Inspect hosted kindless opening labels
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_hosted_kindless_labels.py | tee lot16-hosted-kindless-labels.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-hosted-kindless-labels
          path: lot16-hosted-kindless-labels.json
          retention-days: 1
