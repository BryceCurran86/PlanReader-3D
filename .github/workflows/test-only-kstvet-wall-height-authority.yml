name: TEST-ONLY KSTVET Wall Height Authority

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-wall-height:
    if: startsWith(github.head_ref, 'diag/kstvet-wall-height-authority')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Probe page 54 source-owned wall-height evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          import fitz

          from pb_figured_dimension_evidence import (
              bind_observation_to_vector_geometry,
              calibrate_dimension_layout,
              extract_native_dimension_observations,
              extract_vector_segments,
          )
          from pb_level_datum_extraction import find_level_markers
          from pb_viewport_segmentation import extract_view_title_anchors, segment_page_viewports
          from pb_drawing_ocr_evidence_layer import DrawingOCREngine

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-wall-height/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(actual)
          source=Path("/tmp/kstvet.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          try:
              page=doc[53]
              txt=page.get_text("text") or ""
              markers=find_level_markers(txt,source_page=54)
              cal=calibrate_dimension_layout(page)
              segments=extract_vector_segments(page,page_num=54)
              obs=extract_native_dimension_observations(page,page_num=54)
              bound=[]
              for o in obs:
                  b=bind_observation_to_vector_geometry(o,segments,cal)
                  value_m=float(o.value)/1000.0 if str(o.unit).lower()=="mm" else float(o.value)
                  if 1.5 <= value_m <= 5.0:
                      cx=((o.bbox[0]+o.bbox[2])/2.0) if o.bbox else None
                      cy=((o.bbox[1]+o.bbox[3])/2.0) if o.bbox else None
                      nearby=[]
                      if o.bbox:
                          for w in page.get_text("words") or []:
                              wx=(float(w[0])+float(w[2]))/2.0
                              wy=(float(w[1])+float(w[3]))/2.0
                              if abs(wx-cx)<=180 and abs(wy-cy)<=80:
                                  nearby.append({"text":str(w[4]),"bbox":[float(w[0]),float(w[1]),float(w[2]),float(w[3])]})
                      bound.append({
                          "id":o.dimension_id,
                          "raw":o.raw_text,
                          "value_m":value_m,
                          "bbox":o.bbox,
                          "orientation":o.orientation,
                          "binding_status":b.status,
                          "dimension_line_id":b.dimension_line_id,
                          "witness_line_ids":list(b.witness_line_ids),
                          "nearby_words":nearby[:80],
                      })

              ocr=DrawingOCREngine()
              ocr_rows=ocr.recognize_page_rect(page,dpi=320)
              height_lines=[]
              for row in ocr_rows:
                  t=str(row.get("text") or "").strip()
                  nums=[int(x) for x in re.findall(r"(?<!\d)([1-5]\d{3})(?!\d)",t.replace(",",""))]
                  if nums or re.search(r"(?i)(roof|ground|floor|elevation|height|level)",t):
                      height_lines.append({
                          "text":t,
                          "numbers_mm":nums,
                          "bbox":row.get("bounding_box"),
                          "confidence":row.get("confidence"),
                      })

              print("KSTVET_WALL_HEIGHT_AUTHORITY="+json.dumps({
                  "source_sha256":actual,
                  "production_sha":"65bbdb077333e376e2c0ee0cb6dd002afa28197c",
                  "level_markers":[m.__dict__ for m in markers],
                  "candidate_dimensions":bound,
                  "anchors":[{"text":a.text,"bbox":a.bbox,"view_type":a.view_type} for a in extract_view_title_anchors(page)],
                  "viewports":[v.__dict__ for v in segment_page_viewports(page,page_number=54)],
                  "ocr_height_lines":height_lines[:220],
              },sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          PY
