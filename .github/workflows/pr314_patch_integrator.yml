name: PR314 Patch Integrator

on:
  push:
    branches:
      - chatgpt/c15-native-text-tokenization-v1
    paths:
      - .github/workflows/pr314_patch_integrator.yml

permissions:
  contents: write

jobs:
  apply-guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c15-native-text-tokenization-v1
          fetch-depth: 0

      - name: Apply exact fixture evidence integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pb_planreader_pdf_extractor.py")
          text = path.read_text(encoding="utf-8")
          old = '''            standalone_bb = self._standalone_chalkboard_label_count(page_text)
'''
          new = '''            line_standalone_bb = self._standalone_chalkboard_label_count(page_text)
            native_standalone_bb = 0
            try:
                from pb_native_fixture_label_evidence import count_standalone_chalkboard_spans

                native_standalone_bb = count_standalone_chalkboard_spans(
                    page.get_text("dict")
                )
            except Exception:
                native_standalone_bb = 0
            standalone_bb = max(line_standalone_bb, native_standalone_bb)
'''
          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(
                  f"guard failed: expected exactly one fixture integration target, found {occurrences}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m py_compile pb_planreader_pdf_extractor.py pb_native_fixture_label_evidence.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb_planreader_pdf_extractor.py
          git rm .github/workflows/pr314_patch_integrator.yml
          git commit -m "Integrate native fixture-label evidence"
          git push origin HEAD:chatgpt/c15-native-text-tokenization-v1
