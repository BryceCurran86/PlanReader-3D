name: TEST-ONLY KSTVET Source Net Wall Composition

on:
  pull_request:
    branches: [main]

jobs:
  source-net-wall:
    if: startsWith(github.head_ref, 'diag/kstvet-window-spatial-binding-post-763')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Compose source-owned external net wall publication
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request

          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_live_physical_opening_void_composition import compose_live_physical_opening_voids
          from pb_live_gross_wall_geometry_composition import compose_live_gross_wall_geometry
          from pb_live_whole_wall_role_composition import compose_live_whole_wall_roles
          from pb_live_external_physical_net_wall_publication import compose_live_external_physical_net_wall_publication

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected_sha="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-source-net-wall/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")

          source=SourceVisibilityProducer(
              producer_method="kstvet-source-net-wall-diagnostic",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-cbc-classroom",
              source_bytes=payload,
              source_locator=url,
          )
          revision_id=published.revision.revision_id

          def trace_rows(value):
              rows=[]
              for t in tuple(getattr(value,"traces",()) or ()):
                  rows.append({
                      k:getattr(t,k,None) for k in (
                          "physical_wall_id","opening_identity_id","page_id",
                          "decision_scope_id","status","reason_codes",
                          "gross_area_m2","net_area_m2","gross_status",
                          "gross_reason_codes","void_status","void_reason_codes",
                          "height_status","height_reason_codes","role","role_status"
                      )
                  })
              return rows

          try:
              wall_opening=compose_live_wall_opening_authority(
                  source_visibility_producer=source,
                  revision_id=revision_id,
                  page_ids=("54","55"),
              )
              physical_void=compose_live_physical_opening_voids(
                  source_visibility_producer=source,
                  wall_opening_composition=wall_opening,
              )
              gross=compose_live_gross_wall_geometry(
                  source_visibility_producer=source,
                  wall_opening_composition=wall_opening,
                  physical_void_composition=physical_void,
              )
              roles=compose_live_whole_wall_roles(
                  gross_wall_composition=gross,
              )
              external=compose_live_external_physical_net_wall_publication(
                  wall_opening_composition=wall_opening,
                  physical_void_composition=physical_void,
                  gross_wall_composition=gross,
                  whole_wall_role_composition=roles,
              )
              qe=getattr(external,"quantity_evidence",None)
              out={
                  "source_sha256":actual,
                  "revision_id":revision_id,
                  "wall_opening":{
                      "status":str(wall_opening.status),
                      "reason_codes":list(wall_opening.reason_codes),
                      "traces":trace_rows(wall_opening),
                      "opening_bindings":[str(x) for x in tuple(getattr(wall_opening,"opening_bindings",()) or ())],
                  },
                  "physical_void":{
                      "status":str(physical_void.status),
                      "reason_codes":list(physical_void.reason_codes),
                      "traces":trace_rows(physical_void),
                  },
                  "gross":{
                      "status":str(gross.status),
                      "reason_codes":list(gross.reason_codes),
                      "traces":trace_rows(gross),
                  },
                  "roles":{
                      "status":str(roles.status),
                      "reason_codes":list(roles.reason_codes),
                      "traces":trace_rows(roles),
                  },
                  "external":{
                      "status":str(external.status),
                      "reason_codes":list(external.reason_codes),
                      "external_wall_ids":list(external.external_wall_ids),
                      "value":getattr(qe,"value",None),
                      "unit":getattr(qe,"unit",None),
                      "formula":getattr(qe,"formula",None),
                  },
              }
          except Exception as exc:
              out={
                  "source_sha256":actual,
                  "revision_id":revision_id,
                  "exception":repr(exc),
              }
          print("KSTVET_SOURCE_NET_WALL_COMPOSITION="+json.dumps(out,sort_keys=True,default=str),flush=True)
          PY
