name: DIAG Murera slab source — DO NOT MERGE

on:
  pull_request:
    branches: [main]

jobs:
  murera-slab-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify Murera source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf" \
            -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf" | sha256sum -c -

      - name: Print Murera slab/DPM/mesh evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          path = Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          extractor = GenericPlanReaderExtractor()
          predictions = extractor.extract_from_pdf(path, collect_item35_shadow=False)

          target_terms = (
              "floor", "slab", "bed", "dpm", "damp", "mesh",
              "hardcore", "murram", "screed", "surface",
          )
          print("=== TARGET PREDICTIONS ===")
          for pred in sorted(predictions, key=lambda item: item.tag):
              tag = str(pred.tag or "")
              desc = str(pred.description or "")
              if any(term in (tag + " " + desc).lower() for term in target_terms):
                  print(json.dumps(pred.to_dict(), sort_keys=True, default=str))

          print("=== ALL TAGS ===")
          print(json.dumps(sorted(str(pred.tag) for pred in predictions), indent=2))

          print("=== EXTRACTION STATUS ===")
          print(json.dumps(extractor.extraction_status, indent=2, sort_keys=True, default=str))

          print("=== DRAWING PAGE TEXT HINTS ===")
          doc = fitz.open(path)
          for index in range(doc.page_count):
              page = doc.load_page(index)
              text = page.get_text("text") or ""
              lower = text.lower()
              if any(term in lower for term in ("surface bed", "polythene", "a142", "mesh", "floor plan", "slab", "hardcore")):
                  print(f"--- page {index + 1} ---")
                  lines = [line.strip() for line in text.splitlines() if line.strip()]
                  for line in lines[:120]:
                      if any(term in line.lower() for term in ("surface", "polythene", "a142", "mesh", "floor", "slab", "hardcore", "dimension", "plan")):
                          print(line)
          doc.close()
          PY

      - name: Locate Murera plan and envelope evidence across source
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import fitz
          from pb_viewport_segmentation import segment_page_viewports

          path = Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          doc = fitz.open(path)
          needles = (
              "ground floor plan", "floor plan", "veranda", "verandah",
              "18200", "18,200", "18.200", "8201", "8,201", "8.201",
          )
          for idx in range(doc.page_count):
              page = doc.load_page(idx)
              text = page.get_text("text") or ""
              compact = re.sub(r"\s+", " ", text.lower())
              hits = [needle for needle in needles if needle in compact]
              if not hits:
                  continue
              print(f"=== PAGE {idx+1} HITS {hits} ===")
              print("VIEWPORTS", [
                  {
                      "id": v.view_id,
                      "status": v.status,
                      "type": v.view_type,
                      "bbox": v.bounding_box,
                  }
                  for v in segment_page_viewports(page, page_number=idx+1)
              ])
              lines=[line.strip() for line in text.splitlines() if line.strip()]
              for line in lines:
                  low=line.lower()
                  if any(
                      token in low
                      for token in ("floor plan","veranda","verandah","18200","18,200","8201","8,201")
                  ):
                      print(line)
          doc.close()
          PY

      - name: Trace Murera secondary-footprint evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import fitz

          from pb_drawing_evidence_binding import DrawingViewType
          from pb_figured_dimension_evidence import extract_dimension_evidence_bundle
          from pb_secondary_footprint_evidence import resolve_secondary_footprint_width_m
          from pb_viewport_segmentation import segment_page_viewports

          path = Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          doc = fitz.open(path)
          page_no = 219
          page = doc.load_page(page_no - 1)

          print("=== SECONDARY FOOTPRINT RESOLUTION ===")
          print(resolve_secondary_footprint_width_m(page, page_num=page_no))

          print("=== VIEWPORTS ===")
          viewports = segment_page_viewports(page, page_number=page_no)
          for viewport in viewports:
              print({
                  "view_id": viewport.view_id,
                  "status": viewport.status,
                  "view_type": viewport.view_type,
                  "bbox": viewport.bounding_box,
              })

          print("=== VERANDAH / NEARBY WORDS ===")
          words = page.get_text("words") or []
          verandah_words = [w for w in words if "verand" in str(w[4]).lower()]
          for vw in verandah_words:
              print("LABEL", tuple(vw[:5]))
              cx=(float(vw[0])+float(vw[2]))/2
              cy=(float(vw[1])+float(vw[3]))/2
              nearby=[]
              for w in words:
                  wcx=(float(w[0])+float(w[2]))/2
                  wcy=(float(w[1])+float(w[3]))/2
                  if abs(wcx-cx) <= 180 and abs(wcy-cy) <= 180:
                      nearby.append(tuple(w[:5]))
              print("NEARBY", nearby)

          print("=== DIMENSION EVIDENCE ===")
          for viewport in viewports:
              if viewport.view_type != DrawingViewType.FLOOR_PLAN.value:
                  continue
              bundle = extract_dimension_evidence_bundle(
                  page,
                  page_num=page_no,
                  view_id=viewport.view_id,
                  view_type=viewport.view_type,
              )
              binding_by_id = {b.observation_id: b.status for b in bundle.bindings}
              for observation in bundle.observations:
                  print(json.dumps({
                      "dimension_id": observation.dimension_id,
                      "value_m": observation.value_m,
                      "orientation": observation.orientation,
                      "bbox": observation.bbox,
                      "endpoints": observation.endpoints,
                      "binding": binding_by_id.get(observation.dimension_id),
                  }, default=str, sort_keys=True))
          doc.close()
          PY

      - name: Render Murera E-01 and adjacent drawing sheets
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz

          src = Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          out = Path("murera_diag_pages")
          out.mkdir(exist_ok=True)
          doc = fitz.open(src)
          for page_no in (219, 220, 221, 225, 227):
              if not (1 <= page_no <= doc.page_count):
                  continue
              page = doc.load_page(page_no - 1)
              pix = page.get_pixmap(matrix=fitz.Matrix(2.0, 2.0), alpha=False)
              pix.save(out / f"page-{page_no}.png")
              (out / f"page-{page_no}.txt").write_text(
                  page.get_text("text") or "", encoding="utf-8"
              )
          doc.close()
          PY

      - name: Upload Murera diagnostic pages
        uses: actions/upload-artifact@v4
        with:
          name: murera-diagnostic-pages
          path: murera_diag_pages/
          if-no-files-found: error
