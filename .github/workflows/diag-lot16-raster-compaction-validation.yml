name: DIAG Lot16 Raster Compaction Validation

on:
  pull_request:
    branches:
      - gpt4/raster-primitive-compaction-v1

jobs:
  raster-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused raster regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_raster_opening_primitive_compaction.py             tests/test_raster_opening_source_primitives.py             tests/test_raster_framed_opening_g17_contract.py
      - name: Validate exact Lot16 pages 12 and 3
        run: |
          PYTHONPATH=. python tools/diag_lot16_raster_compaction_validation.py | tee lot16-raster-compaction-validation.json
      - name: Upload page validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-raster-compaction-validation
          path: lot16-raster-compaction-validation.json
          retention-days: 1

  source-closed-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact Lot16 source-closed all-family handoff
        run: |
          mkdir -p /tmp/lot16-handoff
          PYTHONPATH=. python tools/run_source_closed_project_handoff.py             --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf"             --project-id au_qld_lot16_power             --workspace-id 1             --family-group all             --output-dir /tmp/lot16-handoff             | tee lot16-source-closed-handoff.json
      - name: Require primitive-bound blocker to be gone
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("lot16-source-closed-handoff.json")
          data = json.loads(p.read_text())
          message = str(data.get("production_error_message") or "")
          print(json.dumps({
              "status": data.get("status"),
              "topology_pages": data.get("topology_pages"),
              "execution_pages": data.get("execution_pages"),
              "production_error_type": data.get("production_error_type"),
              "production_error_message": message,
              "family_counts": data.get("family_counts"),
          }, indent=2, sort_keys=True))
          if "raster opening primitive count exceeds safety bound" in message:
              raise SystemExit("primitive safety-bound blocker still present")
          PY
      - name: Upload handoff summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-source-closed-handoff-after-raster-compaction
          path: lot16-source-closed-handoff.json
          retention-days: 1
