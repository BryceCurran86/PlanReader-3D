name: GPT MAX Original Exact Source Fragment Bundles
on:
  pull_request:
    paths:
      - scripts/gptmax_exact_source_fragment_bundles.py
      - tests/test_gptmax_exact_source_fragment_bundles.py
      - docs/engineering/gptmax_exact_source_fragment_bundles.md
      - docs/engineering/gptmax_exact_source_fragment_bundles_checkpoint_20261012.json
      - .github/workflows/test-gptmax-exact-source-fragment-bundles.yml
concurrency:
  group: gptmax-fragment-bundles-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_exact_source_fragment_bundles.py
          ruff check --select F821,F823 scripts/gptmax_exact_source_fragment_bundles.py tests/test_gptmax_exact_source_fragment_bundles.py
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Replay immutable original source and preserve graph and production
        run: |
          PYTHONPATH=. python -u scripts/gptmax_exact_source_fragment_bundles.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output original-exact-source-fragment-bundles.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('original-exact-source-fragment-bundles.json').read_bytes())
          assert report['original_source_reauthenticated'] is True
          assert report['default_production_state_unchanged'] is True
          assert report['exact_candidate_abstention_partition_verified'] is True
          assert report['source_primitive_safety_cap'] == 20000
          assert 0 < report['input_source_count'] <= report['source_primitive_safety_cap']
          bundles = report['actual_assembly_records']
          assert len({b['record_id'] for b in bundles}) == len(bundles)
          assert len(report['source_span_rows']) == report['input_source_count']
          for key in ('source_authenticated_by_join_alone', 'combined_graph_edge_created',
                      'physical_equivalence_proven', 'structural_wall_role_proven',
                      'host_publication_allowed', 'opening_count_publication_allowed',
                      'metric_quantity_publication_allowed'):
              assert report[key] is False
          assert report['benchmark_accuracy'] is None
          for bundle in bundles:
              assert bundle['structural_wall_role_proven'] is False
              assert bundle['host_publication_allowed'] is False
              if bundle['parentless_fragment_ids']:
                  assert bundle['status'] == 'abstained'
                  assert bundle['all_fragment_source_parents_available'] is False
          for span in report['source_span_rows']:
              assert span['host_publication_allowed'] is False
              if span['exact_source_span_coverage'] is not None:
                  assert span['exact_source_span_coverage']['combined_graph_edge_created'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-exact-source-fragment-bundles
          retention-days: 30
          path: original-exact-source-fragment-bundles.json
