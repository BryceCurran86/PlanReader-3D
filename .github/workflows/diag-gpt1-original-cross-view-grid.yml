name: GPT1 Original Cross-View Plan Grid Source Controls

# Original source must never be provisioned to PR-controlled code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-grid-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact head identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned deps
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original frozen benchmark integrity and adversarial source tests
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python -m pytest -q tests/test_gpt1_source_grid_registration_shadow.py
      - name: Build sealed offline diagnostic image BEFORE original provisioning
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$RUNNER_TEMP/gpt1-crossview-deps"
          dockerfile="$RUNNER_TEMP/gpt1-crossview.Dockerfile"
          mkdir -p "$deps_dir"
          cp -- requirements.txt requirements-ci-v1228.txt "$deps_dir/"
          cat > "$dockerfile" <<'DOCKER'
          FROM python:3.13-slim
          WORKDIR /workspace
          RUN apt-get update && apt-get install -y --no-install-recommends tesseract-ocr && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt requirements-ci-v1228.txt /deps/
          RUN python -m pip install --no-cache-dir -r /deps/requirements.txt -r /deps/requirements-ci-v1228.txt
          DOCKER
          docker build --quiet -f "$dockerfile" -t gpt1-crossview-offline:3.13 "$deps_dir"
      - name: Provision SHA-pinned original AFTER image build
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: |
            Arch_Combined_Maryborough_Service_Station.pdf
          allow-missing: "false"
      - name: Original two authentic plan pages source geometry
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/gpt1-original-cross-view-grid
          mkdir -p "$OUT"
          PRIVATE_OUT="$(mktemp -d "${RUNNER_TEMP}/gpt1-original-grid-XXXXXX")"
          export PRIVATE_OUT
          trap 'rm -rf "$PRIVATE_OUT"' EXIT
          git rev-parse HEAD > "$OUT/producer_head_sha.txt"
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          # Original-derived coordinates, text and tool exceptions are private.
          # A failure reports a constant message, never raw source output.
          if ! timeout 600s docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 \
              --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=512m \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
              --mount "type=bind,src=$PRIVATE_OUT,dst=/private-output" \
              --workdir /workspace -e HOME=/tmp -e XDG_CACHE_HOME=/tmp \
              -e PYTHONPATH=/workspace -e PYTHONDONTWRITEBYTECODE=1 \
              -e ORT_DISABLE_TELEMETRY=1 \
              gpt1-crossview-offline:3.13 \
              python -u -m tools.diag_gpt1_original_cross_view_grid \
            --pdf "$PDF" --sha256 "$SHA" --first-page 7 --second-page 11 \
            --output /private-output/native_grid_candidate.json > /dev/null 2>&1; then
            echo "ORIGINAL_GRID_PRIVATE_DIAGNOSTIC_FAILED" >&2
            exit 1
          fi
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads((Path(os.environ["PRIVATE_OUT"])/"native_grid_candidate.json").read_text())
          assert data["original_source_sha256"]=="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          assert data["source_pages_1_based"]==[7,11]
          assert data["diagnostic_only"] is True
          for key in ("source_grid_line_witness_verified","source_word_raster_corroborated",
                      "source_plan_viewport_owned","cross_view_physical_room_equivalence_verified",
                      "source_finish_occurrence_owned","source_floor_area_quantity_created",
                      "commercial_projection_allowed"):
              assert data[key] is False, key
          assert data["source_native_text_grid_candidate"] is True
          assert data["letter_grid_control_count"]>=3
          assert data["number_grid_control_count"]>=4
          assert data["source_native_vector_grid_candidate"] is True
          assert len(data["native_vector_grid_letter_lineage"])>=3
          assert len(data["native_vector_grid_number_lineage"])>=4
          assert data["first_unclosed_gate"]=="source_grid_producer_and_room_physical_equivalence_unverified"
          assert len(data["native_vector_grid_translation_candidate_pdf_pts"])==2
          for row in data["native_vector_grid_letter_lineage"]+data["native_vector_grid_number_lineage"]:
              assert len(row["first_original_path_item_addresses"])>=12
              assert len(row["second_original_path_item_addresses"])>=12
          receipt={
              "schema_version":"1.0.0",
              "producer_head_sha":Path("artifacts/gpt1-original-cross-view-grid/producer_head_sha.txt").read_text().strip(),
              "source_sha_verified":True,
              "original_source_checks_passed":True,
              "diagnostic_only":True,
              "physical_correspondence_granted":False,
              "floor_finish_quantity_issued":False,
              "commercial_projection_allowed":False,
          }
          Path("artifacts/gpt1-original-cross-view-grid/receipt.json").write_text(
              json.dumps(receipt,sort_keys=True)+"\n"
          )
          print("ORIGINAL_GRID_SOURCE_VALIDATED_CANDIDATE_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpt1-original-cross-view-grid-source-neutral-receipt
          path: artifacts/gpt1-original-cross-view-grid/receipt.json
          retention-days: 14
      - name: Remove private original and unpublished diagnostic data
        if: always()
        shell: bash
        run: |
          rm -rf -- documents/sources "$RUNNER_TEMP/gpt1-crossview-deps"
          rm -f -- "$RUNNER_TEMP/gpt1-crossview.Dockerfile"

  original-room-mark-registration:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact producer head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original source toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Build sealed offline diagnostic image BEFORE original provisioning
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$RUNNER_TEMP/gpt1-crossview-deps"
          dockerfile="$RUNNER_TEMP/gpt1-crossview.Dockerfile"
          mkdir -p "$deps_dir"
          cp -- requirements.txt requirements-ci-v1228.txt "$deps_dir/"
          cat > "$dockerfile" <<'DOCKER'
          FROM python:3.13-slim
          WORKDIR /workspace
          RUN apt-get update && apt-get install -y --no-install-recommends tesseract-ocr && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt requirements-ci-v1228.txt /deps/
          RUN python -m pip install --no-cache-dir -r /deps/requirements.txt -r /deps/requirements-ci-v1228.txt
          DOCKER
          docker build --quiet -f "$dockerfile" -t gpt1-crossview-offline:3.13 "$deps_dir"
      - name: Provision SHA-pinned original AFTER image build
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: |
            Arch_Combined_Maryborough_Service_Station.pdf
          allow-missing: "false"
      - name: Original SHA->native grid->actual W4 source room->FT3 mark geometry
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/gpt1-original-crossview-room-mark
          mkdir -p "$OUT"
          PRIVATE_OUT="$(mktemp -d "${RUNNER_TEMP}/gpt1-original-room-mark-XXXXXX")"
          export PRIVATE_OUT
          trap 'rm -rf "$PRIVATE_OUT"' EXIT
          git rev-parse HEAD > "$OUT/head.txt"
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          # Retain source geometry only in private runner temp; never in logs.
          if ! timeout 3500s docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 \
              --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=512m \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
              --mount "type=bind,src=$PRIVATE_OUT,dst=/private-output" \
              --workdir /workspace -e HOME=/tmp -e XDG_CACHE_HOME=/tmp \
              -e PYTHONPATH=/workspace -e PYTHONDONTWRITEBYTECODE=1 \
              -e ORT_DISABLE_TELEMETRY=1 \
              gpt1-crossview-offline:3.13 \
              python -u -m tools.diag_gpt1_source_grid_room_mark_candidates \
            --pdf "$PDF" --sha256 "$SHA" --room-page 7 --material-page 11 \
            --code FT3 --output /private-output/original_room_mark_registration.json \
            > /dev/null 2>&1; then
            echo "ORIGINAL_ROOM_MARK_PRIVATE_DIAGNOSTIC_FAILED" >&2
            exit 1
          fi
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads((Path(os.environ["PRIVATE_OUT"])/"original_room_mark_registration.json").read_text())
          assert r["source_sha256"]=="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          assert r["diagnostic_only"] is True
          assert r["original_grid_native_vector_candidate"] is True
          assert r["material_code"]=="FT3"
          assert len(r["native_material_marks"])==6
          assert len(r["source_room_candidates"])>0
          assert r["physical_room_crossview_equivalence_proven"] is False
          assert r["material_occurrence_source_trusted"] is False
          assert r["page_material_role_proven"] is False
          assert r["original_room_wall_equivalence_proven"] is False
          assert r["published_floor_finish_quantities"]==0
          assert r["commercial_projection_allowed"] is False
          assert all(
              not x["material_occurrence_owned"]
              and not x["crossview_structural_wall_equivalence_proven"]
              and not x["customer_quantity_issued"]
              for x in r["source_region_geometric_candidates"]
          )
          receipt={
              "schema_version":"1.0.0",
              "producer_head_sha":Path("artifacts/gpt1-original-crossview-room-mark/head.txt").read_text().strip(),
              "source_sha_verified":True,
              "original_source_checks_passed":True,
              "diagnostic_only":True,
              "physical_room_crossview_equivalence_proven":False,
              "material_occurrence_source_trusted":False,
              "floor_finish_quantity_issued":False,
              "commercial_projection_allowed":False,
          }
          Path("artifacts/gpt1-original-crossview-room-mark/receipt.json").write_text(
              json.dumps(receipt,sort_keys=True)+"\n"
          )
          print("ORIGINAL_CROSSVIEW_ROOM_FT3_CANDIDATES_ONLY_NO_CONSTRUCTION_QUANTITY")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpt1-original-crossview-room-ft3-source-neutral-receipt
          path: artifacts/gpt1-original-crossview-room-mark/receipt.json
          retention-days: 14
      - name: Remove private original and unpublished diagnostic data
        if: always()
        shell: bash
        run: |
          rm -rf -- documents/sources "$RUNNER_TEMP/gpt1-crossview-deps"
          rm -f -- "$RUNNER_TEMP/gpt1-crossview.Dockerfile"
