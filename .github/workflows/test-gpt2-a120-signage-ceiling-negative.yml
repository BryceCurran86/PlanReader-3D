name: TEST GPT2 A120 Signage Cladding Not Ceiling

on:
  pull_request:
    paths:
      - pb_cross_view_ceiling_finish_authority.py
      - tests/test_gpt2_a120_signage_cladding_not_ceiling.py
      - .github/workflows/test-gpt2-a120-signage-ceiling-negative.yml
  workflow_dispatch:

jobs:
  original-cladding-not-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Private source owned-machine acceptance notice
        run: echo "Original PDF SHA-positive tests remain owner-machine-only; public CI runs the synthetic cases."
      - name: Run source cladding negative and consumer regression
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt2_a120_signage_cladding_not_ceiling.py tests/test_cross_view_ceiling_finish_authority.py -k 'not test_original_a120_cld3_schedule_signage_material_is_not_ceiling'
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
