name: TEST-ONLY Canonical Five Current Main 74b25fda

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-five-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74b25fda4a0e9bc1aafc14e259df32970589a19c
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-verify canonical five official sources
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources

          curl -L --fail --retry 3 -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

          curl -L --fail --retry 3 -o benchmarks/sources/1785347143869-bqs-drawings.pdf "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf" | sha256sum -c -

          curl -L --fail --retry 3 -o benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf "https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf"
          echo "c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf" | sha256sum -c -

          curl -L --fail --retry 3 -o benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf" | sha256sum -c -

          curl -L --fail --retry 3 -o benchmarks/sources/umma-university-hostels-builders-work.pdf "https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf"
          echo "f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  benchmarks/sources/umma-university-hostels-builders-work.pdf" | sha256sum -c -

      - name: Run unchanged canonical five benchmark
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical-five-results
          PYTHONUNBUFFERED=1 PYTHONPATH=. python -u pb_benchmark_accuracy_engine.py \
            --all \
            --require-local-sources \
            --output-dir /tmp/canonical-five-results \
            | tee /tmp/canonical-five-console.log

      - name: Validate complete 5-project / 60-item coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected_sha = "74b25fda4a0e9bc1aafc14e259df32970589a19c"
          path = Path("/tmp/canonical-five-results/headline_accuracy_dashboard.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["evaluated_commit_sha"] == expected_sha, (data["evaluated_commit_sha"], expected_sha)
          assert data["scoring_policy_identifier"] == "public_tender_exact_or_within_5pct_v1"

          metrics = data["headline_metrics"]
          coverage = data["summary_counts"]
          reports = data["headline_reports"]

          assert metrics["total_headline_benchmarks"] == 5
          assert coverage["headline_benchmarks"] == 5
          assert coverage["headline_coverage_complete"] is True
          assert coverage["incomplete_headline_benchmarks"] == 0
          assert coverage["incomplete_headline_benchmark_ids"] == []
          assert metrics["total_items_compared"] == 60

          expected_ids = {
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          }
          assert len(reports) == 5
          assert {r["benchmark_id"] for r in reports} == expected_ids

          for report in reports:
              assert report["status"] == "scored"
              assert report["is_scored"] is True
              assert report["is_headline_eligible"] is True
              assert report["errors"] == []

          for key in (
              "total_items_compared", "exact_matches", "within_5_percent",
              "within_10_percent", "within_20_percent", "gross_mismatches",
              "missed_items", "hallucinated_items",
          ):
              assert sum(r["summary"][key] for r in reports) == metrics[key]

          summary = {
              "production_sha": expected_sha,
              "accuracy": metrics["overall_accuracy_percentage"],
              "strict_exact": metrics["strict_exact_accuracy_percentage"],
              "compared": metrics["total_items_compared"],
              "exact": metrics["exact_matches"],
              "within_5": metrics["within_5_percent"],
              "within_10": metrics["within_10_percent"],
              "within_20": metrics["within_20_percent"],
              "gross": metrics["gross_mismatches"],
              "missed": metrics["missed_items"],
              "hallucinated": metrics["hallucinated_items"],
              "projects": {r["benchmark_id"]: r["summary"] for r in reports},
          }
          print("CANONICAL_FIVE_VALID=1")
          print("CANONICAL_FIVE_JSON=" + json.dumps(summary, sort_keys=True))
          Path("/tmp/canonical-five-validated.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-five-current-main-74b25fda
          path: |
            /tmp/canonical-five-results
            /tmp/canonical-five-console.log
            /tmp/canonical-five-validated.json
