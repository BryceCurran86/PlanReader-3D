name: Item19B preflight

on:
  push:
    branches:
      - chatgpt/item19b-direct-finish-callout-shadow

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified KSTVET source
        run: |
          mkdir -p benchmarks/sources
          curl -fL --retry 3 -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf \
            https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -
      - name: Run Item19B source preflight
        run: PYTHONPATH=. python scripts/item19b_preflight.py
