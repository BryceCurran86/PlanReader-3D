name: DIAG Lot16 Raster Spanning Face Pairs

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run spanning face-pair diagnostic
        run: |
          PYTHONPATH=. python tools/diag_lot16_raster_spanning_face_pairs.py | tee lot16-raster-spanning-face-pairs.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-raster-spanning-face-pairs
          path: lot16-raster-spanning-face-pairs.json
          retention-days: 1
