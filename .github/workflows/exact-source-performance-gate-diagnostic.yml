name: Exact Source Performance Gate Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  exact-source-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact official sources
        run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          curl -L --fail --retry 3 -o /tmp/murera.pdf "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf" | sha256sum -c -
      - name: Prepare latest performance candidates
        run: |
          git fetch origin refs/pull/984/head:refs/remotes/origin/pr984
          git fetch origin refs/pull/990/head:refs/remotes/origin/pr990
          git fetch origin refs/pull/991/head:refs/remotes/origin/pr991
          git fetch origin refs/pull/992/head:refs/remotes/origin/pr992
          git worktree add /tmp/pr984 refs/remotes/origin/pr984
          git worktree add /tmp/pr990 refs/remotes/origin/pr990
          git worktree add /tmp/pr991 refs/remotes/origin/pr991
          git worktree add /tmp/pr992 refs/remotes/origin/pr992
          git -C /tmp/pr984 rev-parse HEAD
          git -C /tmp/pr990 rev-parse HEAD
          git -C /tmp/pr991 rev-parse HEAD
          git -C /tmp/pr992 rev-parse HEAD
          git -C /tmp/pr990 merge-base --is-ancestor "$(git -C /tmp/pr984 rev-parse HEAD)" HEAD
          git -C /tmp/pr991 merge-base --is-ancestor "$(git -C /tmp/pr990 rev-parse HEAD)" HEAD
          git -C /tmp/pr992 merge-base --is-ancestor "$(git -C /tmp/pr991 rev-parse HEAD)" HEAD
          echo "performance stack integrity: OK"
          git -C /tmp/pr984 merge-base --is-ancestor 674dbe8948bff2547ca1b65177d9fb5670ad12df HEAD
      - name: Gate #990/#991/#992 indexed performance tests
        run: |
          cd /tmp/pr992
          PYTHONPATH=. pytest -q tests/test_plan_opening_detection_indexed_v172.py tests/test_wall_visible_observation_page_index.py tests/test_plan_opening_detection_v171.py tests/test_wall_room_topology_snap_index.py tests/test_wall_room_topology_collinear_merge_index.py tests/test_wall_room_topology_stage_a.py
      - name: Profile #992 Lamu page 44 first
        run: |
          set -o pipefail
          timeout 420s env PYTHONPATH=/tmp/pr992 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr992 --pdf /tmp/lamu.pdf --pages 44 --label lamu-p44-pr992 --wall-only | tee /tmp/lamu-p44-pr992.jsonl
        continue-on-error: true
      - name: Profile #992 Lamu 41-45 immediately
        run: |
          set -o pipefail
          timeout 900s env PYTHONPATH=/tmp/pr992 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr992 --pdf /tmp/lamu.pdf --pages 41-45 --label lamu-pr992 --wall-only | tee /tmp/lamu-pr992.jsonl
        continue-on-error: true
      - name: Profile #992 Murera 219-238 immediately
        run: |
          set -o pipefail
          timeout 1200s env PYTHONPATH=/tmp/pr992 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr992 --pdf /tmp/murera.pdf --pages 219-238 --label murera-pr992 --wall-only | tee /tmp/murera-pr992.jsonl
        continue-on-error: true
      - name: Profile #991 Lamu page 44 first
        run: |
          set -o pipefail
          timeout 420s env PYTHONPATH=/tmp/pr991 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr991 --pdf /tmp/lamu.pdf --pages 44 --label lamu-p44-pr991 --wall-only | tee /tmp/lamu-p44-pr991.jsonl
        continue-on-error: true
      - name: Profile #990 Lamu page 44 first
        run: |
          set -o pipefail
          timeout 420s env PYTHONPATH=/tmp/pr990 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr990 --pdf /tmp/lamu.pdf --pages 44 --label lamu-p44-pr990 --wall-only | tee /tmp/lamu-p44-pr990.jsonl
        continue-on-error: true
      - name: Profile #984 Lamu page 44 first
        run: |
          set -o pipefail
          timeout 420s env PYTHONPATH=/tmp/pr984 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr984 --pdf /tmp/lamu.pdf --pages 44 --label lamu-p44-pr984 --wall-only | tee /tmp/lamu-p44-pr984.jsonl
        continue-on-error: true
      - name: Profile current-main Lamu page 44
        run: |
          set -o pipefail
          timeout 420s env PYTHONPATH=$GITHUB_WORKSPACE python scripts/profile_exact_source_perf_gate.py --repo $GITHUB_WORKSPACE --pdf /tmp/lamu.pdf --pages 44 --label lamu-p44-main --wall-only | tee /tmp/lamu-p44-main.jsonl
        continue-on-error: true
      - name: Profile #991 Lamu 41-45
        run: |
          set -o pipefail
          timeout 900s env PYTHONPATH=/tmp/pr991 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr991 --pdf /tmp/lamu.pdf --pages 41-45 --label lamu-pr991 --wall-only | tee /tmp/lamu-pr991.jsonl
        continue-on-error: true
      - name: Profile #991 Murera 219-238
        run: |
          set -o pipefail
          timeout 1200s env PYTHONPATH=/tmp/pr991 python scripts/profile_exact_source_perf_gate.py --repo /tmp/pr991 --pdf /tmp/murera.pdf --pages 219-238 --label murera-pr991 --wall-only | tee /tmp/murera-pr991.jsonl
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-performance-gate
          path: |
            /tmp/lamu-p44-pr992.jsonl
            /tmp/lamu-pr992.jsonl
            /tmp/murera-pr992.jsonl
            /tmp/lamu-p44-pr991.jsonl
            /tmp/lamu-p44-pr990.jsonl
            /tmp/lamu-p44-pr984.jsonl
            /tmp/lamu-p44-main.jsonl
            /tmp/lamu-pr991.jsonl
            /tmp/murera-pr991.jsonl
