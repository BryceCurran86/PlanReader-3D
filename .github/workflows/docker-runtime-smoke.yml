name: Docker Runtime Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - render.yaml
      - pb_planreader_pdf_extractor.py
      - .github/workflows/docker-runtime-smoke.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - render.yaml
      - pb_planreader_pdf_extractor.py
      - .github/workflows/docker-runtime-smoke.yml

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t planreader-production .

      - name: Verify Tesseract runtime
        run: docker run --rm planreader-production tesseract --version

      - name: Smoke-test app under 512MB
        run: |
          set -euo pipefail
          docker run -d --name planreader-app \
            --memory=512m \
            --memory-swap=512m \
            --cpus=0.5 \
            -e PORT=10000 \
            -e PLANREADER_DATA_DIR=/tmp/planreader \
            -p 10000:10000 \
            planreader-production
          trap 'docker logs planreader-app || true; docker rm -f planreader-app >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10000/_stcore/health >/tmp/health.txt; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' planreader-app)" != "true" ]; then
              docker logs planreader-app
              exit 1
            fi
            sleep 2
          done

          grep -q 'ok' /tmp/health.txt
          docker stats --no-stream planreader-app
          test "$(docker inspect -f '{{.State.OOMKilled}}' planreader-app)" = "false"
