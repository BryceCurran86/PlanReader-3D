name: GPT MAX Original Shared G17 Dual End Piers
on:
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gptmax_g17_shared_dual_end_piers.py
      - tests/test_gptmax_g17_shared_dual_end_piers.py
      - tools/diag_gptmax_g17_shared_pier_w2_shadow.py
      - tests/test_gptmax_g17_shared_pier_w2_shadow.py
      - docs/engineering/gptmax_shared_g17_dual_end_source_20261017.md
      - .github/workflows/test-gptmax-original-shared-g17-dual-end-piers.yml
  push:
    branches: [main]
    paths:
      - tools/diag_gptmax_g17_shared_dual_end_piers.py
      - tests/test_gptmax_g17_shared_dual_end_piers.py
      - tools/diag_gptmax_g17_shared_pier_w2_shadow.py
      - tests/test_gptmax_g17_shared_pier_w2_shadow.py
      - docs/engineering/gptmax_shared_g17_dual_end_source_20261017.md
      - .github/workflows/test-gptmax-original-shared-g17-dual-end-piers.yml
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
jobs:
  original-source-positive-join:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.ORIGINAL_SOURCES_REPOSITORY != ''
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Original exact source parents / dual-end competitors
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_g17_shared_dual_end_piers.py tests/test_gptmax_g17_shared_pier_w2_shadow.py
          ruff check --select F821,F823 tools/diag_gptmax_g17_shared_dual_end_piers.py tests/test_gptmax_g17_shared_dual_end_piers.py tools/diag_gptmax_g17_shared_pier_w2_shadow.py tests/test_gptmax_g17_shared_pier_w2_shadow.py
      - name: Original Lot16 original PDF source SHA and real producer scope
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA=10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/diag_gptmax_g17_shared_dual_end_piers.py \
            --pdf "$PDF" --sha256 "$SHA" \
            --output artifacts/gptmax-original-shared-dual-ends.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/gptmax-original-shared-dual-ends.json").read_text())
          assert r["status"]=="original_g17_two_opening_shared_faces_dual_end_source_only"
          assert r["source_sha256"]=="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert r["source_snapshot_id"]=="source_snapshot_3fcb6bc5c44b51d930e9600080501d27"
          assert r["decision_scope_id"]=="wall-source:page-3"
          assert (r["old_physical_count"],r["old_host_count"],r["old_frame_count"],
                  r["old_signed_area_count"],r["old_customer_verified_count"])==(21,15,9,8,8)
          assert len(r["source_sharing_pairs"])==8
          assert r["original_source_snapshot_and_customer_receipts_unchanged"]
          assert all(not r[k] for k in ("new_source_derived_W4_host_granted",
                     "cross_resolution_equivalence_granted","metric_width_height_granted",
                     "opening_count_granted"))
          closed=[p for p in r["source_sharing_pairs"] if p["source_closed_pier_candidate"]]
          for pair in closed:
              assert len(pair["source_closed_source_observation_ids"])==4
              assert not pair["physical_structural_wall_role_granted"]
              assert not pair["wall_host_granted"]
              graph=pair["isolated_original_W2_W3_W4_source_graph"]
              assert graph is not None
              assert graph["source_rectangle_role_proven"] is False
              assert graph["original_W4_structural_member_granted"] is False
              assert graph["original_host_binding_granted"] is False
              assert set(graph["isolated_source_graphs"])=={
                "original_default_2_5pt_snap",
                "original_zero_snap_source_comparison"}
              for scope in graph["isolated_source_graphs"].values():
                  assert not scope["canonical_w4_wall_id_granted"]
                  assert not scope["structural_wall_role_granted"]
                  assert not scope["host_binding_granted"]
          print("W2/W3/W4 original default/exact source-only graphs reissued:",len(closed))
          assert closed, "No positively source-owned dual-ended original pier"
          print("Original dual-ended shared source candidates:",len(closed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-shared-g17-dual-ended-pier-evidence
          path: artifacts/gptmax-original-shared-dual-ends.json
          retention-days: 21

  original-source-not-verified:
    if: github.event_name == 'push' && vars.ORIGINAL_SOURCES_REPOSITORY == ''
    uses: ./.github/workflows/original-source-not-run.yml
    with:
      job: original-source-positive-join
