name: TEST GPTMAX Semantic Opening Face Protection

on:
  pull_request:
    branches:
      - gptmax/protect-proven-opening-wall-faces-v1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_physical_wall_candidate_drafting_motif_filter.py \
            tests/test_opening_host_binding_equivalence_source_integration_v3.py \
            tests/test_opening_host_binding_remote_ambiguity_regression_v3.py \
            tests/test_physical_wall_equivalence_candidate_eligibility.py
