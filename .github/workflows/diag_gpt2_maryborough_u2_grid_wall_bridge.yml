name: DIAG GPT2 Maryborough U2 Grid Wall Bridge

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Join existing U2 grid evidence to Maryborough W4 walls
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-u2-grid-wall-bridge
          git rev-parse HEAD > artifacts/gpt2-u2-grid-wall-bridge/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-u2-grid-wall-bridge/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_u2_grid_wall_bridge.py \
            | tee artifacts/gpt2-u2-grid-wall-bridge/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-u2-grid-wall-bridge
          path: artifacts/gpt2-u2-grid-wall-bridge
          retention-days: 1
