name: DIAG Lot16 Post Source Primitive Current Main

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact opening dropout matrix
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_opening_dropout_matrix.py | tee lot16-post-source-primitive-matrix.json
      - name: Run real all-family handoff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/lot16-post-source-primitive
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --project-id au_qld_lot16_power \
            --workspace-id 1 \
            --family-group all \
            --output-dir artifacts/lot16-post-source-primitive \
            | tee artifacts/lot16-post-source-primitive/handoff.stdout.json
      - name: Assert current production floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/lot16-post-source-primitive/au_qld_lot16_power.json")
          payload=json.loads(p.read_text())
          rows=[q for q in payload.get("quantities",[]) if q.get("family")=="opening_area" and not q.get("abstained",False)]
          vals=sorted(round(float(q["value"]),6) for q in rows)
          if len(rows) < 6:
              raise SystemExit(f"opening-area regression: expected >=6, got {len(rows)} {vals}")
          print(json.dumps({"opening_area_count":len(rows),"opening_areas":vals,"sealed_status":payload.get("status")},indent=2))
          PY
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-post-source-primitive-current-main
          path: |
            lot16-post-source-primitive-matrix.json
            artifacts/lot16-post-source-primitive
          retention-days: 2
