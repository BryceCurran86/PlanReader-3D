name: TEST GPT2 Original Material Producer Native CAD Schedule View

on:
  pull_request:
    paths:
      - pb_source_material_semantic_authority.py
      - tests/test_gpt2_source_material_producer_native_schedule_view.py
      - .github/workflows/test-gpt2-material-producer-native-schedule-view.yml
  workflow_dispatch:

jobs:
  authentic-source-schedule-optin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify private original source was provisioned
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          test -f "$PDF" || { echo 'BLOCKED: original private source not provisioned'; exit 1; }
          echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  $PDF" | sha256sum -c
      - name: Original correct F07 schedule and default-off producer tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt2_source_material_producer_native_schedule_view.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
