name: TEST ONLY GPT2 Maryborough current A110 A140

on:
  pull_request:
    branches: [ main ]

jobs:
  maryborough_current:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Run exact current Maryborough A110+A140 production chain
        run: |
          mkdir -p artifacts/gpt2-maryborough-current
          git rev-parse HEAD > artifacts/gpt2-maryborough-current/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-current/source_sha256.txt
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee artifacts/gpt2-maryborough-current/run.log
          import json, time
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          start=time.perf_counter()
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          labels=sorted(
              {
                  " ".join(str(room.room_label or "").strip().upper().split())
                  for room in claim.canonical_rooms
                  if str(room.room_label or "").strip()
              }
          )
          firm=[
              {
                  "quantity_id":q.quantity_id,
                  "room_label":dict(q.metadata or {}).get("room_label"),
                  "value":q.value,
                  "unit":q.unit,
                  "authority":q.authority,
                  "status":q.status,
                  "input_entity_ids":list(q.input_entity_ids),
                  "figured_dimension_ids":list(dict(q.metadata or {}).get("figured_dimension_ids") or ()),
              }
              for q in claim.room_area_quantity_evidence
              if not q.abstained
          ]
          floors=[
              {
                  "canonical_floor_id":f.canonical_floor_id,
                  "room_entity_id":f.room_entity_id,
                  "metric_area_m2":f.metric_area_m2,
                  "metric_area_quantity_id":f.metric_area_quantity_id,
                  "metric_area_authority":f.metric_area_authority,
              }
              for f in claim.canonical_floors
              if f.metric_area_m2 is not None
          ]
          targets={}
          wanted=("FOOD PREP","COLD ROOM","FREEZER","DRY STORE","SALES","WASH UP","FOOD SERVICE","POS COUNTER","M-AMB","F-AMB","TRUCK DRIVER LOUNGE","PWD","AIRLOCK","LAUNDRY","OFFICE")
          for name in wanted:
              targets[name]={
                  "label_present":name in labels,
                  "firm_areas":[row for row in firm if str(row.get("room_label") or "").strip().upper()==name],
              }
          print(json.dumps({
              "elapsed_seconds":time.perf_counter()-start,
              "status":getattr(claim.status,"value",str(claim.status)),
              "reason_codes":list(claim.reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "label_count":len(labels),
              "labels":labels,
              "firm_room_area_count":len(firm),
              "firm_room_areas":firm,
              "metric_floor_count":len(floors),
              "metric_floors":floors,
              "targets":targets,
          },sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-current-a110-a140
          path: artifacts/gpt2-maryborough-current
          retention-days: 1
