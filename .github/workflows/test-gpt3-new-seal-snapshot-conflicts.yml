name: GPT3 New Source-Seal Snapshot Conflict Veto
on:
  pull_request:
    branches: [main]
    paths:
      - pb_source_closed_run_export.py
      - tests/test_gpt3_new_seal_snapshot_conflicts.py
      - .github/workflows/test-gpt3-new-seal-snapshot-conflicts.yml
permissions:
  contents: read
jobs:
  producer-snapshot-no-mixed-source-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Exact issuer snapshot conflicts, legacy original eight and producer regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_new_seal_snapshot_conflicts.py tests/test_source_closed_run_export.py tests/test_live_opening_area_quantity_publication.py
          ruff check --select F821,F823 pb_source_closed_run_export.py tests/test_gpt3_new_seal_snapshot_conflicts.py
