name: TEST-ONLY Murera Scoped After Plan Authority

on:
  pull_request:
    branches: [main]

jobs:
  murera-scoped:
    if: startsWith(github.head_ref, 'diag/murera-scoped-after-plan-authority')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Replay Murera drawing pages only
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          source=Path("/tmp/murera.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-scoped-after-authority/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              source.write_bytes(r.read())
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(actual)

          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(
              source,
              pages=list(range(218,238)),
              collect_item35_shadow=False,
          )
          focus_tags={
              "floor_screed","substructure_surface_bed","substructure_bed_dpm",
              "substructure_a142_mesh","damp_proof_course","perimeter_walling"
          }
          focus=[
              {
                  "tag":p.tag,"quantity":p.quantity,"source_page":p.source_page,
                  "dimensions":p.dimensions,"description":p.description,"metadata":p.metadata
              }
              for p in preds if p.tag in focus_tags
          ]
          print("MURERA_SCOPED_AFTER_PLAN_AUTHORITY="+json.dumps({
              "candidate_sha":"89b24f7c96d38de9f9a942934e95d92b28bd5d2a",
              "source_sha256":actual,
              "focus_predictions":focus,
              "extraction_status":ex.extraction_status,
          },sort_keys=True,default=str),flush=True)
          PY
