name: GPT3 Guarded Activation Signed Trade Veto
on:
  pull_request:
    branches: [main]
    paths:
      - tools/run_gpt3_guarded_pending_reconciliation.py
      - tests/test_gpt3_guarded_activation_signed_trade_veto.py
      - .github/workflows/test-gpt3-guarded-v2-activation-trade.yml
permissions:
  contents: read
jobs:
  original-signed-window-not-door:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Lot16 pre-certified source-seven activation and trade tamper negatives
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_guarded_activation_signed_trade_veto.py tests/test_gpt3_guarded_pending_reconciliation.py tests/test_gpt3_guarded_pending_owned_rollback.py tests/test_gpt3_signed_v2_family_unit_dimension_veto.py
          ruff check --select F821,F823 tools/run_gpt3_guarded_pending_reconciliation.py tests/test_gpt3_guarded_activation_signed_trade_veto.py
