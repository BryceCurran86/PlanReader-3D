name: TEST GPT2 Original PWD Native Figure Witness Chain

on:
  pull_request:
    paths:
      - tools/diag_source_figure_wall_witness_chain_shadow.py
      - tests/test_gpt2_pwd_native_figure_wall_witness_chain.py
      - .github/workflows/test-gpt2-pwd-original-witness-chain.yml
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "tools/diag_source_figure_wall_witness_chain_shadow.py"
      - "tests/test_gpt2_pwd_native_figure_wall_witness_chain.py"
      - ".github/workflows/test-gpt2-pwd-original-witness-chain.yml"
  workflow_dispatch:

jobs:
  pwd-original-figure-extension-firstgate:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.ORIGINAL_SOURCES_REPOSITORY != ''
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original SHA PWD figured dimension and fake witness tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_pwd_native_figure_wall_witness_chain.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

  original-source-not-verified:
    if: github.event_name == 'push' && vars.ORIGINAL_SOURCES_REPOSITORY == ''
    uses: ./.github/workflows/original-source-not-run.yml
    with:
      job: pwd-original-figure-extension-firstgate
