name: TEST-ONLY Lamu Full Matrix Current Main

on:
  pull_request:
    branches: [main]

jobs:
  lamu:
    if: startsWith(github.head_ref, 'diag/lamu-full-matrix-current-main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Lamu benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          benchmark_id="tenders_ke_lamu_ishakani_ecd_classrooms"
          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-full-matrix/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/lamu.pdf"); source.write_bytes(payload)
          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/lamu-results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              auto_extract=True,
          )
          items={i.item_id:i.to_dict() for i in report.item_results}
          out={
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "exact":int(report.exact_matches),
              "within_5":int(report.within_5_percent),
              "gross":int(report.gross_mismatches),
              "missed":int(report.missed_items),
              "hallucinated":int(report.hallucinated_items),
              "items":items,
          }
          print("LAMU_FULL_MATRIX="+json.dumps(out,sort_keys=True),flush=True)
          extractor=GenericPlanReaderExtractor()
          predictions=extractor.extract_from_pdf(source)
          focus={}
          for p in predictions:
              if p.tag in {"perimeter_walling","damp_proof_course","internal_plaster","internal_paint","D1","chalkboard","floor_screed","roof_covering"}:
                  focus[p.tag]={
                      "quantity":p.quantity,
                      "unit":p.unit,
                      "source_page":p.source_page,
                      "dimensions":p.dimensions,
                      "confidence":p.confidence,
                      "metadata":p.metadata,
                  }
          detail={
              "focus_predictions":focus,
              "extraction_status":extractor.extraction_status,
              "physical_net_wall_live":getattr(extractor,"physical_net_wall_live",None),
          }
          print("LAMU_WALL_DETAIL="+json.dumps(detail,sort_keys=True,default=str),flush=True)
          PY
