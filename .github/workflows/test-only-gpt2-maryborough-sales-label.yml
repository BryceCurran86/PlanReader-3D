name: TEST ONLY GPT2 Maryborough Sales Label Validation

on:
  pull_request:
    branches:
      - main

jobs:
  maryborough_sales_label:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact A110 label validation
        shell: bash
        run: |
          mkdir -p artifacts/maryborough-sales-label
          git rev-parse HEAD > artifacts/maryborough-sales-label/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/maryborough-sales-label/source_sha256.txt
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee artifacts/maryborough-sales-label/run.log
          import json, time
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path = Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          started = time.perf_counter()
          claim = collect_live_physical_net_wall_claim(
              path,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=None,
          )
          labels = sorted(
              {
                  " ".join(str(room.room_label or "").strip().upper().split())
                  for room in claim.canonical_rooms
                  if str(room.room_label or "").strip()
              }
          )
          target = {
              "SALES", "DRY STORE", "FOOD SERVICE", "WASH UP",
              "TRUCK DRIVER LOUNGE", "POS COUNTER", "M-AMB", "F-AMB",
          }
          print(json.dumps({
              "stage":"labels",
              "elapsed_seconds":time.perf_counter()-started,
              "labelled_count":len(labels),
              "labels":labels,
              "target_labels_present":sorted(target & set(labels)),
              "room_count":len(claim.canonical_rooms),
              "floor_count":len(claim.canonical_floors),
          }, sort_keys=True), flush=True)
          expected_existing = {
              "AIRLOCK","COLD ROOM","FOOD PREP","FREEZER",
              "LAUNDRY","OFFICE","PWD","SALES",
          }
          if set(labels) != expected_existing:
              raise SystemExit(
                  "unexpected label set: "
                  + json.dumps({"expected":sorted(expected_existing),"actual":labels})
              )
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-maryborough-sales-label-validation
          path: artifacts/maryborough-sales-label
          retention-days: 1
