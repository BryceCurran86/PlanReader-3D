name: TEST-ONLY KSTVET Text Clip Operation Binding

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    if: github.head_ref == 'test-only/kstvet-text-clip-operation-binding-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-256 verify KSTVET source
        run: |
          curl -fL --retry 3 --retry-delay 2 --max-time 900 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  kstvet.pdf' | sha256sum -c -

      - name: Probe raw content and trace binding
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          import fitz

          payload = Path("kstvet.pdf").read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"

          doc = fitz.open(stream=payload, filetype="pdf")
          page = doc.load_page(46)
          content = bytes(page.read_contents() or b"")
          trace = list(page.get_texttrace() or ())
          bboxlog = list(page.get_bboxlog() or ())

          targets = ("Circular", "hollow", "sections", "50mm", "pillars")
          trace_rows = []
          for span in trace:
              text = "".join(chr(int(ch[0])) for ch in (span.get("chars") or ()))
              if not any(target in text for target in targets):
                  continue
              chars = tuple(span.get("chars") or ())
              first_origin = None
              if chars:
                  origin = chars[0][2]
                  first_origin = [float(origin.x), float(origin.y)]
              seqno = int(span.get("seqno"))
              trace_rows.append({
                  "seqno": seqno,
                  "type": int(span.get("type")),
                  "font": str(span.get("font")),
                  "size": float(span.get("size")),
                  "bbox": [float(v) for v in span.get("bbox")],
                  "first_origin": first_origin,
                  "opacity": float(span.get("opacity")),
                  "layer": str(span.get("layer") or ""),
                  "text": text,
                  "bboxlog": (
                      None
                      if seqno < 0 or seqno >= len(bboxlog)
                      else [str(bboxlog[seqno][0]), [float(v) for v in bboxlog[seqno][1]]]
                  ),
              })

          raw_contexts = {}
          for target in targets:
              needle = target.encode("latin1")
              positions = [m.start() for m in re.finditer(re.escape(needle), content)]
              raw_contexts[target] = [
                  {
                      "offset": pos,
                      "context": content[max(0,pos-500):min(len(content),pos+800)].decode(
                          "latin1", errors="replace"
                      ),
                  }
                  for pos in positions
              ]

          # Compact structural contexts around every clipping op that encloses a text block.
          clip_text_contexts = []
          pattern = re.compile(
              rb"q\s+"
              rb"([-+]?\d*\.?\d+)\s+([-+]?\d*\.?\d+)\s+"
              rb"([-+]?\d*\.?\d+)\s+([-+]?\d*\.?\d+)\s+re\s+"
              rb"(W\*?|W)\s+n\s+"
              rb"(BT.*?ET)\s+Q",
              re.S,
          )
          for match in pattern.finditer(content):
              text_block = match.group(6)
              if any(target.encode("latin1") in text_block for target in targets):
                  clip_text_contexts.append({
                      "offset": match.start(),
                      "rect_raw": [match.group(i).decode("ascii") for i in range(1,5)],
                      "clip_op": match.group(5).decode("ascii"),
                      "text_block": text_block.decode("latin1", errors="replace"),
                  })

          report = {
              "source_sha256": digest,
              "page_id": "47",
              "page_rect": [float(page.rect.x0), float(page.rect.y0), float(page.rect.x1), float(page.rect.y1)],
              "page_transformation_matrix": [float(v) for v in page.transformation_matrix],
              "trace_rows": trace_rows,
              "raw_contexts": raw_contexts,
              "clip_text_contexts": clip_text_contexts,
          }
          Path("kstvet-text-clip-operation-binding.json").write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          doc.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kstvet-text-clip-operation-binding
          path: kstvet-text-clip-operation-binding.json
          if-no-files-found: warn
