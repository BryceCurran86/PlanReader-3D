name: TEST-ONLY KSTVET Wall vs Opening Stages

on:
  pull_request:
    branches: [main]

jobs:
  physical-wall:
    if: startsWith(github.head_ref, 'diag/kstvet-wall-vs-opening-stages')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Resolve physical wall scope only
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from dataclasses import asdict,is_dataclass
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_physical_wall_candidate_authority import (
              PhysicalWallCandidateProducer, PhysicalWallCandidateSelector
          )
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-wall-stage/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected: raise SystemExit(actual)
          source=SourceVisibilityProducer(producer_method="kstvet_wall_stage_diag",producer_version="1")
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-wall-stage",source_bytes=payload,source_locator=url
          )
          prod=PhysicalWallCandidateProducer.from_source_visibility_producer(source,page_ids=("54",))
          auth=prod.authority()
          sel=PhysicalWallCandidateSelector(
              document_id=published.revision.document_id,
              revision_id=published.revision.revision_id,
              source_sha256=published.revision.source_sha256,
              snapshot_id=published.snapshot.snapshot_id,
              page_id="54",
              decision_scope_id="wall-source:page-54",
          )
          res=auth.resolve_scope(sel)
          out={
              "sha":actual,"status":res.status,"scope_complete":res.scope_complete,
              "reason_codes":res.reason_codes,
              "record_count":len(res.records),
              "wall_ids":[r.wall_candidate_id for r in res.records],
              "equivalence":res.equivalence,
              "source_observation_count":len(res.source_observation_ids),
          }
          def serial(v):
              if is_dataclass(v): return asdict(v)
              if isinstance(v,dict): return {str(k):serial(x) for k,x in v.items()}
              if isinstance(v,(list,tuple)): return [serial(x) for x in v]
              return v
          print("KSTVET_PHYSICAL_WALL_STAGE="+json.dumps(serial(out),sort_keys=True,default=str),flush=True)
          PY

  semantic-openings:
    if: startsWith(github.head_ref, 'diag/kstvet-wall-vs-opening-stages')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Enumerate semantic openings only
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from dataclasses import asdict,is_dataclass
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_semantic_opening_enumeration_authority import SemanticOpeningEnumerationProducer
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-opening-stage/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected: raise SystemExit(actual)
          source=SourceVisibilityProducer(producer_method="kstvet_opening_stage_diag",producer_version="1")
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-opening-stage",source_bytes=payload,source_locator=url
          )
          prod=SemanticOpeningEnumerationProducer.from_source_visibility_producer(source)
          res=prod.publish_page_scope(
              revision_id=published.revision.revision_id,
              decision_scope_id="kstvet-semantic-openings-page-54",
              page_ids=("54",),
          )
          out={
              "sha":actual,"status":res.status,"reason_codes":res.reason_codes,
              "decision_scope_complete":(
                  bool(res.record.physical_opening_universe_complete)
                  if res.record is not None else False
              ),
              "record_count":(
                  len(res.record.physical_opening_record_ids)
                  if res.record is not None else 0
              ),
              "record":res.record,
          }
          def serial(v):
              if is_dataclass(v): return asdict(v)
              if isinstance(v,dict): return {str(k):serial(x) for k,x in v.items()}
              if isinstance(v,(list,tuple)): return [serial(x) for x in v]
              return v
          print("KSTVET_SEMANTIC_OPENING_STAGE="+json.dumps(serial(out),sort_keys=True,default=str),flush=True)
          PY
