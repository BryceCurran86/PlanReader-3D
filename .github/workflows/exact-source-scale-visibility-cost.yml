name: Exact Source Scale Visibility Cost

on:
  pull_request:
    branches: [main]

jobs:
  scale-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact sources
        run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          curl -L --fail --retry 3 -o /tmp/murera.pdf "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf" | sha256sum -c -
      - name: Lamu scale visibility cost
        run: timeout 900s env PYTHONPATH=. python scripts/profile_scale_visibility_cost.py --pdf /tmp/lamu.pdf --pages 41-45 --label lamu
        continue-on-error: true
      - name: Murera scale visibility cost
        run: timeout 900s env PYTHONPATH=. python scripts/profile_scale_visibility_cost.py --pdf /tmp/murera.pdf --pages 219-238 --label murera
        continue-on-error: true
