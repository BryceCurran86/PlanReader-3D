name: TEST-ONLY Murera Native Envelope Map

on:
  pull_request:
    branches: [main]

jobs:
  murera-native-envelope-map:
    if: startsWith(github.head_ref, 'diag/murera-native-envelope-map')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install minimal runtime
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF
      - name: Map native Murera drawing dimensions
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          import fitz
          from collections import Counter

          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          path=Path("/tmp/murera.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-native-map/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              path.write_bytes(r.read())
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(actual)

          addr=("P.O. BOX","P.O BOX","PO BOX","P O BOX","TEL:","FAX:","EMAIL:","BOX 100727","BOX 9656")
          def dims_from_text(txt):
              clean="\n".join(ln for ln in txt.splitlines() if not any(k in ln.upper() for k in addr))
              vals=[]
              for major,minor in re.findall(r"\b(\d{1,2})[,.]?(\d{3})\b",clean):
                  v=round(float(major)+float(minor)/1000.0,3)
                  if 2.0 <= v <= 35.0:
                      vals.append(v)
              return vals

          def envelope(vals):
              c=Counter(round(v,2) for v in vals)
              overall=[d for d,n in c.items() if n<=2 and d>=5.0]
              large=[d for d in c if d>=10.0]
              pool=sorted(set(overall+large),reverse=True)
              for i,l in enumerate(pool):
                  for w in pool[i+1:]:
                      if l-w<=0.6: continue
                      if 15.0 <= l*w <=600.0 and w>=4.0:
                          return [l,w,round(l*w,4)]
              uniq=sorted(set(vals),reverse=True)
              for i,l in enumerate(uniq):
                  for w in uniq[i+1:]:
                      if l-w>0.6 and 15.0<=l*w<=600.0 and w>=3.0:
                          return [l,w,round(l*w,4)]
              return None

          doc=fitz.open(path)
          out=[]
          all_candidates=[]
          floor_area_hits=[]
          area_re=re.compile(r"(?i)\\bfloor\\s+area\\b[^\\d]{0,48}(\\d{1,6}(?:[.,]\\d{1,3})?)\\s*(m\\s*(?:2|²)|sq\\.?\\s*m|sqm)\\b")
          plan_re=re.compile(r"(?i)\\b(floor\\s+plan|floor\\s+layout|ground\\s+floor\\s+plan|design\\s+scheme\\s*\\(\\s*plan\\s*\\)|general\\s+[^\\n]{0,40}\\s+floor\\s+plan)\\b")
          try:
              for pno in range(len(doc)):
                  page=doc[pno]
                  txt=page.get_text("text") or ""
                  vals=dims_from_text(txt)
                  env=envelope(vals)
                  normalized=" ".join(txt.replace("\\u00a0"," ").split())
                  matches=[m.group(0) for m in area_re.finditer(normalized)]
                  if matches:
                      floor_area_hits.append({
                          "page":pno+1,
                          "plan_context":bool(plan_re.search(normalized)),
                          "matches":matches[:20],
                      })
                  titles=[ln.strip() for ln in txt.splitlines() if ln.strip() and re.search(r"(?i)(floor plan|foundation|layout|section|elevation|roof plan|science lab|bill|quantity|amount)",ln)]
                  if env is not None and 100.0 <= env[2] <= 220.0:
                      all_candidates.append({
                          "page":pno+1,
                          "titles":titles[:30],
                          "dims":vals[:100],
                          "envelope":env,
                          "distance_from_149_26":round(abs(env[2]-149.26),4),
                      })
                  if 218 <= pno <= 237:
                      out.append({
                          "page":pno+1,
                          "titles":titles[:30],
                          "dims":vals,
                          "envelope":env,
                          "area_near_149_26": bool(env and abs(env[2]-149.26)<3.0),
                      })
          finally:
              doc.close()
          # Reproduce the dangerous document-global detected_span behavior.
          drawing_indicators=(
              "scale 1:","scale: 1:","scale 1 :","scale: 1 :","ground floor plan",
              "floor plan","foundation plan","foundation layout","ground floor slab detail",
              "ground floor slab details","slab detail","slab details","elevation","section",
              "roof plan","layout plan","working drawing","drawing no","drawing title","sheet no",
              "window schedule","door schedule","schedule of doors","schedule of windows",
              "schedule of finishes",
          )
          detected_span=None
          span_updates=[]
          page_records=[]
          doc=fitz.open(path)
          try:
              for pno in range(len(doc)):
                  page=doc[pno]
                  txt=page.get_text("text") or ""
                  low=txt.lower()
                  is_drawing=any(ind in low for ind in drawing_indicators)
                  if not is_drawing:
                      continue
                  vals=dims_from_text(txt)
                  norm=" ".join(low.split())
                  if any(k in norm for k in ("section","span","truss","layout")):
                      for v in vals:
                          if 7.0 <= v <= 14.0:
                              detected_span=v
                              span_updates.append({"page":pno+1,"value":v})
                              break
                  page_records.append({
                      "page":pno+1,
                      "dims":vals,
                      "titles":[ln.strip() for ln in txt.splitlines() if ln.strip() and re.search(r"(?i)(floor plan|foundation|layout|section|elevation|roof plan|science lab)",ln)][:20],
                  })
          finally:
              doc.close()

          cross_page=[]
          for rec in page_records:
              vals=rec["dims"]
              c=Counter(round(v,2) for v in vals)
              # Exact production fallback where one resolved length can borrow detected_span.
              # First see whether this page supplies any candidate length >=5m.
              uniq=sorted(set(vals),reverse=True)
              for l in uniq:
                  if l < 5.0 or detected_span is None:
                      continue
                  area=round(l*detected_span,4)
                  if 100.0 <= area <= 220.0:
                      cross_page.append({
                          "page":rec["page"],"length_m":l,"detected_span_m":detected_span,
                          "area_m2":area,"distance_from_149_26":round(abs(area-149.26),4),
                          "titles":rec["titles"],
                      })

          print("MURERA_NATIVE_ENVELOPE_MAP="+json.dumps({
              "sha":actual,
              "pages":out,
              "all_100_220_candidates":all_candidates,
              "floor_area_hits":floor_area_hits,
              "detected_span_final":detected_span,
              "detected_span_updates":span_updates,
              "cross_page_area_candidates":sorted(cross_page,key=lambda x:x["distance_from_149_26"])[:100],
          },sort_keys=True),flush=True)
          PY
