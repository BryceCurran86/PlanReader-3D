name: GPT3 Original Opening Activation Signed Trade Veto
on:
  pull_request:
    branches: [main]
    paths:
      - tools/prepare_gpt3_pending_identity_activation.py
      - tests/test_gpt3_original_opening_activation_signed_trade.py
      - .github/workflows/test-gpt3-opening-activation-trade.yml
permissions:
  contents: read
jobs:
  original-lot16-window-never-activates-as-door:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Real Lot16 signed seven and independently certified opening source trade
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_original_opening_activation_signed_trade.py tests/test_gpt3_pending_identity_activation.py tests/test_gpt3_signed_v2_family_unit_dimension_veto.py
          ruff check --select F821,F823 tools/prepare_gpt3_pending_identity_activation.py tests/test_gpt3_original_opening_activation_signed_trade.py
