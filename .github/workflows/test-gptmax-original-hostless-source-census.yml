name: GPT MAX Original Hostless Source Scope Census
on:
  pull_request:
    branches:
      - main
      - gptmax/lot16-frame-competitor-census-20261015
    paths:
      - tools/diag_gptmax_original_hostless_source_census.py
      - tests/test_gptmax_original_hostless_source_census.py
      - docs/engineering/gptmax_original_hostless_source_census_20261015.md
      - docs/engineering/gptmax_fifteen_original_source_authority_tasks_20261015.md
      - .github/workflows/test-gptmax-original-hostless-source-census.yml
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  fail-closed-source-context-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_original_hostless_source_census.py
          ruff check --select F821,F823 tools/diag_gptmax_original_hostless_source_census.py tests/test_gptmax_original_hostless_source_census.py

  original-sha-pinned-six-case-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Reissue original Lot16 shadow baseline unchanged
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum -c
          PYTHONPATH=. python -u tools/diag_gptmax_paired_outer_faces_quantity_shadow.py \
            --pdf "$PDF" --page-id 3 --output artifacts/original-paired-wall-faces-shadow.json
      - name: Inspect six original missing host sides only
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_original_hostless_source_census.py \
            --source-report artifacts/original-paired-wall-faces-shadow.json \
            --sha256 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --snapshot source_snapshot_3fcb6bc5c44b51d930e9600080501d27 \
            --physical-id physical_opening_existence_33d277d4c6b6ce758b0594f9d47ce4d8 \
            --physical-id physical_opening_existence_81a45c3a33c2a4c0bfdf243aa45a780d \
            --physical-id physical_opening_existence_a68d0b7d738b5de9a1588b4e680e1a8f \
            --physical-id physical_opening_existence_b248972669988c108ebc90c6ca3908fd \
            --physical-id physical_opening_existence_ba7f75a2e5f68bcce87cd00ac1acf90b \
            --physical-id physical_opening_existence_f819752382d44a00d9f28feca4b00787 \
            --output artifacts/hostless-original-source-census.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/hostless-original-source-census.json').read_text())
          assert p['status']=='UNPUBLISHED_SOURCE_HOSTLESS_DIAGNOSTIC'
          assert p['decision_scope_id']=='wall-source:page-3'
          assert p['original_selected_root_raw_candidate_count']==30
          assert p['original_w4_record_count']==2094
          assert len(p['cases'])==6
          assert [c['shortlist_count'] for c in p['cases']]==[2,1,0,0,1,3]
          assert all(c['first_stage']=='UNPROVEN_ORIGINAL_SOURCE_W4_STRUCTURAL_SIDE_MEMBERSHIP'
                     and not c['host_granted']
                     and c['matched_source_observation_count']>=6
                     for c in p['cases'])
          assert all(not any(x['structural_host_granted'] for x in c['source_w4_endpoint_shortlist'])
                     for c in p['cases'])
          assert not any(p['authority_grants'].values())
          source=json.loads(Path('artifacts/original-paired-wall-faces-shadow.json').read_text())
          b=source['baseline_receipts']
          assert len(b['quantities'])==len(b['customer_rows'])==8
          assert len(b['hosts'])==21 and sum(bool(h['host_wall_id']) for h in b['hosts'])==15
          assert len(b['frames'])==21 and sum(bool(f['record_id']) for f in b['frames'])==9
          assert b['sealed_run']==source['candidate_receipts']['sealed_run']
          assert b['quantities']==source['candidate_receipts']['quantities']
          assert not source['original_receipts_retained'] and not source['count_granted']
          assert source['primitive_safety_cap']==20000
          print('All six source identities traced without any new host grant')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-hostless-source-census
          path: artifacts/hostless-original-source-census.json
          retention-days: 21
