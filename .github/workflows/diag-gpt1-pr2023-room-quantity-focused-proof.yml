name: DIAG GPT1 PR2023 Room Quantity Focused Proof

on:
  push:
    branches: [diag/gpt1-pr2023-room-quantity-focused-proof]

concurrency:
  group: diag-gpt1-pr2023-room-quantity-focused-proof
  cancel-in-progress: true

jobs:
  source-room-quantity-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify Full Plan V2 truth unchanged
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Run room area source replay, canonical floor and sealed finish regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_live_floor_area_quantity_publication_integrity.py \
            tests/test_live_canonical_floor_surface.py \
            tests/test_live_floor_finish_area_source_closed_export.py
