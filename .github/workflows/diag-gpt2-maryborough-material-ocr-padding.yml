name: DIAG GPT2 Maryborough Material OCR Padding

on:
  push:
    branches:
      - diag/gpt2-maryborough-material-ocr-padding

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install PyMuPDF==1.28.0 Pillow==12.3.0 pytesseract==0.3.13
      - name: Probe page 9 schedule blocks
        shell: bash
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import io, json
          from pathlib import Path
          import fitz
          import pytesseract
          from PIL import Image, ImageOps
          pdf_path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          doc=fitz.open(pdf_path)
          page=doc.load_page(8)
          words=page.get_text("words")
          grouped={}
          for w in words:
              grouped.setdefault(int(w[5]), []).append(w)

          targets={26:"FPB",27:"GRID",28:"WFPB",353:"TITLE"}
          out={"page_rotation":int(page.rotation),"page_rect":list(page.rect),"blocks":{}}
          for block_no,label in targets.items():
              rows=sorted(grouped.get(block_no,[]), key=lambda w:(int(w[6]),int(w[7]),float(w[0])))
              if not rows:
                  out["blocks"][str(block_no)]={"label":label,"missing":True}
                  continue
              text=" ".join(str(w[4]) for w in rows)
              bbox=fitz.Rect(
                  min(float(w[0]) for w in rows),
                  min(float(w[1]) for w in rows),
                  max(float(w[2]) for w in rows),
                  max(float(w[3]) for w in rows),
              )
              probes=[]
              for pad_pt in (0.0,1.0,2.0,4.0):
                  clip=fitz.Rect(
                      max(float(page.rect.x0),bbox.x0-pad_pt),
                      max(float(page.rect.y0),bbox.y0-pad_pt),
                      min(float(page.rect.x1),bbox.x1+pad_pt),
                      min(float(page.rect.y1),bbox.y1+pad_pt),
                  )
                  readings={}
                  for dpi in (300,450):
                      render_clip=clip * page.rotation_matrix
                      pix=page.get_pixmap(
                          matrix=fitz.Matrix(float(dpi)/72.0,float(dpi)/72.0),
                          clip=render_clip,
                          alpha=False,
                      )
                      img=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
                      border=max(1,round(dpi*1.0/25.4))
                      rotation_reads={}
                      for degrees in (0,90,-90,180):
                          rotated=img if degrees == 0 else img.rotate(degrees,expand=True)
                          isolated=ImageOps.expand(rotated,border=border,fill="white")
                          mode_reads={}
                          for mode,config in (
                              ("psm7","--psm 7"),
                              ("psm6","--psm 6"),
                              ("psm13","--psm 13"),
                              ("psm7_no_tables","--psm 7 -c textord_tabfind_find_tables=0"),
                          ):
                              raw=pytesseract.image_to_string(isolated,config=config)
                              mode_reads[mode]=" ".join(str(raw or "").split())
                          rotation_reads[str(degrees)]=mode_reads
                      readings[str(dpi)]=rotation_reads
                  probes.append({"pad_pt":pad_pt,"clip":list(clip),"readings":readings})
              composites={}
              for dpi in (300,450):
                  composites[str(dpi)]={}
                  for degrees in (90,-90):
                      word_images=[]
                      for w in rows:
                          wb=fitz.Rect(float(w[0]),float(w[1]),float(w[2]),float(w[3]))
                          render_wb=wb * page.rotation_matrix
                          pix=page.get_pixmap(
                              matrix=fitz.Matrix(float(dpi)/72.0,float(dpi)/72.0),
                              clip=render_wb,
                              alpha=False,
                          )
                          wi=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
                          wi=wi.rotate(degrees,expand=True)
                          wi=ImageOps.expand(
                              wi,
                              border=max(1,round(dpi*0.6/25.4)),
                              fill="white",
                          )
                          word_images.append(wi)
                      if word_images:
                          gap=max(4,round(dpi*1.5/25.4))
                          height=max(im.height for im in word_images)
                          width=sum(im.width for im in word_images)+gap*(len(word_images)-1)
                          canvas=Image.new("RGB",(width,height),"white")
                          x=0
                          for im in word_images:
                              y=max(0,(height-im.height)//2)
                              canvas.paste(im,(x,y))
                              x+=im.width+gap
                          raw=pytesseract.image_to_string(canvas,config="--psm 7")
                          composites[str(dpi)][str(degrees)]=" ".join(str(raw or "").split())
              out["blocks"][str(block_no)]={
                  "label":label,
                  "native_text":text,
                  "bbox":list(bbox),
                  "probes":probes,
                  "composites":composites,
              }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
