name: GPT MAX Original Room-Face Shadow Source Witness
on:
  pull_request:
    paths:
      - tools/verify_gptmax_room_face_shadow_rekeys.py
      - tools/diag_gptmax_source_authority_stages.py
      - tests/test_gptmax_room_face_shadow_rekeys.py
      - .github/workflows/test-gptmax-room-face-shadow-source-witness.yml
permissions:
  contents: read
jobs:
  strict-rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source-owned full shadow geometry/identity anti-tampering
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_room_face_shadow_rekeys.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  original-lot16-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run identical unmodified original source vs opt-in room-shadow witness
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/gptmax-shadow-room-base "${{ github.event.pull_request.base.sha }}"
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum --check
          (cd /tmp/gptmax-shadow-room-base &&
            PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages --output "$GITHUB_WORKSPACE/baseline.json")
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages --output current.json
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages \
            --include-shadow-room-face-source-polygons --output shadow-owned.json
      - name: Every original shadow-only polygon has one real source address
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("baseline.json").read_text())
          c=json.loads(Path("current.json").read_text())
          g=json.loads(Path("shadow-owned.json").read_text())
          assert b==c, "source-owned production output changed when diagnostic was OFF"
          w=g.pop("shadow_owned_face_source_polygons")
          assert g==c, "opt-in original shadow polygons changed production authority"
          assert len(w)==1 and str(w[0]['page_id'])=='3'
          faces=w[0]['faces']
          assert len(faces)==107, len(faces)
          assert len({f['face_id'] for f in faces})==107
          assert sum(f['status']=='published' for f in faces)==61
          assert sum(f['status']=='abstained' for f in faces)==41
          assert sum(f['status']=='shadow_owned_unpublished' for f in faces)==5
          assert all(f['authority_granted'] is False for f in faces)
          old=c['source_room_face_scopes'][0]['result']
          assert set(f['face_id'] for f in faces)==set(old['ownership_evaluation']['owned_face_ids'])
          assert len(old['records'])==61 and len(old['abstained_faces'])==41
          assert len(c['source_owned_wall_scopes'][0]['records'])==2094
          assert c['summary']['authenticated_hosts']==14
          assert c['summary']['resolved_source_frames']==9
          assert c['primitive_safety_cap']==20_000
          assert 'quantities' not in g
          print({"original_shadow_owned_faces":107,"published":61,"abstained":41,
                 "unpublished_shadow_only":5,"W4_exact_original":2094,
                 "new_room_quantities_granted":0,"benchmark_matches_claimed":0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-room-shadow-polygon-source
          path: |
            baseline.json
            current.json
            shadow-owned.json
          retention-days: 14
