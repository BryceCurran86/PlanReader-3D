name: GPT MAX Opening Wall Face Preservation
on:
  pull_request:
    paths:
      - pb_physical_opening_authority.py
      - pb_physical_wall_candidate_authority.py
      - tests/test_opening_proven_wall_face_preservation.py
      - tests/test_wall_opening_partial_same_face_override.py
      - tests/test_opening_wall_face_diagnostic.py
      - tools/diag_opening_wall_face_preservation.py
      - .github/workflows/test-gptmax-opening-wall-face-preservation.yml
concurrency:
  group: gptmax-opening-faces-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Integrity and provider isolation
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          python -m compileall -q .
          ruff check --select F821,F823 .
      - name: Full regression suite
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Smoke test
        run: python tests/ci_smoke.py
  source-proof:
    runs-on: ubuntu-latest
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Real Lot16 source, wall and host handoff
        run: >-
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py
          --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          --page-id 3 --output lot16-opening-wall-face-handoff.json
      - name: Verify exact source ownership and safety cap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('lot16-opening-wall-face-handoff.json').read_text())
          assert report['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert report['primitive_safety_cap'] == 20_000
          assert report['preservation_proof_available']
          assert report['source_owned_wall_scope_results']
          assert all(row['source_sha256'] == report['source_sha256'] for row in report['source_owned_wall_scope_results'])
          ids = [row['opening_identity_id'] for row in report['opening_bindings']]
          assert len(ids) == len(set(ids))
          assert 'quantities' not in report
          PY
      - name: Compare all-source Lot16 with exact current-main baseline
        run: |
          git show 184e32bf832746fe57e7ae3134fe11248f568a87:tools/diag_gptmax_source_authority_stages.py > /tmp/gptmax-source-stages.py
          git worktree add /tmp/gptmax-face-baseline ${{ github.event.pull_request.base.sha }}
          (cd /tmp/gptmax-face-baseline && PYTHONPATH=. python -u /tmp/gptmax-source-stages.py --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' --page-id 3 --source-all-pages --output /tmp/lot16-face-baseline.json)
          PYTHONPATH=. python -u /tmp/gptmax-source-stages.py --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' --page-id 3 --source-all-pages --output lot16-face-current.json
          cp /tmp/lot16-face-baseline.json lot16-face-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('lot16-face-baseline.json').read_text())
          new = json.loads(Path('lot16-face-current.json').read_text())
          assert old['source_sha256'] == new['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert old['primitive_safety_cap'] == new['primitive_safety_cap'] == 20_000
          assert old['source_decode_coverage'] == new['source_decode_coverage']
          hosted = lambda report: {row['opening_identity_id']: row for row in report['opening_bindings'] if row['host_wall_id']}
          assert hosted(old) == hosted(new)
          assert old['resolved_host_frame_evidence'] == new['resolved_host_frame_evidence']
          ids = lambda report: {row['physical_opening_id']: row for row in report['canonical_openings']}
          before, after = ids(old), ids(new)
          assert before.keys() == after.keys()
          assert len(after) == len(new['canonical_openings'])
          for key in before:
              for field in ('physical_opening_id', 'canonical_opening_id', 'source_observation_ids', 'source_lineage_root_ids'):
                  assert before[key][field] == after[key][field]
          assert 'quantities' not in new
          print(json.dumps({'baseline': old['summary'], 'current': new['summary']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-opening-wall-face-handoff
          path: |
            lot16-opening-wall-face-handoff.json
            lot16-face-*.json
          retention-days: 14
