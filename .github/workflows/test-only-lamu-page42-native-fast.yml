name: TEST-ONLY Lamu Page42 Native Fast

on:
  pull_request:
    branches: [main]

jobs:
  page42:
    if: startsWith(github.head_ref, 'diag/lamu-page42-native-fast')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyMuPDF
        run: pip install PyMuPDF
      - name: Read SHA-pinned page 42 native evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          import fitz
          from pb_wall_fill_internal_partition_evidence import resolve_internal_partition_length_m

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-page42-native-fast/1.1"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/lamu.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          try:
              page=doc[41]
              text=page.get_text("text") or ""
              words=page.get_text("words") or []
              lines=[ln.strip() for ln in text.splitlines() if ln.strip()]
              numeric=[]
              for w in words:
                  token=str(w[4]).strip()
                  compact=token.replace(",","").replace(".","")
                  if re.fullmatch(r"\d{2,5}", compact):
                      numeric.append({
                          "text":token,
                          "bbox":[round(float(w[0]),2),round(float(w[1]),2),round(float(w[2]),2),round(float(w[3]),2)],
                          "block":int(w[5]),"line":int(w[6]),"word":int(w[7])
                      })
              relevant=[ln for ln in lines if re.search(
                  r"(?i)(?:toilet|vip|wc|latrine|floor|plan|elevation|section|dpc|damp|wall|door|window|foundation|roof|scale|\d)",
                  ln
              )]
              drawings=page.get_drawings() or []
              partition=resolve_internal_partition_length_m(
                  drawings,length_m=3.45,width_m=2.45,page=page
              )
              out={
                  "source_sha256":actual,
                  "page":42,
                  "page_rect":[float(x) for x in page.rect],
                  "native_chars":len(text),
                  "image_count":len(page.get_images(full=True) or []),
                  "drawing_count":len(drawings),
                  "relevant_lines":relevant[:260],
                  "numeric_words":numeric[:500],
                  "source_read_envelope_m":[3.45,2.45],
                  "external_rectangular_perimeter_m":round(2*(3.45+2.45),3),
                  "partition_evidence":{
                      "status":partition.status,
                      "reason":partition.reason,
                      "total_length_m":partition.total_length_m,
                      "wall_thickness_m":partition.wall_thickness_m,
                      "scale_pt_per_m":partition.scale_pt_per_m,
                      "segment_lengths_m":list(partition.segment_lengths_m),
                  },
                  "all_walls_dpc_m":(
                      round(2*(3.45+2.45)+partition.total_length_m,3)
                      if partition.status=="found" else None
                  ),
              }
              print("LAMU_PAGE42_NATIVE_FAST="+json.dumps(out,sort_keys=True),flush=True)
          finally:
              doc.close()
          PY
