name: TEST GPT2 Original Source Doorway Jamb Chain

on:
  pull_request:
    paths:
      - pb_source_doorway_jamb_authority.py
      - tests/test_gpt2_original_doorway_jamb_source_chain.py
      - .github/workflows/test-gpt2-original-door-jamb-chain.yml
  workflow_dispatch:

jobs:
  original-door-jamb-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify original source exists and immutable SHA
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          test -f "$PDF" || { echo 'BLOCKED: original private PDF source not provisioned'; exit 1; }
          echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  $PDF" | sha256sum -c
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source original D15 and synthetic adversarial cases
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt2_original_doorway_jamb_source_chain.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
