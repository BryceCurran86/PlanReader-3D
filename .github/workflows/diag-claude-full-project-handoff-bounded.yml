name: DIAG Claude Full Project Handoff Bounded (3Laurel and Q5446)

# Measurement only. Runs the COMPLETE original-source handoff (all pages decoded as the evidence universe) for the two
# projects whose full-project production has timed out or been OOM-killed. Shared CI runners differ by up to 2x in speed
# from job to job, so every code variant for one project runs SEQUENTIALLY ON THE SAME RUNNER, bracketed by two runs of
# the unchanged baseline to expose drift: "base" is the current tip of main and every other variant is main with the
# named resource-change branches merged in. CPU time (user+sys), wall time and the sampled peak RSS are recorded per run,
# and the deterministic handoff outputs of every variant are compared byte for byte with base. No production file is
# changed by this workflow and no quantity or score is claimed; a resource change that altered any output fails.
on:
  pull_request:
    paths:
      - ".github/workflows/diag-claude-full-project-handoff-bounded.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 3laurel
            project_id: au_qld_3laurel
            pdf: "documents/sources/3LAUREL - Construction Plan Set Rev3 08.05.26.pdf"
            sha: "014e9f68b377bef4fb556de61b83a94388792dfa4bfb8ea981644f9c323e9e2e"
          - project: q5446
            project_id: au_qld_q5446_armstrong32_harlequin
            pdf: "documents/sources/Q5446_Standard_Plans_V1_20220320.pdf"
            sha: "5f29aa0122d72e2cc8886b3f19239ff32865c8d705eee99f785c389ca27fb7f0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install original-source dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Machine resources
        run: |
          nproc
          free -m
          lscpu | grep -E "Model name|MHz" || true
      - name: Verify immutable original source
        env:
          PDF: ${{ matrix.pdf }}
          SHA: ${{ matrix.sha }}
        run: |
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
      - name: Complete original-source handoff per variant, sequentially on this runner
        env:
          PYTHONPATH: .
          ORT_DISABLE_TELEMETRY: "1"
          PDF: ${{ matrix.pdf }}
          PROJECT_ID: ${{ matrix.project_id }}
        run: |
          set -uo pipefail
          git config user.name diag
          git config user.email diag@example.invalid
          A=claude/source-snapshot-shared-records-20261014
          B=claude/handoff-redundant-source-proof-20261014
          C=claude/handoff-bulk-gc-regime-20261014
          # name | branches merged into main | PB_CYCLIC_GC_MODE
          VARIANTS=(
            "base||default"
            "AB|$A $B|default"
            "AB_disabled|$A $B $C|disabled"
            "AB_staged|$A $B $C|staged"
            "A|$A|default"
            "B|$B|default"
            "base2||default"
          )
          mkdir -p artifacts
          for spec in "${VARIANTS[@]}"; do
            IFS='|' read -r name refs mode <<< "$spec"
            echo "=================== variant $name (merge: ${refs:-none}, gc mode: $mode)"
            git checkout -q --detach origin/main
            git reset -q --hard
            git clean -fdq -e artifacts
            for ref in $refs; do
              git merge -q --no-edit "origin/$ref" || { echo "MERGE FAILED for $ref"; exit 1; }
            done
            dir="artifacts/$name"
            mkdir -p "$dir"
            git rev-parse HEAD > "$dir/code_sha.txt"
            echo "$mode" > "$dir/gc_mode.txt"
            ( while true; do
                pid=$(pgrep -f '^python -u tools/run_source_closed_project_handoff.py' | head -1 || true)
                if [ -n "$pid" ]; then
                  echo "$(date +%s) $(awk '/VmRSS/{print $2}' /proc/$pid/status 2>/dev/null || echo 0)" >> "$dir/rss_kb_timeline.txt"
                fi
                sleep 5
              done ) &
            SAMPLER=$!
            set +e
            PB_CYCLIC_GC_MODE="$mode" /usr/bin/time -v -o "$dir/time_v.txt" \
              timeout -s INT 3500s python -u tools/run_source_closed_project_handoff.py \
                --pdf "$PDF" --project-id "$PROJECT_ID" --family-group all \
                --output-dir "$dir/out" > "$dir/handoff_stdout.txt" 2> "$dir/handoff_stderr.txt"
            code=$?
            set -e
            kill "$SAMPLER" 2>/dev/null || true
            wait "$SAMPLER" 2>/dev/null || true
            echo "handoff_exit_code=$code" | tee "$dir/exit_code.txt"
            grep -E "User time|System time|Elapsed \(wall|Maximum resident" "$dir/time_v.txt" || true
            if [ -f "$dir/rss_kb_timeline.txt" ]; then
              sort -k2 -n "$dir/rss_kb_timeline.txt" | tail -1 | awk '{printf "sampled_peak_rss_mb=%d\n", $2/1024}'
            fi
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-handoff-${{ matrix.project }}
          path: artifacts
          retention-days: 14

  compare:
    name: Compare every variant with base (outputs byte-identical; resources reported)
    needs: full-handoff
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: full-handoff-*
          path: artifacts
      - name: Compare deterministic outputs and report resources
        run: |
          python - <<'PY'
          import difflib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path("artifacts")
          VARIANTS = ("base", "AB", "AB_disabled", "AB_staged", "A", "B", "base2")

          def parse_time(text):
              def get(pattern):
                  match = re.search(pattern, text)
                  return None if not match else match.group(1)

              wall = get(r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\): ([\d:.]+)")
              seconds = None
              if wall:
                  seconds = 0.0
                  for part in wall.split(":"):
                      seconds = seconds * 60 + float(part)
              user, system = get(r"User time \(seconds\): ([\d.]+)"), get(r"System time \(seconds\): ([\d.]+)")
              cpu = None if user is None or system is None else float(user) + float(system)
              return seconds, cpu

          def sampled_peak_mib(directory):
              path = directory / "rss_kb_timeline.txt"
              if not path.exists():
                  return None
              values = [int(line.split()[1]) for line in path.read_text().splitlines() if len(line.split()) == 2]
              return max(values) / 1024.0 if values else None

          failures = []
          lines = []
          for project in ("3laurel", "q5446"):
              base_dir = root / f"full-handoff-{project}"
              lines += [f"### {project}", "| variant | code | gc | exit | wall | cpu (user+sys) | cpu/base | sampled peak RSS | rss/base | status | walls |",
                        "|---|---|---|---|---|---|---|---|---|---|---|"]
              measured = {}
              for variant in VARIANTS:
                  directory = base_dir / variant
                  if not directory.is_dir():
                      failures.append(f"{project}/{variant}: missing")
                      lines.append(f"| {variant} | - | - | - | - | - | - | - | - | MISSING | - |")
                      continue
                  exit_code = (directory / "exit_code.txt").read_text().strip().split("=")[-1] if (directory / "exit_code.txt").exists() else "?"
                  time_text = (directory / "time_v.txt").read_text() if (directory / "time_v.txt").exists() else ""
                  wall, cpu = parse_time(time_text)
                  peak = sampled_peak_mib(directory)
                  summary_path = directory / "out" / "production_summary.json"
                  status = walls = "-"
                  if summary_path.exists():
                      summary = json.loads(summary_path.read_text())
                      status = f"{summary.get('status')}/{summary.get('claim_status')}"
                      walls = f"{summary.get('canonical_wall_status')}:{(summary.get('canonical_counts') or {}).get('walls')}"
                  code = (directory / "code_sha.txt").read_text().strip()[:8]
                  mode = (directory / "gc_mode.txt").read_text().strip()
                  measured[variant] = (wall, cpu, peak, code, mode, exit_code, status, walls)
                  if exit_code != "0":
                      failures.append(f"{project}/{variant}: handoff exit code {exit_code}")
              base_wall, base_cpu, base_peak = measured.get("base", (None, None, None))[:3]
              for variant in VARIANTS:
                  if variant not in measured:
                      continue
                  wall, cpu, peak, code, mode, exit_code, status, walls = measured[variant]
                  fmt_wall = "-" if wall is None else f"{int(wall // 60)}:{wall % 60:04.1f}"
                  fmt_cpu = "-" if cpu is None else f"{cpu:,.0f} s"
                  cpu_ratio = "-" if not (cpu and base_cpu) else f"{cpu / base_cpu:.3f}"
                  fmt_peak = "-" if peak is None else f"{peak:,.0f} MiB"
                  rss_ratio = "-" if not (peak and base_peak) else f"{peak / base_peak:.3f}"
                  lines.append(f"| {variant} | {code} | {mode} | {exit_code} | {fmt_wall} | {fmt_cpu} | {cpu_ratio} | {fmt_peak} | {rss_ratio} | {status} | {walls} |")
              lines.append("")
              for variant in VARIANTS[1:]:
                  for name in ("production_summary.json", "source_attempt_preflight.json"):
                      base_path = base_dir / "base" / "out" / name
                      var_path = base_dir / variant / "out" / name
                      if not base_path.exists() or not var_path.exists():
                          failures.append(f"{project}/{variant}/{name}: missing on base or variant")
                          continue
                      if base_path.read_bytes() == var_path.read_bytes():
                          lines.append(f"- {project}/{variant}/{name}: BYTE-IDENTICAL to base ({base_path.stat().st_size} bytes)")
                      else:
                          failures.append(f"{project}/{variant}/{name}: differs from base")
                          diff = difflib.unified_diff(
                              base_path.read_text().splitlines(), var_path.read_text().splitlines(),
                              "base", variant, lineterm="",
                          )
                          lines.append(f"- {project}/{variant}/{name}: DIFFERS\n```diff\n" + "\n".join(diff) + "\n```")
              lines.append("")

          report = "\n".join(lines)
          print(report)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              Path(summary_file).write_text(report + "\n")
          if failures:
              print("FAILURES:", *failures, sep="\n  ")
              sys.exit(1)
          PY
