name: TEST GPT2 Maryborough Dense Lattice Shadow

on:
  pull_request:
    branches: [ main ]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run focused dense-lattice contract
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q tests/test_physical_wall_dense_lattice_shadow.py

  maryborough:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run exact Maryborough shadow census
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-dense-lattice-shadow
          git rev-parse HEAD > artifacts/gpt2-dense-lattice-shadow/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-dense-lattice-shadow/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_dense_lattice_shadow.py \
            | tee artifacts/gpt2-dense-lattice-shadow/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-dense-lattice-shadow
          path: artifacts/gpt2-dense-lattice-shadow
          retention-days: 1
