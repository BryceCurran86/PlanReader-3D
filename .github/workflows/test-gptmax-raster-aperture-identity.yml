name: GPT MAX Raster Aperture Identity Conflict
on:
  pull_request:
    paths:
      - pb_opening_host_frame_authority.py
      - pb_physical_wall_candidate_authority.py
      - pb_source_visibility_authority.py
      - pb_raster_source_wall_frame_projection.py
      - tests/test_raster_aperture_identity_conflict.py
      - tests/test_raster_connected_host_frame.py
      - tests/test_raster_source_wall_frame_projection.py
      - tests/test_raster_visibility_receipt_registration.py
      - tools/diag_opening_wall_face_preservation.py
      - pb_physical_opening_authority.py
      - scripts/gptmax_source_opposition_retention.py
      - tests/test_gptmax_source_opposition_retention.py
      - .github/workflows/test-gptmax-raster-aperture-identity.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gptmax-raster-aperture-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      ORT_DISABLE_TELEMETRY: "1"
      # Match required public CI: source omissions are not source verification.
      PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
      # Indexed owner receipts reject even harmless unindexed bytecode.
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Integrity and provider isolation
        # runner context is available at step scope, not job env.
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/planreader-pycache
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          python -m compileall -q .
          ruff check --select F821,F823 .
      - name: Full regression suite
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/planreader-pycache
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Smoke test
        run: python tests/ci_smoke.py
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Original Lot16 source-proof NOT RUN on public CI
        run: |
          set -euo pipefail
          echo '::notice::Original Lot16 source-proof NOT RUN on public CI; protected exact-head private replay required before release'
          echo 'Original Lot16 source-proof NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
  maryborough-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Original Maryborough source-proof NOT RUN on public CI
        run: |
          set -euo pipefail
          echo '::notice::Original Maryborough source-proof NOT RUN on public CI; protected exact-head private replay required before release'
          echo 'Original Maryborough source-proof NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
