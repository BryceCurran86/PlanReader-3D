name: DIAG Lot16 0630 FG

on:
  pull_request:
    branches:
      - gptmax/text-fix-plus-owned-compact-semantics-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace 0630 FG
        run: |
          PYTHONPATH=. python -u tools/diag_lot16_0630_fg.py
