name: TEST-ONLY Murera Room Area Production OCR

on:
  pull_request:
    branches: [main]

jobs:
  room-area-ocr:
    if: startsWith(github.head_ref, 'diag/murera-room-area-production-ocr')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run exact extractor OCR path on room area labels
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_drawing_ocr_evidence_layer import DrawingOCREngine
          from pb_explicit_floor_area_evidence import extract_explicit_floor_area_evidence

          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          want="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          p=Path("/tmp/murera.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-room-area-prod-ocr/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:p.write_bytes(r.read())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got!=want:raise SystemExit(got)

          doc=fitz.open(p); page=doc[227]
          ex=GenericPlanReaderExtractor()
          dpi=ex._memory_bounded_ocr_dpi(page)
          lines=DrawingOCREngine().recognize_page_rect(page,dpi=dpi)
          ocr_text="\n".join(str(row.get("text") or "") for row in lines)
          relevant=[
              row for row in lines
              if re.search(r"(?i)(laboratory|prep|store|m\s*2|m²|verand)",str(row.get("text") or ""))
          ]
          areaish=[
              row for row in lines
              if re.search(r"(?i)\b\d{1,3}(?:[.,]\d{1,2})?\s*m\s*(?:2|²)\b",str(row.get("text") or ""))
          ]
          current=extract_explicit_floor_area_evidence(ocr_text,source_page=228)
          print("MURERA_ROOM_AREA_PRODUCTION_OCR="+json.dumps({
              "sha":got,
              "dpi":dpi,
              "line_count":len(lines),
              "relevant":relevant,
              "areaish":areaish,
              "current_explicit_floor_area":None if current is None else current.__dict__,
              "ocr_excerpt":[str(row.get("text") or "") for row in lines if str(row.get("text") or "").strip()][:350],
          },sort_keys=True,default=str),flush=True)
          doc.close()
          PY
