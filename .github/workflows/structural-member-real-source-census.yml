name: Structural Member Real Source Census

on:
  pull_request:
    branches: [main]

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact official sources
        run: |
          curl -L --fail --retry 3 -o /tmp/kstvet.pdf "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          curl -L --fail --retry 3 -o /tmp/murera.pdf "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf" | sha256sum -c -
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf" | sha256sum -c -
      - name: Run source-only structural census
        run: |
          PYTHONPATH=. python scripts/structural_member_real_source_census.py --kstvet /tmp/kstvet.pdf --murera /tmp/murera.pdf | tee /tmp/structural-member-census.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-member-real-source-census
          path: /tmp/structural-member-census.json
