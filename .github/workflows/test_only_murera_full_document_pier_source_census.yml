name: TEST-ONLY Murera Full Document Pier Source Census

on:
  pull_request:
    branches: [main]

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact official Murera source
        run: |
          curl -fL --retry 3 --retry-delay 2 --max-time 900 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  murera.pdf' | sha256sum -c -
      - name: Census structural-member semantics across every source page
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import fitz
          from pb_page_title_authority import analyse_page

          payload=Path("murera.pdf").read_bytes()
          digest=hashlib.sha256(payload).hexdigest()
          assert digest=="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          doc=fitz.open(stream=payload,filetype="pdf")

          role_re=re.compile(r"\b(?:masonry\s+piers?|piers?|pillars?|columns?|posts?|stanchions?|CHS|SHS|RHS)\b",re.I)
          masonry_re=re.compile(r"\bmasonry\b",re.I)
          instance_re=re.compile(r"\b(?:P|PIER|C|COL|POST|CHS|SHS|RHS)[-_ ]?\d{1,3}[A-Z]?\b",re.I)
          count_re=re.compile(r"\b\d+\s*(?:No\.?s?|Nos?)\b",re.I)

          pages=[]
          for idx in range(doc.page_count):
              p=doc[idx]
              page_no=idx+1
              text=p.get_text("text") or ""
              role_hits=[]
              for bi,b in enumerate(p.get_text("blocks") or ()):
                  if len(b)<5: continue
                  t=" ".join(str(b[4]).split()).strip()
                  if not t: continue
                  if role_re.search(t) or masonry_re.search(t):
                      role_hits.append({
                          "block_index":bi,
                          "bbox":[round(float(v),2) for v in b[:4]],
                          "text":t[:1200],
                          "has_member_role":bool(role_re.search(t)),
                          "has_masonry":bool(masonry_re.search(t)),
                          "instance_marks":sorted(set(instance_re.findall(t))),
                          "count_tokens":sorted(set(count_re.findall(t))),
                      })
              if not role_hits:
                  continue
              analysis=analyse_page(p,page_no)
              pages.append({
                  "page":page_no,
                  "analysis_repr":repr(analysis),
                  "sheet_number":getattr(analysis,"sheet_number",""),
                  "sheet_number_source":getattr(analysis,"sheet_number_source",""),
                  "is_drawing_like":bool(p.get_drawings()),
                  "drawing_count":len(p.get_drawings() or ()),
                  "role_hits":role_hits,
              })

          report={
              "diagnostic_only":True,
              "do_not_merge":True,
              "source_sha256":digest,
              "page_count":doc.page_count,
              "semantic_page_count":len(pages),
              "semantic_pages":pages,
          }
          Path("murera-full-document-pier-source-census.json").write_text(json.dumps(report,indent=2,sort_keys=True),encoding="utf-8")
          print(json.dumps(report,indent=2,sort_keys=True))
          doc.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: murera-full-document-pier-source-census
          path: murera-full-document-pier-source-census.json
