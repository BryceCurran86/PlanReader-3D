name: TEST GPT3 Signed Customer Quotes
on:
  pull_request:
    paths:
      - 'tools/gpt3_verified_customer_quote.py'
      - 'tools/gpt3_customer_quote_scenarios.py'
      - 'tests/test_gpt3_verified_customer_quote.py'
      - 'tests/test_gpt3_customer_quote_scenarios.py'
      - '.github/workflows/test-gpt3-customer-quotes.yml'
  workflow_dispatch:

concurrency:
  group: gpt3-customer-quotes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-client-pricing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-neutral test requirements
        run: python -m pip install -e '.[dev]'
      - name: Run archived signed customer pricing tests
        run: python -m pytest -q tests/test_gpt3_verified_customer_quote.py tests/test_gpt3_customer_quote_scenarios.py
