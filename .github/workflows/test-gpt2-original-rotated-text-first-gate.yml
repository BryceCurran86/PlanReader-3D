name: TEST GPT2 Original FT3 Rotated Text First-Gate Delta

on:
  pull_request:
    paths:
      - tools/diag_original_rotated_text_first_gate_delta_shadow.py
      - tests/test_gpt2_original_rotated_text_first_gate_delta_shadow.py
      - .github/workflows/test-gpt2-original-rotated-text-first-gate.yml
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "tools/diag_original_rotated_text_first_gate_delta_shadow.py"
      - "tests/test_gpt2_original_rotated_text_first_gate_delta_shadow.py"
      - ".github/workflows/test-gpt2-original-rotated-text-first-gate.yml"
  workflow_dispatch:

jobs:
  native-pdf-text-integrity-difference:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.ORIGINAL_SOURCES_REPOSITORY != ''
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source tests
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: FT3 source original text-integrity proof only
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_rotated_text_first_gate_delta_shadow.py
          python -m tools.diag_original_rotated_text_first_gate_delta_shadow --pdf "$PDF" --source-sha256 "$SHA" --page 11 --literal FT3 --json /tmp/gpt2_ft3_rotated_source_reasons.json
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

      - name: Retain exact source FT3 gate comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-ft3-original-rotation-integrity-gates
          path: /tmp/gpt2_ft3_rotated_source_reasons.json
          if-no-files-found: warn

  original-source-not-verified:
    if: github.event_name == 'push' && vars.ORIGINAL_SOURCES_REPOSITORY == ''
    uses: ./.github/workflows/original-source-not-run.yml
    with:
      job: native-pdf-text-integrity-difference
