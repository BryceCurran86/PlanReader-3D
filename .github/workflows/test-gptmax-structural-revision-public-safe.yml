name: GPT MAX Structural Revision Reference Synthetic Safety
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gptmax_structural_reference_revision.py"
      - "tests/test_gptmax_structural_reference_revision.py"
      - ".github/workflows/test-gptmax-structural-revision-public-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-neutral-revision-abstain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pymupdf pytest ruff
      - name: Native-text source-role abstention regressions only
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gptmax_structural_reference_revision.py
          ruff check --select F821,F823 tools/diag_gptmax_structural_reference_revision.py tests/test_gptmax_structural_reference_revision.py
      - name: Original structural and architectural PDFs remain private
        run: |
          echo 'The original two-document source-byte checks have NOT RUN on this public PR.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A printed referenced revision is not a W4 host, cross-file SAME, opening width/height or signed area.' >> "$GITHUB_STEP_SUMMARY"
