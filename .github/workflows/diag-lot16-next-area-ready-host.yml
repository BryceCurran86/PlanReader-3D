name: DIAG Lot16 Next Area Ready Host

on:
  pull_request:
    branches:
      - gptmax/raster-source-primitive-local-owner-v2

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Inspect residual
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_next_area_ready_host.py | tee lot16-next-area-ready-host.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-next-area-ready-host
          path: lot16-next-area-ready-host.json
          retention-days: 1
