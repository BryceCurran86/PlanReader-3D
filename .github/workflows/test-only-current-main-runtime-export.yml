name: TEST ONLY Current Main Runtime Export

on:
  pull_request:
    branches:
      - main

jobs:
  export-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Record head
        run: git rev-parse HEAD > CURRENT_MAIN_SHA.txt
      - name: Pack checkout
        run: git archive --format=tar.gz -o current-main-runtime.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-runtime
          path: |
            current-main-runtime.tar.gz
            CURRENT_MAIN_SHA.txt
          retention-days: 1
