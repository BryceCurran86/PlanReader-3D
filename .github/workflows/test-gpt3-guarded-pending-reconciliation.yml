name: TEST GPT3 Guarded Pending Reconciliation

# Main-target synchronize gate: parent activation guard is already merged.

on:
  pull_request:
    branches:
      - main
      - gpt3/pending-identity-activation-guard-20261013
    paths:
      - "tools/run_gpt3_guarded_pending_reconciliation.py"
      - "tests/test_gpt3_guarded_pending_reconciliation.py"
      - ".github/workflows/test-gpt3-guarded-pending-reconciliation.yml"
      - "tools/prepare_gpt3_pending_identity_activation.py"
      - "docs/engineering/lot16_original_identity_reconciliation_20261012/**"
      - "benchmarks/frozen_holdout/full_plan_v2/**"
  workflow_dispatch:

concurrency:
  group: gpt3-guarded-pending-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Real seven-row guarded activation and exact replay
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_pending_identity_activation.py tests/test_gpt3_guarded_pending_reconciliation.py
          python -m compileall -q tools/prepare_gpt3_pending_identity_activation.py tools/run_gpt3_guarded_pending_reconciliation.py
          ruff check --select F821,F823 tools/prepare_gpt3_pending_identity_activation.py tools/run_gpt3_guarded_pending_reconciliation.py tests/test_gpt3_pending_identity_activation.py tests/test_gpt3_guarded_pending_reconciliation.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
