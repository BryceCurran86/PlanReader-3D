name: DIAG GPTMAX Lot16 Native Room Lines
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Inspect page 3 native room lines
        run: PYTHONPATH=. python -u tools/diag_gptmax_lot16_native_room_lines.py | tee lot16-native-room-lines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-native-room-lines
          path: lot16-native-room-lines.json
          retention-days: 2
