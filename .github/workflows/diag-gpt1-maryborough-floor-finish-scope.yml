name: DIAG GPT1 Maryborough Floor Finish Scope

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace material definitions and drawing occurrences
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import hashlib, json
          from pathlib import Path
          import fitz
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_material_semantic_authority import SourceMaterialSemanticProducer
          from pb_hosted_opening_instance_adapter import authoritative_floor_plan_viewports
          from pb_source_ceiling_finish_evidence import collect_source_owned_ceiling_finish_candidates
          from pb_migration_contracts import ViewportEvidence, ViewportResolutionStatus
          from pb_migration_provider_envelope import ProviderContext
          from pb_ceiling_lining_quantity import iter_explicit_ceiling_finish_matches
          from pb_source_observation_authority import ObservationSelector
          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_source_room_label_authority import _normalized_room_line
          from pb_viewport_segmentation import segment_page_viewports

          pdf=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          payload=pdf.read_bytes()
          sha=hashlib.sha256(payload).hexdigest()
          doc=fitz.open(stream=payload,filetype="pdf")
          try:
              page_ids=tuple(str(i+1) for i in range(doc.page_count))
          finally:
              doc.close()

          source=SourceVisibilityProducer(
              producer_method="gpt1-maryborough-floor-finish-scope-diag",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id=f"diag-maryborough:{sha[:32]}",
              source_bytes=payload,
              source_locator="memory://maryborough.pdf",
              page_ids=page_ids,
          )
          revision_id=published.revision.revision_id
          producer=SourceMaterialSemanticProducer.from_source_visibility_producer(source)
          producer.publish(revision_id)

          defs=[]
          for key,result in sorted(producer._definition_results.items()):
              r=result.record
              defs.append({
                  "status":getattr(result.status,"value",str(result.status)),
                  "reason_codes":list(result.reason_codes),
                  "code":None if r is None else r.code,
                  "description":None if r is None else r.description,
                  "substrate":None if r is None else r.substrate,
                  "finish":None if r is None else r.finish,
                  "semantic_finish":None if r is None else r.semantic_finish,
                  "source_page_ids":[] if r is None else list(r.source_page_ids),
                  "source_viewport_ids":[] if r is None else list(r.source_viewport_ids),
              })

          occurrences=[]
          for scope in producer.published_occurrence_results():
              for r in scope.records:
                  occurrences.append({
                      "scope_status":getattr(scope.status,"value",str(scope.status)),
                      "scope_complete":scope.scope_complete,
                      "scope_reason_codes":list(scope.reason_codes),
                      "page_id":r.page_id,
                      "viewport_id":r.viewport_id,
                      "code":r.code,
                      "semantic_finish":r.semantic_finish,
                      "raw_text":r.raw_text,
                      "bbox_pdf_pts":list(r.bbox_pdf_pts),
                      "definition_record_id":r.definition_record_id,
                  })

          current=source.published_snapshot_for_revision(revision_id)

          # Page-wide diagnostic census only: this does not mint authority.
          # It tells us whether reflected-ceiling/non-topology sheets contain
          # source-authenticated ceiling semantics and room labels that the
          # current floor-plan-only collector cannot see.
          text_auth=source.text_integrity_authority()
          line_map={}
          for observation_id in current.text_observation_ids:
              result=text_auth.resolve_text(ObservationSelector(
                  document_id=current.revision.document_id,
                  revision_id=current.revision.revision_id,
                  source_sha256=current.revision.source_sha256,
                  snapshot_id=current.snapshot.snapshot_id,
                  observation_id=observation_id,
              ))
              receipt=result.receipt
              if (
                  receipt is None
                  or receipt.block_no is None
                  or receipt.line_no is None
                  or receipt.word_no is None
              ):
                  continue
              key=(str(receipt.page_id),int(receipt.block_no),int(receipt.line_no))
              line_map.setdefault(key,[]).append((int(receipt.word_no),result,receipt))

          pagewide_semantics=[]
          raw_ceiling_semantics=[]
          for key,entries in sorted(line_map.items()):
              nums=[e[0] for e in entries]
              if len(nums)!=len(set(nums)):
                  continue
              ordered=sorted(entries,key=lambda e:e[0])
              if [e[0] for e in ordered] != list(range(ordered[0][0],ordered[-1][0]+1)):
                  continue
              raw_text=" ".join(str(e[2].raw_text or "").strip() for e in ordered)
              raw_matches=list(iter_explicit_ceiling_finish_matches(raw_text))
              if raw_matches:
                  raw_ceiling_semantics.append({
                      "page_id":key[0],
                      "block_no":key[1],
                      "line_no":key[2],
                      "raw_text":raw_text,
                      "ceiling_finish_matches":raw_matches,
                      "word_statuses":[getattr(e[1].status,"value",str(e[1].status)) for e in ordered],
                      "word_reason_codes":[list(e[1].reason_codes or ()) for e in ordered],
                  })
              if any(
                  e[1].status is not EvidenceResolutionStatus.CORROBORATED
                  or not str(e[1].trusted_text or "").strip()
                  for e in ordered
              ):
                  continue
              text=" ".join(str(e[1].trusted_text).strip() for e in ordered)
              boxes=[tuple(float(v) for v in (e[2].geometry or ())) for e in ordered]
              boxes=[b for b in boxes if len(b)>=4]
              if not boxes:
                  continue
              bbox=(min(b[0] for b in boxes),min(b[1] for b in boxes),
                    max(b[2] for b in boxes),max(b[3] for b in boxes))
              finish_matches=list(iter_explicit_ceiling_finish_matches(text))
              room_label=_normalized_room_line(text)
              if finish_matches or room_label is not None:
                  pagewide_semantics.append({
                      "page_id":key[0],
                      "block_no":key[1],
                      "line_no":key[2],
                      "text":text,
                      "bbox":list(bbox),
                      "ceiling_finish_matches":finish_matches,
                      "normalized_room_label":room_label,
                  })

          segmented_viewports=[]
          ceiling_scopes=[]
          doc=fitz.open(stream=payload,filetype="pdf")
          try:
              for index in range(doc.page_count):
                  page_no=index+1
                  for raw_view in segment_page_viewports(doc[index],page_number=page_no):
                      segmented_viewports.append({
                          "page_no":page_no,
                          "view_id":raw_view.view_id,
                          "view_type":raw_view.view_type,
                          "status":raw_view.status,
                          "label":raw_view.label,
                          "bbox":None if raw_view.bounding_box is None else list(raw_view.bounding_box),
                      })
                  for segmented in authoritative_floor_plan_viewports(doc[index],page_number=page_no):
                      if segmented.bounding_box is None:
                          continue
                      viewport_id=str(segmented.view_id or "").strip()
                      if not viewport_id:
                          continue
                      viewport=ViewportEvidence(
                          viewport_id=viewport_id,
                          document_id=current.revision.document_id,
                          page_id=str(page_no),
                          bbox=tuple(float(v) for v in segmented.bounding_box),
                          view_type="floor_plan",
                          status=ViewportResolutionStatus.RESOLVED,
                          evidence_ids=(),
                          confidence=float(segmented.confidence),
                      )
                      context=ProviderContext(
                          run_id=f"diag-ceiling:{page_no}:{viewport_id}",
                          workspace_id="diag",
                          project_id="diag",
                          document_id=current.revision.document_id,
                          source_sha256=current.revision.source_sha256,
                          revision_id=current.revision.revision_id,
                          current_revision_id=current.revision.revision_id,
                          selected_pages=(index,),
                          owned_viewport_ids=(viewport_id,),
                          evidence_snapshot_id=current.snapshot.snapshot_id,
                          owned_page_numbers=(page_no,),
                          viewport_page_ownership=((viewport_id,page_no),),
                      )
                      candidates=collect_source_owned_ceiling_finish_candidates(
                          source_visibility_producer=source,
                          context=context,
                          viewport=viewport,
                          page_no=page_no,
                      )
                      ceiling_scopes.append({
                          "page_no":page_no,
                          "viewport_id":viewport_id,
                          "bbox":list(segmented.bounding_box),
                          "candidate_count":len(candidates),
                          "candidates":[{
                              "evidence_id":a.evidence_id,
                              "raw_text":a.raw_text,
                              "normalized_value":a.normalized_value,
                              "bbox":list(a.bbox or ()),
                              "method":a.method,
                          } for a in candidates],
                      })
          finally:
              doc.close()

          print(json.dumps({
              "source_sha256":sha,
              "decoded_pages":list(published.coverage.decoded_pages),
              "definition_count":len(defs),
              "definitions":defs,
              "occurrence_count":len(occurrences),
              "occurrences":occurrences,
              "ceiling_viewport_scopes":ceiling_scopes,
              "pagewide_authenticated_room_and_ceiling_semantics":pagewide_semantics,
              "raw_ceiling_semantics":raw_ceiling_semantics,
              "segmented_viewports":segmented_viewports,
          },indent=2,sort_keys=True))
          PY
