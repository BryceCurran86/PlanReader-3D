name: TEST-ONLY Lamu Eave Endpoint Geometry

on:
  pull_request:
    branches: [main]

jobs:
  eave-endpoints:
    if: startsWith(github.head_ref, 'diag/lamu-eave-endpoints-current-633347')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect source-native elevation roofline endpoints
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request,math
          import fitz
          from pb_viewport_segmentation import segment_page_viewports
          from pb_source_roof_covering_authority import (
              extract_elevation_segments_from_page,
              get_elevation_viewport_search_bbox,
              resolve_gable_apex_in_viewport,
              _cluster_apex_candidates,
          )

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-eave-endpoints/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected: raise SystemExit(actual)

          def axis_segments(page,bbox):
              x0,y0,x1,y1=bbox
              hs=[]; vs=[]
              for drawing in page.get_drawings() or ():
                  for item in drawing.get("items",()) or ():
                      if not item or item[0]!="l" or len(item)<3: continue
                      a,b=item[1],item[2]
                      ax,ay,bx,by=map(float,(a.x,a.y,b.x,b.y))
                      if not (x0<=min(ax,bx) and max(ax,bx)<=x1 and y0<=min(ay,by) and max(ay,by)<=y1):
                          continue
                      length=math.hypot(bx-ax,by-ay)
                      if abs(by-ay)<=1.0 and length>=60.0:
                          hs.append({"p0":[round(ax,3),round(ay,3)],"p1":[round(bx,3),round(by,3)],"length":round(length,3)})
                      if abs(bx-ax)<=1.0 and length>=25.0:
                          vs.append({"p0":[round(ax,3),round(ay,3)],"p1":[round(bx,3),round(by,3)],"length":round(length,3)})
              hs.sort(key=lambda r:(r["p0"][1],-r["length"],min(r["p0"][0],r["p1"][0])))
              vs.sort(key=lambda r:(min(r["p0"][0],r["p1"][0]),-r["length"],min(r["p0"][1],r["p1"][1])))
              return hs,vs

          doc=fitz.open(stream=payload,filetype="pdf")
          out=[]
          for pidx in range(40,45):
              page=doc[pidx]
              vps=segment_page_viewports(page,page_number=pidx+1)
              for vp in vps:
                  if vp.view_type!="elevation": continue
                  bbox=get_elevation_viewport_search_bbox(vp,vps,page.rect)
                  diags,verts=extract_elevation_segments_from_page(page,bbox)
                  horizontals,structural_verticals=axis_segments(page,bbox)
                  ev,reasons=resolve_gable_apex_in_viewport(
                      diags,verts,
                      source_viewport_id=vp.view_id,
                      source_page=pidx+1,
                      source_scale_denominator=vp.scale_denominator,
                  )
                  row={
                      "page":pidx+1,"view_id":vp.view_id,"label":vp.label,
                      "bbox":bbox,"scale":vp.scale_denominator,
                      "diag_count":len(diags),"vertical_count":len(verts),
                      "resolve_reasons":reasons,
                      "evidence":None,
                      "apex_clusters":[],
                      "long_horizontals":horizontals[:120],
                      "structural_verticals":structural_verticals[:120],
                  }
                  if ev is not None:
                      support_span=abs(ev.right_support_xy[0]-ev.left_support_xy[0])
                      row["evidence"]={
                          "apex_xy":ev.apex_xy,"pitch_deg":ev.pitch_deg,
                          "left_run_pt":ev.left_run_pt,"right_run_pt":ev.right_run_pt,
                          "left_support_xy":ev.left_support_xy,
                          "right_support_xy":ev.right_support_xy,
                          "support_span_pt":support_span,
                      }
                  for apex,members in _cluster_apex_candidates(diags):
                      if ev is not None and math.hypot(apex[0]-ev.apex_xy[0],apex[1]-ev.apex_xy[1])>10:
                          continue
                      lows=[(m.direction,m.x_lo,m.y_lo,m.length,m.pitch_deg) for m in members]
                      left=[x for d,x,y,l,p in lows if d<0]
                      right=[x for d,x,y,l,p in lows if d>0]
                      row["apex_clusters"].append({
                          "apex":apex,
                          "member_count":len(members),
                          "members":[{
                              "dir":m.direction,
                              "hi":[m.x_hi,m.y_hi],
                              "lo":[m.x_lo,m.y_lo],
                              "length":m.length,
                              "pitch":m.pitch_deg,
                          } for m in members],
                          "outer_low_span_pt":(
                              max(right)-min(left) if left and right else None
                          ),
                      })
                  out.append(row)
          doc.close()
          print("LAMU_EAVE_ENDPOINT_GEOMETRY="+json.dumps({
              "production_sha":"633347965939aa4184d8edfc2330dd758601c1c9",
              "source_sha256":actual,
              "elevations":out,
          },sort_keys=True,default=str),flush=True)
          PY
