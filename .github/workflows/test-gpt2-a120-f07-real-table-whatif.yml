name: TEST GPT2 A120 Real-Table F07 Counterfactual

on:
  pull_request:
    paths:
      - tools/diag_gpt2_a120_multipath_frame_whatif_shadow.py
      - tests/test_gpt2_a120_multipath_frame_whatif_shadow.py
      - .github/workflows/test-gpt2-a120-f07-real-table-whatif.yml
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "tools/diag_gpt2_a120_multipath_frame_whatif_shadow.py"
      - "tests/test_gpt2_a120_multipath_frame_whatif_shadow.py"
      - ".github/workflows/test-gpt2-a120-f07-real-table-whatif.yml"
  workflow_dispatch:

jobs:
  original-source-f07-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact branch head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source regression dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Immutable A120 source and no authority promotion regression
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q -s tests/test_gpt2_a120_multipath_frame_whatif_shadow.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
