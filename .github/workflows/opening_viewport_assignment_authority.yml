name: Opening Viewport Assignment Authority

on:
  push:
    branches: [gpt/item19b-opening-viewport-assignment-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_opening_viewport_assignment_authority_v1.py             tests/test_physical_wall_candidate_viewport_scope_v1.py
