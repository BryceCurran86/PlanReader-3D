name: TEST-ONLY Lamu scale page-input cache gate

on:
  pull_request:
    branches:
      - perf/scale-page-input-index-v2

jobs:
  lamu-scale-cache-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact Lamu source
        run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
      - name: Compare shared vs fresh scale inputs
        run: |
          set -o pipefail
          timeout 900s env PYTHONPATH=$GITHUB_WORKSPACE python scripts/profile_lamu_scale_page_input_cache.py --repo $GITHUB_WORKSPACE --pdf /tmp/lamu.pdf | tee /tmp/lamu-scale-page-input-cache.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lamu-scale-page-input-cache
          path: /tmp/lamu-scale-page-input-cache.log
