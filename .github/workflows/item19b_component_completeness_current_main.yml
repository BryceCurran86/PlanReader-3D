name: Item19B Component Completeness Current Main

on:
  push:
    branches: [gpt/item19b-component-completeness-current-main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install rapidocr
      - name: Focused authority tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_wall_component_completeness_authority.py             tests/test_source_execution_callout_authority_v1.py             tests/test_wall_finish_callout_wall_authority_v1.py             tests/test_physical_wall_candidate_viewport_scope_v1.py
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Real KSTVET component-local completeness shadow
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_wall_finish_callout_wall_authority import WallFinishCalloutWallProducer
          from pb_wall_component_completeness_authority import (
              WallComponentCompletenessProducer,
              WallComponentCompletenessSelector,
          )

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-component-current-main",
              producer_version="1.0",
          )
          source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-component-current-main",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )

          started=time.perf_counter()
          callouts=WallFinishCalloutWallProducer.from_source_visibility_producer(
              source,page_ids=("54",)
          )
          component_producer=WallComponentCompletenessProducer.from_source_visibility_producer(
              source,page_ids=("54",)
          )
          component_authority=component_producer.authority()

          rows=[]
          for result in callouts.published_results():
              for binding in result.bindings:
                  selector=WallComponentCompletenessSelector(
                      document_id=binding.document_id,
                      revision_id=binding.revision_id,
                      source_sha256=binding.source_sha256,
                      snapshot_id=binding.snapshot_id,
                      page_id=binding.page_id,
                      decision_scope_id=binding.physical_wall_decision_scope_id,
                      physical_wall_id=binding.physical_wall_id,
                  )
                  comp=component_authority.resolve(selector)
                  rows.append({
                      "sequence":[
                          binding.source_execution_sequence_start,
                          binding.source_execution_sequence_end,
                      ],
                      "trade":binding.trade_scope_id,
                      "direction":binding.semantic_direction,
                      "viewport":binding.viewport_id,
                      "wall":binding.physical_wall_id,
                      "wall_scope":binding.physical_wall_decision_scope_id,
                      "component_status":comp.status.value,
                      "component_reasons":list(comp.reason_codes),
                      "component_id":comp.record.component_id if comp.record else None,
                      "component_walls":list(comp.record.member_wall_ids) if comp.record else [],
                      "scope_was_complete":comp.record.source_scope_complete if comp.record else None,
                      "scope_reasons":list(comp.record.source_scope_reason_codes) if comp.record else [],
                      "withheld_checked":len(comp.record.checked_withheld_observation_ids) if comp.record else 0,
                  })
          elapsed=time.perf_counter()-started
          print("ITEM19B_COMPONENT_BINDING_ROWS "+json.dumps(rows,sort_keys=True))
          print("ITEM19B_COMPONENT_ELAPSED_SEC",round(elapsed,3))

          internal=[
              row for row in rows
              if row["sequence"] == [10070,10078]
              and row["trade"] in {"internal_plaster","internal_paint"}
          ]
          assert {row["trade"] for row in internal} == {
              "internal_plaster","internal_paint"
          }, internal
          # This workflow discovers the local-completeness outcome. Do not
          # manufacture a positive by weakening abstention; print exact reasons.
          PY
