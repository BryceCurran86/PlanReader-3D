name: TEST-ONLY Lamu p44 wall stack sample

on:
  pull_request:
    branches:
      - perf/index-stage-a-collinear-merge

jobs:
  lamu-p44-wall-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact Lamu source
        run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
      - name: Sample p44 wall producer stack
        run: |
          set -o pipefail
          timeout 900s env PYTHONPATH=$GITHUB_WORKSPACE python scripts/profile_lamu_p44_wall_stack.py --repo $GITHUB_WORKSPACE --pdf /tmp/lamu.pdf --page 44 2>&1 | tee /tmp/lamu-p44-wall-stack.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lamu-p44-wall-stack-sample
          path: /tmp/lamu-p44-wall-stack.log
