name: GPT MAX Original Paired Wall Faces Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - pb_physical_opening_authority.py
      - pb_source_visibility_authority.py
      - tools/diag_gptmax_paired_outer_faces_quantity_shadow.py
      - tests/test_raster_paired_original_outer_faces_shadow.py
      - .github/workflows/test-gptmax-paired-original-wall-faces-shadow.yml
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  source-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_raster_paired_original_outer_faces_shadow.py tests/test_raster_framed_opening_g17_contract.py tests/test_raster_door_swing_g17_contract.py tests/test_source_visibility_authority.py tests/test_opening_host_frame_authority.py
          ruff check --select F821,F823 pb_physical_opening_authority.py pb_source_visibility_authority.py tools/diag_gptmax_paired_outer_faces_quantity_shadow.py tests/test_raster_paired_original_outer_faces_shadow.py
  original-source-retention-and-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Replay immutable original physical and quantity chains
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/diag_gptmax_paired_outer_faces_quantity_shadow.py --pdf "$PDF" --page-id 3 --output artifacts/original-paired-wall-faces-shadow.json
      - name: Verify source correction, protected receipts and explicit failure stages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/original-paired-wall-faces-shadow.json').read_text())
          assert p['status']=='UNPUBLISHED_SHADOW_REVIEW'
          assert p['primitive_safety_cap']==20000 and not p['count_granted'] and not p['production_activation_granted']
          assert p['snapshot_id']=='source_snapshot_3fcb6bc5c44b51d930e9600080501d27'
          assert p['original_baseline_published_snapshot']==p['candidate_published_snapshot']
          assert all(p['retention_observations'].values())
          a,b=p['baseline_receipts'],p['candidate_receipts']
          assert len(a['hosts'])==21 and len(b['hosts'])==22
          assert sum(bool(r['record_id']) for r in a['hosts'])==sum(bool(r['record_id']) for r in b['hosts'])==15
          assert sum(bool(r['record_id']) for r in a['frames'])==sum(bool(r['record_id']) for r in b['frames'])==9
          assert a['quantities']==b['quantities'] and len(a['quantities'])==8
          assert a['customer_rows']==b['customer_rows'] and a['sealed_run']==b['sealed_run']
          assert a['customer_verification']==b['customer_verification']
          assert sorted(q['value'] for q in b['quantities'])==[.54,.9,1.26,1.8,1.8,2.16,2.16,10.08]
          # Do not turn a known failed strict comparator into a success.
          old_id='physical_opening_existence_a68d0b7d738b5de9a1588b4e680e1a8f'
          assert not p['original_receipts_retained']
          assert p['first_original_receipt_retention_failure']=='original_hosts_receipt_changed:'+old_id
          assert {(r['family'],r['identity']) for r in p['original_receipt_differences']}=={('hosts',old_id),('canonical',old_id)}
          host_delta=next(r for r in p['original_receipt_differences'] if r['family']=='hosts')
          assert {k for k in host_delta['before'] if host_delta['before'][k]!=host_delta['after'][k]}=={'representative_observation_id'}
          assert host_delta['before']['record_id'] is None and host_delta['after']['record_id'] is None
          assert len(p['additional_physical_candidates'])==1
          n=p['additional_physical_candidates'][0]
          assert n['physical_opening_id']=='physical_opening_existence_993560b2bdf85cdd668047edd7043f81'
          assert n['physical_result']['existence_record']['snapshot_id']==p['snapshot_id']
          assert n['first_object_authority_failure']=='host_wall_identity' and n['quantity'] is None
          assert 'raster_source_band_left_source_primitive_unmapped' in n['original_host_producer_trace']['reason_codes']
          assert 'opening_host_frame_host_unavailable' in n['original_frame_producer_trace']['reason_codes']
          label=n['figured_label_result']['evidence']
          assert label['raw_text']=='2127 STACKER' and label['dimension_values_mm']==[2100.,2700.]
          assert label['area_m2']==5.67 and label['axis_order_resolved'] is False
          changed=[r for r in p['original_face_continuity_comparisons'] if r['original_common_row_continuity']!=r['paired_original_outer_face_continuity']]
          assert changed and all(r['original_common_row_continuity'] and not r['paired_original_outer_face_continuity'] for r in changed)
          assert {tuple(r['original_gap_box_pt']) for r in changed}=={(760.56,426.48,835.44,429.36)}
          for name in ('baseline_source_audit','candidate_source_audit'):
              assert not p[name]['raster_candidate_closure']['candidate_universe_complete']
          print({'new_physical':n['physical_opening_id'],'new_quantity':None,'first_object_gate':n['first_object_authority_failure'],'strict_retention_failure':p['first_original_receipt_retention_failure'],'accepted_quantities_retained':8})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-paired-wall-faces-shadow
          path: artifacts/original-paired-wall-faces-shadow.json
          retention-days: 21
