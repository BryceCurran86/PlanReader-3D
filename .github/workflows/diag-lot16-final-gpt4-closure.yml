name: DIAG Lot16 Final GPT4 Closure

on:
  pull_request:
    branches:
      - gpt4/raster-registration-detector-integration

jobs:
  close-lot16-gpt4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused GPT4 regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_opening_primitive_compaction.py \
            tests/test_raster_framed_opening_g17_contract.py \
            tests/test_raster_door_swing_g17_contract.py \
            tests/test_raster_swing_registration_authority.py \
            tests/test_raster_opening_split_centerline_host.py
      - name: Validate exact Lot16 raster page 3
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_swing_local_registration.py \
            | tee lot16-final-raster-page3.json
      - name: Run exact Lot16 all-family source-closed handoff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/lot16-final
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --project-id au_qld_lot16_power \
            --workspace-id 1 \
            --family-group all \
            --output-dir artifacts/lot16-final \
            | tee artifacts/lot16-final/handoff.stdout.json
      - name: Audit final opening dropouts
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_opening_dropout_matrix.py \
            | tee artifacts/lot16-final/opening-dropout-matrix.json
      - name: Require sealed two-opening result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/lot16-final")
          expected_sha = "10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"

          summary = json.loads((root / "production_summary.json").read_text())
          if summary.get("status") != "sealed":
              raise SystemExit(f"handoff not sealed: {summary.get('status')}")
          if summary.get("source_sha256") != expected_sha:
              raise SystemExit("Lot16 source SHA mismatch in production summary")
          error_message = str(summary.get("production_error_message") or "")
          if "raster opening primitive count exceeds safety bound" in error_message:
              raise SystemExit("raster primitive safety-bound blocker regressed")

          sealed_path = root / "au_qld_lot16_power.json"
          if not sealed_path.is_file():
              raise SystemExit("sealed Lot16 run missing")
          sealed = json.loads(sealed_path.read_text())
          opening_rows = [
              q for q in sealed.get("quantities", [])
              if str(q.get("family") or "") == "opening_area"
              and not bool(q.get("abstained", False))
          ]
          values = sorted(round(float(q["value"]), 6) for q in opening_rows)
          if values != [5.67, 10.08]:
              raise SystemExit(f"unexpected sealed opening areas: {values}")

          print("FINAL_PRODUCTION_SUMMARY")
          print(json.dumps({
              "status": summary.get("status"),
              "claim_status": summary.get("claim_status"),
              "canonical_counts": summary.get("canonical_counts"),
              "family_counts": summary.get("family_counts"),
              "combined_quantity_count": summary.get("combined_quantity_count"),
              "topology_pages": summary.get("topology_pages"),
              "execution_pages": summary.get("execution_pages"),
              "source_sha256": summary.get("source_sha256"),
          }, indent=2, sort_keys=True))
          print("FINAL_SEALED_OPENING_AREAS")
          print(json.dumps([
              {
                  "quantity_id": q.get("quantity_id"),
                  "value": q.get("value"),
                  "unit": q.get("unit"),
                  "semantic_key": q.get("semantic_key"),
                  "object_identity_refs": q.get("object_identity_refs"),
                  "lineage_ok": q.get("lineage_ok"),
              }
              for q in opening_rows
          ], indent=2, sort_keys=True))
          print("IDENTITY_MAP_CANDIDATES", [
              str(path) for path in Path(".").rglob("*identity_map*.json")
          ])
          PY
      - name: Upload final Lot16 GPT4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-final-gpt4-closure
          path: |
            lot16-final-raster-page3.json
            artifacts/lot16-final
          retention-days: 2
