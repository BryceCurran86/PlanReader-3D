name: DIAG GPT1 Lot16 Room Area Scope

on:
  push:
    branches:
      - diag/gpt1-lot16-room-area-scope-v1

concurrency:
  group: diag-gpt1-lot16-room-area-scope
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Inspect Lot16 source page scope
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          from pb_source_floor_plan_page_scope import (
              classify_source_floor_plan_pages,
          )
          from pb_viewport_segmentation import segment_page_viewports

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          doc=fitz.open(path)
          try:
              scope=classify_source_floor_plan_pages(doc, tuple(range(doc.page_count)))
              rows=[]
              for decision in scope.decisions:
                  page=doc[decision.page_index]
                  viewports=segment_page_viewports(
                      page,
                      page_number=decision.page_index+1,
                  )
                  rows.append({
                      "page":decision.page_index+1,
                      "classification":decision.classification,
                      "reason_code":decision.reason_code,
                      "title":decision.title,
                      "view_types":list(decision.view_types),
                      "segmented_viewports":[
                          {
                              "view_id":v.view_id,
                              "view_type":v.view_type,
                              "status":v.status,
                              "label":v.label,
                              "has_bbox":v.bounding_box is not None,
                          }
                          for v in viewports
                      ],
                  })
              out={
                  "page_count":doc.page_count,
                  "topology_page_indices":[x+1 for x in (scope.topology_page_indices() or ())],
                  "evidence_page_indices":[x+1 for x in scope.evidence_page_indices],
                  "room_area_support_page_indices":[x+1 for x in scope.room_area_support_page_indices],
                  "decisions":rows,
              }
              print(json.dumps(out,indent=2,sort_keys=True))
          finally:
              doc.close()
          PY
