name: TEST-ONLY Canonical Five Post-1073

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  canonical-five-sealed-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download original completed canonical-five artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BryceCurran86/PlanReader-3D/actions/artifacts/11073553688/zip \
            -o /tmp/canonical-five-sealed.zip

      - name: Validate sealed canonical-five coverage using serialized schema
        env:
          SEALED_ARTIFACT: /tmp/canonical-five-sealed.zip
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile
          
          artifact = Path(os.environ["SEALED_ARTIFACT"])
          expected_digest = "da2cafcae7c9f6ed0330229824f11caae97d49d3b8fdec2d649d88b019db77a1"
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == expected_digest
          with ZipFile(artifact) as archive:
              assert archive.testzip() is None
              data = json.loads(archive.read("canonical-five-results/headline_accuracy_dashboard.json"))
          assert data["evaluated_commit_sha"] == "7e7ede1be59657744a4e48006c150445ff9248ff"
          assert data["scoring_policy_identifier"] == "public_tender_exact_or_within_5pct_v1"
          metrics = data["headline_metrics"]
          coverage = data["summary_counts"]
          reports = data["headline_reports"]
          assert metrics["total_headline_benchmarks"] == 5
          assert coverage["headline_benchmarks"] == 5
          assert coverage["headline_coverage_complete"] is True
          assert coverage["incomplete_headline_benchmarks"] == 0
          assert coverage["incomplete_headline_benchmark_ids"] == []
          assert metrics["total_items_compared"] == 60
          expected = {
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          }
          assert len(reports) == 5
          assert {r["benchmark_id"] for r in reports} == expected
          for report in reports:
              assert report["status"] == "scored"
              assert report["is_scored"] is True
              assert report["is_headline_eligible"] is True
              assert report["errors"] == []
          for key in ("total_items_compared", "exact_matches", "within_5_percent",
                      "within_10_percent", "within_20_percent", "gross_mismatches",
                      "missed_items", "hallucinated_items"):
              assert sum(r["summary"][key] for r in reports) == metrics[key]
          summary = {
              "production_base_sha": "9c19e9e59861bd3764fbc488e46e2aba9ebda7f1",
              "original_extraction_head_sha": "ee6b3ed6c0eb263ac11a8a1e62a98f02ed39176f",
              "evaluated_commit_sha": data["evaluated_commit_sha"],
              "artifact_id": 11073553688,
              "artifact_sha256": expected_digest,
              "accuracy": metrics["overall_accuracy_percentage"],
              "strict_exact": metrics["strict_exact_accuracy_percentage"],
              "compared": metrics["total_items_compared"],
              "exact": metrics["exact_matches"],
              "within_5": metrics["within_5_percent"],
              "within_10": metrics["within_10_percent"],
              "within_20": metrics["within_20_percent"],
              "gross": metrics["gross_mismatches"],
              "missed": metrics["missed_items"],
              "hallucinated": metrics["hallucinated_items"],
              "projects": {r["benchmark_id"]: r["summary"] for r in reports},
          }
          print("CANONICAL_FIVE_VALID=1")
          print("CANONICAL_FIVE_JSON=" + json.dumps(summary, sort_keys=True))
          Path("/tmp/canonical-five-validated.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-five-post-1073-validated
          path: /tmp/canonical-five-validated.json
          if-no-files-found: error
