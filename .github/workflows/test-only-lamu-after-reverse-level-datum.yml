name: TEST-ONLY Lamu After Reverse Level Datum

on:
  pull_request:
    branches: [main]

jobs:
  lamu:
    if: startsWith(github.head_ref, 'diag/lamu-after-reverse-level-datum')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Lamu benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_secondary_footprint_evidence import resolve_secondary_footprint_width_m
          from pb_viewport_segmentation import segment_page_viewports
          from pb_figured_dimension_evidence import extract_dimension_evidence_bundle, calibrate_dimension_layout
          from pb_wall_height_evidence import resolve_wall_height_dimension_m

          benchmark_id="tenders_ke_lamu_ishakani_ecd_classrooms"
          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-full-matrix/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/lamu.pdf"); source.write_bytes(payload)
          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/lamu-results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              auto_extract=True,
          )
          items={i.item_id:i.to_dict() for i in report.item_results}
          out={
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "exact":int(report.exact_matches),
              "within_5":int(report.within_5_percent),
              "gross":int(report.gross_mismatches),
              "missed":int(report.missed_items),
              "hallucinated":int(report.hallucinated_items),
              "items":items,
          }
          print("LAMU_AFTER_REVERSE_LEVEL_DATUM="+json.dumps(out,sort_keys=True),flush=True)
          extractor=GenericPlanReaderExtractor()
          predictions=extractor.extract_from_pdf(source)
          focus={}
          for p in predictions:
              if p.tag in {"perimeter_walling","damp_proof_course","internal_plaster","internal_paint","D1","chalkboard","floor_screed","roof_covering"}:
                  focus[p.tag]={
                      "quantity":p.quantity,
                      "unit":p.unit,
                      "source_page":p.source_page,
                      "dimensions":p.dimensions,
                      "confidence":p.confidence,
                      "metadata":p.metadata,
                  }
          detail={
              "focus_predictions":focus,
              "extraction_status":extractor.extraction_status,
              "physical_net_wall_live":getattr(extractor,"physical_net_wall_live",None),
          }
          print("LAMU_WALL_DETAIL="+json.dumps(detail,sort_keys=True,default=str),flush=True)
          import fitz
          doc=fitz.open(source)
          try:
              page=doc[40]
              sec=resolve_secondary_footprint_width_m(page,page_num=41)
              viewports=segment_page_viewports(page,page_number=41)
              bundle=extract_dimension_evidence_bundle(page,page_num=41,view_id=None,view_type=None)
              labels=[w for w in page.get_text("words") if "verand" in str(w[4]).lower()]
              sec_detail={
                  "resolved":None if sec is None else {
                      "label_text":sec.label_text,
                      "width_m":sec.width_m,
                      "view_id":sec.view_id,
                      "edge":sec.edge,
                      "chain_id":sec.chain_id,
                      "binding_status":sec.binding_status,
                      "label_bbox":sec.label_bbox,
                      "notes":sec.notes,
                  },
                  "labels":labels,
                  "viewports":[{
                      "view_id":v.view_id,
                      "view_type":v.view_type,
                      "status":v.status,
                      "bbox":v.bounding_box,
                  } for v in viewports],
                  "observations":[{
                      "id":o.dimension_id,
                      "value_m":o.value_m,
                      "bbox":o.bbox,
                      "orientation":getattr(o,"orientation",None),
                      "endpoints":getattr(o,"endpoints",None),
                  } for o in bundle.observations],
                  "bindings":[{
                      "observation_id":b.observation_id,
                      "status":b.status,
                      "reason_codes":getattr(b,"reason_codes",None),
                  } for b in bundle.bindings],
              }
              print("LAMU_VERANDAH_DETAIL="+json.dumps(sec_detail,sort_keys=True,default=str),flush=True)
              words=page.get_text("words")
              height_words=[w for w in words if str(w[4]).strip().lower().strip(".,:;") in {"height","ht"}]
              elevation_vps=[v for v in viewports if v.view_type in {"elevation","section"} and v.bounding_box is not None]
              wall_height_probes=[]
              for v in elevation_vps:
                  ev=resolve_wall_height_dimension_m(page,page_num=41,target_geometry_bbox=v.bounding_box)
                  wall_height_probes.append({
                      "view_id":v.view_id,
                      "view_type":v.view_type,
                      "status":v.status,
                      "bbox":v.bounding_box,
                      "result":None if ev is None else {
                          "height_m":ev.height_m,
                          "label_text":ev.label_text,
                          "chain_id":ev.chain_id,
                          "binding_status":ev.binding_status,
                          "label_bbox":ev.label_bbox,
                      },
                  })
              print("LAMU_HEIGHT_DETAIL="+json.dumps({"height_words":height_words,"probes":wall_height_probes},sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          scoped={}
          for label,page_index in (("classrooms",40),("toilets",41)):
              ex=GenericPlanReaderExtractor()
              ps=ex.extract_from_pdf(source,pages=[page_index])
              scoped[label]={
                  "predictions":{
                      p.tag:{
                          "quantity":p.quantity,
                          "unit":p.unit,
                          "dimensions":p.dimensions,
                          "source_page":p.source_page,
                          "metadata":p.metadata,
                      }
                      for p in ps
                      if p.tag in {"perimeter_walling","damp_proof_course","internal_plaster","internal_paint","floor_screed"}
                  },
                  "status":ex.extraction_status,
              }
          print("LAMU_SCOPED_BUILDINGS="+json.dumps(scoped,sort_keys=True,default=str),flush=True)
          PY
