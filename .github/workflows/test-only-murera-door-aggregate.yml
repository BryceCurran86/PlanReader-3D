name: TEST-ONLY Murera Door Aggregate Evidence

on:
  pull_request:
    branches: [main]

jobs:
  murera-door-evidence:
    if: startsWith(github.head_ref, 'diag/murera-door-aggregate-current')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Probe SHA-pinned Murera door evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          import fitz

          from pb_plan_opening_instance_marks import (
              extract_plan_instance_opening_totals,
              package_documents_door_system,
          )
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor

          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected_sha="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-door-evidence/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/murera.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          extractor=GenericPlanReaderExtractor()
          try:
              candidate_pages=[
                  p for p in range(218,238)
                  if extractor.is_drawing_page(doc[p].get_text("text"),doc[p])
              ]
              texts=[doc[p].get_text("text") or "" for p in candidate_pages]
              totals=extract_plan_instance_opening_totals(doc,candidate_pages)
              schedule=GenericScheduleTableExtractor().extract_from_document(
                  doc,pages=candidate_pages
              )
              door_rows=[r.to_dict() for r in schedule if r.trade_type=="doors"]
              door_text=[]
              for p in candidate_pages:
                  txt=doc[p].get_text("text") or ""
                  lines=[
                      ln.strip() for ln in txt.splitlines()
                      if re.search(r"\b(?:door|D[- ]?\d|flush|panelled|casement)\b",ln,re.I)
                  ]
                  if lines:
                      door_text.append({"page":p+1,"lines":lines[:100]})
              out={
                  "source_sha256":actual,
                  "candidate_pages":[p+1 for p in candidate_pages],
                  "package_documents_door_system":package_documents_door_system(texts),
                  "plan_totals":None if totals is None else {
                      "window_count":totals.window_count,
                      "door_count":totals.door_count,
                      "window_types":list(totals.window_types),
                      "door_types":list(totals.door_types),
                      "source_page":totals.source_page,
                      "evidence_text":totals.evidence_text,
                  },
                  "schedule_door_rows":door_rows,
                  "native_door_text":door_text,
              }
              print("MURERA_DOOR_EVIDENCE="+json.dumps(out,sort_keys=True),flush=True)
          finally:
              doc.close()
          PY