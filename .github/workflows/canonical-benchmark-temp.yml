name: Canonical Benchmark Temporary

on:
  push:
    branches:
      - diag/canonical-benchmark-20260925

jobs:
  canonical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Prepare canonical five-project suite and verify sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, time, urllib.request

          ids = [
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          ]

          source_base = Path("benchmarks/public_tenders")
          suite = Path("/tmp/planreader-canonical-five")
          sources = Path("benchmarks/sources")
          suite.mkdir(parents=True, exist_ok=True)
          sources.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_base / "manifest.json", suite / "manifest.json")

          for benchmark_id in ids:
              src = source_base / benchmark_id
              dst = suite / benchmark_id
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(src, dst)

              manifest = json.loads((src / "download_manifest.json").read_text(encoding="utf-8"))
              url = manifest["source_url"]
              unique = {}
              for doc in manifest.get("documents", []):
                  filename = str(doc.get("filename") or "").strip()
                  sha = str(doc.get("sha256") or "").strip().lower()
                  if filename:
                      unique[filename] = sha

              for filename, expected_sha in unique.items():
                  target = sources / filename
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent":"Mozilla/5.0 PlanReaderBenchmark/1.0"},
                  )
                  last = None
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(req, timeout=180) as resp:
                              payload = resp.read()
                          actual = hashlib.sha256(payload).hexdigest()
                          if expected_sha and actual != expected_sha:
                              raise RuntimeError(
                                  f"SHA mismatch for {filename}: {actual} != {expected_sha}"
                              )
                          target.write_bytes(payload)
                          print(
                              f"VERIFIED {benchmark_id} {filename} "
                              f"bytes={len(payload)} sha256={actual}"
                          )
                          break
                      except Exception as exc:
                          last = exc
                          if target.exists():
                              target.unlink()
                          if attempt < 2:
                              time.sleep(5 * (attempt + 1))
                  else:
                      raise SystemExit(
                          f"FAILED {benchmark_id}: {url} -> {filename}: {last}"
                      )
          PY

      - name: Run canonical five-project benchmark --all
        run: |
          rm -rf benchmark_results/canonical-five-current
          mkdir -p benchmark_results/canonical-five-current
          set -o pipefail
          python pb_benchmark_accuracy_engine.py \
            --all \
            --require-local-sources \
            --benchmarks-dir /tmp/planreader-canonical-five \
            --output-dir benchmark_results/canonical-five-current \
            2>&1 | tee benchmark_results/canonical-five-current/canonical-run.log

      - name: Upload canonical benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-five-current-main
          path: benchmark_results/canonical-five-current/
          if-no-files-found: warn
