name: GPT1 Original Lot16 Three-Family Quantity First Failures

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gpt1-lot16-original-three-family-first-failure.yml"
      - "tools/diag_lot16_room_face_scope.py"
      - "pb_source_figured_plan_plane_shadow.py"
      - "tests/test_gpt1_source_figured_plan_plane_shadow.py"
      - "tests/test_gpt1_source_owned_figured_plan_bridge.py"
      - "pb_figured_dimension_scale_consistency_shadow.py"
      - "tests/test_gpt1_figured_dimension_scale_consistency_shadow.py"
      - "pb_live_canonical_floor_surface.py"
      - "pb_live_ceiling_lining_integration.py"
      - "pb_live_opening_area_quantity_publication.py"
      - "tests/test_gpt1_lot16_three_family_workflow_private_provision_20261031.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt1-lot16-three-family-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install source-free dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Test original quantity first-failure source-neutral boundaries
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gpt1_figured_dimension_scale_consistency_shadow.py tests/test_gpt1_source_figured_plan_plane_shadow.py tests/test_gpt1_source_owned_figured_plan_bridge.py tests/test_gpt1_lot16_three_family_workflow_private_provision_20261031.py
      - name: Check frozen V2 truth integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
