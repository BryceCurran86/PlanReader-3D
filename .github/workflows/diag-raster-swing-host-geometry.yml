name: DIAG Raster Swing Host Geometry

on:
  pull_request:
    branches:
      - gpt4/raster-swing-host-geometry-v1

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run raster host-geometry regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_raster_swing_host_geometry_contract.py             tests/test_raster_opening_host_geometry_contract.py
