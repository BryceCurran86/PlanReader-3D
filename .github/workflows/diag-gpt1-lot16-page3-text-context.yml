name: DIAG GPT1 Lot16 Page3 Text Context

on:
  push:
    branches:
      - diag/gpt1-lot16-page3-text-context-v1

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PyMuPDF
        run: pip install PyMuPDF==1.28.0
      - name: Inspect page 3 native text
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, re
          from pathlib import Path
          import fitz

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          doc=fitz.open(path)
          try:
              page=doc[2]
              words=list(page.get_text("words") or ())
              grouped={}
              for w in words:
                  key=(int(w[5]),int(w[6]))
                  grouped.setdefault(key,[]).append(w)
              rows=[]
              targets=re.compile(r"\b(?:ENS|ENSUITE|WIR|GARAGE|TILES?|VINYL|RAKED|FLAT|CEILING)\b",re.I)
              for (block,line), ws in sorted(grouped.items()):
                  ws=sorted(ws,key=lambda w:(int(w[7]),float(w[0])))
                  text=" ".join(str(w[4]) for w in ws)
                  if targets.search(text):
                      rows.append({
                          "block":block,
                          "line":line,
                          "text":text,
                          "bbox":[
                              min(float(w[0]) for w in ws),
                              min(float(w[1]) for w in ws),
                              max(float(w[2]) for w in ws),
                              max(float(w[3]) for w in ws),
                          ],
                          "words":[{
                              "text":str(w[4]),
                              "bbox":[float(w[0]),float(w[1]),float(w[2]),float(w[3])],
                              "word_no":int(w[7]),
                          } for w in ws],
                      })
              # Also capture numeric lines in adjacent native blocks/lines.
              interesting_blocks={row["block"] for row in rows}
              neighbors=[]
              for (block,line), ws in sorted(grouped.items()):
                  if not any(abs(block-b)<=2 for b in interesting_blocks):
                      continue
                  ws=sorted(ws,key=lambda w:(int(w[7]),float(w[0])))
                  text=" ".join(str(w[4]) for w in ws)
                  if re.search(r"\b\d{2,5}\b",text):
                      neighbors.append({
                          "block":block,
                          "line":line,
                          "text":text,
                          "bbox":[
                              min(float(w[0]) for w in ws),
                              min(float(w[1]) for w in ws),
                              max(float(w[2]) for w in ws),
                              max(float(w[3]) for w in ws),
                          ],
                      })
              print(json.dumps({"target_lines":rows,"nearby_numeric_lines":neighbors},indent=2,sort_keys=True))
          finally:
              doc.close()
          PY
