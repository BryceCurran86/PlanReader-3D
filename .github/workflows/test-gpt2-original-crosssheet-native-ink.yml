name: TEST GPT2 Original Crosssheet Wall Ink Registration

on:
  pull_request:
    paths:
      - tools/diag_original_crosssheet_native_ink_registration_shadow.py
      - tests/test_gpt2_original_crosssheet_native_ink_registration.py
      - .github/workflows/test-gpt2-original-crosssheet-native-ink.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exact-source-p7-p11-native-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact original source branch head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Immutable source ink fingerprint positive and rivals
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_crosssheet_native_ink_registration.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
