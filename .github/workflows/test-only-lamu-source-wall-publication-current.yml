name: TEST-ONLY Lamu Source Wall Publication Current

on:
  pull_request:
    branches: [main]

jobs:
  lamu-wall-publication:
    if: startsWith(github.head_ref, 'diag/lamu-source-wall-publication-current')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compose source-owned Lamu external net wall publication
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.request

          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_live_physical_opening_void_composition import compose_live_physical_opening_voids
          from pb_live_opening_deduction_composition import compose_live_opening_deductions
          from pb_live_gross_wall_geometry_composition import compose_live_gross_wall_geometry
          from pb_live_net_wall_boolean_composition import compose_live_net_wall_boolean_union
          from pb_live_whole_wall_role_composition import compose_live_whole_wall_roles
          from pb_live_external_net_wall_publication import compose_live_external_net_wall_publication
          from pb_live_external_physical_net_wall_publication import compose_live_external_physical_net_wall_publication

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-source-wall-publication/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")

          source=SourceVisibilityProducer(
              producer_method="lamu-source-wall-publication-diagnostic",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="lamu-source-wall-publication",
              source_bytes=payload,
              source_locator=url,
          )
          page_ids=tuple(str(i) for i in range(41,46))
          wall_opening=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=page_ids,
          )
          voids=compose_live_physical_opening_voids(
              source_visibility_producer=source,
              wall_opening_composition=wall_opening,
          )
          deductions=compose_live_opening_deductions(
              source_visibility_producer=source,
              wall_opening_composition=wall_opening,
              physical_void_composition=voids,
              target_scope_ids=("walls",),
          )
          gross=compose_live_gross_wall_geometry(
              source_visibility_producer=source,
              wall_opening_composition=wall_opening,
              physical_void_composition=voids,
          )
          roles=compose_live_whole_wall_roles(gross_wall_composition=gross)
          net=compose_live_net_wall_boolean_union(
              wall_opening_composition=wall_opening,
              physical_void_composition=voids,
              opening_deduction_composition=deductions,
              gross_wall_composition=gross,
          )
          external=compose_live_external_net_wall_publication(
              gross_wall_composition=gross,
              net_wall_composition=net,
              whole_wall_role_composition=roles,
              target_scope_id="walls",
          )
          physical=compose_live_external_physical_net_wall_publication(
              wall_opening_composition=wall_opening,
              physical_void_composition=voids,
              gross_wall_composition=gross,
              whole_wall_role_composition=roles,
          )
          def stat(obj):
              return {
                  "status": getattr(getattr(obj,"status",None),"value",str(getattr(obj,"status",None))),
                  "reason_codes": list(getattr(obj,"reason_codes",()) or ()),
              }
          result={
              "source_sha256":actual,
              "wall_opening":stat(wall_opening),
              "voids":stat(voids),
              "deductions":stat(deductions),
              "gross":{**stat(gross),"trace_count":len(gross.traces)},
              "roles":{**stat(roles),"trace_count":len(roles.traces)},
              "net":{**stat(net),"trace_count":len(net.traces)},
              "external":{
                  **stat(external),
                  "external_wall_ids":list(external.external_wall_ids),
                  "quantity":(
                      external.quantity_evidence.to_dict()
                      if external.quantity_evidence is not None else None
                  ),
              },
              "physical":{
                  **stat(physical),
                  "external_wall_ids":list(physical.external_wall_ids),
                  "quantity":(
                      physical.quantity_evidence.to_dict()
                      if physical.quantity_evidence is not None else None
                  ),
              },
          }
          print("LAMU_SOURCE_WALL_PUBLICATION="+json.dumps(result,sort_keys=True),flush=True)
          PY
