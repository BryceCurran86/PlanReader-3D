name: DIAG Lot16 Two Face Lineage Host Shadow

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact two-face lineage shadow
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_two_face_lineage_host_shadow.py \
            | tee lot16-two-face-lineage-host-shadow.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-two-face-lineage-host-shadow
          path: lot16-two-face-lineage-host-shadow.json
          retention-days: 2
