name: TEST ONLY Maryborough Room Support Matrix

on:
  pull_request:
    branches:
      - main

jobs:
  support_page:
    name: support page ${{ matrix.page }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Exact-source validation only. Human PDF page numbers, not production logic.
        page: [9, 11, 24, 25, 26, 27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run isolated support-page claim
        shell: bash
        run: |
          mkdir -p "artifacts/p${{ matrix.page }}"
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee "artifacts/p${{ matrix.page }}/run.log"
          import json, time, hashlib
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          source = Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          payload = source.read_bytes()
          print(json.dumps({
              "stage":"source",
              "sha256":hashlib.sha256(payload).hexdigest(),
              "support_page":int("${{ matrix.page }}"),
          }, sort_keys=True), flush=True)

          support_index = int("${{ matrix.page }}") - 1
          started=time.perf_counter()
          claim=collect_live_physical_net_wall_claim(
              source,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=(support_index,),
          )
          elapsed=time.perf_counter()-started

          labeled=[
              {
                  "label":room.room_label,
                  "physical_room_id":room.physical_room_id,
                  "source_room_face_record_id":room.source_room_face_record_id,
                  "page_id":room.page_id,
              }
              for room in claim.canonical_rooms
              if str(room.room_label or "").strip()
          ]
          firm=[
              {
                  "quantity_id":q.quantity_id,
                  "value":q.value,
                  "unit":q.unit,
                  "authority":q.authority,
                  "room_label":dict(q.metadata or {}).get("room_label"),
                  "figured_dimension_ids":dict(q.metadata or {}).get("figured_dimension_ids"),
              }
              for q in claim.room_area_quantity_evidence
              if not q.abstained and q.value is not None
          ]
          floors=[
              {
                  "canonical_floor_id":floor.canonical_floor_id,
                  "room_entity_id":floor.room_entity_id,
                  "metric_area_m2":floor.metric_area_m2,
                  "metric_area_quantity_id":floor.metric_area_quantity_id,
              }
              for floor in claim.canonical_floors
              if floor.metric_area_m2 is not None
          ]
          print(json.dumps({
              "stage":"result",
              "elapsed_seconds":elapsed,
              "status":getattr(claim.status,"value",str(claim.status)),
              "canonical_rooms":len(claim.canonical_rooms),
              "labeled_rooms":labeled,
              "firm_room_areas":firm,
              "metric_floors":floors,
          }, sort_keys=True), flush=True)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maryborough-room-support-p${{ matrix.page }}
          path: artifacts/p${{ matrix.page }}
          retention-days: 1
