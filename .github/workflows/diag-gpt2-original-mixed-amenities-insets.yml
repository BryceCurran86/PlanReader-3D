name: DIAG GPT2 Original Amenities Mixed Plan Inset

on:
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "tools/diag_gpt2_original_mixed_amenities_insets.py"
      - "tests/test_gpt2_original_mixed_amenities_insets.py"
      - ".github/workflows/diag-gpt2-original-mixed-amenities-insets.yml"
  pull_request:
    paths:
      - tools/diag_gpt2_original_mixed_amenities_insets.py
      - tests/test_gpt2_original_mixed_amenities_insets.py
      - .github/workflows/diag-gpt2-original-mixed-amenities-insets.yml
  workflow_dispatch:

jobs:
  original-mixed-inset-proof:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.ORIGINAL_SOURCES_REPOSITORY != ''
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Synthetic and frozen truth-separation
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt2_original_mixed_amenities_insets.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
      - name: Original Maryborough A500-A503 source-only
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          OUT=artifacts/gpt2-original-mixed-amenities
          mkdir -p "$OUT"
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -u -m tools.diag_gpt2_original_mixed_amenities_insets --pdf "$PDF" --sha256 "$SHA" --output "$OUT/source.json"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/gpt2-original-mixed-amenities/source.json').read_text())
          assert a['source_sha256']=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert a['source_original_pdf_page_count']==31
          assert a['candidate_source_page_universe']==[24,25,26,27]
          assert a['diagnostic_only'] and not a['uses_frozen_gold']
          assert a['new_physical_room_correspondence']==0
          assert a['new_room_area_quantities']==0
          assert a['new_floor_finish_quantities']==0
          assert a['new_customer_rows']==0
          assert all(not item['actual_source_endpoint_bracket_binding_proven'] for item in a['original_mixed_elevation_sheets'])
          assert all(not item['plan_inset_to_main_floor_physical_room_proven'] for item in a['original_mixed_elevation_sheets'])
          print('GTP2_ORIGINAL_AMENITIES_MIXED_INSET_NO_QUANTITY_PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-original-mixed-amenities-insets
          path: artifacts/gpt2-original-mixed-amenities
          retention-days: 30

  original-source-not-verified:
    if: github.event_name == 'push' && vars.ORIGINAL_SOURCES_REPOSITORY == ''
    uses: ./.github/workflows/original-source-not-run.yml
    with:
      job: original-mixed-inset-proof
