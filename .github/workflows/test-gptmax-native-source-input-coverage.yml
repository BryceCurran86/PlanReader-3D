name: GPT MAX native source input coverage authority bridge

on:
  push:
    branches: [gptmax/native-source-input-coverage-20261108]
  pull_request:
    paths:
      - tools/gpt3_native_source_execution_coverage.py
      - tests/test_gpt3_native_source_execution_coverage.py
      - .github/workflows/test-gptmax-native-source-input-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-input:
    name: Native input source reproof (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/native-input-coverage-pycache
      PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
      BASE_SHA: ${{ github.event.pull_request.base.sha || '22ebd4e3c97f8efff807e9b9d84ea78837424647' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing production and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Compile and inspect the isolated bridge
        run: |
          python -m py_compile tools/gpt3_native_source_execution_coverage.py tests/test_gpt3_native_source_execution_coverage.py
          ruff check --select F821,F823 tools/gpt3_native_source_execution_coverage.py tests/test_gpt3_native_source_execution_coverage.py
      - name: Native input authority, page ownership, tamper, memory lifetime and signed fixture regressions
        run: |
          python -m pytest -q -rs \
            tests/test_gpt3_native_source_execution_coverage.py \
            tests/test_source_observation_defensive_copies.py \
            tests/test_source_observation_integrity_hash_cache.py \
            tests/test_source_observation_shared_generation_records.py \
            tests/test_gpt1_compact_source_observation_records.py \
            tests/test_gpt3_original_source_preflight.py \
            tests/test_lot16_signed_eight_row_fixture.py
      - name: Source privacy, frozen120 and provider separation
        run: |
          git diff --diff-filter=AMRCT --name-only -z "$BASE_SHA" HEAD | python scripts/check_private_original_source_additions.py --root .
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD | python scripts/check_v2_truth_separation.py --nul
      - name: State verification scope
        run: |
          echo "NATIVE_INPUT_SOURCE_FREE_REGRESSIONS=COMPLETE"
          echo "PRIVATE_ORIGINAL_PROOF=SEPARATE_PROTECTED_RUN_REQUIRED"
          echo "MEASUREMENT_CUSTOMER_AND_BENCHMARK_AUTHORITY=NOT_GRANTED"
