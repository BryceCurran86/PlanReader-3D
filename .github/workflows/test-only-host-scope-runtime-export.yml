name: TEST ONLY Host Scope Runtime Export

on:
  pull_request:
    branches:
      - main

jobs:
  export-host-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record head
        run: git rev-parse HEAD > HOST_SCOPE_HEAD_SHA.txt
      - name: Pack checkout
        run: git archive --format=tar.gz -o host-scope-runtime.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: host-scope-runtime
          path: |
            host-scope-runtime.tar.gz
            HOST_SCOPE_HEAD_SHA.txt
          retention-days: 1
