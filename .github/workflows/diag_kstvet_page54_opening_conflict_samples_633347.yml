name: TEST-ONLY KSTVET Page54 Opening Conflict Samples

on:
  pull_request:
    branches: [main]

jobs:
  conflict-samples:
    if: startsWith(github.head_ref, 'diag/kstvet-page54-opening-conflict-samples-633347')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect competing candidate sets for floor-plan conflicts
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from collections import Counter
          import fitz
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_physical_opening_authority import PhysicalOpeningAuthority
          from pb_semantic_opening_enumeration_authority import SemanticOpeningEnumerationProducer
          from pb_viewport_segmentation import segment_page_viewports,is_authoritative_derived_viewport

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-opening-conflict-samples/2.0"})
          with urllib.request.urlopen(req,timeout=120) as r: payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected: raise SystemExit(actual)

          full=fitz.open(stream=payload,filetype="pdf")
          page=full.load_page(53)
          viewports=segment_page_viewports(page,page_number=54)
          floor_vps=[
              v for v in viewports
              if v.view_type=="floor_plan"
              and v.bounding_box is not None
              and (v.status=="resolved" or is_authoritative_derived_viewport(v))
          ]
          if len(floor_vps)!=1:
              raise SystemExit(f"expected one authoritative floor viewport, got {len(floor_vps)}")
          floor=floor_vps[0]
          floor_bbox=tuple(float(v) for v in floor.bounding_box)
          one=fitz.open(); one.insert_pdf(full,from_page=53,to_page=53)
          page_bytes=one.tobytes(); one.close(); full.close()

          source=SourceVisibilityProducer(
              producer_method="kstvet_page54_conflict_samples",
              producer_version="2",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-page54-conflict-samples",
              source_bytes=page_bytes,
              source_locator="derived-from-canonical-page-54",
          )
          visibility=source.authority()
          physical=PhysicalOpeningAuthority(visibility)
          semantic=SemanticOpeningEnumerationProducer.from_source_visibility_producer(source)
          sem_result=semantic.publish_page_scope(
              revision_id=published.revision.revision_id,
              decision_scope_id="kstvet-page54-conflict-samples",
              page_ids=("1",),
          )
          record=sem_result.record
          if record is None:
              raise SystemExit("semantic record unavailable")

          def selector(oid):
              return ObservationSelector(
                  document_id=published.revision.document_id,
                  revision_id=published.revision.revision_id,
                  source_sha256=published.revision.source_sha256,
                  snapshot_id=published.snapshot.snapshot_id,
                  observation_id=oid,
              )

          x0,y0,x1,y1=floor_bbox
          def inside_floor(geometry):
              if len(geometry)!=4: return False
              ax,ay,bx,by=map(float,geometry)
              return (
                  x0 <= min(ax,bx) and max(ax,bx) <= x1
                  and y0 <= min(ay,by) and max(ay,by) <= y1
              )

          floor_rows=[]
          for oid in record.visible_observation_ids:
              vr=visibility.resolve_visible(selector(oid))
              obs=vr.observation
              if obs is None or not inside_floor(tuple(obs.geometry or ())):
                  continue
              floor_rows.append((oid,obs))

          conflicts=[]
          disposition_counts=Counter()
          for oid,obs in floor_rows:
              disp=physical.classify_disposition(selector(oid))
              disposition_counts[disp.disposition]+=1
              if disp.disposition=="conflict":
                  conflicts.append((oid,obs,disp))

          if not conflicts:
              raise SystemExit("no floor-plan conflicts found")

          seed_result=visibility.resolve_visible(selector(conflicts[0][0]))
          records,failures=physical._visible_snapshot_records(seed_result)
          if failures: raise SystemExit("snapshot failures")
          candidates=physical._visible_candidates_for(seed_result.observation,records)
          by_id={c.candidate_id:c for c in candidates}
          record_by_id={r.observation_id:r for r in records}

          def geom_key(geometry):
              vals=tuple(round(float(v),6) for v in geometry)
              if len(vals)!=4: return vals
              a=(vals[0],vals[1]); b=(vals[2],vals[3])
              return tuple(sorted((a,b)))

          def candidate_signature(c):
              sig=[]
              for sid in c.source_observation_ids:
                  r=record_by_id.get(sid)
                  if r is None: sig.append(("missing",sid))
                  else: sig.append((r.observation_kind,geom_key(r.geometry)))
              return tuple(sorted(sig,key=str))

          candidate_count_hist=Counter()
          distinct_signature_hist=Counter()
          pattern_multisets=Counter()
          duplicate_geometry_conflicts=0
          strict_duplicate_support_conflicts=0
          analyzed=[]
          for oid,obs,disp in conflicts:
              cs=[by_id[cid] for cid in disp.candidate_ids if cid in by_id]
              signatures=[candidate_signature(c) for c in cs]
              candidate_count_hist[len(cs)]+=1
              distinct_signature_hist[len(set(signatures))]+=1
              pattern_multisets[tuple(sorted(c.structural_pattern for c in cs))]+=1
              if len(cs)>1 and len(set(signatures))==1:
                  duplicate_geometry_conflicts+=1
              support_sets=[frozenset(c.source_observation_ids) for c in cs]
              if len(cs)>1 and len(set(support_sets))==1:
                  strict_duplicate_support_conflicts+=1
              analyzed.append((oid,obs,disp,cs,signatures))

          analyzed.sort(key=lambda row: (
              min(float(row[1].geometry[1]),float(row[1].geometry[3])),
              min(float(row[1].geometry[0]),float(row[1].geometry[2])),
              row[0],
          ))
          sample_indexes=sorted(set(
              round(i*(len(analyzed)-1)/11) for i in range(min(12,len(analyzed)))
          ))
          samples=[]
          for i in sample_indexes:
              oid,obs,disp,cs,signatures=analyzed[i]
              cand_rows=[]
              for c,sig in zip(cs,signatures):
                  supports=[]
                  for sid in c.source_observation_ids:
                      r=record_by_id.get(sid)
                      supports.append({
                          "id":sid,
                          "geometry":None if r is None else r.geometry,
                          "kind":None if r is None else r.observation_kind,
                          "roots":None if r is None else r.derivation_parent_ids,
                      })
                  cand_rows.append({
                      "candidate_id":c.candidate_id,
                      "pattern":c.structural_pattern,
                      "signature":sig,
                      "supports":supports,
                  })
              samples.append({
                  "observation_id":oid,
                  "geometry":obs.geometry,
                  "kind":obs.observation_kind,
                  "reason_codes":disp.reason_codes,
                  "candidate_count":len(cs),
                  "distinct_geometry_signatures":len(set(signatures)),
                  "candidates":cand_rows,
              })

          def candidate_dimensions(c):
              support=[record_by_id.get(sid) for sid in c.source_observation_ids]
              if any(r is None for r in support) or len(support)!=6:
                  return None
              bs=[]
              for i,a in enumerate(support):
                  for b in support[i+1:]:
                      br=physical._PhysicalOpeningAuthority__noop if False else None
                      from pb_physical_opening_authority import _face_break,_same_gap,_distinct_parallel_axes,_segment_matches
                      x=_face_break(a,b)
                      if x is not None:
                          bs.append(x)
              for i,a in enumerate(bs):
                  for b in bs[i+1:]:
                      if not _same_gap(a,b) or not _distinct_parallel_axes(a,b):
                          continue
                      left=[r for r in support if _segment_matches(r,a.start_point,b.start_point)]
                      right=[r for r in support if _segment_matches(r,a.end_point,b.end_point)]
                      if not left or not right:
                          continue
                      face_sep=abs((b.start_point[0]-a.start_point[0])*(-a.direction[1])+(b.start_point[1]-a.start_point[1])*a.direction[0])
                      gap_width=a.gap_end-a.gap_start
                      return {
                          "face_sep":face_sep,
                          "gap_width":gap_width,
                          "ratio":gap_width/face_sep if face_sep>1e-9 else None,
                      }
              return None

          candidate_dispositions={}
          for oid,obs in floor_rows:
              disp=physical.classify_disposition(selector(oid))
              for cid in disp.candidate_ids:
                  candidate_dispositions.setdefault(cid,set()).add(disp.disposition)

          sep_by_class={}
          ratio_by_class={}
          dim_samples={}
          for cid,cand in by_id.items():
              dims=candidate_dimensions(cand)
              if dims is None:
                  continue
              classes=candidate_dispositions.get(cid,{"unreferenced"})
              cls="opening_support" if "opening_support" in classes else ("conflict" if "conflict" in classes else sorted(classes)[0])
              sep=round(dims["face_sep"],3)
              ratio=None if dims["ratio"] is None else round(dims["ratio"],3)
              sep_by_class.setdefault(cls,Counter())[sep]+=1
              if ratio is not None:
                  ratio_by_class.setdefault(cls,Counter())[ratio]+=1
              dim_samples.setdefault(cls,[])
              if len(dim_samples[cls])<20:
                  dim_samples[cls].append({"candidate_id":cid,**{k:round(v,4) if isinstance(v,float) else v for k,v in dims.items()}})

          def hist_rows(counter):
              return [{"key":str(k),"count":v} for k,v in sorted(counter.items(),key=lambda kv:(-kv[1],str(kv[0])))]

          print("KSTVET_PAGE54_CONFLICT_SAMPLES="+json.dumps({
              "production_sha":"633347965939aa4184d8edfc2330dd758601c1c9",
              "source_sha256":actual,
              "page_snapshot_sha256":hashlib.sha256(page_bytes).hexdigest(),
              "floor_viewport":{
                  "id":floor.view_id,"label":floor.label,"bbox":floor_bbox,
                  "status":floor.status,"boundary_source":floor.boundary_source,
                  "authoritative_derived":is_authoritative_derived_viewport(floor),
              },
              "floor_visible_observations":len(floor_rows),
              "floor_dispositions":dict(disposition_counts),
              "floor_conflicts":len(conflicts),
              "duplicate_geometry_conflicts":duplicate_geometry_conflicts,
              "strict_duplicate_support_conflicts":strict_duplicate_support_conflicts,
              "candidate_count_hist":hist_rows(candidate_count_hist),
              "distinct_signature_hist":hist_rows(distinct_signature_hist),
              "pattern_multisets":hist_rows(pattern_multisets),
              "candidate_face_separation_hist":{k:hist_rows(v)[:40] for k,v in sep_by_class.items()},
              "candidate_gap_ratio_hist":{k:hist_rows(v)[:40] for k,v in ratio_by_class.items()},
              "candidate_dimension_samples":dim_samples,
              "total_visible_candidates":len(candidates),
              "samples":samples,
          },sort_keys=True,default=str),flush=True)
          PY
