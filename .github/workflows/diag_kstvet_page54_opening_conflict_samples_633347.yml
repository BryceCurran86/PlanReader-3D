name: TEST-ONLY KSTVET Page54 Opening Conflict Samples

on:
  pull_request:
    branches: [main]

jobs:
  conflict-samples:
    if: startsWith(github.head_ref, 'diag/kstvet-page54-opening-conflict-samples-633347')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect competing candidate sets for floor-plan conflicts
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          import fitz
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_physical_opening_authority import PhysicalOpeningAuthority

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-opening-conflict-samples/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected: raise SystemExit(actual)
          full=fitz.open(stream=payload,filetype="pdf")
          one=fitz.open(); one.insert_pdf(full,from_page=53,to_page=53)
          page_bytes=one.tobytes(); one.close(); full.close()

          source=SourceVisibilityProducer(
              producer_method="kstvet_page54_conflict_samples",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-page54-conflict-samples",
              source_bytes=page_bytes,
              source_locator="derived-from-canonical-page-54",
          )
          visibility=source.authority()
          physical=PhysicalOpeningAuthority(visibility)

          sample_ids=[
              "source_observation_05ca762014c745861b2d0a6b96ecea60",
              "source_observation_0608986bce1c61aae1da815a8479b6ab",
              "source_observation_064323118d1bd29b843ca2ca9530927d",
              "source_observation_06a2a078e2ff1005ffe7cb4dc6b1af23",
              "source_observation_07a49f6409ae7fc5dbc5d96751144df0",
              "source_observation_096500e32d9344a6d37d5d2feb965ea8",
              "source_observation_09652a0e35f6e97341ec5564ded06716",
              "source_observation_09aacf14e574e7c923b7b49dd9a59bba",
              "source_observation_0a2da2d99bff5e09c2d089603a22841c",
              "source_observation_0b85467bdbbcd7581db6bc49046860a4",
              "source_observation_0ea255be5349121f33d54e886a738dd5",
          ]

          # One seed gets the immutable page record universe and deterministic candidate cache.
          first_sel=ObservationSelector(
              document_id=published.revision.document_id,
              revision_id=published.revision.revision_id,
              source_sha256=published.revision.source_sha256,
              snapshot_id=published.snapshot.snapshot_id,
              observation_id=sample_ids[0],
          )
          first_res=visibility.resolve_visible(first_sel)
          records,failures=physical._visible_snapshot_records(first_res)
          if failures: raise SystemExit("snapshot failures")
          candidates=physical._visible_candidates_for(first_res.observation,records)
          by_id={c.candidate_id:c for c in candidates}
          record_by_id={r.observation_id:r for r in records}

          out=[]
          for oid in sample_ids:
              sel=ObservationSelector(
                  document_id=published.revision.document_id,
                  revision_id=published.revision.revision_id,
                  source_sha256=published.revision.source_sha256,
                  snapshot_id=published.snapshot.snapshot_id,
                  observation_id=oid,
              )
              vr=visibility.resolve_visible(sel)
              if vr.observation is None:
                  out.append({"observation_id":oid,"missing":True}); continue
              disp=physical.classify_disposition(sel)
              cand_rows=[]
              for cid in disp.candidate_ids:
                  c=by_id.get(cid)
                  if c is None:
                      cand_rows.append({"candidate_id":cid,"missing_from_cache":True}); continue
                  supports=[]
                  for sid in c.source_observation_ids:
                      r=record_by_id.get(sid)
                      supports.append({
                          "id":sid,
                          "geometry":None if r is None else r.geometry,
                          "kind":None if r is None else r.observation_kind,
                          "roots":None if r is None else r.derivation_parent_ids,
                      })
                  cand_rows.append({
                      "candidate_id":cid,
                      "pattern":c.structural_pattern,
                      "status":getattr(c.status,"value",str(c.status)),
                      "reason_codes":c.reason_codes,
                      "support_count":len(c.source_observation_ids),
                      "supports":supports,
                  })
              out.append({
                  "observation_id":oid,
                  "geometry":vr.observation.geometry,
                  "kind":vr.observation.observation_kind,
                  "roots":vr.observation.derivation_parent_ids,
                  "disposition":disp.disposition,
                  "status":getattr(disp.status,"value",str(disp.status)),
                  "reason_codes":disp.reason_codes,
                  "candidate_count":len(disp.candidate_ids),
                  "candidates":cand_rows,
              })

          print("KSTVET_PAGE54_CONFLICT_SAMPLES="+json.dumps({
              "production_sha":"633347965939aa4184d8edfc2330dd758601c1c9",
              "source_sha256":actual,
              "page_snapshot_sha256":hashlib.sha256(page_bytes).hexdigest(),
              "total_visible_candidates":len(candidates),
              "samples":out,
          },sort_keys=True,default=str),flush=True)
          PY
