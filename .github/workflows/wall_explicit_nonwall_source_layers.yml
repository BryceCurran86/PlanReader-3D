name: Wall Explicit Nonwall Source Layers

on:
  push:
    branches: [gpt/wall-nonwall-source-layer-exclusion-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_wall_room_topology_stage_a.py             tests/test_physical_wall_candidate_viewport_scope_v1.py             tests/test_physical_wall_candidate_authority_scope_v1.py
      - name: Performance fastpath
        run: |
          PYTHONPATH=. pytest -q tests/test_performance_fastpath_ci.py ||           PYTHONPATH=. pytest -q tests/test_performance_v1215.py
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Real source exclusion census
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, fitz
          from collections import Counter
          from pb_vector_geometry_v130 import extract_native_page
          from pb_wall_room_topology_stage_a import is_structural_candidate_segment

          doc=fitz.open("/tmp/kstvet.pdf")
          native=extract_native_page(doc[53])
          rows=[]
          for seg in native.get("segments") or ():
              layer=str(seg.get("layer") or "")
              if layer not in {"Marker - Section","Shell - Roof","Structural - Bearing"}:
                  continue
              keep,reasons=is_structural_candidate_segment(seg)
              rows.append({
                  "id":seg.get("id"),
                  "layer":layer,
                  "keep":keep,
                  "reasons":list(reasons),
              })
          print("NONWALL_LAYER_CENSUS "+json.dumps({
              "by_layer":Counter(r["layer"] for r in rows),
              "kept_by_layer":Counter(r["layer"] for r in rows if r["keep"]),
              "excluded_by_layer":Counter(r["layer"] for r in rows if not r["keep"]),
              "reason_counts":Counter(
                  reason for r in rows for reason in r["reasons"]
              ),
          },sort_keys=True))
          assert all(not r["keep"] for r in rows if r["layer"] in {"Marker - Section","Shell - Roof"})
          assert all(r["keep"] for r in rows if r["layer"]=="Structural - Bearing")
          PY
