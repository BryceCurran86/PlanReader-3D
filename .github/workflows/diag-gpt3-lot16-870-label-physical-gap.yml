name: DIAG GPT3 Lot16 870 Label Physical Gap

on:
  pull_request:
    branches:
      - gptmax/exact-two-face-lineage-host-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace every native 870 label to proven physical gaps
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_870_label_physical_gap.py | tee lot16-870-label-physical-gap.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-870-label-physical-gap
          path: lot16-870-label-physical-gap.json
          retention-days: 2
