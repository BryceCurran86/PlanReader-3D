name: Private working revision comparison HTTP
on:
  pull_request:
    paths:
      - 'pb_plan_edit_revision_compare_wsgi.py'
      - 'tests/editable_3d/test_plan_edit_revision_compare_wsgi.py'
      - '.github/workflows/plan-edit-revision-compare-http.yml'
  push:
    branches: [main]
    paths:
      - 'pb_plan_edit_revision_compare_wsgi.py'
      - 'tests/editable_3d/test_plan_edit_revision_compare_wsgi.py'
      - '.github/workflows/plan-edit-revision-compare-http.yml'
permissions:
  contents: read
jobs:
  original-private-comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original review dependencies
        run: python -m pip install pytest PyMuPDF numpy pandas plotly
      - name: Verify tenant/private version comparison HTTP
        run: python -m pytest -q tests/editable_3d/test_plan_edit_revision_compare.py tests/editable_3d/test_plan_edit_revision_compare_wsgi.py
