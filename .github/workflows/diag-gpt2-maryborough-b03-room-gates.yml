name: DIAG GPT2 Maryborough B03 Room First Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt2_room_measurement_gates.py"
      - "pb_quantity_takeoff_adapter.py"
      - "tests/test_gpt3_family_claim_identity.py"
      - "tests/test_gpt2_b03_room_measurement_gates.py"
      - ".github/workflows/diag-gpt2-maryborough-b03-room-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

# Public PR code never receives the private source token or original PDF.
# Original source proof runs only by owner-dispatched trusted main.
jobs:
  source-neutral-b03:
    if: ${{ github.event_name == 'pull_request' }}
    name: B03 synthetic checks only - original proof not run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Test source-neutral B03 first-gate contract
        run: PYTHONPATH=. python -m pytest -q tests/test_gpt2_b03_room_measurement_gates.py tests/test_gpt3_b03_private_source_workflow_contract.py
      - name: State original-proof boundary
        run: echo "B03_SOURCE_NEUTRAL_ONLY; original PDF/customer validation NOT RUN; no FIRM or score grant"
