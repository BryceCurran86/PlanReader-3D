name: TEST ONLY GPT2 Maryborough Grid Component Completion

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "pb_*room*.py"
      - "pb_*wall*.py"
      - "pb_live_physical_net_wall_integration.py"
      - "pb_wall_room_topology_typed_negative_evidence.py"
      - "tests/test_wall_topology_typed_negative_evidence.py"
      # Native/raster text changes can alter commercial room labels or areas.
      - "pb_raster_text_corroboration_authority.py"
      - "tests/test_raster_text_corroboration_authority_v1.py"
      - "tests/test_source_*room*.py"
      - "pb_cross_view_floor_finish_authority.py"
      - "tests/test_cross_view_floor_finish_authority_v1.py"
      - "tests/test_gpt2_named_room_metric_first_gates.py"
      - "tools/diag_gpt2_named_room_metric_first_gates.py"
      - ".github/workflows/test_gpt2_maryborough_grid_component_completion.yml"

concurrency:
  group: gpt2-maryborough-grid-component-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-ci-v1228.txt
    - name: Verify floor finish receipt publication invariants
      run: PYTHONPATH=. python -m pytest -q tests/test_cross_view_floor_finish_authority_v1.py
    - name: Original source edge aliases retain all owners and fail closed on incomplete ancestry
      run: PYTHONPATH=. python -m pytest -q tests/test_source_room_face_same_source_aliases.py
