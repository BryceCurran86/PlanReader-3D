name: Item19B Target Component Blocker Probe

on:
  push:
    branches: [gpt/item19b-component-authority-main]

jobs:
  blocker-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Trace exact production blocker
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_physical_wall_candidate_authority import (
              PhysicalWallCandidateProducer,
              PhysicalWallCandidateSelector,
              _assemble_scope_result,
              _source_page_segments,
              _decision_scope_id,
          )
          from pb_wall_component_completeness_authority import (
              _component_sets,
              _positive_same_separations,
              _proven_filled_wall_strips,
              _proven_strip_closure_exemptions,
              _component_withheld_context,
              _withheld_affects_component,
              _observation_line,
              _raw_path_family,
          )

          TARGET_SOURCE_PRIMITIVES={
              "d4763i0",
              "d4772i0",
              "d5179i1",
              "d5179i3",
              "d5214i0",
              "d5215i0",
          }

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-target-blocker-probe",
              producer_version="1.0",
          )
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-target-blocker",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          walls=PhysicalWallCandidateProducer.from_authenticated_viewports(
              source,page_ids=("54",)
          ).authority()
          scope=next(
              s for s in walls._scopes.values()
              if s.viewport_id=="view_p54_4"
          )
          current_pub=source.published_snapshot_for_revision(scope.revision_id)
          if (
              current_pub is None
              or current_pub.snapshot.snapshot_id != scope.snapshot_id
              or current_pub.revision.source_sha256 != scope.source_sha256
          ):
              raise SystemExit("current source snapshot does not match wall scope lineage")
          pub=current_pub
          by_id={r.wall_candidate_id:r for r in scope.records}
          components=_component_sets(scope.records,scope.equivalence)

          target_members=None
          target_matches={}
          for members in components:
              overlap={}
              for wall_id in members:
                  rec=by_id[wall_id]
                  ids=set(str(x) for x in rec.physical_identity.source_primitive_ids)
                  hit=sorted(ids & TARGET_SOURCE_PRIMITIVES)
                  if hit:
                      overlap[wall_id]=hit
              if overlap:
                  target_members=members
                  target_matches=overlap
                  break
          if target_members is None:
              raise SystemExit("target component not found by immutable source primitives")

          target_records=tuple(by_id[x] for x in target_members)
          same_separations=_positive_same_separations(by_id,scope.equivalence)

          page_segments,page_observation_ids,page_width,page_height=_source_page_segments(
              source_producer=source,
              published=pub,
              source_bytes=payload,
              page_id="54",
              decision_scope_id=_decision_scope_id("54"),
          )
          strips=_proven_filled_wall_strips(page_segments)
          subordinate=_proven_strip_closure_exemptions(
              component_records=target_records,
              proven_wall_strips=strips,
          )
          context=_component_withheld_context(
              component_records=target_records,
              known_same_separations=same_separations,
              proven_subordinate_raw_ids=subordinate,
          )

          visibility=source.authority()
          withheld_ids=tuple(sorted(
              set(scope.scope_boundary_observation_ids)
              | set(scope.ambiguous_source_observation_ids)
          ))
          rows=[]
          for observation_id in withheld_ids:
              result=visibility.resolve_visible(ObservationSelector(
                  document_id=scope.document_id,
                  revision_id=scope.revision_id,
                  source_sha256=scope.source_sha256,
                  snapshot_id=scope.snapshot_id,
                  observation_id=observation_id,
              ))
              obs=result.observation
              if result.status is not EvidenceResolutionStatus.CORROBORATED or obs is None:
                  rows.append({
                      "observation_id":observation_id,
                      "replay":"failed",
                  })
                  continue
              line=_observation_line(obs)
              raw_id=str(getattr(obs,"source_primitive_ref","") or "")
              if line is None:
                  rows.append({
                      "observation_id":observation_id,
                      "raw_id":raw_id,
                      "replay":"not_line",
                  })
                  continue
              reason=_withheld_affects_component(
                  withheld_line=line,
                  withheld_raw_id=raw_id,
                  context=context,
              )
              if reason is not None:
                  rows.append({
                      "observation_id":observation_id,
                      "raw_id":raw_id,
                      "normalized_path_family":_raw_path_family(raw_id),
                      "geometry":[round(float(v),3) for v in line],
                      "reason":reason,
                      "is_subordinate":raw_id.replace("visible:segment:","").replace("segment:","") in subordinate,
                      "withheld_bucket":(
                          "scope_boundary"
                          if observation_id in set(scope.scope_boundary_observation_ids)
                          else "ambiguous_ownership"
                      ),
                  })

          # Local source-component expansion diagnostic. Map the authenticated
          # viewport target component to page-owned walls by exact immutable
          # source primitive ids, then expand only through exact endpoint
          # connectivity. This does not bless the whole page or alter the
          # viewport boundary; it asks whether the source-owned connected wall
          # subgraph itself closes into valid multi-room topology.
          from dataclasses import replace
          from pb_source_wall_topology_authority import (
              _derive_scope_records,
              _wall_edges,
          )

          page_selector=PhysicalWallCandidateSelector(
              document_id=pub.revision.document_id,
              revision_id=pub.revision.revision_id,
              source_sha256=pub.revision.source_sha256,
              snapshot_id=pub.snapshot.snapshot_id,
              page_id="54",
              decision_scope_id=_decision_scope_id("54"),
          )
          page_scope=_assemble_scope_result(
              source_producer=source,
              published=pub,
              page_id="54",
              selector=page_selector,
              segments=page_segments,
              source_observation_ids=page_observation_ids,
              page_width=page_width,
              page_height=page_height,
              source_bytes=payload,
          )

          target_source_ids={
              str(raw_id)
              for rec in target_records
              for raw_id in rec.physical_identity.source_primitive_ids
          }
          page_by_id={rec.wall_candidate_id:rec for rec in page_scope.records}
          seed_ids={
              rec.wall_candidate_id
              for rec in page_scope.records
              if target_source_ids & set(
                  str(raw_id)
                  for raw_id in rec.physical_identity.source_primitive_ids
              )
          }

          endpoints={}
          for rec in page_scope.records:
              pts=set()
              for edge in _wall_edges(rec):
                  pts.add(edge[0]); pts.add(edge[1])
              endpoints[rec.wall_candidate_id]=pts

          component=set(seed_ids)
          frontier=list(seed_ids)
          while frontier:
              current=frontier.pop()
              current_pts=endpoints.get(current,set())
              if not current_pts:
                  continue
              for other,other_pts in endpoints.items():
                  if other in component or not other_pts:
                      continue
                  if current_pts & other_pts:
                      component.add(other)
                      frontier.append(other)

          component_records=tuple(
              page_by_id[wall_id] for wall_id in sorted(component)
          )
          local_scope=replace(
              page_scope,
              scope_complete=True,
              records=component_records,
              equivalence=None,
          )
          local_topology=_derive_scope_records(local_scope)
          topology_by_wall={
              evidence.physical_wall_id:evidence
              for evidence in local_topology.values()
          }

          seed_rows=[]
          for wall_id in sorted(seed_ids):
              rec=page_by_id[wall_id]
              topo=topology_by_wall.get(wall_id)
              seed_rows.append({
                  "page_wall":wall_id,
                  "page_raw_ids":list(rec.physical_identity.source_primitive_ids),
                  "target_overlap":sorted(
                      target_source_ids
                      & set(str(x) for x in rec.physical_identity.source_primitive_ids)
                  ),
                  "topology":None if topo is None else {
                      "ambiguous":topo.is_ambiguous,
                      "reason":topo.ambiguity_reason,
                      "bounds_exterior":topo.bounds_exterior,
                      "face_count":topo.enclosed_space_count,
                      "face_ids":list(topo.enclosed_space_ids),
                      "evidence":topo.evidence_id,
                  },
              })

          dangling=[]
          point_degree={}
          for rec in component_records:
              for edge in _wall_edges(rec):
                  for point in edge:
                      point_degree[point]=point_degree.get(point,0)+1
          for point,degree in sorted(point_degree.items()):
              if degree==1:
                  dangling.append([point[0],point[1]])

          print("ITEM19B_LOCAL_SOURCE_COMPONENT "+json.dumps({
              "page_scope_complete":page_scope.scope_complete,
              "page_scope_reasons":list(page_scope.reason_codes),
              "page_record_count":len(page_scope.records),
              "seed_wall_ids":sorted(seed_ids),
              "expanded_wall_count":len(component_records),
              "expanded_wall_ids":sorted(component),
              "dangling_endpoint_count":len(dangling),
              "dangling_endpoints":dangling[:50],
              "topology_record_count":len(local_topology),
              "seed_topology":seed_rows,
          },sort_keys=True))

                    print("ITEM19B_TARGET_BLOCKER "+json.dumps({
              "viewport_bbox":list(scope.viewport_bbox or ()),
              "scope_boundary_observation_ids":list(scope.scope_boundary_observation_ids),
              "ambiguous_source_observation_ids":list(scope.ambiguous_source_observation_ids),
              "target_members":list(target_members),
              "target_matches":target_matches,
              "member_source_primitives":{
                  wall_id:list(by_id[wall_id].physical_identity.source_primitive_ids)
                  for wall_id in target_members
              },
              "component_path_families":sorted(context.source_path_families),
              "same_separations":[round(float(x),4) for x in same_separations],
              "subordinate_closure_ids":sorted(subordinate),
              "blockers":rows,
          },sort_keys=True))
          PY
