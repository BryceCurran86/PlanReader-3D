name: DIAG Lot16 Swing Local Registration

on:
  pull_request:
    branches:
      - gpt4/raster-swing-local-registration-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run frozen swing and registration tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_door_swing_g17_contract.py \
            tests/test_raster_swing_registration_authority.py \
            tests/test_raster_framed_opening_g17_contract.py
      - name: Validate exact Lot16 page 3
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/diag_lot16_swing_local_registration.py | tee lot16-swing-local-registration.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-swing-local-registration
          path: lot16-swing-local-registration.json
          retention-days: 1
