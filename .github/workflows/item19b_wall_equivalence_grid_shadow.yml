name: Item19B Wall Equivalence Grid Shadow

on:
  push:
    branches: [gpt/item19b-wall-equivalence-grid-v1]
  pull_request:
    branches: [main]
    paths:
      - "pb_*wall*.py"
      - "pb_*opening*.py"
      - "tests/*wall*.py"
      - "tests/test_opening_host_binding_*.py"
      - ".github/workflows/item19b_wall_equivalence_grid_shadow.yml"

concurrency:
  group: item19b-wall-equivalence-grid-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wall-authority-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Run targeted wall-authority tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_physical_wall_equivalence_candidate_eligibility.py \
            tests/test_wall_room_topology_stage_a.py \
            tests/test_physical_wall_candidate_viewport_scope_v1.py \
            tests/test_opening_host_binding_equivalence_regression_v3.py \
            tests/test_opening_host_binding_cross_role_same_v3.py \
            tests/test_net_wall_boolean_union_production_v1.py \
            tests/test_wall_finish_face_binding_authority_v1.py
      # The retired KSTVET drawing's download and replay steps were removed on 26 November 2026 (owner decision).
