name: Item19B Wall Equivalence Grid Shadow

on:
  push:
    branches: [gpt/item19b-wall-equivalence-grid-v1]
  pull_request:
    branches: [main]

concurrency:
  group: item19b-wall-equivalence-grid-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kstvet-wall-authority-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Run targeted wall-authority tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_wall_room_topology_stage_a.py \
            tests/test_physical_wall_candidate_viewport_scope_v1.py \
            tests/test_opening_host_binding_equivalence_regression_v3.py \
            tests/test_opening_host_binding_cross_role_same_v3.py \
            tests/test_net_wall_boolean_union_production_v1.py \
            tests/test_wall_finish_face_binding_authority_v1.py

      - name: Download pinned KSTVET source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -

      - name: Run focused page 54 Item19B callout wall shadow
        run: |
          PYTHONPATH=. python scripts/item19b_kstvet_callout_wall_fast_shadow.py /tmp/kstvet.pdf

      - name: Download canonical five-project sources
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf' -o benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
          echo 'fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o benchmarks/sources/umma-university-hostels-builders-work.pdf
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  benchmarks/sources/umma-university-hostels-builders-work.pdf' | sha256sum -c -

      - name: Run canonical five-project generalisation gate
        run: |
          PYTHONPATH=. python pb_benchmark_accuracy_engine.py --all --require-local-sources
          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(
              Path("benchmark_results/headline_accuracy_dashboard.json").read_text(
                  encoding="utf-8"
              )
          )
          for report in dashboard.get("headline_reports", []):
              print(
                  "GENERALISATION_PROJECT "
                  + json.dumps(
                      {
                          "benchmark_id": report.get("benchmark_id"),
                          "status": report.get("status"),
                          "accepted": int(report.get("exact_matches", 0))
                          + int(report.get("within_5_percent", 0)),
                          "compared": report.get("total_items_compared"),
                          "accuracy": report.get("overall_accuracy_percentage"),
                          "strict_exact": report.get(
                              "strict_exact_accuracy_percentage"
                          ),
                          "gross_mismatches": report.get("gross_mismatches"),
                          "missed_items": report.get("missed_items"),
                          "hallucinated_items": report.get("hallucinated_items"),
                      },
                      sort_keys=True,
                  )
              )
          PY
