name: Item19B Wall Equivalence Grid Shadow

on:
  push:
    branches: [gpt/item19b-wall-equivalence-grid-v1]
  pull_request:
    branches: [gpt/item19b-viewport-wall-authority]

concurrency:
  group: item19b-wall-equivalence-grid-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kstvet-wall-authority-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Run targeted wall-authority tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_physical_wall_candidate_face_pair_equivalence_v1.py \
            tests/test_wall_room_topology_stage_a.py \
            tests/test_physical_wall_candidate_viewport_scope_v1.py

      - name: Download pinned KSTVET source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -

      - name: Run page 54 wall-authority shadow
        run: |
          PYTHONPATH=. python scripts/wall_finish_face_binding_kstvet_shadow.py /tmp/kstvet.pdf
