name: Item19B Source Execution Wall Binding

on:
  push:
    branches: [gpt/item19b-source-execution-callout-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          # Shadow-only real-source validation of the already-approved
          # RasterTextCorroborationAuthority backend. Do NOT promote this
          # dependency to production requirements from this workflow.
          pip install rapidocr

      - name: Focused authority tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_source_execution_callout_authority_v1.py             tests/test_wall_finish_callout_wall_authority_v1.py             tests/test_wall_finish_face_binding_authority_v1.py             tests/test_physical_wall_candidate_viewport_scope_v1.py

      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -

      - name: Real KSTVET page54 execution-callout wall shadow
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_wall_finish_callout_wall_authority import WallFinishCalloutWallProducer

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-source-execution-wall-real",
              producer_version="1.0",
          )
          source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-source-execution-wall",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          start=time.perf_counter()
          producer=WallFinishCalloutWallProducer.from_source_visibility_producer(
              source,page_ids=("54",)
          )
          elapsed=time.perf_counter()-start
          rows=[]
          for result in producer.published_results():
              for b in result.bindings:
                  rows.append({
                      "viewport":b.viewport_id,
                      "trade":b.trade_scope_id,
                      "material":b.finish_material,
                      "direction":b.semantic_direction,
                      "wall":b.physical_wall_id,
                      "callout_record":b.source_execution_callout_record_id,
                      "sequence":[
                          b.source_execution_sequence_start,
                          b.source_execution_sequence_end,
                      ],
                      "raw_owners":list(b.raw_owner_wall_ids),
                      "group":list(b.equivalence_group_wall_ids),
                      "pairs":[list(x) for x in b.equivalence_pair_classifications],
                      "source_primitives":list(b.source_wall_primitive_ids),
                      "evidence":list(b.source_evidence_ids),
                  })
          print("ITEM19B_EXECUTION_WALL_BINDINGS "+json.dumps(rows,sort_keys=True))
          print("ITEM19B_EXECUTION_WALL_BINDING_COUNT",len(rows))
          print("ITEM19B_EXECUTION_WALL_ELAPSED_SEC",round(elapsed,3))

          target_internal=[
              r for r in rows
              if r["sequence"] == [10070,10078]
              and r["trade"] in {"internal_plaster","internal_paint"}
          ]
          target_external=[
              r for r in rows
              if r["sequence"] == [10061,10065]
              and r["trade"] == "external_key_pointing"
          ]
          assert {r["trade"] for r in target_internal} == {
              "internal_plaster","internal_paint"
          }, target_internal
          assert len({r["wall"] for r in target_internal}) == 1
          assert all(len(set(r["group"])) >= 1 for r in target_internal)
          assert all(r["wall"] in r["group"] for r in target_internal)
          # The exact external Item19B callout remains blocked by its
          # independently unresolved direction token. Other source executions
          # are allowed to corroborate independently.
          assert target_external == []
          PY
