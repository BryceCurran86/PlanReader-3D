name: Lamu Stage Split Performance Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
      - name: Ingest only
        run: timeout 300s env PYTHONPATH=. python scripts/lamu_stage_perf_probe.py --pdf /tmp/lamu.pdf --stage ingest
      - name: Wall opening composition
        run: timeout 600s env PYTHONPATH=. python scripts/lamu_stage_perf_probe.py --pdf /tmp/lamu.pdf --stage wall
      - name: Downstream wall chain
        run: timeout 900s env PYTHONPATH=. python scripts/lamu_stage_perf_probe.py --pdf /tmp/lamu.pdf --stage downstream
      - name: Commercial extraction
        run: timeout 900s env PYTHONPATH=. python scripts/lamu_stage_perf_probe.py --pdf /tmp/lamu.pdf --stage commercial
