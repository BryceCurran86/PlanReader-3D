name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff

      - name: Enforce Full Plan V2 truth / production separation (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python scripts/check_v2_truth_separation.py

      - name: Enforce Full Plan V2 truth / production separation (push)
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ] || [ "$HEAD_SHA" = "$ZERO_SHA" ]; then
            echo "V2 truth separation cannot validate an empty or all-zero push comparison range." >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python scripts/check_v2_truth_separation.py

      - name: Enforce production-provider isolation from retired benchmark truth
        run: PYTHONPATH=. python scripts/check_provider_gold_isolation.py

      - name: Verify Full Plan V2 truth integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py

      - name: Compile all Python code
        run: python -m compileall -q .

      - name: Check undefined names and local-scope errors
        run: ruff check --select F821,F823 .

      - name: Syntax-check Takeoff Studio JavaScript
        run: node --check planreader_takeoff_studio/frontend/studio.js

      - name: Syntax-check zoomable polygon mapper JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('planreader_floor_mapper_v131/frontend/index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/planreader_floor_mapper_v131.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/planreader_floor_mapper_v131.js

      - name: Run all tests
        run: PYTHONPATH=. pytest -q tests/

      - name: Smoke test (envelope, quotes, copy, reconcile, publish)
        run: python tests/ci_smoke.py

  diag-maryborough-general-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify Maryborough source SHA
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          expected="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          print({"sha256":actual,"verified":actual==expected})
          if actual != expected:
              raise SystemExit("Maryborough source SHA mismatch")
          PY
      - name: Run Maryborough all-family handoff
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/maryborough-general-evidence
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id au_qld_maryborough_service_station \
            --workspace-id 1 \
            --family-group all \
            --output-dir /tmp/maryborough-general-evidence \
            | tee /tmp/maryborough-general-evidence.stdout
      - name: Print Maryborough impact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/maryborough-general-evidence")
          summary=root/"production_summary.json"
          if summary.exists():
              payload=json.loads(summary.read_text())
              print("MARYBOROUGH_SUMMARY",json.dumps(payload,indent=2,sort_keys=True))
          sealed=root/"au_qld_maryborough_service_station.json"
          if sealed.exists():
              payload=json.loads(sealed.read_text())
              rows=[{
                  "family":q.get("family"),
                  "value":q.get("value"),
                  "object_identity_refs":q.get("object_identity_refs"),
                  "lineage_ok":q.get("lineage_ok"),
              } for q in payload.get("quantities",[])]
              print("MARYBOROUGH_QUANTITIES",json.dumps(rows,indent=2,sort_keys=True))
          PY

