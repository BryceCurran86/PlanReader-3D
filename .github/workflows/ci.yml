name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff

      - name: Enforce Full Plan V2 truth / production separation (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python scripts/check_v2_truth_separation.py

      - name: Enforce Full Plan V2 truth / production separation (push)
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ] || [ "$HEAD_SHA" = "$ZERO_SHA" ]; then
            echo "V2 truth separation cannot validate an empty or all-zero push comparison range." >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python scripts/check_v2_truth_separation.py

      - name: Enforce production-provider isolation from retired benchmark truth
        run: PYTHONPATH=. python scripts/check_provider_gold_isolation.py

      - name: Verify Full Plan V2 truth integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py

      - name: Compile all Python code
        run: python -m compileall -q .

      - name: Check undefined names and local-scope errors
        run: ruff check --select F821,F823 .

      - name: Syntax-check Takeoff Studio JavaScript
        run: node --check planreader_takeoff_studio/frontend/studio.js

      - name: Syntax-check zoomable polygon mapper JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('planreader_floor_mapper_v131/frontend/index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/planreader_floor_mapper_v131.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/planreader_floor_mapper_v131.js

      - name: Run all tests
        run: PYTHONPATH=. pytest -q tests/

      - name: Smoke test (envelope, quotes, copy, reconcile, publish)
        run: python tests/ci_smoke.py


  lot16-diagnostics:
    if: github.event_name == 'pull_request' && github.head_ref == 'diag/gpt3-lot16-snapshot-lineage-trace-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace Lot16 opening snapshot lineage
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_snapshot_lineage_trace.py \
            | tee lot16-opening-snapshot-lineage-trace.json
      - name: Audit Lot16 host-band geometry
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_host_band_geometry_audit.py \
            | tee lot16-host-band-geometry-audit.json
      - name: Shadow exact two-face lineage host recovery
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_two_face_lineage_host_shadow.py \
            | tee lot16-two-face-lineage-host-shadow.json
      - name: Upload Lot16 diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-live-host-diagnostics
          path: |
            lot16-opening-snapshot-lineage-trace.json
            lot16-host-band-geometry-audit.json
            lot16-two-face-lineage-host-shadow.json
          retention-days: 2
