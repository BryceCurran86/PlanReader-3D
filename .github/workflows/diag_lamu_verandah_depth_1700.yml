name: TEST-ONLY Lamu Verandah 1700 Depth

on:
  pull_request:
    branches: [main]

jobs:
  lamu-verandah:
    if: startsWith(github.head_ref, 'diag/lamu-verandah-depth-1700')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install PyMuPDF
      - name: Inspect source figured depth around VERANDA label
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,math,urllib.request
          from pathlib import Path
          import fitz
          from pb_figured_dimension_evidence import (
              extract_dimension_evidence_bundle,
              calibrate_dimension_layout,
          )
          from pb_secondary_footprint_evidence import resolve_secondary_footprint_width_m
          from pb_viewport_segmentation import segment_page_viewports,is_authoritative_derived_viewport

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          p=Path("/tmp/lamu.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-verandah-depth/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:p.write_bytes(r.read())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected:raise SystemExit(actual)

          doc=fitz.open(p); page=doc[40]
          words=page.get_text("words") or []
          labels=[
              {
                  "text":str(w[4]),
                  "bbox":[float(x) for x in w[:4]],
                  "center":[(float(w[0])+float(w[2]))/2,(float(w[1])+float(w[3]))/2],
              }
              for w in words if "verand" in str(w[4]).lower()
          ]
          label_center=labels[0]["center"] if labels else [0.0,0.0]
          bundle=extract_dimension_evidence_bundle(page,page_num=41,view_id=None,view_type=None)
          binding={b.observation_id:b.status for b in bundle.bindings}
          obs=[]
          for o in bundle.observations:
              if o.bbox is None:continue
              cx=(float(o.bbox[0])+float(o.bbox[2]))/2
              cy=(float(o.bbox[1])+float(o.bbox[3]))/2
              endpoints=getattr(o,"endpoints",None)
              orientation=str(getattr(o,"orientation","unknown"))
              if endpoints and len(endpoints)==2:
                  (x0,y0),(x1,y1)=endpoints
                  orientation="horizontal" if abs(x1-x0)>=abs(y1-y0) else "vertical"
              if abs(float(o.value_m)-1.7)<=0.03 or (
                  abs(cx-label_center[0])<=180 and abs(cy-label_center[1])<=180
              ):
                  obs.append({
                      "id":o.dimension_id,
                      "value_m":o.value_m,
                      "bbox":list(o.bbox),
                      "center":[cx,cy],
                      "orientation":orientation,
                      "endpoints":endpoints,
                      "binding":binding.get(o.dimension_id),
                      "distance_to_veranda":round(math.hypot(cx-label_center[0],cy-label_center[1]),3),
                  })
          vps=segment_page_viewports(page,page_number=41)
          resolved=resolve_secondary_footprint_width_m(page,page_num=41)
          print("LAMU_VERANDAH_1700_DEPTH="+json.dumps({
              "sha":actual,
              "labels":labels,
              "observations":obs,
              "resolved":None if resolved is None else resolved.__dict__,
              "viewports":[{
                  "id":v.view_id,"type":v.view_type,"label":v.label,
                  "status":v.status,"bbox":v.bounding_box,
                  "boundary_source":v.boundary_source,
                  "authoritative_derived":is_authoritative_derived_viewport(v),
                  "provenance":v.provenance,
              } for v in vps],
              "layout":calibrate_dimension_layout(page).__dict__,
          },sort_keys=True,default=str),flush=True)
          doc.close()
          PY
