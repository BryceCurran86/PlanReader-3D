name: TEST-ONLY KSTVET Gable Roofline Authority

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-gable-roofline:
    if: startsWith(github.head_ref, 'diag/kstvet-gable-roofline-authority')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe KSTVET elevation gable geometry
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,math,urllib.request
          from pathlib import Path
          import fitz

          from pb_source_roof_covering_authority import (
              extract_elevation_segments_from_page,
              extract_roof_material_annotations,
              get_elevation_viewport_search_bbox,
              resolve_gable_apex_in_viewport,
          )
          from pb_viewport_segmentation import segment_page_viewports

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-gable-roofline/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(actual)
          source=Path("/tmp/kstvet.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          try:
              page=doc[53]
              vps=segment_page_viewports(page,page_number=54)
              rows=[]
              for vp in vps:
                  if vp.view_type!="elevation":
                      continue
                  bbox=get_elevation_viewport_search_bbox(vp,vps,page.rect)
                  diags,verts=extract_elevation_segments_from_page(page,bbox)
                  mats=extract_roof_material_annotations(page,bbox)
                  evidence,reasons=resolve_gable_apex_in_viewport(
                      diags,verts,
                      source_viewport_id=vp.view_id,
                      source_page=54,
                      material_annotations=mats,
                  )
                  row={
                      "view_id":vp.view_id,
                      "label":vp.label,
                      "status":vp.status,
                      "boundary_source":vp.boundary_source,
                      "title_bbox":vp.title_bbox,
                      "bbox":bbox,
                      "scale_raw":getattr(vp,"scale_raw",None),
                      "scale_denominator":getattr(vp,"scale_denominator",None),
                      "diagonal_count":len(diags),
                      "vertical_count":len(verts),
                      "material_annotations":mats,
                      "reasons":list(reasons),
                      "evidence":evidence.__dict__ if evidence else None,
                  }
                  if evidence:
                      span_pt=evidence.left_run_pt+evidence.right_run_pt
                      row["structural_span_pt"]=round(span_pt,4)
                      if getattr(vp,"scale_denominator",None):
                          # PDF point -> paper mm -> real metres at printed scale.
                          row["structural_span_m_from_scale"]=round(
                              span_pt*(25.4/72.0)*float(vp.scale_denominator)/1000.0,4
                          )
                          rise_pt=span_pt/2.0*math.tan(math.radians(evidence.pitch_deg))
                          row["gable_rise_m_from_scale"]=round(
                              rise_pt*(25.4/72.0)*float(vp.scale_denominator)/1000.0,4
                          )
                          span_m=row["structural_span_m_from_scale"]
                          rise_m=row["gable_rise_m_from_scale"]
                          row["two_gable_area_m2_from_scale"]=round(span_m*rise_m,4)
                  rows.append(row)

              print("KSTVET_GABLE_ROOFLINE_AUTHORITY="+json.dumps({
                  "source_sha256":actual,
                  "production_sha":"65bbdb077333e376e2c0ee0cb6dd002afa28197c",
                  "elevations":rows,
              },sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          PY
