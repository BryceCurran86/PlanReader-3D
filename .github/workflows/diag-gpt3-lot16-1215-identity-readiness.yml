name: DIAG GPT3 Lot16 1215 Identity Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt3_lot16_1215_identity_readiness.py"
      - "tests/test_gpt3_lot16_1215_identity_readiness.py"
      - ".github/workflows/diag-gpt3-lot16-1215-identity-readiness.yml"
      - "docs/engineering/gpt3_lot16_1215_identity_readiness_20261013.md"
      - "tools/diag_gptmax_source_authority_stages.py"
  workflow_dispatch:

concurrency:
  group: gpt3-lot16-1215-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Fail-closed prebinding regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_lot16_1215_identity_readiness.py
          python -m compileall -q tools/diag_gpt3_lot16_1215_identity_readiness.py
          ruff check --select F821,F823 tools/diag_gpt3_lot16_1215_identity_readiness.py tests/test_gpt3_lot16_1215_identity_readiness.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py

  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Reauthenticate original 1215 label location and prove future identity only
        shell: bash
        run: |
          set -euo pipefail
          ROOT=artifacts/gpt3-lot16-1215-identity-readiness
          mkdir -p "$ROOT"
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check

          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" \
            --page-id 3 \
            --source-all-pages \
            --include-identity-text-receipts \
            --output "$ROOT/source-report.json"

          PYTHONPATH=. python -u -m tools.diag_gpt3_lot16_1215_identity_readiness \
            --source-report "$ROOT/source-report.json" \
            --object-universe benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/object_universe.json \
            --source-manifest benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/source_manifest.json \
            --sealed-run docs/engineering/lot16_original_identity_reconciliation_20261012/source_sealed_run.json \
            --active-identity-map docs/engineering/lot16_original_identity_reconciliation_20261012/identity_map.json \
            --output "$ROOT/readiness.json"

          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("artifacts/gpt3-lot16-1215-identity-readiness/readiness.json")
          d=json.loads(p.read_text())
          assert d["status"]=="IDENTITY_READY_QUANTITY_UNSEALED"
          assert d["physical_opening_id"]=="physical_opening_existence_2b2a91e8afaf8b7e9a3e07605a80a4a9"
          assert d["benchmark_item_id"]=="lot16-1215-sgw-obs-01-area"
          assert d["benchmark_object_ref"]=="lot16:opening:p3:1215_sgw_obs:01"
          assert d["source_sha256"]=="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert [round(x,1) for x in d["source_label_bbox_pdf_pt"]]==[622.4,430.7,661.0,438.5]
          assert d["frozen_source_bbox_pdf_pt"]==[622.4,430.7,661.0,438.5]
          assert d["source_location_equal_at_frozen_precision"] is True
          assert d["source_location_unique_in_frozen_external_openings"] is True
          assert d["identity_ready_for_future_sealed_quantity"] is True
          assert d["target_currently_present_in_sealed_run"] is False
          assert d["target_currently_present_in_active_identity_map"] is False
          assert d["active_identity_map_modified"] is False
          assert d["benchmark_score_granted"] is False
          assert d["benchmark_accuracy"] is None
          assert d["numeric_quantity_similarity_used"] is False
          assert d["name_or_description_similarity_used"] is False
          assert d["ordinal_or_nearest_matching_used"] is False
          print(json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-lot16-1215-identity-readiness
          path: artifacts/gpt3-lot16-1215-identity-readiness
          retention-days: 30
