name: DIAG GPT2 Maryborough Fragmenting Wall Lineage

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trace fragmenting wall lineage
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-maryborough-fragmenting-wall-lineage
          git rev-parse HEAD > artifacts/gpt2-maryborough-fragmenting-wall-lineage/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-fragmenting-wall-lineage/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_fragmenting_wall_lineage.py \
            | tee artifacts/gpt2-maryborough-fragmenting-wall-lineage/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-fragmenting-wall-lineage
          path: artifacts/gpt2-maryborough-fragmenting-wall-lineage
          retention-days: 1
