name: TEST GPT2 Original Rotation Source Clip and Glyph Authority

on:
  pull_request:
    paths:
      - pb_pdf_text_integrity_authority.py
      - tests/test_gpt2_original_pdf_rotation_clip_source_authority.py
      - .github/workflows/test-gpt2-original-rotation-clip-identity.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  original-native-zero-rotation-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact checkout SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent embedded glyph test dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt fonttools
      - name: Original PDF source SHA and native rotation clip + glyph positive
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q -rs tests/test_gpt2_original_pdf_rotation_clip_source_authority.py tests/test_gpt2_symbol_source_optin_native_word_integrity.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
