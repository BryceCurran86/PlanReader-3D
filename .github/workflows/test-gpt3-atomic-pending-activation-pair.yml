name: GPT3 Atomic Source Identity Activation Pair
on:
  pull_request:
    branches: [main]
    paths:
      - tools/gpt3_atomic_pending_activation_pair.py
      - tools/prepare_gpt3_pending_identity_activation.py
      - tools/prepare_gpt3_pending_floor_surface_identity_activation.py
      - tests/test_gpt3_atomic_pending_activation_pair.py
      - .github/workflows/test-gpt3-atomic-pending-activation-pair.yml
permissions:
  contents: read
jobs:
  original-v1-activation-all-or-none:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Two actual opening/floor activation CLIs and source-byte protected rollback
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_atomic_pending_activation_pair.py tests/test_gpt3_pending_identity_activation.py tests/test_gpt3_pending_floor_surface_identity_activation.py tests/test_gpt3_guarded_pending_owned_rollback.py
          ruff check --select F821,F823 tools/gpt3_atomic_pending_activation_pair.py tools/prepare_gpt3_pending_identity_activation.py tools/prepare_gpt3_pending_floor_surface_identity_activation.py tests/test_gpt3_atomic_pending_activation_pair.py
