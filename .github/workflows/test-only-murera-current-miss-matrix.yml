name: TEST-ONLY Murera Current Miss Matrix

on:
  pull_request:
    branches: [main]

jobs:
  murera-matrix:
    if: startsWith(github.head_ref, 'diag/murera-current-miss-matrix')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies and Tesseract
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Murera benchmark and emit item matrix
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          benchmark_id="tenders_ke_murera_science_lab"
          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected_sha="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-current-matrix/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/murera.pdf"); source.write_bytes(payload)

          extractor=GenericPlanReaderExtractor()
          predictions=extractor.extract_from_pdf(source, pages=list(range(218, 238)))
          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/murera-results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              predictions=predictions,
              auto_extract=False,
          )
          result={
              "source_sha256":actual,
              "project":{
                  "accepted":int(report.exact_matches+report.within_5_percent),
                  "denominator":int(report.total_items_compared),
                  "accuracy_percentage":report.overall_accuracy_percentage,
                  "exact":int(report.exact_matches),
                  "within_5":int(report.within_5_percent),
                  "gross":int(report.gross_mismatches),
                  "missed":int(report.missed_items),
                  "hallucinated":int(report.hallucinated_items),
              },
              "items":[item.to_dict() for item in report.item_results],
              "predictions":[p.to_dict() for p in predictions],
          }
          print("MURERA_CURRENT_MATRIX="+json.dumps(result,sort_keys=True),flush=True)
          PY
