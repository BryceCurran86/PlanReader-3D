name: DIAG Lot16 Opening Schedule Count Census

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Census authenticated schedule rows
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_opening_schedule_count_census.py | tee lot16-opening-schedule-count-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-opening-schedule-count-census
          path: lot16-opening-schedule-count-census.json
          retention-days: 1
