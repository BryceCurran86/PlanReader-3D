name: GPT2 Rotated RCP Focused Proof
on:
  push:
    branches:
      - gpt2/rotated-semantic-native-title-basis-20261009
  workflow_dispatch:
jobs:
  viewport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/benchmarks/test_mutation_viewport_segmentation.py -q -x --tb=long
