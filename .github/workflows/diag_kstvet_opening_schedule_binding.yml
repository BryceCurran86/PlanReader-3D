name: KSTVET Opening Schedule Binding Probe

on:
  push:
    branches: [diag/kstvet-opening-schedule-binding-main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Trace page54 semantic openings and schedule bindings
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_semantic_opening_enumeration_authority import SemanticOpeningEnumerationProducer
          from pb_physical_opening_authority import PhysicalOpeningAuthority
          from pb_source_observation_authority import ObservationSelector
          from pb_schedule_opening_instance_binding_authority import (
              ScheduleOpeningInstanceBindingProducer,
          )
          from pb_opening_schedule_v171 import parse_schedule_page
          import fitz

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="kstvet-opening-schedule-probe",
              producer_version="1.0",
          )
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-opening-schedule-probe",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          rev=pub.revision.revision_id
          scope="opening-schedule:page-54"

          sem=SemanticOpeningEnumerationProducer.from_source_visibility_producer(source)
          sem_res=sem.publish_page_scope(
              revision_id=rev,
              decision_scope_id=scope,
              page_ids=("54",),
          )
          print("OPENING_SEMANTIC_ENUM "+json.dumps({
              "status":sem_res.status.value,
              "reasons":list(sem_res.reason_codes),
              "record":None if sem_res.record is None else {
                  "opening_ids":list(sem_res.record.physical_opening_record_ids),
                  "representatives":list(sem_res.record.representative_observation_ids),
                  "support":list(sem_res.record.opening_support_observation_ids),
                  "residual":list(sem_res.record.residual_visible_observation_ids),
                  "conflicts":list(sem_res.record.conflict_observation_ids),
                  "structural_complete":sem_res.record.structural_enumeration_complete,
                  "physical_universe_complete":sem_res.record.physical_opening_universe_complete,
              }
          },sort_keys=True))

          doc=fitz.open(stream=payload,filetype="pdf")
          page=doc[53]
          entries=parse_schedule_page(page,page_no=54)
          print("OPENING_SCHEDULE_ENTRIES "+json.dumps([{
              "mark":e.type_mark,
              "width":e.width_mm,
              "height":e.height_mm,
              "desc":e.description,
              "count":e.count,
              "count_explicit":e.count_explicit,
              "parse_source":e.parse_source,
              "basis":e.dimension_basis,
              "bbox":list(e.bbox),
          } for e in entries],sort_keys=True))
          doc.close()

          binder=ScheduleOpeningInstanceBindingProducer.from_source_visibility_producer(source)
          physical=PhysicalOpeningAuthority(source.authority())
          rows=[]
          reps=() if sem_res.record is None else sem_res.record.representative_observation_ids
          for obs_id in reps:
              selector=ObservationSelector(
                  document_id=pub.revision.document_id,
                  revision_id=pub.revision.revision_id,
                  source_sha256=pub.revision.source_sha256,
                  snapshot_id=pub.snapshot.snapshot_id,
                  observation_id=obs_id,
              )
              existence=physical.prove_existence(selector)
              bind=binder.publish_scope(
                  opening_selector=selector,
                  decision_scope_id=scope,
              )
              rows.append({
                  "observation":obs_id,
                  "physical_status":existence.status.value,
                  "physical_record_id":(
                      existence.existence_record.record_id
                      if existence.existence_record is not None else None
                  ),
                  "physical_support":(
                      list(existence.existence_record.source_observation_ids)
                      if existence.existence_record is not None else []
                  ),
                  "binding_status":bind.status.value,
                  "binding_reasons":list(bind.reason_codes),
                  "binding":None if bind.record is None else {
                      "mark":bind.record.schedule_row_type_mark,
                      "width":bind.record.schedule_width_mm,
                      "height":bind.record.schedule_height_mm,
                      "count":bind.record.schedule_row_count,
                      "count_explicit":bind.record.schedule_row_count_explicit,
                      "schedule_row_obs":list(bind.record.schedule_row_observation_ids),
                      "schedule_row_id":bind.record.schedule_row_id,
                  },
              })
          print("OPENING_INSTANCE_BINDINGS "+json.dumps(rows,sort_keys=True))
          print("OPENING_BINDING_COUNTS "+json.dumps({
              "physical":len(rows),
              "bound":sum(1 for row in rows if row["binding"] is not None),
              "by_mark":{
                  mark:sum(1 for row in rows if row["binding"] and row["binding"]["mark"]==mark)
                  for mark in sorted({
                      row["binding"]["mark"] for row in rows if row["binding"]
                  })
              }
          },sort_keys=True))
          PY
