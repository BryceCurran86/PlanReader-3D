name: Item35 Murera Runtime Probe
# test-only runtime measurement
on:
  push:
    branches: [review/item35-murera-runtime-after-index-v1]

jobs:
  murera:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified Murera source
        run: |
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3             "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"             -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf" | sha256sum -c -
      - name: Run Murera canonical benchmark
        env:
          PYTHONPATH: .
        run: |
          rm -rf benchmark_results_runtime
          /usr/bin/time -v python pb_benchmark_accuracy_engine.py             --benchmark tenders_ke_murera_science_lab             --auto-extract             --output-dir benchmark_results_runtime
      - name: Print Murera result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmark_results_runtime/tenders_ke_murera_science_lab_accuracy_report.json")
          if not p.exists():
              raise SystemExit("Murera report not produced")
          d=json.loads(p.read_text())
          s=d["summary"]
          accepted=int(s["exact_matches"])+int(s["within_5_percent"])
          print(f"MURERA accepted={accepted}/{s['total_items_compared']}")
          print(json.dumps(s,indent=2))
          PY
