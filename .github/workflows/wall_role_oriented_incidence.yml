name: Wall Role Oriented Incidence

on:
  push:
    branches: [gpt/wall-role-oriented-incidence-v1]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run oriented incidence matrix
        run: |
          PYTHONPATH=. pytest -q             tests/test_wall_role_oriented_incidence_v1.py             tests/test_source_wall_topology_authority_v1.py             tests/test_wall_role_authority_v1.py
