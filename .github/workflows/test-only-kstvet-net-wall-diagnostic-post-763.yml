name: TEST-ONLY KSTVET Net Wall Diagnostic Post 763

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-net-wall:
    if: startsWith(github.head_ref, 'diag/kstvet-window-spatial-binding-post-763')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Trace KSTVET wall/opening publication gates
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected_sha="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-net-wall-post-763/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/kstvet.pdf")
          source.write_bytes(payload)

          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(source, collect_item35_shadow=False)
          focus=[]
          for p in preds:
              if (
                  p.tag in {
                      "perimeter_walling","gable_walling","internal_plaster",
                      "internal_paint","external_key_pointing","external_render",
                      "W1","W2","D1","windows_complete","steel_casement_windows",
                      "doors_complete","doors"
                  }
                  or p.trade_type in {"windows","doors","walls","finishes"}
              ):
                  focus.append({
                      "tag":p.tag,
                      "trade_type":p.trade_type,
                      "description":p.description,
                      "quantity":p.quantity,
                      "unit":p.unit,
                      "confidence":p.confidence,
                      "source_page":p.source_page,
                      "dimensions":p.dimensions,
                      "bbox":p.bounding_box,
                      "metadata":p.metadata,
                  })

          out={
              "source_sha256":actual,
              "production_sha":"65bbdb077333e376e2c0ee0cb6dd002afa28197c",
              "focus_predictions":focus,
              "extraction_status":ex.extraction_status,
              "live_net_wall_shadow":ex.live_net_wall_shadow,
              "opening_authority_shadow":ex.opening_authority_shadow,
              "opening_provenance_shadow":ex.opening_provenance_shadow,
              "hosted_opening_shadow":ex.hosted_opening_shadow,
              "item35_authority_shadow":ex.item35_authority_shadow,
          }
          print("KSTVET_NET_WALL_DIAGNOSTIC_POST_763="+json.dumps(out,sort_keys=True,default=str),flush=True)
          PY
