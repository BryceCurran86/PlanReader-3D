name: TEST-ONLY KSTVET E02 Gable Endpoint

on:
  pull_request:
    branches: [main]

jobs:
  e02-endpoint:
    if: startsWith(github.head_ref, 'diag/kstvet-e02-gable-endpoint')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Trace E02 apex rays against vertical supports
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,math,urllib.request
          from pathlib import Path
          import fitz
          import pb_source_roof_covering_authority as roof
          from pb_viewport_segmentation import segment_page_viewports

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-E02-endpoint/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(actual)
          src=Path("/tmp/kstvet.pdf"); src.write_bytes(payload)

          doc=fitz.open(src)
          try:
              page=doc[53]
              vps=segment_page_viewports(page,page_number=54)
              vp=next(v for v in vps if v.label=="ELEVATION E-02" and v.bounding_box is not None)
              bbox=roof.get_elevation_viewport_search_bbox(vp,vps,page.rect)
              diags,verts=roof.extract_elevation_segments_from_page(page,bbox)
              clusters=roof._cluster_apex_candidates(diags)
              out={
                  "source_sha256":actual,
                  "candidate_sha":"61060b7e1a3ba39968f32bfa13e6e2c3742d93a3",
                  "bbox":bbox,
                  "scale_denominator":vp.scale_denominator,
                  "diagonals":[d.__dict__ for d in diags],
                  "vertical_count":len(verts),
                  "clusters":[],
              }
              for apex,members in clusters:
                  left=[m for m in members if m.direction==-1]
                  right=[m for m in members if m.direction==1]
                  lp=sum(m.pitch_deg for m in left)/len(left) if left else None
                  rp=sum(m.pitch_deg for m in right)/len(right) if right else None
                  mean=(lp+rp)/2.0 if lp is not None and rp is not None else None
                  row={
                      "apex":apex,
                      "members":[m.__dict__ for m in members],
                      "left_pitch":lp,
                      "right_pitch":rp,
                      "mean_pitch":mean,
                      "vertical_candidates":[],
                  }
                  if mean is not None:
                      ax,ay=apex
                      tanp=math.tan(math.radians(mean))
                      for v in verts:
                          dx=v.x-ax
                          direction=1 if dx>0 else -1
                          run=abs(dx)
                          expected_y=ay+run*tanp
                          gap=abs(v.top_y-expected_y)
                          if run >= 10.0 and gap <= 25.0:
                              row["vertical_candidates"].append({
                                  **v.__dict__,
                                  "direction":"right" if direction==1 else "left",
                                  "run_pt":round(run,4),
                                  "expected_top_y":round(expected_y,4),
                                  "ray_gap_pt":round(gap,4),
                                  "qualifies_current":(
                                      run>=roof.MIN_HORIZONTAL_RUN_PT and
                                      gap<=roof.MAX_WALLCORNER_RAY_GAP_PT
                                  ),
                              })
                      row["vertical_candidates"].sort(key=lambda x:(x["direction"],x["ray_gap_pt"],-x["run_pt"]))
                      row["left_current"]=roof._find_farthest_structural_run(apex,mean,-1,verts)
                      row["right_current"]=roof._find_farthest_structural_run(apex,mean,1,verts)
                  out["clusters"].append(row)

              print("KSTVET_E02_GABLE_ENDPOINT="+json.dumps(out,sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          PY
