name: DIAG GPT3 Maryborough Split Sealed Runs V2

on:
  push:
    branches:
      - diag/gpt3-maryborough-perf-stack-v1

concurrency:
  group: diag-gpt3-maryborough-split-v2
  cancel-in-progress: true

jobs:
  sealed-family:
    strategy:
      fail-fast: false
      matrix:
        family_group: [core, surfaces]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Run Maryborough sealed family
        shell: bash
        run: |
          set -o pipefail
          ROOT="artifacts/gpt3-maryborough-split/${{ matrix.family_group }}"
          mkdir -p "$ROOT"
          START=$(date +%s)
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id au_qld_maryborough_service_station \
            --workspace-id 1 \
            --family-group "${{ matrix.family_group }}" \
            --output-dir "$ROOT" \
            | tee "$ROOT/stdout.json"
          END=$(date +%s)
          echo "{\"elapsed_seconds\":$((END-START))}" > "$ROOT/elapsed.json"
      - name: Audit sealed family
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          family="${{ matrix.family_group }}"
          root=Path("artifacts/gpt3-maryborough-split")/family
          summary=json.loads((root/"production_summary.json").read_text())
          combined=root/f"au_qld_maryborough_service_station.{family}.json"
          payload=json.loads(combined.read_text()) if combined.is_file() else {}
          quantities=payload.get("quantities") or []
          elapsed={}
          elapsed_path=root/"elapsed.json"
          if elapsed_path.is_file():
              elapsed=json.loads(elapsed_path.read_text())
          audit={
              "family_group":family,
              "source_sha256":summary.get("source_sha256"),
              "status":summary.get("status"),
              "claim_status":summary.get("claim_status"),
              "claim_reason_codes":summary.get("claim_reason_codes") or [],
              "canonical_counts":summary.get("canonical_counts") or {},
              "family_counts":summary.get("family_counts") or {},
              "combined_quantity_count":summary.get("combined_quantity_count",0),
              "elapsed_seconds":elapsed.get("elapsed_seconds"),
              "combined_run_file_exists":combined.is_file(),
              "lineage_conflicts":sum(not bool(q.get("lineage_ok",False)) for q in quantities),
              "abstained_outputs":sum(bool(q.get("abstained",False)) for q in quantities),
              "missing_identity_refs":sum(not bool(q.get("object_identity_refs")) for q in quantities),
              "zero_non_abstained":sum(
                  not bool(q.get("abstained",False))
                  and q.get("value") is not None
                  and float(q["value"]) == 0.0
                  for q in quantities
              ),
              "quantities":[{
                  "quantity_id":q.get("quantity_id"),
                  "family":q.get("family"),
                  "semantic_key":q.get("semantic_key"),
                  "value":q.get("value"),
                  "unit":q.get("unit"),
                  "authority":q.get("authority"),
                  "object_identity_refs":q.get("object_identity_refs") or [],
                  "evidence_ids":q.get("evidence_ids") or [],
                  "trace_evidence_ids":q.get("trace_evidence_ids") or [],
                  "lineage_ok":q.get("lineage_ok"),
              } for q in quantities],
          }
          out=root/"audit.json"
          out.write_text(json.dumps(audit,indent=2,sort_keys=True)+"\n")
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-maryborough-${{ matrix.family_group }}-v2
          path: artifacts/gpt3-maryborough-split/${{ matrix.family_group }}
          retention-days: 3
