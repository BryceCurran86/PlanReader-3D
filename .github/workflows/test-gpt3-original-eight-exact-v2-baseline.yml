name: GPT3 Original Lot16 Signed Eight Exact Frozen V2 Baseline
on:
  pull_request:
    branches: [main]
    paths:
      - tools/replay_gpt3_immutable_lot16_eight_original_v2.py
      - tests/test_gpt3_original_eight_frozen_v2_exact_baseline.py
      - .github/workflows/test-gpt3-original-eight-exact-v2-baseline.yml
permissions:
  contents: read
jobs:
  immutable-original-eight-full-plan-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Historical signed original eight and unchanged Full Plan V2 evaluator
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_original_eight_frozen_v2_exact_baseline.py
          ruff check --select F821,F823 tools/replay_gpt3_immutable_lot16_eight_original_v2.py tests/test_gpt3_original_eight_frozen_v2_exact_baseline.py
      - name: Preserve historical score-only diagnostic without private client bytes
        run: |
          PYTHONPATH=. python -u tools/replay_gpt3_immutable_lot16_eight_original_v2.py --output historical-lot16-eight-v2-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gpt3-historical-lot16-eight-v2-${{ matrix.python-version }}
          path: historical-lot16-eight-v2-report.json
          retention-days: 14
