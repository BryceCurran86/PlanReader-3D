name: Item 19B branch shadow

on:
  push:
    branches:
      - gpt/item19b-direct-finish-face-binding
  pull_request:
    branches:
      - main

jobs:
  kstvet-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff

      - name: Targeted Item 19B synthetic matrix
        run: PYTHONPATH=. pytest -q tests/test_wall_finish_face_binding_authority_v1.py

      - name: Compile and undefined-name gates
        run: |
          python -m py_compile pb_wall_finish_face_binding_authority.py scripts/wall_finish_face_binding_kstvet_shadow.py tests/test_wall_finish_face_binding_authority_v1.py
          ruff check --select F821,F823 pb_wall_finish_face_binding_authority.py scripts/wall_finish_face_binding_kstvet_shadow.py tests/test_wall_finish_face_binding_authority_v1.py

      - name: Download canonical KSTVET source and verify pinned SHA
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors             https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf             --output /tmp/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

      - name: Real KSTVET page 54 Item 19B shadow
        run: |
          PYTHONPATH=. python scripts/wall_finish_face_binding_kstvet_shadow.py /tmp/1727358888238-bq-nd-drawing.pdf | tee /tmp/item19b-kstvet-shadow.json

      - name: Integrity gates
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          git diff --name-only 59c2593e1c724b97735bee1cc966d735478c9424 HEAD | python scripts/check_benchmark_gold_separation.py

      - uses: actions/upload-artifact@v4
        with:
          name: item19b-kstvet-shadow
          path: /tmp/item19b-kstvet-shadow.json
