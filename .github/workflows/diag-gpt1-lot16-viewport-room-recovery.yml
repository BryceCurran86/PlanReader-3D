name: DIAG GPT1 Lot16 Viewport Room Recovery

on:
  push:
    branches:
      - gpt1/room-incomplete-universe-viewport-fallback-current-v1

concurrency:
  group: diag-gpt1-lot16-viewport-room-recovery
  cancel-in-progress: true

jobs:
  real-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused room regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_canonical_room_composition.py             tests/test_source_room_viewport_scope_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Real Lot16 room and surface proof
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-viewport-room-recovery.json
          import json
          from pathlib import Path

          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(2,),
              topology_pages=(2,),
              room_area_support_pages=None,
          )
          floors=tuple(
              q for q in publish_live_floor_area_quantities(claim)
              if not q.abstained and q.value is not None
          )
          out={
              "claim_status":claim.status.value,
              "claim_reason_codes":list(claim.reason_codes),
              "canonical_room_status":claim.canonical_room_status.value,
              "canonical_room_reason_codes":list(claim.canonical_room_reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "labeled_room_count":sum(1 for r in claim.canonical_rooms if r.room_label),
              "rooms":[
                  {
                      "physical_room_id":r.physical_room_id,
                      "room_label":r.room_label,
                      "viewport_id":r.viewport_id,
                      "decision_scope_id":r.decision_scope_id,
                      "label_binding":bool(r.room_label_binding_record_id),
                      "label_evidence_count":len(r.room_label_evidence_ids),
                      "geometry_complete":r.geometry_complete,
                  }
                  for r in claim.canonical_rooms
                  if r.room_label
              ],
              "room_area_quantity_count":sum(
                  1 for q in claim.room_area_quantity_evidence
                  if not q.abstained and q.value is not None
              ),
              "room_areas":[
                  {
                      "value":q.value,
                      "unit":q.unit,
                      "metadata":dict(q.metadata or {}),
                  }
                  for q in claim.room_area_quantity_evidence
                  if not q.abstained and q.value is not None
              ],
              "floor_area_quantity_count":len(floors),
              "floor_areas":[
                  {"value":q.value,"unit":q.unit,"metadata":dict(q.metadata or {})}
                  for q in floors
              ],
              "floor_finish_quantity_count":sum(
                  1 for q in claim.floor_finish_quantity_evidence
                  if not q.abstained and q.value is not None
              ),
              "ceiling_quantity_count":sum(
                  1 for q in claim.ceiling_lining_quantity_evidence
                  if not q.abstained and q.value is not None
              ),
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-viewport-room-recovery
          path: lot16-viewport-room-recovery.json
          retention-days: 3
