name: DIAG GPT1 Lot16 Viewport Room Recovery

on:
  push:
    branches:
      - gpt1/room-incomplete-universe-viewport-fallback-current-v1

concurrency:
  group: diag-gpt1-lot16-viewport-room-recovery
  cancel-in-progress: true

jobs:
  real-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused room regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_canonical_room_composition.py             tests/test_source_room_viewport_scope_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Trace Lot16 floor-plan title ownership
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-viewport-room-recovery.json
          import json
          from pathlib import Path
          import fitz
          import pb_page_title_authority as title_authority
          import pb_viewport_segmentation as viewport

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          doc=fitz.open(path)
          try:
              page=doc.load_page(2)
              width=float(page.rect.width)
              height=float(page.rect.height)
              analysis=title_authority.analyse_cells(
                  title_authority.page_cells(page),
                  width,
                  height,
                  0,
                  "native",
              )
              anchors=viewport.extract_view_title_anchors(page)
              owned=viewport._title_field_owned_regions(page)
              title_block=viewport._proven_title_block_region(page)
              out={
                  "rotation":int(page.rotation or 0),
                  "title_block":None if analysis.title_block is None else list(analysis.title_block),
                  "proven_title_block_region":None if title_block is None else list(title_block),
                  "owned_title_field_regions":[list(x) for x in owned],
                  "page_title_candidates":[
                      {
                          "text":candidate.text,
                          "kind":candidate.kind,
                          "score":candidate.score,
                          "region":candidate.region,
                          "reason":candidate.reason,
                          "box":list(candidate.box),
                          "rejected":candidate.rejected,
                          "label_strength":candidate.label_strength,
                          "classified_view_type":viewport.DrawingViewClassifier.classify_text(
                              viewport._strip_scale_suffix(candidate.text)
                          ).value,
                      }
                      for candidate in analysis.candidates
                  ],
                  "view_title_anchors":[
                      {
                          "text":a.text,
                          "view_type":a.view_type,
                          "bbox":list(a.bbox),
                      }
                      for a in anchors
                  ],
                  "segmented_viewports":[
                      {
                          "view_id":v.view_id,
                          "view_type":v.view_type,
                          "label":v.label,
                          "status":v.status,
                          "bbox":None if v.bounding_box is None else list(v.bounding_box),
                          "notes":list(v.notes),
                          "provenance":dict(v.provenance or {}),
                      }
                      for v in viewport.segment_page_viewports(page,page_number=3)
                  ],
              }
              print(json.dumps(out,indent=2,sort_keys=True))
          finally:
              doc.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-viewport-room-recovery
          path: lot16-viewport-room-recovery.json
          retention-days: 3
