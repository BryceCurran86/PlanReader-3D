name: DIAG GPT1 Lot16 Viewport Room Recovery

on:
  push:
    branches:
      - gpt1/room-incomplete-universe-viewport-fallback-current-v1

concurrency:
  group: diag-gpt1-lot16-viewport-room-recovery
  cancel-in-progress: true

jobs:
  real-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused room regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_canonical_room_composition.py             tests/test_source_room_viewport_scope_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Trace Lot16 authenticated viewport scopes
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-viewport-room-recovery.json
          import hashlib
          import json
          from pathlib import Path
          import fitz

          from pb_drawing_evidence_binding import DrawingViewType
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateProducer
          from pb_source_room_face_authority import SourceRoomFaceSelector, build_source_room_face_authority
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_viewport_segmentation import segment_page_viewports

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          payload=path.read_bytes()
          source_sha=hashlib.sha256(payload).hexdigest()

          pdf=fitz.open(stream=payload,filetype="pdf")
          try:
              segmented=[
                  {
                      "view_id":v.view_id,
                      "view_type":v.view_type,
                      "status":v.status,
                      "label":v.label,
                      "bbox":None if v.bounding_box is None else list(v.bounding_box),
                      "scale_denominator":getattr(v,"scale_denominator",None),
                  }
                  for v in segment_page_viewports(pdf.load_page(2),page_number=3)
              ]
          finally:
              pdf.close()

          source=SourceVisibilityProducer(
              producer_method="diag-gpt1-lot16-viewport",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id=f"diag-lot16:{source_sha[:32]}",
              source_bytes=payload,
              source_locator="memory://lot16.pdf",
              page_ids=("3",),
          )
          wall_producer=PhysicalWallCandidateProducer.from_authenticated_viewports(
              source,
              page_ids=("3",),
          )
          authority=wall_producer.authority()
          refreshed=source.published_snapshot_for_revision(published.revision.revision_id)
          room_authority=build_source_room_face_authority(authority)

          all_selectors=authority.selectors_for_authenticated_viewports(
              document_id=refreshed.revision.document_id,
              revision_id=refreshed.revision.revision_id,
              source_sha256=refreshed.revision.source_sha256,
              snapshot_id=refreshed.snapshot.snapshot_id,
              page_id="3",
          )
          floor_selectors=authority.selectors_for_authenticated_viewports(
              document_id=refreshed.revision.document_id,
              revision_id=refreshed.revision.revision_id,
              source_sha256=refreshed.revision.source_sha256,
              snapshot_id=refreshed.snapshot.snapshot_id,
              page_id="3",
              view_type=DrawingViewType.FLOOR_PLAN.value,
          )

          scopes=[]
          for selector in all_selectors:
              wall=authority.resolve_scope(selector)
              room=room_authority.resolve_scope(
                  SourceRoomFaceSelector(
                      document_id=selector.document_id,
                      revision_id=selector.revision_id,
                      source_sha256=selector.source_sha256,
                      snapshot_id=selector.snapshot_id,
                      page_id=selector.page_id,
                      decision_scope_id=selector.decision_scope_id,
                  )
              )
              scopes.append({
                  "decision_scope_id":selector.decision_scope_id,
                  "viewport_id":wall.viewport_id,
                  "viewport_view_type":wall.viewport_view_type,
                  "viewport_bbox":None if wall.viewport_bbox is None else list(wall.viewport_bbox),
                  "wall_status":wall.status.value,
                  "wall_reason_codes":list(wall.reason_codes),
                  "wall_scope_complete":wall.scope_complete,
                  "wall_record_count":len(wall.records),
                  "room_status":room.status.value,
                  "room_reason_codes":list(room.reason_codes),
                  "room_scope_complete":room.scope_complete,
                  "room_face_universe_complete":room.face_universe_complete,
                  "room_record_count":len(room.records),
              })

          print(json.dumps({
              "segmented_viewports":segmented,
              "authenticated_viewport_selector_count":len(all_selectors),
              "authenticated_floor_plan_selector_count":len(floor_selectors),
              "scopes":scopes,
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-viewport-room-recovery
          path: lot16-viewport-room-recovery.json
          retention-days: 3
