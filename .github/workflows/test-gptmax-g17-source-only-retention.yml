name: GPT MAX G17 Source-Only Retention Audit
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gptmax_g17_nomination_retention.py"
      - "tools/diag_gptmax_g17_source_only_flanks.py"
      - "tests/test_gptmax_g17_nomination_retention.py"
      - "tests/test_gptmax_g17_source_only_flanks.py"
      - ".github/workflows/test-gptmax-g17-source-only-retention.yml"
permissions:
  contents: read
jobs:
  fail-closed-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-only invariance, rekeys and negative receipt controls
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest -q tests/test_gptmax_g17_nomination_retention.py tests/test_gptmax_g17_source_only_flanks.py
          python -m compileall -q tools/diag_gptmax_g17_nomination_retention.py tools/diag_gptmax_g17_source_only_flanks.py
          ruff check --select F821,F823 tools/diag_gptmax_g17_nomination_retention.py tools/diag_gptmax_g17_source_only_flanks.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py
