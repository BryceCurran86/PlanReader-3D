name: GPT MAX G17 Source-Only Retention Audit
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gptmax_g17_nomination_retention.py"
      - "tools/diag_gptmax_g17_source_only_flanks.py"
      - "tests/test_gptmax_g17_nomination_retention.py"
      - "tests/test_gptmax_g17_source_only_flanks.py"
      - ".github/workflows/test-gptmax-g17-source-only-retention.yml"
permissions:
  contents: read
jobs:
  fail-closed-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-only invariance, rekeys and negative receipt controls
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest -q tests/test_gptmax_g17_nomination_retention.py tests/test_gptmax_g17_source_only_flanks.py
          python -m compileall -q tools/diag_gptmax_g17_nomination_retention.py tools/diag_gptmax_g17_source_only_flanks.py
          ruff check --select F821,F823 tools/diag_gptmax_g17_nomination_retention.py tools/diag_gptmax_g17_source_only_flanks.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py

  original-lot16-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Prove authenticated original G17 source without production mutation
        shell: bash
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages \
            --include-unhosted-raster-flank-source \
            --output /tmp/gptmax-original-g17-source.json
          PYTHONPATH=. python -u tools/diag_gptmax_g17_source_only_flanks.py \
            --source-report /tmp/gptmax-original-g17-source.json \
            --output /tmp/gptmax-g17-shadow-nominations.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/gptmax-original-g17-source.json').read_text())
          rows=json.loads(Path('/tmp/gptmax-g17-shadow-nominations.json').read_text())
          assert report['primitive_safety_cap'] == 20000
          assert report['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert report['summary']['physical_existence_claims']==21
          assert report['summary']['authenticated_hosts']==15
          assert report['summary']['resolved_source_frames']==9
          assert report['summary']['canonical_opening_area_records']==8
          assert len(report['source_owned_wall_scopes'][0]['records'])==2094
          assert len(rows)==len(report['unhosted_raster_flank_source_receipts'])==6
          assert len({r['physical_opening_id'] for r in rows})==len(rows)
          assert all(r['closed_source_flank_nomination'] and
                     len(r['source_flank_boxes'])==2 for r in rows)
          assert all(not r['physical_host_granted'] and
                     not r['metric_quantity_granted'] and
                     not r['customer_publication_granted'] and
                     not r['benchmark_score_granted'] for r in rows)
          print({'original_g17_source_flank_shadow_closure':len(rows),
                 'new_hosts_granted':0,'source_publications_granted':0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-g17-source-only-flanks
          path: |
            /tmp/gptmax-original-g17-source.json
            /tmp/gptmax-g17-shadow-nominations.json
          retention-days: 14
