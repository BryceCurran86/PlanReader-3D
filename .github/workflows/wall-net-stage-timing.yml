name: Wall Net Stage Timing
on:
  push:
    branches: [diag/wall-net-stage-timing]
    paths:
      - tools/trace_wall_net_stage_timing.py
      - .github/workflows/wall-net-stage-timing.yml
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: kstvet
            document_id: kstvet-timing
            page_id: "54"
            url: https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
            path: benchmarks/sources/1727358888238-bq-nd-drawing.pdf
            sha: 6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc
          - slug: lamu
            document_id: lamu-timing
            page_id: "41"
            url: https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf
            path: benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
            sha: fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and verify
        env: {URL: ${{ matrix.url }}, PATH_OUT: ${{ matrix.path }}, SHA: ${{ matrix.sha }}}
        run: |
          mkdir -p "$(dirname "$PATH_OUT")"
          curl --fail --location --retry 4 --retry-delay 3 "$URL" -o "$PATH_OUT"
          echo "$SHA  $PATH_OUT" | sha256sum -c -
      - name: Time authority stages
        env: {PYTHONPATH: ., PATH_OUT: ${{ matrix.path }}, DOCUMENT_ID: ${{ matrix.document_id }}, PAGE_ID: ${{ matrix.page_id }}, SLUG: ${{ matrix.slug }}}
        run: |
          mkdir -p timing
          python tools/trace_wall_net_stage_timing.py "$PATH_OUT" --document-id "$DOCUMENT_ID" --page-id "$PAGE_ID" | tee "timing/$SLUG.jsonl"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-net-stage-timing-${{ matrix.slug }}
          path: timing/${{ matrix.slug }}.jsonl
          if-no-files-found: warn
