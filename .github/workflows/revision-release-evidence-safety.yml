name: Revision release evidence safety
on:
  pull_request:
    paths:
      - 'pb_revision_release_audit.py'
      - 'tests/test_revision_release_audit.py'
      - '.github/workflows/revision-release-evidence-safety.yml'
  push:
    branches: [main]
    paths:
      - 'pb_revision_release_audit.py'
      - 'tests/test_revision_release_audit.py'
      - '.github/workflows/revision-release-evidence-safety.yml'
permissions:
  contents: read
jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test revision evidence receipts (fail closed)
        run: python -m pytest -q tests/test_revision_release_audit.py
