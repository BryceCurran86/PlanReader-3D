name: GPT1 Q01 CrossView Dimension Owner Source
# Public PR contracts only; source-bearing original jobs are in the dedicated
# owner-only secure-maryborough-original-source-replays.yml workflow.
on:
  pull_request:
    paths:
      - pb_cross_view_room_area_authority.py
      - tests/test_cross_view_room_area_authority_v1.py
      - .github/workflows/test-gpt1-q01-crossview-dimension-owner.yml

permissions:
  contents: read

jobs:
  maryborough-original-source-quantity-retention:
    # Historical required-check name retained. This PR check NEVER claims
    # the separate genuine original source replay has been executed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Public source-owner contracts (NO original-PDF validation)
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cross_view_room_area_authority_v1.py tests/test_same_view_room_area_authority_v1.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          echo "Only source-neutral PR contracts ran; authentic private source retention is separate."
