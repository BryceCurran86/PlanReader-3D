name: VR Editor TypeScript Build
on:
  pull_request:
    paths:
      - "vr-editor/**"
      - ".github/workflows/vr-editor-typescript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install editor dependencies
        working-directory: vr-editor
        run: npm install --no-audit --no-fund
      - name: Build strict TypeScript and renderer
        working-directory: vr-editor
        run: npm run build
