name: Item19B Component Target Role Fast

on:
  push:
    branches: [diag/item19b-component-target-role-fast]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Resolve internal target role from immutable source wall primitives
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateProducer
          from pb_wall_component_completeness_authority import (
              WallComponentCompletenessProducer,WallComponentCompletenessSelector
          )
          from pb_wall_role_authority import WallRoleProducer,WallRoleSelector,WallRoleClassification

          TARGET_RAW={
            "d4763i0","d4772i0","d5179i1","d5179i3",
            "d5214i0","d5215i0"
          }
          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-target-role-fast",
              producer_version="1.0",
          )
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-target-role-fast",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          t0=time.perf_counter()
          walls=PhysicalWallCandidateProducer.from_authenticated_viewports(
              source,page_ids=("54",)
          ).authority()
          t1=time.perf_counter()

          target_scope=None
          target_records=[]
          for scope in walls._scopes.values():
              if str(scope.viewport_id or "")!="view_p54_4":
                  continue
              for rec in scope.records:
                  raws=set(rec.physical_identity.source_primitive_ids)
                  if raws & TARGET_RAW:
                      target_records.append(rec)
              if target_records:
                  target_scope=scope
                  break
          assert target_scope is not None, "internal floor-plan target scope missing"
          raw_ids=tuple(sorted(rec.wall_candidate_id for rec in target_records))
          eq=target_scope.equivalence
          groups=[]
          for rec in target_records:
              group=(rec.wall_candidate_id,)
              if eq is not None:
                  for g in eq.equivalence_groups:
                      if rec.wall_candidate_id in g:
                          group=tuple(sorted(g)); break
              groups.append(group)
          distinct_groups=tuple(sorted(set(groups)))
          print("TARGET_RAW_OWNERS "+json.dumps({
              "owners":list(raw_ids),
              "groups":[list(g) for g in distinct_groups],
              "scope_complete":target_scope.scope_complete,
              "scope_reasons":list(target_scope.reason_codes),
          },sort_keys=True))
          assert len(distinct_groups)==1, distinct_groups
          group=distinct_groups[0]
          representative_candidates=[
              wall_id for wall_id in group
              if eq is not None and wall_id in set(eq.representative_wall_ids)
          ]
          assert len(representative_candidates)==1, representative_candidates
          target_wall=representative_candidates[0]

          cp=WallComponentCompletenessProducer.from_authorities(
              source_visibility_producer=source,
              physical_wall_candidate_authority=walls,
          )
          ca=cp.authority()
          t2=time.perf_counter()
          comp=ca.resolve(WallComponentCompletenessSelector(
              document_id=target_scope.document_id,
              revision_id=target_scope.revision_id,
              source_sha256=target_scope.source_sha256,
              snapshot_id=target_scope.snapshot_id,
              page_id=target_scope.page_id,
              decision_scope_id=target_scope.decision_scope_id,
              physical_wall_id=target_wall,
          ))
          print("TARGET_COMPONENT "+json.dumps({
              "status":comp.status.value,
              "reasons":list(comp.reason_codes),
              "component":comp.record.component_id if comp.record else None,
              "members":list(comp.record.member_wall_ids) if comp.record else [],
              "withheld_checked":len(comp.record.checked_withheld_observation_ids) if comp.record else None,
              "source_scope_complete":comp.record.source_scope_complete if comp.record else None,
          },sort_keys=True))

          roles=WallRoleProducer.from_source_topology(
              physical_wall_candidate_authority=walls,
              wall_component_completeness_authority=ca,
          )
          t3=time.perf_counter()
          role=roles.publish(WallRoleSelector(
              document_id=target_scope.document_id,
              revision_id=target_scope.revision_id,
              source_sha256=target_scope.source_sha256,
              snapshot_id=target_scope.snapshot_id,
              page_id=target_scope.page_id,
              decision_scope_id=target_scope.decision_scope_id,
              physical_wall_id=target_wall,
          ))
          print("TARGET_ROLE "+json.dumps({
              "wall":target_wall,
              "status":role.status.value,
              "reasons":list(role.reason_codes),
              "role":role.record.role.value if role.record else None,
              "record":role.record.record_id if role.record else None,
          },sort_keys=True))
          print("TARGET_TIMING "+json.dumps({
              "wall_sec":round(t1-t0,3),
              "component_sec":round(t2-t1,3),
              "topology_build_sec":round(t3-t2,3),
          },sort_keys=True))
          assert comp.status is EvidenceResolutionStatus.CORROBORATED, comp
          assert role.status is EvidenceResolutionStatus.CORROBORATED, role
          assert role.record is not None
          assert role.record.role is WallRoleClassification.INTERNAL, role.record
          PY
