name: DIAG GPTMAX Lot16 Raster Swing Gates

on:
  pull_request:
    branches:
      - gptmax/exact-two-face-lineage-host-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace current Lot16 raster swing gates
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_raster_swing_gates.py | tee lot16-raster-swing-gates.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-raster-swing-gates
          path: lot16-raster-swing-gates.json
          retention-days: 2
