name: DIAG Raster Swing Real Source

on:
  pull_request:
    branches:
      - gpt4/raster-door-swing-g17-v1

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run real-source raster swing census
        run: |
          PYTHONPATH=. python tools/diag_raster_swing_real_source.py | tee raster-swing-real-source.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-swing-real-source
          path: raster-swing-real-source.txt
          retention-days: 1
