name: TEST-ONLY KSTVET Page54 Opening Viewport Map

on:
  pull_request:
    branches: [main]

jobs:
  opening-viewport-map:
    if: startsWith(github.head_ref, 'diag/kstvet-page54-opening-viewport-map-633347')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Map semantic opening blockers to producer viewports
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from collections import Counter,defaultdict
          import fitz
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_semantic_opening_enumeration_authority import SemanticOpeningEnumerationProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_viewport_segmentation import (
              segment_page_viewports,
              assign_bbox_to_viewport,
              is_authoritative_derived_viewport,
          )

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-opening-viewport-map/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected:
              raise SystemExit(actual)

          full=fitz.open(stream=payload,filetype="pdf")
          page=full.load_page(53)
          viewports=segment_page_viewports(page,page_number=54)
          viewport_rows=[{
              "id":v.view_id,
              "type":v.view_type,
              "label":v.label,
              "status":v.status,
              "boundary_source":v.boundary_source,
              "bbox":v.bounding_box,
              "authoritative_derived":is_authoritative_derived_viewport(v),
              "provenance":v.provenance,
          } for v in viewports]
          one=fitz.open()
          one.insert_pdf(full,from_page=53,to_page=53)
          page_bytes=one.tobytes()
          one.close()
          full.close()

          source=SourceVisibilityProducer(
              producer_method="kstvet_page54_opening_viewport_map",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-page54-opening-map",
              source_bytes=page_bytes,
              source_locator="derived-from-canonical-page-54",
          )
          sem=SemanticOpeningEnumerationProducer.from_source_visibility_producer(source)
          result=sem.publish_page_scope(
              revision_id=published.revision.revision_id,
              decision_scope_id="kstvet-page54-map",
              page_ids=("1",),
          )
          record=result.record
          visibility=source.authority()

          categories={}
          if record is not None:
              for oid in record.visible_observation_ids:
                  categories[oid]="visible"
              for oid in record.opening_support_observation_ids:
                  categories[oid]="support"
              for oid in record.residual_visible_observation_ids:
                  categories[oid]="residual"
              for oid in record.conflict_observation_ids:
                  categories[oid]="conflict"

          counts=Counter()
          blocker_counts=Counter()
          samples=defaultdict(list)
          for oid,category in categories.items():
              sel=ObservationSelector(
                  document_id=published.revision.document_id,
                  revision_id=published.revision.revision_id,
                  source_sha256=published.revision.source_sha256,
                  snapshot_id=published.snapshot.snapshot_id,
                  observation_id=oid,
              )
              vr=visibility.resolve_visible(sel)
              obs=vr.observation
              if obs is None:
                  key="unresolved_observation"
              else:
                  geom=tuple(getattr(obs,"geometry",()) or ())
                  assigned=None
                  if len(geom)==4:
                      assigned=assign_bbox_to_viewport(geom,viewports,allow_derived=True)
                  if assigned is None:
                      key="unassigned"
                  else:
                      auth=(assigned.status=="resolved") or is_authoritative_derived_viewport(assigned)
                      key=f"{assigned.view_type}|{assigned.label}|auth={auth}|{assigned.view_id}"
                  if category in {"residual","conflict"} and len(samples[key])<12:
                      samples[key].append({
                          "category":category,
                          "observation_id":oid,
                          "geometry":geom,
                          "kind":getattr(obs,"observation_kind",None),
                      })
              counts[(category,key)]+=1
              if category in {"residual","conflict"}:
                  blocker_counts[key]+=1

          def counter_rows(counter):
              return [
                  {"key":list(k) if isinstance(k,tuple) else k,"count":v}
                  for k,v in sorted(counter.items(),key=lambda kv:(-kv[1],str(kv[0])))
              ]

          print("KSTVET_PAGE54_OPENING_VIEWPORT_MAP="+json.dumps({
              "production_sha":"633347965939aa4184d8edfc2330dd758601c1c9",
              "source_sha256":actual,
              "page_snapshot_sha256":hashlib.sha256(page_bytes).hexdigest(),
              "viewports":viewport_rows,
              "semantic_status":getattr(result.status,"value",str(result.status)),
              "semantic_reasons":result.reason_codes,
              "record_summary":None if record is None else {
                  "visible":len(record.visible_observation_ids),
                  "support":len(record.opening_support_observation_ids),
                  "residual":len(record.residual_visible_observation_ids),
                  "conflict":len(record.conflict_observation_ids),
                  "structural_complete":record.structural_enumeration_complete,
                  "universe_complete":record.physical_opening_universe_complete,
              },
              "counts":counter_rows(counts),
              "blocker_counts":counter_rows(blocker_counts),
              "blocker_samples":dict(samples),
          },sort_keys=True,default=str),flush=True)
          PY
