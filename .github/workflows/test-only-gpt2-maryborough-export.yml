name: TEST ONLY GPT2 Maryborough Current Main Export

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record SHA
        run: git rev-parse HEAD > GPT2_CURRENT_MAIN_SHA.txt
      - name: Pack repo
        run: git archive --format=tar.gz -o gpt2-current-main.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: gpt2-current-main
          path: |
            gpt2-current-main.tar.gz
            GPT2_CURRENT_MAIN_SHA.txt
          retention-days: 1
