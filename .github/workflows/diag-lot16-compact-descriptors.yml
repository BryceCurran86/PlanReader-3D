name: DIAG Lot16 Compact Descriptor Authority

on:
  pull_request:
    branches:
      - gptmax/opening-compact-descriptors-v1

jobs:
  page3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused descriptor authority tests
        run: |
          PYTHONPATH=. pytest -q tests/test_opening_label_dimension_authority.py
      - name: Run exact Lot16 page-3 opening quantity census
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/diag_lot16_opening_quantity_stack.py | tee lot16-opening-quantity-stack.json
      - name: Check no baseline regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("lot16-opening-quantity-stack.json").read_text())
          checks = {
              "canonical_opening_count": (payload["canonical_opening_count"], 81),
              "host_bound_count": (payload["host_bound_count"], 10),
              "canonical_kind_resolved_count": (payload["canonical_kind_resolved_count"], 6),
              "canonical_area_resolved_count": (payload["canonical_area_resolved_count"], 2),
              "quantity_count": (payload["quantity_count"], 1),
          }
          for name, (actual, baseline) in checks.items():
              if actual < baseline:
                  raise SystemExit(f"{name} regressed: {actual} < {baseline}")
          print(json.dumps(checks, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-compact-descriptor-census
          path: lot16-opening-quantity-stack.json
          retention-days: 1
