name: TEST GPT2 Original Dimension Extension Witness Chain
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_original_figured_extension_source_chain_shadow.py"
      - "tests/test_gpt2_original_figured_dimension_extension_chain.py"
      - ".github/workflows/test-gpt2-original-figured-extension.yml"
  workflow_dispatch:
jobs:
  original-figured-source-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original PWD extension gaps and continuous/split source negatives
        env:
          PYTHONPATH: .
        run: |
          echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_figured_dimension_extension_chain.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
