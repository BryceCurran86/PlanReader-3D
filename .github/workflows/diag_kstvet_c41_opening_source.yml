name: KSTVET C41 Opening Source Audit

on:
  push:
    branches: [diag/kstvet-c41-opening-source]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Audit opening source evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,re,fitz
          from pathlib import Path
          from pb_opening_callout_dimension_binder import parse_opening_size_callouts
          from pb_opening_tag_normalization import normalize_opening_tag
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_physical_opening_authority import PhysicalOpeningAuthority
          from pb_migration_contracts import EvidenceResolutionStatus

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          doc=fitz.open(stream=payload,filetype="pdf")

          snippets=[]
          callouts=[]
          for page_index,page in enumerate(doc):
              text=page.get_text("text") or ""
              if re.search(r"\b(?:2900|2,900|3000|3,000)\b",text,re.I):
                  lines=[
                      line.strip()
                      for line in text.splitlines()
                      if re.search(r"2900|2,900|3000|3,000|casement|window",line,re.I)
                  ]
                  snippets.append({"page":page_index+1,"lines":lines})
              for c in parse_opening_size_callouts(text):
                  if c.kind=="window" and round(c.width_mm) in {2900,3000}:
                      callouts.append({
                          "page":page_index+1,
                          "width":c.width_mm,
                          "height":c.height_mm,
                          "text":c.evidence_text,
                      })
          print("KSTVET_C41_NATIVE_SNIPPETS "+json.dumps(snippets,sort_keys=True))
          print("KSTVET_C41_SIZE_CALLOUTS "+json.dumps(callouts,sort_keys=True))

          # Page 54 physical opening / tag evidence, source-owned only.
          source=SourceVisibilityProducer(
              producer_method="kstvet-c41-source-audit",
              producer_version="1.0",
          )
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-c41-source-audit",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          visibility=source.authority()
          physical=PhysicalOpeningAuthority(visibility)
          opening_records={}
          for observation_id in pub.visible_observation_ids:
              result=physical.prove_existence(
                  ObservationSelector(
                      document_id=pub.revision.document_id,
                      revision_id=pub.revision.revision_id,
                      source_sha256=pub.revision.source_sha256,
                      snapshot_id=pub.snapshot.snapshot_id,
                      observation_id=observation_id,
                  )
              )
              if (
                  result.status is EvidenceResolutionStatus.CORROBORATED
                  and result.existence_record is not None
              ):
                  opening_records[result.existence_record.record_id]=result.existence_record

          print("KSTVET_C41_PHYSICAL_OPENINGS "+json.dumps([
              {
                  "record":record.record_id,
                  "page":record.page_id,
                  "source_observations":list(record.source_observation_ids),
                  "structural_pattern":record.structural_pattern,
                  "semantic_class":record.semantic_class,
              }
              for record in opening_records.values()
          ],sort_keys=True))

          text_auth=source.text_integrity_authority()
          tags=[]
          for observation_id in pub.text_observation_ids:
              result=text_auth.resolve_text(
                  ObservationSelector(
                      document_id=pub.revision.document_id,
                      revision_id=pub.revision.revision_id,
                      source_sha256=pub.revision.source_sha256,
                      snapshot_id=pub.snapshot.snapshot_id,
                      observation_id=observation_id,
                  )
              )
              receipt=result.receipt
              raw="" if receipt is None else str(receipt.raw_text or "")
              norm=normalize_opening_tag(raw)
              if norm is None:
                  continue
              tags.append({
                  "observation":observation_id,
                  "raw":raw,
                  "tag":norm.tag,
                  "trade":norm.trade_type,
                  "status":result.status.value,
                  "trusted":result.trusted_text,
                  "geometry":None if receipt is None else list(receipt.geometry),
                  "sequence":None if receipt is None else receipt.sequence_number,
              })
          print("KSTVET_C41_TAGS "+json.dumps(tags,sort_keys=True))
          doc.close()
          PY
