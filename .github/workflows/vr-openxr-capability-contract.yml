name: VR OpenXR Capability Contract
on:
  pull_request:
    paths:
      - "vr-editor/windows/openxr_capability_contract.py"
      - "tests/test_vr_openxr_capability_contract.py"
      - ".github/workflows/vr-openxr-capability-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail-closed OpenXR capability contract
        run: python -m unittest discover -s tests -p test_vr_openxr_capability_contract.py -v
