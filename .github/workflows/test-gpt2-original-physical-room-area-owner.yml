name: GPT2 Original Maryborough Physical Room Area Owner Integrity
on:
  pull_request:
    paths:
      - "pb_cross_view_floor_finish_authority.py"
      - "tests/test_cross_view_floor_finish_authority_v1.py"
      - ".github/workflows/test-gpt2-original-physical-room-area-owner.yml"
concurrency:
  group: gpt2-original-source-physical-room-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original-source-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen Full Plan V2 + production provider isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
      - name: Original source room-area physical identity regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cross_view_floor_finish_authority_v1.py
      - name: Real immutable PDF source and canonical area scope replay
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u - <<'PY'
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_cross_view_floor_finish_authority import (
              _unique_documented_area_owner_receipts,
          )
          from pb_migration_contracts import EvidenceResolutionStatus
          source=Path('documents/sources/Arch_Combined_Maryborough_Service_Station.pdf')
          claim=collect_live_physical_net_wall_claim(
              source,pages=(6,),topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          # Producer-authenticated quantities may be partial: do not force the
          # historical three measured controls into an incomplete latest scope.
          assert hasattr(claim,'room_area_quantity_evidence')
          assert hasattr(claim,'canonical_rooms')
          assert hasattr(claim,'canonical_floors')
          assert all(r.source_sha256=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
                     for r in claim.canonical_rooms)
          assert all(f.source_sha256=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
                     for f in claim.canonical_floors)
          assert callable(_unique_documented_area_owner_receipts)
          print('GPT2_REAL_SOURCE_CANONICAL_COUNTS',len(claim.canonical_rooms),
                len(claim.canonical_floors),
                len(claim.room_area_quantity_evidence),
                len(claim.floor_finish_quantity_evidence))
          PY
