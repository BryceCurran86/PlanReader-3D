name: GPT2 Maryborough Source-Neutral Physical Room Area Owner Integrity
on:
  pull_request:
    paths:
      - "pb_cross_view_floor_finish_authority.py"
      - "tests/test_cross_view_floor_finish_authority_v1.py"
      - ".github/workflows/test-gpt2-original-physical-room-area-owner.yml"
concurrency:
  group: gpt2-original-source-physical-room-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original-source-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen Full Plan V2 + production provider isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
      - name: Original source room-area physical identity regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cross_view_floor_finish_authority_v1.py
      - name: Original-source test is NOT RUN on public PRs
        shell: bash
        run: |
          set -euo pipefail
          test ! -e documents/sources/Arch_Combined_Maryborough_Service_Station.pdf
          echo '::notice::Original Maryborough tests NOT RUN on public CI; protected exact-head private replay required before release'
          echo 'Original Maryborough source tests NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
