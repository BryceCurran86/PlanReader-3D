name: Canonical Five-Project Baseline — DO NOT MERGE

on:
  push:
    branches: [review/canonical-five-project-baseline-main-0b8bff3]

jobs:
  project-benchmark:
    name: benchmark-${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: kstvet
            benchmark_id: tenders_ke_kstvet_cbc_classroom
            source_url: https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
            source_path: benchmarks/sources/1727358888238-bq-nd-drawing.pdf
            source_sha256: 6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc
          - slug: murera
            benchmark_id: tenders_ke_murera_science_lab
            source_url: https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf
            source_path: benchmarks/sources/1785347143869-bqs-drawings.pdf
            source_sha256: 84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b
          - slug: ghazi
            benchmark_id: tenders_ke_ghazi_science_lab
            source_url: https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            source_path: benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            source_sha256: c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f
          - slug: lamu
            benchmark_id: tenders_ke_lamu_ishakani_ecd_classrooms
            source_url: https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf
            source_path: benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
            source_sha256: fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2
          - slug: umma
            benchmark_id: tenders_ke_umma_hostels
            source_url: https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf
            source_path: benchmarks/sources/umma-university-hostels-builders-work.pdf
            source_sha256: f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-verify registered source
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_PATH: ${{ matrix.source_path }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_PATH")"
          curl --fail --location --retry 4 --retry-delay 3 "$SOURCE_URL" -o "$SOURCE_PATH"
          echo "$SOURCE_SHA256  $SOURCE_PATH" | sha256sum -c -

      - name: Run canonical project benchmark
        env:
          PYTHONPATH: .
          BENCHMARK_ID: ${{ matrix.benchmark_id }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -u
          out="benchmark_results_runtime/$SLUG"
          rm -rf "$out"
          mkdir -p "$out"
          start=$(date +%s)
          python pb_benchmark_accuracy_engine.py --benchmark "$BENCHMARK_ID" --auto-extract --output-dir "$out"
          rc=$?
          end=$(date +%s)
          elapsed=$((end-start))
          python - "$SLUG" "$BENCHMARK_ID" "$elapsed" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          slug, benchmark_id, elapsed, rc = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          p = Path("benchmark_results_runtime") / slug / f"{slug}_runtime.json"
          p.write_text(json.dumps({
              "slug": slug,
              "benchmark_id": benchmark_id,
              "benchmark_runtime_seconds": elapsed,
              "exit_code": rc,
          }, indent=2), encoding="utf-8")
          PY
          exit "$rc"

      - name: Print project result
        if: always()
        env:
          BENCHMARK_ID: ${{ matrix.benchmark_id }}
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          benchmark_id = os.environ["BENCHMARK_ID"]
          slug = os.environ["SLUG"]
          p = Path("benchmark_results_runtime") / slug / f"{benchmark_id}_accuracy_report.json"
          if not p.exists():
              raise SystemExit(f"{benchmark_id}: report not produced")
          d = json.loads(p.read_text(encoding="utf-8"))
          s = d["summary"]
          accepted = int(s["exact_matches"]) + int(s["within_5_percent"])
          exact_pct = round(int(s["exact_matches"]) / int(s["total_items_compared"]) * 100.0, 2) if int(s["total_items_compared"]) else None
          print("=" * 72)
          print(f"{benchmark_id}: {accepted}/{s['total_items_compared']} accepted")
          print(f"accuracy={s['overall_accuracy_percentage']}")
          print(f"strict_exact={exact_pct}")
          print(f"exact={s['exact_matches']}")
          print(f"within_5={s['within_5_percent']}")
          print(f"gross={s['gross_mismatches']}")
          print(f"missed={s['missed_items']}")
          print(f"hallucinated={s['hallucinated_items']}")
          print("=" * 72)
          PY

      - name: Upload project report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.slug }}
          path: benchmark_results_runtime/${{ matrix.slug }}/
          if-no-files-found: warn

  aggregate-benchmark:
    name: aggregate-five-project-benchmark
    if: always()
    needs: project-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download project reports
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: split_benchmark_reports
          merge-multiple: true

      - name: Aggregate only complete canonical coverage
        run: |
          set -euo pipefail
          mkdir -p benchmark_results_runtime
          python - <<'PY'
          import json
          from pathlib import Path

          expected_ids = [
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          ]
          report_dir = Path("split_benchmark_reports")
          reports = {}
          for path in report_dir.glob("*_accuracy_report.json"):
              d = json.loads(path.read_text(encoding="utf-8"))
              reports[d["benchmark_id"]] = d

          missing = [bid for bid in expected_ids if bid not in reports]
          unexpected = sorted(set(reports) - set(expected_ids))
          if missing or unexpected or len(reports) != len(expected_ids):
              raise SystemExit(f"incomplete canonical coverage; missing={missing}; unexpected={unexpected}")

          totals = {
              "total_measurable_expected": 0,
              "total_items_compared": 0,
              "exact_matches": 0,
              "within_5_percent": 0,
              "within_10_percent": 0,
              "within_20_percent": 0,
              "gross_mismatches": 0,
              "missed_items": 0,
              "hallucinated_items": 0,
          }
          projects = []
          runtime_by_id = {}
          for runtime_path in report_dir.glob("*_runtime.json"):
              rd = json.loads(runtime_path.read_text(encoding="utf-8"))
              runtime_by_id[rd["benchmark_id"]] = rd["benchmark_runtime_seconds"]

          for bid in expected_ids:
              r = reports[bid]
              s = r["summary"]
              for key in totals:
                  totals[key] += int(s[key])
              denominator = int(s["total_items_compared"])
              accepted = int(s["exact_matches"]) + int(s["within_5_percent"])
              exact_pct = round(int(s["exact_matches"]) / denominator * 100.0, 2) if denominator else None
              projects.append({
                  "benchmark_id": bid,
                  "project_name": r.get("project_name"),
                  "accepted": accepted,
                  "denominator": denominator,
                  "accuracy": s["overall_accuracy_percentage"],
                  "strict_exact": exact_pct,
                  "exact": int(s["exact_matches"]),
                  "within_5": int(s["within_5_percent"]),
                  "gross": int(s["gross_mismatches"]),
                  "missed": int(s["missed_items"]),
                  "hallucinated": int(s["hallucinated_items"]),
                  "benchmark_runtime_seconds": runtime_by_id.get(bid),
              })

          denominator = totals["total_items_compared"]
          accepted = totals["exact_matches"] + totals["within_5_percent"]
          accuracy = round(accepted / denominator * 100.0, 2) if denominator else None
          strict_exact = round(totals["exact_matches"] / denominator * 100.0, 2) if denominator else None
          aggregate = {
              "execution_mode": "independent_sequential_matrix",
              "coverage_complete": True,
              "main_commit": "0b8bff3cd900e4cf6a9e23c936d2b42e9ca65baa",
              "benchmark_commit": "${{ github.sha }}",
              "projects": projects,
              "headline_metrics": {
                  **totals,
                  "accepted_within_5_percent": accepted,
                  "overall_accuracy_percentage": accuracy,
                  "strict_exact_accuracy_percentage": strict_exact,
                  "benchmark_runtime_seconds_sum": sum(x for x in runtime_by_id.values() if isinstance(x, int)),
              },
          }
          out = Path("benchmark_results_runtime/canonical_five_project_summary.json")
          out.write_text(json.dumps(aggregate, indent=2), encoding="utf-8")

          print("=" * 72)
          print("CANONICAL FIVE-PROJECT BASELINE")
          print("coverage_complete=True")
          print(f"accepted={accepted}")
          print(f"denominator={denominator}")
          print(f"accuracy={accuracy}")
          print(f"strict_exact={strict_exact}")
          print(f"benchmark_runtime_seconds_sum={aggregate['headline_metrics']['benchmark_runtime_seconds_sum']}")
          for p in projects:
              print(f"{p['benchmark_id']}: {p['accepted']}/{p['denominator']} accepted; accuracy={p['accuracy']}; strict_exact={p['strict_exact']}; runtime_s={p['benchmark_runtime_seconds']}")
          print("=" * 72)
          PY

      - name: Print every row movement versus committed reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = Path("split_benchmark_reports")
          committed = Path("benchmark_results")
          project_ids = [
              "tenders_ke_kstvet_cbc_classroom",
              "tenders_ke_murera_science_lab",
              "tenders_ke_ghazi_science_lab",
              "tenders_ke_lamu_ishakani_ecd_classrooms",
              "tenders_ke_umma_hostels",
          ]
          print("=" * 72)
          print("ROW MOVEMENTS VS COMMITTED REPORTS")
          for project_id in project_ids:
              new_path = runtime / f"{project_id}_accuracy_report.json"
              old_path = committed / f"{project_id}_accuracy_report.json"
              if not new_path.exists():
                  raise SystemExit(f"{project_id}: runtime comparison file missing")
              if not old_path.exists():
                  print(f"{project_id}: committed comparison file unavailable")
                  continue
              new = json.loads(new_path.read_text(encoding="utf-8"))
              old = json.loads(old_path.read_text(encoding="utf-8"))
              old_rows = {row["item_id"]: row for row in old.get("item_results", [])}
              new_rows = {row["item_id"]: row for row in new.get("item_results", [])}
              moved = []
              for item_id in sorted(set(old_rows) | set(new_rows)):
                  before = old_rows.get(item_id, {})
                  after = new_rows.get(item_id, {})
                  b = (before.get("status"), before.get("extracted_quantity"))
                  a = (after.get("status"), after.get("extracted_quantity"))
                  if b != a:
                      moved.append((item_id, *b, *a))
              print(f"{project_id}: {len(moved)} row(s) moved")
              for item_id, before_status, before_qty, after_status, after_qty in moved:
                  print(f"  {item_id}: {before_status} -> {after_status}; qty {before_qty} -> {after_qty}")
          print("=" * 72)
          PY

      - name: Upload complete aggregate report set
        uses: actions/upload-artifact@v4
        with:
          name: canonical-five-project-baseline
          path: |
            split_benchmark_reports/
            benchmark_results_runtime/
          if-no-files-found: error
