name: TEST-ONLY Lamu RapidOCR Canonical

on:
  pull_request:
    branches: [main]

jobs:
  lamu-rapidocr-canonical:
    if: startsWith(github.head_ref, 'diag/lamu-rapidocr-canonical')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install repository and diagnostic OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install rapidocr==3.9.2 onnxruntime

      - name: Run full SHA-pinned Lamu benchmark with RapidOCR and measure memory
        run: |
          set -euo pipefail
          cat > /tmp/lamu_rapidocr_canonical.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_portable_raster_ocr_authority import detect_ocr_capabilities

          benchmark_id = "tenders_ke_lamu_ishakani_ecd_classrooms"
          url = "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha = "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"

          source = Path("/tmp/lamu.pdf")
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "PlanReader-Lamu-RapidOCR-canonical-diagnostic/1.1"},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = response.read()
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(
                  f"source_hash_mismatch:expected={expected_sha}:actual={actual_sha}"
              )
          source.write_bytes(payload)

          capabilities = detect_ocr_capabilities()
          if not capabilities.rapidocr_available:
              raise SystemExit("RapidOCR unavailable after diagnostic install")
          if capabilities.default_backend != "rapid_ocr":
              raise SystemExit(
                  f"unexpected_default_ocr_backend:{capabilities.default_backend}"
              )

          engine = BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/lamu-rapidocr-results",
          )
          report = engine.evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              auto_extract=True,
          )

          target = next(
              (
                  item.to_dict()
                  for item in report.item_results
                  if item.item_id == "LMU-E3-C"
              ),
              None,
          )
          hallucinated = [
              item.to_dict()
              for item in report.item_results
              if item.status.value == "hallucinated_item"
          ]
          result = {
              "diagnostic": "lamu_rapidocr_full_canonical",
              "source_sha256": actual_sha,
              "ocr": {
                  "available_backends": list(capabilities.available_backends),
                  "default_backend": capabilities.default_backend,
                  "rapidocr_available": capabilities.rapidocr_available,
              },
              "project": {
                  "accepted": int(report.exact_matches + report.within_5_percent),
                  "denominator": int(report.total_items_compared),
                  "accuracy_percentage": report.overall_accuracy_percentage,
                  "strict_exact_percentage": report.strict_exact_accuracy_percentage,
                  "exact": int(report.exact_matches),
                  "within_5": int(report.within_5_percent),
                  "within_10": int(report.within_10_percent),
                  "within_20": int(report.within_20_percent),
                  "gross": int(report.gross_mismatches),
                  "missed": int(report.missed_items),
                  "hallucinated": int(report.hallucinated_items),
                  "status": report.status,
                  "errors": report.errors,
              },
              "target_LMU_E3_C": target,
              "hallucinated_results": hallucinated,
          }
          print(
              "LAMU_RAPIDOCR_CANONICAL_RESULT="
              + json.dumps(result, sort_keys=True),
              flush=True,
          )
          PY

          /usr/bin/time -v env PYTHONPATH=. python /tmp/lamu_rapidocr_canonical.py             2> /tmp/lamu_rapidocr_time.txt | tee /tmp/lamu_rapidocr_result.txt
          cat /tmp/lamu_rapidocr_time.txt
