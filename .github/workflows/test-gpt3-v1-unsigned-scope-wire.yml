name: GPT3 V1 Strict Signed Wire Authority
on:
  pull_request:
    branches: [main]
    paths:
      - pb_source_closed_run_export.py
      - tests/test_gpt3_v1_signed_wire_unsigned_authority_extensions.py
      - .github/workflows/test-gpt3-v1-unsigned-scope-wire.yml
permissions:
  contents: read
jobs:
  original-eight-v1-strict-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: V1 signed source scope spoof and original eight preservation
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_v1_signed_wire_unsigned_authority_extensions.py tests/test_source_closed_run_export.py tests/test_live_opening_area_quantity_publication.py
          ruff check --select F821,F823 pb_source_closed_run_export.py tests/test_gpt3_v1_signed_wire_unsigned_authority_extensions.py
