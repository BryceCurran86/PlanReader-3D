name: Wall Net Lane Validation

on:
  push:
    branches: [gpt2/accuracy-wall-net-finish-v1]

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source visibility batch regression
        run: PYTHONPATH=. pytest -q tests/test_source_visibility_batch_publication.py

  benchmark-wall-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: kstvet
            page: "54"
            benchmark_id: tenders_ke_kstvet_cbc_classroom
            url: https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
            path: benchmarks/sources/1727358888238-bq-nd-drawing.pdf
            sha256: 6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc
          - slug: lamu
            page: "41"
            benchmark_id: tenders_ke_lamu_ishakani_ecd_classrooms
            url: https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf
            path: benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
            sha256: fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified source
        env:
          URL: ${{ matrix.url }}
          PATH_OUT: ${{ matrix.path }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p "$(dirname "$PATH_OUT")"
          curl --fail --location --retry 4 --retry-delay 2 "$URL" -o "$PATH_OUT"
          echo "$SHA256  $PATH_OUT" | sha256sum -c -
      - name: Build local diagnostic bundle
        env:
          SLUG: ${{ matrix.slug }}
          PATH_OUT: ${{ matrix.path }}
        run: |
          mkdir -p "wall-net-debug/$SLUG"
          git archive --format=zip HEAD -o "wall-net-debug/$SLUG/planreader-source.zip"
          cp "$PATH_OUT" "wall-net-debug/$SLUG/source.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: wall-net-debug-${{ matrix.slug }}
          path: wall-net-debug/${{ matrix.slug }}
          retention-days: 1

      - name: Producer-owned wall/opening trace
        env:
          PATH_OUT: ${{ matrix.path }}
          PAGE_ID: ${{ matrix.page }}
        run: PYTHONPATH=. python scripts/trace_wall_opening_live_chain.py --pdf "$PATH_OUT" --page "$PAGE_ID"

      - name: Canonical project benchmark
        env:
          BID: ${{ matrix.benchmark_id }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "benchmark_results_runtime/$SLUG"
          PYTHONPATH=. python pb_benchmark_accuracy_engine.py --benchmark "$BID" --auto-extract --output-dir "benchmark_results_runtime/$SLUG"
          python - "$BID" "$SLUG" <<'PY'
          import json, sys
          from pathlib import Path
          bid, slug = sys.argv[1:3]
          p = Path("benchmark_results_runtime") / slug / f"{bid}_accuracy_report.json"
          d = json.loads(p.read_text())
          s = d["summary"]
          print("SUMMARY", json.dumps(s, sort_keys=True))
          for row in d["item_results"]:
              print("ROW", row["item_id"], row["status"], row.get("extracted_quantity"), "expected", row.get("expected_quantity"))
          PY
      - name: Print live target prediction metadata
        env:
          PATH_OUT: ${{ matrix.path }}
          SLUG: ${{ matrix.slug }}
        run: |
          PYTHONPATH=. python - "$PATH_OUT" "$SLUG" <<'PY'
          import json, sys
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          path, slug = Path(sys.argv[1]), sys.argv[2]
          wanted = {
              "kstvet": {"perimeter_walling", "internal_plaster", "internal_paint"},
              "lamu": {"perimeter_walling"},
          }[slug]
          extractor = GenericPlanReaderExtractor()
          predictions = extractor.extract_from_pdf(path, collect_item35_shadow=False)
          for pred in predictions:
              if pred.tag in wanted:
                  print("PRED", pred.tag, "quantity", pred.quantity, "confidence", pred.confidence)
                  print("META", pred.tag, json.dumps(pred.metadata, sort_keys=True, default=str))
          PY
