name: TEST-ONLY Murera Vent Symbol Evidence

on:
  pull_request:
    branches: [main]

jobs:
  murera-vents:
    if: startsWith(github.head_ref, 'diag/murera-vent-symbol-current')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe SHA-pinned Murera vent geometry
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          import fitz

          from pb_elevation_vector_vent_extractor import (
              _extract_candidate_vector_symbols,
              detect_unlabeled_vent_symbols,
              extract_elevation_vector_vents,
              extract_verified_pv_callouts,
              learn_vector_vent_signature,
          )
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_viewport_segmentation import segment_page_viewports

          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected_sha="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-vent-evidence/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/murera.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          extractor=GenericPlanReaderExtractor()
          pages=[]
          try:
              for p in range(218,238):
                  page=doc[p]
                  if not extractor.is_drawing_page(page.get_text("text"),page):
                      continue
                  labels=extract_verified_pv_callouts(page)
                  viewports=segment_page_viewports(page,page_number=p+1)
                  candidates=_extract_candidate_vector_symbols(page)
                  sig=learn_vector_vent_signature(candidates,labels)
                  matches=[]
                  if sig is not None:
                      matches=detect_unlabeled_vent_symbols(
                          candidates=candidates,
                          signature=sig,
                          labeled_callouts=labels,
                          elevation_viewports=viewports,
                          page_rect=page.rect,
                      )
                  result=extract_elevation_vector_vents(page,page_num=p+1)
                  if labels or result is not None:
                      pages.append({
                          "page":p+1,
                          "labels":[list(x) for x in labels],
                          "label_count":len(labels),
                          "candidate_count":len(candidates),
                          "signature":None if sig is None else sig.__dict__,
                          "unlabeled_match_count":len(matches),
                          "unlabeled_matches":[m.__dict__ for m in matches[:50]],
                          "viewports":[{
                              "view_id":v.view_id,
                              "view_type":v.view_type,
                              "status":v.status,
                              "boundary_source":v.boundary_source,
                              "bbox":list(v.bounding_box) if v.bounding_box else None,
                              "title_bbox":list(v.title_bbox),
                              "label":v.label,
                          } for v in viewports],
                          "result":None if result is None else {
                              "quantity":result.quantity,
                              "evidence_text":result.evidence_text,
                              "labeled_callout_count":result.labeled_callout_count,
                              "unlabeled_vector_count":result.unlabeled_vector_count,
                              "is_vector_augmented":result.is_vector_augmented,
                              "metadata":result.metadata,
                          },
                      })
          finally:
              doc.close()
          print("MURERA_VENT_EVIDENCE="+json.dumps({
              "source_sha256":actual,
              "pages":pages,
          },sort_keys=True,default=str),flush=True)
          PY