name: TEST-ONLY KSTVET Item35 OCR After 852

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-item35:
    if: startsWith(github.head_ref, 'diag/kstvet-item35-ocr-after-852')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download SHA-pinned KSTVET source
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          out=pathlib.Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-item35-852/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              out.write_bytes(r.read())
          got=hashlib.sha256(out.read_bytes()).hexdigest()
          print("SOURCE_SHA256="+got)
          if got != expected:
              raise SystemExit(f"source hash mismatch: {got}")
          PY

      - name: Build exact candidate image
        run: docker build -t planreader-item35-852 .

      - name: Probe authenticated page 54-55 opening classification
        run: |
          docker run --rm --cpus=2.0 \
            -v /tmp/kstvet.pdf:/app/kstvet.pdf:ro \
            planreader-item35-852 \
            python -c "import json; from pb_item35_production_authority_shadow import collect_item35_authority_shadow as c; s=c('/app/kstvet.pdf',document_id='kstvet-item35-852',pages=(53,54)); print('KSTVET_ITEM35_AFTER_852='+json.dumps(s,sort_keys=True,default=str))"
