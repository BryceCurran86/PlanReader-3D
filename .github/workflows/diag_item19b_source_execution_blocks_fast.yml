name: Item19B Source Execution Blocks Fast

on:
  push:
    branches: [diag/item19b-source-execution-blocks-fast]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Count execution blocks and leader contacts
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, fitz
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_wall_finish_callout_wall_authority import (
              _source_annotation_blocks,
              _annotation_has_native_leader_contact,
          )
          from pb_wall_finish_face_binding_authority import (
              _authoritative_viewports,
              _page_visible_lines,
              _viewport_owned_lines,
          )
          from pb_viewport_segmentation import assign_bbox_to_viewport

          payload=Path('/tmp/kstvet.pdf').read_bytes()
          source=SourceVisibilityProducer(
              producer_method='item19b-execution-block-fast',
              producer_version='1.0',
          )
          pub=source.ingest_native_pdf_bytes(
              document_id='kstvet-item19b-execution-fast',
              source_bytes=payload,
              source_locator='sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc',
              page_ids=('54',),
          )
          current=source.published_snapshot_for_revision(pub.revision.revision_id)
          blocks=_source_annotation_blocks(source,current,'54')
          doc=fitz.open(stream=payload,filetype='pdf')
          page=doc.load_page(53)
          viewports=_authoritative_viewports(page,54)
          lines=_page_visible_lines(source,current,'54')
          rows=[]
          contacts=0
          for block_id,obs_ids,seqs,bbox,height in blocks:
              viewport=assign_bbox_to_viewport(bbox,viewports,allow_derived=True)
              if viewport is None or viewport.bounding_box is None:
                  continue
              leaders=_viewport_owned_lines(lines,viewport,viewports)
              contact=_annotation_has_native_leader_contact(bbox,leaders)
              if contact:
                  contacts += 1
                  rows.append({
                      'block_id':block_id,
                      'viewport':viewport.view_id,
                      'sequence_numbers':list(seqs),
                      'observation_count':len(obs_ids),
                      'bbox':list(bbox),
                      'height':height,
                  })
          doc.close()
          print('ITEM19B_EXECUTION_BLOCK_COUNT',len(blocks))
          print('ITEM19B_EXECUTION_LEADER_CONTACT_COUNT',contacts)
          print('ITEM19B_EXECUTION_LEADER_CONTACTS '+json.dumps(rows,sort_keys=True))
          assert len(blocks) > 0
          assert contacts >= 2
          PY
