name: GPT2 Original Maryborough Canonical Room Label Word Provenance
on:
  pull_request:
    paths:
      - "pb_live_canonical_room_composition.py"
      # Physical GRID/source-wall changes must retain original PWD/room labels.
      - "pb_wall_room_topology_typed_negative_evidence.py"
      - "tests/test_wall_topology_typed_negative_evidence.py"
      # OCR source-word crop/rotation can affect original PWD label ownership.
      - "pb_raster_text_corroboration_authority.py"
      - "tests/test_raster_text_corroboration_authority_v1.py"
      - "tests/test_gpt2_canonical_room_label_lineage.py"
      - ".github/workflows/test-gpt2-canonical-room-label-word-provenance.yml"
concurrency:
  group: gpt2-canonical-word-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Producer-authenticated room labels and exact source receipts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt2_canonical_room_label_lineage.py tests/test_gpt2_source_room_identity_eight_fixes.py
          ruff check --select F821,F823 pb_live_canonical_room_composition.py tests/test_gpt2_canonical_room_label_lineage.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  original-maryborough:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: SHA-verified original physical room and native word positive controls
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          printf '%s  %s\n' 'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007' "$PDF" | sha256sum --check
          PYTHONPATH=. python -u - <<'PY'
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          source=Path('documents/sources/Arch_Combined_Maryborough_Service_Station.pdf')
          result=collect_live_physical_net_wall_claim(
              source,pages=(6,),topology_pages=(6,),room_area_support_pages=(10,),
          )
          exact={
              'FOOD PREP': 'source_room_face_record_a163b3690c0b2db83f89fcf7465bd831',
              'COLD ROOM': 'source_room_face_record_17f0cb15ba5c2f25ff17b12b2ccc5129',
              'OFFICE': 'source_room_face_record_735f9b309cca70f513c9fcd9390e3e10',
              'FREEZER': 'source_room_face_record_e6faa5d761bcc11de70f4d3a21e94571',
              'PWD': 'source_room_face_record_6722d55c0ce8c8a8706cdcc6094860f9',
              'AIRLOCK': 'source_room_face_record_a0f786d8997e532c332b1a1c28980d14',
              'LAUNDRY': 'source_room_face_record_dde9e143bdd9627f96b7d5aaaea51f7f',
          }
          rooms={r.room_label:r for r in result.canonical_rooms if r.room_label}
          for name,face in exact.items():
              assert name in rooms,(name,sorted(rooms))
              room=rooms[name]
              assert room.source_room_face_record_id==face,(name,room.source_room_face_record_id)
              assert room.room_label_binding_record_id
              assert room.room_label_evidence_ids
              assert room.source_sha256=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
              assert not room.metric_geometry_complete
          print('GPT2_ORIGINAL_CANONICAL_LABELS_PRESERVED',sorted(rooms))
          PY
