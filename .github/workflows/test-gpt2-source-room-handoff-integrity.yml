name: GPT2 Original Maryborough Canonical Room Metric Handoff Integrity
on:
  pull_request:
    paths:
      - "tools/diag_gpt2_source_room_handoff_integrity.py"
      - "tests/test_gpt2_source_room_handoff_integrity.py"
      - ".github/workflows/test-gpt2-source-room-handoff-integrity.yml"
      - "docs/engineering/gpt2_maryborough_source_room_handoff.md"
concurrency:
  group: gpt2-original-room-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13","3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Eight original source floor/metric/label gate regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt2_source_room_handoff_integrity.py
          python -m compileall -q tools/diag_gpt2_source_room_handoff_integrity.py
          ruff check --select F821,F823 tools/diag_gpt2_source_room_handoff_integrity.py tests/test_gpt2_source_room_handoff_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: SHA-pinned original topology and independently decoded area-support page
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from tools.diag_gpt2_source_room_handoff_integrity import report_source_room_handoff
          from tools.diag_gpt2_room_measurement_gates import inspect_room_measurement_gates
          sha='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          claim=collect_live_physical_net_wall_claim(
              Path('documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'),
              pages=(6,),topology_pages=(6,),room_area_support_pages=(10,),
          )
          d=report_source_room_handoff(claim,original_source_sha=sha)
          assert d['source_sha256']==sha
          assert d['reported_source_room_count']==15
          assert d['benchmark_accuracy'] is None
          assert d['diagnostic_only'] is True
          assert d['dry_store_must_abstain_without_new_proof'] is True
          assert not d['floor_finish_publication_allowed']
          assert not d['ceiling_lining_publication_allowed']
          assert all(r['metric_area_inferred_from_page_points'] is False
                     and r['floor_finish_publication_allowed'] is False
                     and r['ceiling_lining_publication_allowed'] is False
                     and r['benchmark_accuracy'] is None
                     for r in d['room_handoff_first_gates'])
          # A documented-dimension m² can be source-FIRM even though its
          # PAGE-POINT polygon must never be marked metrically scaled. The
          # canonical floor keeps commercial_quantity_authority=False;
          # run actual GPT1/GPT3 reissuers rather than setting that flag.
          downstream=inspect_room_measurement_gates(claim)
          controls={'FOOD PREP':13.270425,'OFFICE':9.05352,'COLD ROOM':25.37875}
          source_rows={r['source_room_label']:r for r in d['room_handoff_first_gates']}
          measurement_rows={}
          for item in downstream['rooms']:
              measurement_rows.setdefault(item['room_label'],[]).append(item)
          for name,value in controls.items():
              source=source_rows[name]
              actual=measurement_rows.get(name,[])
              assert len(actual)==1,(name,'ambiguous original room ownership',len(actual))
              item=actual[0]
              assert item['source_room_face_record_id']==source['original_source_face_receipt_id']
              assert item['canonical_floor_id']==source['canonical_floor_id']
              assert item['metric_quantity_id']==source['documented_area_quantity_id']
              assert source['source_proven_area_m2']==value
              assert item['metric_area_m2'] is not None and abs(item['metric_area_m2']-value)<1e-8
              assert item['firm_documented_area_receipt'] is True
              assert item['commercial_quantity_authority_flag'] is False
              # Customer sealing/scoring is independent from a source FIRM
              # measurement. Record the actual publisher stages with IDs,
              # never manufacture a commercial floor flag, material or score.
          assert downstream['benchmark_accuracy'] is None
          assert downstream['commercial_estimator_approved'] is False
          assert all(r['source_room_label']!='DRY STORE' or r['source_proven_area_m2'] is None
                     for r in d['room_handoff_first_gates'])
          Path('original-maryborough-floor-publisher-firstgate.json').write_text(
              json.dumps(downstream,sort_keys=True,indent=2)+'\n'
          )
          print('G2_SOURCE_FIRM_FLOOR_PUBLISHER',json.dumps(
              [(name,measurement_rows[name][0]['first_unclosed_gate'],
                measurement_rows[name][0]['floor_area_reissued_quantity_id'],
                measurement_rows[name][0]['canonical_room_area_reissued_quantity_id'])
               for name in controls],sort_keys=True))
          Path('original-maryborough-source-room-handoff.json').write_text(
              json.dumps(d,sort_keys=True,indent=2)+'\n'
          )
          print('G2_SOURCE_METRIC_HANDOFF',json.dumps(
              [(r['source_room_label'],r['first_unproved_authority'],
                r['original_source_face_receipt_id'],r['documented_area_quantity_id'])
                for r in d['room_handoff_first_gates']],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-original-maryborough-room-metric-handoff
          path: |
            original-maryborough-source-room-handoff.json
            original-maryborough-floor-publisher-firstgate.json
          retention-days: 30
