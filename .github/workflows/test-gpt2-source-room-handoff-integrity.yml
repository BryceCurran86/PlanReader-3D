name: GPT2 Original Maryborough Canonical Room Metric Handoff Integrity
on:
  # Source-free public PR validation only. Original-source positive proof must
  # run separately in an owner/main/manual, SHA-pinned offline environment.
  pull_request:
    paths:
      - "tools/diag_gpt2_source_room_handoff_integrity.py"
      - "tests/test_gpt2_source_room_handoff_integrity.py"
      - "tests/test_gpt2_source_room_handoff_workflow_privacy.py"
      - "pb_live_canonical_room_composition.py"
      - "pb_live_canonical_floor_surface.py"
      - "tests/test_gpt2_canonical_source_polygon_geometry_gate.py"
      - "pb_live_floor_area_quantity_publication.py"
      - "tests/test_gpt1_firm_floor_area_source_integrity.py"
      - ".github/workflows/test-gpt2-source-room-handoff-integrity.yml"
      - "docs/engineering/gpt2_maryborough_source_room_handoff.md"
permissions:
  contents: read

concurrency:
  group: gpt2-original-room-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13","3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Eight original source floor/metric/label gate regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt2_source_room_handoff_integrity.py tests/test_gpt2_source_room_handoff_workflow_privacy.py tests/test_gpt2_canonical_source_polygon_geometry_gate.py tests/test_live_canonical_room_composition.py
          python -m compileall -q tools/diag_gpt2_source_room_handoff_integrity.py pb_live_canonical_room_composition.py pb_live_canonical_floor_surface.py
          ruff check --select F821,F823 tools/diag_gpt2_source_room_handoff_integrity.py tests/test_gpt2_source_room_handoff_integrity.py tests/test_gpt2_source_room_handoff_workflow_privacy.py pb_live_canonical_room_composition.py pb_live_canonical_floor_surface.py tests/test_gpt2_canonical_source_polygon_geometry_gate.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py      - name: Explicitly label source-free PR scope
        run: |
          echo '### GPT2 public source-free room handoff' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic/source-neutral regressions only; no original PDF, FIRM source replay, signed customer proof or frozen V2 score is established.' >> "$GITHUB_STEP_SUMMARY"
