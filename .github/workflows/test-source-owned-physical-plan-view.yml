name: TEST Source Owned Physical Plan View

on:
  pull_request:
    paths:
      - pb_source_plan_view_authority.py
      - pb_viewport_segmentation.py
      - pb_viewport_migration_adapter.py
      - pb_raster_text_corroboration_authority.py
      - tests/test_source_owned_physical_plan_view.py
      - tests/test_raster_text_corroboration_authority_v1.py
      - tools/diag_source_owned_physical_plan_view.py
      - .github/workflows/test-source-owned-physical-plan-view.yml
  workflow_dispatch:

concurrency:
  group: source-owned-plan-view-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-view-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime ruff
      - name: Source authority and retention regressions
        run: |
          python -m pytest -q tests/test_source_owned_physical_plan_view.py tests/test_raster_text_corroboration_authority_v1.py tests/test_f07_viewport_migration_adapter.py tests/test_viewport_title_block_anchor_ownership_v1.py tests/test_viewport_frame_authority.py tests/test_native_dimension_cap_evidence.py tests/test_source_material_semantic_authority_v1.py tests/test_gpt3_maryborough_original_floor_score_input.py tests/test_gpt3_lot16_original_sealed_score_input.py tests/test_live_floor_area_quantity_publication_integrity.py
          ruff check --select F821,F823 pb_source_plan_view_authority.py pb_raster_text_corroboration_authority.py tools/diag_source_owned_physical_plan_view.py
          python scripts/check_provider_gold_isolation.py > /tmp/source-view-provider-isolation.json
          python scripts/check_full_plan_v2_integrity.py
        env:
          PYTHONPATH: .
      - name: Both immutable original source proofs and downstream consumption
        run: |
          mkdir -p artifacts/source-owned-plan-view
          git rev-parse HEAD > artifacts/source-owned-plan-view/producer_head_sha.txt
          python -u - <<'PY'
          import hashlib,json
          from pathlib import Path
          from tools.diag_source_owned_physical_plan_view import replay
          sources=[
            ('maryborough','Arch_Combined_Maryborough_Service_Station.pdf',11,False,'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'),
            ('lot16','1. Construction Plans - Lot 16 Power (REV E).pdf',3,True,'10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'),
          ]
          for name,file,page,raster,expected in sources:
            data=Path('documents/sources',file).read_bytes()
            assert hashlib.sha256(data).hexdigest()==expected
            report=replay(data,page_number=page,raster_supports=raster)
            Path('artifacts/source-owned-plan-view',name+'.json').write_text(json.dumps(report,indent=2))
            assert report['authoritative_plan_view_count']==1
            assert report['default_segmentation_unchanged'] and report['published_snapshot_unchanged']
            assert report['metric_authority_granted'] is False and report['published_quantities']==[]
            plan=next(v for v in report['viewports'] if v['authoritative'])
            assert plan['downstream_migration'] and not plan['downstream_migration']['blocking_reasons']
            assert plan['scale_denominator'] is None
            print(name,'authenticated bounded source view',plan['bounding_box'],flush=True)
          PY
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-owned-original-plan-views
          path: artifacts/source-owned-plan-view
          retention-days: 30
