name: TEST Source Plan Material Occurrences

on:
  pull_request:
    paths:
      - pb_source_material_semantic_authority.py
      - pb_source_plan_view_authority.py
      - pb_viewport_segmentation.py
      - pb_viewport_migration_adapter.py
      - pb_raster_text_corroboration_authority.py
      - tests/test_source_plan_material_occurrences.py
      - tests/test_source_owned_physical_plan_view.py
      - tools/diag_source_plan_material_occurrences.py
      - .github/workflows/test-source-plan-material-occurrences.yml
  workflow_dispatch:

concurrency:
  group: source-plan-material-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-plan-material-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime ruff
      - name: Source material ownership and downstream abstention
        run: |
          python -m pytest -q tests/test_source_plan_material_occurrences.py tests/test_source_material_semantic_authority_v1.py tests/test_cross_view_floor_finish_authority_v1.py tests/test_cross_view_ceiling_finish_authority.py tests/test_source_owned_physical_plan_view.py tests/test_f07_viewport_migration_adapter.py tests/test_gpt3_maryborough_original_floor_score_input.py tests/test_gpt3_lot16_original_sealed_score_input.py tests/test_live_floor_area_quantity_publication_integrity.py
          ruff check --select F821,F823 pb_source_material_semantic_authority.py tools/diag_source_plan_material_occurrences.py tests/test_source_plan_material_occurrences.py
          python scripts/check_provider_gold_isolation.py > /tmp/source-plan-material-isolation.json
          python scripts/check_full_plan_v2_integrity.py
        env:
          PYTHONPATH: .
      - name: Both immutable originals and preserved consumer gates
        run: |
          mkdir -p artifacts/source-plan-material
          git rev-parse HEAD > artifacts/source-plan-material/producer_head_sha.txt
          python -u - <<'PY'
          import hashlib,json
          from pathlib import Path
          from tools.diag_source_plan_material_occurrences import replay
          cases=[
            ('maryborough','Arch_Combined_Maryborough_Service_Station.pdf',11,False,'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'),
            ('lot16','1. Construction Plans - Lot 16 Power (REV E).pdf',3,True,'10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'),
          ]
          for name,file,page,raster,sha in cases:
            data=Path('documents/sources',file).read_bytes()
            assert hashlib.sha256(data).hexdigest()==sha
            report=replay(data,page_number=page,raster_supports=raster)
            Path('artifacts/source-plan-material',name+'.json').write_text(json.dumps(report,indent=2))
            assert report['bounded_plan_view_count']==1
            assert report['published_snapshot_unchanged'] and report['default_segmentation_unchanged']
            assert report['default_occurrence_results_unchanged']
            assert report['incomplete_scopes_rejected_by_existing_floor_consumer']
            assert not report['physical_floor_identity_granted'] and not report['metric_authority_granted']
            assert not report['whole_sheet_plan_universe_proven'] and not report['commercial_projection_allowed']
            assert report['published_quantities']==[]
            if name=='maryborough':
              ft3=[r for s in report['material_occurrence_scopes'] for r in s['records'] if r['code']=='FT3']
              assert len(ft3)==5
              assert all(r['source_text_corroboration_record_ids'] for r in ft3)
              assert report['scope_complete_count']==0
            print(name,'bounded material source proof',report['positive_material_occurrence_count'],flush=True)
          PY
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-plan-original-material-occurrences
          path: artifacts/source-plan-material
          retention-days: 30
