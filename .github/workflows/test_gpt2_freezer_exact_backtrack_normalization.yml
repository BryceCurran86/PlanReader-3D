name: TEST GPT2 Freezer Exact Backtrack Normalization

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "pb_*room*.py"
      - "pb_*wall*.py"
      - "pb_live_physical_net_wall_integration.py"
      - "tests/test_source_room_face_authority_v1.py"
      - ".github/workflows/test_gpt2_freezer_exact_backtrack_normalization.yml"

concurrency:
  group: gpt2-freezer-backtrack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-ci-v1228.txt
    - name: Focused room-face tests
      run: PYTHONPATH=. pytest -q tests/test_source_room_face_authority_v1.py
  prove:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused room-face tests
        run: PYTHONPATH=. pytest -q tests/test_source_room_face_authority_v1.py
      - name: Provision exact private original from trusted main
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: Arch_Combined_Maryborough_Service_Station.pdf
          allow-missing: "false"
      - name: Prove real support-room polygon validity
        run: |
          set -euo pipefail
          private_script="$RUNNER_TEMP/guarded-original-5.sh"
          private_output="$RUNNER_TEMP/guarded-original-5.log"
          cat > "$private_script" <<'PRIVATE_ORIGINAL_COMMANDS'
          set -o pipefail
          OUT=artifacts/gpt2-freezer-backtrack-proof
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/head_sha.txt"
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > "$OUT/source_sha256.txt"
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee "$OUT/result.json"
          import json
          from pathlib import Path
          from shapely.geometry import Polygon
          from shapely.validation import explain_validity
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          source=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          claim=collect_live_physical_net_wall_claim(
              source,
              pages=(10,),
              topology_pages=(10,),
              room_area_support_pages=(10,),
          )
          def norm(value):
              return " ".join(str(value or "").strip().upper().split())
          rows=[]
          for room in claim.canonical_rooms:
              if not room.geometry_complete or not norm(room.room_label):
                  continue
              polygon=Polygon(room.polygon_pdf_pts)
              rows.append({
                  "label":norm(room.room_label),
                  "physical_room_id":room.physical_room_id,
                  "source_room_face_record_id":room.source_room_face_record_id,
                  "vertex_count":len(room.polygon_pdf_pts),
                  "area_page_pts2":room.area_page_pts2,
                  "shapely_area":float(polygon.area),
                  "valid":bool(polygon.is_valid),
                  "validity_reason":explain_validity(polygon),
              })
          freezer=[row for row in rows if row["label"]=="FREEZER"]
          print(json.dumps({
              "claim_status":getattr(claim.status,"value",str(claim.status)),
              "claim_reason_codes":list(claim.reason_codes),
              "labelled_rooms":rows,
              "freezer":freezer,
          },indent=2,sort_keys=True))
          assert len(freezer)==1, freezer
          assert freezer[0]["valid"], freezer[0]
          assert abs(
              float(freezer[0]["shapely_area"])
              - float(freezer[0]["area_page_pts2"])
          ) < 1e-6
          PY
          PRIVATE_ORIGINAL_COMMANDS
          if bash -euo pipefail "$private_script" > "$private_output" 2>&1; then
            echo "PRIVATE ORIGINAL STEP PASS"
          else
            echo "::error::Private original verification failed; source details withheld."
            exit 1
          fi
      - name: Destroy private originals and unpublished diagnostics
        if: always()
        run: |
          rm -rf documents/sources artifacts q5446-original-positive-floor laurel-original-floor-produced laurel-source-positive-core
          rm -f source-before.json source-after.json source-retention.json native-paint-partitions.json
          rm -f "$RUNNER_TEMP"/guarded-original-*.sh "$RUNNER_TEMP"/guarded-original-*.log
