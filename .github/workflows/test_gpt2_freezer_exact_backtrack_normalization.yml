name: TEST GPT2 Freezer Exact Backtrack Normalization

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "pb_*room*.py"
      - "pb_*wall*.py"
      - "pb_live_physical_net_wall_integration.py"
      - "tests/test_source_room_face_authority_v1.py"
      - ".github/workflows/test_gpt2_freezer_exact_backtrack_normalization.yml"

concurrency:
  group: gpt2-freezer-backtrack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-ci-v1228.txt
    - name: Focused room-face tests
      run: PYTHONPATH=. pytest -q tests/test_source_room_face_authority_v1.py
