name: Item19B Target Native Fast

on:
  push:
    branches: [diag/item19b-target-native-fast]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Native-only target blocker
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_source_observation_authority import ObservationSelector
          from pb_physical_wall_candidate_authority import (
              _build_authenticated_viewport_scope_results,
              _source_page_segments,
              _decision_scope_id,
              _proven_filled_wall_strips,
          )
          from pb_wall_component_completeness_authority import (
              _component_sets,_positive_same_separations,
              _proven_strip_closure_exemptions,_withheld_affects_component,
              _observation_line,_raw_path_family,_raw_primitive_id,
          )

          target_raw={"d4763i0","d4772i0","d5179i1","d5179i3","d5214i0","d5215i0"}
          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(producer_method="native-fast",producer_version="1")
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-native-fast",source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          scopes=_build_authenticated_viewport_scope_results(
              source_producer=source,published=pub,source_bytes=payload,page_id="54"
          )
          floor=[s for s in scopes if str(s.viewport_view_type or "")=="floor_plan"]
          assert len(floor)==1, [(s.viewport_id,s.viewport_view_type) for s in scopes]
          scope=floor[0]
          records_by_id={r.wall_candidate_id:r for r in scope.records}
          matching=[
              r for r in scope.records
              if target_raw & {_raw_primitive_id(str(x)) for x in r.physical_identity.source_primitive_ids}
          ]
          print("NATIVE_TARGET_MATCHES "+json.dumps([
              {"wall":r.wall_candidate_id,"sources":list(r.physical_identity.source_primitive_ids),
               "centerline":[list(p) for p in r.wall_candidate.centerline_pts]}
              for r in matching
          ],sort_keys=True))
          assert matching, "no native target records"

          components=_component_sets(scope.records,scope.equivalence)
          member_sets=[g for g in components if any(r.wall_candidate_id in g for r in matching)]
          print("NATIVE_TARGET_COMPONENT_CANDIDATES "+json.dumps([list(g) for g in member_sets]))
          assert len(member_sets)==1, member_sets
          members=member_sets[0]
          component_records=tuple(records_by_id[x] for x in members)

          page_segments,_,_,_=_source_page_segments(
              source_producer=source,published=pub,source_bytes=payload,
              page_id="54",decision_scope_id=_decision_scope_id("54"),
          )
          strips=_proven_filled_wall_strips(page_segments)
          exemptions=_proven_strip_closure_exemptions(
              component_records=component_records,proven_wall_strips=strips
          )
          same_sep=_positive_same_separations(records_by_id,scope.equivalence)
          vis=source.authority()
          blockers=[]
          withheld_ids=tuple(sorted(set(scope.scope_boundary_observation_ids)|set(scope.ambiguous_source_observation_ids)))
          for obs_id in withheld_ids:
              rr=vis.resolve_visible(ObservationSelector(
                  document_id=scope.document_id,revision_id=scope.revision_id,
                  source_sha256=scope.source_sha256,snapshot_id=scope.snapshot_id,
                  observation_id=obs_id,
              ))
              obs=rr.observation
              if obs is None: continue
              line=_observation_line(obs)
              if line is None: continue
              raw=str(obs.source_primitive_ref or "")
              reason=_withheld_affects_component(
                  withheld_line=line,withheld_raw_id=raw,
                  component_records=component_records,
                  known_same_separations=same_sep,
                  proven_subordinate_raw_ids=exemptions,
              )
              if reason:
                  blockers.append({
                      "obs":obs_id,"raw":raw,"norm":_raw_primitive_id(raw),
                      "family":_raw_path_family(raw),"geometry":list(line),
                      "reason":reason,"exempt":_raw_primitive_id(raw) in {_raw_primitive_id(x) for x in exemptions},
                  })

          comp_sources={r.wall_candidate_id:[_raw_primitive_id(str(x)) for x in r.physical_identity.source_primitive_ids] for r in component_records}
          comp_raw={x for xs in comp_sources.values() for x in xs}
          relevant=[]
          blocker_norm={b["norm"] for b in blockers}
          for st in strips:
              ids=set(st.boundary_raw_ids)
              if comp_raw & ids or blocker_norm & ids:
                  relevant.append({
                      "path":st.path_index,"faces":list(st.face_raw_ids),
                      "boundary":list(st.boundary_raw_ids),
                      "owned_faces":sorted(set(st.face_raw_ids)&comp_raw),
                      "owns_both":set(st.face_raw_ids)<=comp_raw,
                      "polygon":[list(p) for p in st.polygon],
                  })
          print("NATIVE_TARGET_BLOCKER "+json.dumps({
              "scope_reasons":list(scope.reason_codes),
              "members":list(members),
              "sources":comp_sources,
              "same_sep":list(same_sep),
              "exemptions":sorted(exemptions),
              "blockers":blockers,
              "relevant_strips":relevant,
          },sort_keys=True))
          PY
