name: GPT MAX source-authenticated rotated native schedule (shadow)

on:
  push:
    branches: [gptmax/source-rotated-native-schedule-20261105]
  pull_request:
    paths:
      - pb_schedule_opening_instance_binding_authority.py
      - pb_live_physical_opening_void_composition.py
      - tests/test_gptmax_source_rotated_schedule_shadow.py
      - .github/workflows/test-gptmax-source-rotated-native-schedule.yml

permissions:
  contents: read

jobs:
  rotated:
    name: Source-owned rotated schedule, no installed authority (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13","3.14"]
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-owned rotated projection and existing schedule binder guards
        run: |
          python -m pytest -q             tests/test_gptmax_source_rotated_schedule_shadow.py             tests/test_schedule_opening_instance_binding_authority_v1.py             tests/test_schedule_opening_instance_binding_authority_v2_regressions.py \
            tests/test_live_physical_opening_void_composition.py
      - run: |
          python -m compileall -q pb_schedule_opening_instance_binding_authority.py pb_live_physical_opening_void_composition.py tests/test_gptmax_source_rotated_schedule_shadow.py
          ruff check --select F821,F823 pb_schedule_opening_instance_binding_authority.py pb_live_physical_opening_void_composition.py tests/test_gptmax_source_rotated_schedule_shadow.py
