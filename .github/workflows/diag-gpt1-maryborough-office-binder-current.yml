name: DIAG GPT1 Maryborough Office Binder Current

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trace Office dimensions on current GPT1 head
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt1-office-dimension-current
          git rev-parse HEAD > artifacts/gpt1-office-dimension-current/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt1-office-dimension-current/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_gpt1_maryborough_office_dimension_current.py \
            | tee artifacts/gpt1-office-dimension-current/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-office-dimension-current
          path: artifacts/gpt1-office-dimension-current
          retention-days: 1
