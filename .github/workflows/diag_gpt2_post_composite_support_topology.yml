name: DIAG GPT2 Post Composite Support Topology

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Run page-11 support topology on current main
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-post-composite-support-topology
          git rev-parse HEAD > artifacts/gpt2-post-composite-support-topology/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-post-composite-support-topology/source_sha256.txt
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee artifacts/gpt2-post-composite-support-topology/result.json
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(10,),
              topology_pages=(10,),
              room_area_support_pages=(10,),
          )
          def norm(v):
              return " ".join(str(v or "").strip().upper().split())
          labelled=[
              {
                  "label":norm(room.room_label),
                  "canonical_room_id":room.canonical_room_id,
                  "decision_scope_id":room.decision_scope_id,
                  "source_room_face_record_id":room.source_room_face_record_id,
                  "area_page_pts2":room.area_page_pts2,
                  "reason_codes":list(room.room_label_reason_codes or ()),
              }
              for room in claim.canonical_rooms
              if norm(room.room_label)
          ]
          targets=("AIRLOCK","FREEZER","LAUNDRY","OFFICE","PWD","SALES","WASH UP","FOOD SERVICE","POS COUNTER","M-AMB","F-AMB","TRUCK DRIVER LOUNGE","DRY STORE","FOOD PREP","COLD ROOM")
          rows={name:[row for row in labelled if row["label"]==name] for name in targets}
          print(json.dumps({
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "labels":sorted({row["label"] for row in labelled}),
              "targets":rows,
              "reason_codes":list(claim.canonical_room_reason_codes),
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-post-composite-support-topology
          path: artifacts/gpt2-post-composite-support-topology
          retention-days: 1
