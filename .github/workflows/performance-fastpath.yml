name: Performance Fastpath CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded pull request run is cancelled; every push to main keeps its own run.
concurrency:
  group: performance-fastpath-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fastpath:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-v1228.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Compile performance and startup modules
        run: python -m py_compile pb_runtime_performance_v149.py pb_processing_fastpath_v150.py pb_startup_bootstrap_v151.py pb_persistent_login_v1229.py pb_planreader_v133_app.py
      - name: Runtime, cold-start, remembered-login and processing caching tests
        run: |
          PYTHONPATH=. pytest -q --durations=10 \
            tests/test_runtime_performance_v149.py \
            tests/test_startup_fastpath_v151.py \
            tests/test_processing_fastpath_v150.py
