name: DIAG Lot16 Count After Raster Closure

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run closure contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_framed_opening_g17_contract.py \
            tests/test_raster_door_swing_g17_contract.py \
            tests/test_semantic_opening_enumeration_authority_v1.py \
            tests/test_opening_universe_completeness_source_adapter_v1.py \
            tests/test_live_opening_count_quantity_publication.py
      - name: Run exact Lot16 count funnel
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_count_after_raster_closure.py | tee lot16-count-after-raster-closure.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-count-after-raster-closure
          path: lot16-count-after-raster-closure.json
          retention-days: 2
