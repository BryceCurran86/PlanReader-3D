name: TEST GPT2 Original A120 Multipath Semantic Frame Opt-in

on:
  pull_request:
    paths:
      - pb_viewport_segmentation.py
      - tests/test_gpt2_source_multipath_semantic_frame_optin.py
      - .github/workflows/test-gpt2-a120-original-multipath-optin.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exact-original-a120-schedule-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original A120 schedule positive and plan negative checks
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_source_multipath_semantic_frame_optin.py tests/test_gpt2_f07_optin_source_connected_semantic_cells.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
