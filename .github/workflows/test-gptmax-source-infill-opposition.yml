name: GPT MAX Source Infill and Actual Customer Retention
on:
  pull_request:
    branches: [main]
    paths:
      - "pb_g17_source_infill_opposition_shadow.py"
      - "pb_g17_plan_wall_scope_shadow.py"
      - "tests/test_g17_source_infill_opposition_shadow.py"
      - "tools/verify_g17_original_customer_scope_retention.py"
      - ".github/workflows/test-gptmax-source-infill-opposition.yml"
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  source-infill-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Actual source, weak openings, exact intervals, splits, stale and mid-read damage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_g17_source_infill_opposition_shadow.py tests/test_g17_plan_wall_scope_shadow.py tests/test_gptmax_w4_identity_abstention_shadow.py tests/test_opening_local_g17_wall_shadow.py tests/test_g17_dual_dpi_source_correspondence_shadow.py tests/test_source_owned_physical_plan_view.py tests/test_g17_w4_equivalence_competitor_shadow.py
          ruff check --select F821,F823 pb_g17_source_infill_opposition_shadow.py pb_g17_plan_wall_scope_shadow.py tests/test_g17_source_infill_opposition_shadow.py tools/verify_g17_original_customer_scope_retention.py
  actual-original-customer-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Immutable source through actual collector, source observer, signed seal and customer verification
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/verify_g17_original_customer_scope_retention.py --pdf "$PDF" --page 3 --project-id au_qld_lot16_power --infill-opposition --output artifacts/original-infill-customer-retention.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/original-infill-customer-retention.json').read_text())
          assert r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['production_page_indices']==[2]
          assert r['original_customer_scope_verified'] and r['all_actual_production_receipts_unchanged']
          a,b=r['baseline_customer_receipts'],r['candidate_customer_receipts']
          assert a==b
          assert len(a['customer_rows'])==a['verification']['valid_quantity_count']==8
          assert len(r['source_observers'])==1
          p=r['source_observers'][0]
          assert p['source_sha256']==r['source_sha256'] and p['source_viewport_ownership_id']
          assert p['ordinary_source_snapshot_unchanged'] and p['baseline_w2_geometry_unchanged']
          assert p['opposing_atoms'] and p['original_infill_intervals']
          assert all(not p[k] for k in ('host_granted','structural_wall_role_granted','physical_wall_equivalence_granted','metric_quantity_granted'))
          assert all(a['status']=='candidate' and a['metadata']['polarity']=='opposing' for a in p['opposing_atoms'])
          print(json.dumps({'verified_original_customer_rows':a['verification']['valid_quantity_count'],
              'source_frame_intervals':len(p['original_infill_intervals']),'opposing_atoms':len(p['opposing_atoms']),
              'default_opposed_continuations':len(p['candidate_partitions']['default_w2_w3_w4']['source_opposed_continuations']),
              'exact_opposed_continuations':len(p['candidate_partitions']['exact_coordinate_w2_w3_w4']['source_opposed_continuations'])}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-infill-actual-customer-retention
          path: artifacts/original-infill-customer-retention.json
          retention-days: 21
