name: GPT MAX Original Native Text Paint Partition Audit

concurrency:
  group: test-gptmax-native-paint-partition-shadow-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: "Proper trusted-main ancestor for exact original retention"
        required: true
        type: string
  pull_request:
    paths:
      - scripts/gptmax_native_dimension_source_partition.py
      - tests/test_gptmax_native_dimension_source_partition.py
      - pb_native_dimension_cap_evidence.py
      - pb_pdf_text_integrity_authority.py
      - docs/engineering/gptmax_native_dimension_source_partition.md
      - .github/workflows/test-gptmax-native-paint-partition-shadow.yml
permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_native_dimension_source_partition.py tests/test_native_dimension_cap_evidence.py tests/test_pdf_text_integrity_source_state_v1.py tests/test_pdf_text_integrity_production_v1.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
  original-lot16:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Validate explicit trusted main baseline before private source
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SHA" != "$GITHUB_SHA" ]]
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$GITHUB_SHA"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
      - name: Provision exact private original from trusted main
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: 1. Construction Plans - Lot 16 Power (REV E).pdf
          allow-missing: "false"
      - name: Exact trusted main baseline and head opening receipts
        run: |
          set -euo pipefail
          private_script="$RUNNER_TEMP/guarded-original-3.sh"
          private_output="$RUNNER_TEMP/guarded-original-3.log"
          cat > "$private_script" <<'PRIVATE_ORIGINAL_COMMANDS'
          git worktree add --detach /tmp/native-partition-original-base "$BASELINE_SHA"
          PYTHONPATH=. python scripts/copy_provisioned_originals_into_worktree.py \
            --workspace "$GITHUB_WORKSPACE" --worktree /tmp/native-partition-original-base \
            --name '1. Construction Plans - Lot 16 Power (REV E).pdf'
          (
            cd /tmp/native-partition-original-base
            PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
              --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
              --page-id 3 --output "$GITHUB_WORKSPACE/source-before.json"
          )
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --output source-after.json
          PYTHONPATH=. python tools/gptmax_compare_source_face_retention.py \
            --baseline source-before.json --candidate source-after.json --output source-retention.json
          PRIVATE_ORIGINAL_COMMANDS
          if bash -euo pipefail "$private_script" > "$private_output" 2>&1; then
            echo "PRIVATE ORIGINAL STEP PASS"
          else
            echo "::error::Private original verification failed; source details withheld."
            exit 1
          fi
      - name: Preserve untrusted original paint partitions without promotion
        run: |
          set -euo pipefail
          private_script="$RUNNER_TEMP/guarded-original-4.sh"
          private_output="$RUNNER_TEMP/guarded-original-4.log"
          cat > "$private_script" <<'PRIVATE_ORIGINAL_COMMANDS'
          PYTHONPATH=. python -u scripts/gptmax_native_dimension_source_partition.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 \
            --representative-observation-id source_observation_50346acbb28e7a0a9e7311b4b6965f8a \
            --output native-paint-partitions.json
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('source-before.json').read_text())
          new=json.loads(Path('source-after.json').read_text())
          audit=json.loads(Path('native-paint-partitions.json').read_text())
          sha='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert old['source_sha256']==new['source_sha256']==audit['source_sha256']==sha
          assert old['opening_bindings']==new['opening_bindings']
          assert old['host_frames']==new['host_frames']
          # Native opposition has legitimately changed historical positive counts.
          # Preserve the *exact* original head/base candidate and host inventory;
          # never substitute an aggregate count for the source receipts above.
          assert old['summary']==new['summary']
          assert new['summary']['physical_existence_claims']==len(new['opening_bindings'])>0
          assert new['summary']['host_bindings']==15
          assert new['summary']['host_frames']==9
          assert audit['source_reauthenticated'] is True
          assert audit['primitive_safety_cap']==20000
          row,=audit['candidate_audits']
          assert row['live_state_unchanged'] is True
          assert row['original_uncovered_support_ids']==row['partition_uncovered_support_ids']
          # The original producer now opposes the native look-alike using
          # independently authenticated dimension-line/tick/text topology.
          # A diagnostic CANDIDATE atom is never physical nonexistence proof.
          assert row['partition_uncovered_support_ids']==[]
          assert row['original_uncovered_support_ids']==[]
          assert row['complete_shadow_dimension_opposition'] is True
          atoms=row['shadow_opposing_evidence_atoms']
          assert atoms and len({a['evidence_id'] for a in atoms})==len(atoms)
          support=set(row['original_live_state']['candidate']['source_observation_ids'])
          assert len(support)==6
          assert all(
              atom['kind']=='dimension_annotation'
              and atom['status']=='candidate'
              and atom['reason_codes']==['native_dimension_cap_tick_text_topology']
              and atom['metadata']['source_sha256']==sha
              and atom['metadata']['all_opening_support_covered'] is True
              and set(atom['metadata']['opening_support_observation_ids'])==support
              and atom['metadata']['text_observation_id']
              for atom in atoms
          )
          assert row['original_live_state']['existence_record_id'] is None
          partition,=row['relevant_original_text_paint_partitions']
          assert partition['raw_text']=='90450'
          assert partition['text_integrity_status']=='abstained'
          assert partition['text_integrity_reason_codes']==['text_trace_unavailable']
          assert partition['text_integrity_authenticated'] is False
          assert [(p['seqno'],p['text']) for p in partition['original_paint_partitions']]==[(954,'90'),(956,'450')]
          assert partition['intervening_paint_commands']==[{'seqno':955,'kind':'fill-path',
              'bbox':[1016.8800048828125,584.760009765625,1028.6400146484375,593.6400146484375]}]
          for key in ('live_producer_changed','hypotheses_deletion_allowed','physical_nonexistence_proven',
              'host_publication_allowed','opening_count_publication_allowed','metric_quantity_publication_allowed'):
              assert audit[key] is False
          PY
          PRIVATE_ORIGINAL_COMMANDS
          if bash -euo pipefail "$private_script" > "$private_output" 2>&1; then
            echo "PRIVATE ORIGINAL STEP PASS"
          else
            echo "::error::Private original verification failed; source details withheld."
            exit 1
          fi
      - name: Destroy private originals and unpublished diagnostics
        if: always()
        run: |
          rm -rf documents/sources artifacts q5446-original-positive-floor laurel-original-floor-produced laurel-source-positive-core
          rm -f source-before.json source-after.json source-retention.json native-paint-partitions.json
          rm -f "$RUNNER_TEMP"/guarded-original-*.sh "$RUNNER_TEMP"/guarded-original-*.log
          if [ -d /tmp/native-partition-original-base ]; then
            git worktree remove --force /tmp/native-partition-original-base
          fi
