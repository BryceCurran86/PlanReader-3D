name: Live Physical Net Wall Extractor Wiring

on:
  push:
    branches: [feat/live-physical-net-wall-extractor-wiring-v2]

concurrency:
  group: live-physical-net-wall-extractor-wiring
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Compile changed production modules
        run: |
          python -m py_compile             pb_live_physical_net_wall_integration.py             pb_planreader_pdf_extractor.py
      - name: Run focused physical net-wall wiring tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_physical_net_wall_integration.py             tests/test_live_physical_net_wall_extractor_publication.py             tests/test_live_gross_wall_geometry_composition.py             tests/test_live_external_physical_net_wall_publication.py             tests/test_live_whole_wall_role_composition.py             tests/test_live_net_wall_boolean_composition.py             tests/test_wall_net_extractor_seam_regression.py
      - name: Run full test suite
        run: PYTHONPATH=. pytest -q
