name: GPT MAX Exact Source First Failure Ledger

on:
  pull_request:
    paths:
      - "tools/gptmax_source_first_failure_ledger.py"
      - "tests/test_gptmax_source_first_failure_ledger.py"
      - ".github/workflows/test-gptmax-source-first-failure-ledger.yml"
  workflow_dispatch:

jobs:
  source-first-failure-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Fail-closed dual-universe audit
        run: PYTHONPATH=. python -m pytest -q tests/test_gptmax_source_first_failure_ledger.py
  lot16-original-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Validate benchmark isolation
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Producer-owned real original Lot16 source diagnostic
        run: |
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --page-id 3 --source-all-pages --output lot16-original-source.json
      - name: Fail closed on missing provenance and unresolved counts
        run: |
          PYTHONPATH=. python tools/gptmax_source_first_failure_ledger.py \
            --input lot16-original-source.json --output lot16-first-failure-ledger.json
          python - <<'PY'
          import json
          s=json.load(open("lot16-original-source.json"))
          r=json.load(open("lot16-first-failure-ledger.json"))
          assert s["source_sha256"]==r["source_sha256"]=="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert r["source_primitive_safety_cap"]==20000
          assert r["source_all_pages_requested"] is True
          assert r["whole_building_opening_universe_complete"] is False
          assert r["count_quantity_publication_allowed"] is False
          assert r["raw_candidate_to_physical_identity_join"]=="UNPROVEN_NOT_ATTEMPTED"
          assert r["frozen_benchmark_reconciliation"] is None
          print("Original source opening/host/frame/raw-universe identity ledger generated; no count/quantity promoted")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptmax-real-lot16-first-failure-ledger
          path: |
            lot16-original-source.json
            lot16-first-failure-ledger.json
          if-no-files-found: ignore
