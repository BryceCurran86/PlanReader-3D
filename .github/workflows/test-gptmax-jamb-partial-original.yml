name: GPT MAX source-owned anchored G17 partial-wall ink
on:
  pull_request:
    branches: [main, gptmax/authenticated-one-ended-g17-source-capture-20261017]
    paths:
      - pb_raster_unchanged_band_segments.py
      - pb_source_visibility_authority.py
      - tests/test_gptmax_original_jamb_partial.py
      - .github/workflows/test-gptmax-jamb-partial-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-anchored-no-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt pytest ruff
      - run: |
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' | sha256sum -c
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_original_jamb_partial.py tests/test_gptmax_original_one_ended_g17_ink.py
          ruff check --select F821,F823 pb_raster_unchanged_band_segments.py pb_source_visibility_authority.py tests/test_gptmax_original_jamb_partial.py
