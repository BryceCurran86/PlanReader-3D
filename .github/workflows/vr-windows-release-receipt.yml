name: VR Windows Preview Receipt Contract
on:
  pull_request:
    paths:
      - "vr-editor/windows/release_receipt.py"
      - "tests/test_vr_windows_release_receipt.py"
      - ".github/workflows/vr-windows-release-receipt.yml"
      - ".github/workflows/vr-desktop-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline release receipt negative tests
        run: python -m unittest discover -s tests -p test_vr_windows_release_receipt.py -v
