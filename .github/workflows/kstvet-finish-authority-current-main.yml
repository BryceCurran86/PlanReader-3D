name: TEST-ONLY KSTVET C47-A Wall Gate Trace

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-c47a-wall-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install rapidocr

      - name: Focused binder invariants
        run: |
          PYTHONPATH=. pytest -q tests/test_wall_finish_callout_wall_authority_v1.py

      - name: Download exact KSTVET source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -

      - name: Trace exact authenticated external callouts
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          timeout 1200s python scripts/diag_kstvet_finish_callout_wall_gate.py /tmp/kstvet.pdf \
            2>&1 | tee /tmp/kstvet-c47a-wall-gate.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kstvet-c47a-wall-gate
          path: /tmp/kstvet-c47a-wall-gate.log
          if-no-files-found: warn
