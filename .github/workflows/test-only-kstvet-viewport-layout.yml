name: TEST-ONLY KSTVET Viewport Layout

on:
  pull_request:
    branches: [main]

jobs:
  viewport-layout:
    if: startsWith(github.head_ref, 'diag/kstvet-window-spatial-binding-post-763')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect KSTVET page 54 viewport layout
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          import fitz

          from pb_viewport_segmentation import (
              calibrate_viewport_layout,
              extract_view_title_anchors,
              extract_vector_frames,
              segment_page_viewports,
          )

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected_sha="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-viewport-layout/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          p=Path("/tmp/kstvet.pdf")
          p.write_bytes(payload)

          doc=fitz.open(p)
          try:
              page=doc[53]
              cal=calibrate_viewport_layout(page)
              anchors=extract_view_title_anchors(page)
              frames=extract_vector_frames(page,cal)
              views=segment_page_viewports(page,page_number=54)
              out={
                  "source_sha256":actual,
                  "page_rect":[float(x) for x in page.rect],
                  "calibration":{
                      "page_width_pt":cal.page_width_pt,
                      "page_height_pt":cal.page_height_pt,
                      "median_word_height_pt":cal.median_word_height_pt,
                      "title_frame_gap_pt":cal.title_frame_gap_pt,
                      "minimum_frame_span_pt":cal.minimum_frame_span_pt,
                      "title_separation_pt":cal.title_separation_pt,
                  },
                  "anchors":[
                      {
                          "text":a.text,
                          "view_type":a.view_type,
                          "bbox":[float(x) for x in a.bbox],
                          "center":[float(x) for x in a.center],
                      } for a in anchors
                  ],
                  "frames":[[float(x) for x in f] for f in frames],
                  "viewports":[
                      {
                          "view_id":v.view_id,
                          "view_type":v.view_type,
                          "label":v.label,
                          "title_bbox":[float(x) for x in v.title_bbox],
                          "bbox":[float(x) for x in v.bounding_box] if v.bounding_box else None,
                          "status":v.status,
                          "boundary_source":v.boundary_source,
                          "notes":list(v.notes),
                          "provenance":v.provenance,
                      } for v in views
                  ],
              }
              print("KSTVET_VIEWPORT_LAYOUT="+json.dumps(out,sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          PY
