name: GPT MAX Mixed G17 Source Band Safety
on:
  pull_request:
    paths:
      - pb_opening_host_binding_authority.py
      - tests/test_gptmax_mixed_scope_source_band.py
      - .github/workflows/test-gptmax-mixed-source-band.yml
jobs:
  original-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Real source-positive synthetic and exact cross-scope negative tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_gptmax_mixed_scope_source_band.py \
            tests/test_raster_unchanged_band_segments.py \
            tests/test_opening_host_source_candidate_witness.py
      - name: Protect frozen V2 and provider isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
