name: DIAG GPT3 Maryborough Runtime V1

on:
  push:
    branches:
      - fix/gpt3-maryborough-runtime-v1
  pull_request:
    branches:
      - main

concurrency:
  group: diag-gpt3-maryborough-runtime-v1
  cancel-in-progress: true

# Supersedes completed focused profile; later runs remain diagnostic-only.

jobs:
  validate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused regression tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_source_closed_project_handoff.py \
            tests/test_live_canonical_room_composition.py
      - name: Focused Maryborough runtime proof
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt3-maryborough-runtime
          PYTHONPATH=. python -u - <<'PY' | tee artifacts/gpt3-maryborough-runtime/focused.json
          import faulthandler
          import json
          import time
          from collections import defaultdict
          from pathlib import Path
          import pb_live_physical_net_wall_integration as live

          faulthandler.enable()
          faulthandler.dump_traceback_later(60, repeat=True)

          timings=defaultdict(float)
          calls=defaultdict(int)

          def wrap_module(name):
              original=getattr(live,name)
              def wrapped(*args,**kwargs):
                  started=time.perf_counter()
                  try:
                      return original(*args,**kwargs)
                  finally:
                      elapsed=time.perf_counter()-started
                      timings[name]+=elapsed
                      calls[name]+=1
                      print(f"STAGE {name} call={calls[name]} elapsed={elapsed:.3f}s total={timings[name]:.3f}s", flush=True)
              setattr(live,name,wrapped)

          for name in (
              "compose_live_wall_opening_authority",
              "compose_live_canonical_walls",
              "compose_live_canonical_rooms",
              "compose_live_canonical_spaces",
              "compose_live_canonical_floor_surfaces",
              "build_source_room_area_bridge",
              "enrich_live_canonical_floor_metric_areas",
              "enrich_live_canonical_floor_finishes",
              "compose_live_physical_opening_voids",
              "publish_live_opening_area_quantities",
              "publish_live_authenticated_opening_count_quantities",
              "compose_live_gross_wall_geometry",
              "compose_live_whole_wall_roles",
              "compose_live_external_physical_net_wall_publication",
          ):
              wrap_module(name)

          original_ingest=live.SourceVisibilityProducer.ingest_native_pdf_bytes
          def timed_ingest(self,*args,**kwargs):
              started=time.perf_counter()
              try:
                  return original_ingest(self,*args,**kwargs)
              finally:
                  elapsed=time.perf_counter()-started
                  timings["source_ingest"]+=elapsed
                  calls["source_ingest"]+=1
                  print(f"STAGE source_ingest elapsed={elapsed:.3f}s", flush=True)
          live.SourceVisibilityProducer.ingest_native_pdf_bytes=timed_ingest

          original_cross=live.CrossViewRoomAreaProducer.publish
          def timed_cross(self,*args,**kwargs):
              started=time.perf_counter()
              try:
                  return original_cross(self,*args,**kwargs)
              finally:
                  elapsed=time.perf_counter()-started
                  timings["cross_view_room_area"]+=elapsed
                  calls["cross_view_room_area"]+=1
                  print(f"STAGE cross_view_room_area elapsed={elapsed:.3f}s", flush=True)
          live.CrossViewRoomAreaProducer.publish=timed_cross

          original_finish=live.CrossViewFloorFinishProducer.publish
          def timed_finish(self,*args,**kwargs):
              started=time.perf_counter()
              try:
                  return original_finish(self,*args,**kwargs)
              finally:
                  elapsed=time.perf_counter()-started
                  timings["cross_view_floor_finish"]+=elapsed
                  calls["cross_view_floor_finish"]+=1
                  print(f"STAGE cross_view_floor_finish elapsed={elapsed:.3f}s", flush=True)
          live.CrossViewFloorFinishProducer.publish=timed_finish

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          started=time.perf_counter()
          claim=live.collect_live_physical_net_wall_claim(
              path,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          elapsed=time.perf_counter()-started
          faulthandler.cancel_dump_traceback_later()

          def norm(value):
              return " ".join(str(value or "").strip().upper().split())
          labels={norm(room.room_label) for room in claim.canonical_rooms if norm(room.room_label)}
          firm={
              norm(dict(q.metadata or {}).get("room_label")):float(q.value)
              for q in claim.room_area_quantity_evidence
              if not q.abstained and q.value is not None
          }
          assert abs(firm["FOOD PREP"]-13.270425) < 1e-9
          assert abs(firm["COLD ROOM"]-25.37875) < 1e-9
          assert "DRY STORE" not in labels
          assert "DRY STORE" not in firm
          print(json.dumps({
              "elapsed_seconds":elapsed,
              "stage_timings_seconds":dict(sorted(timings.items())),
              "stage_calls":dict(sorted(calls.items())),
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "firm_room_areas":firm,
              "labels":sorted(labels),
          },indent=2,sort_keys=True))
          PY
      - name: Full Maryborough all-family handoff
        run: |
          set -o pipefail
          START=$(date +%s)
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf \
            --project-id au_qld_maryborough_service_station \
            --workspace-id 1 \
            --family-group all \
            --output-dir artifacts/gpt3-maryborough-runtime/full \
            | tee artifacts/gpt3-maryborough-runtime/full.stdout.json
          END=$(date +%s)
          echo "{\"elapsed_seconds\":$((END-START))}" > artifacts/gpt3-maryborough-runtime/full_elapsed.json
          cat artifacts/gpt3-maryborough-runtime/full/production_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-maryborough-runtime-v1
          path: artifacts/gpt3-maryborough-runtime
          retention-days: 3
