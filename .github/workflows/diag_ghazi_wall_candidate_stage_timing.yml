name: TEST-ONLY Ghazi Wall Candidate Stage Timing

on:
  pull_request:
    branches: [main]

jobs:
  ghazi-wall-stage-timing:
    if: github.head_ref == 'diag/ghazi-wall-candidate-stage-timing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download SHA-pinned Ghazi source
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          bid="tenders_ke_ghazi_science_lab"
          bench=pathlib.Path("benchmarks/public_tenders")/bid
          dm=json.loads((bench/"download_manifest.json").read_text())
          doc=next(d for d in dm["documents"] if d["role"]=="architectural_drawings")
          out=pathlib.Path("/tmp")/doc["filename"]
          req=urllib.request.Request(dm["source_url"],headers={"User-Agent":"PlanReader-wall-stage-timing/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              out.write_bytes(r.read())
          got=hashlib.sha256(out.read_bytes()).hexdigest()
          if got != doc["sha256"]:
              raise SystemExit(f"sha mismatch {got}")
          print(out)
          PY

      - name: Build exact production image
        run: docker build -t planreader-wall-stage-timing .

      - name: Time physical wall candidate stages
        run: |
          docker run --rm -i --cpus=2.0 \
            -v /tmp/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf:/app/ghazi.pdf:ro \
            planreader-wall-stage-timing \
            python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import pb_physical_wall_candidate_authority as wallmod
          from pb_source_visibility_authority import SourceVisibilityProducer

          payload=Path("/app/ghazi.pdf").read_bytes()
          source_sha=hashlib.sha256(payload).hexdigest()
          document_id=f"diag-wall-stage:{source_sha[:32]}"
          page_id="167"
          page_ids=(page_id,)

          def emit(stage,t0,**extra):
              print("WALL_STAGE="+json.dumps({
                  "stage":stage,
                  "seconds":round(time.time()-t0,3),
                  **extra,
              },sort_keys=True,default=str),flush=True)

          source=SourceVisibilityProducer(producer_method="diag-wall-stage",producer_version="1.0.0")
          t=time.time()
          published=source.ingest_native_pdf_bytes(
              document_id=document_id,
              source_bytes=payload,
              source_locator="memory://ghazi-wall-stage.pdf",
              page_ids=page_ids,
          )
          emit("ingest",t,coverage_state=published.coverage.state,decoded_pages=list(published.coverage.decoded_pages),snapshot_id=published.snapshot.snapshot_id,visible_count=len(published.visible_observation_ids))

          t=time.time()
          source.augment_with_raster_visible_segments(published.revision.revision_id,page_ids=page_ids)
          published=source.published_snapshot_for_revision(published.revision.revision_id)
          assert published is not None
          emit("raster_augment",t,snapshot_id=published.snapshot.snapshot_id,visible_count=len(published.visible_observation_ids))

          scope_id=wallmod._decision_scope_id(page_id)
          t=time.time()
          segments,obs_ids,page_width,page_height=wallmod._source_page_segments(
              source_producer=source,
              published=published,
              source_bytes=payload,
              page_id=page_id,
              decision_scope_id=scope_id,
          )
          emit("source_page_segments",t,segment_count=len(segments),observation_count=len(obs_ids))

          t=time.time()
          scale_producer=wallmod.PhysicalScaleProducer.from_source_visibility_producer(source)
          emit("scale_producer",t)

          t=time.time()
          points_per_mm=wallmod._producer_owned_points_per_mm(
              scale_producer=scale_producer,
              published=published,
              page_id=page_id,
          )
          emit("scale_resolve",t,points_per_mm=points_per_mm)

          selector=wallmod.PhysicalWallCandidateSelector(
              document_id=published.revision.document_id,
              revision_id=published.revision.revision_id,
              source_sha256=published.revision.source_sha256,
              snapshot_id=published.snapshot.snapshot_id,
              page_id=page_id,
              decision_scope_id=scope_id,
          )
          t=time.time()
          result=wallmod._assemble_scope_result(
              source_producer=source,
              published=published,
              page_id=page_id,
              selector=selector,
              segments=segments,
              source_observation_ids=obs_ids,
              page_width=page_width,
              page_height=page_height,
              source_bytes=payload,
              points_per_mm=points_per_mm,
          )
          emit("assemble_scope",t,status=getattr(result.status,"value",result.status),scope_complete=result.scope_complete,candidate_count=len(result.records),reason_codes=list(result.reason_codes))
          PY
