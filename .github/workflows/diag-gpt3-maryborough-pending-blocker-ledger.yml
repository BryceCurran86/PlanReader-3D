name: DIAG GPT3 Maryborough Pending Blocker Ledger

on:
  pull_request:
    branches:
      - main

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify frozen V2 integrity
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Build Maryborough pending blocker ledger
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_maryborough_pending_blocker_ledger.py \
            | tee maryborough-pending-blocker-ledger.stdout.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-maryborough-pending-blocker-ledger
          path: |
            artifacts/gpt3-maryborough-pending
            maryborough-pending-blocker-ledger.stdout.json
          retention-days: 3
