name: DIAG Lot16 Eight Area Postmerge Main

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run real all-family handoff
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/lot16-eight-area-postmerge
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --project-id au_qld_lot16_power \
            --workspace-id 1 \
            --family-group all \
            --output-dir artifacts/lot16-eight-area-postmerge \
            | tee artifacts/lot16-eight-area-postmerge/handoff.stdout.json
      - name: Assert merged production baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/lot16-eight-area-postmerge/au_qld_lot16_power.json")
          payload=json.loads(p.read_text())
          rows=[q for q in payload.get("quantities",[]) if q.get("family")=="opening_area" and not q.get("abstained",False)]
          vals=sorted(round(float(q["value"]),6) for q in rows)
          expected=[0.54,0.9,1.26,1.8,2.16,2.16,5.67,10.08]
          if len(rows) < 8 or vals[:8] != expected:
              raise SystemExit(f"postmerge opening-area regression: got {len(rows)} {vals}")
          print(json.dumps({
              "opening_area_count":len(rows),
              "opening_areas":vals,
              "status":payload.get("status"),
              "source_sha256s":payload.get("source_sha256s"),
          },indent=2))
          PY
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-eight-area-postmerge-main
          path: artifacts/lot16-eight-area-postmerge
          retention-days: 2
