name: TEST-ONLY KSTVET Gable Extractor Wiring B695

on:
  pull_request:
    branches: [main]

jobs:
  gable-wiring:
    if: startsWith(github.head_ref, 'diag/kstvet-gable-extractor-wiring-b695')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Trace page 54 gable extraction
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          p=Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-gable-wiring/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:p.write_bytes(r.read())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected:raise SystemExit(actual)
          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(p,pages=[53],collect_item35_shadow=False)
          focus={x.tag:x.to_dict() for x in preds if x.tag in {"floor_screed","perimeter_walling","gable_walling"}}
          print("KSTVET_GABLE_EXTRACTOR_WIRING="+json.dumps({
              "focus":focus,
              "roof_shadow":ex.roof_covering_shadow,
              "status":ex.extraction_status,
          },sort_keys=True,default=str),flush=True)
          PY
