name: TEST GPT3 Pending Identity Activation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/prepare_gpt3_pending_identity_activation.py"
      - "tests/test_gpt3_pending_identity_activation.py"
      - ".github/workflows/test-gpt3-pending-identity-activation.yml"
      - "docs/engineering/lot16_original_identity_reconciliation_20261012/**"
      - "benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/**"
  workflow_dispatch:

concurrency:
  group: gpt3-pending-identity-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Verify real signed-run activation boundary
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_pending_identity_activation.py
          python -m compileall -q tools/prepare_gpt3_pending_identity_activation.py
          ruff check --select F821,F823 tools/prepare_gpt3_pending_identity_activation.py tests/test_gpt3_pending_identity_activation.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
