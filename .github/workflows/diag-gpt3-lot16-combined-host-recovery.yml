name: DIAG GPT3 Lot16 Combined Host Recovery

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused host-binding regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_framed_opening_g17_contract.py \
            tests/test_raster_opening_live_enumeration.py \
            tests/test_opening_host_binding_review_hardening_v3.py \
            tests/test_opening_host_binding_cross_role_same_v3.py
      - name: Run real Lot16 combined production funnel
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_host_integration.py \
            | tee lot16-combined-host-recovery.json
      - name: Run current-snapshot semantic residual audit
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_semantic_residual_current.py \
            | tee lot16-semantic-residual-current.json
      - name: Run physical-opening candidate overlap audit
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_candidate_overlap.py \
            | tee lot16-candidate-overlap.json
      - name: Run opening support origin/ownership audit
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_opening_role_origin.py \
            | tee lot16-opening-role-origin.json
      - name: Run host-proven/no-area audit
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_hosted_no_area.py \
            | tee lot16-hosted-no-area.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-combined-host-recovery
          path: |
            lot16-combined-host-recovery.json
            lot16-semantic-residual-current.json
            lot16-candidate-overlap.json
            lot16-opening-role-origin.json
            lot16-hosted-no-area.json
          retention-days: 2
