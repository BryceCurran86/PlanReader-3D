name: TEST GPT3 1215 Fresh Paired Customer Retention

on:
  pull_request:
    branches: [main]
    paths:
      - "pb_live_wall_opening_authority_composition.py"
      - "pb_opening_host_binding_authority.py"
      - "pb_physical_wall_candidate_authority.py"
      - "pb_raster_unchanged_band_segments.py"
      - "pb_source_visibility_authority.py"
      - "tools/verify_gptmax_customer_receipt_retention.py"
      - ".github/workflows/test-gpt3-1215-paired-customer-retention.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt3-1215-fresh-customer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-paired-source-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ORT_DISABLE_TELEMETRY: "1"
      SOURCE_SHA: "10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
      TARGET_PHYSICAL: "physical_opening_existence_2b2a91e8afaf8b7e9a3e07605a80a4a9"
      TARGET_QUANTITY: "opening_area_11bd4d5f9acb00b9dc46f12105a374bf"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Immutable frozen truth and provider isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
      - name: Produce fresh exact base and candidate source/customer runs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git worktree add --detach /tmp/gpt3-1215-base "$BASE_SHA"
          mkdir -p artifacts/baseline/production artifacts/candidate/production
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' "$SOURCE_SHA" "$PDF" | sha256sum --check
          (
            cd /tmp/gpt3-1215-base
            printf '%s  %s\n' "$SOURCE_SHA" "$PDF" | sha256sum --check
            # Use the exact final-head read-only handoff harness for BOTH
            # executions. Only this harness is overlaid in the base worktree;
            # all production/source authority modules remain at BASE_SHA.
            cp "$GITHUB_WORKSPACE/tools/run_gpt3_lot16_original_sealed_score_input.py" \
              tools/run_gpt3_lot16_original_sealed_score_input.py
            test "$(git diff --name-only)" = \
              "tools/run_gpt3_lot16_original_sealed_score_input.py"
            PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
              --pdf "$PDF" --page-id 3 --source-all-pages \
              --include-identity-text-receipts \
              --output "$GITHUB_WORKSPACE/artifacts/baseline/source-report.json"
            PYTHONPATH=. python -u -m tools.run_gpt3_lot16_original_sealed_score_input \
              --pdf "$PDF" \
              --output-dir "$GITHUB_WORKSPACE/artifacts/baseline/production"
          )
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages \
            --include-identity-text-receipts \
            --output artifacts/candidate/source-report.json
          PYTHONPATH=. python -u -m tools.run_gpt3_lot16_original_sealed_score_input \
            --pdf "$PDF" \
            --output-dir artifacts/candidate/production
          printf '%s\n' "$BASE_SHA" > artifacts/base_sha.txt
          printf '%s\n' "$HEAD_SHA" > artifacts/head_sha.txt
      - name: Prove source, sealed quantity and customer receipt retention
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pb_customer_output_verification import verify_sealed_customer_output
          from pb_source_closed_run_export import sealed_source_closed_run_from_dict
          from tools.declared_additive_source_retention import (
              sealed_quantities_changed_only_by_snapshot_receipts,
          )
          from tools.verify_gptmax_customer_receipt_retention import (
              verify_customer_receipt_rekeys,
          )

          root=Path("artifacts")
          def load(role):
              d=root/role
              source=json.loads((d/"source-report.json").read_text())
              sealed_raw=json.loads((d/"production/source_sealed_run.json").read_text())
              rows=json.loads((d/"production/verified_customer_rows.json").read_text())
              openings=json.loads((d/"production/source_production_openings.json").read_text())
              sealed=sealed_source_closed_run_from_dict(sealed_raw)
              verified=verify_sealed_customer_output(sealed,rows)
              assert verified.valid_quantity_count==len(sealed.quantities)
              assert verified.customer_row_count==len(sealed.quantities)
              assert set(verified.verified_quantity_ids)=={q.quantity_id for q in sealed.quantities}
              assert len(openings)==21
              return source,sealed_raw,rows,openings

          old,old_run,old_rows,old_production_openings=load("baseline")
          new,new_run,new_rows,new_production_openings=load("candidate")
          sha=os.environ["SOURCE_SHA"]
          target=os.environ["TARGET_PHYSICAL"]
          quantity_id=os.environ["TARGET_QUANTITY"]

          assert old["source_sha256"]==new["source_sha256"]==sha
          assert old["primitive_safety_cap"]==new["primitive_safety_cap"]==20_000
          assert old["snapshot_id"]!=new["snapshot_id"]
          assert old["summary"]["physical_existence_claims"]==21
          assert new["summary"]["physical_existence_claims"]==21
          assert {r["opening_identity_id"] for r in old["opening_bindings"]} == {
              r["opening_identity_id"] for r in new["opening_bindings"]
          }

          old_scopes=old["source_owned_wall_scopes"]
          new_scopes=new["source_owned_wall_scopes"]
          assert len(old_scopes)==len(new_scopes)
          for before,after in zip(old_scopes,new_scopes):
              assert before["records"]==after["records"]
          page3=[r for r in new_scopes if str(r["page_id"])=="3"
                 and r["decision_scope_id"]=="wall-source:page-3"]
          assert len(page3)==1 and len(page3[0]["records"])==2094

          old_hosts={r["opening_identity_id"]:r for r in old["opening_bindings"]}
          new_hosts={r["opening_identity_id"]:r for r in new["opening_bindings"]}
          old_frames={r["opening_identity_id"]:r for r in old["host_frame_traces"]}
          new_frames={r["opening_identity_id"]:r for r in new["host_frame_traces"]}
          assert set(old_hosts)==set(new_hosts)==set(old_frames)==set(new_frames)
          assert old_hosts[target]["status"]=="abstained"
          assert new_hosts[target]["status"]=="corroborated"
          assert len(new_hosts[target]["member_wall_candidate_ids"])==2
          assert old_frames[target]["status"]!="corroborated"
          assert new_frames[target]["status"]!="corroborated"
          assert sum(r["status"]=="corroborated" for r in old_hosts.values())==14
          assert sum(r["status"]=="corroborated" for r in new_hosts.values())==15
          assert sum(r["status"]=="corroborated" for r in old_frames.values())==9
          assert sum(r["status"]=="corroborated" for r in new_frames.values())==9

          quantity_rekeys=sealed_quantities_changed_only_by_snapshot_receipts(
              old_run["quantities"],new_run["quantities"]
          )
          assert len(old_run["quantities"])==7
          assert len(new_run["quantities"])==8
          old_ids={q["quantity_id"] for q in old_run["quantities"]}
          extras=[q for q in new_run["quantities"] if q["quantity_id"] not in old_ids]
          assert len(extras)==1
          extra=extras[0]
          assert extra["quantity_id"]==quantity_id
          assert extra["object_identity_refs"]==[target]
          assert extra["family"]=="opening_area"
          assert extra["value"]==1.8 and extra["unit"]=="m2"
          assert extra["lineage_ok"] is True and extra["abstained"] is False

          customer_receipt=verify_customer_receipt_rekeys(
              old_rows,new_rows,old,new,
              expected_new_physical_id=target,
              expected_new_quantity_id=quantity_id,
              baseline_production_openings=old_production_openings,
              candidate_production_openings=new_production_openings,
              baseline_sealed_quantities=old_run["quantities"],
              candidate_sealed_quantities=new_run["quantities"],
          )
          evidence={
              "source_sha256":sha,
              "baseline_snapshot_id":old["snapshot_id"],
              "candidate_snapshot_id":new["snapshot_id"],
              "physical_opening_count":21,
              "canonical_page3_w4_records":2094,
              "baseline_hosts":14,
              "candidate_hosts":15,
              "frames_retained":9,
              "baseline_signed_customer_rows":len(old_rows),
              "candidate_signed_customer_rows":len(new_rows),
              "quantity_receipt_rekeys":quantity_rekeys,
              "customer_receipt_retention":customer_receipt,
              "new_physical_opening_id":target,
              "new_quantity_id":quantity_id,
              "new_value":1.8,
              "new_unit":"m2",
              "benchmark_score_granted_by_this_gate":False,
          }
          (root/"gpt3-1215-fresh-customer-retention.json").write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(evidence,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-1215-fresh-paired-customer-retention
          path: |
            artifacts/base_sha.txt
            artifacts/head_sha.txt
            artifacts/baseline/source-report.json
            artifacts/baseline/production/source_sealed_run.json
            artifacts/baseline/production/verified_customer_rows.json
            artifacts/baseline/production/source_production_openings.json
            artifacts/candidate/source-report.json
            artifacts/candidate/production/source_sealed_run.json
            artifacts/candidate/production/verified_customer_rows.json
            artifacts/candidate/production/source_production_openings.json
            artifacts/gpt3-1215-fresh-customer-retention.json
          retention-days: 30
