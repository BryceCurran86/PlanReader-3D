name: DIAG GPT2 Maryborough U2 Grid Counterfactual

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Maryborough U2 grid counterfactual
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-maryborough-u2-grid-counterfactual
          git rev-parse HEAD > artifacts/gpt2-maryborough-u2-grid-counterfactual/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-u2-grid-counterfactual/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_u2_grid_counterfactual.py \
            | tee artifacts/gpt2-maryborough-u2-grid-counterfactual/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-u2-grid-counterfactual
          path: artifacts/gpt2-maryborough-u2-grid-counterfactual
          retention-days: 1
