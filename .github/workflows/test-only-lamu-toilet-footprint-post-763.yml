name: TEST-ONLY Lamu Toilet Footprint Post 763

on:
  pull_request:
    branches: [main]

jobs:
  lamu-toilet-footprint:
    if: startsWith(github.head_ref, 'diag/lamu-toilet-footprint-post-763')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Probe SHA-pinned Lamu secondary building geometry
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_figured_dimension_evidence import extract_dimension_evidence_bundle
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_viewport_segmentation import segment_page_viewports

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-toilet-footprint-post-763/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/lamu.pdf"); source.write_bytes(payload)

          doc=fitz.open(source)
          try:
              out={"source_sha256":actual,"production_sha":"65bbdb077333e376e2c0ee0cb6dd002afa28197c","pages":[]}
              for pno in range(40,45):
                  page=doc[pno]
                  text=page.get_text("text") or ""
                  viewports=segment_page_viewports(page,page_number=pno+1)
                  bundle=extract_dimension_evidence_bundle(page,page_num=pno+1,view_id=None,view_type=None)
                  chains=[]
                  try:
                      for ch in extract_dimension_chains_from_page(page,page_num=pno+1,view_id=f"page_{pno+1}"):
                          obs=list(getattr(ch,"observations",[]) or [])
                          chains.append({
                              "chain_id":str(getattr(ch,"chain_id","")),
                              "values_m":[round(float(o.value_m),4) for o in obs],
                              "orientations":[getattr(o,"orientation",None) for o in obs],
                              "bboxes":[list(o.bbox) if getattr(o,"bbox",None) else None for o in obs],
                          })
                  except Exception as exc:
                      chains=[{"error":repr(exc)}]
                  relevant=[ln.strip() for ln in text.splitlines() if re.search(
                      r"(?i)(?:toilet|wc|latrine|floor\s*plan|ground\s*floor|plan|verand|dpc|damp|\b[0-9]+(?:\.[0-9]+)?\s*(?:m|mm)\b)",
                      ln
                  )]
                  ex=GenericPlanReaderExtractor()
                  preds=ex.extract_from_pdf(source,pages=[pno])
                  focus={
                      p.tag:{
                          "quantity":p.quantity,"unit":p.unit,"dimensions":p.dimensions,
                          "source_page":p.source_page,"confidence":p.confidence,"metadata":p.metadata
                      }
                      for p in preds
                      if p.tag in {
                          "damp_proof_course","floor_screed","substructure_bed_dpm",
                          "perimeter_walling","D1","D2","W1","W2"
                      }
                  }
                  out["pages"].append({
                      "page":pno+1,
                      "native_chars":len(text),
                      "relevant_text":relevant[:220],
                      "viewports":[{
                          "view_id":v.view_id,"view_type":v.view_type,"status":v.status,
                          "boundary_source":v.boundary_source,"bbox":list(v.bounding_box) if v.bounding_box else None,
                          "label":v.label
                      } for v in viewports],
                      "observations":[{
                          "id":o.dimension_id,"value_m":o.value_m,"orientation":getattr(o,"orientation",None),
                          "bbox":list(o.bbox) if o.bbox else None,"endpoints":getattr(o,"endpoints",None)
                      } for o in bundle.observations],
                      "bindings":[{
                          "observation_id":b.observation_id,"status":b.status,
                          "reason_codes":getattr(b,"reason_codes",None)
                      } for b in bundle.bindings],
                      "chains":chains,
                      "focus_predictions":focus,
                      "extraction_status":ex.extraction_status,
                  })
              print("LAMU_TOILET_FOOTPRINT_POST_763="+json.dumps(out,sort_keys=True,default=str),flush=True)
          finally:
              doc.close()
          PY
