name: Item35 Conflict Real-Source Diagnostic (TEST-ONLY, do not merge)

# Runs the semantic-conflict diagnostic (PR under test) on SHA-256-verified real
# public tender sources. Diagnostic only: no production import, no scoring, no
# benchmark gold / expected values / tolerances / mappings are read. Runs only
# for the throwaway branch below and must never be merged.

on:
  pull_request:
    branches: [main]

concurrency:
  group: item35-conflict-real-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    if: github.head_ref == 'claude/item35-conflict-real-source-diag'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: kstvet
            url: 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'
            sha256: '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc'
          - label: ghazi
            url: 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf'
            sha256: 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f'
          - label: lamu
            url: 'https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf'
            sha256: 'fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2'
          - label: murera
            url: 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf'
            sha256: '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b'
          - label: umma
            url: 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf'
            sha256: 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af'
          - label: mbagha
            url: 'https://tenders.go.ke/storage/Documents/1767789921937-drawings-construction-of-a-maternity-block-at-mbagha-dispensary-in-mwatate-sub-county.pdf'
            sha256: 'b535961ae5aa549c6d532ad5afb2e93133dca1fa7c232e86e0eb2090f7852220'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-256 verify pinned source
        id: dl
        run: |
          set +e
          curl -fL --retry 3 --retry-delay 2 --max-time 900 "${{ matrix.url }}" -o source.pdf
          rc=$?
          if [ $rc -eq 0 ] && echo "${{ matrix.sha256 }}  source.pdf" | sha256sum -c -; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            ls -l source.pdf
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "SOURCE_UNVERIFIED label=${{ matrix.label }} curl_rc=$rc actual_sha256=$(sha256sum source.pdf 2>/dev/null | cut -d' ' -f1)"
          fi

      - name: Run the semantic conflict diagnostic on the verified source
        if: steps.dl.outputs.verified == 'true'
        run: |
          PYTHONPATH=. python scripts/ci_semantic_conflict_real_source.py run source.pdf \
            --label "${{ matrix.label }}" --out out \
            --min-drawing-ops 50 --doc-timeout 3600 --page-timeout 900 --page-budget 2400

      - uses: actions/upload-artifact@v4
        if: steps.dl.outputs.verified == 'true'
        with:
          name: conflict-${{ matrix.label }}
          path: out/

  merge:
    if: always() && github.head_ref == 'claude/item35-conflict-real-source-diag'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: conflict-*
          path: conflicts

      - name: Aggregate with the official aggregator
        run: |
          PYTHONPATH=. python scripts/ci_semantic_conflict_real_source.py merge conflicts
