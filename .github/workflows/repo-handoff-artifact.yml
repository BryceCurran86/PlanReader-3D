name: Repo Handoff Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/repo-handoff-artifact.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4

      - name: Build repository handoff archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path(".")
          output = Path("/tmp/planreader-repo-handoff.zip")
          excluded = {".git", ".venv", "__pycache__", ".pytest_cache", ".ruff_cache"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  archive.write(path, path.as_posix())
          print(f"created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload repository handoff
        uses: actions/upload-artifact@v4
        with:
          name: planreader-repo-handoff
          path: /tmp/planreader-repo-handoff.zip
          if-no-files-found: error
          retention-days: 1
