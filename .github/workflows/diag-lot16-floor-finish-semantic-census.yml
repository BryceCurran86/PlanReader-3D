name: DIAG Lot16 Floor Finish Semantic Census

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Census authenticated floor-finish semantics
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_floor_finish_semantic_census.py | tee lot16-floor-finish-semantic-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-floor-finish-semantic-census
          path: lot16-floor-finish-semantic-census.json
          retention-days: 1
