name: DIAG GPTMAX Lot16 Swing Bundle Real Proof

on:
  pull_request:
    branches:
      - fix/gptmax-raster-swing-leaf-bundle-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace real Lot16 swing gates
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_raster_swing_gates.py | tee lot16-swing-bundle-real.json
      - name: Trace downstream host and area funnel
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_current_host_funnel.py | tee lot16-host-area-after-swing-bundle.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-swing-bundle-real-proof
          path: |
            lot16-swing-bundle-real.json
            lot16-host-area-after-swing-bundle.json
          retention-days: 2
