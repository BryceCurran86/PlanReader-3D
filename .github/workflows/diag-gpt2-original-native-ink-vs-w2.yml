name: DIAG GPT2 Original PDF Ink vs Surviving W2 Contested Face Edges

on:
  pull_request:
    paths:
      - tools/diag_gpt2_original_native_ink_vs_w2.py
      - tests/test_gpt2_original_native_ink_vs_w2.py
      - .github/workflows/diag-gpt2-original-native-ink-vs-w2.yml

permissions:
  contents: read

jobs:
  source-native-ink:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime ruff
      - name: Direct original PDF native ink and W2 lineage counterexamples
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gpt2_original_native_ink_vs_w2.py tests/test_gpt2_native_source_edge_span_census.py
          ruff check --select F821,F823 tools/diag_gpt2_original_native_ink_vs_w2.py tests/test_gpt2_original_native_ink_vs_w2.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
      - name: Exact immutable source W2 vs original raw PDF ink first gate
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          mkdir -p artifacts/gpt2-original-ink-versus-w2
          git rev-parse HEAD > artifacts/gpt2-original-ink-versus-w2/head.txt
          timeout 1800s python -u -m tools.diag_gpt2_source_owned_plan_face_first_failure \
            --pdf "$PDF" --sha "$SHA" --page 11 \
            --output artifacts/gpt2-original-ink-versus-w2/w4-original.json
          python -u -m tools.diag_gpt2_original_native_ink_vs_w2 \
            --pdf "$PDF" --sha "$SHA" \
            --source-report artifacts/gpt2-original-ink-versus-w2/w4-original.json \
            --output artifacts/gpt2-original-ink-versus-w2/original-native-ink.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/gpt2-original-ink-versus-w2/original-native-ink.json')
          report=json.loads(p.read_text())
          assert report['native_ink_independently_read_from_source_pdf'] is True
          assert report['source_sha256']=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert len(report['scopes']) == 1
          assert len(report['scopes'][0]['edges']) == 4
          assert report['new_commercial_quantities']==[]
          assert report['physical_wall_or_room_authority_granted'] is False
          assert report['frozen_benchmark_scored'] is False
          assert all(not x['source_room_boundary_closed'] for x in report['scopes'][0]['edges'])
          print('NATIVE_PDF_INK_CLASSES',[x['indexed_native_ink_status'] for x in report['scopes'][0]['edges']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-original-pdf-ink-versus-w2-lineage
          path: artifacts/gpt2-original-ink-versus-w2
          retention-days: 14
