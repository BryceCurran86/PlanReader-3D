name: TEST-ONLY KSTVET Disjoint Sibling After 1109

on:
  pull_request:
    branches:
      - 'fix/pdf-text-disjoint-sibling-clip-v1'

jobs:
  probe:
    if: github.head_ref == 'test-only/kstvet-disjoint-sibling-after-1109'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-256 verify KSTVET source
        run: |
          curl -fL --retry 3 --retry-delay 2 --max-time 900 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  kstvet.pdf' | sha256sum -c -

      - name: Validate generic clip state and fill-stroke shadow
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          import fitz

          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_pdf_text_fill_stroke_equivalence_shadow import resolve_fill_stroke_text_pair_shadow
          from pb_pdf_text_integrity_authority import TEXT_TRACE_AMBIGUOUS, _clip_model
          from pb_source_observation_authority import ObservationSelector
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_structural_member_authority import StructuralMemberSelector
          from pb_structural_member_definition_source_shadow import compile_structural_definition_source_shadow

          payload = Path("kstvet.pdf").read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"

          doc = fitz.open(stream=payload, filetype="pdf")
          page = doc.load_page(46)
          model = _clip_model(page)
          assert model is not None and model.consistent
          assert len(model.clips) == 92
          doc.close()

          producer = SourceVisibilityProducer(
              producer_method="kstvet-disjoint-sibling-after-1109",
              producer_version="1.0",
          )
          published = producer.ingest_native_pdf_bytes(
              document_id=f"kstvet-disjoint-sibling-after-1109:{digest[:16]}",
              source_bytes=payload,
              source_locator="sha256-verified-kstvet-source",
              page_ids=("47",),
          )
          authority = producer.text_integrity_authority()

          rows = []
          live_counts = Counter()
          shadow_counts = Counter()
          for observation_id in published.text_observation_ids:
              selector = ObservationSelector(
                  document_id=published.revision.document_id,
                  revision_id=published.revision.revision_id,
                  source_sha256=published.revision.source_sha256,
                  snapshot_id=published.snapshot.snapshot_id,
                  observation_id=observation_id,
              )
              live = authority.resolve_text(selector)
              receipt = live.receipt
              if receipt is None:
                  continue
              live_counts[live.status.value] += 1
              if TEXT_TRACE_AMBIGUOUS not in live.reason_codes:
                  continue
              shadow = resolve_fill_stroke_text_pair_shadow(
                  source_visibility_producer=producer,
                  selector=selector,
                  source_bytes=payload,
              )
              shadow_counts[shadow.status.value] += 1
              rows.append({
                  "raw_text": receipt.raw_text,
                  "live_status": live.status.value,
                  "live_reason_codes": list(live.reason_codes),
                  "shadow_status": shadow.status.value,
                  "shadow_reason_codes": list(shadow.reason_codes),
                  "sequence_numbers": list(shadow.sequence_numbers),
                  "pair_id": shadow.pair_id,
              })

          target_pair = [
              row for row in rows
              if row["sequence_numbers"] == [108, 109]
          ]
          print("TARGET_PAIR_108_109=" + json.dumps(target_pair, sort_keys=True))

          structural_selector = StructuralMemberSelector(
              document_id=published.revision.document_id,
              revision_id=published.revision.revision_id,
              source_sha256=published.revision.source_sha256,
              snapshot_id=published.snapshot.snapshot_id,
              decision_scope_id="source-page:47:unscoped",
              member_kind="structural_support",
          )
          definitions = compile_structural_definition_source_shadow(
              selector=structural_selector,
              source_visibility_producer=producer,
              page_ids=("47",),
          )

          report = {
              "diagnostic_only": True,
              "do_not_merge": True,
              "tested_production_head": "b8876eb2654a90d88c4f7c7781bffdcb88374f05",
              "source_sha256": digest,
              "clip_model_consistent": model.consistent,
              "clip_count": len(model.clips),
              "live_status_counts": dict(sorted(live_counts.items())),
              "shadow_status_counts": dict(sorted(shadow_counts.items())),
              "trace_ambiguous_count": len(rows),
              "resolved_pair_word_count": sum(r["shadow_status"] == "corroborated" for r in rows),
              "target_pair_108_109": target_pair,
              "structural_definition_shadow": {
                  "status": definitions.status.value,
                  "reason_codes": list(definitions.reason_codes),
                  "definition_count": len(definitions.definitions),
              },
          }
          Path("kstvet-disjoint-sibling-after-1109.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))

          assert target_pair, "expected source-owned fill/stroke pair 108/109"
          assert all(
              row["live_status"] == "abstained" for row in target_pair
          ), target_pair
          assert all(
              "text_trace_ambiguous" in row["live_reason_codes"]
              for row in target_pair
          ), target_pair
          assert all(
              "text_clip_state_unresolved" not in row["shadow_reason_codes"]
              for row in target_pair
          ), target_pair
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kstvet-disjoint-sibling-after-1109
          path: kstvet-disjoint-sibling-after-1109.json
          if-no-files-found: warn
