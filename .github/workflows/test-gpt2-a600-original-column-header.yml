name: TEST GPT2 Original A600 Width Height Column Authority

on:
  pull_request:
    paths:
      - pb_source_door_schedule_authority.py
      - tests/test_gpt2_a600_native_column_header_source_roles.py
      - .github/workflows/test-gpt2-a600-original-column-header.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source-numeric-column-synthetic-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Duplicate titles, headers and malformed column positions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gpt2_a600_native_column_header_source_roles.py -k 'not test_original_a600_two_printed_titles_and_exact_width_height_source_words'
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

# The original Maryborough PDF is SHA-pinned and held privately by the owner.
# This public workflow MUST NOT pretend that absent original bytes are a failed
# source algorithm or upload private PDFs to make hosted CI pass.
# The original-positive tests remain in tests/ and must run on the owner machine
# against the exact private SHA. Hosted synthetic/adversarial tests above stay
# mandatory and cannot mint room, opening, finish or customer quantities.
