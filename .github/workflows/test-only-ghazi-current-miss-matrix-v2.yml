name: TEST-ONLY Ghazi Current Miss Matrix

on:
  pull_request:
    branches: [main]

jobs:
  ghazi:
    if: startsWith(github.head_ref, 'diag/ghazi-current-miss-matrix-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Ghazi benchmark matrix
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          url="https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf"
          expected_sha="c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Ghazi-current-matrix/2.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/ghazi.pdf"); source.write_bytes(payload)

          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/ghazi-results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id="tenders_ke_ghazi_science_lab",
              pdf_path=source,
              auto_extract=True,
          )
          out={
              "source_sha256":actual,
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "exact":int(report.exact_matches),
              "within_5":int(report.within_5_percent),
              "gross":int(report.gross_mismatches),
              "missed":int(report.missed_items),
              "hallucinated":int(report.hallucinated_items),
              "items":{item.item_id:item.to_dict() for item in report.item_results},
          }
          print("GHAZI_CURRENT_MATRIX="+json.dumps(out,sort_keys=True),flush=True)

          extractor=GenericPlanReaderExtractor()
          predictions=extractor.extract_from_pdf(
              source,
              pages=[166],
              collect_item35_shadow=False,
          )
          focus={}
          for p in predictions:
              if p.tag in {
                  "floor_screed","substructure_bed_dpm","damp_proof_course",
                  "perimeter_walling","gable_walling","internal_plaster",
                  "internal_paint","ceiling_lining","D1","D2","W1",
                  "steel_casement_windows","structural_columns"
              }:
                  focus[p.tag]=p.to_dict()
          print("GHAZI_FOCUS="+json.dumps({
              "extraction_status":extractor.extraction_status,
              "focus_predictions":focus,
              "ceiling_lining_live":extractor.ceiling_lining_live,
          },sort_keys=True),flush=True)
          PY
