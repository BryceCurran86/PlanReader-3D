name: TEST-ONLY Lamu Door Evidence Current

on:
  pull_request:
    branches: [main]

jobs:
  lamu-door:
    if: startsWith(github.head_ref, 'diag/lamu-door-evidence-current')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect SHA-pinned Lamu door evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.request
          from pathlib import Path
          import fitz
          from pb_plan_door_swing_geometry import (
              extract_sole_plan_door_swing,
              page_is_floor_plan,
              iter_quarter_circle_cubics,
          )
          from pb_plan_raster_door_swings import (
              extract_exterior_plan_door_swings,
              extract_interior_plan_door_swings,
              exterior_double_leaf_swings_from_raster,
              _rgb_from_pixmap,
          )

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected_sha="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-door-evidence/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/lamu.pdf"); source.write_bytes(payload)
          doc=fitz.open(source)
          page=doc[40]
          text=page.get_text("text") or ""
          infos=page.get_image_info(xrefs=True)
          raster=[]
          for info in infos:
              entry={"xref":info.get("xref"),"width":info.get("width"),"height":info.get("height")}
              try:
                  pix=fitz.Pixmap(doc,info["xref"])
                  rgb=_rgb_from_pixmap(pix)
                  hits=exterior_double_leaf_swings_from_raster(rgb) if rgb is not None else []
                  entry["exterior_hits"]=[list(x) for x in hits]
              except Exception as exc:
                  entry["error"]=type(exc).__name__
              raster.append(entry)
          words=page.get_text("words") or []
          cubic_neighborhoods=[]
          cubics=iter_quarter_circle_cubics(page,41)
          for cubic in cubics:
              nearby=[
                  {"text":w[4],"bbox":[w[0],w[1],w[2],w[3]]}
                  for w in words
                  if abs(((w[0]+w[2])/2)-cubic.x) <= 70
                  and abs(((w[1]+w[3])/2)-cubic.y) <= 70
              ]
              cubic_neighborhoods.append({
                  "cubic":cubic.__dict__,
                  "nearby_words":nearby,
              })
          result={
              "source_sha256":actual,
              "page_is_floor_plan":page_is_floor_plan(text),
              "floor_plan_lines":[ln for ln in text.splitlines() if "plan" in ln.lower() or "door" in ln.lower()],
              "native_cubics":[x.__dict__ for x in cubics],
              "cubic_neighborhoods":cubic_neighborhoods,
              "sole":getattr(extract_sole_plan_door_swing(doc,[40]),"__dict__",None),
              "interior":getattr(extract_interior_plan_door_swings(doc,[40]),"__dict__",None),
              "exterior":getattr(extract_exterior_plan_door_swings(doc,[40]),"__dict__",None),
              "images":raster,
          }
          print("LAMU_DOOR_RESULT="+json.dumps(result,sort_keys=True),flush=True)
          PY
