name: TEST GPTMAX Opening Wall Face Motif Protection

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused wall/opening regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_physical_wall_candidate_drafting_motif_filter.py \
            tests/test_physical_wall_equivalence_candidate_eligibility.py \
            tests/test_opening_host_binding_equivalence_source_integration_v3.py \
            tests/test_raster_opening_live_enumeration.py
