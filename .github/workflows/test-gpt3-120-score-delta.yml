name: TEST GPT3 Frozen 120-Target Score Delta

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/gpt3_frozen_120_score_delta_guard.py"
      - "tests/test_gpt3_frozen_120_score_delta_guard.py"
      - ".github/workflows/test-gpt3-120-score-delta.yml"
  workflow_dispatch:

jobs:
  frozen-v2-postscore-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Exact 120-target delta and no-score-on-incomplete tests
        run: PYTHONPATH=. python -m pytest -q tests/test_gpt3_frozen_120_score_delta_guard.py
      - name: Frozen V2 and provider truth isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
