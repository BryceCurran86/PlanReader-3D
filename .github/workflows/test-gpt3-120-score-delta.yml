name: TEST GPT3 Frozen 120-Target Score Delta

on:
  # Source-neutral signed/body integrity and score-delta tests for EVERY
  # opened/updated PR head, including stacked branches. Actual fresh source
  # replays remain gated in the private owner-original repository.
  pull_request:
  workflow_dispatch:

jobs:
  frozen-v2-postscore-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Official postscore guard plus genuine signed/customer nonregression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_gpt3_frozen_120_score_delta_guard.py \
            tests/test_gpt3_signed_customer_delta_guard.py
      - name: Enforce archived original signed-eight SHA and run retention guard on this PR head
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=docs/engineering/lot16_original_signed_eight_row_20261015
          (cd "$ARCHIVE" && sha256sum --check SHA256SUMS)
          test "$(cat "$ARCHIVE/producer_head_sha.txt")" = \
            "4e5aedf085cf63f92dac0935132b1e1c1dbaa178"
          TMP="$RUNNER_TEMP/gpt3-signed-retention"
          mkdir -p "$TMP/before" "$TMP/candidate"
          for side in before candidate; do
            cp "$ARCHIVE/production/source_sealed_run.json" "$TMP/$side/seal.json"
            cp "$ARCHIVE/production/verified_customer_rows.json" "$TMP/$side/customer.json"
          done
          PYTHONPATH=. python tools/gpt3_frozen_120_score_delta_guard.py \
            --before-sealed-run "$TMP/before/seal.json" \
            --after-sealed-run "$TMP/candidate/seal.json" \
            --before-customer "$TMP/before/customer.json" \
            --after-customer "$TMP/candidate/customer.json" \
            --output "$TMP/retention.json"
          python - "$TMP/retention.json" <<'GUARD'
          import json, sys
          result=json.load(open(sys.argv[1], encoding="utf-8"))
          assert result["baseline_signed_quantity_count"]==8
          assert result["candidate_signed_quantity_count"]==8
          assert result["baseline_customer_quantity_count"]==8
          assert result["baseline_body_retention"] is True
          assert result["official_score_comparison_available"] is False
          assert result["original_source_producer_reexecuted_by_this_guard"] is False
          GUARD
          # This public check only proves the archived original is still intact.
          # A candidate's actual current-head source run must be checked against
          # these bodies on a private, SHA-authenticated original source runner.
      - name: Frozen V2 and provider truth isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
