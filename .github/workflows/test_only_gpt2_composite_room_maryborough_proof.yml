name: TEST ONLY GPT2 Composite Room Maryborough Proof

on:
  pull_request:
    branches: [ main ]

jobs:
  maryborough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Run exact Maryborough composite-room production claim
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-composite-room-maryborough-proof
          git rev-parse HEAD > artifacts/gpt2-composite-room-maryborough-proof/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-composite-room-maryborough-proof/source_sha256.txt
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee artifacts/gpt2-composite-room-maryborough-proof/result.json
          import json, time
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          started=time.perf_counter()
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          def norm(value):
              return " ".join(str(value or "").strip().upper().split())

          labelled=[
              {
                  "label": norm(room.room_label),
                  "canonical_room_id": room.canonical_room_id,
                  "physical_room_id": room.physical_room_id,
                  "source_room_face_record_id": room.source_room_face_record_id,
                  "decision_scope_id": room.decision_scope_id,
                  "area_page_pts2": room.area_page_pts2,
                  "reason_codes": list(room.room_label_reason_codes or ()),
              }
              for room in claim.canonical_rooms
              if norm(room.room_label)
          ]
          labels=sorted({row["label"] for row in labelled})
          firm=[
              {
                  "room_label":dict(q.metadata or {}).get("room_label"),
                  "value":q.value,
                  "unit":q.unit,
                  "authority":q.authority,
                  "status":q.status,
                  "quantity_id":q.quantity_id,
              }
              for q in claim.room_area_quantity_evidence
              if not q.abstained
          ]
          floor_rows=[
              {
                  "canonical_floor_id":floor.canonical_floor_id,
                  "room_entity_id":floor.room_entity_id,
                  "metric_area_m2":floor.metric_area_m2,
                  "metric_area_quantity_id":floor.metric_area_quantity_id,
                  "metric_area_authority":floor.metric_area_authority,
              }
              for floor in claim.canonical_floors
          ]
          targets=("FOOD PREP","COLD ROOM","FREEZER","DRY STORE","SALES","WASH UP","FOOD SERVICE","POS COUNTER","M-AMB","F-AMB","TRUCK DRIVER LOUNGE","PWD","AIRLOCK","LAUNDRY","OFFICE")
          rows={}
          for name in targets:
              target_rooms=[row for row in labelled if row["label"]==name]
              target_room_ids={row["canonical_room_id"] for row in target_rooms}
              rows[name]={
                  "label_present":name in labels,
                  "rooms":target_rooms,
                  "floors":[row for row in floor_rows if row["room_entity_id"] in target_room_ids],
                  "firm_areas":[row for row in firm if norm(row.get("room_label"))==name],
              }

          assert rows["POS COUNTER"]["label_present"], rows["POS COUNTER"]
          assert len(rows["POS COUNTER"]["floors"]) == 1, rows["POS COUNTER"]
          assert rows["FOOD SERVICE"]["label_present"], rows["FOOD SERVICE"]
          assert len(rows["FOOD SERVICE"]["floors"]) == 1, rows["FOOD SERVICE"]
          assert not rows["DRY STORE"]["label_present"], rows["DRY STORE"]
          assert not rows["WASH UP"]["label_present"], rows["WASH UP"]
          assert not rows["TRUCK DRIVER LOUNGE"]["label_present"], rows["TRUCK DRIVER LOUNGE"]
          assert rows["FOOD PREP"]["firm_areas"], rows["FOOD PREP"]
          assert rows["COLD ROOM"]["firm_areas"], rows["COLD ROOM"]

          print(json.dumps({
              "elapsed_seconds":time.perf_counter()-started,
              "status":getattr(claim.status,"value",str(claim.status)),
              "reason_codes":list(claim.reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "label_count":len(labels),
              "labels":labels,
              "firm_room_area_count":len(firm),
              "targets":rows,
          },indent=2,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-composite-room-maryborough-proof
          path: artifacts/gpt2-composite-room-maryborough-proof
          retention-days: 1
