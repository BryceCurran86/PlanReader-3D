name: TEST-ONLY Lamu Wall Fill Network

on:
  pull_request:
    branches: [main]

jobs:
  trace:
    if: startsWith(github.head_ref, 'diag/lamu-wall-fill-network')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.26.3
      - name: Trace page-41 wall fills
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, statistics, urllib.request
          from pathlib import Path
          import fitz
          from pb_wall_fill_internal_partition_evidence import _is_wall_like_fill
          from pb_wall_hatch_perimeter_correction import _floor_plan_viewport_bbox

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-wall-fill/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=r.read()
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit("sha mismatch")
          doc=fitz.open(stream=data,filetype="pdf")
          page=doc[40]
          drawings=page.get_drawings()
          bbox=_floor_plan_viewport_bbox(page)
          candidates=[d for d in drawings if _is_wall_like_fill(d,page.rect)]
          if bbox is not None:
              vx0,vy0,vx1,vy1=bbox
              scoped=[]
              for d in candidates:
                  x0,y0,x1,y1=d["rect"]
                  cx,cy=(x0+x1)/2,(y0+y1)/2
                  if vx0<=cx<=vx1 and vy0<=cy<=vy1:
                      scoped.append(d)
              if len(scoped)>=2:
                  candidates=scoped

          thicknesses=[min(d["rect"].width,d["rect"].height) for d in candidates]
          median=statistics.median(thicknesses) if thicknesses else None
          consistent=[
              t for t in thicknesses
              if median and abs(t-median)/median<=0.25
          ]
          wall_t=statistics.median(consistent) if consistent else None
          min_x=min(d["rect"].x0 for d in candidates)
          min_y=min(d["rect"].y0 for d in candidates)
          max_x=max(d["rect"].x1 for d in candidates)
          max_y=max(d["rect"].y1 for d in candidates)
          pixel_major=max(max_x-min_x,max_y-min_y)
          scale_pt_per_m=pixel_major/16.0
          margin=(wall_t or 0)*2.0

          rows=[]
          total=0.0
          internal=0.0
          perimeter=0.0
          for idx,d in enumerate(candidates):
              x0,y0,x1,y1=map(float,(d["rect"].x0,d["rect"].y0,d["rect"].x1,d["rect"].y1))
              w,h=x1-x0,y1-y0
              long=max(w,h)
              length_m=long/scale_pt_per_m
              if h>=w:
                  on_perim=(x0-min_x<=margin) or (max_x-x1<=margin)
              else:
                  on_perim=(y0-min_y<=margin) or (max_y-y1<=margin)
              total+=length_m
              if on_perim: perimeter+=length_m
              else: internal+=length_m
              rows.append({
                  "i":idx,
                  "rect":[round(x0,3),round(y0,3),round(x1,3),round(y1,3)],
                  "long_pt":round(long,3),
                  "length_m":round(length_m,3),
                  "on_perimeter":on_perim,
              })
          print("LAMU_WALL_FILL_NETWORK="+json.dumps({
              "viewport_bbox":list(bbox) if bbox else None,
              "candidate_count":len(candidates),
              "wall_thickness_pt":wall_t,
              "scale_pt_per_m":scale_pt_per_m,
              "total_long_axis_m":round(total,3),
              "perimeter_classified_m":round(perimeter,3),
              "internal_classified_m":round(internal,3),
              "rows":rows,
          },sort_keys=True),flush=True)
          doc.close()
          PY
