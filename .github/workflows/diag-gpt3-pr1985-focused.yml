name: DIAG GPT3 PR1985 Focused

on:
  push:
    branches:
      - diag/gpt3-pr1985-focused-v1

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Run prior failures and new customer proof
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_customer_wall_source_scope.py::test_typed_original_identity_and_quantity_reach_sqlite_and_ag09_then_rerun_once \
            tests/test_live_opening_count_quantity_publication.py::test_explicit_schedule_count_reaches_customer_runtime_row_even_without_wall_quantity \
            tests/test_live_opening_customer_projection.py::test_real_opening_seal_projects_one_complete_persisted_customer_row \
            tests/test_live_opening_frame_schedule_area.py::test_frame_schedule_area_reaches_customer_runtime_row_without_net_wall
