name: TEST-ONLY KSTVET Page54 Opening Marks

on:
  push:
    branches: [diag/kstvet-page54-opening-marks-current]

jobs:
  page54-marks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Download SHA-pinned KSTVET source
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          p=pathlib.Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-page54-marks/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              p.write_bytes(r.read())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print("SOURCE_SHA256="+got)
          if got != expected:
              raise SystemExit(f"source hash mismatch: {got}")
          PY

      - name: Extract page54 W/D marks and viewport ownership
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, fitz
          from pb_plan_opening_instance_marks import extract_marks_from_page
          from pb_viewport_segmentation import (
              segment_page_viewports,
              is_authoritative_derived_viewport,
              assign_bbox_to_viewport,
          )

          doc=fitz.open("/tmp/kstvet.pdf")
          try:
              page=doc[53]
              views=segment_page_viewports(page,page_number=54)
              floor=[
                  {
                      "view_id":v.view_id,
                      "label":v.label,
                      "status":v.status,
                      "boundary_source":v.boundary_source,
                      "bbox":list(v.bounding_box) if v.bounding_box else None,
                      "authoritative_derived":bool(is_authoritative_derived_viewport(v)),
                      "provenance":v.provenance,
                  }
                  for v in views if v.view_type=="floor_plan"
              ]
              marks=extract_marks_from_page(page,54)
              rows=[]
              for m in marks:
                  bbox=(m.x-1.0,m.y-1.0,m.x+1.0,m.y+1.0)
                  owner=assign_bbox_to_viewport(bbox,views,allow_derived=True)
                  rows.append({
                      "tag":m.tag,
                      "trade":m.trade,
                      "complete":m.complete,
                      "conf":round(float(m.conf),4),
                      "x":round(float(m.x),3),
                      "y":round(float(m.y),3),
                      "raw":m.raw,
                      "owner_view_id":getattr(owner,"view_id",None),
                      "owner_view_type":getattr(owner,"view_type",None),
                      "owner_label":getattr(owner,"label",None),
                      "owner_authoritative_derived":bool(is_authoritative_derived_viewport(owner)) if owner else False,
                  })
              print("KSTVET_PAGE54_OPENING_MARKS="+json.dumps({
                  "floor_viewports":floor,
                  "mark_count":len(rows),
                  "marks":rows,
              },sort_keys=True,default=str))
          finally:
              doc.close()
          PY
