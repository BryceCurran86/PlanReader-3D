name: TEST GPT2 A120 Semantic Schedule Frame Acceptance Shadow

on:
  pull_request:
    paths:
      - tools/diag_gpt2_semantic_frame_acceptance_shadow.py
      - tests/test_gpt2_semantic_frame_acceptance_shadow.py
      - .github/workflows/test-gpt2-a120-semantic-frame-acceptance.yml
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "tools/diag_gpt2_semantic_frame_acceptance_shadow.py"
      - "tests/test_gpt2_semantic_frame_acceptance_shadow.py"
      - ".github/workflows/test-gpt2-a120-semantic-frame-acceptance.yml"
  workflow_dispatch:

jobs:
  original-maryborough-a120-f07-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head source proof
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated native source diagnostic dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run original PDF and fail-closed source tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_semantic_frame_acceptance_shadow.py
          python -m tools.diag_gpt2_semantic_frame_acceptance_shadow --pdf "$PDF" --source-sha256 "$SHA" --page 9 --json /tmp/gpt2_a120_semantic_frame_acceptance.json
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

      - name: Preserve original first-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-a120-original-semantic-frame-acceptance
          path: /tmp/gpt2_a120_semantic_frame_acceptance.json
          if-no-files-found: warn
