name: TEST GPT2 Final Material RCP

on:
  push:
    branches:
      - gpt2/material-rcp-final-current-main
concurrency:
  group: test-gpt2-final-material-rcp-subset
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused authority tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_source_material_semantic_authority_v1.py \
            tests/test_cross_view_ceiling_finish_authority.py \
            tests/test_cross_view_ceiling_quantity_authority.py \
            tests/test_cross_view_room_area_authority_v1.py \
            tests/test_source_closed_project_handoff.py

  maryborough-material:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Prove real Maryborough FPB and GRID definitions
        shell: bash
        run: |
          set -o pipefail
          ROOT=artifacts/gpt2-final-material-rcp/maryborough
          mkdir -p "$ROOT"
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee "$ROOT/material-authority.json"
          import hashlib
          import json
          from pathlib import Path

          from pb_source_material_semantic_authority import (
              SourceMaterialDefinitionSelector,
              SourceMaterialSemanticProducer,
          )
          from pb_source_visibility_authority import SourceVisibilityProducer

          path = Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          payload = path.read_bytes()
          sha = hashlib.sha256(payload).hexdigest()
          expected_sha = "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          assert sha == expected_sha, (sha, expected_sha)

          source = SourceVisibilityProducer(
              producer_method="gpt2-final-real-material-proof",
              producer_version="1",
          )
          published = source.ingest_native_pdf_bytes(
              document_id="gpt2-final-real-material-proof",
              source_bytes=payload,
              source_locator="memory://maryborough.pdf",
              page_ids=("9", "16", "18"),
          )
          import pb_source_material_semantic_authority as material

          producer = SourceMaterialSemanticProducer.from_source_visibility_producer(source)
          words_by_page = material._trusted_words_by_page(source, published)
          cluster_debug = {}
          for page_id in ("9", "16", "18"):
              words = words_by_page.get(page_id, ())
              raw = material._raw_material_definition_candidates(words)

              grouped = {}
              for word in words:
                  grouped.setdefault(
                      (word.source_partition_id, int(word.block_no)), []
                  ).append(word)
              title_debug = []
              code_block_debug = []
              for (partition_id, block_no), block_words in sorted(grouped.items()):
                  ordered = tuple(sorted(
                      block_words,
                      key=lambda row: (
                          row.line_no, row.word_no, row.bbox[0], row.observation_id
                      ),
                  ))
                  rows = material._native_block_line_rows(ordered)
                  raw_text = " | ".join(row[0] for row in rows)
                  if material._is_material_schedule_title(" ".join(row[0] for row in rows)):
                      recovered = material._recover_native_material_block(
                          source=source,
                          published=published,
                          raster=producer._raster,
                          block_words=ordered,
                      )
                      title_debug.append({
                          "partition_id": partition_id,
                          "block_no": block_no,
                          "raw_text": raw_text,
                          "raw_words": [
                              {
                                  "text": word.text,
                                  "trusted": bool(word.trusted),
                                  "reasons": list(word.reason_codes),
                              }
                              for word in ordered
                          ],
                          "recovered_words": [
                              {
                                  "text": word.text,
                                  "trusted": bool(word.trusted),
                                  "reasons": list(word.reason_codes),
                              }
                              for word in recovered
                          ],
                      })
                  first_line = rows[0][0].strip().upper() if rows else ""
                  if first_line in {"FPB", "GRID", "WFPB"}:
                      recovered = material._recover_native_material_block(
                          source=source,
                          published=published,
                          raster=producer._raster,
                          block_words=ordered,
                      )
                      code_block_debug.append({
                          "partition_id": partition_id,
                          "block_no": block_no,
                          "raw_text": raw_text,
                          "candidate": material._material_definition_candidate(ordered),
                          "recovered_candidate": material._material_definition_candidate(recovered),
                          "recovered_words": [
                              {
                                  "text": word.text,
                                  "trusted": bool(word.trusted),
                                  "reasons": list(word.reason_codes),
                              }
                              for word in recovered
                          ],
                      })

              blocks, blocked = material._trusted_native_material_schedule_cluster_blocks(
                  source=source,
                  published=published,
                  raster=producer._raster,
                  words=words,
              )
              cluster_debug[page_id] = {
                  "raw_candidates": [
                      {
                          "partition_id": row[0],
                          "block_no": row[1],
                          "code": row[3],
                          "bbox": list(material._native_block_bbox(row[2])),
                          "raw_text": " | ".join(
                              line[0] for line in material._native_block_line_rows(row[2])
                          ),
                      }
                      for row in raw
                  ],
                  "trusted_cluster_blocks": [
                      {
                          "block_no": block.block_no,
                          "text": block.text,
                          "scope_id": block.scope_id,
                      }
                      for block in blocks
                  ],
                  "blocked_codes": list(blocked),
                  "title_debug": title_debug,
                  "code_block_debug": code_block_debug,
              }

          authority = producer.publish(published.revision.revision_id)

          results = {}
          for code in ("FPB", "GRID", "WFPB"):
              result = authority.resolve_definition(
                  SourceMaterialDefinitionSelector(
                      document_id=published.revision.document_id,
                      revision_id=published.revision.revision_id,
                      source_sha256=published.revision.source_sha256,
                      snapshot_id=published.snapshot.snapshot_id,
                      code=code,
                  )
              )
              record = result.record
              results[code] = {
                  "status": getattr(result.status, "value", str(result.status)),
                  "reason_codes": list(result.reason_codes or ()),
                  "record_id": None if record is None else record.record_id,
                  "description": None if record is None else record.description,
                  "semantic_finish": None if record is None else record.semantic_finish,
                  "source_page_ids": [] if record is None else list(record.source_page_ids),
                  "source_viewport_ids": [] if record is None else list(record.source_viewport_ids),
                  "source_definition_ids": [] if record is None else list(record.source_definition_ids),
              }

          out = {
              "source_sha256": sha,
              "decoded_pages": list(published.coverage.decoded_pages),
              "cluster_debug": cluster_debug,
              "definitions": results,
          }
          print(json.dumps(out, indent=2, sort_keys=True))

          assert results["FPB"]["status"] == "corroborated", results
          assert results["FPB"]["semantic_finish"] == "plasterboard", results
          assert results["GRID"]["status"] == "corroborated", results
          assert results["GRID"]["semantic_finish"] == "ceiling_grid", results
          assert results["FPB"]["source_definition_ids"], results
          assert results["GRID"]["source_definition_ids"], results
          assert set(results["FPB"]["source_page_ids"]) <= {"9", "16", "18"}, results
          assert set(results["GRID"]["source_page_ids"]) <= {"9", "16", "18"}, results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-final-material-rcp-maryborough
          path: artifacts/gpt2-final-material-rcp/maryborough
          retention-days: 3
