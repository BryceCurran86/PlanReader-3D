name: Maryborough 1220 handoff

on:
  pull_request:
    branches: [main]

jobs:
  package:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/maryborough-1220-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out = Path('/tmp/planreader-maryborough-1220.zip')
          excluded = {'.git', '.venv', '__pycache__', '.pytest_cache', '.ruff_cache'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in Path('.').rglob('*'):
                  if not p.is_file():
                      continue
                  if any(part in excluded for part in p.parts):
                      continue
                  zf.write(p, p.as_posix())
          print(out, out.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planreader-maryborough-1220
          path: /tmp/planreader-maryborough-1220.zip
          retention-days: 1
