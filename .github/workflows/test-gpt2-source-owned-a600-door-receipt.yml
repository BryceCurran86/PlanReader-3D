name: TEST GPT2 Source-Owned A600 Door Schedule Receipts

on:
  pull_request:
    paths:
      - pb_source_door_schedule_authority.py
      - tests/test_gpt2_source_owned_a600_door_schedule_receipt.py
      - .github/workflows/test-gpt2-source-owned-a600-door-receipt.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  synthetic-source-lineage-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify provenance and physical quantity abstentions without private PDFs
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gpt2_source_owned_a600_door_schedule_receipt.py -k 'not test_original_a600_full_producer_receipt_census_keeps_all_28_source_rows'
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py

# The original Maryborough PDF is SHA-pinned and held privately by the owner.
# This public workflow MUST NOT pretend that absent original bytes are a failed
# source algorithm or upload private PDFs to make hosted CI pass.
# The original-positive tests remain in tests/ and must run on the owner machine
# against the exact private SHA. Hosted synthetic/adversarial tests above stay
# mandatory and cannot mint room, opening, finish or customer quantities.
