name: GPT MAX Original Foreground Flank Stage Replay
on:
  pull_request:
    paths:
      - scripts/gptmax_full_foreground_flank_stages.py
      - tests/test_gptmax_full_foreground_flank_stages.py
      - docs/engineering/gptmax_full_foreground_flank_stages.md
      - .github/workflows/test-gptmax-full-foreground-flank-stages.yml
concurrency:
  group: gptmax-foreground-flank-stages-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Fresh source, losses, collisions and authority boundaries
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_full_foreground_flank_stages.py tests/test_gptmax_full_foreground_run_source.py tests/test_gptmax_full_foreground_flank.py
          python -m compileall -q scripts/gptmax_full_foreground_flank_stages.py
          ruff check --select F821,F823 scripts/gptmax_full_foreground_flank_stages.py tests/test_gptmax_full_foreground_flank_stages.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
  original-lot16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Exact source inputs and observed default production ancestry
        run: |
          git rev-parse HEAD > exact-head.txt
          echo "10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844  documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" | sha256sum --check --status
          PYTHONPATH=. python -u tools/diag_gptmax_raster_host_source_membership.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output original-ancestry.json
          PYTHONPATH=. python tools/diag_gptmax_required_flank_source.py \
            --source-report original-ancestry.json \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output required-flanks.json
          PYTHONPATH=. python -u tools/diag_gptmax_full_foreground_run_source.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --expected-render-sha 64e58ab817b1b89d3c83e0e04a972f5e4e48fa3816d346af9cc809b9b56357ab \
            --trace-w2-w4 --output original-foreground-graph.json
      - name: Independently reproduce original G17, pixels and whole source graph before local join
        run: |
          PYTHONPATH=. python -u scripts/gptmax_full_foreground_flank_stages.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --original-source-report original-ancestry.json \
            --required-flank-report required-flanks.json \
            --foreground-source-report original-foreground-graph.json \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output original-flank-stages.json
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('original-ancestry.json').read_bytes())
          result=json.loads(Path('original-flank-stages.json').read_bytes())
          assert (original['source_original_opening_count'],original['source_original_host_count'],original['source_original_frame_count'])==(23,14,9)
          assert result['original_source_and_topology_freshly_reproduced'] is True
          assert result['input_source_primitive_count']<=result['source_primitive_safety_cap']==20000
          assert len(result['opening_rows'])==7
          assert all(len(r['flanks'])==2 for r in result['opening_rows'])
          assert all(f['source_run_rows'] for r in result['opening_rows'] for f in r['flanks'])
          for flag in ('full_page_graph_has_authenticated_floor_plan_scope','structural_source_universe_complete','physical_equivalence_proven','host_publication_allowed','opening_count_publication_allowed','metric_quantity_publication_allowed'):
              assert result[flag] is False
          assert result['benchmark_accuracy'] is None
          for r in result['opening_rows']:
              for f in r['flanks']:
                  for p in f['source_run_rows']:
                      assert p['source_pixel_receipt_freshly_reauthenticated']
                      assert not p['host_publication_allowed']
                      assert p['first_unproved_authority']=='ORIGINAL_VISIBLE_STRUCTURAL_WALL_LINE'
                      assert all(not e['source_parent_transfer_allowed'] and not e['physical_host_authority'] for e in p['actual_w2_edge_rows'])
          print({'all_original_source_and_graph_records_replayed':True,'seven_missing_openings':7,'host_authority':False})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-foreground-flank-stages
          retention-days: 30
          path: |
            exact-head.txt
            original-ancestry.json
            required-flanks.json
            original-foreground-graph.json
            original-flank-stages.json
