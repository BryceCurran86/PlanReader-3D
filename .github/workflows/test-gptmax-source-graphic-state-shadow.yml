name: GPT MAX Original Source Graphic State Shadow
on:
  pull_request:
    paths:
      - scripts/gptmax_source_graphic_state_shadow.py
      - tests/test_gptmax_source_graphic_state_shadow.py
      - docs/engineering/gptmax_source_graphic_state_shadow.md
      - .github/workflows/test-gptmax-source-graphic-state-shadow.yml
concurrency:
  group: gptmax-graphic-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_source_graphic_state_shadow.py tests/test_physical_wall_source_metadata_shadow.py tests/test_wall_topology_primitive_lineage.py
          ruff check --select F821,F823 scripts/gptmax_source_graphic_state_shadow.py tests/test_gptmax_source_graphic_state_shadow.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Reauthenticate actual source paint and unchanged production
        run: |
          PYTHONPATH=. python -u scripts/gptmax_source_graphic_state_shadow.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output original-source-graphic-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('original-source-graphic-state.json').read_bytes())
          assert r['original_source_reauthenticated'] is True
          assert r['default_production_state_unchanged'] is True
          assert r['original_production_summary']=={'physical_existence_claims':21,'host_bindings':14,'host_frames':9}
          assert r['full_source_input_count']==10099<=r['source_primitive_safety_cap']==20000
          assert r['ordinary_source_graphic_record_count']==4083
          assert r['graphic_state_controls_topology_filtering'] is False
          for key in ('structural_wall_role_proven','physical_wall_authority','physical_equivalence_proven',
                      'host_publication_allowed','opening_count_publication_allowed','metric_quantity_publication_allowed'):
              assert r[key] is False
          assert r['benchmark_accuracy'] is None
          graph=r['source_graph']; edges={x['edge_id']:x for x in graph['all_w2_edges']}
          rows=r['graphic_state_rows']
          assert len({x['edge_id'] for x in rows})==len(rows)==len(edges)
          assert any(x['missing_graphic_state_source_ids'] for x in rows)
          assert any(x['matched_graphic_state_source_ids'] for x in rows)
          unknown=[x for x in rows if not x['source_observation_ids']]
          assert len(unknown)==10
          assert all(x['status']=='abstained' and x['all_fragment_parents_have_graphic_state'] is False
                     and x['source_parent_ownership_available'] is False for x in unknown)
          for row in rows:
              assert row['w2_fragment_geometry_pt']==edges[row['edge_id']]['w2_fragment_geometry_pt']
              assert row['source_observation_ids']==edges[row['edge_id']]['source_observation_ids']
              assert not set(row['matched_graphic_state_source_ids'])&set(row['missing_graphic_state_source_ids'])
              assert set(row['matched_graphic_state_source_ids'])|set(row['missing_graphic_state_source_ids'])==set(row['source_observation_ids'])
              assert row['structural_wall_role_proven'] is False and row['host_publication_allowed'] is False
              assert row['graphic_state_authentication_from_join_alone'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-source-graphic-state
          retention-days: 30
          path: original-source-graphic-state.json
