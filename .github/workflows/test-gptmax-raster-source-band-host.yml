name: TEST GPTMAX Raster Source Band Host
on:
  pull_request:
    branches: [main]
    paths:
      - pb_opening_host_binding_authority.py
      - pb_opening_dimension_authority.py
      - pb_opening_host_frame_authority.py
      - pb_source_visibility_authority.py
      - pb_physical_opening_authority.py
      - pb_native_dimension_cap_evidence.py
      - pb_source_observation_authority.py
      - pb_raster_visible_segment_detector.py
      - tests/test_raster_native_text_overlay_roles.py
      - tests/test_native_dimension_cap_evidence.py
      - tests/test_raster_connected_host_frame.py
      - tests/test_raster_opening_dimension_source_namespace.py
      - tests/test_raster_opening_source_band_host.py
      - tools/diag_gptmax_lot16_current_host_funnel.py
      - .github/workflows/test-gptmax-raster-source-band-host.yml
concurrency:
  group: gptmax-source-band-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    if: github.head_ref == 'fix/gptmax-raster-swing-host-source-proof-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused regressions
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_raster_opening_source_band_host.py
          tests/test_raster_opening_dimension_source_namespace.py
          tests/test_raster_connected_host_frame.py
          tests/test_native_dimension_cap_evidence.py
          tests/test_physical_opening_viewport_scope_live_gate.py
          tests/test_semantic_conflict_diagnostic_v1.py
          tests/test_raster_native_text_overlay_roles.py
          tests/test_raster_opening_source_primitives.py
          tests/test_raster_source_visibility_v1.py
          tests/test_source_observation_render_clip_v1.py
          tests/test_g17_visible_opening_existence_v1.py
          tests/test_physical_opening_candidate_structure_v1.py
          tests/test_source_opening_universe_evidence_v1.py
          tests/test_opening_universe_completeness_source_adapter_v1.py
          tests/test_opening_universe_page_scope_coverage_v1.py
          tests/test_opening_host_frame_authority.py
          tests/test_opening_dimension_production_v1.py
          tests/test_raster_opening_source_primitive_host.py
          tests/test_raster_opening_split_centerline_host.py
          tests/test_raster_opening_whole_wall_host.py
          tests/test_raster_opening_host_geometry_contract.py
          tests/test_raster_opening_label_ownership.py
          tests/test_raster_opening_whole_wall_frame.py
          tests/test_raster_door_swing_g17_contract.py
          tests/test_opening_host_binding_cross_role_same_v3.py
          tests/test_opening_host_binding_review_hardening_v3.py
          tests/test_opening_host_binding_remote_ambiguity_regression_v3.py
      - name: Real SHA-pinned Lot16 proof and sealed areas
        run: PYTHONPATH=. python -u tools/diag_gptmax_lot16_current_host_funnel.py > lot16-source-band-proof.json
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-source-band-host-proof
          path: |
            lot16-source-band-proof.json
            lot16-openings-sealed.json
          retention-days: 7
