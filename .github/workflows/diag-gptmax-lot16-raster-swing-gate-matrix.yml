name: DIAG GPTMAX Lot16 Raster Swing Gate Matrix

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace raster swing gates
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_raster_swing_gate_matrix.py | tee lot16-raster-swing-gate-matrix.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-raster-swing-gate-matrix
          path: lot16-raster-swing-gate-matrix.json
          retention-days: 2
