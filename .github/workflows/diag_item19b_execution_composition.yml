name: Item19B Execution Composition Probe

on:
  push:
    branches: [diag/item19b-execution-composition]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Probe execution components
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_wall_finish_callout_wall_authority import _source_annotation_blocks

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(producer_method="item19b-execution-probe",producer_version="1")
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-exec",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          blocks=_source_annotation_blocks(source,pub,"54")
          print("EXEC_COMPONENT_COUNT",len(blocks))
          rows=[]
          for block_id,obs,seqs,bbox,height in blocks:
              if seqs and not (max(seqs)<10050 or min(seqs)>10090):
                  rows.append({
                      "block_id":block_id,
                      "seqs":list(seqs),
                      "obs_count":len(obs),
                      "bbox":[round(v,3) for v in bbox],
                      "height":round(height,3),
                  })
          print("EXEC_COMPONENTS_NEAR_ITEM19B "+json.dumps(rows,sort_keys=True))
          external=[r for r in rows if set(range(10061,10066)) & set(r["seqs"])]
          internal=[r for r in rows if set(range(10070,10079)) & set(r["seqs"])]
          print("EXTERNAL_COMPONENTS",json.dumps(external,sort_keys=True))
          print("INTERNAL_COMPONENTS",json.dumps(internal,sort_keys=True))
          PY
