name: Item19B #935 Fast Target Role

on:
  push:
    branches: [diag/item19b-935-fast-target-role]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Probe exact Item19B internal source wall role
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateProducer
          from pb_wall_component_completeness_authority import (
              WallComponentCompletenessProducer,
              WallComponentCompletenessSelector,
          )
          from pb_wall_role_authority import WallRoleProducer, WallRoleSelector

          TARGET={"d4763i0","d4772i0","d5179i1","d5179i3","d5214i0","d5215i0"}

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(producer_method="diag-935-fast-role",producer_version="1")
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-diag-935-fast-role",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          walls=PhysicalWallCandidateProducer.from_authenticated_viewports(source,page_ids=("54",)).authority()
          cp=WallComponentCompletenessProducer.from_authorities(
              source_visibility_producer=source,
              physical_wall_candidate_authority=walls,
          )
          ca=cp.authority()
          roles=WallRoleProducer.from_source_topology(
              physical_wall_candidate_authority=walls,
              wall_component_completeness_authority=ca,
          )

          rows=[]
          for scope in walls._scopes.values():
              if str(scope.viewport_view_type or "")!="floor_plan":
                  continue
              for rec in scope.records:
                  raw=set(rec.physical_identity.source_primitive_ids)
                  if not (raw & TARGET):
                      continue
                  comp=ca.resolve(WallComponentCompletenessSelector(
                      document_id=scope.document_id,
                      revision_id=scope.revision_id,
                      source_sha256=scope.source_sha256,
                      snapshot_id=scope.snapshot_id,
                      page_id=scope.page_id,
                      decision_scope_id=scope.decision_scope_id,
                      physical_wall_id=rec.wall_candidate_id,
                  ))
                  role=roles.publish(WallRoleSelector(
                      document_id=scope.document_id,
                      revision_id=scope.revision_id,
                      source_sha256=scope.source_sha256,
                      snapshot_id=scope.snapshot_id,
                      page_id=scope.page_id,
                      decision_scope_id=scope.decision_scope_id,
                      physical_wall_id=rec.wall_candidate_id,
                  ))
                  rows.append({
                      "viewport":scope.viewport_id,
                      "wall":rec.wall_candidate_id,
                      "raw":sorted(raw & TARGET),
                      "group":[
                          list(g) for g in (scope.equivalence.equivalence_groups if scope.equivalence else ())
                          if rec.wall_candidate_id in g
                      ],
                      "component_status":comp.status.value,
                      "component_reasons":list(comp.reason_codes),
                      "component":comp.record.component_id if comp.record else None,
                      "component_members":list(comp.record.member_wall_ids) if comp.record else [],
                      "role_status":role.status.value,
                      "role":role.record.role.value if role.record else None,
                      "role_reasons":list(role.reason_codes),
                  })
          print("FAST_935_TARGET_ROLE "+json.dumps(rows,sort_keys=True))
          PY
