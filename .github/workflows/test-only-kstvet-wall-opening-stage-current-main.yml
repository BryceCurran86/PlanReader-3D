name: TEST-ONLY KSTVET Wall Opening Stage Current Main

on:
  pull_request:
    branches: [main]

jobs:
  wall-opening-stage:
    if: startsWith(github.head_ref, 'diag/kstvet-wall-opening-stage-current-main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe source-owned wall/opening authority only
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from dataclasses import asdict,is_dataclass
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-wall-opening-stage/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(actual)

          def serial(v):
              if is_dataclass(v): return asdict(v)
              if isinstance(v,dict): return {str(k):serial(x) for k,x in v.items()}
              if isinstance(v,(list,tuple)): return [serial(x) for x in v]
              return v

          source=SourceVisibilityProducer(
              producer_method="kstvet_wall_opening_stage_diag",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="kstvet-wall-opening-stage",
              source_bytes=payload,
              source_locator=url,
          )
          comp=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("54",),
          )
          out={
              "production_sha":"e430fde9f8e0b6a47a6be2d02d7dafee397dcd8f",
              "source_sha256":actual,
              "status":comp.status,
              "reason_codes":comp.reason_codes,
              "semantic_enumeration_result":comp.semantic_enumeration_result,
              "opening_universe_result":comp.opening_universe_result,
              "opening_universe_results":comp.opening_universe_results,
              "wall_scopes":comp.wall_scopes,
              "opening_bindings":comp.opening_bindings,
              "host_frames":comp.host_frames,
              "binding_selector_ids":list(comp.binding_selectors.keys()),
              "host_frame_selector_ids":list(comp.host_frame_selectors.keys()),
          }
          print("KSTVET_WALL_OPENING_STAGE="+json.dumps(serial(out),sort_keys=True,default=str),flush=True)
          PY
