name: TEST-ONLY Murera Raster Floor Dimensions V1

on:
  pull_request:
    branches: [main]

jobs:
  raster-floor-dimensions:
    if: startsWith(github.head_ref, 'diag/murera-raster-floor-dimensions-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.28.0 Pillow==12.3.0 numpy==2.3.5 rapidocr onnxruntime

      - name: Probe Murera raster plan dimensions with production RapidOCR backend
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          import fitz
          from PIL import Image

          from pb_portable_raster_ocr_authority import RapidOCRBackend

          URL = "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          WANT_SHA = "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          OUT = Path("/tmp/murera-raster-floor-dimensions")
          OUT.mkdir(parents=True, exist_ok=True)
          PDF = OUT / "murera.pdf"

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "PlanReader-Murera-raster-floor-dimensions-v1/1.0"},
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              PDF.write_bytes(r.read())
          got = hashlib.sha256(PDF.read_bytes()).hexdigest()
          if got != WANT_SHA:
              raise SystemExit(f"source sha mismatch: {got}")

          backend = RapidOCRBackend()
          if not backend.is_available():
              raise SystemExit("RapidOCR backend unavailable after explicit install")

          dimensionish = re.compile(
              r"(?ix)"
              r"(?:^|\b)"
              r"(?:\d{2,5}(?:[.,]\d{1,3})?|\d{1,2}[,.]\d{3})"
              r"\s*(?:mm|m|m2|m²)?(?:\b|$)"
          )
          keywordish = re.compile(
              r"(?i)laboratory|prep(?:aration)?\s*room|store|verand(?:a|ah)|"
              r"screed|floor|wall\s*support|concrete\s*gradient|foundation|d\.p\.c"
          )

          doc = fitz.open(PDF)
          report = {
              "source_sha256": got,
              "backend": backend.name,
              "backend_version": backend.version,
              "pages": [],
          }

          for page_no in (228, 230):
              page = doc[page_no - 1]
              rect = page.rect
              dpi = 300
              scale = dpi / 72.0
              pix = page.get_pixmap(matrix=fitz.Matrix(scale, scale), alpha=False)
              full_path = OUT / f"page-{page_no}-{dpi}dpi.png"
              pix.save(full_path)

              image = Image.open(full_path).convert("RGB")

              # Exclude the right-hand title block but retain the complete plan,
              # outer dimension strings and the bottom GENERAL LABORATORY FLOOR PLAN title.
              crop_pt = (
                  float(rect.x0),
                  float(rect.y0),
                  float(rect.x0 + rect.width * 0.90),
                  float(rect.y0 + rect.height * 0.97),
              )
              crop_px = tuple(int(round(v * scale)) for v in crop_pt)
              plan = image.crop(crop_px)
              plan_path = OUT / f"page-{page_no}-plan-crop-{dpi}dpi.png"
              plan.save(plan_path)

              native_words = [
                  {
                      "bbox": [round(float(w[0]), 3), round(float(w[1]), 3), round(float(w[2]), 3), round(float(w[3]), 3)],
                      "text": str(w[4]),
                  }
                  for w in page.get_text("words")
              ]

              orientations = []
              for orientation, source in (
                  ("normal", plan),
                  ("rot90_clockwise", plan.rotate(-90, expand=True)),
              ):
                  ocr_lines = backend.extract_lines(source, dpi=dpi)
                  selected = []
                  all_rows = []
                  for line in ocr_lines:
                      row = {
                          "text": line.text,
                          "confidence": line.confidence,
                          "bbox_px": [round(float(v), 2) for v in line.bbox_px],
                          "bbox_pt_relative_to_crop": (
                              [round(float(v), 3) for v in line.bbox_pt]
                              if line.bbox_pt is not None
                              else None
                          ),
                      }
                      all_rows.append(row)
                      if dimensionish.search(line.text) or keywordish.search(line.text):
                          selected.append(row)

                  orientations.append(
                      {
                          "orientation": orientation,
                          "ocr_line_count": len(all_rows),
                          "selected_lines": selected,
                          "all_lines": all_rows,
                      }
                  )

              page_report = {
                  "page_no": page_no,
                  "page_rect_pt": [float(rect.x0), float(rect.y0), float(rect.x1), float(rect.y1)],
                  "image_count": len(page.get_images(full=True)),
                  "drawing_count": len(page.get_drawings()),
                  "native_text": page.get_text("text") or "",
                  "native_words": native_words,
                  "crop_pt": list(crop_pt),
                  "orientations": orientations,
              }
              report["pages"].append(page_report)

              print(f"=== MURERA PAGE {page_no} ===", flush=True)
              print(
                  json.dumps(
                      {
                          "image_count": page_report["image_count"],
                          "drawing_count": page_report["drawing_count"],
                          "native_text_chars": len(page_report["native_text"]),
                          "normal_selected": orientations[0]["selected_lines"],
                          "rot90_selected": orientations[1]["selected_lines"],
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )

          doc.close()
          report_path = OUT / "murera-raster-floor-dimensions.json"
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print("REPORT_PATH=" + str(report_path), flush=True)
          PY

      - name: Upload diagnostic report and renders
        uses: actions/upload-artifact@v4
        with:
          name: murera-raster-floor-dimensions-v1
          path: |
            /tmp/murera-raster-floor-dimensions/*.json
            /tmp/murera-raster-floor-dimensions/*plan-crop*.png
          if-no-files-found: error
