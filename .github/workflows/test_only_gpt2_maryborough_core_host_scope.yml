name: TEST ONLY GPT2 Maryborough Core Host Scope Proof

on:
  pull_request:
    branches: [ main ]
    paths:
      - "pb_*opening*.py"
      - "pb_*wall*.py"
      - "pb_live_physical_net_wall_integration.py"
      - "pb_live_wall_opening_authority_composition.py"
      - "pb_source_visibility_authority.py"
      - "tools/run_source_closed_project_handoff.py"
      - ".github/workflows/test_only_gpt2_maryborough_core_host_scope.yml"

concurrency:
  group: gpt2-maryborough-core-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maryborough-core:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run isolated Maryborough core handoff
        run: |
          set -o pipefail
          OUT=artifacts/gpt2-maryborough-core-host-scope
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/head_sha.txt"
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > "$OUT/source_sha256.txt"
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id au_qld_maryborough_service_station \
            --family-group core \
            --workspace-id 1 \
            --output-dir "$OUT/run"
          cat "$OUT/run/production_summary.json"
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path("artifacts/gpt2-maryborough-core-host-scope/run")
          summary=json.loads((root/"production_summary.json").read_text())
          print(json.dumps({
              "claim_status":summary.get("claim_status"),
              "claim_reason_codes":summary.get("claim_reason_codes",[]),
              "canonical_counts":summary.get("canonical_counts",{}),
              "family_counts":summary.get("family_counts",{}),
              "family_run_files":summary.get("family_run_files",{}),
              "combined_run_file":summary.get("combined_run_file"),
          },indent=2,sort_keys=True))
          # Also inspect the sealed wall/opening composition per physical
          # opening. Aggregate claim reasons intentionally preserve every
          # unresolved opening and cannot show whether a local-host change
          # improved any individual object.
          from pathlib import Path as _Path
          from pb_live_wall_opening_authority_composition import (
              compose_live_wall_opening_authority,
          )
          from pb_source_visibility_authority import SourceVisibilityProducer

          source_path=_Path(
              "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf"
          )
          source=SourceVisibilityProducer(
              producer_method="diag-gpt2-maryborough-host-per-opening",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="diag-gpt2-maryborough-host-per-opening",
              source_bytes=source_path.read_bytes(),
              source_locator="memory://maryborough.pdf",
              page_ids=("7","30","31"),
          )
          composition=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("7","30","31"),
          )
          def status(value):
              return getattr(value,"value",str(value))
          binding_rows=[
              {
                  "opening_identity_id":trace.opening_identity_id,
                  "representative_observation_id":
                      trace.representative_observation_id,
                  "page_id":trace.page_id,
                  "status":status(trace.status),
                  "reason_codes":list(trace.reason_codes),
                  "record_id":trace.record_id,
                  "host_wall_id":trace.host_wall_id,
                  "member_wall_candidate_ids":
                      list(trace.member_wall_candidate_ids),
              }
              for trace in composition.opening_bindings
          ]
          frame_rows=[
              {
                  "opening_identity_id":trace.opening_identity_id,
                  "status":status(trace.status),
                  "reason_codes":list(trace.reason_codes),
                  "record_id":trace.record_id,
                  "host_wall_id":trace.host_wall_id,
                  "whole_wall_candidate_ids":
                      list(trace.whole_wall_candidate_ids),
              }
              for trace in composition.host_frames
          ]
          from collections import Counter as _Counter
          print(json.dumps({
              "per_opening_composition_status":status(composition.status),
              "per_opening_composition_reasons":
                  list(composition.reason_codes),
              "binding_count":len(binding_rows),
              "binding_resolved_count":
                  sum(1 for row in binding_rows if row["record_id"]),
              "binding_reason_counts":dict(sorted(_Counter(
                  reason
                  for row in binding_rows
                  for reason in row["reason_codes"]
              ).items())),
              "bindings":binding_rows,
              "frame_count":len(frame_rows),
              "frame_resolved_count":
                  sum(1 for row in frame_rows if row["record_id"]),
              "frame_reason_counts":dict(sorted(_Counter(
                  reason
                  for row in frame_rows
                  for reason in row["reason_codes"]
              ).items())),
              "frames":frame_rows,
          },indent=2,sort_keys=True))

          for family in ("opening_area","opening_count"):
              path=root/"family_runs"/f"{family}.sealed.json"
              if not path.exists():
                  print(json.dumps({"family":family,"sealed":False},sort_keys=True))
                  continue
              data=json.loads(path.read_text())
              quantities=data.get("quantities") or data.get("quantity_evidence") or []
              ids=[]
              lineage=[]
              for row in quantities:
                  if not isinstance(row,dict): continue
                  ids.append(str(row.get("quantity_id") or row.get("id") or ""))
                  lineage.append(tuple(row.get("input_entity_ids") or row.get("source_entity_ids") or ()))
              duplicates=[k for k,v in Counter(ids).items() if k and v>1]
              lineage_dupes=[list(k) for k,v in Counter(lineage).items() if k and v>1 and k]
              print(json.dumps({
                  "family":family,
                  "sealed":True,
                  "quantity_count":len(quantities),
                  "duplicate_quantity_ids":duplicates,
                  "duplicate_lineage_keys":lineage_dupes,
              },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-core-host-scope
          path: artifacts/gpt2-maryborough-core-host-scope
          retention-days: 1
