name: TEST GPT2 A120 Original Opposed Wall-ink Source

on:
  pull_request:
    paths:
      - tools/diag_native_opposed_source_wall_ink_shadow.py
      - tests/test_gpt2_a120_opposed_source_wall_ink.py
      - .github/workflows/test-gpt2-a120-native-opposed-wall-ink.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  a120-original-source-no-synthetic-wall-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Genuine original p9 double-wall and gap counterexamples
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_a120_opposed_source_wall_ink.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
