name: GPT MAX Terminal Source Span Shadow
on:
  pull_request:
    paths:
      - tools/gptmax_terminal_source_span_shadow.py
      - tools/diag_gptmax_terminal_source_span_shadow.py
      - tests/test_gptmax_terminal_source_span_shadow.py
      - tests/test_gptmax_terminal_source_span_runtime.py
      - .github/workflows/test-gptmax-terminal-source-span-shadow.yml
jobs:
  source-shadow-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source-only terminal ownership and non-mutation regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_gptmax_terminal_source_span_shadow.py \
            tests/test_gptmax_terminal_source_span_runtime.py
      - name: Source isolation and frozen V2 integrity
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
