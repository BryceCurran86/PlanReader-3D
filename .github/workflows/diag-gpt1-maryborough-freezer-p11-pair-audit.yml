name: DIAG GPT1 Maryborough Freezer P11 Pair Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit page 11 room-area ownership
        run: |
          mkdir -p artifacts/freezer-p11
          PYTHONPATH=. python -u - <<'PY' | tee artifacts/freezer-p11/result.json
          import json
          from pathlib import Path
          import pb_cross_view_room_area_authority as cv
          from pb_live_canonical_room_composition import compose_live_canonical_rooms
          from pb_live_canonical_wall_composition import compose_live_canonical_walls
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_source_visibility_authority import SourceVisibilityProducer

          SOURCE=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          TARGETS=("FOOD PREP","COLD ROOM","FREEZER")
          def norm(v): return " ".join(str(v or "").strip().upper().split())
          source=SourceVisibilityProducer(producer_method="gpt1-freezer-p11-pair-audit",producer_version="1")
          published=source.ingest_native_pdf_bytes(
              document_id="gpt1-freezer-p11-pair-audit",
              source_bytes=SOURCE.read_bytes(),
              source_locator="memory://maryborough.pdf",
              page_ids=("7","11"),
          )
          wo=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("7",),
              evidence_page_ids=(),
          )
          cw=compose_live_canonical_walls(
              source_visibility_producer=source,
              wall_opening_composition=wo,
          )
          rooms=compose_live_canonical_rooms(
              source_visibility_producer=source,
              wall_opening_composition=wo,
              canonical_wall_ids_by_candidate=cw.candidate_to_canonical_wall_id,
              unresolved_wall_candidate_ids=cw.unresolved_wall_candidate_ids,
          )
          eligible=[
              room for room in rooms.rooms
              if room.geometry_complete
              and str(room.physical_room_id or "").strip()
              and str(room.source_room_face_record_id or "").strip()
              and norm(room.room_label)
              and str(room.room_label_binding_record_id or "").strip()
              and bool(room.room_label_evidence_ids)
          ]
          grouped={}
          for room in eligible: grouped.setdefault(norm(room.room_label),[]).append(room)
          unique={k:v[0] for k,v in grouped.items() if len(v)==1}
          lines=cv._trusted_lines_for_page(
              source,
              revision_id=published.revision.revision_id,
              page_id="11",
              candidate_labels=tuple(unique),
          )
          out={"unique_topology_labels":sorted(unique),"targets":{}}
          for target in TARGETS:
              room=unique.get(target)
              relevant=tuple(line for line in lines if norm(line.text)==target)
              dims=cv._trusted_native_dimensions_for_page(
                  source,
                  revision_id=published.revision.revision_id,
                  page_id="11",
                  candidate_lines=relevant,
              ) if relevant else ()
              hs=tuple(d for d in dims if d.orientation==cv.DimensionOrientation.HORIZONTAL.value)
              vs=tuple(d for d in dims if d.orientation==cv.DimensionOrientation.VERTICAL.value)
              primary=[]
              spatial=[]
              scaled=[]
              witness=[]
              for line in relevant:
                  for h in hs:
                      for v in vs:
                          if not cv._line_inside_dimension_pair(line,h,v): continue
                          spatial.append((line,h,v))
                          if not cv._figured_pair_scale_consistent(page_id="11",horizontal=h,vertical=v): continue
                          scaled.append((line,h,v))
                          if not cv._witness_systems_intersect(h,v): continue
                          witness.append((line,h,v))
                          primary.append((line,h,v))
              owned_h=[(line,d) for line in relevant for d in hs if cv._dimension_is_immediate_label_annotation(line,d)]
              owned_v=[(line,d) for line in relevant for d in vs if cv._dimension_is_immediate_label_annotation(line,d)]
              annotation=[]
              seen=set()
              for hl,h in owned_h:
                  for vl,v in owned_v:
                      if not cv._figured_pair_scale_consistent(page_id="11",horizontal=h,vertical=v): continue
                      key=(h.dimension_id,v.dimension_id)
                      if key in seen: continue
                      seen.add(key)
                      annotation.append((hl,vl,h,v))
              def pair(h,v):
                  return {
                      "h_id":h.dimension_id,"h_mm":h.value_mm,
                      "h_endpoints":h.endpoints_pt,
                      "v_id":v.dimension_id,"v_mm":v.value_mm,
                      "v_endpoints":v.endpoints_pt,
                      "area_m2":round(float(h.value_mm)*float(v.value_mm)/1_000_000,6),
                      "witness_intersects":cv._witness_systems_intersect(h,v),
                  }
              out["targets"][target]={
                  "topology_room_present":room is not None,
                  "physical_room_id":None if room is None else room.physical_room_id,
                  "source_room_face_record_id":None if room is None else room.source_room_face_record_id,
                  "label_lines":[{"text":x.text,"bbox":x.bbox,"block":x.block_no,"line":x.line_no} for x in relevant],
                  "dimension_count":len(dims),
                  "horizontal_count":len(hs),
                  "vertical_count":len(vs),
                  "spatial_count":len(spatial),
                  "scale_consistent_count":len(scaled),
                  "witness_count":len(witness),
                  "primary_pairs":[pair(h,v) for _,h,v in primary],
                  "annotation_h_count":len(owned_h),
                  "annotation_v_count":len(owned_v),
                  "annotation_count":len(annotation),
                  "annotation_pairs":[pair(h,v) for _,_,h,v in annotation],
                  "dimensions":[
                      {"id":d.dimension_id,"orientation":d.orientation,"value_mm":d.value_mm,
                       "endpoints":d.endpoints_pt,"text_block":d.text_block_no,
                       "text_line":d.text_line_no,"text_word":d.text_word_no,
                       "witness_ids":d.witness_observation_ids}
                      for d in dims
                  ],
              }
          result=cv.CrossViewRoomAreaProducer.from_source(source=source,rooms=rooms).publish()
          out["published_records"]=[
              {"label":r.room_label,"area":r.area_evidence.normalized_value,
               "page":r.source_dimension_page_id,
               "h":r.horizontal_dimension_id,"v":r.vertical_dimension_id}
              for r in result.records if norm(r.room_label) in TARGETS
          ]
          out["result_status"]=getattr(result.status,"value",str(result.status))
          out["reason_codes"]=list(result.reason_codes)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-freezer-p11-pair-audit
          path: artifacts/freezer-p11
          retention-days: 2
