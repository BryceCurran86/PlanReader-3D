name: TEST-ONLY KSTVET Hosted Fast After 806

on:
  pull_request:
    branches: [main]

jobs:
  hosted-fast:
    if: startsWith(github.head_ref, 'diag/kstvet-hosted-fast-after-806')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal dependency
        run: pip install PyMuPDF
      - name: Probe page 54
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          import fitz
          from pb_drawing_evidence_binding import DrawingViewType
          from pb_hosted_opening_geometry import resolve_hosted_opening_spans
          from pb_viewport_segmentation import (
              segment_page_viewports,
              is_authoritative_derived_viewport,
              ViewportSegmentationStatus,
          )

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          path=Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-hosted-fast-806/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              path.write_bytes(r.read())
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(actual)

          def sdict(s):
              return {
                  "orientation":s.host_orientation_deg,
                  "jamb_start":s.jamb_start,
                  "jamb_end":s.jamb_end,
                  "span_pt":s.span_pt,
                  "wall_thickness_pt":s.wall_thickness_pt,
                  "subtype":s.subtype,
                  "flags":list(s.evidence_flags),
                  "reason":s.reason,
              }

          doc=fitz.open(path)
          page=doc[53]
          vps=segment_page_viewports(page,page_number=54)
          plans=[
              v for v in vps
              if v.view_type == DrawingViewType.FLOOR_PLAN.value
              and v.bounding_box is not None
              and (
                  v.status == ViewportSegmentationStatus.RESOLVED.value
                  or is_authoritative_derived_viewport(v)
              )
          ]
          full=resolve_hosted_opening_spans(page)
          scoped=[]
          for v in plans:
              res=resolve_hosted_opening_spans(page,viewport_bbox=tuple(v.bounding_box))
              scoped.append({
                  "view_id":v.view_id,
                  "label":v.label,
                  "status":v.status,
                  "bbox":v.bounding_box,
                  "provenance":v.provenance,
                  "hosted_status":res.status,
                  "reason":res.reason,
                  "openings":[sdict(s) for s in res.openings],
              })
          print("KSTVET_HOSTED_FAST_AFTER_806="+json.dumps({
              "sha":actual,
              "candidate_sha":"db258509c51c3c7531f6f9dc9aeecfe95fdb34af",
              "floor_plan_count":len(plans),
              "full_page":{"status":full.status,"reason":full.reason,"openings":[sdict(s) for s in full.openings]},
              "scoped":scoped,
          },sort_keys=True,default=str),flush=True)
          doc.close()
          PY
