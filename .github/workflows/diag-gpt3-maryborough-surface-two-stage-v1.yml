name: DIAG GPT3 Maryborough Surface Two Stage V1

on:
  push:
    branches:
      - diag/gpt3-maryborough-surface-two-stage-v1

jobs:
  floor-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Seal room and floor authority
        shell: bash
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities
          from pb_live_floor_area_source_closed_export import seal_live_floor_area_run
          from pb_live_floor_finish_area_source_closed_export import seal_live_floor_finish_area_run
          from pb_source_closed_run_export import combine_source_closed_runs
          from tools.run_source_closed_project_handoff import _source_page_scopes

          PDF=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          ROOT=Path("artifacts/gpt3-maryborough-two-stage/floor-room")
          ROOT.mkdir(parents=True,exist_ok=True)
          project="au_qld_maryborough_service_station"
          topology,support,page_count=_source_page_scopes(PDF)
          all_pages=tuple(range(page_count))
          restricted=bool(topology) and tuple(topology)!=all_pages
          pages=tuple(sorted(set(topology)|set(support))) if restricted else all_pages
          claim=collect_live_physical_net_wall_claim(
              PDF,
              pages=pages,
              topology_pages=(topology if restricted else None),
              room_area_support_pages=(support if support else None),
          )
          room_q=tuple(getattr(claim,"room_area_quantity_evidence",()) or ())
          (ROOT/"room-area-quantities.json").write_text(
              json.dumps([q.to_dict() for q in room_q],indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          family_runs=[]
          floor_q=tuple(q for q in publish_live_floor_area_quantities(claim) if not q.abstained and q.value is not None)
          if floor_q:
              run=seal_live_floor_area_run(claim,workspace_id=1,project_id=project)
              path=ROOT/"floor_area.sealed.json"; path.write_text(run.to_json(),encoding="utf-8")
              family_runs.append(run)
          finish_q=tuple(q for q in (getattr(claim,"floor_finish_quantity_evidence",()) or ()) if not q.abstained and q.value is not None)
          if finish_q:
              run=seal_live_floor_finish_area_run(claim,workspace_id=1,project_id=project)
              path=ROOT/"floor_finish_area.sealed.json"; path.write_text(run.to_json(),encoding="utf-8")
              family_runs.append(run)
          if family_runs:
              combined=combine_source_closed_runs(tuple(family_runs),project_id=project)
              (ROOT/"floor-families.sealed.json").write_text(combined.to_json(),encoding="utf-8")
          summary={
              "topology_pages":[x+1 for x in topology],
              "support_pages":[x+1 for x in support],
              "execution_pages":[x+1 for x in pages],
              "canonical_rooms":len(tuple(getattr(claim,"canonical_rooms",()) or ())),
              "canonical_floors":len(tuple(getattr(claim,"canonical_floors",()) or ())),
              "room_area_total":len(room_q),
              "room_area_firm":sum((not q.abstained and q.value is not None) for q in room_q),
              "floor_area_firm":len(floor_q),
              "floor_finish_area_firm":len(finish_q),
          }
          (ROOT/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpt3-maryborough-two-stage-floor-room
          path: artifacts/gpt3-maryborough-two-stage/floor-room
          retention-days: 3

  ceiling:
    needs: floor-room
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - uses: actions/download-artifact@v4
        with:
          name: gpt3-maryborough-two-stage-floor-room
          path: artifacts/gpt3-maryborough-two-stage/floor-room
      - name: Seal ceiling authority
        shell: bash
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          import fitz
          from pb_migration_contracts import QuantityEvidence
          from pb_live_ceiling_lining_integration import collect_live_ceiling_lining_claims
          from pb_live_ceiling_area_quantity_publication import publish_live_ceiling_area_quantities
          from pb_live_ceiling_area_source_closed_export import seal_live_ceiling_area_run

          PDF=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          ROOT=Path("artifacts/gpt3-maryborough-two-stage")
          stage=ROOT/"floor-room"
          out=ROOT/"ceiling"; out.mkdir(parents=True,exist_ok=True)
          raw=json.loads((stage/"room-area-quantities.json").read_text())
          tuple_fields={"input_entity_ids","evidence_ids","blocking_reasons","reason_codes"}
          qs=[]
          for row in raw:
              row=dict(row)
              for key in tuple_fields:
                  row[key]=tuple(row.get(key) or ())
              qs.append(QuantityEvidence(**row))
          doc=fitz.open(PDF)
          try:
              pages=tuple(range(doc.page_count))
          finally:
              doc.close()
          result=collect_live_ceiling_lining_claims(
              PDF,
              pages=pages,
              authoritative_room_area_quantities=tuple(qs),
          )
          ceiling_q=tuple(q for q in publish_live_ceiling_area_quantities(result) if not q.abstained and q.value is not None)
          if ceiling_q:
              run=seal_live_ceiling_area_run(result,workspace_id=1,project_id="au_qld_maryborough_service_station")
              (out/"ceiling_area.sealed.json").write_text(run.to_json(),encoding="utf-8")
          summary={
              "canonical_ceilings":len(tuple(getattr(result,"canonical_ceilings",()) or ())),
              "ceiling_area_firm":len(ceiling_q),
              "quantity_ids":[q.quantity_id for q in ceiling_q],
              "values":[q.value for q in ceiling_q],
          }
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-maryborough-two-stage-ceiling
          path: artifacts/gpt3-maryborough-two-stage/ceiling
          retention-days: 3

  combine:
    needs: [floor-room, ceiling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal dependencies
        run: pip install -r requirements-ci-v1228.txt
      - uses: actions/download-artifact@v4
        with:
          name: gpt3-maryborough-two-stage-floor-room
          path: artifacts/gpt3-maryborough-two-stage/floor-room
      - uses: actions/download-artifact@v4
        with:
          name: gpt3-maryborough-two-stage-ceiling
          path: artifacts/gpt3-maryborough-two-stage/ceiling
      - name: Combine sealed surface families
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_closed_run_export import sealed_source_closed_run_from_dict, combine_source_closed_runs
          root=Path("artifacts/gpt3-maryborough-two-stage")
          runs=[]
          for path in [
              root/"floor-room/floor-families.sealed.json",
              root/"ceiling/ceiling_area.sealed.json",
          ]:
              if path.is_file():
                  runs.append(sealed_source_closed_run_from_dict(json.loads(path.read_text())))
          out=root/"combined"; out.mkdir(parents=True,exist_ok=True)
          if runs:
              combined=combine_source_closed_runs(tuple(runs),project_id="au_qld_maryborough_service_station")
              (out/"au_qld_maryborough_service_station.surfaces.json").write_text(combined.to_json(),encoding="utf-8")
              payload=combined.to_dict()
          else:
              payload={"quantities":[]}
          (out/"summary.json").write_text(json.dumps({
              "quantity_count":len(payload.get("quantities") or []),
              "quantities":payload.get("quantities") or [],
          },indent=2,sort_keys=True)+"\n")
          print((out/"summary.json").read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpt3-maryborough-two-stage-combined
          path: artifacts/gpt3-maryborough-two-stage/combined
          retention-days: 3
