name: Item19B Target Native Path Probe

on:
  push:
    branches: [gpt/item19b-component-authority-main]

jobs:
  native-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyMuPDF
        run: pip install PyMuPDF
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Print target drawing paths
        run: |
          python - <<'PY'
          import json, fitz
          TARGET={47,4763,4764,4766,4770,4772,5179,5214,5215}
          doc=fitz.open("/tmp/kstvet.pdf")
          page=doc[53]
          drawings=page.get_drawings()
          rows=[]
          for di in sorted(TARGET):
              d=drawings[di]
              item_rows=[]
              for ii,item in enumerate(d.get("items",())):
                  kind=item[0] if item else None
                  vals=[]
                  for value in item[1:]:
                      if hasattr(value,"x") and hasattr(value,"y"):
                          vals.append([round(float(value.x),3),round(float(value.y),3)])
                      elif isinstance(value,(int,float)):
                          vals.append(round(float(value),3))
                      else:
                          vals.append(str(value))
                  item_rows.append({
                      "raw_id":f"d{di}i{ii}",
                      "kind":kind,
                      "values":vals,
                  })
              rect=d["rect"]
              rows.append({
                  "drawing_index":di,
                  "rect":[round(float(rect.x0),3),round(float(rect.y0),3),round(float(rect.x1),3),round(float(rect.y1),3)],
                  "layer":d.get("layer"),
                  "type":d.get("type"),
                  "fill":d.get("fill"),
                  "color":d.get("color"),
                  "width":d.get("width"),
                  "closePath":d.get("closePath"),
                  "items":item_rows,
              })
          print("ITEM19B_NATIVE_PATHS "+json.dumps(rows,sort_keys=True))


          # Fast source-only connectivity probe. The seed ids come from the already
          # authenticated target component diagnostic; traversal itself is generic exact
          # endpoint connectivity over native Structural-Bearing line primitives.
          SEED_RAW_IDS={
              "d4763i0","d4767i0","d4772i0","d4776i0","d4780i0","d4784i0",
              "d4788i0","d4792i0","d4796i0","d4800i0","d4804i0","d4808i0",
              "d4924i0","d4932i0","d4939i0","d4940i0","d4947i0","d4948i0",
              "d4956i0","d4964i0","d5135i3","d5179i1","d5179i3","d5213i0",
              "d5214i0","d5215i0","d5217i2","d5246i0","d5559i0","d5559i2",
              "d5560i0","d5562i0","d5592i0","d9134i0",
          }
          struct={}
          for di,d in enumerate(drawings):
              layer=str(d.get("layer") or "")
              if "structural" not in layer.lower() or "bearing" not in layer.lower():
                  continue
              for ii,item in enumerate(d.get("items",()) or ()):
                  if not item or item[0]!="l":
                      continue
                  a,b=item[1],item[2]
                  raw_id=f"d{di}i{ii}"
                  first=(round(float(a.x),6),round(float(a.y),6))
                  second=(round(float(b.x),6),round(float(b.y),6))
                  if first==second:
                      continue
                  struct[raw_id]=(first,second,layer)
          
          seed={raw_id for raw_id in SEED_RAW_IDS if raw_id in struct}
          component=set(seed)
          frontier=list(seed)
          while frontier:
              raw_id=frontier.pop()
              a,b,_=struct[raw_id]
              endpoints={a,b}
              for other,(c,d,_layer) in struct.items():
                  if other in component:
                      continue
                  if endpoints & {c,d}:
                      component.add(other)
                      frontier.append(other)
          
          degree={}
          for raw_id in component:
              a,b,_=struct[raw_id]
              degree[a]=degree.get(a,0)+1
              degree[b]=degree.get(b,0)+1
          dangling=sorted([list(point) for point,count in degree.items() if count==1])
          connected_rows=[
              {
                  "raw_id":raw_id,
                  "geometry":[list(struct[raw_id][0]),list(struct[raw_id][1])],
                  "layer":struct[raw_id][2],
                  "seed":raw_id in seed,
              }
              for raw_id in sorted(component)
          ]
          print("ITEM19B_NATIVE_CONNECTED_STRUCTURAL "+json.dumps({
              "seed_count":len(seed),
              "component_count":len(component),
              "dangling_count":len(dangling),
              "dangling":dangling,
              "members":connected_rows,
          },sort_keys=True))
          PY
