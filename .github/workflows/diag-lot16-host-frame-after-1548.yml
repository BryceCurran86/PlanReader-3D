name: DIAG Lot16 Host Frame After 1548

on:
  pull_request:
    branches:
      - gpt4/raster-whole-wall-frame-current-main-v5

jobs:
  quantity-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused host-frame regression
        run: |
          PYTHONPATH=. pytest -q tests/test_raster_opening_whole_wall_frame.py
      - name: Run Lot16 opening quantity stack
        run: |
          PYTHONPATH=. python tools/diag_lot16_opening_quantity_stack.py | tee lot16-opening-quantity-stack.json
      - name: Upload quantity stack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-opening-quantity-stack-after-1548
          path: lot16-opening-quantity-stack.json
          retention-days: 1

  source-closed-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact Lot16 source-closed all-family handoff
        run: |
          mkdir -p /tmp/lot16-handoff
          PYTHONPATH=. python tools/run_source_closed_project_handoff.py             --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf"             --project-id au_qld_lot16_power             --workspace-id 1             --family-group all             --output-dir /tmp/lot16-handoff             | tee lot16-source-closed-handoff.json
      - name: Require sealed handoff and no primitive-bound regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("lot16-source-closed-handoff.json").read_text())
          message = str(data.get("production_error_message") or "")
          print(json.dumps({
              "status": data.get("status"),
              "topology_pages": data.get("topology_pages"),
              "execution_pages": data.get("execution_pages"),
              "family_counts": data.get("family_counts"),
              "combined_quantity_count": data.get("combined_quantity_count"),
              "claim_status": data.get("claim_status"),
              "claim_reason_codes": data.get("claim_reason_codes"),
              "production_error_message": message,
          }, indent=2, sort_keys=True))
          if "raster opening primitive count exceeds safety bound" in message:
              raise SystemExit("primitive safety-bound regression returned")
          if data.get("status") != "sealed":
              raise SystemExit(f"handoff not sealed: {data.get('status')}")
          PY
      - name: Upload handoff summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-source-closed-handoff-after-1548
          path: lot16-source-closed-handoff.json
          retention-days: 1
