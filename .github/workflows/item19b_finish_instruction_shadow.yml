name: Item19B Finish Instruction Shadow

on:
  push:
    branches: [gpt/item19b-finish-instruction-v1]

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Focused instruction tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_wall_finish_instruction_authority.py \
            tests/test_wall_finish_callout_wall_authority.py \
            tests/test_wall_finish_callout_wall_authority_v1.py
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Real KSTVET finish instruction shadow
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_wall_finish_callout_wall_authority import WallFinishCalloutWallProducer
          from pb_wall_finish_instruction_authority import WallFinishInstructionProducer

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-finish-instruction-shadow",
              producer_version="1.0",
          )
          source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-finish-instruction",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          walls=WallFinishCalloutWallProducer.from_source_visibility_producer(
              source,page_ids=("54",)
          )
          instructions=WallFinishInstructionProducer.from_callout_wall_producer(walls)
          rows=[]
          for result in instructions.published_results():
              if result.record is None:
                  continue
              r=result.record
              rows.append({
                  "trade":r.trade_scope_id,
                  "material":r.finish_material,
                  "direction":r.semantic_direction,
                  "wall":r.physical_wall_id,
                  "owners":list(r.raw_owner_wall_ids),
                  "group":list(r.equivalence_group_wall_ids),
                  "trusted_text":r.trusted_annotation_text,
              })
          print("ITEM19B_FINISH_INSTRUCTIONS "+json.dumps(rows,sort_keys=True))
          print("ITEM19B_FINISH_INSTRUCTION_COUNT",len(rows))
          assert any(r["trade"]=="internal_plaster" for r in rows)
          assert any(r["trade"]=="internal_paint" for r in rows)
          # External direction is expected to remain unresolved if the
          # producer-owned raster authority still abstains on 'externally.'.
          PY
