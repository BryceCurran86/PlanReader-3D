name: Opening Detail Definition Authority

on:
  push:
    branches: [gpt/opening-detail-definition-authority-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          # Shadow-only validation of the already-approved raster text
          # corroboration backend. Do not add RapidOCR to production requirements.
          pip install rapidocr
      - name: Focused tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_opening_detail_definition_authority_v1.py             tests/test_source_execution_callout_authority_v1.py             tests/test_raster_text_corroboration_authority_v1.py             tests/test_opening_schedule_v171.py
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Real KSTVET page54 detail-definition shadow
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_opening_detail_definition_authority import OpeningDetailDefinitionProducer

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="kstvet-opening-detail-definition-shadow",
              producer_version="1.0",
          )
          source.ingest_native_pdf_bytes(
              document_id="kstvet-opening-detail-definition",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          producer=OpeningDetailDefinitionProducer.from_source_visibility_producer(
              source,page_ids=("54",)
          )
          rows=[]
          for result in producer.published_results():
              for rec in result.records:
                  rows.append({
                      "record":rec.record_id,
                      "semantic_identity":rec.semantic_identity_id,
                      "family":rec.family,
                      "subtype":rec.subtype,
                      "material":rec.material,
                      "width":rec.width_mm,
                      "height":rec.height_mm,
                      "basis":rec.dimension_basis,
                      "partition":rec.source_partition_id,
                      "sequence":[rec.sequence_start,rec.sequence_end],
                      "bbox":list(rec.source_bbox),
                      "required":list(rec.required_observation_ids),
                      "evidence":[
                          {
                              "observation":e.observation_id,
                              "authority":e.authority_kind,
                              "authority_record":e.authority_record_id,
                              "text":e.trusted_text,
                          }
                          for e in rec.word_evidence
                      ],
                  })
          print("OPENING_DETAIL_DEFINITIONS "+json.dumps(rows,sort_keys=True))
          identities={}
          for row in rows:
              identities.setdefault(row["semantic_identity"],[]).append(row)
          print("OPENING_DETAIL_SEMANTIC_IDENTITIES "+json.dumps({
              k:{
                  "definition":(
                      v[0]["family"],v[0]["subtype"],v[0]["material"],
                      v[0]["width"],v[0]["height"],v[0]["basis"]
                  ),
                  "source_record_count":len(v),
              }
              for k,v in identities.items()
          },sort_keys=True))
          source_defs={
              (r["family"],r["subtype"],r["material"],r["width"],r["height"])
              for r in rows
          }
          assert ("window","casement","steel",2900,900) in source_defs
          assert ("window","casement","steel",3000,900) in source_defs
          assert ("door","batten","timber",1000,2100) in source_defs
          assert all(r["basis"]=="detail_unspecified" for r in rows)
          PY
