name: TEST ONLY GPT3 Maryborough Room Label Reasons

on:
  pull_request:
    branches:
      - main

jobs:
  room_label_reasons:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Probe source-owned room-label authority
        shell: bash
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import hashlib, json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_source_room_face_authority import (
              SourceRoomFaceSelector,
              build_source_room_face_authority,
          )
          from pb_source_room_label_authority import (
              SourceRoomLabelProducer,
              SourceRoomLabelSelector,
          )

          source = Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          payload = source.read_bytes()
          sha = hashlib.sha256(payload).hexdigest()
          document_id = f"label-probe:{sha[:32]}"
          page_id = "7"

          visibility = SourceVisibilityProducer(
              producer_method="gpt3-room-label-diagnostic",
              producer_version="1.0",
          )
          published = visibility.ingest_native_pdf_bytes(
              document_id=document_id,
              source_bytes=payload,
              source_locator="memory://maryborough-label-probe.pdf",
              page_ids=(page_id,),
          )
          composition = compose_live_wall_opening_authority(
              source_visibility_producer=visibility,
              revision_id=published.revision.revision_id,
              page_ids=(page_id,),
          )
          current = visibility.published_snapshot_for_revision(
              published.revision.revision_id
          )
          assert current is not None

          room_faces = build_source_room_face_authority(
              composition.physical_wall_candidate_authority
          )
          face_selector = SourceRoomFaceSelector(
              document_id=current.revision.document_id,
              revision_id=current.revision.revision_id,
              source_sha256=current.revision.source_sha256,
              snapshot_id=current.snapshot.snapshot_id,
              page_id=page_id,
              decision_scope_id=f"wall-source:page-{page_id}",
          )
          face_result = room_faces.resolve_scope(face_selector)

          labels = SourceRoomLabelProducer.from_authorities(
              visibility,
              room_faces,
              page_ids=(page_id,),
          )
          authority = labels.authority()
          label_result = authority.resolve_scope(
              SourceRoomLabelSelector(
                  document_id=current.revision.document_id,
                  revision_id=current.revision.revision_id,
                  source_sha256=current.revision.source_sha256,
                  snapshot_id=current.snapshot.snapshot_id,
                  page_id=page_id,
                  decision_scope_id=f"wall-source:page-{page_id}",
              )
          )
          print(json.dumps({
              "source_sha256": sha,
              "page_id": page_id,
              "room_face_status": getattr(face_result.status, "value", str(face_result.status)),
              "room_face_reason_codes": list(face_result.reason_codes),
              "room_face_count": len(face_result.records),
              "room_face_scope_complete": bool(face_result.scope_complete),
              "room_label_status": getattr(label_result.status, "value", str(label_result.status)),
              "room_label_reason_codes": list(label_result.reason_codes),
              "room_label_record_count": len(label_result.records),
              "room_labels": [
                  {
                      "label": record.label,
                      "face_id": record.face_id,
                      "source_room_face_record_id": record.source_room_face_record_id,
                  }
                  for record in label_result.records
              ],
          }, sort_keys=True), flush=True)
          PY
