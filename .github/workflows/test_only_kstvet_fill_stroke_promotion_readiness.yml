name: TEST-ONLY KSTVET Fill Stroke Promotion Readiness

on:
  pull_request:
    branches:
      - 'fix/pdf-text-disjoint-sibling-clip-exclusion-v1'

jobs:
  probe:
    if: github.head_ref == 'test-only/kstvet-fill-stroke-promotion-readiness-1112'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-256 verify KSTVET source
        run: |
          curl -fL --retry 3 --retry-delay 2 --max-time 900 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  kstvet.pdf' | sha256sum -c -

      - name: Probe existing decode and visibility behind exact pair ambiguity
        run: |
          PYTHONPATH=. python - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          import fitz

          from pb_pdf_text_fill_stroke_equivalence_shadow import (
              classify_fill_stroke_text_pair_shadow,
          )
          from pb_pdf_text_integrity_authority import (
              TEXT_TRACE_AMBIGUOUS,
              _decode_status,
              _texttrace_spans,
              _trace_text,
              _unicode_is_untrusted,
              _visibility_status,
          )
          from pb_source_observation_authority import ObservationSelector
          from pb_source_visibility_authority import SourceVisibilityProducer

          payload = Path("kstvet.pdf").read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"

          producer = SourceVisibilityProducer(
              producer_method="kstvet-fill-stroke-promotion-readiness-1112",
              producer_version="1.0",
          )
          published = producer.ingest_native_pdf_bytes(
              document_id=f"kstvet-pair-promotion-readiness:{digest[:16]}",
              source_bytes=payload,
              source_locator="sha256-verified-kstvet-source",
              page_ids=("47",),
          )
          authority = producer.text_integrity_authority()

          doc = fitz.open(stream=payload, filetype="pdf")
          page = doc.load_page(46)
          spans = list(_texttrace_spans(page) or ())
          spans_by_seq = {}
          for span in spans:
              try:
                  spans_by_seq[int(span.get("seqno"))] = span
              except (TypeError, ValueError, AttributeError):
                  pass

          rows = []
          reason_counts = collections.Counter()
          eligible_count = 0
          exact_pair_count = 0

          for observation_id in published.text_observation_ids:
              selector = ObservationSelector(
                  document_id=published.revision.document_id,
                  revision_id=published.revision.revision_id,
                  source_sha256=published.revision.source_sha256,
                  snapshot_id=published.snapshot.snapshot_id,
                  observation_id=observation_id,
              )
              live = authority.resolve_text(selector)
              receipt = live.receipt
              if receipt is None or TEXT_TRACE_AMBIGUOUS not in live.reason_codes:
                  continue

              word = {
                  "text": str(receipt.raw_text),
                  "bbox": tuple(float(v) for v in receipt.geometry),
              }
              pair = classify_fill_stroke_text_pair_shadow(page, word)
              row = {
                  "text": word["text"],
                  "bbox": list(word["bbox"]),
                  "live_reason_codes": list(live.reason_codes),
                  "pair_equivalent": bool(pair.equivalent),
                  "pair_reason_codes": list(pair.reason_codes),
                  "sequence_numbers": list(pair.sequence_numbers),
                  "span_checks": [],
                  "promotion_ready_under_existing_decode_visibility": False,
              }
              if pair.equivalent:
                  exact_pair_count += 1
                  all_reasons = []
                  if _unicode_is_untrusted(word["text"]):
                      all_reasons.append("text_unicode_untrusted")
                  for seqno in pair.sequence_numbers:
                      span = spans_by_seq.get(int(seqno))
                      if span is None:
                          all_reasons.append("text_trace_unavailable")
                          continue
                      span_text = _trace_text(span)
                      decode_status, decode_reasons, xref, subtype, base_font = _decode_status(
                          page,
                          span,
                          span_text,
                      )
                      _vis_status, visibility_reasons, resolved_seqno = _visibility_status(
                          page,
                          word["bbox"],
                          span,
                          native_word=word,
                      )
                      row["span_checks"].append({
                          "seqno": int(seqno),
                          "trace_text": span_text,
                          "font_xref": xref,
                          "font_subtype": subtype,
                          "font_name": base_font,
                          "decode_status": decode_status,
                          "decode_reason_codes": list(decode_reasons),
                          "visibility_reason_codes": list(visibility_reasons),
                          "resolved_seqno": resolved_seqno,
                      })
                      all_reasons.extend(decode_reasons)
                      all_reasons.extend(visibility_reasons)
                  unique = list(dict.fromkeys(all_reasons))
                  row["post_pair_reason_codes"] = unique
                  reason_counts.update(unique)
                  if not unique:
                      eligible_count += 1
                      row["promotion_ready_under_existing_decode_visibility"] = True
              rows.append(row)

          report = {
              "diagnostic_only": True,
              "do_not_merge": True,
              "source_sha256": digest,
              "page_id": "47",
              "trace_ambiguous_observation_count": len(rows),
              "exact_fill_stroke_pair_count": exact_pair_count,
              "promotion_ready_count": eligible_count,
              "post_pair_reason_counts": dict(sorted(reason_counts.items())),
              "rows": rows,
          }
          Path("kstvet-fill-stroke-promotion-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          doc.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kstvet-fill-stroke-promotion-readiness
          path: kstvet-fill-stroke-promotion-readiness.json
          if-no-files-found: warn
