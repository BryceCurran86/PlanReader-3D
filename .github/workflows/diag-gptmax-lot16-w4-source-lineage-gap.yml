name: DIAG GPTMAX Lot16 W4 Source Lineage Gap

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace source wall faces into W4 identity
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_w4_source_lineage_gap.py | tee lot16-w4-source-lineage-gap.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-w4-source-lineage-gap
          path: lot16-w4-source-lineage-gap.json
          retention-days: 2
