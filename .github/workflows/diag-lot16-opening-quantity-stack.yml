name: DIAG Lot16 Opening Quantity Stack

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused GPT4 opening regressions
        run: |
          PYTHONPATH=. pytest -q             tests/test_raster_opening_whole_wall_host.py             tests/test_raster_opening_whole_wall_frame.py             tests/test_raster_opening_label_ownership.py
      - name: Run Lot16 opening quantity stack
        run: |
          PYTHONPATH=. python tools/diag_lot16_opening_quantity_stack.py | tee lot16-opening-quantity-stack.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-opening-quantity-stack
          path: lot16-opening-quantity-stack.json
          retention-days: 1
