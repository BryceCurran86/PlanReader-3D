name: GPT1 Q02 Actual Source PDF Preflight
on:
  pull_request:
    paths:
      - tools/diag_gpt1_source_pdf_package_preflight.py
      - tests/test_gpt1_source_pdf_package_preflight.py
      - .github/workflows/test-gpt1-q02-original-source-preflight.yml
      - 'documents/sources/**'
  workflow_dispatch:
jobs:
  source-preflight-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original source-byte tamper and completeness regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_gpt1_source_pdf_package_preflight.py
      - name: Frozen benchmark integrity and source isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  actual-repository-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pymupdf
      - name: Audit all four frozen project source packages without claiming benchmark accuracy
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from tools.diag_gpt1_source_pdf_package_preflight import check_source_pdf_package

          root = Path("benchmarks/frozen_holdout/full_plan_v2")
          suite = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          project_ids = suite.get("projects")
          if (
              type(project_ids) is not list
              or len(project_ids) != 4
              or len(set(project_ids)) != 4
              or any(
                  type(project_id) is not str
                  or project_id != Path(project_id).name
                  or not project_id
                  for project_id in project_ids
              )
          ):
              raise ValueError("invalid frozen four-project inventory")
          source_root = Path("documents/sources")
          results = {}
          for project_id in project_ids:
              manifest_path = root / "projects" / project_id / "source_manifest.json"
              results[project_id] = check_source_pdf_package(manifest_path, source_root)
              if results[project_id]["project_id"] != project_id:
                  raise ValueError("frozen project source identity mismatch")
          documents = [
              (project_id, doc)
              for project_id in project_ids
              for doc in results[project_id]["source_documents"]
          ]
          report = {
              "type": "FOUR_PROJECT_SOURCE_PACKAGE_INVENTORY_ONLY",
              "publication_status": "UNPUBLISHED",
              "benchmark_score_granted": False,
              "configured_project_count": len(project_ids),
              "source_project_complete_count": sum(
                  results[project_id]["actual_source_package_runtime_complete"]
                  for project_id in project_ids
              ),
              "source_document_count": len(documents),
              "verified_source_document_count": sum(
                  doc["status"] == "VERIFIED" for _, doc in documents
              ),
              "project_results": results,
          }
          output = Path("full-plan-v2-original-source-inventory.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for project_id in project_ids:
              result = results[project_id]
              missing = [
                  doc["name"] for doc in result["source_documents"]
                  if doc["status"] == "MISSING"
              ]
              print("PROJECT_SOURCE_STATUS", project_id, result["actual_source_package_runtime_complete"])
              print("MISSING_ORIGINALS", missing)
          print("VERIFIED_ORIGINAL_DOCUMENTS", report["verified_source_document_count"], "/", report["source_document_count"])
          print("ACCURACY_SCORE", "UNPUBLISHED")
          if any(doc["status"] not in ("VERIFIED", "MISSING") for _, doc in documents):
              raise SystemExit("source file failed SHA/size/page count or safety checks")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-plan-v2-four-project-original-source-inventory
          path: full-plan-v2-original-source-inventory.json
          retention-days: 30
