name: GPT1 Q02 Actual Source PDF Preflight
on:
  pull_request:
    paths:
      - tools/diag_gpt1_source_pdf_package_preflight.py
      - tests/test_gpt1_source_pdf_package_preflight.py
      - .github/workflows/test-gpt1-q02-original-source-preflight.yml
jobs:
  source-preflight-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original source-byte tamper and completeness regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_gpt1_source_pdf_package_preflight.py
      - name: Frozen benchmark integrity and source isolation
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  actual-repository-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pymupdf
      - name: Record real source availability without claiming complete source package
        shell: bash
        run: |
          set +e
          python tools/diag_gpt1_source_pdf_package_preflight.py \
            --manifest benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/source_manifest.json \
            --source-root documents/sources \
            --output lot16-source-package-preflight.json
          exit_code=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("lot16-source-package-preflight.json").read_text())
          assert r["project_id"]=="au_qld_lot16_power"
          assert r["expected_source_document_count"]==2
          assert r["source_documents"][0]["expected_sha256"]=="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert r["source_documents"][1]["expected_sha256"]=="b40259589dd39a46e45d25e145cfa789d9a9415b50613ebc4fee01dceab6b3d6"
          assert not r["rcp_or_metric_or_finish_authority_granted"]
          assert not r["commercial_quantity_publication_granted"]
          assert not r["benchmark_score_granted"]
          missing=[x["name"] for x in r["source_documents"] if x["status"]=="MISSING"]
          print("ACTUAL_REPO_SOURCE_PACKAGE_COMPLETE",r["actual_source_package_runtime_complete"])
          print("MISSING_ORIGINAL_BINARY_FILES",missing)
          assert all(x["status"] in ("VERIFIED","MISSING") for x in r["source_documents"])
          PY
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then
            exit "$exit_code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-q02-source-package-original-binary-status
          path: lot16-source-package-preflight.json
          retention-days: 30
