name: GPT MAX trusted original opening replay (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "SHA-reviewed original-source target (all runs every gate)"
        type: choice
        required: true
        default: cache
        options:
          - host
          - frame
          - receipt
          - cache
          - vertical
          - horizontal
          - antigravity
          - all
permissions:
  contents: read
concurrency:
  group: gptmax-trusted-original-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' && github.triggering_actor == 'BryceCurran86' }}
    name: ${{ matrix.target }} original (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        target: ${{ fromJSON(inputs.target == 'all' && '["host","frame","receipt","cache","vertical","horizontal","antigravity"]' || inputs.target == 'host' && '["host"]' || inputs.target == 'frame' && '["frame"]' || inputs.target == 'receipt' && '["receipt"]' || inputs.target == 'cache' && '["cache"]' || inputs.target == 'vertical' && '["vertical"]' || inputs.target == 'horizontal' && '["horizontal"]' || inputs.target == 'antigravity' && '["antigravity"]' || '["unsupported"]') }}
    steps:
      - name: Checkout trusted workflow context
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate immutable exact source code tree before secrets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          approved_base=041ea388fc0501e20594d110f46992fe8a6c7042
          case "$TARGET" in
            host)
              approved_head=b58d435efa65e003ba55754c2bdc152df5c91e8b
              expected_paths='pb_opening_host_binding_authority.py|tests/test_gptmax_host_equivalence_conflict_monotonic.py'
              focused_test=tests/test_gptmax_host_equivalence_conflict_monotonic.py
              ;;
            frame)
              approved_head=fd33915001c32c0b715013e72a6823fbddc1eb89
              expected_paths='pb_opening_host_frame_authority.py|tests/test_gptmax_independent_axes_figured_pair_handoff.py|tests/test_gptmax_opening_frame_equivalence_conflict_monotonic.py|tools/diag_gptmax_producer_owned_g17_wall_shadow.py'
              focused_test=tests/test_gptmax_opening_frame_equivalence_conflict_monotonic.py
              ;;
            receipt)
              approved_head=cef7e07d1df950c654fe8d8bd25d93184d3733c3
              expected_paths='docs/engineering/gptmax_g17_source_receipt_registration_20261020.md|pb_source_visibility_authority.py|tests/test_raster_opening_receipt_registration.py'
              focused_test=tests/test_raster_opening_receipt_registration.py
              ;;
            cache)
              # Source-cache integrity #4166 is the reviewed non-overlapping
              # current-main two-file recovery of historical #3405.
              # Only exact source/test blobs are approved; no PR input.
              approved_base=86c0193c157cd1333a11470b45d50ab3f5cf44fc
              approved_head=5ae6170f03b81c58df15423b997caacd9e778f87
              expected_paths='pb_physical_opening_authority.py|tests/test_raster_opening_cached_source_integrity.py'
              focused_test=tests/test_raster_opening_cached_source_integrity.py
              ;;
            vertical)
              # Exactly three reviewed source/test/architecture paths differ from the
              # exact trusted main base; no secret workflow or PDF changes.
              approved_base=5a3649001830efd119c28c9a40db795ce815f4c2
              approved_head=f7e2872a56d920f28043af29474f82dfd5a401b4
              expected_paths='docs/engineering/gptmax_vertical_third_root_ownership_20261029.md|pb_gptmax_raster_tile_seam_shadow.py|tests/test_gptmax_raster_tile_seam_source.py'
              focused_test=tests/test_gptmax_raster_tile_seam_source.py
              ;;
            horizontal)
              # Source-only horizontal p5 elevation rail: reviewed three-file
              # subpixel source-placement-gap veto, never a kind/quantity grant.
              approved_base=fa7b2bd77adaa8ddf3c5af2e2ff80e755f44c512
              approved_head=98deb79aa5d4f1c45b666d8b7a71a77f82a5c825
              expected_paths='docs/engineering/gptmax_horizontal_third_root_ownership_20261029.md|pb_gptmax_horizontal_raster_tile_seam_shadow.py|tests/test_gptmax_horizontal_raster_tile_seam_shadow.py'
              focused_test=tests/test_gptmax_horizontal_raster_tile_seam_shadow.py
              ;;
            antigravity)
              # Source-backed and source-negative north/south original replay.
              approved_base=782b4e3ef4028e9463f39a4a64feb5c50b9332f6
              approved_head=0377a077d94552f4297e73ae1f1e0d0b44bcd53d
              expected_paths='.github/workflows/test-gptmax-original-split-frame-shadow.yml|pb_live_wall_opening_authority_composition.py|pb_opening_host_frame_authority.py|tests/test_gptmax_alternate_raster_frame_source_edge_gate.py|tests/test_gptmax_raster_split_frame_shadow.py'
              focused_test=tests/test_gptmax_alternate_raster_frame_source_edge_gate.py
              ;;
            *)
              echo "::error::Unknown source replay target"
              exit 1
              ;;
          esac
          git fetch --no-tags --depth=1 origin "$approved_base" "$approved_head"
          observed="$(git diff --name-only "$approved_base" "$approved_head" | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$expected_paths" | tr '|' '\n' | LC_ALL=C sort)"
          if [[ "$observed" != "$expected" ]]; then
            echo "::error::Exact reviewed source/test path allowlist mismatch"
            exit 1
          fi
          # Keep trusted main as the local-action execution root.
          # Export reviewed PR code as inert data; never check it out on the
          # token-bearing host before private original-source provisioning.
          approved_tree="$RUNNER_TEMP/gptmax-approved-target"
          mkdir -p "$approved_tree"
          git archive "$approved_head" | tar -x -C "$approved_tree"
          mkdir -p "$approved_tree/documents/sources"
          private_tests="$RUNNER_TEMP/gptmax-private-tests"
          mkdir -m 700 -p "$private_tests"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ -f "$approved_tree/$focused_test" ]]
          echo "GPTMAX_APPROVED_TREE=$approved_tree" >> "$GITHUB_ENV"
          echo "GPTMAX_PRIVATE_TESTS=$private_tests" >> "$GITHUB_ENV"
          echo "GPTMAX_APPROVED_HEAD=$approved_head" >> "$GITHUB_ENV"
          echo "GPTMAX_FOCUSED_TEST=$focused_test" >> "$GITHUB_ENV"
          echo "GPTMAX_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Authenticated exact immutable MAX source/test tree."
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install unchanged protected dependency set
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Build no-network original-test sandbox before private source provisioning
        shell: bash
        run: |
          set -euo pipefail
          # This image contains dependencies only. The client original is not yet present.
          # SHA-approved code owns dependencies; moving main cannot alter source replay.
          approved_deps="$RUNNER_TEMP/gptmax-approved-deps"
          mkdir -p "$approved_deps"
          for dep in requirements.txt requirements-ci-v1228.txt; do
            [[ -f "$GPTMAX_APPROVED_TREE/$dep" && ! -L "$GPTMAX_APPROVED_TREE/$dep" ]] || exit 1
            cp -- "$GPTMAX_APPROVED_TREE/$dep" "$approved_deps/$dep"
          done
          docker build --pull --build-arg PYTHON_VERSION="${{ matrix.python-version }}" \
            --tag "gptmax-original-sandbox:${{ matrix.python-version }}" -f - "$approved_deps" <<'DOCKERFILE'
          ARG PYTHON_VERSION
          FROM python:${PYTHON_VERSION}-slim
          ENV PIP_DISABLE_PIP_VERSION_CHECK=1 PYTHONDONTWRITEBYTECODE=1
          RUN apt-get update && apt-get install -y --no-install-recommends libglib2.0-0 libgl1 libgomp1 tesseract-ocr && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt requirements-ci-v1228.txt /deps/
          RUN python -m pip install --no-cache-dir -r /deps/requirements.txt -r /deps/requirements-ci-v1228.txt
          DOCKERFILE
      - name: Stage immutable private north and south tests as inert owner-only data
        shell: bash
        env:
          SOURCE_TEST_TOKEN: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          SOURCE_TEST_REPOSITORY: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          SOURCE_TEST_REF: ${{ vars.ORIGINAL_SOURCES_REF }}
        run: |
          set -euo pipefail
          if [[ "$GPTMAX_TARGET" == "antigravity" ]]; then
            if ! python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          def stage_immutable_tests():
              repo = os.environ.get("SOURCE_TEST_REPOSITORY", "")
              token = os.environ.get("SOURCE_TEST_TOKEN", "")
              target = Path(os.environ["GPTMAX_PRIVATE_TESTS"])
              if not re.fullmatch(r"[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_-][A-Za-z0-9_.-]*", repo):
                  raise ValueError("Invalid private source repository")
              if not token or not target.is_dir() or target.is_symlink():
                  raise ValueError("Unavailable private source test destination")
              blobs = (
                  ("north", "1a1de74e07776727f01ce3af7aa02f8ade817ff7"),
                  ("south", "ad02703c837e683ac2ddbba06bfa347e1e333c72"),
              )
              for side, sha in blobs:
                  request = Request(
                      f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "PlanReader-Owner-Original-Replay",
                      },
                  )
                  with urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read(40000))
                  if payload.get("sha") != sha or payload.get("encoding") != "base64":
                      raise ValueError("Private test blob identity mismatch")
                  data = base64.b64decode(payload["content"], validate=False)
                  if not 0 < len(data) <= 16000 or payload.get("size") != len(data):
                      raise ValueError("Private test blob size mismatch")
                  header = b"blob " + str(len(data)).encode("ascii") + bytes([0])
                  observed = hashlib.sha1(header + data).hexdigest()
                  if observed != sha:
                      raise ValueError("Private test blob content mismatch")
                  # No substring-selected opening, skipped source case, or partial physical ID.
                  if (b"b.opening_identity_id == key" not in data
                          or b"physical_opening_existence_" not in data
                          or b"key in b.opening_identity_id" in data
                          or b"pytest.skip(" in data
                          or data.count(b"def test_") != 1):
                      raise ValueError("Private test physical-identity contract mismatch")
                  dest = target / f"test_antigravity_lot16_{side}_wall_frame.py"
                  fd = os.open(dest, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(data)

          try:
              stage_immutable_tests()
          except Exception:
              sys.exit(1)
          PY
            then
              echo "::error::Pinned private original-test staging failed"
              exit 1
            fi
            echo "Two immutable private original-test blobs staged without execution."
          fi
          # One owner-only token boundary: reuse the trusted main SHA-256/size
          # manifest provisioner after staging inert private test blobs.
          # No reviewed PR-head code runs on this credentialed host.
          ORIGINAL_SOURCES_TOKEN="$SOURCE_TEST_TOKEN" \
            python3 .github/actions/provision-original-sources/provision.py \
              --repository "$SOURCE_TEST_REPOSITORY" --ref "$SOURCE_TEST_REF" \
              --names '1. Construction Plans - Lot 16 Power (REV E).pdf' \
              --allow-missing false
      - name: Provision original Lot16 authenticated SHA and size
        # Tokenless composite verification: the preceding trusted step already
        # downloaded the immutable original and checked its manifest SHA/size.
        # This standard action rechecks the same bytes and fails closed.
        uses: ./.github/actions/provision-original-sources
        with:
          names: 1. Construction Plans - Lot 16 Power (REV E).pdf
          allow-missing: "false"
      - name: Verify real original source nine rows and all eight predecessors
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          PLANREADER_LOT16_ORIGINAL_PDF: documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf
        run: |
          set -euo pipefail
          run_isolated() {
            # PR-head code can read the original only inside this sealed, no-egress container.
            # No runner token, GitHub env, writable workspace, host socket or network is mounted.
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 256 --memory 6g \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --mount "type=bind,src=$GPTMAX_APPROVED_TREE,dst=/repo,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/documents/sources,dst=/repo/documents/sources,readonly" \
              --workdir /repo \
              --env PYTHONPATH=/repo --env PYTHONDONTWRITEBYTECODE=1 \
              --env HOME=/tmp --env XDG_CACHE_HOME=/tmp \
              --env "LOT16_ARCH_ORIGINAL=documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
              --env "PLANREADER_LOT16_ORIGINAL_PDF=documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
              "gptmax-original-sandbox:${{ matrix.python-version }}" "$@"
          }
          output="$RUNNER_TEMP/gptmax-original-positive.log"
          if ! run_isolated python -m pytest -q --tb=no --disable-warnings \
              tests/test_live_append_only_opening_area_original.py::test_original_source_appends_one_area_and_preserves_all_eight_signed_customer_bodies \
              > "$output" 2>&1; then
            echo "::error::Actual original source signed/customer replay FAILED"
            exit 1
          fi
          if ! grep -Eq '(^|[ ,])[1-9][0-9]* passed' "$output"; then
            echo "::error::Original source-positive replay skipped or missing"
            exit 1
          fi
          echo "Original Lot16 nine-source-quantity/customer complete-body parity PASS"
      - name: Verify original-provisioned branch source-authority regression suite
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          LOT16_ARCH_ORIGINAL: documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf
          PLANREADER_LOT16_ORIGINAL_PDF: documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf
        run: |
          set -euo pipefail
          run_isolated() {
            # PR-head code can read the original only inside this sealed, no-egress container.
            # No runner token, GitHub env, writable workspace, host socket or network is mounted.
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 256 --memory 6g \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --mount "type=bind,src=$GPTMAX_APPROVED_TREE,dst=/repo,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/documents/sources,dst=/repo/documents/sources,readonly" \
              --mount "type=bind,src=$GPTMAX_PRIVATE_TESTS,dst=/private-tests,readonly" \
              --workdir /repo \
              --env PYTHONPATH=/repo --env PYTHONDONTWRITEBYTECODE=1 \
              --env HOME=/tmp --env XDG_CACHE_HOME=/tmp \
              --env "LOT16_ARCH_ORIGINAL=documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
              --env "PLANREADER_LOT16_ORIGINAL_PDF=documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
              "gptmax-original-sandbox:${{ matrix.python-version }}" "$@"
          }
          output="$RUNNER_TEMP/gptmax-source-regressions.log"
          if ! run_isolated python -m pytest -q --tb=no --disable-warnings "$GPTMAX_FOCUSED_TEST" > "$output" 2>&1; then
            echo "::error::Original-provisioned MAX source guard FAILED"
            exit 1
          fi
          if ! grep -Eq '(^|[ ,])[1-9][0-9]* passed' "$output"; then
            echo "::error::Source guard did not successfully execute"
            exit 1
          fi
          if [[ "$GPTMAX_TARGET" == "vertical" ]]; then
            # A synthetic passing suite cannot conceal a skipped original.
            # Require this exact original-only positive to report 1 passed.
            if ! run_isolated python -m pytest -q --tb=no --disable-warnings \
              tests/test_gptmax_raster_tile_seam_source.py::test_original_lot16_2124_corner_rail_has_two_independent_vertical_tile_roots \
              > "$output" 2>&1; then
              echo "::error::Original 2124 two-root source ink test FAILED"
              exit 1
            fi
            if ! grep -Eq '(^|[ ,])1 passed' "$output"; then
              echo "::error::Original 2124 source ink test skipped or missing"
              exit 1
            fi
          fi
          if [[ "$GPTMAX_TARGET" == "horizontal" ]]; then
            # The focused suite may pass synthetics with the original skipped.
            # Require the immutable source p5 xref116/115 positive explicitly.
            if ! run_isolated python -m pytest -q --tb=no --disable-warnings \
              tests/test_gptmax_horizontal_raster_tile_seam_shadow.py::test_original_elevation_panel_rail_is_continuous_across_horizontal_source_tiles \
              > "$output" 2>&1; then
              echo "::error::Original p5 horizontal source rail test FAILED"
              exit 1
            fi
            if ! grep -Eq '(^|[ ,])1 passed' "$output"; then
              echo "::error::Original p5 horizontal rail test skipped or missing"
              exit 1
            fi
          fi
          if [[ "$GPTMAX_TARGET" == "antigravity" ]]; then
            # Both separately SHA-pinned original tests MUST pass, not skip.
            # Private tests remain a separate read-only mount in the no-egress sandbox.
            for side in north south; do
              if ! run_isolated python -m pytest -q --tb=no --disable-warnings \
                "/private-tests/test_antigravity_lot16_${side}_wall_frame.py" \
                > "$output" 2>&1; then
                echo "::error::Pinned private original wall-frame test FAILED"
                exit 1
              fi
              if ! grep -Eq '(^|[ ,])1 passed' "$output"; then
                echo "::error::Pinned private original wall-frame test skipped or missing"
                exit 1
              fi
            done
          fi
          {
            echo "### Owner-trusted GPT MAX original source replay"
            echo "- Code SHA: $GPTMAX_APPROVED_HEAD"
            echo "- Original SHA and size: frozen manifest verified"
            echo "- 9 sealed/customer rows and immutable 8 predecessor bodies: PASS"
            echo "- Exact source guard suite: PASS"
            echo "- New benchmark score: NOT CLAIMED"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private originals and unpublished logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/gptmax-original-positive.log" "$RUNNER_TEMP/gptmax-source-regressions.log"
          rm -rf "$RUNNER_TEMP/gptmax-approved-target" "$RUNNER_TEMP/gptmax-approved-deps" "$RUNNER_TEMP/gptmax-private-tests" documents/sources
