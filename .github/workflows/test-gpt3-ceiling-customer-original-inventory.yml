name: TEST GPT3 Ceiling Customer Original Inventory Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "pb_live_ceiling_area_customer_projection.py"
      - "tests/test_gpt1_ceiling_customer_exact_measurement.py"
      - ".github/workflows/test-gpt3-ceiling-customer-original-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-quantity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Ceiling source inventory original ID before AI-review eligibility
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt1_ceiling_customer_exact_measurement.py tests/test_gpt1_ceiling_area_final_source_id_quarantine.py tests/test_live_ceiling_area_source_closed_export.py
          ruff check --select F821,F823 pb_live_ceiling_area_customer_projection.py tests/test_gpt1_ceiling_customer_exact_measurement.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py
