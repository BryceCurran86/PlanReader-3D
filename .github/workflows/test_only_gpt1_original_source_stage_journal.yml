name: TEST ONLY GPT1 Original Maryborough Source Stage Journal

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_source_closed_stage_journal.py"
      - "pb_physical_wall_candidate_authority.py"
      - "pb_physical_opening_authority.py"
      - "pb_source_visibility_authority.py"
      - "tests/test_gpt1_g17_source_transaction_auth_reuse.py"
      - "tests/test_gpt1_source_stage_journal.py"
      - ".github/workflows/test_only_gpt1_original_source_stage_journal.yml"

concurrency:
  group: gpt1-source-stage-journal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-source-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Original Maryborough source-stage journal NOT RUN on public CI
        run: |
          set -euo pipefail
          echo '::notice::Original Maryborough source-stage journal NOT RUN on public CI; protected exact-head local replay required before release'
          echo 'Original Maryborough source-stage journal NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
