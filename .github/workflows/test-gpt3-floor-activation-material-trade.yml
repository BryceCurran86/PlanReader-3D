name: GPT3 Floor Finish Activation Signed Material Trade
on:
  pull_request:
    branches: [main]
    paths:
      - tools/prepare_gpt3_pending_floor_surface_identity_activation.py
      - tests/test_gpt3_pending_floor_surface_identity_activation.py
      - tests/test_gpt3_floor_surface_activation_signed_material_trade.py
      - .github/workflows/test-gpt3-floor-activation-material-trade.yml
permissions:
  contents: read
jobs:
  original-source-floor-finish-not-false-tiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Actual FIRM source floor finish seal/customer → pre-certified trade activation
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_floor_surface_activation_signed_material_trade.py tests/test_gpt3_pending_floor_surface_identity_activation.py tests/test_live_floor_finish_area_source_closed_export.py tests/test_gpt3_signed_v2_family_unit_dimension_veto.py
          ruff check --select F821,F823 tools/prepare_gpt3_pending_floor_surface_identity_activation.py tests/test_gpt3_floor_surface_activation_signed_material_trade.py
