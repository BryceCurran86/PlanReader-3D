name: DIAG GPTMAX Lot16 After Semantic Face Protection

on:
  pull_request:
    branches:
      - gptmax/semantic-representative-opening-face-protection-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run real Lot16 semantic-face shadow
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_after_semantic_face_protection.py | tee lot16-after-semantic-face-protection.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-after-semantic-face-protection
          path: lot16-after-semantic-face-protection.json
          retention-days: 2
