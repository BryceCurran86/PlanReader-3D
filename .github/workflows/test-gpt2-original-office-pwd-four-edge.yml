name: TEST GPT2 Original OFFICE PWD Crosssheet Source Walls
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_original_room_four_edge_source_ink_shadow.py"
      - "tools/diag_gpt2_original_native_dimension_chain_shadow.py"
      - "tools/diag_gpt2_original_figured_face_rivals_shadow.py"
      - "pb_gpt2_original_source_geometry_bridge.py"
      - "tests/test_gpt2_original_native_dimension_chain_synthetic.py"
      - "tests/test_gpt2_ft2_internal_wall_face_basis.py"
      - "tests/test_gpt2_original_a502_dimension_chain_92_wall_notes.py"
      - "tests/test_gpt2_original_office_pwd_four_edge_crosssheet_source.py"
      - ".github/workflows/test-gpt2-original-office-pwd-four-edge.yml"
  workflow_dispatch:
jobs:
  source-witness-and-open-doorway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original PDF and source negative evidence
        env:
          PYTHONPATH: .
        run: |
          if [ -f documents/sources/Arch_Combined_Maryborough_Service_Station.pdf ]; then
            echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" | sha256sum --check
          else
            echo "::notice::Private original PDF unavailable on this merge checkout; synthetic source tests run, ORIGINAL SOURCE ACCEPTANCE REMAINS BLOCKED."
          fi
          python -m pytest -q -rs tests/test_gpt2_four_edge_source_ink_synthetic.py tests/test_gpt2_original_office_pwd_four_edge_crosssheet_source.py tests/test_gpt2_original_native_dimension_chain_synthetic.py tests/test_gpt2_ft2_internal_wall_face_basis.py tests/test_gpt2_original_a502_dimension_chain_92_wall_notes.py
          python -m py_compile tools/diag_gpt2_original_native_dimension_chain_shadow.py tools/diag_gpt2_original_figured_face_rivals_shadow.py pb_gpt2_original_source_geometry_bridge.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
