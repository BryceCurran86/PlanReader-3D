name: VR Real Workspace Review Export
on:
  pull_request:
    paths:
      - "pb_vr_editor_workspace_review_export.py"
      - "pb_editable_3d_inspector_panel.py"
      - "tests/editable_3d/test_vr_editor_workspace_review_export.py"
      - ".github/workflows/vr-workspace-review-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate untrusted, deterministic real workspace review scene
        run: |
          PYTHONPATH=.:tests python -m pytest -q tests/editable_3d/test_vr_editor_workspace_review_export.py
