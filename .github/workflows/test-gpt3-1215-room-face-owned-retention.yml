name: TEST GPT3 1215 Room Face Owned Retention

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pb_source_room_face_authority.py"
      - "tools/diag_gptmax_source_authority_stages.py"
      - "tools/verify_gpt3_room_face_owned_retention.py"
      - "tests/test_gpt3_room_face_owned_retention.py"
      - ".github/workflows/test-gpt3-1215-room-face-owned-retention.yml"
      - "tools/gpt3_original_source_preflight.py"
      - "tests/test_gpt3_original_source_preflight.py"
      - "scripts/copy_provisioned_originals_into_worktree.py"

permissions:
  contents: read

concurrency:
  group: gpt3-1215-room-face-owned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Room-face witness fail-closed tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_room_face_owned_retention.py
          python -m compileall -q pb_source_room_face_authority.py tools/diag_gptmax_source_authority_stages.py tools/verify_gpt3_room_face_owned_retention.py
          ruff check --select F821,F823 pb_source_room_face_authority.py tools/diag_gptmax_source_authority_stages.py tools/verify_gpt3_room_face_owned_retention.py tests/test_gpt3_room_face_owned_retention.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py

  original-before-after:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOURCE_SHA: "10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
      CANDIDATE_SHA: "0d2c064919ba65ded8c07f69cfbd0030eaa52ef0"
      BASELINE_ROOM_BLOB: "9ba005581e0d576fa6f6d376b2cc766e704bab8c"
      CANDIDATE_ROOM_BLOB: "86429e301b740ea2a478ea20bdbed8b0b51d062d"
      BASELINE_DIAG_BLOB: "3c298cdfefbf26146330094f9a2b68a7e3ca1e14"
      CANDIDATE_DIAG_BLOB: "abe213abbe90f3620017d35f4023ba2110940c5d"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Provision original sources
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: |
            1. Construction Plans - Lot 16 Power (REV E).pdf
      - name: Classify original source
        if: always()
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python3 -m tools.gpt3_original_source_preflight \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --expected-sha256 '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' \
            --output artifacts/original-source-preflight.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Immutable source and frozen truth
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python -m tools.gpt3_original_source_preflight \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --expected-sha256 "$SOURCE_SHA"
      - name: Produce exact room-face witness reports before and after 1215
        shell: bash
        run: |
          set -euo pipefail
          # Fixed historical pre-1215 original-source control: current PR base
          # already contains accepted 1215 and cannot prove the old->new
          # source-snapshot event. Keep both historical pinned Git blob gates.
          BASE_SHA="e579030e37606dfdd1b0d0b302b3f29138631552"
          git worktree add --detach /tmp/gpt3-room-base "$BASE_SHA"
          git fetch --no-tags origin "$CANDIDATE_SHA"
          git worktree add --detach /tmp/gpt3-room-candidate "$CANDIDATE_SHA"
          mkdir -p artifacts

          test "$(git -C /tmp/gpt3-room-base rev-parse HEAD:pb_source_room_face_authority.py)" = "$BASELINE_ROOM_BLOB"
          test "$(git -C /tmp/gpt3-room-candidate rev-parse HEAD:pb_source_room_face_authority.py)" = "$CANDIDATE_ROOM_BLOB"
          test "$(git -C /tmp/gpt3-room-base rev-parse HEAD:tools/diag_gptmax_source_authority_stages.py)" = "$BASELINE_DIAG_BLOB"
          test "$(git -C /tmp/gpt3-room-candidate rev-parse HEAD:tools/diag_gptmax_source_authority_stages.py)" = "$CANDIDATE_DIAG_BLOB"
          for root in /tmp/gpt3-room-base /tmp/gpt3-room-candidate; do
            cp "$GITHUB_WORKSPACE/pb_source_room_face_authority.py" "$root/pb_source_room_face_authority.py"
            cp "$GITHUB_WORKSPACE/tools/diag_gptmax_source_authority_stages.py" "$root/tools/diag_gptmax_source_authority_stages.py"
            PYTHONPATH=. python scripts/copy_provisioned_originals_into_worktree.py \
              --workspace "$GITHUB_WORKSPACE" \
              --worktree "$root" \
              --name '1. Construction Plans - Lot 16 Power (REV E).pdf'
            PYTHONPATH=. python -m tools.gpt3_original_source_preflight \
              --pdf "$root/documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
              --expected-sha256 "$SOURCE_SHA"
          done

          (
            cd /tmp/gpt3-room-base
            PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py               --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'               --page-id 3 --source-all-pages               --include-room-face-ownership-witnesses               --output "$GITHUB_WORKSPACE/artifacts/baseline.json"
          )
          (
            cd /tmp/gpt3-room-candidate
            PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py               --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'               --page-id 3 --source-all-pages               --include-room-face-ownership-witnesses               --output "$GITHUB_WORKSPACE/artifacts/candidate.json"
          )
      - name: Prove all owned room-face physical propositions
        env:
          PYTHONPATH: .
        run: |
          python tools/verify_gpt3_room_face_owned_retention.py             --baseline artifacts/baseline.json             --candidate artifacts/candidate.json             --output artifacts/room-face-retention.json
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("artifacts/baseline.json").read_text())
          after=json.loads(Path("artifacts/candidate.json").read_text())
          receipt=json.loads(Path("artifacts/room-face-retention.json").read_text())
          assert receipt["verified_room_face_owned_bijection"] is True
          assert receipt["owned_face_proposition_count"]==107
          assert receipt["room_publication_granted"] is False
          assert receipt["quantity_publication_granted"] is False
          assert receipt["benchmark_score_granted"] is False
          for report in (before, after):
              scopes=report["source_room_face_scopes"]
              assert len(scopes)==1
              result=scopes[0]["result"]
              assert len(result["records"])==61
              assert len(result["abstained_faces"])==41
              assert len(result["ownership_evaluation"]["owned_face_ids"])==107
              witness=report["source_room_face_owned_witness_scopes"]
              assert len(witness)==1
              assert len(witness[0]["owned_face_witnesses"])==107
              page3=[s for s in report["source_owned_wall_scopes"]
                     if str(s["page_id"])=="3"
                     and s["decision_scope_id"]=="wall-source:page-3"]
              assert len(page3)==1 and len(page3[0]["records"])==2094
          assert before["source_owned_wall_scopes"][0]["records"] == after["source_owned_wall_scopes"][0]["records"]
          print("GPT3_ROOM_FACE_OWNED_RETENTION", json.dumps(receipt,sort_keys=True))
          PY
      - name: Destroy private originals and unpublished source reports
        if: always()
        shell: bash
        run: |
          rm -rf documents/sources artifacts
          rm -f maryborough-*.json lot16-*.json
