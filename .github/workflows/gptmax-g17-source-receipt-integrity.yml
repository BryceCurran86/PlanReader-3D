name: GPT MAX G17 Source Receipt Integrity
on:
  pull_request:
    branches: [main, gptmax/g17-source-receipt-registration-20261020]
    paths:
      - "pb_source_visibility_authority.py"
      - "pb_physical_opening_authority.py"
      - "tests/test_raster_opening_receipt_registration.py"
      - "tests/test_raster_opening_cached_source_integrity.py"
      - ".github/workflows/gptmax-g17-source-receipt-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g17-receipt-integrity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Original-source registration, warmed caches and archived signed bodies
        run: |
          python -m pytest -q tests/test_raster_opening_receipt_registration.py tests/test_raster_opening_cached_source_integrity.py tests/test_raster_framed_opening_g17_contract.py tests/test_raster_source_visibility_v1.py tests/test_raster_connected_host_frame.py tests/test_raster_measurement_source_handoff.py tests/test_physical_opening_page_candidate_cache_v2.py tests/test_wall_opening_page_proof_cache.py tests/test_lot16_signed_eight_row_fixture.py
          ruff check --select F821,F823 pb_source_visibility_authority.py pb_physical_opening_authority.py tests/test_raster_opening_receipt_registration.py tests/test_raster_opening_cached_source_integrity.py
      - name: Validation policy integrity
        run: |
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py
