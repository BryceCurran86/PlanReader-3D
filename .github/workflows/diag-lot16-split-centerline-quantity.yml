name: DIAG Lot16 Split Centerline Quantity

on:
  pull_request:
    branches:
      - gpt4/raster-split-centerline-host-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run split-centerline host regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_opening_split_centerline_host.py \
            tests/test_raster_opening_whole_wall_host.py \
            tests/test_raster_opening_whole_wall_frame.py
      - name: Run exact Lot16 opening quantity stack
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/diag_lot16_split_centerline_quantity.py | tee lot16-split-centerline-quantity.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-split-centerline-quantity
          path: lot16-split-centerline-quantity.json
          retention-days: 1
