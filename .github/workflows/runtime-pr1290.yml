name: Runtime Snapshot PR1290
on:
  push:
    branches: [chatgpt/runtime-pr1290]
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf /tmp/pr1290.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr1290-snapshot
          path: /tmp/pr1290.tgz
          retention-days: 1
