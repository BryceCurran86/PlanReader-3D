name: SCORE GPT3 Lot16 1215 Opening-Local Supplemental Host

on:
  pull_request:
    branches: [main]
    paths:
      # every module the replayed production chain can import must re-run the signed-output replay
      - "pb_*.py"
      - "tools/diag_pdf_symbol_byte_glyph_shadow.py"
      - "tools/diag_original_pdf_active_clip_operator_authority.py"
      # GPT2 source interpretation now belongs to the production/sealed
      # import closure. Changes to any of these source readers must retrigger
      # both original signed-output replay checks, not only ordinary CI.
      - "tools/diag_gpt2_*.py"
      - "tools/diag_original_room_four_edge_source_ink_shadow.py"
      - "tools/run_source_closed_project_handoff.py"
      - "tools/diag_gptmax_raster_unhosted_flank_source.py"
      - "tools/diag_gptmax_source_authority_stages.py"
      - "tools/diag_lot16_room_face_scope.py"
      - "tools/run_gpt3_lot16_original_sealed_score_input.py"
      - "pb_raster_unchanged_band_segments.py"
      - "pb_source_visibility_authority.py"
      - "pb_physical_wall_candidate_authority.py"
      - "pb_opening_host_binding_authority.py"
      - "pb_live_wall_opening_authority_composition.py"
      - "pb_wall_room_topology_typed_negative_evidence.py"
      - "pb_source_closed_run_export.py"
      - "pb_customer_output_verification.py"
      - "pb_live_opening_area_quantity_publication.py"
      - "tools/prepare_gpt3_pending_identity_activation.py"
      - "tools/gpt3_original_source_preflight.py"
      - "tests/test_gpt3_original_source_preflight.py"
      - "tools/diag_native_multipath_cad_grid_source_shadow.py"
      - "tests/test_raster_unchanged_band_segments.py"
      - ".github/workflows/score-gpt3-lot16-1215-opening-local.yml"
  workflow_dispatch:

concurrency:
  group: gpt3-lot16-1215-opening-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Unchanged-source flank capture regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_raster_unchanged_band_segments.py \
            tests/test_raster_source_visibility_v1.py \
            tests/test_source_visibility_task3_hardening.py \
            tests/test_source_visibility_raster_idempotency.py \
            tests/test_gpt3_additive_snapshot_host_retention.py
          python -m compileall -q \
            pb_raster_unchanged_band_segments.py \
            pb_source_visibility_authority.py \
            pb_physical_wall_candidate_authority.py \
            pb_opening_host_binding_authority.py \
            pb_live_wall_opening_authority_composition.py
          ruff check --select F821,F823 \
            pb_raster_unchanged_band_segments.py \
            pb_source_visibility_authority.py \
            pb_physical_wall_candidate_authority.py \
            pb_opening_host_binding_authority.py \
            pb_live_wall_opening_authority_composition.py \
            tests/test_raster_unchanged_band_segments.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py
