name: SCORE GPT3 Lot16 1215 Opening-Local Supplemental Host

on:
  pull_request:
    branches: [main]
    paths:
      - "pb_raster_unchanged_band_segments.py"
      - "pb_source_visibility_authority.py"
      - "pb_physical_wall_candidate_authority.py"
      - "pb_opening_host_binding_authority.py"
      - "pb_live_wall_opening_authority_composition.py"
      - "pb_wall_room_topology_typed_negative_evidence.py"
      - "pb_source_closed_run_export.py"
      - "pb_customer_output_verification.py"
      - "pb_live_opening_area_quantity_publication.py"
      - "tools/prepare_gpt3_pending_identity_activation.py"
      - "tests/test_raster_unchanged_band_segments.py"
      - ".github/workflows/score-gpt3-lot16-1215-opening-local.yml"
  workflow_dispatch:

concurrency:
  group: gpt3-lot16-1215-opening-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Unchanged-source flank capture regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_raster_unchanged_band_segments.py \
            tests/test_raster_source_visibility_v1.py \
            tests/test_source_visibility_task3_hardening.py \
            tests/test_source_visibility_raster_idempotency.py \
            tests/test_gpt3_additive_snapshot_host_retention.py
          python -m compileall -q \
            pb_raster_unchanged_band_segments.py \
            pb_source_visibility_authority.py \
            pb_physical_wall_candidate_authority.py \
            pb_opening_host_binding_authority.py \
            pb_live_wall_opening_authority_composition.py
          ruff check --select F821,F823 \
            pb_raster_unchanged_band_segments.py \
            pb_source_visibility_authority.py \
            pb_physical_wall_candidate_authority.py \
            pb_opening_host_binding_authority.py \
            pb_live_wall_opening_authority_composition.py \
            tests/test_raster_unchanged_band_segments.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py

  original-source-score:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Exact original Lot16 source host and honest frame disposition
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          ROOT=artifacts/gpt3-lot16-1215-score
          mkdir -p "$ROOT"
          git rev-parse HEAD > "$ROOT/producer_head_sha.txt"
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check

          python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" \
            --page-id 3 \
            --source-all-pages \
            --include-identity-text-receipts \
            --output "$ROOT/source-report.json"

          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/gpt3-lot16-1215-score")
          d=json.loads((root/"source-report.json").read_text())
          target="physical_opening_existence_2b2a91e8afaf8b7e9a3e07605a80a4a9"
          binding=next(x for x in d["opening_bindings"]
                       if x["opening_identity_id"]==target)
          frame=next(x for x in d["host_frame_traces"]
                     if x["opening_identity_id"]==target)
          canonical=next(x for x in d["canonical_openings"]
                         if x["physical_opening_id"]==target)

          assert d["source_sha256"]=="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert d["primitive_safety_cap"]==20000
          assert binding["status"]=="corroborated", binding
          assert binding["record_id"] and binding["host_wall_id"]
          assert "opening_local_supplemental_source_band_host_resolved" in binding["reason_codes"], binding
          # Figured-area publication requires a source-authenticated host, not
          # an independently complete opening void / whole-wall frame.
          # Preserve the true frame disposition in artifacts without upgrading it.
          assert canonical["host_binding_record_id"]==binding["record_id"]
          if frame["status"]=="corroborated":
              assert canonical["host_frame_record_id"]==frame["record_id"]
          else:
              assert not canonical.get("host_frame_record_id"), canonical
          assert canonical["area_basis"]=="figured_opening_label"
          assert canonical["area_m2"] is not None and canonical["area_m2"] > 0
          print("1215 SOURCE HOST CORROBORATED; FRAME DISPOSITION RETAINED",json.dumps({
              "physical_opening_id":target,
              "host_binding_record_id":binding["record_id"],
              "frame_status":frame["status"],
              "host_frame_record_id":frame.get("record_id"),
              "source_area_m2":canonical["area_m2"],
          },sort_keys=True))
          PY

      - name: Seal exact original production and customer rows
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          ROOT=artifacts/gpt3-lot16-1215-score
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          python -u -m tools.run_gpt3_lot16_original_sealed_score_input \
            --pdf "$PDF" \
            --output-dir "$ROOT/production"

          python - <<'PY'
          import json
          from pathlib import Path
          from pb_customer_output_verification import verify_sealed_customer_output
          from pb_source_closed_run_export import sealed_source_closed_run_from_dict

          root=Path("artifacts/gpt3-lot16-1215-score")
          source=json.loads((root/"source-report.json").read_text())
          target="physical_opening_existence_2b2a91e8afaf8b7e9a3e07605a80a4a9"
          canonical=next(x for x in source["canonical_openings"]
                         if x["physical_opening_id"]==target)

          prod=root/"production"
          sealed=sealed_source_closed_run_from_dict(json.loads(
              (prod/"source_sealed_run.json").read_text()
          ))
          rows=json.loads((prod/"verified_customer_rows.json").read_text())
          verified=verify_sealed_customer_output(sealed, rows)
          target_rows=[
              q for q in sealed.quantities
              if tuple(q.object_identity_refs)==(target,)
          ]
          assert len(target_rows)==1, target_rows
          quantity=target_rows[0]
          assert quantity.family=="opening_area"
          assert quantity.lineage_ok is True and quantity.abstained is False
          assert quantity.value==canonical["area_m2"]
          assert quantity.quantity_id in set(verified.verified_quantity_ids)
          assert verified.valid_quantity_count==len(sealed.quantities)
          assert verified.customer_row_count==len(sealed.quantities)

          baseline=json.loads(Path(
              "docs/engineering/lot16_original_identity_reconciliation_20261012/source_sealed_run.json"
          ).read_text())
          old_by_id={q["quantity_id"]:q for q in baseline["quantities"]}
          new_by_id={q.quantity_id:q for q in sealed.quantities}
          assert set(old_by_id) <= set(new_by_id), (
              set(old_by_id)-set(new_by_id)
          )
          for qid, old in old_by_id.items():
              current=new_by_id[qid]
              assert current.value==old["value"], (qid, old["value"], current.value)
              assert current.unit==old["unit"]
              assert tuple(current.object_identity_refs)==tuple(old["object_identity_refs"])
          old_physical={
              tuple(q["object_identity_refs"])
              for q in baseline["quantities"]
          }
          new_physical={
              tuple(q.object_identity_refs)
              for q in sealed.quantities
          }
          assert old_physical <= new_physical
          assert (target,) in new_physical - old_physical
          assert len(sealed.quantities)==len(baseline["quantities"])+1
          print("NEW FIRM LOT16 QUANTITY",json.dumps({
              "quantity_id":quantity.quantity_id,
              "physical_opening_id":target,
              "value":quantity.value,
              "unit":quantity.unit,
              "sealed_count":len(sealed.quantities),
              "customer_parity":True,
          },sort_keys=True))
          PY

      - name: Reauthenticate pending 1215 identity from original source
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          ROOT=artifacts/gpt3-lot16-1215-score
          python -m tools.diag_gpt3_lot16_1215_identity_readiness \
            --source-report "$ROOT/source-report.json" \
            --object-universe benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/object_universe.json \
            --source-manifest benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/source_manifest.json \
            --sealed-run docs/engineering/lot16_original_identity_reconciliation_20261012/source_sealed_run.json \
            --active-identity-map docs/engineering/lot16_original_identity_reconciliation_20261012/identity_map.json \
            --output "$ROOT/1215-pending.json"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/gpt3-lot16-1215-score")
          report=json.loads((root/"source-report.json").read_text())
          pending=json.loads((root/"1215-pending.json").read_text())
          target=pending["physical_opening_id"]
          original=next(
              row for row in report["opening_identity_text_receipts"]
              if row["opening_identity_id"]==target
          )
          canonical=next(
              row for row in report["canonical_openings"]
              if row["physical_opening_id"]==target
          )
          proof={
              "source_sha256":pending["source_sha256"],
              "bindings":[{
                  "benchmark_item_id":pending["benchmark_item_id"],
                  "benchmark_object_ref":pending["benchmark_object_ref"],
                  "physical_opening_id":target,
                  "original_label_locations":original,
                  "frozen_source_bbox_pdf_pt":pending["frozen_source_bbox_pdf_pt"],
                  "canonical_opening":{
                      **canonical,
                      "semantic_class":"opening",
                  },
              }],
          }
          (root/"1215-source-identity-proof.json").write_text(
              json.dumps(proof,sort_keys=True,indent=2)+"\n"
          )
          PY

      - name: Activate exact identity and run unchanged 27-object evaluator
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          ROOT=artifacts/gpt3-lot16-1215-score
          python -m tools.run_gpt3_guarded_pending_reconciliation \
            --pending-ledger "$ROOT/1215-pending.json" \
            --sealed-run "$ROOT/production/source_sealed_run.json" \
            --customer-rows "$ROOT/production/verified_customer_rows.json" \
            --active-identity-map docs/engineering/lot16_original_identity_reconciliation_20261012/identity_map.json \
            --manifest benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/source_manifest.json \
            --source-identity-proof "$ROOT/1215-source-identity-proof.json" \
            --object-universe benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_lot16_power/object_universe.json \
            --output-map "$ROOT/identity_map_with_1215.json" \
            --output-activation-receipt "$ROOT/activation_receipt.json" \
            --output-report "$ROOT/exact_project_report.json"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/gpt3-lot16-1215-score")
          baseline=json.loads(Path(
              "docs/engineering/lot16_original_identity_reconciliation_20261012/exact_project_report.json"
          ).read_text())
          report=json.loads((root/"exact_project_report.json").read_text())
          activation=json.loads((root/"activation_receipt.json").read_text())
          assert activation["activated_count"]==1
          assert report["source_sha_verified"] is True
          assert report["reconciliation_complete"] is True
          assert report["denominator"]==baseline["denominator"]==27
          assert report["matched_within_tolerance"]==(
              baseline["matched_within_tolerance"]+1
          ), (baseline,report)
          assert report["matched_outside_tolerance"]==0
          assert report["partial"]==0
          assert report["unresolved"]==0
          assert report["unsupported_extra"]==0
          assert report["lineage_conflicts"]==0
          print("VERIFIED LOT16 SCORE",json.dumps({
              "denominator":report["denominator"],
              "matched_within_tolerance":report["matched_within_tolerance"],
              "matched_outside_tolerance":report["matched_outside_tolerance"],
              "missed":report["missed"],
              "partial":report["partial"],
              "unresolved":report["unresolved"],
              "unsupported_extra":report["unsupported_extra"],
              "coverage_accuracy":report["coverage_accuracy"],
              "precision_adjusted_accuracy":report["precision_adjusted_accuracy"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-lot16-1215-opening-local-score
          path: artifacts/gpt3-lot16-1215-score
          retention-days: 30
