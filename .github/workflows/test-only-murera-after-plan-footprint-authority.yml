name: TEST-ONLY Murera After Plan Footprint Authority

on:
  pull_request:
    branches: [main]

jobs:
  murera-after-authority:
    if: startsWith(github.head_ref, 'diag/murera-after-plan-footprint-authority')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Murera benchmark on authority candidate
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine

          benchmark_id="tenders_ke_murera_science_lab"
          url="https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          expected="84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b"
          source=Path("/tmp/murera.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Murera-after-plan-authority/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              source.write_bytes(r.read())
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual}")

          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(source,collect_item35_shadow=False)
          focus_tags={
              "floor_screed","substructure_surface_bed","substructure_bed_dpm",
              "substructure_a142_mesh","damp_proof_course","perimeter_walling"
          }
          focus=[
              {
                  "tag":p.tag,
                  "quantity":p.quantity,
                  "unit":p.unit,
                  "source_page":p.source_page,
                  "dimensions":p.dimensions,
                  "description":p.description,
                  "metadata":p.metadata,
              }
              for p in preds if p.tag in focus_tags
          ]
          report=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/murera-after-plan-authority",
          ).evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              predictions=[p.to_dict() for p in preds],
              auto_extract=False,
          )
          out={
              "candidate_sha":"89b24f7c96d38de9f9a942934e95d92b28bd5d2a",
              "source_sha256":actual,
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "hallucinated":int(report.hallucinated_items),
              "focus_predictions":focus,
              "items":[i.to_dict() for i in report.item_results],
              "extraction_status":ex.extraction_status,
          }
          print("MURERA_AFTER_PLAN_FOOTPRINT_AUTHORITY="+json.dumps(out,sort_keys=True,default=str),flush=True)
          PY
