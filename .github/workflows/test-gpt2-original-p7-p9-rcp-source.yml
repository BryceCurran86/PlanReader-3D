name: TEST GPT2 Original RCP Floor Plan Source Registration

on:
  pull_request:
    paths:
      - tests/test_gpt2_original_p7_p9_rcp_crosssheet_walls.py
      - .github/workflows/test-gpt2-original-p7-p9-rcp-source.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  original-p7-p9-wall-ink-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original source test dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Prove original source relationship without promoting ceiling area
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_p7_p9_rcp_crosssheet_walls.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
