name: DIAG Lot16 Material Semantic Dropout

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace material semantics
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_material_semantic_dropout.py | tee material-dropout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-material-semantic-dropout
          path: material-dropout.json
          retention-days: 1
