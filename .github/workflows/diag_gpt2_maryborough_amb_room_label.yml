name: DIAG GPT2 Maryborough Ambulant Room Labels

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Trace M-AMB and F-AMB source authority
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-maryborough-amb-room-label
          git rev-parse HEAD > artifacts/gpt2-maryborough-amb-room-label/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-amb-room-label/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_amb_room_label.py \
            | tee artifacts/gpt2-maryborough-amb-room-label/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-amb-room-label
          path: artifacts/gpt2-maryborough-amb-room-label
          retention-days: 1
