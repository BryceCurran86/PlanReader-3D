name: DIAGNOSTIC Ghazi Ceiling Source Chain — DO NOT MERGE

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose-ghazi-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and SHA-verify registered source
        run: |
          set -euo pipefail
          mkdir -p /tmp/planreader-diagnostic
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf" \
            -o /tmp/planreader-diagnostic/source.pdf
          echo "c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/planreader-diagnostic/source.pdf" | sha256sum -c -

      - name: Trace source-owned ceiling authority chain
        env:
          PYTHONPATH: .
        run: |
          python scripts/diagnose_ceiling_source_chain.py \
            --pdf /tmp/planreader-diagnostic/source.pdf \
            --page 167 \
            --sha256 c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f \
            --document-id ghazi-ceiling-source-diagnostic \
            --output /tmp/planreader-diagnostic/ceiling-source-chain.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ghazi-ceiling-source-chain
          path: /tmp/planreader-diagnostic/ceiling-source-chain.json
          if-no-files-found: error
