name: DIAG Raster Candidate Closure

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-v1

jobs:
  contracts-and-lot16:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run opening and semantic closure contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_framed_opening_g17_contract.py \
            tests/test_raster_door_swing_g17_contract.py \
            tests/test_raster_swing_registration_authority.py \
            tests/test_raster_opening_primitive_compaction.py \
            tests/test_semantic_opening_enumeration_authority_v1.py \
            tests/test_opening_universe_completeness_source_adapter_v1.py \
            tests/test_live_wall_opening_authority_composition.py
      - name: Run focused Lot16 opening quantity stack
        run: |
          PYTHONPATH=. python tools/diag_lot16_opening_quantity_stack.py | tee lot16-opening-quantity-stack.json
      - name: Run real Lot16 all-family handoff
        run: |
          mkdir -p artifacts/lot16
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --project-id au_qld_lot16_power \
            --workspace-id 1 \
            --family-group all \
            --output-dir artifacts/lot16 \
            | tee artifacts/lot16/handoff.stdout.json
      - name: Print delta
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path("lot16-opening-quantity-stack.json")
          if q.exists():
              data=json.loads(q.read_text())
              keys=("physical_opening_record_count","host_bound_count","host_frame_resolved_count","canonical_opening_count","canonical_host_resolved_count","canonical_kind_resolved_count","canonical_area_resolved_count","quantity_count","wall_opening_status","opening_composition_status")
              print("OPENING_STACK",json.dumps({k:data.get(k) for k in keys},indent=2,sort_keys=True))
          p=Path("artifacts/lot16/production_summary.json")
          if p.exists():
              data=json.loads(p.read_text())
              print("HANDOFF",json.dumps({
                  "status":data.get("status"),
                  "claim_status":data.get("claim_status"),
                  "family_counts":data.get("family_counts"),
                  "combined_quantity_count":data.get("combined_quantity_count"),
                  "claim_reason_codes":data.get("claim_reason_codes"),
                  "canonical_counts":data.get("canonical_counts"),
              },indent=2,sort_keys=True))
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-candidate-closure-lot16
          path: |
            lot16-opening-quantity-stack.json
            artifacts/lot16
          retention-days: 2
