name: DIAG GPT1 Maryborough Support Room Geometry

on:
  pull_request:
    branches: [ main ]

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Compare plan-like room geometry sources
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          targets=[
            "FOOD PREP","COLD ROOM","FREEZER","WASH UP","M-AMB","F-AMB",
            "FOOD SERVICE","SALES","POS COUNTER","TRUCK DRIVER LOUNGE","DRY STORE"
          ]
          cases={
            "primary_floor_plan":{"pages":(6,), "topology_pages":(6,)},
            "floor_finishes_partitions":{"pages":(10,), "topology_pages":(10,)},
            "reflected_ceiling_plan":{"pages":(8,), "topology_pages":(8,)},
          }
          out={}
          for name,kwargs in cases.items():
              try:
                  claim=collect_live_physical_net_wall_claim(path, **kwargs)
                  labels={}
                  for room in claim.canonical_rooms:
                      label=" ".join(str(room.room_label or "").upper().split())
                      if label:
                          labels[label]=labels.get(label,0)+1
                  firm=[
                      q for q in claim.room_area_quantity_evidence
                      if not q.abstained and q.value is not None
                  ]
                  by_label={}
                  for q in firm:
                      label=" ".join(str((q.metadata or {}).get("room_label") or "").upper().split())
                      by_label.setdefault(label,[]).append(q.value)
                  out[name]={
                      "status":getattr(claim.status,"value",str(claim.status)),
                      "reason_codes":list(claim.reason_codes),
                      "canonical_room_count":len(claim.canonical_rooms),
                      "canonical_floor_count":len(claim.canonical_floors),
                      "canonical_space_count":len(claim.canonical_spaces),
                      "labeled_room_count":sum(labels.values()),
                      "target_label_counts":{t:labels.get(t,0) for t in targets},
                      "firm_room_area_count":len(firm),
                      "target_firm_areas":{t:by_label.get(t,[]) for t in targets},
                  }
              except Exception as exc:
                  out[name]={"error":f"{type(exc).__name__}: {exc}"}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
