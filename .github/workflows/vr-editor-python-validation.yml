name: VR Editor Python Protocol
on:
  pull_request:
    paths:
      - "pb_vr_editor_*.py"
      - "tests/editable_3d/test_vr_editor_*.py"
      - ".github/workflows/vr-editor-python-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test source-bound scene, auth, command and CSRF protocol
        run: |
          PYTHONPATH=.:tests python -m pytest -q \
            tests/editable_3d/test_vr_editor_scene_manifest.py \
            tests/editable_3d/test_vr_editor_readonly_wsgi.py \
            tests/editable_3d/test_vr_editor_command_preview.py \
            tests/editable_3d/test_vr_editor_command_wsgi.py
