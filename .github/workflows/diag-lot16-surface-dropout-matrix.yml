name: DIAG Lot16 Surface Dropout Matrix

on:
  pull_request:
    branches:
      - gptmax/text-trace-ownership-bleed-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run Lot16 surface dropout matrix
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_surface_dropout_matrix.py | tee lot16-surface-dropout-matrix.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-surface-dropout-matrix
          path: lot16-surface-dropout-matrix.json
          retention-days: 1
