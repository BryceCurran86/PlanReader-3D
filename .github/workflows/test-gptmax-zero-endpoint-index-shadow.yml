name: GPT MAX Original Full Page Endpoint Index Shadow
on:
  pull_request:
    paths:
      - pb_wall_room_topology_stage_a.py
      - pb_wall_room_topology_wall_assembly.py
      - tools/diag_gptmax_full_foreground_run_source.py
      - scripts/gptmax_full_page_exact_endpoint_shadow.py
      - tests/test_wall_room_topology_zero_snap_index_shadow.py
      - tests/test_gptmax_full_page_exact_endpoint_shadow.py
      - tests/test_gptmax_w4_identity_abstention_shadow.py
      - docs/engineering/gptmax_zero_endpoint_index_shadow.md
      - docs/engineering/gptmax_w4_node_identity_abstention_shadow.md
      - .github/workflows/test-gptmax-zero-endpoint-index-shadow.yml
concurrency:
  group: gptmax-zero-index-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_wall_room_topology_zero_snap_index_shadow.py tests/test_gptmax_full_page_exact_endpoint_shadow.py tests/test_wall_room_topology_snap_index.py tests/test_wall_room_topology_stage_a.py tests/test_wall_room_topology_collinear_merge_index.py tests/test_gptmax_exact_endpoint_flank_shadow.py tests/test_gptmax_full_foreground_run_source.py tests/test_gptmax_full_foreground_flank_stages.py tests/test_gptmax_cross_opening_source_usage.py
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_w4_identity_abstention_shadow.py tests/test_wall_room_topology_wall_assembly.py tests/test_wall_room_topology_junction_classifier.py
          ruff check --select F821,F823 pb_wall_room_topology_stage_a.py tools/diag_gptmax_full_foreground_run_source.py scripts/gptmax_full_page_exact_endpoint_shadow.py tests/test_wall_room_topology_zero_snap_index_shadow.py tests/test_gptmax_full_page_exact_endpoint_shadow.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
  original-full-page:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Independent original PR-base production receipt control
        run: |
          git rev-parse HEAD > zero-index-head.txt
          git worktree add --detach /tmp/gptmax-zero-index-base "${{ github.event.pull_request.base.sha }}"
          (
            cd /tmp/gptmax-zero-index-base
            PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
              --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
              --page-id 3 --output "$GITHUB_WORKSPACE/zero-index-base-production.json"
          )
      - name: Original full-page shadow and independent production receipts
        run: |
          PYTHONPATH=. python -u scripts/gptmax_full_page_exact_endpoint_shadow.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 \
              --w4-identity-abstention-shadow \
            --expected-source-sha 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output zero-index-full-page-source.json
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --output zero-index-head-production.json
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from tools.declared_additive_source_retention import assert_unchanged_or_declared
          r=json.loads(Path('zero-index-full-page-source.json').read_bytes())
          p=json.loads(Path('zero-index-head-production.json').read_bytes())
          baseline_bytes=Path('zero-index-base-production.json').read_bytes()
          candidate_bytes=Path('zero-index-head-production.json').read_bytes()
          if baseline_bytes!=candidate_bytes:
              assert_unchanged_or_declared(json.loads(baseline_bytes),p,
                                           message="original source production changed")
          assert p['summary']=={'physical_existence_claims':21,'host_bindings':15,'host_frames':9}
          assert p['primitive_safety_cap']==r['source_primitive_safety_cap']==20000
          assert p['source_sha256']==r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['original_source_reauthenticated'] is True
          assert r['default_production_state_unchanged'] is True
          assert r['identical_full_page_source_inputs_for_both_modes'] is True
          assert r['full_source_input_primitive_count']==10099<=20000
          assert len(r['local_legacy_exact_controls'])==7
          assert all(c['complete_local_legacy_graph_equal'] is True for c in r['local_legacy_exact_controls'])
          for key in ('complete_full_page_legacy_zero_graph_equality_proven',
                      'full_page_scope_is_authenticated_floor_plan_viewport','physical_wall_authority',
                      'physical_equivalence_proven','source_parent_transfer_allowed',
                      'structural_source_universe_complete','host_publication_allowed',
                      'opening_count_publication_allowed','metric_quantity_publication_allowed'):
              assert r[key] is False
          assert r['benchmark_accuracy'] is None
          for mode in ('default_full_page_shadow','indexed_exact_endpoint_full_page_shadow'):
              graph=r[mode]['source_graph']
              if graph is None:
                  assert mode=='indexed_exact_endpoint_full_page_shadow'
                  assert r[mode]['opening_rows'] is None
                  assert r[mode]['w4_assembly_status']=='abstained'
                  receipt=r[mode]['first_failure_receipt']
                  assert receipt['reason_codes']==['a wall candidate cannot start and end at the same node']
                  assert receipt['end_node_ids'][0]==receipt['end_node_ids'][1]
                  assert receipt['only_first_assembly_failure_observed'] is True
                  assert receipt['w4_candidate_universe_available'] is False
                  assert receipt['physical_wall_authority'] is False and receipt['host_publication_allowed'] is False
                  assert receipt['actual_owned_w3_fragment_rows']
                  assert all(e['w3_retained'] is True and e['physical_host_authority'] is False for e in receipt['actual_owned_w3_fragment_rows'])
                  spans=r[mode]['source_span_rows_before_w4']
                  assert len(spans)==7
                  for row in spans:
                      assert row['w4_membership_available'] is False and row['host_publication_allowed'] is False
                      for flank in row['flanks']:
                          for pixel in flank['source_run_rows']:
                              assert pixel['w4_membership_available'] is False
                              coverage=pixel['exact_source_span_coverage']
                              assert coverage['combined_graph_edge_created'] is False
                              assert coverage['physical_wall_authority'] is False and coverage['host_publication_allowed'] is False
                              assert all(e['experimental_w4_candidate_ids'] is None and e['physical_host_authority'] is False for e in pixel['actual_w2_edge_rows'])
                  continue
              assert graph['input_source_count']==10099
              assert graph['scope_authority'].startswith('full-page diagnostic only')
              assert graph['physical_equivalence_proven'] is False and graph['host_publication_allowed'] is False
              assert graph['w4_edge_map_consistent'] is True
              assert len(graph['source_parent_census'])==10099
              assert all(e['physical_host_authority'] is False for e in graph['all_w2_edges'])
              assert len(r[mode]['opening_rows'])==7
              for row in r[mode]['opening_rows']:
                  for flank in row['flanks']:
                      for pixel in flank['source_run_rows']:
                          c=pixel['exact_source_span_coverage']
                          assert c['combined_graph_edge_created'] is False
                          assert c['physical_wall_authority'] is False and c['host_publication_allowed'] is False
          third=r['indexed_w4_identity_abstention_full_page_shadow']
          assert third['identical_original_full_page_source_inputs'] is True
          assert third['partial_candidates_are_complete_physical_wall_universe'] is False
          assert third['w4_assembly_status']=='abstained'
          graph=third['source_graph']
          assert graph['input_source_count']==10099
          assert graph['all_actual_w3_edges_have_w4_chain_disposition'] is True
          assert graph['w4_source_parent_inventory_validated'] is True
          assert graph['w4_candidate_universe_complete'] is False
          assert graph['structural_source_universe_complete'] is False
          assert graph['host_publication_allowed'] is False
          assert graph['opening_count_publication_allowed'] is False and graph['metric_quantity_publication_allowed'] is False
          edges={e['edge_id']:e for e in graph['all_w2_edges']}
          retained={key for key,e in edges.items() if e['w3_retained']}
          candidate=[key for w in graph['all_experimental_w4_candidates'] for key in w['w2_edge_ids']]
          abstained=[]
          assert graph['all_w4_abstained_chain_rows']
          for attempt in graph['all_w4_abstained_chain_rows']:
              assert attempt['status']=='abstained' and attempt['candidate_membership_available'] is False
              assert attempt['source_parents_authenticated'] is False
              assert attempt['reason_codes']
              assert set(attempt['reason_codes']) <= {
                  'a wall candidate cannot start and end at the same node',
                  'w4_boundary_junction_identity_ambiguous',
                  'w4_relationship_junction_identity_ambiguous',
                  'w4_coincident_endpoint_geometry_ambiguous',
                  'w4_non_simple_chain_topology_ambiguous'}
              if 'a wall candidate cannot start and end at the same node' in attempt['reason_codes']:
                  assert attempt['end_node_ids'][0]==attempt['end_node_ids'][1]
              assert attempt['host_publication_allowed'] is False and attempt['physical_wall_authority'] is False
              for fragment in attempt['actual_owned_w3_fragment_rows']:
                  key=fragment['edge_id']; abstained.append(key)
                  assert fragment['w3_retained'] is True and fragment['physical_host_authority'] is False
                  assert fragment['source_observation_ids']==edges[key]['source_observation_ids']
                  assert fragment['w2_fragment_geometry_pt']==edges[key]['w2_fragment_geometry_pt']
                  assert edges[key]['w4_candidate_membership_available'] is False
          assert len(set(candidate))==len(candidate) and len(set(abstained))==len(abstained)
          assert not set(candidate)&set(abstained) and set(candidate)|set(abstained)==retained
          assert len(third['opening_rows'])==7
          for row in third['opening_rows']:
              for flank in row['flanks']:
                  for pixel in flank['source_run_rows']:
                      assert pixel['host_publication_allowed'] is False and pixel['physical_equivalence_proven'] is False
                      coverage=pixel['exact_source_span_coverage']
                      assert coverage['combined_graph_edge_created'] is False and coverage['physical_wall_authority'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-full-page-zero-index
          retention-days: 30
          path: |
            zero-index-head.txt
            zero-index-base-production.json
            zero-index-head-production.json
            zero-index-full-page-source.json
