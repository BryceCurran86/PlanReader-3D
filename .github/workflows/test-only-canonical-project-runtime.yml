name: TEST-ONLY Canonical Project Runtime

on:
  pull_request:
    branches: [main]

jobs:
  project-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: kstvet
            benchmark: tenders_ke_kstvet_cbc_classroom
            filename: 1727358888238-bq-nd-drawing.pdf
            url: https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf
            sha256: 6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc
          - project: murera
            benchmark: tenders_ke_murera_science_lab
            filename: 1785347143869-bqs-drawings.pdf
            url: https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf
            sha256: 84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b
          - project: ghazi
            benchmark: tenders_ke_ghazi_science_lab
            filename: 1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            url: https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
            sha256: c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f
          - project: lamu
            benchmark: tenders_ke_lamu_ishakani_ecd_classrooms
            filename: lamu-ishakani-ecd-classrooms-boq.pdf
            url: https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf
            sha256: fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2
          - project: umma
            benchmark: tenders_ke_umma_hostels
            filename: umma-university-hostels-builders-work.pdf
            url: https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf
            sha256: f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and verify exact source
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_SHA: ${{ matrix.sha256 }}
          SOURCE_FILE: ${{ matrix.filename }}
        run: |
          mkdir -p benchmarks/sources
          curl -L --fail --retry 3 -o "benchmarks/sources/$SOURCE_FILE" "$SOURCE_URL"
          echo "$SOURCE_SHA  benchmarks/sources/$SOURCE_FILE" | sha256sum -c -
      - name: Run one canonical project with timing
        env:
          BENCHMARK_ID: ${{ matrix.benchmark }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/runtime-$PROJECT"
          start=$(date +%s)
          PYTHONUNBUFFERED=1 PYTHONPATH=. python -u pb_benchmark_accuracy_engine.py             --benchmark "$BENCHMARK_ID"             --require-local-sources             --output-dir "/tmp/runtime-$PROJECT"             | tee "/tmp/runtime-$PROJECT/console.log"
          end=$(date +%s)
          echo "PROJECT_RUNTIME_SECONDS=$((end-start))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-project-runtime-${{ matrix.project }}
          path: /tmp/runtime-${{ matrix.project }}
