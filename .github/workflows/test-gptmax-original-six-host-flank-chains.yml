name: GPT MAX Original Six Host Flank Endpoint Chains
on:
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gptmax_source_flank_endpoint_chain.py
      - tests/test_gptmax_source_flank_endpoint_chain.py
      - docs/engineering/gptmax_source_flank_endpoint_chain_20261016.md
      - .github/workflows/test-gptmax-original-six-host-flank-chains.yml
  push:
    branches: [main]
    paths:
      - tools/diag_gptmax_source_flank_endpoint_chain.py
      - tests/test_gptmax_source_flank_endpoint_chain.py
      - docs/engineering/gptmax_source_flank_endpoint_chain_20261016.md
      - .github/workflows/test-gptmax-original-six-host-flank-chains.yml
permissions:
  contents: read
jobs:
  original-source-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Exact G17/W2/W4 original negative and immutable-identity tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_source_flank_endpoint_chain.py
          python -m compileall -q tools/diag_gptmax_source_flank_endpoint_chain.py
          ruff check --select F821,F823 tools/diag_gptmax_source_flank_endpoint_chain.py tests/test_gptmax_source_flank_endpoint_chain.py
      - name: SHA-check original PDF and preserve every archived competing source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA=10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum -c
          PYTHONPATH=. python tools/diag_gptmax_source_flank_endpoint_chain.py \
            --ledger docs/engineering/gptmax_lot16_host_source_queue_20261016.json \
            --sha256 "$SHA" --output artifacts/six-archived-g17-flank-chains.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/six-archived-g17-flank-chains.json').read_text())
          assert len(d['source_rows'])==6
          assert d['archived_ledger_only_not_fresh_producer_receipt']
          assert not d['original_pdf_reauthenticated_by_this_function']
          assert not any(d[x] for x in ('host_authority_granted','frame_authority_granted',
              'opening_count_granted','ordered_dimensions_granted',
              'customer_quantity_granted'))
          for row in d['source_rows']:
              assert not row['original_W4_host_record_granted']
              assert not row['new_frame_granted']
              assert not row['measured_width_height_granted']
              assert not row['customer_quantity_granted']
              assert row['first_unmapped_flank'] in row['existing_original_host_reasons']
          PY
      - name: Independently reissue original selected producer receipts
        run: |
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --output artifacts/fresh-original-lot16-wall-opening-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('docs/engineering/gptmax_lot16_host_source_queue_20261016.json').read_text())
          source=json.loads(Path('artifacts/fresh-original-lot16-wall-opening-source.json').read_text())
          assert source['source_sha256']==ledger['source_sha256']
          assert source['snapshot_id']==ledger['snapshot_id']
          assert source['primitive_safety_cap']==20000
          assert len(source['opening_bindings'])==21
          assert sum(bool(r['record_id']) for r in source['opening_bindings'])==15
          assert sum(bool(r['record_id']) for r in source['host_frames'])==9
          missing={r['opening_identity_id'] for r in source['opening_bindings']
                   if not r['record_id']}
          archived={r['physical_opening_id'] for r in ledger['case_evidence']
                    if r['host_binding']['status']=='abstained'}
          assert missing==archived and len(missing)==6
          print('Original same snapshot, 21/15/9 and six missing IDs verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-six-unhosted-endpoint-chains
          path: artifacts/*.json
          retention-days: 21
