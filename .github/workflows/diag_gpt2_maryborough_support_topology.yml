name: DIAG GPT2 Maryborough Support View Topology

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe support-view topology
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-maryborough-support-topology
          git rev-parse HEAD > artifacts/gpt2-maryborough-support-topology/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-support-topology/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_support_view_topology.py \
            | tee artifacts/gpt2-maryborough-support-topology/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-support-topology
          path: artifacts/gpt2-maryborough-support-topology
          retention-days: 1
