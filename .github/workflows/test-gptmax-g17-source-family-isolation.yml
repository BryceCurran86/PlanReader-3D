name: GPT MAX original G17 source family isolation
on:
  pull_request:
    branches: [main, gptmax/retain-individual-g17-original-flank-20261017]
    paths:
      - pb_physical_wall_candidate_authority.py
      - tests/test_gptmax_new_g17_source_family_isolation.py
      - .github/workflows/test-gptmax-g17-source-family-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-family-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_gptmax_new_g17_source_family_isolation.py
