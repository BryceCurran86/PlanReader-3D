name: DIAG GPT1 Figured Dimension Text Frame

on:
  push:
    branches:
      - gpt1/figured-dimension-text-enclosure-filter-v1

concurrency:
  group: diag-gpt1-figured-dimension-text-frame
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused figured-dimension tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_figured_dimension_text_enclosure_filter_v1.py             tests/test_figured_dimension_line_fragment_merge_v1.py             tests/test_figured_dimension_native_direction_style_v1.py             tests/test_figured_dimension_page_parse_cache_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Probe real Lot16 page 3 dimensions
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          from pb_cross_view_room_area_authority import (
              _trusted_native_dimensions_for_page,
          )
          from pb_figured_dimension_evidence import (
              BindingStatus,
              extract_dimension_evidence_bundle,
          )
          from pb_source_visibility_authority import SourceVisibilityProducer

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          payload=path.read_bytes()
          pdf=fitz.open(stream=payload,filetype="pdf")
          try:
              bundle=extract_dimension_evidence_bundle(
                  pdf.load_page(2),
                  page_num=3,
                  view_type="floor_plan",
              )
          finally:
              pdf.close()

          by_id={o.dimension_id:o for o in bundle.observations}
          target_values={1620.0,1900.0,2890.0,6000.0,6490.0}
          targets=[]
          for b in bundle.bindings:
              o=by_id.get(b.observation_id)
              if o is None:
                  continue
              value_mm=float(o.value_m)*1000.0
              if value_mm not in target_values:
                  continue
              targets.append({
                  "value_mm":value_mm,
                  "raw_text":o.raw_text,
                  "status":b.status,
                  "dimension_line_id":b.dimension_line_id,
                  "witness_line_ids":list(b.witness_line_ids),
                  "endpoints":None if b.endpoints is None else [list(x) for x in b.endpoints],
                  "notes":list(b.notes),
                  "extraction_method":o.extraction_method,
              })

          source=SourceVisibilityProducer(
              producer_method="diag-gpt1-figured-dimension-text-frame",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="diag-lot16",
              source_bytes=payload,
              source_locator="memory://lot16.pdf",
              page_ids=("3",),
          )
          trusted=_trusted_native_dimensions_for_page(
              source,
              revision_id=published.revision.revision_id,
              page_id="3",
              view_type="floor_plan",
          )
          print(json.dumps({
              "target_bindings":targets,
              "target_witness_bound_count":sum(
                  1 for x in targets if x["status"] == BindingStatus.WITNESS_BOUND.value
              ),
              "trusted_target_dimensions":[
                  {
                      "value_mm":d.value_mm,
                      "orientation":d.orientation,
                      "endpoints_pt":[list(x) for x in d.endpoints_pt],
                  }
                  for d in trusted
                  if d.value_mm in target_values
              ],
              "trusted_dimension_count":len(trusted),
          },indent=2,sort_keys=True))
          PY
