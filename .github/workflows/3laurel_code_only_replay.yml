name: TEMP 3Laurel code-only local replay handoff
on:
  push:
    branches:
      - diag/3laurel-source-only-replay-20261117
    paths:
      - .github/workflows/3laurel_code_only_replay.yml
permissions:
  contents: read
jobs:
  source-only-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive publicly tracked Python engine files ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          entries = sorted(Path('.').glob('pb_*.py')) + sorted(Path('tools').glob('*.py'))
          assert entries and all(p.suffix == '.py' and p.is_file() for p in entries)
          dest = Path('/tmp/planreader-public-python-code-only.tar.gz')
          with tarfile.open(dest, mode='w:gz') as archive:
              for file in entries:
                  archive.add(file, arcname=file.as_posix(), recursive=False)
          print('PUBLIC_CODE_FILES', len(entries), 'ARCHIVE_BYTES', dest.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planreader-public-python-code-only
          path: /tmp/planreader-public-python-code-only.tar.gz
          if-no-files-found: error
          retention-days: 1
