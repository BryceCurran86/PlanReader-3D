name: GPT1 Original Maryborough Source-Owned H-V Witness Census
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt1_same_view_witness_census.py"
      - "tools/diag_gpt1_original_room_witness_source_run.py"
      - "tests/test_gpt1_same_view_witness_census.py"
      - ".github/workflows/gpt1-original-room-witness-census.yml"
  workflow_dispatch:

concurrency:
  group: gpt1-original-room-witness-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-owned synthetic H/V census, source negatives, no new authority
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt1_same_view_witness_census.py tests/test_same_view_room_area_authority_v1.py
          python -m compileall -q tools/diag_gpt1_same_view_witness_census.py tools/diag_gpt1_original_room_witness_source_run.py
          ruff check --select F821,F823 tools/diag_gpt1_same_view_witness_census.py tools/diag_gpt1_original_room_witness_source_run.py tests/test_gpt1_same_view_witness_census.py
          python scripts/check_provider_gold_isolation.py
          python scripts/check_full_plan_v2_integrity.py

  original-maryborough:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: SHA-pinned original page-7 H/V witness census - no production change
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF="documents/sources/Arch_Combined_Maryborough_Service_Station.pdf"
          SHA="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          python -u tools/diag_gpt1_original_room_witness_source_run.py \
            --pdf "$PDF" --source-sha "$SHA" \
            --page-index 6 --support-page-index 10 \
            --output artifacts/gpt1-original-room-hv/source-owned-hv-census.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/gpt1-original-room-hv/source-owned-hv-census.json").read_text())
          assert report["diagnostic_only"] is True
          assert report["frozen_benchmark_scored"] is False
          assert report["commercial_approval_issued"] is False
          assert report["unchanged_production_quantity_count"] == 3
          assert sorted(round(float(q[1]),6) for q in report["unchanged_production_firm_quantities"]) == [
              9.05352, 13.270425, 25.37875
          ]
          rows=report["witness_census"]["rows"]
          assert len(rows)==4
          assert all(row["source_sha256"]==report["source_sha256"] for row in rows)
          assert all(row["quantity_published"] is False for row in rows)
          assert all(row.get("producer_area_authority_proven") is not True for row in rows)
          assert all(row["status"] in ("ABSTAINED","DIAGNOSTIC_ONLY") for row in rows)
          print("G1_ORIGINAL_HV_FIRST_GATE",json.dumps([
              [r["source_room_face_record_id"],r["status"],r["reason"],
               len(r.get("horizontal_dimensions",[])),
               len(r.get("vertical_dimensions",[])),
               r.get("local_eligible_pair_count_diagnostic_only",0)]
              for r in rows
          ],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-original-maryborough-room-hv-witness-census
          path: artifacts/gpt1-original-room-hv/source-owned-hv-census.json
          retention-days: 30
