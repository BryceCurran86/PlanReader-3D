name: TEST GPT2 Source Producer Original FT2 FT3 Word Authority

on:
  pull_request:
    paths:
      - pb_source_visibility_authority.py
      - pb_pdf_text_integrity_authority.py
      - tools/diag_original_pdf_active_clip_operator_authority.py
      - tests/test_gpt2_source_issuer_ft2_ft3_optin_native_words.py
      - .github/workflows/test-gpt2-source-producer-ft2-ft3-native-words.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source-owned-native-word-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact branch SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt fonttools
      - name: Native original source words through actual producer receipts
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_source_issuer_ft2_ft3_optin_native_words.py tests/test_gpt2_original_raw_operator_text_clip_source.py tests/test_gpt2_symbol_source_optin_native_word_integrity.py
          python -m pytest -q tests/test_signed_output_gate_path_coverage.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
