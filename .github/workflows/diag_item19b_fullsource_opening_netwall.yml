name: Item19B Full Source Opening Net Wall Diagnostic

on:
  push:
    branches: [diag/item19b-fullsource-opening-netwall-current]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Trace wall opening net wall chain
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_wall_opening_authority_composition import compose_live_wall_opening_authority
          from pb_live_physical_opening_void_composition import compose_live_physical_opening_voids
          from pb_live_gross_wall_geometry_composition import compose_live_gross_wall_geometry
          from pb_live_opening_deduction_composition import compose_live_opening_deductions
          from pb_live_net_wall_boolean_composition import compose_live_net_wall_boolean_union

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-fullsource-opening-netwall",
              producer_version="1.0",
          )
          t0=time.perf_counter()
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-fullsource-opening-netwall",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
          )
          t1=time.perf_counter()

          wall=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=pub.revision.revision_id,
              page_ids=("54",),
          )
          t2=time.perf_counter()
          print("ITEM19B_OPENING_WALL "+json.dumps({
              "status":wall.status.value,
              "reasons":list(wall.reason_codes),
              "wall_scopes":[{
                  "page":x.page_id,
                  "status":x.status.value,
                  "complete":x.scope_complete,
                  "reasons":list(x.reason_codes),
                  "wall_count":len(x.wall_candidate_ids),
              } for x in wall.wall_scopes],
              "binding_statuses":[{
                  "opening":x.opening_identity_id,
                  "status":x.status.value,
                  "reasons":list(x.reason_codes),
                  "host":x.host_wall_id,
                  "members":list(x.member_wall_candidate_ids),
              } for x in wall.opening_bindings],
              "host_frames":[{
                  "opening":x.opening_identity_id,
                  "status":x.status.value,
                  "reasons":list(x.reason_codes),
                  "host":x.host_wall_id,
                  "whole":list(x.whole_wall_candidate_ids),
              } for x in wall.host_frames],
              "opening_universe":{
                  page:{
                      "status":result.status.value,
                      "complete":bool(result.decision_scope_complete),
                      "reasons":list(result.reason_codes),
                      "members":(
                          list(result.record.accounted_member_ids)
                          if result.record is not None else []
                      ),
                  }
                  for page,result in wall.opening_universe_results.items()
              },
          },sort_keys=True))

          voids=compose_live_physical_opening_voids(
              source_visibility_producer=source,
              wall_opening_composition=wall,
          )
          t3=time.perf_counter()
          print("ITEM19B_OPENING_VOIDS "+json.dumps({
              "status":voids.status.value,
              "reasons":list(voids.reason_codes),
              "traces":[{
                  "opening":x.opening_identity_id,
                  "void_status":x.void_status.value,
                  "void_reasons":list(x.void_reason_codes),
                  "width":x.width_status.value,
                  "height":x.height_status.value,
                  "vertical":x.vertical_status.value,
                  "scale":x.scale_status.value,
              } for x in voids.traces],
          },sort_keys=True))

          gross=compose_live_gross_wall_geometry(
              source_visibility_producer=source,
              wall_opening_composition=wall,
              physical_void_composition=voids,
          )
          t4=time.perf_counter()
          print("ITEM19B_GROSS_WALL "+json.dumps({
              "status":gross.status.value,
              "reasons":list(gross.reason_codes),
              "traces":[{
                  "wall":x.physical_wall_id,
                  "status":x.status.value,
                  "reasons":list(x.reason_codes),
                  "length":x.length_m,
                  "height":x.height_m,
                  "gross":x.gross_area_m2,
              } for x in gross.traces],
          },sort_keys=True))

          targets=("internal_plaster","internal_paint","external_key_pointing")
          deductions=compose_live_opening_deductions(
              source_visibility_producer=source,
              wall_opening_composition=wall,
              physical_void_composition=voids,
              target_scope_ids=targets,
          )
          t5=time.perf_counter()
          print("ITEM19B_DEDUCTIONS "+json.dumps({
              "status":deductions.status.value,
              "reasons":list(deductions.reason_codes),
              "traces":[{
                  "opening":x.opening_identity_id,
                  "target":x.target_scope_id,
                  "status":x.deduction_status.value,
                  "reasons":list(x.deduction_reason_codes),
              } for x in deductions.traces],
          },sort_keys=True))

          net=compose_live_net_wall_boolean_union(
              wall_opening_composition=wall,
              physical_void_composition=voids,
              opening_deduction_composition=deductions,
              gross_wall_composition=gross,
          )
          t6=time.perf_counter()
          print("ITEM19B_NET_WALL "+json.dumps({
              "status":net.status.value,
              "reasons":list(net.reason_codes),
              "traces":[{
                  "wall":x.physical_wall_id,
                  "target":x.target_scope_id,
                  "status":x.status.value,
                  "reasons":list(x.reason_codes),
                  "gross":x.gross_area_m2,
                  "void":x.void_union_area_m2,
                  "net":x.net_area_m2,
              } for x in net.traces],
          },sort_keys=True))
          print("ITEM19B_CHAIN_TIMING "+json.dumps({
              "ingest":round(t1-t0,3),
              "wall_opening":round(t2-t1,3),
              "voids":round(t3-t2,3),
              "gross":round(t4-t3,3),
              "deductions":round(t5-t4,3),
              "net":round(t6-t5,3),
          },sort_keys=True))
          PY
