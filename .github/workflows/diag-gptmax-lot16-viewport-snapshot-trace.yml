name: DIAG GPTMAX Lot16 Viewport Snapshot Trace

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace Lot16 viewport snapshot lineage
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_viewport_snapshot_trace.py \
            | tee lot16-viewport-snapshot-trace.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-viewport-snapshot-trace
          path: lot16-viewport-snapshot-trace.json
          retention-days: 2
