name: TEST-ONLY Murera Pier Source Census

on:
  pull_request:
    branches: [main]

jobs:
  pier-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact official Murera source
        run: |
          curl -L --fail --retry 3 -o /tmp/murera.pdf "https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf"
          echo "84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf" | sha256sum -c -
      - name: Census page 225 physical pier evidence
        run: |
          PYTHONPATH=. python scripts/diag_murera_pier_source_census.py /tmp/murera.pdf --page 225 --scan-start 219 --scan-end 238 | tee /tmp/murera-pier-source-census.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: murera-pier-source-census
          path: /tmp/murera-pier-source-census.log
