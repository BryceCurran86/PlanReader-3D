name: Opening Count Source Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and verify diagnostic sources
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          ids = [
            "tenders_ke_kstvet_cbc_classroom",
            "tenders_ke_murera_science_lab",
            "tenders_ke_lamu_ishakani_ecd_classrooms",
          ]
          root = pathlib.Path("benchmarks/public_tenders")
          source_root = pathlib.Path("benchmarks/sources")
          source_root.mkdir(parents=True, exist_ok=True)
          for bid in ids:
              bdir = root / bid
              dm = json.loads((bdir/"download_manifest.json").read_text())
              sm = json.loads((bdir/"source_manifest.json").read_text())
              filename = sm["source_pdf"]
              doc = next(d for d in dm["documents"] if d["filename"] == filename)
              req = urllib.request.Request(dm["source_url"], headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"})
              data = urllib.request.urlopen(req, timeout=180).read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == doc["sha256"].lower(), (bid, actual, doc["sha256"])
              (source_root/filename).write_bytes(data)
              print("VERIFIED", bid, filename, actual)
          PY
      - name: Inspect target schedule pages
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import fitz, json, pathlib
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor
          from pb_shadow_opening_evidence import page_is_opening_schedule_sheet
          from pb_viewport_segmentation import segment_page_viewports
          cases = [
            ("KSTVET", "1727358888238-bq-nd-drawing.pdf", [54,55]),
            ("MURERA", "1785347143869-bqs-drawings.pdf", [219,223,225]),
            ("LAMU", "lamu-ishakani-ecd-classrooms-boq.pdf", [41]),
          ]
          root=pathlib.Path("benchmarks/sources")
          ex=GenericScheduleTableExtractor()
          for label, fn, pages in cases:
              doc=fitz.open(root/fn)
              try:
                  for pnum in pages:
                      p=doc[pnum-1]
                      txt=p.get_text("text") or ""
                      rows=ex.extract_from_page(p,pnum)
                      vps=segment_page_viewports(p,page_number=pnum)
                      print("===PAGE===",label,pnum)
                      print(json.dumps({
                        "text_len":len(txt),
                        "text":txt[:12000],
                        "images":[list(x[2:4]) for x in p.get_images()],
                        "drawings":len(p.get_drawings()),
                        "page_is_opening_schedule_sheet":page_is_opening_schedule_sheet(txt),
                        "rows":[getattr(r,"__dict__",str(r)) for r in rows],
                        "viewports":[getattr(v,"__dict__",str(v)) for v in vps],
                      },default=str,indent=2))
              finally:
                  doc.close()
          PY
