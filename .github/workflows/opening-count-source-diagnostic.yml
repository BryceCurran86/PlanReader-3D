name: Substructure Source Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified Murera source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          bid="tenders_ke_murera_science_lab"
          root=pathlib.Path("benchmarks/public_tenders")/bid
          d=json.loads((root/"download_manifest.json").read_text())
          s=json.loads((root/"source_manifest.json").read_text())
          fn=s["source_pdf"]
          expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
          req=urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"})
          data=urllib.request.urlopen(req,timeout=180).read()
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected,(actual,expected)
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True)
          (out/fn).write_bytes(data)
          print("SOURCE",fn,len(data),actual)
          PY
      - name: Probe Murera secondary floor geometry
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,re,fitz
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_secondary_area_support_evidence import extract_secondary_area_support_evidence_from_page
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          sm=json.loads((root/"source_manifest.json").read_text())
          pdf=pathlib.Path("benchmarks/sources")/sm["source_pdf"]
          doc=fitz.open(str(pdf))
          for page_no in range(219,226):
              page=doc[page_no-1]
              txt=page.get_text("text") or ""
              chains=extract_dimension_chains_from_page(page,page_num=page_no,view_id=f"page_{page_no}")
              sec=extract_secondary_area_support_evidence_from_page(page,source_page=page_no,dimension_chains=chains)
              keyblocks=[]
              for b in page.get_text("blocks") or []:
                  t=" ".join(str(b[4]).split())
                  if re.search(r"veranda|verandah|pillar|column|post|pier|floor|hardcore|damp|polythene|A142|mesh",t,re.I):
                      keyblocks.append({"text":t,"bbox":[round(float(v),1) for v in b[:4]]})
              print("\nPAGE",page_no,"TEXTLEN",len(txt))
              print("KEYBLOCKS",json.dumps(keyblocks,sort_keys=True))
              print("CHAINS",json.dumps([
                 {
                   "id":str(c.chain_id),
                   "orientation":str(c.orientation),
                   "values":[round(float(o.value_m),3) for o in c.observations],
                   "bboxes":[list(o.bbox) if o.bbox else None for o in c.observations],
                 } for c in chains
              ],sort_keys=True))
              print("SECONDARY",sec)
          doc.close()
          PY
