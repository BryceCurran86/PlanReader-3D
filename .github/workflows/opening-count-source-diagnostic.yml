name: Opening Count Source Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and verify diagnostic sources
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          ids = ["tenders_ke_murera_science_lab"]
          root = pathlib.Path("benchmarks/public_tenders")
          source_root = pathlib.Path("benchmarks/sources")
          source_root.mkdir(parents=True, exist_ok=True)
          for bid in ids:
              bdir = root / bid
              dm = json.loads((bdir/"download_manifest.json").read_text())
              sm = json.loads((bdir/"source_manifest.json").read_text())
              filename = sm["source_pdf"]
              doc = next(d for d in dm["documents"] if d["filename"] == filename)
              req = urllib.request.Request(dm["source_url"], headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"})
              data = urllib.request.urlopen(req, timeout=180).read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == doc["sha256"].lower(), (bid, actual, doc["sha256"])
              (source_root/filename).write_bytes(data)
              print("VERIFIED", bid, filename, actual)
          PY
      - name: Inspect Murera page 220 only
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import fitz, json, pathlib, re
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor
          p = fitz.open(pathlib.Path("benchmarks/sources/1785347143869-bqs-drawings.pdf"))[219]
          txt = p.get_text("text") or ""
          words = p.get_text("words") or []
          rows = GenericScheduleTableExtractor().extract_from_page(p,220)
          pv = [
              {"text":w[4],"bbox":list(w[:4]),"block":w[5],"line":w[6],"word":w[7]}
              for w in words if re.fullmatch(r"P\\.?V\\.?",str(w[4]),re.I)
          ]
          print(json.dumps({
              "page":220,
              "text":txt,
              "pv_words":pv,
              "rows":[r.to_dict() for r in rows],
              "drawings":len(p.get_drawings()),
              "images":[list(x[2:4]) for x in p.get_images()],
          },indent=2))
          PY
