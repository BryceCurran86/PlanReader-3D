name: Cross View Secondary Width Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified Murera source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          d=json.loads((root/"download_manifest.json").read_text())
          s=json.loads((root/"source_manifest.json").read_text())
          fn=s["source_pdf"]
          expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
          data=urllib.request.urlopen(urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"}),timeout=180).read()
          assert hashlib.sha256(data).hexdigest()==expected
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True); (out/fn).write_bytes(data)
          PY
      - name: Inspect page 221 figured evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,fitz
          from pb_figured_dimension_evidence import extract_dimension_evidence_bundle
          from pb_viewport_segmentation import segment_page_viewports
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          sm=json.loads((root/"source_manifest.json").read_text())
          doc=fitz.open(str(pathlib.Path("benchmarks/sources")/sm["source_pdf"]))
          page=doc[220]
          print("TEXT",page.get_text("text"))
          print("VIEWPORTS",json.dumps([
            {"id":v.view_id,"type":v.view_type,"status":v.status,"bbox":list(v.bounding_box) if v.bounding_box else None}
            for v in segment_page_viewports(page,page_number=221)
          ]))
          bundle=extract_dimension_evidence_bundle(page,page_num=221,view_id="page_221")
          bind={b.observation_id:b.status for b in bundle.bindings}
          for o in bundle.observations:
              try: val=float(o.value_m)
              except: continue
              if 1.5 <= val <= 3.5:
                  print("OBS",json.dumps({
                    "id":o.dimension_id,"value":val,"orientation":str(o.orientation),
                    "bbox":list(o.bbox) if o.bbox else None,
                    "endpoints":list(o.endpoints) if o.endpoints else None,
                    "binding":bind.get(o.dimension_id)
                  },sort_keys=True))
          doc.close()
          PY
