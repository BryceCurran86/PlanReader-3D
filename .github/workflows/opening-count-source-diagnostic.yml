name: DPC Scope Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified Murera source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          d=json.loads((root/"download_manifest.json").read_text()); s=json.loads((root/"source_manifest.json").read_text())
          fn=s["source_pdf"]; expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
          data=urllib.request.urlopen(urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"}),timeout=180).read()
          assert hashlib.sha256(data).hexdigest()==expected
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True); (out/fn).write_bytes(data)
          PY
      - name: Probe DPC scope and internal partition evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,fitz,re
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_wall_fill_internal_partition_evidence import resolve_internal_partition_length_m
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          sm=json.loads((root/"source_manifest.json").read_text())
          doc=fitz.open(str(pathlib.Path("benchmarks/sources")/sm["source_pdf"]))
          ex=GenericPlanReaderExtractor()
          for page_no in range(219,239):
              page=doc[page_no-1]
              text=page.get_text("text") or ""
              if ex._has_dpc_specification(text) or ex._has_dpc_all_walls_scope(text):
                  print("\nPAGE",page_no)
                  print("DPC_SPEC",ex._has_dpc_specification(text))
                  print("ALL_WALLS",ex._has_dpc_all_walls_scope(text))
                  print("TEXT",text)
                  try:
                    e=resolve_internal_partition_length_m(page.get_drawings(),length_m=18.2,width_m=8.2,page=page)
                    print("PARTITION",e)
                  except Exception as err:
                    print("PARTITION_ERROR",repr(err))
          doc.close()
          PY
