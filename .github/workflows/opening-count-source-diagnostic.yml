name: Opening Count Source Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified KSTVET and Murera sources
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path("benchmarks/public_tenders")
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True)
          for bid in ["tenders_ke_kstvet_cbc_classroom","tenders_ke_murera_science_lab"]:
              bdir=root/bid
              d=json.loads((bdir/"download_manifest.json").read_text())
              s=json.loads((bdir/"source_manifest.json").read_text())
              fn=s["source_pdf"]
              expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
              req=urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"})
              data=urllib.request.urlopen(req,timeout=180).read()
              actual=hashlib.sha256(data).hexdigest()
              assert actual==expected,(bid,actual,expected)
              (out/fn).write_bytes(data)
              print("SOURCE",bid,fn,len(data),actual)
          PY
      - name: Probe physical opening marks and view context
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,re,fitz
          from pb_plan_opening_instance_marks import (
              extract_plan_instance_opening_totals,
              package_documents_casement_windows,
              package_documents_door_system,
          )
          from pb_viewport_segmentation import segment_page_viewports
          root=pathlib.Path("benchmarks/public_tenders")
          src=pathlib.Path("benchmarks/sources")
          mark_re=re.compile(r"^(?:W|D)[-–—]?[0-9]{1,2}$",re.I)
          for bid in ["tenders_ke_kstvet_cbc_classroom","tenders_ke_murera_science_lab"]:
              sm=json.loads((root/bid/"source_manifest.json").read_text())
              pdf=src/sm["source_pdf"]
              doc=fitz.open(str(pdf))
              pnos=range(53,55) if "kstvet" in bid else range(218,238)
              texts=[]
              print("\n===",bid,"===")
              for pno in pnos:
                  if pno<0 or pno>=len(doc): continue
                  page=doc[pno]
                  text=page.get_text("text") or ""
                  texts.append(text)
                  marks=[w for w in page.get_text("words") if mark_re.fullmatch(str(w[4]).strip())]
                  views=[]
                  try:
                      for v in segment_page_viewports(page,page_number=pno+1):
                          views.append({
                            "id":v.view_id,"type":v.view_type,"status":v.status,
                            "bbox":list(v.bounding_box) if v.bounding_box else None
                          })
                  except Exception as e:
                      views=[{"error":str(e)}]
                  if marks or any(k in text.lower() for k in ("floor plan","window schedule","door schedule","schedule of windows","schedule of doors")):
                      print("PAGE",pno+1,"TEXTLEN",len(text),"MARKS",[
                        {"t":w[4],"x0":round(w[0],1),"y0":round(w[1],1),"x1":round(w[2],1),"y1":round(w[3],1)}
                        for w in marks
                      ])
                      print("VIEWS",json.dumps(views,sort_keys=True))
              print("CASEMENT_DOC",package_documents_casement_windows(texts))
              print("DOOR_DOC",package_documents_door_system(texts))
              totals=extract_plan_instance_opening_totals(doc,list(pnos))
              print("CURRENT_TOTALS",None if totals is None else totals)
              doc.close()
          PY
