name: Support Count Source Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified sources
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          bids=["tenders_ke_kstvet_cbc_classroom","tenders_ke_murera_science_lab"]
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True)
          for bid in bids:
              root=pathlib.Path("benchmarks/public_tenders")/bid
              d=json.loads((root/"download_manifest.json").read_text()); s=json.loads((root/"source_manifest.json").read_text())
              fn=s["source_pdf"]; expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
              data=urllib.request.urlopen(urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"}),timeout=180).read()
              assert hashlib.sha256(data).hexdigest()==expected
              (out/fn).write_bytes(data)
          PY
      - name: Probe support counts
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,re,fitz
          from pb_structural_bay_pillar_count import find_uniform_bay_runs
          from pb_secondary_area_support_evidence import extract_secondary_area_support_evidence_from_page
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_explicit_item_count_extractor import extract_explicit_item_counts
          specs=[
            ("tenders_ke_kstvet_cbc_classroom",[54,55]),
            ("tenders_ke_murera_science_lab",[219,220,221,225]),
          ]
          for bid,pages in specs:
              root=pathlib.Path("benchmarks/public_tenders")/bid
              sm=json.loads((root/"source_manifest.json").read_text())
              doc=fitz.open(str(pathlib.Path("benchmarks/sources")/sm["source_pdf"]))
              print("\n===",bid,"===")
              for page_no in pages:
                  page=doc[page_no-1]
                  text=page.get_text("text") or ""
                  parsed=[]
                  for maj,minr in re.findall(r"\b(\d{1,2})[,.]?(\d{3})\b",text):
                      v=float(maj)+float(minr)/1000.0
                      if 0.1<=v<=60: parsed.append(round(v,3))
                  runs=find_uniform_bay_runs(parsed)
                  chains=extract_dimension_chains_from_page(page,page_num=page_no,view_id=f"page_{page_no}")
                  sec=extract_secondary_area_support_evidence_from_page(page,source_page=page_no,dimension_chains=chains)
                  explicit=extract_explicit_item_counts(text)
                  print("PAGE",page_no)
                  print("RUNS",runs)
                  print("SECONDARY",sec)
                  print("EXPLICIT",[x for x in explicit if x.tag in ("verandah_pillars","masonry_piers","structural_columns")])
                  for line in text.splitlines():
                      if re.search(r"pillar|pier|column|veranda|verandah|chs|support",line,re.I):
                          print("LINE",line)
              doc.close()
          PY
