name: Opening Count Source Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install pytesseract==0.3.13
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Download and verify diagnostic sources
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          ids = ["tenders_ke_murera_science_lab"]
          root = pathlib.Path("benchmarks/public_tenders")
          source_root = pathlib.Path("benchmarks/sources")
          source_root.mkdir(parents=True, exist_ok=True)
          for bid in ids:
              bdir = root / bid
              dm = json.loads((bdir/"download_manifest.json").read_text())
              sm = json.loads((bdir/"source_manifest.json").read_text())
              filename = sm["source_pdf"]
              doc = next(d for d in dm["documents"] if d["filename"] == filename)
              req = urllib.request.Request(dm["source_url"], headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"})
              data = urllib.request.urlopen(req, timeout=180).read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == doc["sha256"].lower(), (bid, actual, doc["sha256"])
              (source_root/filename).write_bytes(data)
              print("VERIFIED", bid, filename, actual)
          PY
      - name: Trace Murera PV callouts and publication path
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import fitz, json, pathlib, re
          import pytesseract
          from PIL import Image
          from pb_drawing_evidence_binding import DrawingViewClassifier
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_viewport_segmentation import segment_page_viewports

          path = pathlib.Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          doc = fitz.open(path)
          rx = re.compile(r"\bPV\b|\bPermanent Vent\b|\bBrick Vent\b", re.I)

          native_hits = []
          for pno, page in enumerate(doc):
              text = page.get_text("text") or ""
              matches = rx.findall(text)
              if matches:
                  native_hits.append({
                      "page": pno + 1,
                      "count": len(matches),
                      "class": DrawingViewClassifier.classify_text(text).value,
                      "titles": [line.strip() for line in text.splitlines() if "ELEVATION" in line.upper()][:12],
                  })
          print("NATIVE_PV_PAGES", json.dumps(native_hits, indent=2))

          for page_number in (219, 220):
              page = doc[page_number - 1]
              text = page.get_text("text") or ""
              words = page.get_text("words") or []
              pv_words = [
                  {"text": w[4], "bbox": list(w[:4]), "block": w[5], "line": w[6], "word": w[7]}
                  for w in words if re.fullmatch(r"P\.?V\.?", str(w[4]), re.I)
              ]
              viewports = segment_page_viewports(page, page_number=page_number)
              image_rects = []
              for image in page.get_images(full=True):
                  xref = image[0]
                  try:
                      rects = [list(r) for r in page.get_image_rects(xref)]
                  except Exception:
                      rects = []
                  image_rects.append({
                      "xref": xref,
                      "width": image[2],
                      "height": image[3],
                      "rects": rects,
                  })

              print("PAGE_NATIVE", json.dumps({
                  "page": page_number,
                  "class": DrawingViewClassifier.classify_text(text).value,
                  "regex_count": len(rx.findall(text)),
                  "pv_words": pv_words,
                  "viewports": [
                      {
                          "id": getattr(v, "view_id", None),
                          "type": getattr(v, "view_type", None),
                          "title": getattr(v, "title", None),
                          "bbox": list(getattr(v, "bbox", ()) or ()),
                      }
                      for v in viewports
                  ],
                  "image_rects": image_rects,
                  "text": text,
              }, indent=2, default=str))

              pix = page.get_pixmap(matrix=fitz.Matrix(4, 4), alpha=False)
              img = Image.frombytes("RGB", [pix.width, pix.height], pix.samples)
              data = pytesseract.image_to_data(img, config="--psm 11", output_type=pytesseract.Output.DICT)
              ocr_pv = []
              for i, raw in enumerate(data.get("text", [])):
                  token = str(raw or "").strip()
                  normalized = re.sub(r"[^A-Za-z]", "", token).upper()
                  if normalized != "PV":
                      continue
                  conf = float(data["conf"][i]) if str(data["conf"][i]).strip() else -1
                  ocr_pv.append({
                      "text": token,
                      "confidence": conf,
                      "bbox_px": [
                          data["left"][i],
                          data["top"][i],
                          data["left"][i] + data["width"][i],
                          data["top"][i] + data["height"][i],
                      ],
                  })
              print("PAGE_OCR_PV", json.dumps({"page": page_number, "count": len(ocr_pv), "hits": ocr_pv}, indent=2))

          doc.close()

          for label, pages in [
              ("page219_only", [218]),
              ("page220_only", [219]),
              ("pages219_220", [218, 219]),
              ("full_document", None),
          ]:
              extractor = GenericPlanReaderExtractor()
              preds = extractor.extract_from_pdf(path, pages=pages)
              vents = [p for p in preds if p.tag == "brick_vents"]
              print("EXTRACTOR_RESULT", label, json.dumps([
                  {
                      "quantity": p.quantity,
                      "page": p.source_page,
                      "sheet": p.sheet_number,
                      "description": p.description,
                      "metadata": p.metadata,
                  }
                  for p in vents
              ], indent=2, default=str))
          PY

      - name: Trace vector signatures beside proven PV labels
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import collections, json, math, pathlib, re
          import fitz

          path = pathlib.Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          doc = fitz.open(path)
          page = doc[218]
          words = page.get_text("words") or []

          def nxt(w):
              for o in words:
                  if o[5] == w[5] and o[6] == w[6] and o[7] == w[7] + 1:
                      return str(o[4])
              return ""

          pv = [
              w for w in words
              if re.fullmatch(r"(?:PV|P\.V)", str(w[4]), re.I)
              and nxt(w).strip().lower().rstrip(".,:;") != "denotes"
          ]
          pv_centers = [((w[0]+w[2])/2.0, (w[1]+w[3])/2.0) for w in pv]
          print("PV_CENTERS", json.dumps(pv_centers))

          drawings = page.get_drawings()
          records = []
          for idx, d in enumerate(drawings):
              r = d.get("rect")
              if not r:
                  continue
              x0,y0,x1,y1 = map(float, (r.x0,r.y0,r.x1,r.y1))
              if x1 <= x0 or y1 <= y0:
                  continue
              ops = tuple(str(item[0]) for item in d.get("items", ()))
              sig = (
                  round(x1-x0, 1),
                  round(y1-y0, 1),
                  len(ops),
                  ops[:12],
                  round(float(d.get("width") or 0.0), 2),
                  bool(d.get("fill")),
              )
              records.append({
                  "idx":idx, "bbox":[x0,y0,x1,y1],
                  "center":[(x0+x1)/2.0,(y0+y1)/2.0],
                  "sig":sig,
              })

          # A signature is interesting only if it recurs close to at least
          # three independently labelled PV instances. The radius is broad
          # diagnostic search only; nothing here is production authority.
          support = collections.defaultdict(set)
          near_examples = collections.defaultdict(list)
          for li,(px,py) in enumerate(pv_centers):
              for rec in records:
                  cx,cy = rec["center"]
                  if abs(cx-px) <= 45.0 and abs(cy-py) <= 45.0:
                      key = repr(rec["sig"])
                      support[key].add(li)
                      if len(near_examples[key]) < 20:
                          near_examples[key].append(rec)
          ranked = sorted(
              ((len(v),k) for k,v in support.items() if len(v) >= 3),
              reverse=True,
          )
          print("RECURRING_NEAR_PV_SIGNATURES", len(ranked))
          for n,key in ranked[:40]:
              sig = eval(key)
              matches = [rec for rec in records if rec["sig"] == sig]
              print(json.dumps({
                  "label_support": n,
                  "signature": sig,
                  "page_match_count": len(matches),
                  "near_examples": near_examples[key][:8],
                  "page_matches": matches[:80],
              }, default=str))

          # Also list compact direct rectangle/path candidates in the broad
          # elevation drawing band, grouped by width/height, to expose symbols
          # whose path decomposition differs between instances.
          dims = collections.defaultdict(list)
          for rec in records:
              x0,y0,x1,y1 = rec["bbox"]
              w,h = x1-x0,y1-y0
              if 2.0 <= w <= 40.0 and 2.0 <= h <= 40.0:
                  dims[(round(w,1),round(h,1))].append(rec)
          for key, vals in sorted(dims.items(), key=lambda kv: (-len(kv[1]), kv[0]))[:60]:
              print("SMALL_PATH_DIM_GROUP", key, "COUNT", len(vals), "BBOXES",
                    [v["bbox"] for v in vals[:80]])
          doc.close()
          PY

      - name: Render Murera page 219 for vector-symbol inspection
        run: |
          python - <<'PY'
          import fitz, pathlib
          from PIL import Image
          path = pathlib.Path("benchmarks/sources/1785347143869-bqs-drawings.pdf")
          out = pathlib.Path("diagnostic-artifacts")
          out.mkdir(exist_ok=True)
          doc = fitz.open(path)
          page = doc[218]
          pix = page.get_pixmap(matrix=fitz.Matrix(3, 3), alpha=False)
          img = Image.frombytes("RGB", [pix.width, pix.height], pix.samples)
          img.save(out / "murera-page219.png")
          # E-03 occupies the lower facade band on this composite sheet.
          # Save broad overlapping crops; these are diagnostic only and do not
          # encode benchmark quantities or feed production.
          w, h = img.size
          img.crop((0, int(h * 0.45), w, h)).save(out / "murera-page219-lower55.png")
          img.crop((int(w * 0.45), int(h * 0.25), w, int(h * 0.85))).save(out / "murera-page219-right60.png")
          print("RENDER_SIZE", w, h)
          doc.close()
          PY
      - name: Upload Murera page render
        uses: actions/upload-artifact@v4
        with:
          name: murera-page219-render
          path: diagnostic-artifacts/*.png
          if-no-files-found: error
