name: Murera Vent Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download verified Murera source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          d=json.loads((root/"download_manifest.json").read_text()); s=json.loads((root/"source_manifest.json").read_text())
          fn=s["source_pdf"]; expected=next(x["sha256"] for x in d["documents"] if x["filename"]==fn).lower()
          data=urllib.request.urlopen(urllib.request.Request(d["source_url"],headers={"User-Agent":"Mozilla/5.0 PlanReaderDiagnostic/1.0"}),timeout=180).read()
          assert hashlib.sha256(data).hexdigest()==expected
          out=pathlib.Path("benchmarks/sources"); out.mkdir(parents=True,exist_ok=True); (out/fn).write_bytes(data)
          PY
      - name: Count PV callouts page by page
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,pathlib,re,fitz
          root=pathlib.Path("benchmarks/public_tenders/tenders_ke_murera_science_lab")
          sm=json.loads((root/"source_manifest.json").read_text())
          doc=fitz.open(str(pathlib.Path("benchmarks/sources")/sm["source_pdf"]))
          for page_no in range(219,239):
              page=doc[page_no-1]
              words=page.get_text("words") or []
              def nxt(w):
                  for o in words:
                      if o[5]==w[5] and o[6]==w[6] and o[7]==w[7]+1:
                          return str(o[4])
                  return ""
              hits=[w for w in words if re.fullmatch(r"(?:PV|P\.V)",str(w[4]),re.I) and nxt(w).strip().lower().rstrip(".,:;")!="denotes"]
              if hits:
                  print("PAGE",page_no,"COUNT",len(hits),"TOKENS",[
                    {"t":w[4],"x":round(float(w[0]),1),"y":round(float(w[1]),1),"next":nxt(w)} for w in hits
                  ])
                  print("TEXT",page.get_text("text"))
          doc.close()
          PY
