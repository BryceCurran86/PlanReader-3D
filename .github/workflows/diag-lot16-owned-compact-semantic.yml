name: DIAG Lot16 Owned Compact Semantics

on:
  pull_request:
    branches:
      - gptmax/owned-compact-semantic-bridge-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused authority regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_source_plan_opening_callout.py \
            tests/test_opening_label_semantic_authority.py \
            tests/test_opening_label_dimension_authority.py
      - name: Run exact Lot16 dropout matrix
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_opening_dropout_matrix.py | tee lot16-owned-compact-semantic.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-owned-compact-semantic
          path: lot16-owned-compact-semantic.json
          retention-days: 1
