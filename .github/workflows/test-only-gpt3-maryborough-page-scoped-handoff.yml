name: TEST ONLY GPT3 Maryborough Page-Scoped Handoff

on:
  pull_request:
    branches:
      - gpt3/handoff-production-page-scope-refresh

jobs:
  maryborough:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Show source-owned topology page scope
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from tools.run_source_closed_project_handoff import _source_topology_pages
          path = Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          pages, count = _source_topology_pages(path)
          print({"page_count": count, "topology_pages_1_based": [p + 1 for p in pages]})
          PY
      - name: Run Maryborough handoff
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/maryborough
          git rev-parse HEAD > artifacts/maryborough/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/maryborough/source_sha256.txt
          set +e
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id "au_qld_maryborough_service_station" \
            --workspace-id 1 \
            --output-dir artifacts/maryborough \
            > artifacts/maryborough/run.log 2>&1
          code=$?
          echo "$code" > artifacts/maryborough/exit_code.txt
          cat artifacts/maryborough/run.log
          exit 0
      - name: Show summary
        if: always()
        run: |
          find artifacts/maryborough -maxdepth 3 -type f -print || true
          echo "=== exit ==="
          cat artifacts/maryborough/exit_code.txt 2>/dev/null || true
          echo "=== summary ==="
          cat artifacts/maryborough/production_summary.json 2>/dev/null || true
          echo "=== tail ==="
          tail -n 240 artifacts/maryborough/run.log 2>/dev/null || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-maryborough-page-scoped
          path: artifacts/maryborough
          retention-days: 1
          if-no-files-found: warn
