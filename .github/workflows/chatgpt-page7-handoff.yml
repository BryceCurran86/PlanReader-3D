name: ChatGPT Page7 Handoff

on:
  push:
    branches:
      - chatgpt/page7-wall-discrimination
    paths:
      - ".github/workflows/chatgpt-page7-handoff.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repository handoff archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path(".")
          output = Path("/tmp/planreader-page7-handoff.zip")
          excluded = {".git", ".venv", "__pycache__", ".pytest_cache", ".ruff_cache"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  archive.write(path, path.as_posix())
          print(output, output.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planreader-page7-handoff
          path: /tmp/planreader-page7-handoff.zip
          retention-days: 1
