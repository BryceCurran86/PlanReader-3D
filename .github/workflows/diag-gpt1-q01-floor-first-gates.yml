name: DIAG GPT1 Lot16 Floor First Authority Gates

on:
  push:
    branches: [diag/gpt1-q01-floor-first-gates-20261009]

concurrency:
  group: diag-gpt1-q01-floor-first-gates
  cancel-in-progress: true

jobs:
  lot16-source-quantity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Install requirements
        run: pip install -q -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify frozen V2 truth integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Real Lot16 page-3 source, canonical and quantity gate inventory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt1-lot16-page3-gates
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee artifacts/gpt1-lot16-page3-gates/console.log
          import hashlib,json,time,subprocess
          from pathlib import Path
          from collections import Counter
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities
          from pb_live_opening_area_quantity_publication import _opening_quantity

          project="au_qld_lot16_power"
          source=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          manifest=json.loads(Path(f"benchmarks/frozen_holdout/full_plan_v2/projects/{project}/source_manifest.json").read_text())
          expected=next(x["sha256"] for x in manifest["source_documents"] if x["name"]==source.name)
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual==expected, "Lot16 architectural source SHA mismatch"
          t0=time.perf_counter()
          # Preserve the exact source page-3 diagnostic scope from issue #1992.
          # This is NOT a full-project/Frozen V2 takeoff.
          claim=collect_live_physical_net_wall_claim(
              source,pages=(2,),topology_pages=(2,),room_area_support_pages=None
          )
          extract_seconds=time.perf_counter()-t0
          floors=tuple(publish_live_floor_area_quantities(claim))
          candidates=tuple(claim.canonical_openings)
          qty=tuple(q for q in claim.room_area_quantity_evidence if not q.abstained and q.value is not None)
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_live_canonical_room_composition import LiveCanonicalRoomComposition
          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_same_view_room_area_authority import SameViewRoomAreaProducer
          from pb_physical_scale_authority import PhysicalScaleProducer,PhysicalScaleSelector
          from pb_live_physical_net_wall_integration import LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION
          trace_source=SourceVisibilityProducer(producer_method="live-physical-net-wall",producer_version=LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION)
          trace_revision=trace_source.ingest_native_pdf_bytes(document_id=claim.canonical_rooms[0].document_id,source_bytes=source.read_bytes(),source_locator="memory://live-physical-net-wall-source.pdf",page_ids=("3",))
          assert trace_revision.revision.source_sha256==actual
          trace_rooms=LiveCanonicalRoomComposition(
              status=EvidenceResolutionStatus.CANDIDATE,
              reason_codes=tuple(claim.canonical_room_reason_codes),
              rooms=tuple(claim.canonical_rooms),
              source_pages=(3,),
          )
          same_view=SameViewRoomAreaProducer.from_source(source=trace_source,rooms=trace_rooms).publish()
          from pb_cross_view_room_area_authority import _trusted_lines_for_page, _trusted_native_dimensions_for_page, _norm_label
          from pb_drawing_evidence_binding import DrawingViewType
          from pb_dimension_graph_constraint_engine import DimensionOrientation
          witnesses=[]
          for room in trace_rooms.rooms:
              if room.room_label not in ("WC","LINEN"): continue
              lines=tuple(v for v in _trusted_lines_for_page(trace_source,revision_id=room.revision_id,page_id=room.page_id,candidate_labels=(room.room_label,)) if _norm_label(v.text)==_norm_label(room.room_label))
              dims=_trusted_native_dimensions_for_page(trace_source,revision_id=room.revision_id,page_id=room.page_id,candidate_lines=lines,view_type=DrawingViewType.FLOOR_PLAN.value)
              witnesses.append({"label":room.room_label,"trusted_labels":len(lines),"dimensions":len(dims),"horizontal":sum(v.orientation==DimensionOrientation.HORIZONTAL.value for v in dims),"vertical":sum(v.orientation==DimensionOrientation.VERTICAL.value for v in dims)})
          from pb_cross_view_room_area_authority import (
              _line_inside_dimension_pair, _figured_pair_scale_consistent,
              _witness_systems_intersect, _dimension_is_immediate_label_annotation,
          )
          pair_gates=[]
          for room in trace_rooms.rooms:
              if room.room_label not in ("WC","LINEN"): continue
              lines=tuple(v for v in _trusted_lines_for_page(trace_source,revision_id=room.revision_id,page_id=room.page_id,candidate_labels=(room.room_label,)) if _norm_label(v.text)==_norm_label(room.room_label))
              dims=_trusted_native_dimensions_for_page(trace_source,revision_id=room.revision_id,page_id=room.page_id,candidate_lines=lines,view_type=DrawingViewType.FLOOR_PLAN.value)
              horizontal=tuple(v for v in dims if v.orientation==DimensionOrientation.HORIZONTAL.value)
              vertical=tuple(v for v in dims if v.orientation==DimensionOrientation.VERTICAL.value)
              counts={"candidate_pairs":len(horizontal)*len(vertical),"label_inside":0,"scale_consistent":0,"witness_intersect":0,"inside_and_scale":0,"inside_scale_and_witness":0,"label_immediate_horizontal":0,"label_immediate_vertical":0,"immediate_and_scale":0}
              pair_candidates=[]
              if len(lines)==1:
                  line=lines[0]
                  owned_h=[v for v in horizontal if _dimension_is_immediate_label_annotation(line,v)]
                  owned_v=[v for v in vertical if _dimension_is_immediate_label_annotation(line,v)]
                  counts["label_immediate_horizontal"]=len(owned_h)
                  counts["label_immediate_vertical"]=len(owned_v)
                  for h in horizontal:
                      for v in vertical:
                          inside=_line_inside_dimension_pair(line,h,v)
                          scale=_figured_pair_scale_consistent(page_id=room.page_id,horizontal=h,vertical=v)
                          witness=_witness_systems_intersect(h,v)
                          counts["label_inside"]+=int(inside)
                          counts["scale_consistent"]+=int(scale)
                          counts["witness_intersect"]+=int(witness)
                          counts["inside_and_scale"]+=int(inside and scale)
                          counts["inside_scale_and_witness"]+=int(inside and scale and witness)
                          if h in owned_h and v in owned_v and scale: counts["immediate_and_scale"]+=1
                          if inside and scale:
                              pair_candidates.append({"h_mm":h.value_mm,"v_mm":v.value_mm,"witness_intersect":witness,"h_id":h.dimension_id,"v_id":v.dimension_id})
              pair_gates.append({"label":room.room_label,"physical_room_id":room.physical_room_id,"source_face":room.source_room_face_record_id,"gate_counts":counts,"inside_scaled_candidates":pair_candidates[:16]})
          scale_producer=PhysicalScaleProducer.from_source_visibility_producer(trace_source)
          scale_by_scope={}
          for room in claim.canonical_rooms:
              key=(room.page_id,room.snapshot_id,room.decision_scope_id)
              if key not in scale_by_scope:
                  resolution=scale_producer.publish_scope(PhysicalScaleSelector(
                      document_id=room.document_id,revision_id=room.revision_id,source_sha256=room.source_sha256,
                      snapshot_id=room.snapshot_id,page_id=room.page_id,viewport_id=room.viewport_id
                  ))
                  scale_by_scope[key]={"status":str(resolution.status.value),"reason_codes":list(resolution.reason_codes)}
          def status(v):return getattr(v,"value",str(v))
          data={
              "repo_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "source_sha_verified":True,"source_sha256":actual,
              "scope":"test_only_page_index_2_not_frozen_v2",
              "extract_seconds":round(extract_seconds,3),
              "claim_status":status(claim.status),
              "claim_reason_codes":list(claim.reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_room_status":status(claim.canonical_room_status),
              "canonical_room_reasons":list(claim.canonical_room_reason_codes),
              "labelled_rooms":[{"label":x.room_label,"face_record_id":x.source_room_face_record_id,"geometry_complete":x.geometry_complete} for x in claim.canonical_rooms if x.room_label],
              "dimension_witnesses":witnesses,
              "wc_linen_pair_gates":pair_gates,
              "same_view_status":status(same_view.status),
              "same_view_reasons":list(same_view.reason_codes),
              "same_view_record_count":len(same_view.records),
              "same_view_unresolved":list(same_view.unresolved_physical_room_ids),
              "wc_linen_scale_gates":[{
                  "label":room.room_label,
                  "physical_room_id":room.physical_room_id,
                  "scale":scale_by_scope.get((room.page_id,room.snapshot_id,room.decision_scope_id))
              } for room in claim.canonical_rooms if room.room_label in ("WC","LINEN")],
              "canonical_floor_count":len(claim.canonical_floors),
              "canonical_floor_status":status(claim.canonical_floor_status),
              "canonical_floor_reasons":list(claim.canonical_floor_reason_codes),
              "canonical_floor_metric_count":sum(x.metric_area_m2 is not None for x in claim.canonical_floors),
              "canonical_floor_area_quantities":len(floors),
              "documented_room_area_gate":"same_view_and_cross_view_witnesses_required_before_metric_floor_publication",
              "labelled_room_first_gate":[{
                  "label":x.room_label,
                  "face_id":x.source_room_face_record_id,
                  "label_binding_id":x.room_label_binding_record_id,
                  "label_evidence_ids":list(x.room_label_evidence_ids),
                  "viewport_id":x.viewport_id,
                  "geometry_complete":x.geometry_complete,
                  "metric_floor_area":next((v.metric_area_m2 for v in claim.canonical_floors if v.room_entity_id==x.canonical_room_id),None)
              } for x in claim.canonical_rooms if x.room_label],
              "floor_first_gates":[{
                  "floor_id":x.physical_floor_surface_id,
                  "room_entity_id":x.room_entity_id,
                  "source_face_record_id":x.source_room_face_record_id,
                  "page_id":x.page_id,
                  "viewport_id":x.viewport_id,
                  "geometry_complete":x.geometry_complete,
                  "metric_area_authority":x.metric_area_authority,
                  "metric_area_quantity_id":x.metric_area_quantity_id,
                  "reason":(
                      "physical_face_geometry_incomplete" if not x.geometry_complete
                      else "metric_area_upstream_authority_unavailable"
                      if x.metric_area_quantity_id is None
                      else "metric_area_attached"
                  )
              } for x in claim.canonical_floors],
              "room_label_binding":[{"face_record_id":x.source_room_face_record_id,"label":x.room_label,
                  "label_binding_id":x.room_label_binding_record_id,
                  "label_evidence_count":len(x.room_label_evidence_ids)
              } for x in claim.canonical_rooms if x.room_label],
              "room_area_quantities":len(qty),
              "canonical_ceiling_count":len(claim.canonical_ceilings),
              "source_opening_count":len(candidates),
              "source_opening_area_quantity_count":sum(_opening_quantity(x) is not None for x in candidates),
              "opening_area_quantity_count":len(claim.opening_quantity_evidence),
              "opening_count_quantity_count":len(claim.opening_count_quantity_evidence),
              "floor_finish_quantity_count":len(claim.floor_finish_quantity_evidence),
              "ceiling_lining_quantity_count":len(claim.ceiling_lining_quantity_evidence),
              "opening_area_values":[x.value for x in claim.opening_quantity_evidence if not x.abstained and x.value is not None],
          }
          Path("artifacts/gpt1-lot16-page3-gates/result.json").write_text(json.dumps(data,indent=2,sort_keys=True,default=str)+"\n")
          print("GPT1_LOT16_SOURCE_GATES",json.dumps(data,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-real-lot16-page3-quantity-gates
          path: artifacts/gpt1-lot16-page3-gates
          retention-days: 4
