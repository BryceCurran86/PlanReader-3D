name: DIAG GPTMAX Lot16 Opening Face Protection Gap

on:
  pull_request:
    branches:
      - gptmax/protect-proven-opening-wall-faces-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run protection-gap census
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_opening_face_protection_gap.py | tee lot16-opening-face-protection-gap.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-opening-face-protection-gap
          path: lot16-opening-face-protection-gap.json
          retention-days: 2
