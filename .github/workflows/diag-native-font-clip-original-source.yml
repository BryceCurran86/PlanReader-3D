name: DIAG Original Native Font Clip Gates

on:
  pull_request:
    paths:
      - tools/diag_native_text_font_clip_gates.py
      - tests/test_gptmax_native_text_font_clip_gates.py
      - docs/engineering/gptmax_native_font_clip_original_first_gate_20261015.md
      - .github/workflows/diag-native-font-clip-original-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-only font/clip negatives and frozen source separation
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_native_text_font_clip_gates.py
          ruff check --select F821,F823 tools/diag_native_text_font_clip_gates.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py

  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original Maryborough FT3 native-font and clipping receipts
        env:
          PYTHONPATH: "."
        run: |
          mkdir -p artifacts/native-font-clip
          git rev-parse HEAD > artifacts/native-font-clip/producer_head_sha.txt
          python -u - <<'PY'
          import json
          from pathlib import Path
          from tools.diag_native_text_font_clip_gates import inspect_native_text_gates

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          data=path.read_bytes()
          result=inspect_native_text_gates(
              data,expected_sha256="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007",
              page_number=11,code="FT3",
          )
          Path("artifacts/native-font-clip/original_ft3_font_clip.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)
          )
          assert result["candidate_block_count"]>=1
          assert result["material_definition_authenticated"] is False
          assert result["commercial_quantity_published"] is False
          for b in result["candidate_blocks"]:
              for w in b["source_words"]:
                  assert w["font_or_clip_promotion_allowed"] is False
          issues=[]
          for b in result["candidate_blocks"]:
              for w in b["source_words"]:
                  if w["text"] in ("-", "“DURA", "GREY”"):
                      issues.append({"block":b["block_no"],"word":w["text"],
                          "reasons":w["original_decision_reasons"],
                          "glyphs":[
                              {"font":r["font_name"],"xref":r["font_xref"],
                               "font_available":r["no_fallback_font_view_available"],
                               "mapped":r["all_glyph_ids_independently_verified"],
                               "tounicode":r["tounicode"],"encoding":r["font_encoding"]}
                              for r in w["glyph_runs"]
                          ]})
          print(json.dumps({"source_sha256":result["source_sha256"],
                            "candidate_block_count":result["candidate_block_count"],
                            "clip_model":result["original_clip_model"],
                            "disputed_word_gates":issues,
                            "commercial_quantity_published":False},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ft3-native-font-clip-gates
          path: artifacts/native-font-clip/
          retention-days: 30
