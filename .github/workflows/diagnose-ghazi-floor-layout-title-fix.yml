name: DIAGNOSTIC Ghazi Floor Layout Title Fix — DO NOT MERGE

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and SHA-verify source
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf" \
            -o /tmp/ghazi.pdf
          echo "c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf" | sha256sum -c -
      - name: Verify viewport progression
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import fitz
          from pb_vector_geometry_v130 import extract_native_page
          from pb_viewport_segmentation import (
              extract_view_title_anchors,
              segment_page_viewports,
          )
          from pb_wall_topology_diagnostics import collect_topology_from_page

          def inside(point, bbox):
              x, y = point
              return bbox[0] <= x <= bbox[2] and bbox[1] <= y <= bbox[3]

          def intersects(seg, bbox):
              x0, y0, x1, y1 = seg["x1"], seg["y1"], seg["x2"], seg["y2"]
              sx0, sx1 = sorted((x0, x1))
              sy0, sy1 = sorted((y0, y1))
              return not (sx1 < bbox[0] or sx0 > bbox[2] or sy1 < bbox[1] or sy0 > bbox[3])

          doc = fitz.open("/tmp/ghazi.pdf")
          page = doc[166]
          native = extract_native_page(page)
          segments = native.get("segments") or ()
          anchors = extract_view_title_anchors(page)
          viewports = segment_page_viewports(page, page_number=167)
          topology = collect_topology_from_page(
              page,
              page_number=167,
              document_id="diagnostic-floor-layout-title-fix",
              allow_derived=True,
          )

          rows = []
          for v in viewports:
              row = {
                  "view_id": v.view_id,
                  "view_type": v.view_type,
                  "label": v.label,
                  "title_bbox": v.title_bbox,
                  "status": v.status,
                  "boundary_source": v.boundary_source,
                  "bbox": v.bounding_box,
                  "scale_raw": v.scale_raw,
                  "scale_denominator": v.scale_denominator,
                  "scale_conflict": v.scale_conflict,
              }
              if v.bounding_box is not None:
                  bbox = v.bounding_box
                  both = 0
                  either = 0
                  midpoint = 0
                  hit = 0
                  for seg in segments:
                      a = (float(seg["x1"]), float(seg["y1"]))
                      b = (float(seg["x2"]), float(seg["y2"]))
                      ia, ib = inside(a, bbox), inside(b, bbox)
                      both += int(ia and ib)
                      either += int(ia or ib)
                      midpoint += int(inside(((a[0]+b[0])/2.0, (a[1]+b[1])/2.0), bbox))
                      hit += int(intersects(seg, bbox))
                  row["segment_membership"] = {
                      "both_endpoints": both,
                      "either_endpoint": either,
                      "midpoint": midpoint,
                      "bbox_intersects": hit,
                  }
              rows.append(row)

          pix = page.get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
          pix.save("/tmp/ghazi-page-167.png")

          report = {
              "native_segment_count": len(segments),
              "title_anchors": [
                  {"text": a.text, "bbox": a.bbox, "view_type": a.view_type}
                  for a in anchors
              ],
              "viewports": rows,
              "topology": {
                  "fail_closed_reason": topology.fail_closed_reason,
                  "viewport_id": topology.viewport_id,
                  "viewport_authority": topology.viewport_authority,
                  "view_type": topology.view_type,
                  "scoped_primitive_count": topology.scoped_primitive_count,
                  "wall_count": len(topology.walls),
                  "room_count": len(topology.rooms),
              },
          }
          print("TITLE_FIX_REPORT_BEGIN")
          print(json.dumps(report, indent=2, sort_keys=True))
          print("TITLE_FIX_REPORT_END")
          doc.close()
          PY
      - name: Upload rendered sheet
        uses: actions/upload-artifact@v4
        with:
          name: ghazi-page-167-render
          path: /tmp/ghazi-page-167.png
          if-no-files-found: error
