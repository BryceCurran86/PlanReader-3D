name: TEST-ONLY Lamu Wrapped Datum 865

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lamu:
    if: startsWith(github.head_ref, 'diag/lamu-wrapped-datum-865')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Validate source datums and Lamu benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee /tmp/lamu_wrapped_datum_diag.txt
          import hashlib,json,urllib.request
          from pathlib import Path
          import fitz
          from pb_level_datum_extraction import find_level_markers
          from pb_dimension_graph_constraint_engine import resolve_wall_height
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          want="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          p=Path("/tmp/lamu.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-wrapped-datum-865/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:p.write_bytes(r.read())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got!=want: raise SystemExit(got)

          doc=fitz.open(p)
          txt=doc[40].get_text("text") or ""
          markers=find_level_markers(txt,source_page=41)
          resolved=resolve_wall_height(markers,scope_id=None)
          doc.close()

          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(p,pages=[40],collect_item35_shadow=False)
          focus=[x.to_dict() for x in preds if x.tag in {
              "perimeter_walling","internal_plaster","internal_paint",
              "damp_proof_course","D1","chalkboard","floor_screed"
          }]
          print("LAMU_WRAPPED_DATUM_SOURCE="+json.dumps({
              "sha":got,
              "markers":[m.__dict__ for m in markers],
              "resolved":{"status":resolved.status,"clear_height_m":resolved.clear_height_m,
                          "reason_codes":getattr(resolved,"reason_codes",None)},
              "focus":focus,
              "extraction_status":ex.extraction_status,
              "live_net_wall_shadow":ex.live_net_wall_shadow,
              "physical_net_wall_live":getattr(ex,"physical_net_wall_live",None),
          },sort_keys=True,default=str),flush=True)

          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/lamu-results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id="tenders_ke_lamu_ishakani_ecd_classrooms",
              pdf_path=p,
              auto_extract=True,
          )
          print("LAMU_WRAPPED_DATUM_BENCHMARK="+json.dumps({
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "exact":int(report.exact_matches),
              "within_5":int(report.within_5_percent),
              "gross":int(report.gross_mismatches),
              "missed":int(report.missed_items),
              "hallucinated":int(report.hallucinated_items),
              "items":[i.to_dict() for i in report.item_results],
          },sort_keys=True),flush=True)
          PY

      - name: Post diagnostic summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f /tmp/lamu_wrapped_datum_diag.txt ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/lamu_wrapped_datum_diag.txt
          fi
