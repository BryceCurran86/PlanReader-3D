name: DIAG GPT1 Maryborough Current Core Seal V2

on:
  pull_request:
    branches: [ main ]

jobs:
  maryborough-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify Maryborough source SHA
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          expected="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          print({"sha256":actual,"verified":actual==expected})
          if actual != expected:
              raise SystemExit("source sha mismatch")
          PY
      - name: Run current production core handoff
        run: |
          mkdir -p artifacts/maryborough-core-v2
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py             --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf"             --project-id au_qld_maryborough_service_station             --workspace-id 1             --family-group core             --output-dir artifacts/maryborough-core-v2             | tee artifacts/maryborough-core-v2/handoff.stdout.json
      - name: Print current sealed inventory
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/maryborough-core-v2")
          summary=root/"production_summary.json"
          if summary.exists():
              print("SUMMARY")
              print(summary.read_text())
          for candidate in sorted(root.glob("au_qld_maryborough_service_station*.json")):
              if candidate.name=="production_summary.json":
                  continue
              try:
                  data=json.loads(candidate.read_text())
              except Exception:
                  continue
              print("SEALED_FILE",candidate.name)
              rows=[]
              for q in data.get("quantities",[]):
                  rows.append({
                      "quantity_id":q.get("quantity_id"),
                      "family":q.get("family"),
                      "value":q.get("value"),
                      "unit":q.get("unit"),
                      "object_identity_refs":q.get("object_identity_refs"),
                      "lineage_ok":q.get("lineage_ok"),
                      "abstained":q.get("abstained"),
                  })
              print(json.dumps({
                  "quantity_count":len(rows),
                  "quantities":rows,
              },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt1-maryborough-current-core-v2
          path: artifacts/maryborough-core-v2
          retention-days: 2
