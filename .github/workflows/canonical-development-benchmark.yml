name: Canonical Development Benchmark

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify scored development sources
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, urllib.request

          root = pathlib.Path("benchmarks/public_tenders")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          scored = [
              row for row in manifest["benchmarks"]
              if row.get("status") == "verified_scored_benchmark"
          ]
          print("Scored benchmark sources:", [row["benchmark_id"] for row in scored])

          for row in scored:
              bid = row["benchmark_id"]
              bdir = root / bid
              download = json.loads((bdir / "download_manifest.json").read_text(encoding="utf-8"))
              source = json.loads((bdir / "source_manifest.json").read_text(encoding="utf-8"))
              filename = source["source_pdf"]
              target = bdir / filename
              url = download["source_url"]
              expected = None
              for doc in download.get("documents", []):
                  if doc.get("filename") == filename and doc.get("sha256"):
                      expected = doc["sha256"].lower()
                      break
              if expected is None:
                  raise SystemExit(f"{bid}: no SHA-256 for {filename}")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 PlanReaderCanonicalBenchmark/1.0",
                      "Accept": "application/pdf,*/*",
                  },
              )
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"{bid}: SHA mismatch for {filename}: expected {expected}, got {actual}"
                  )
              target.write_bytes(data)
              print(f"{bid}: verified {filename} ({len(data)} bytes) sha256={actual}")
          PY

      - name: Run canonical development benchmark
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf benchmark_run_post_item28
          mkdir -p benchmark_run_post_item28
          python pb_benchmark_accuracy_engine.py \
            --all \
            --require-local-sources \
            --output-dir benchmark_run_post_item28 | tee benchmark_run_post_item28/console.txt

      - name: Print dashboard
        if: always()
        run: |
          if [ -f benchmark_run_post_item28/headline_accuracy_dashboard.json ]; then
            cat benchmark_run_post_item28/headline_accuracy_dashboard.json
          fi
          if [ -f benchmark_run_post_item28/headline_accuracy_dashboard.md ]; then
            cat benchmark_run_post_item28/headline_accuracy_dashboard.md
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-development-benchmark-post-item28
          path: benchmark_run_post_item28/
          if-no-files-found: error
