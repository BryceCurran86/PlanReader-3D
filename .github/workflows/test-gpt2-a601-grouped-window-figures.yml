name: TEST GPT2 A601 Grouped Window Figure Ownership
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_original_a601_window_dimension_group_ownership_shadow.py"
      - "tests/test_gpt2_original_a601_window_figure_competitors.py"
      - ".github/workflows/test-gpt2-a601-grouped-window-figures.yml"
  workflow_dispatch:
jobs:
  original-window-numeric-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original SHA and numeric ownership negative source tests
        env:
          PYTHONPATH: .
        run: |
          if [ -f documents/sources/Arch_Combined_Maryborough_Service_Station.pdf ]; then
            echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" | sha256sum --check
          else
            echo "::notice::Private original PDF unavailable on this merge checkout; synthetic source tests run, ORIGINAL SOURCE ACCEPTANCE REMAINS BLOCKED."
          fi
          python -m pytest -q -rs tests/test_gpt2_original_a601_window_figure_competitors.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
