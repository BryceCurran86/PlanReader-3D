name: GPT3 Original Opening Snapshot and Decision Scope Sidecar
on:
  pull_request:
    branches: [main]
    paths:
      - pb_gpt3_original_opening_scope_supplement.py
      - tests/test_gpt3_original_opening_scope_supplement.py
      - .github/workflows/test-gpt3-original-opening-scope-sidecar.yml
permissions:
  contents: read
jobs:
  original-v1-safe-source-scope-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Independently seal and reject contradictory source scopes
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_original_opening_scope_supplement.py tests/test_live_opening_area_quantity_publication.py
          ruff check --select F821,F823 pb_gpt3_original_opening_scope_supplement.py tests/test_gpt3_original_opening_scope_supplement.py
      # Private original source replay/release is a distinct owner-runner gate.
      # A public source-neutral positive never claims original PDF verification.
