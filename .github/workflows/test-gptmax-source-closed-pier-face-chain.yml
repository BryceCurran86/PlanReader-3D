name: GPT MAX authenticated W2 pier face chains, default off

on:
  push:
    branches:
      - gptmax/source-closed-pier-face-chain-20261106
  pull_request:
    paths:
      - pb_raster_source_wall_frame_projection.py
      - pb_opening_host_frame_authority.py
      - tests/test_gptmax_source_closed_pier_face_chain.py
      - tests/test_gptmax_g17_face_to_w2_centreline_owner.py
      - .github/workflows/test-gptmax-source-closed-pier-face-chain.yml

permissions:
  contents: read

jobs:
  source-closed:
    name: Source-closed W2 face chain and actual frame publisher, Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        py: ["3.13", "3.14"]
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install source-neutral test runtime
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Verify source chain, original-edge negatives and existing publisher
        run: |
          python -m pytest -q \
            tests/test_gptmax_source_closed_pier_face_chain.py \
            tests/test_gptmax_g17_face_to_w2_centreline_owner.py \
            tests/test_raster_source_wall_frame_projection.py \
            tests/test_gptmax_alternate_raster_frame_source_edge_gate.py \
            tests/test_raster_connected_host_frame.py
      - name: Check production path and tests
        run: |
          python -m compileall -q pb_raster_source_wall_frame_projection.py pb_opening_host_frame_authority.py tests/test_gptmax_source_closed_pier_face_chain.py tests/test_gptmax_g17_face_to_w2_centreline_owner.py
          ruff check --select F821,F823 pb_raster_source_wall_frame_projection.py pb_opening_host_frame_authority.py tests/test_gptmax_source_closed_pier_face_chain.py
