name: DIAG GPTMAX Lot16 After Mask Precedence

on:
  pull_request:
    branches:
      - gptmax/protect-proven-opening-wall-faces-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run real Lot16 post-precedence shadow
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_after_mask_precedence.py | tee lot16-after-mask-precedence.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-after-mask-precedence
          path: lot16-after-mask-precedence.json
          retention-days: 2
