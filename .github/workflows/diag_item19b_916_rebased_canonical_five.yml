name: Item19B #916 Rebased Canonical Five

on:
  push:
    branches: [diag/item19b-916-rebased-canonical-five]

jobs:
  canonical-five:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install canonical runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download canonical sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf' -o benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o benchmarks/sources/umma-university-hostels-builders-work.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf' | sha256sum -c -
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf' | sha256sum -c -
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' | sha256sum -c -
          echo 'fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf' | sha256sum -c -
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  benchmarks/sources/umma-university-hostels-builders-work.pdf' | sha256sum -c -
      - name: Run canonical five
        shell: bash
        run: |
          set -euo pipefail
          for id in tenders_ke_kstvet_cbc_classroom tenders_ke_murera_science_lab tenders_ke_ghazi_science_lab tenders_ke_lamu_ishakani_ecd_classrooms tenders_ke_umma_hostels; do
            echo "===== RUNNING $id ====="
            PYTHONPATH=. python scripts/run_planreader_benchmarks.py --public-tender "$id"
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          ids=[
            "tenders_ke_kstvet_cbc_classroom",
            "tenders_ke_murera_science_lab",
            "tenders_ke_ghazi_science_lab",
            "tenders_ke_lamu_ishakani_ecd_classrooms",
            "tenders_ke_umma_hostels",
          ]
          total=0
          for bid in ids:
              s=json.load(open(f"benchmark_results/{bid}_accuracy_report.json",encoding="utf-8"))["summary"]
              acc=int(s["exact_matches"])+int(s["within_5_percent"])
              total += acc
              print(f"CANONICAL5 {bid}: accepted={acc} exact={s['exact_matches']} within5={s['within_5_percent']} gross={s['gross_mismatches']} missed={s['missed_items']} hallucinated={s['hallucinated_items']}")
          print(f"CANONICAL5 TOTAL={total}/60")
          PY
