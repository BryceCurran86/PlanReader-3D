name: DIAG GPT2 Maryborough Ambulant Page11 Face Ownership

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trace page-wide ambulant face ownership
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-ambulant-page11-face-ownership
          git rev-parse HEAD > artifacts/gpt2-ambulant-page11-face-ownership/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-ambulant-page11-face-ownership/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_ambulant_page11_face_ownership.py \
            | tee artifacts/gpt2-ambulant-page11-face-ownership/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-ambulant-page11-face-ownership
          path: artifacts/gpt2-ambulant-page11-face-ownership
          retention-days: 1
