name: TEST-ONLY Lamu Roof Shadow Current

on:
  pull_request:
    branches: [main]

jobs:
  lamu-roof-shadow:
    if: startsWith(github.head_ref, 'diag/lamu-roof-shadow-current-633347')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe current Lamu roof and datum authority
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_level_datum_extraction import find_level_markers
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine

          url="https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          expected="fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"
          p=Path("/tmp/lamu.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Lamu-roof-shadow-current/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: p.write_bytes(r.read())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected: raise SystemExit(actual)

          ex=GenericPlanReaderExtractor()
          preds=ex.extract_from_pdf(p,pages=[40,41,42,43,44],collect_item35_shadow=False)
          rows=[x.to_dict() for x in preds]

          doc=fitz.open(p)
          datum={}
          for idx in range(40,45):
              text=doc[idx].get_text("text") or ""
              datum[str(idx+1)]={
                  "lines":[ln.strip() for ln in text.splitlines() if any(k in ln.upper() for k in ("ROOF","FLOOR LEVEL","LEVEL","PITCH","SHEET ROOF"))],
                  "markers":[getattr(m,"__dict__",str(m)) for m in find_level_markers(text,source_page=idx+1)],
              }
          doc.close()

          engine=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/results",
          )
          report=engine.evaluate_benchmark(
              benchmark_id="tenders_ke_lamu_ishakani_ecd_classrooms",
              pdf_path=p,
              predictions=rows,
              auto_extract=False,
          )
          items=[i.to_dict() for i in report.item_results]
          print("LAMU_ROOF_SHADOW_CURRENT="+json.dumps({
              "production_sha":"633347965939aa4184d8edfc2330dd758601c1c9",
              "source_sha256":actual,
              "roof_shadow":ex.roof_covering_shadow,
              "extraction_status":ex.extraction_status,
              "roof_predictions":[r for r in rows if "roof" in str(r.get("tag","")).lower() or "roof" in str(r.get("description","")).lower()],
              "wall_finish_predictions":[r for r in rows if r.get("tag") in ("perimeter_walling","internal_plaster","internal_paint","damp_proof_course","gable_walling")],
              "datum":datum,
              "project":{
                  "accepted":report.exact_matches+report.within_5_percent,
                  "denominator":report.total_items_compared,
                  "accuracy_percentage":report.overall_accuracy_percentage,
                  "hallucinated":report.hallucinated_items,
              },
              "target_items":[i for i in items if i.get("item_id") in ("LMU-E4-A","LMU-D8-A","LMU-F1-A","LMU-F2-A","LMU-D3-A")],
          },sort_keys=True,default=str),flush=True)
          PY
