name: TEST GPT2 Original OFFICE PWD FT2 FT3 Mark Containment
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_original_finish_mark_in_room_ink_shadow.py"
      - "tests/test_gpt2_original_ft2_ft3_mark_ink_enclosure.py"
      - ".github/workflows/test-gpt2-ft2-ft3-original-ink-mark-owner.yml"
  workflow_dispatch:
jobs:
  source-ink-mark-no-area:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original source mark/room ink only plus adversarial conflicts
        env:
          PYTHONPATH: .
        run: |
          if [ -f documents/sources/Arch_Combined_Maryborough_Service_Station.pdf ]; then
            echo "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007  documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" | sha256sum --check
          else
            echo "::notice::Private original PDF unavailable on this merge checkout; synthetic source tests run, ORIGINAL SOURCE ACCEPTANCE REMAINS BLOCKED."
          fi
          python -m pytest -q -rs tests/test_gpt2_original_office_pwd_four_edge_crosssheet_source.py tests/test_gpt2_original_ft2_ft3_mark_ink_enclosure.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
