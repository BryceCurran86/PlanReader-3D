name: TEST-ONLY Ghazi Ceiling All Drawings 713e62

on:
  pull_request:
    branches: [main]

jobs:
  ghazi-ceiling-all:
    if: startsWith(github.head_ref, 'diag/ghazi-ceiling-all-drawings-713e62')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Scan Ghazi drawing pages for ceiling evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_source_ceiling_finish_evidence import iter_explicit_ceiling_finish_matches
          from pb_live_ceiling_lining_integration import collect_live_ceiling_lining_claims
          from pb_viewport_segmentation import segment_page_viewports,is_authoritative_derived_viewport

          url="https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf"
          expected="c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f"
          p=Path("/tmp/ghazi.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-Ghazi-ceiling-all/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:p.write_bytes(r.read())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected:raise SystemExit(actual)

          doc=fitz.open(p)
          ex=GenericPlanReaderExtractor()
          rows=[]
          # Drawing package is at the tail of the tender. Scan a deliberately
          # wider window so ceiling material evidence cannot be missed merely
          # because it is on a section/elevation/notes sheet rather than the plan.
          start=max(0,len(doc)-20)
          for idx in range(start,len(doc)):
              page=doc[idx]
              native=page.get_text("text") or ""
              if not ex.is_drawing_page(native,page):
                  continue
              ocr=""
              if len(native.strip())<150 or ex._page_has_large_raster(page):
                  try: ocr=ex._ocr_text_for_page(page,idx)
                  except Exception as exc: ocr=f"OCR_ERROR:{type(exc).__name__}"
              combined=native+"\n"+ocr
              matches=iter_explicit_ceiling_finish_matches(combined)
              hits=[ln.strip() for ln in combined.splitlines() if re.search(r"(?i)(ceiling|chip\s*board|chipboard|brandering|softboard|plywood|gypsum|soffit)",ln)]
              vps=segment_page_viewports(page,page_number=idx+1)
              rows.append({
                  "page":idx+1,
                  "native_chars":len(native.strip()),
                  "ocr_chars":len(ocr.strip()),
                  "hits":hits[:100],
                  "explicit_matches":matches,
                  "viewports":[{
                      "id":v.view_id,"type":v.view_type,"label":v.label,
                      "status":v.status,"bbox":v.bounding_box,
                      "boundary_source":v.boundary_source,
                      "authoritative_derived":is_authoritative_derived_viewport(v),
                  } for v in vps],
              })
          doc.close()

          live=collect_live_ceiling_lining_claims(p,pages=[166,167,168])
          prod=GenericPlanReaderExtractor()
          preds=prod.extract_from_pdf(p,pages=[166,167,168],collect_item35_shadow=False)
          print("GHAZI_CEILING_ALL_DRAWINGS="+json.dumps({
              "production_sha":"713e62001779303ecc38046bf7a099d1318f086a",
              "source_sha256":actual,
              "pages":rows,
              "live":{
                  "status":getattr(live.status,"value",str(live.status)),
                  "reason_codes":live.reason_codes,
                  "claims":[c.__dict__ for c in live.claims],
              },
              "production_ceiling_live":prod.ceiling_lining_live,
              "ceiling_predictions":[x.to_dict() for x in preds if x.tag=="ceiling_lining"],
              "floor_predictions":[x.to_dict() for x in preds if x.tag=="floor_screed"],
          },sort_keys=True,default=str),flush=True)
          PY
