name: DIAG GPTMAX Lot16 After Exact Two Face Host

on:
  pull_request:
    branches:
      - gptmax/exact-two-face-lineage-host-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run real Lot16 host + area shadow
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_after_exact_two_face_host.py | tee lot16-after-exact-two-face-host.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-after-exact-two-face-host
          path: lot16-after-exact-two-face-host.json
          retention-days: 2
