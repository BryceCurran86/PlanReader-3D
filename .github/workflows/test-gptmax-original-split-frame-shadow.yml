name: GPT MAX Original Split-Centreline Frame Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - pb_opening_host_frame_authority.py
      - pb_physical_wall_candidate_authority.py
      - tests/test_gptmax_raster_split_frame_shadow.py
      - tests/test_physical_wall_candidate_drafting_motif_filter.py
      - tests/test_raster_connected_host_frame.py
      - tools/diag_gptmax_source_split_frame_shadow.py
      - docs/engineering/gptmax_split_centerline_frame_shadow_20261015.md
      - docs/engineering/gptmax_aligned_fragment_motif_distinct_20261016.md
      - docs/engineering/gptmax_870_shadow_frame_gpt1_bundles_20261016.md
      - .github/workflows/test-gptmax-original-split-frame-shadow.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  own-source-fragment-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13","3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=.:tests python -m pytest -q tests/test_gptmax_raster_split_frame_shadow.py tests/test_raster_connected_host_frame.py tests/test_physical_wall_candidate_drafting_motif_filter.py
          ruff check --select F821,F823 pb_opening_host_frame_authority.py pb_physical_wall_candidate_authority.py tests/test_gptmax_raster_split_frame_shadow.py tests/test_physical_wall_candidate_drafting_motif_filter.py tools/diag_gptmax_source_split_frame_shadow.py
      - name: Record private replay status for pull requests
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        run: echo "Private original split-frame replay NOT RUN. Public tests are source-neutral." >> "$GITHUB_STEP_SUMMARY"
  original-sha-pinned-split-host-frame-replay:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'BryceCurran86/PlanReader-3D' && github.actor == 'BryceCurran86' && github.triggering_actor == 'BryceCurran86'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Provision exact owner-private original
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: 1. Construction Plans - Lot 16 Power (REV E).pdf
          allow-missing: "false"
      - name: Original source proof and shadow-only frame graph
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/gptmax-original-split-frame"
          mkdir -p "$private_dir"
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum -c
          if ! PYTHONPATH=. python -u tools/diag_gptmax_source_split_frame_shadow.py \
            --pdf "$PDF" --page-id 3 \
            --sha256 10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844 \
            --output "$private_dir/report.json" > "$private_dir/replay.log" 2>&1; then
            echo "::error::Original Lot16 split-frame replay failed. Private details withheld."
            exit 1
          fi
      - name: Original host and eight customer body invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          private=Path(os.environ['RUNNER_TEMP'])/'gptmax-original-split-frame'/'report.json'
          r=json.loads(private.read_text())
          assert r['status']=='UNPUBLISHED_ORIGINAL_SPLIT_FRAME_SHADOW'
          assert r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['snapshot_id']=='source_snapshot_3fcb6bc5c44b51d930e9600080501d27'
          assert r['baseline_physical_count']==21
          assert r['baseline_authenticated_host_count']==15
          assert r['baseline_complete_frame_count']==9
          assert r['baseline_signed_opening_area_count']==8
          assert len(r['opening_rows'])==21
          assert r['shadow_complete_frame_count']>=9
          assert r['source_snapshot_signed_customer_retained']
          assert not r['customer_seal_activation_granted']
          assert not r['gpt1_metric_axis_handoff_granted']
          assert not r['global_opening_count_granted']
          assert all(not x['new_customer_quantity_granted'] for x in r['opening_rows'])
          bundles=r['gpt1_shadow_frame_source_bundles']
          assert [x['physical_opening_id'] for x in bundles]==r['new_frame_hypothesis_ids']
          assert all(not x['firm_quantity_granted'] for x in bundles)
          assert all(not x['gpt1_metric_axis_handoff_granted'] for x in bundles)
          assert all(x['skip_receipts_are_decision_provenance_not_frame_identity'] for x in bundles)
          selected=[x for x in r['opening_rows']
                    if x['physical_opening_id']=='physical_opening_existence_2c31ccb074d8eae86cac281c0fde1176']
          assert len(selected)==1
          assert 'raster_split_centerline_host_resolved' in selected[0]['original_host_reason_codes']
          assert selected[0]['original_frame_record_id'] is None
          print('Original split-frame shadow and signed opening retention verified.')
          PY
