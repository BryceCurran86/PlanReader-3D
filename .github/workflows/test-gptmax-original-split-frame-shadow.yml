name: GPT MAX Original Split-Centreline Frame Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - pb_opening_host_frame_authority.py
      - pb_live_wall_opening_authority_composition.py
      - tests/test_gptmax_alternate_raster_frame_source_edge_gate.py
      - pb_physical_wall_candidate_authority.py
      - tests/test_gptmax_raster_split_frame_shadow.py
      - tests/test_physical_wall_candidate_drafting_motif_filter.py
      - tests/test_raster_connected_host_frame.py
      - tools/diag_gptmax_source_split_frame_shadow.py
      - docs/engineering/gptmax_split_centerline_frame_shadow_20261015.md
      - docs/engineering/gptmax_aligned_fragment_motif_distinct_20261016.md
      - docs/engineering/gptmax_870_shadow_frame_gpt1_bundles_20261016.md
      - .github/workflows/test-gptmax-original-split-frame-shadow.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  # PUBLIC PR/workflow_dispatch: source-neutral only. Original PDF/frame
  # assertions and unpublished reports belong in an owner-trusted private
  # source replay, never an untrusted PR checkout or public artifact upload.
  own-source-fragment-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13","3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=.:tests python -m pytest -q tests/test_gptmax_raster_split_frame_shadow.py tests/test_raster_connected_host_frame.py tests/test_physical_wall_candidate_drafting_motif_filter.py tests/test_gptmax_alternate_raster_frame_source_edge_gate.py
          ruff check --select F821,F823 pb_opening_host_frame_authority.py pb_live_wall_opening_authority_composition.py pb_physical_wall_candidate_authority.py tests/test_gptmax_alternate_raster_frame_source_edge_gate.py tests/test_gptmax_raster_split_frame_shadow.py tests/test_physical_wall_candidate_drafting_motif_filter.py tools/diag_gptmax_source_split_frame_shadow.py
