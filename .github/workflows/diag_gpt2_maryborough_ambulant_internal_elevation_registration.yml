name: DIAG GPT2 Maryborough Ambulant Internal Elevation Registration

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trace ambulant room-side registration
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-ambulant-internal-elevation-registration
          git rev-parse HEAD > artifacts/gpt2-ambulant-internal-elevation-registration/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-ambulant-internal-elevation-registration/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_ambulant_internal_elevation_registration.py \
            | tee artifacts/gpt2-ambulant-internal-elevation-registration/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-ambulant-internal-elevation-registration
          path: artifacts/gpt2-ambulant-internal-elevation-registration
          retention-days: 1
