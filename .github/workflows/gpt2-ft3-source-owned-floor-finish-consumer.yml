name: GPT2 FT3 Source-Neutral Floor Finish Consumer

on:
  pull_request:
    paths:
      - pb_cross_view_floor_finish_authority.py
      - pb_source_material_semantic_authority.py
      - tests/test_cross_view_floor_finish_authority_v1.py
      - tests/test_source_plan_material_occurrences.py
      - .github/workflows/gpt2-ft3-source-owned-floor-finish-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  original-ft3-bounded-material-and-floor-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Source-owned and ordinary floor-finish tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_source_plan_material_occurrences.py tests/test_cross_view_floor_finish_authority_v1.py tests/test_source_owned_physical_plan_view.py tests/test_source_material_semantic_authority_v1.py tests/test_live_floor_area_quantity_publication_integrity.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
      - name: Original-source test is NOT RUN on public PRs
        shell: bash
        run: |
          set -euo pipefail
          echo '::notice::Original Maryborough tests NOT RUN on public CI; protected exact-head private replay required before release'
          echo 'Original Maryborough source tests NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
