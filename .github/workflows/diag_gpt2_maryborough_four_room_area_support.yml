name: DIAG GPT2 Maryborough Four Room Area Support

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run source-classified room-area support probe
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-maryborough-four-room-area-support
          git rev-parse HEAD > artifacts/gpt2-maryborough-four-room-area-support/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-maryborough-four-room-area-support/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_four_room_area_support.py \
            | tee artifacts/gpt2-maryborough-four-room-area-support/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-four-room-area-support
          path: artifacts/gpt2-maryborough-four-room-area-support
          retention-days: 1
