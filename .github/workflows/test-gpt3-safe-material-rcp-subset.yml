name: TEST GPT3 Safe Material RCP Subset

on:
  push:
    branches:
      - fix/gpt3-material-rcp-safe-subset-v1
concurrency:
  group: test-gpt3-safe-material-rcp-subset
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused authority tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_source_material_semantic_authority_v1.py \
            tests/test_cross_view_ceiling_finish_authority.py \
            tests/test_cross_view_ceiling_quantity_authority.py \
            tests/test_cross_view_room_area_authority_v1.py \
            tests/test_source_closed_project_handoff.py

  maryborough-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Run real Maryborough surfaces
        shell: bash
        run: |
          set -o pipefail
          ROOT=artifacts/gpt3-safe-material-rcp/maryborough
          mkdir -p "$ROOT"
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id au_qld_maryborough_service_station \
            --workspace-id 1 \
            --family-group surfaces \
            --output-dir "$ROOT" \
            | tee "$ROOT/handoff.stdout.json"
      - name: Audit real surface output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/gpt3-safe-material-rcp/maryborough")
          summary=json.loads((root/"production_summary.json").read_text())
          sealed=root/"au_qld_maryborough_service_station.surfaces.json"
          payload=json.loads(sealed.read_text()) if sealed.is_file() else {}
          q=payload.get("quantities") or []
          out={
            "summary":summary,
            "quantity_count":len(q),
            "lineage_conflicts":sum(not bool(x.get("lineage_ok",False)) for x in q),
            "zero_non_abstained":sum(
              not bool(x.get("abstained",False))
              and x.get("value") is not None
              and float(x["value"]) == 0.0
              for x in q
            ),
            "family_counts":{},
            "quantities":[{
              "quantity_id":x.get("quantity_id"),
              "family":x.get("family"),
              "semantic_key":x.get("semantic_key"),
              "value":x.get("value"),
              "unit":x.get("unit"),
              "object_identity_refs":x.get("object_identity_refs") or [],
              "source_page":x.get("source_page"),
              "viewport_id":x.get("viewport_id"),
              "lineage_ok":x.get("lineage_ok"),
            } for x in q],
          }
          for row in q:
            out["family_counts"][row.get("family")]=out["family_counts"].get(row.get("family"),0)+1
          assert out["lineage_conflicts"] == 0, out
          assert out["zero_non_abstained"] == 0, out
          assert out["family_counts"].get("floor_area",0) >= 3, out
          (root/"audit.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Build fail-closed Maryborough identity map
        shell: bash
        run: |
          cat > artifacts/gpt3-safe-material-rcp/maryborough/maryborough.empty-identity-map.json <<'JSON'
          {
            "schema_version": "1.0.0",
            "project_id": "au_qld_maryborough_service_station",
            "source_sha256s": [
              "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
            ],
            "bindings": []
          }
          JSON
      - name: Run exact frozen Maryborough reconciliation
        shell: bash
        run: |
          PYTHONPATH=. python -u benchmarks/frozen_holdout/full_plan_v2/run_exact_project_reconciliation.py \
            --manifest benchmarks/frozen_holdout/full_plan_v2/projects/au_qld_maryborough_service_station/source_manifest.json \
            --sealed-run artifacts/gpt3-safe-material-rcp/maryborough/au_qld_maryborough_service_station.surfaces.json \
            --identity-map artifacts/gpt3-safe-material-rcp/maryborough/maryborough.empty-identity-map.json \
            --output artifacts/gpt3-safe-material-rcp/maryborough/maryborough.exact-report.json
          cat artifacts/gpt3-safe-material-rcp/maryborough/maryborough.exact-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-safe-material-rcp-maryborough
          path: artifacts/gpt3-safe-material-rcp/maryborough
          retention-days: 3
