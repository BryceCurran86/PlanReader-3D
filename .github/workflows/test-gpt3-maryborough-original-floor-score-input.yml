name: TEST GPT3 Maryborough Original Floor Score Input

on:
  pull_request:
    branches: [main]
    paths:
      # every module the replayed production chain can import must re-run the signed-output replay
      - "pb_*.py"
      - "tools/diag_pdf_symbol_byte_glyph_shadow.py"
      - "tools/diag_original_pdf_active_clip_operator_authority.py"
      # GPT2 source interpretation now belongs to the production/sealed
      # import closure. Changes to any of these source readers must retrigger
      # both original signed-output replay checks, not only ordinary CI.
      - "tools/diag_gpt2_*.py"
      - "tools/diag_original_room_four_edge_source_ink_shadow.py"
      - "tools/run_source_closed_project_handoff.py"
      - "tools/diag_gpt2_room_measurement_gates.py"
      - "tools/diag_gpt3_maryborough_floor_customer_gate.py"
      - "tools/run_gpt3_maryborough_original_floor_score_input.py"
      - "tests/test_gpt3_maryborough_original_floor_score_input.py"
      - ".github/workflows/test-gpt3-maryborough-original-floor-score-input.yml"
      - "pb_wall_room_topology_typed_negative_evidence.py"
      - "pb_live_floor_family_customer_output.py"
      - "pb_live_floor_area_source_closed_export.py"
      - "pb_live_floor_finish_area_source_closed_export.py"
      - "pb_live_floor_area_customer_projection.py"
      - "pb_live_floor_finish_customer_projection.py"
      - "pb_source_closed_run_export.py"
      - "pb_customer_output_verification.py"
      - "pb_material_schedule_v1222.py"
      - "pb_source_material_semantic_authority.py"
      - "tools/prepare_gpt3_pending_floor_surface_identity_activation.py"
      - "tools/gpt3_original_source_preflight.py"
      - "tests/test_gpt3_original_source_preflight.py"
      - "tools/diag_native_multipath_cad_grid_source_shadow.py"
      - "tests/test_live_floor_family_customer_output.py"
      - "tests/test_gpt3_pending_floor_surface_identity_activation.py"
  workflow_dispatch:

concurrency:
  group: gpt3-maryborough-floor-score-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source-seal score-input regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_maryborough_original_floor_score_input.py tests/test_live_floor_family_customer_output.py tests/test_gpt3_pending_floor_surface_identity_activation.py
          python -m compileall -q tools/run_gpt3_maryborough_original_floor_score_input.py
          ruff check --select F821,F823 tools/run_gpt3_maryborough_original_floor_score_input.py tests/test_gpt3_maryborough_original_floor_score_input.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
