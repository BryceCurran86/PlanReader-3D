name: GPT3 Original Scope to V1 Customer

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt3_original_scope_v1_consumer.py"
      - "tools/diag_gptmax_producer_opening_scope_receipts.py"
      - "tools/diag_gptmax_producer_owned_g17_wall_shadow.py"
      - "tools/diag_lot16_room_face_scope.py"
      - "tools/export_gpt3_produced_items.py"
      - "tools/run_gpt3_lot16_original_sealed_score_input.py"
      - "scripts/report_full_plan_v2_readiness.py"
      - "tools/run_source_closed_project_handoff.py"
      - "tools/diag_gptmax_source_authority_stages.py"
      - "tools/diag_gptmax_raster_unhosted_flank_source.py"
      - "tests/test_gpt3_original_scope_v1_consumer.py"
      - "tests/test_signed_output_gate_path_coverage.py"
      - "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf"
      - "scripts/check_full_plan_v2_integrity.py"
      - "scripts/check_provider_gold_isolation.py"
      - "requirements.txt"
      - "requirements-ci-v1228.txt"
      - "pb_*.py"
      - ".github/workflows/test-gpt3-original-scope-v1-consumer.yml"
      - "tools/gpt3_original_source_preflight.py"
      - "tests/test_gpt3_original_source_preflight.py"
  workflow_dispatch:

concurrency:
  group: gpt3-source-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Original-source V1 positive/negative regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_gpt3_original_scope_v1_consumer.py tests/test_gptmax_producer_opening_scope_receipts.py
          ruff check --select F821,F823 tools/diag_gpt3_original_scope_v1_consumer.py tests/test_gpt3_original_scope_v1_consumer.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
