name: Wall Opening Authority Trace

on:
  push:
    branches: [gpt/wall-opening-net-finish-v1]
  workflow_dispatch:

jobs:
  observe-kstvet-live-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify KSTVET source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf" \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

      - name: Observe live commercial wall/opening predictions
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          pdf = Path("benchmarks/sources/1727358888238-bq-nd-drawing.pdf")
          extractor = GenericPlanReaderExtractor()
          preds = extractor.extract_from_pdf(
              pdf,
              pages=[53, 54],
              collect_item35_shadow=False,
          )
          keep = {}
          for pred in preds:
              if (
                  pred.tag in {
                      "perimeter_walling",
                      "internal_plaster",
                      "internal_paint",
                      "external_key_pointing",
                      "external_render",
                      "W1",
                      "W2",
                      "D1",
                      "D2",
                  }
                  or pred.trade_type in {"windows", "doors"}
              ):
                  keep[pred.tag] = pred.to_dict()
          payload = {
              "predictions": keep,
              "extraction_status": extractor.extraction_status,
          }
          Path("kstvet_live_wall_opening_observation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload live extractor observation
        uses: actions/upload-artifact@v4
        with:
          name: kstvet-live-wall-opening-observation
          path: kstvet_live_wall_opening_observation.json
          if-no-files-found: error

  inspect-kstvet-finish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyMuPDF
        run: pip install PyMuPDF==1.28.0

      - name: Download and verify KSTVET source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf" \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

      - name: Print finish-bearing source lines on drawing pages
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path("benchmarks/sources/1727358888238-bq-nd-drawing.pdf")
          doc=fitz.open(p)
          for idx in (53,54):
              page=doc[idx]
              print(f"=== PAGE {idx+1} ===")
              blocks=page.get_text("blocks") or []
              for block in blocks:
                  txt=str(block[4] if len(block)>4 else "")
                  norm=" ".join(txt.split())
                  if any(k in norm.lower() for k in ("plaster","paint","masonry","internal","finish")):
                      print("BBOX", tuple(round(float(v),2) for v in block[:4]))
                      print(norm)
          doc.close()
          PY

  observe-lamu-live-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify Lamu source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf" \
            -o benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf" | sha256sum -c -

      - name: Observe Lamu live commercial wall/opening predictions
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          pdf = Path("benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf")
          extractor = GenericPlanReaderExtractor()
          preds = extractor.extract_from_pdf(
              pdf,
              pages=[40, 41, 42, 43, 44],
              collect_item35_shadow=False,
          )
          keep = {}
          for pred in preds:
              if (
                  pred.tag in {
                      "perimeter_walling",
                      "internal_plaster",
                      "internal_paint",
                      "external_key_pointing",
                      "external_render",
                      "W1",
                      "W2",
                      "D1",
                      "D2",
                  }
                  or pred.trade_type in {"windows", "doors"}
              ):
                  keep[pred.tag] = pred.to_dict()
          payload = {
              "predictions": keep,
              "extraction_status": extractor.extraction_status,
          }
          Path("lamu_live_wall_opening_observation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload Lamu live extractor observation
        uses: actions/upload-artifact@v4
        with:
          name: lamu-live-wall-opening-observation
          path: lamu_live_wall_opening_observation.json
          if-no-files-found: error

  trace-kstvet-wall-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify KSTVET source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf" \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

      - name: Trace KSTVET page 54 authority seam
        env:
          PYTHONPATH: .
        run: |
          python scripts/trace_wall_opening_authority_chain.py \
            benchmarks/sources/1727358888238-bq-nd-drawing.pdf \
            --document-id tenders_ke_kstvet_cbc_classroom \
            --page-id 54 \
            --output wall_opening_trace_kstvet_p54.json

      - name: Print causal summary
        if: always()
        run: |
          if [ -f wall_opening_trace_kstvet_p54.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("wall_opening_trace_kstvet_p54.json").read_text())
          print("FIRST_CAUSAL_FAILURE =", json.dumps(d.get("FIRST_CAUSAL_FAILURE"), indent=2))
          print("wall_candidate_count =", d.get("wall_candidate_count"))
          print("physical_opening_count =", d.get("physical_opening_count"))
          print("host_binding_resolved_count =", d.get("host_binding_resolved_count"))
          for row in d.get("trace", []):
              print(
                  row.get("FILE"),
                  row.get("CLASS_FUNCTION"),
                  "STATUS=", row.get("STATUS"),
                  "REASONS=", row.get("REASON_CODES"),
                  "RECORD=", row.get("RECORD_ID"),
              )
          PY
          fi

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-opening-trace-kstvet-p54
          path: wall_opening_trace_kstvet_p54.json
          if-no-files-found: warn
