name: GPT MAX actual original 2127 combined physical G17 source parity
on:
  pull_request:
    branches: [main, gptmax/g17-incomplete-exact-source-endpoints-20261017]
    paths:
      - tools/diag_gptmax_unmeasured_flank_capture_shadow.py
      - tests/test_gptmax_original_2127_combined_policy_replay.py
      - .github/workflows/test-gptmax-original-2127-combined-physical-g17.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-original-physical-and-g17-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt pytest
      - name: Synthetic source and issuer negatives
        run: PYTHONPATH=. python -m pytest -q tests/test_gptmax_original_2127_combined_policy_replay.py tests/test_gptmax_g17_paired_retention.py
      - name: SHA-verified original three-dimensional source/issuer report
        run: |
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' | sha256sum -c
          PYTHONPATH=. python -m tools.diag_gptmax_unmeasured_flank_capture_shadow --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' --output /tmp/original-combined-g17.json
      - name: Upload strict unapproved source-authority retention report
        uses: actions/upload-artifact@v4
        with:
          name: original-2127-unapproved-physical-host-parity
          path: /tmp/original-combined-g17.json
