name: Isolated full Python shard pilot (not release CI)
on:
  pull_request:
    paths:
      - '.github/workflows/ci-shard-pilot.yml'
      - 'scripts/ci_pytest_shard.py'
      - 'tests/test_ci_pytest_shard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-shard-pilot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-v1228.txt
      - name: Install unchanged test dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Execute one isolated complete-collection shard
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
          PLANREADER_CI_SHARDS: '4'
          PLANREADER_CI_SHARD_INDEX: ${{ matrix.index }}
          PLANREADER_CI_SHARD_RECEIPT: ${{ runner.temp }}/receipt.json
        run: |
          python -m pytest -p scripts.ci_pytest_shard -q -rs --durations=20 tests/
      - name: Retain count and digest receipt only (no source bytes or test output)
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.python-version }}-${{ matrix.index }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 2
  verify:
    needs: shard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.python-version }}-*
          path: ${{ runner.temp }}/shards
      - name: Verify all shards ran against an identical complete test collection
        run: |
          set -euo pipefail
          python scripts/ci_pytest_shard.py "$RUNNER_TEMP/shards" 4 | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Pilot only; existing required full CI and security gates are unchanged.' >> "$GITHUB_STEP_SUMMARY"
