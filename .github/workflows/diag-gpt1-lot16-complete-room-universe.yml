name: DIAG GPT1 Lot16 Complete Room Universe

on:
  push:
    branches:
      - gpt1/room-face-universe-viewport-replay-v1

concurrency:
  group: diag-gpt1-lot16-complete-room-universe
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused room tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_canonical_room_composition.py             tests/test_source_room_viewport_scope_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Real Lot16 room and surface proof
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-complete-room-universe.json
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(2,),
              topology_pages=(2,),
              room_area_support_pages=None,
          )
          labels=[
              {
                  "label":r.room_label,
                  "physical_room_id":r.physical_room_id,
                  "viewport_id":r.viewport_id,
                  "decision_scope_id":r.decision_scope_id,
                  "geometry_complete":r.geometry_complete,
                  "label_binding":r.room_label_binding_record_id,
              }
              for r in claim.canonical_rooms
              if r.room_label
          ]
          room_q=[
              q for q in claim.room_area_quantity_evidence
              if not q.abstained and q.value is not None
          ]
          floor_q=[
              q for q in publish_live_floor_area_quantities(claim)
              if not q.abstained and q.value is not None
          ]
          out={
              "canonical_room_status":claim.canonical_room_status.value,
              "canonical_room_reason_codes":list(claim.canonical_room_reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "labeled_room_count":len(labels),
              "labels":labels,
              "firm_room_area_count":len(room_q),
              "room_areas":[
                  {
                      "value":q.value,
                      "metadata":dict(q.metadata or {}),
                  }
                  for q in room_q
              ],
              "floor_area_quantity_count":len(floor_q),
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-complete-room-universe
          path: lot16-complete-room-universe.json
          retention-days: 3
