name: DIAG GPT1 Lot16 Complete Room Universe

on:
  push:
    branches:
      - gpt1/room-face-universe-viewport-replay-v1

concurrency:
  group: diag-gpt1-lot16-complete-room-universe
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Focused room tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_live_canonical_room_composition.py             tests/test_source_room_viewport_scope_v1.py             tests/test_same_view_room_area_authority_v1.py
      - name: Real Lot16 room and surface proof
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-complete-room-universe.json
          import json
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities
          # Workflow-only source geometry trace. No production gate is changed.
          import sys
          import pb_source_room_face_authority as face_authority
          original_extract=face_authority.extract_planar_faces
          original_derive=face_authority._derive_scope_outcome
          original_blocked=face_authority._blocked

          def trace_faces(segments, *args, **kwargs):
              faces=original_extract(segments, *args, **kwargs)
              areas=sorted(
                  face_authority._polygon_area(polygon)
                  for face in faces
                  if (polygon := face_authority._canonical_polygon(face))
              )
              largest=areas[-1] if areas else 0.0
              print("LOT16_FACE_DIAG", json.dumps({
                  "input_segment_count":len(segments),
                  "raw_face_count":len(faces),
                  "small_absolute_count":sum(a < face_authority._ABSOLUTE_DEGENERATE_AREA_PT2 for a in areas),
                  "small_relative_count":sum(a < largest*face_authority._TINY_RELATIVE_THRESHOLD for a in areas),
                  "largest_area_pt2":largest,
                  "median_area_pt2":areas[len(areas)//2] if areas else None,
                  "sample_smallest_areas_pt2":areas[:15],
                  "sample_largest_areas_pt2":areas[-5:],
              },sort_keys=True),file=sys.stderr,flush=True)
              return faces

          def trace_blocked(scope, reason):
              print("LOT16_ROOM_GATE",json.dumps({
                  "page_id":getattr(scope,"page_id",None),
                  "decision_scope_id":getattr(scope,"decision_scope_id",None),
                  "viewport_id":getattr(scope,"viewport_id",None),
                  "wall_scope_complete":getattr(scope,"scope_complete",None),
                  "reason":reason,
              },sort_keys=True),file=sys.stderr,flush=True)
              return original_blocked(scope, reason)

          def trace_derive(scope):
              records=tuple(getattr(scope,"records",()) or ())
              print("LOT16_WALL_SCOPE",json.dumps({
                  "page_id":getattr(scope,"page_id",None),
                  "decision_scope_id":getattr(scope,"decision_scope_id",None),
                  "viewport_id":getattr(scope,"viewport_id",None),
                  "wall_scope_complete":getattr(scope,"scope_complete",None),
                  "wall_scope_status":str(getattr(scope,"status",None)),
                  "wall_record_count":len(records),
                  "wall_edge_count":sum(len(face_authority._wall_edges(r)) for r in records),
              },sort_keys=True),file=sys.stderr,flush=True)
              return original_derive(scope)

          face_authority.extract_planar_faces=trace_faces
          face_authority._blocked=trace_blocked
          face_authority._derive_scope_outcome=trace_derive

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(2,),
              topology_pages=(2,),
              room_area_support_pages=None,
          )
          labels=[
              {
                  "label":r.room_label,
                  "physical_room_id":r.physical_room_id,
                  "viewport_id":r.viewport_id,
                  "decision_scope_id":r.decision_scope_id,
                  "geometry_complete":r.geometry_complete,
                  "label_binding":r.room_label_binding_record_id,
              }
              for r in claim.canonical_rooms
              if r.room_label
          ]
          room_q=[
              q for q in claim.room_area_quantity_evidence
              if not q.abstained and q.value is not None
          ]
          floor_q=[
              q for q in publish_live_floor_area_quantities(claim)
              if not q.abstained and q.value is not None
          ]
          out={
              "canonical_room_status":claim.canonical_room_status.value,
              "canonical_room_reason_codes":list(claim.canonical_room_reason_codes),
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "labeled_room_count":len(labels),
              "labels":labels,
              "firm_room_area_count":len(room_q),
              "room_areas":[
                  {
                      "value":q.value,
                      "metadata":dict(q.metadata or {}),
                  }
                  for q in room_q
              ],
              "floor_area_quantity_count":len(floor_q),
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-complete-room-universe
          path: lot16-complete-room-universe.json
          retention-days: 3
