name: DIAG GPT2 Remaining Host Unsafe Bridges

on:
  pull_request:
    branches: [ main ]

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Classify remaining unsafe bridges
        run: |
          set -o pipefail
          OUT=artifacts/gpt2-host-remaining-unsafe-bridges
          mkdir -p "$OUT"
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee "$OUT/result.json"
          import json
          from collections import Counter
          from pathlib import Path

          import pb_opening_host_binding_authority as host
          from pb_live_wall_opening_authority_composition import (
              compose_live_wall_opening_authority,
          )
          from pb_physical_wall_candidate_authority import (
              PhysicalWallCandidateSelector,
          )
          from pb_source_observation_authority import ObservationSelector
          from pb_source_visibility_authority import SourceVisibilityProducer

          SOURCE=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          source=SourceVisibilityProducer(
              producer_method="diag-gpt2-host-remaining-unsafe-bridges",
              producer_version="1",
          )
          published=source.ingest_native_pdf_bytes(
              document_id="diag-gpt2-host-remaining-unsafe-bridges",
              source_bytes=SOURCE.read_bytes(),
              source_locator="memory://maryborough.pdf",
              page_ids=("7","30","31"),
          )
          composition=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("7","30","31"),
          )

          def relevant(record, geometry, raster_mode):
              if host._candidate_host_roles(record, geometry):
                  return True
              if not raster_mode:
                  return False
              if host._raster_whole_wall_role_data(record, geometry) is not None:
                  return True
              identity=record.physical_identity
              if (
                  not identity.usable
                  or not identity.candidate_identity_id
                  or not any(str(v).strip() for v in identity.source_primitive_ids)
              ):
                  return False
              edge_tol=max(0.5,min(2.0,geometry.length*0.02))
              return host._candidate_locally_owns_opening_span(
                  record,geometry,edge_tol=edge_tol
              )

          rows=[]
          for trace in composition.opening_bindings:
              if host.HOST_LOCAL_BOUNDARY_SCOPE_UNAVAILABLE not in trace.reason_codes:
                  continue
              if "host_equivalence_bridges_unsafe_boundary_evidence" not in trace.reason_codes:
                  continue
              selector=composition.binding_selectors.get(trace.opening_identity_id)
              if selector is None:
                  continue
              obs=ObservationSelector(
                  document_id=selector.document_id,
                  revision_id=selector.revision_id,
                  source_sha256=selector.source_sha256,
                  snapshot_id=selector.snapshot_id,
                  observation_id=trace.representative_observation_id,
              )
              existence=composition.physical_opening_authority.prove_existence(obs)
              opening=existence.existence_record
              if opening is None:
                  continue
              geometry=host._opening_geometry(
                  composition.physical_opening_authority,opening
              )
              if geometry is None:
                  continue
              wall_scope=composition.physical_wall_candidate_authority.resolve_scope(
                  PhysicalWallCandidateSelector(
                      document_id=selector.document_id,
                      revision_id=selector.revision_id,
                      source_sha256=selector.source_sha256,
                      snapshot_id=selector.snapshot_id,
                      page_id=selector.page_id,
                      decision_scope_id=selector.decision_scope_id,
                  )
              )
              if wall_scope.equivalence is None or wall_scope.boundary_evaluation is None:
                  continue
              recs={str(r.wall_candidate_id):r for r in wall_scope.records}
              raster_mode=(
                  opening.structural_pattern
                  == host.RASTER_FRAMED_WALL_BAND_INTERRUPTION
              )
              relevant_ids={
                  wall_id for wall_id,record in recs.items()
                  if relevant(record,geometry,raster_mode)
              }
              ev=wall_scope.boundary_evaluation
              evaluated={str(v) for v in ev.evaluated_wall_candidate_ids}
              tainted={str(v) for v in ev.boundary_tainted_wall_candidate_ids}
              clean=evaluated-tainted
              unsafe=set(recs)-clean

              triggers=[]
              for group in wall_scope.equivalence.equivalence_groups:
                  members={str(v) for v in group}
                  if members & relevant_ids and members & unsafe:
                      triggers.append({
                          "kind":"positive_same_group",
                          "relevant_ids":sorted(members & relevant_ids),
                          "unsafe_ids":sorted(members & unsafe),
                      })

              for left,right,raw in wall_scope.equivalence.pair_classifications:
                  pair={str(left),str(right)}
                  rel=sorted(pair & relevant_ids)
                  bad=sorted(pair & unsafe)
                  if not rel or not bad:
                      continue
                  if str(raw) != "ambiguous_physical_equivalence":
                      continue
                  for rel_id in rel:
                      for bad_id in bad:
                          if rel_id==bad_id:
                              continue
                          rel_rec=recs.get(rel_id)
                          bad_rec=recs.get(bad_id)
                          if rel_rec is None or bad_rec is None:
                              triggers.append({
                                  "kind":"missing_record",
                                  "relevant_id":rel_id,
                                  "unsafe_id":bad_id,
                              })
                              continue
                          identity_link=host._identities_share_opening_local_ambiguity_evidence(
                              rel_rec,bad_rec
                          )
                          local_effect=host._candidate_could_affect_opening_local_band(
                              bad_rec,geometry
                          )
                          if identity_link:
                              kind="immutable_identity_link"
                          elif local_effect is None:
                              kind="unsafe_geometry_not_evaluable"
                          elif local_effect is True:
                              kind="unsafe_geometry_in_local_band"
                          else:
                              continue
                          triggers.append({
                              "kind":kind,
                              "relevant_id":rel_id,
                              "unsafe_id":bad_id,
                              "unsafe_boundary_tainted":bad_id in tainted,
                              "unsafe_boundary_unevaluated":bad_id not in evaluated,
                              "unsafe_host_role_relevant":relevant(bad_rec,geometry,raster_mode),
                              "identity_link":identity_link,
                              "local_effect":local_effect,
                              "shared_source_primitives":len(
                                  set(str(v) for v in rel_rec.physical_identity.source_primitive_ids)
                                  & set(str(v) for v in bad_rec.physical_identity.source_primitive_ids)
                              ),
                              "same_candidate_identity":(
                                  bool(rel_rec.physical_identity.candidate_identity_id)
                                  and rel_rec.physical_identity.candidate_identity_id
                                  == bad_rec.physical_identity.candidate_identity_id
                              ),
                              "same_path_fingerprint":(
                                  rel_rec.physical_identity.path_fingerprint is not None
                                  and rel_rec.physical_identity.path_fingerprint
                                  == bad_rec.physical_identity.path_fingerprint
                              ),
                          })
              rows.append({
                  "opening_identity_id":trace.opening_identity_id,
                  "page_id":trace.page_id,
                  "structural_pattern":opening.structural_pattern,
                  "relevant_wall_count":len(relevant_ids),
                  "trigger_count":len(triggers),
                  "trigger_kinds":dict(sorted(Counter(t["kind"] for t in triggers).items())),
                  "triggers":triggers,
              })

          all_triggers=[t for row in rows for t in row["triggers"]]
          print(json.dumps({
              "opening_count":len(composition.opening_bindings),
              "resolved_binding_count":sum(
                  1 for row in composition.opening_bindings if row.record_id
              ),
              "remaining_unsafe_bridge_opening_count":len(rows),
              "trigger_count":len(all_triggers),
              "trigger_kind_counts":dict(sorted(Counter(
                  t["kind"] for t in all_triggers
              ).items())),
              "opening_trigger_kind_counts":dict(sorted(Counter(
                  kind
                  for row in rows
                  for kind in row["trigger_kinds"]
              ).items())),
              "structural_pattern_counts":dict(sorted(Counter(
                  row["structural_pattern"] for row in rows
              ).items())),
              "rows":rows,
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-host-remaining-unsafe-bridges
          path: artifacts/gpt2-host-remaining-unsafe-bridges
          retention-days: 2
