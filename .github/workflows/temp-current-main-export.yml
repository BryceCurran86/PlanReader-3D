name: Temporary Current Main Export

on:
  pull_request:
    paths:
      - '.github/workflows/temp-current-main-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record checked out SHA
        run: git rev-parse HEAD | tee CURRENT_EXPORT_SHA.txt
      - name: Package repository
        run: tar --exclude=.git -czf planreader-current-main-export.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: planreader-current-main-export
          path: |
            planreader-current-main-export.tar.gz
            CURRENT_EXPORT_SHA.txt
          if-no-files-found: error
          retention-days: 1
