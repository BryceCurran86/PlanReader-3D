name: Wall Net Independent Timing
on:
  push:
    branches: [diag/wall-net-independent-timing]
    paths:
      - tools/trace_wall_net_independent_timing.py
      - .github/workflows/wall-net-independent-timing.yml
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: kstvet, mode: source, document_id: kstvet-source, page_id: "54", source_url: "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf", source_path: "benchmarks/sources/1727358888238-bq-nd-drawing.pdf", source_sha256: "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"}
          - {slug: kstvet, mode: wall, document_id: kstvet-wall, page_id: "54", source_url: "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf", source_path: "benchmarks/sources/1727358888238-bq-nd-drawing.pdf", source_sha256: "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"}
          - {slug: kstvet, mode: semantic, document_id: kstvet-semantic, page_id: "54", source_url: "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf", source_path: "benchmarks/sources/1727358888238-bq-nd-drawing.pdf", source_sha256: "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"}
          - {slug: lamu, mode: source, document_id: lamu-source, page_id: "41", source_url: "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf", source_path: "benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf", source_sha256: "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"}
          - {slug: lamu, mode: wall, document_id: lamu-wall, page_id: "41", source_url: "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf", source_path: "benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf", source_sha256: "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"}
          - {slug: lamu, mode: semantic, document_id: lamu-semantic, page_id: "41", source_url: "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf", source_path: "benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf", source_sha256: "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and verify
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_PATH: ${{ matrix.source_path }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          mkdir -p "$(dirname "$SOURCE_PATH")"
          curl --fail --location --retry 4 --retry-delay 3 "$SOURCE_URL" -o "$SOURCE_PATH"
          echo "$SOURCE_SHA256  $SOURCE_PATH" | sha256sum -c -
      - name: Run isolated timing
        env:
          PYTHONPATH: .
          SOURCE_PATH: ${{ matrix.source_path }}
          DOC: ${{ matrix.document_id }}
          PAGE: ${{ matrix.page_id }}
          MODE: ${{ matrix.mode }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p timing
          python tools/trace_wall_net_independent_timing.py "$SOURCE_PATH" --document-id "$DOC" --page-id "$PAGE" --mode "$MODE" | tee "timing/$SLUG-$MODE.jsonl"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.slug }}-${{ matrix.mode }}
          path: timing/${{ matrix.slug }}-${{ matrix.mode }}.jsonl
          if-no-files-found: warn
