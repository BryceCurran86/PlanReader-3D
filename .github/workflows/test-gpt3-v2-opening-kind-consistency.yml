name: GPT3 V2 Signed Opening Physical Kind Consistency
on:
  pull_request:
    branches: [main]
    paths:
      - tools/gpt3_signed_v2_family_trade_integrity.py
      - tests/test_gpt3_v2_opening_physical_kind_consistency.py
      - .github/workflows/test-gpt3-v2-opening-kind-consistency.yml
permissions:
  contents: read
jobs:
  v2-exact-opening-source-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Original signed source family and exact physical V2 mapping negatives
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_v2_opening_physical_kind_consistency.py tests/test_gpt3_signed_v2_family_unit_dimension_veto.py tests/test_gpt3_unique_eligible_trade_veto.py
          ruff check --select F821,F823 tools/gpt3_signed_v2_family_trade_integrity.py tests/test_gpt3_v2_opening_physical_kind_consistency.py
