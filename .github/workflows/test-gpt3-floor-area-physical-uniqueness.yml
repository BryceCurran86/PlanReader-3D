name: GPT3 Geometric Floor Area Source Identity Veto
on:
  pull_request:
    branches: [main]
    paths:
      - pb_source_closed_run_export.py
      - pb_quantity_takeoff_adapter.py
      - tests/test_gpt3_floor_area_physical_double_issue_veto.py
      - .github/workflows/test-gpt3-floor-area-physical-uniqueness.yml
permissions:
  contents: read
jobs:
  unique-original-physical-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Signed original floor identity and commercial adapter negatives
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_floor_area_physical_double_issue_veto.py tests/test_source_closed_run_export.py tests/test_quantity_takeoff_adapter.py
          ruff check --select F821,F823 pb_source_closed_run_export.py pb_quantity_takeoff_adapter.py tests/test_gpt3_floor_area_physical_double_issue_veto.py
