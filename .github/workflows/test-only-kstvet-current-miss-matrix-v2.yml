name: TEST-ONLY KSTVET Current Miss Matrix

on:
  pull_request:
    branches: [main]

jobs:
  kstvet:
    if: startsWith(github.head_ref, 'diag/kstvet-current-miss-matrix-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned KSTVET benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          benchmark_id = "tenders_ke_kstvet_cbc_classroom"
          url = "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected_sha = "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req = urllib.request.Request(url, headers={"User-Agent":"PlanReader-KSTVET-current-matrix/1.0"})
          with urllib.request.urlopen(req, timeout=120) as r:
              payload = r.read()
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit("source hash mismatch: " + actual)
          source = Path("/tmp/kstvet.pdf")
          source.write_bytes(payload)

          engine = BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/kstvet-results",
          )
          report = engine.evaluate_benchmark(
              benchmark_id=benchmark_id,
              pdf_path=source,
              auto_extract=True,
          )
          out = {
              "accepted": int(report.exact_matches + report.within_5_percent),
              "denominator": int(report.total_items_compared),
              "accuracy_percentage": report.overall_accuracy_percentage,
              "strict_exact_percentage": report.strict_exact_accuracy_percentage,
              "exact": int(report.exact_matches),
              "within_5": int(report.within_5_percent),
              "gross": int(report.gross_mismatches),
              "missed": int(report.missed_items),
              "hallucinated": int(report.hallucinated_items),
              "items": {i.item_id:i.to_dict() for i in report.item_results},
          }
          print("KSTVET_CURRENT_MATRIX=" + json.dumps(out, sort_keys=True), flush=True)

          ex = GenericPlanReaderExtractor()
          preds = ex.extract_from_pdf(source)
          wanted = {
              "substructure_surface_bed","perimeter_walling","gable_walling",
              "W1","W2","D1","floor_screed","chalkboard","internal_plaster",
              "internal_paint","external_key_pointing","external_render",
              "verandah_pillars"
          }
          focus = {}
          for p in preds:
              if p.tag in wanted:
                  focus[p.tag] = {
                      "quantity": p.quantity,
                      "unit": p.unit,
                      "source_page": p.source_page,
                      "dimensions": p.dimensions,
                      "confidence": p.confidence,
                      "metadata": p.metadata,
                  }
          print("KSTVET_FOCUS=" + json.dumps({
              "predictions": focus,
              "extraction_status": ex.extraction_status,
              "roof_shadow": getattr(ex, "roof_covering_shadow", None),
          }, sort_keys=True, default=str), flush=True)
          PY
