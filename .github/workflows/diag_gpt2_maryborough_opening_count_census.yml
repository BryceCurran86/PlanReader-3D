name: DIAG GPT2 Maryborough Opening Count Census

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Census authenticated counts and opening universe
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt2_maryborough_opening_count_census.py | tee maryborough-opening-count-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-opening-count-census
          path: maryborough-opening-count-census.json
          retention-days: 2
