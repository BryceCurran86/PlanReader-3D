name: TEST-ONLY Lamu p44 equivalence cache gate

on:
  pull_request:
    branches:
      - perf/cache-wall-equivalence-features-v2

jobs:
  lamu-p44-scale-tick-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download exact Lamu source
        run: |
          curl -L --fail --retry 3 -o /tmp/lamu.pdf "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf"
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  /tmp/lamu.pdf" | sha256sum -c -
      - name: Run exact page 44 scale and wall gate
        run: |
          set -o pipefail
          timeout 1100s env PYTHONPATH=$GITHUB_WORKSPACE python scripts/profile_lamu_p44_scale_tick_gate.py --repo $GITHUB_WORKSPACE --pdf /tmp/lamu.pdf 2>&1 | tee /tmp/lamu-p44-scale-tick-gate.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lamu-p44-scale-tick-gate
          path: /tmp/lamu-p44-scale-tick-gate.log
