name: DIAG GPT2 Original Printed Cross Sheet Callouts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pb_cross_sheet_printed_callout_shadow.py
      - tests/test_cross_sheet_printed_callout_shadow.py
      - tools/diag_gpt2_original_printed_callout_census.py
      - .github/workflows/diag-gpt2-original-printed-callout-census.yml
  workflow_dispatch:

jobs:
  original-sha-title-callout-census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and code head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original-source test toolchain
        run: |
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Fail-closed lexical and source-isolation tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_cross_sheet_printed_callout_shadow.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
      - name: Original Maryborough SHA pinned source
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          OUT=artifacts/gpt2-original-printed-callout-census
          mkdir -p "$OUT"
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -u -m tools.diag_gpt2_original_printed_callout_census --pdf "$PDF" --sha256 "$SHA" --output "$OUT/maryborough.json"
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('artifacts/gpt2-original-printed-callout-census/maryborough.json').read_text())
          assert doc['source_sha256']=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert doc['original_pdf_page_count']==31
          assert len(doc['title_block_sheet_evidence'])==31
          assert doc['diagnostic_only'] and not doc['uses_frozen_v2_reference']
          assert doc['new_physical_correspondences']==0
          assert doc['new_signed_construction_quantities']==0
          assert doc['new_customer_rows']==0
          assert all(not x['physical_target_identity_granted'] and not x['source_owned_dimension_endpoint_granted'] for x in doc['printed_cross_sheet_callout_candidate_ledger'])
          print('GTP2_ORIGINAL_SOURCE_LITERAL_CALLOUT_LEDGER_NO_PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-original-printed-callout-census
          path: artifacts/gpt2-original-printed-callout-census
          retention-days: 30
