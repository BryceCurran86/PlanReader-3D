name: TEST-ONLY KSTVET Gable Candidate Trace

on:
  pull_request:
    branches: [main]

jobs:
  trace:
    if: startsWith(github.head_ref, 'diag/kstvet-gable-candidate-trace')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal runtime
        run: pip install PyMuPDF shapely
      - name: Trace candidate gable source span
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          import fitz
          from pb_source_roof_covering_authority import resolve_document_gable_roof_covering

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          p=Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-gable-candidate-trace/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r: p.write_bytes(r.read())
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected: raise SystemExit(actual)
          doc=fitz.open(p)
          res=resolve_document_gable_roof_covering(
              doc,
              building_length_m=9.85,
              building_width_m=8.35,
              source_sha256=actual,
              target_pages=[53],
          )
          ev=res.gable_evidence
          print("KSTVET_GABLE_CANDIDATE_TRACE="+json.dumps({
              "status":res.status.value,
              "reason_codes":list(res.reason_codes),
              "cross_ridge_span_m":res.cross_ridge_span_m,
              "ridge_length_m":res.ridge_length_m,
              "metadata":dict(res.metadata),
              "evidence":None if ev is None else {
                  "pitch_deg":ev.pitch_deg,
                  "left_run_pt":ev.left_run_pt,
                  "right_run_pt":ev.right_run_pt,
                  "left_support_xy":ev.left_support_xy,
                  "right_support_xy":ev.right_support_xy,
                  "scale":ev.source_scale_denominator,
                  "reason_codes":ev.reason_codes,
                  "viewport":ev.source_viewport_id,
              },
          },sort_keys=True),flush=True)
          doc.close()
          PY
