name: GPT MAX Native Opening Source Roles
on:
  pull_request:
    branches: [main]
    paths:
      - pb_physical_opening_authority.py
      - pb_source_visibility_authority.py
      - pb_native_dimension_cap_evidence.py
      - tests/test_native_dimension_cap_evidence.py
      - tests/test_native_unstroked_fill_evidence.py
      - tests/test_native_opening_source_role_diagnostic.py
      - tools/diag_native_opening_source_roles.py
      - .github/workflows/test-gptmax-native-opening-source-roles.yml
concurrency:
  group: gptmax-native-opening-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-proof:
    runs-on: ubuntu-latest
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source role, integrity, identity and closure regressions
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_native_dimension_cap_evidence.py
          tests/test_native_unstroked_fill_evidence.py
          tests/test_native_opening_source_role_diagnostic.py
          tests/test_g17_visible_opening_existence_v1.py
          tests/test_physical_opening_identity_stability.py
          tests/test_semantic_opening_enumeration_authority_v1.py
          tests/test_source_opening_universe_evidence_v1.py
      - name: Retained real Lot16 source-role proof
        run: >-
          PYTHONPATH=. python -u tools/diag_native_opening_source_roles.py
          --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          --page-id 3 --output lot16-native-opening-source-roles.json
      - name: Verify provenance, opposition and incomplete closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('lot16-native-opening-source-roles.json').read_text())
          assert report['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert report['retained_opposed_candidates']
          assert any(not row['candidate_universe_complete'] for row in report['native_candidate_closures'])
          for row in report['retained_opposed_candidates']:
              assert row['status'] == 'abstained'
              assert row['candidate']['source_sha256'] == report['source_sha256']
              assert row['candidate']['source_observation_ids']
              assert row['opposing_evidence_atoms']
              assert all(atom['status'] == 'candidate' and atom['normalized_value'] is None and atom['unit'] is None for atom in row['opposing_evidence_atoms'])
          ids = [row['record_id'] for row in report['positive_existence_records']]
          assert len(ids) == len(set(ids))
          assert 'quantities' not in report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-native-opening-source-roles
          path: lot16-native-opening-source-roles.json
          retention-days: 14
