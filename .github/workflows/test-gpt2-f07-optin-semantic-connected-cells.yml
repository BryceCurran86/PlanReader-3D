name: TEST GPT2 F07 Opt-in Original Semantic Cell Ownership

on:
  pull_request:
    branches: [main]
    paths:
      - pb_viewport_segmentation.py
      - tests/test_gpt2_f07_optin_source_connected_semantic_cells.py
      - .github/workflows/test-gpt2-f07-optin-semantic-connected-cells.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gpt2-f07-optin-semantic-connected-cells-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused-public:
    name: Source-neutral viewport regressions (original NOT RUN)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Public source-neutral tests and explicit private-source omissions
        run: python -m pytest -q -rs tests/test_gpt2_f07_optin_source_connected_semantic_cells.py tests/test_gpt2_external_schedule_frame_provenance.py
      - name: Report original-source verification NOT RUN
        if: always()
        run: |
          echo '::notice::Original PDF tests NOT RUN in public PR/push CI. Use the owner-only merged-main manual source job or the protected private replay.'
          echo 'Original source: NOT RUN. Public tests do not grant source, customer, or score authority.' >> "$GITHUB_STEP_SUMMARY"

  original-false-schedule-and-existing-viewports:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' && github.triggering_actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install source test prerequisites
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Provision the SHA-pinned original
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: Arch_Combined_Maryborough_Service_Station.pdf
      - name: Verify exact merged source head and original bytes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
      - name: Actual original positive and negative source tests
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          TEST_LOG=$(mktemp)
          trap 'rm -f "$TEST_LOG"' EXIT
          if ! python -m pytest -q tests/test_gpt2_f07_optin_source_connected_semantic_cells.py tests/test_gpt2_external_schedule_frame_provenance.py > "$TEST_LOG" 2>&1; then
            echo '::error::Original regression failed; source details withheld.'
            exit 1
          fi
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
          echo 'ORIGINAL_SHA_PINNED_VIEWPORT_REGRESSION=PASS'
      - name: Destroy private originals
        if: always()
        run: rm -rf documents/sources artifacts
