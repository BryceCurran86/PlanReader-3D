name: Item19B Positive Equivalence Subgroups Review

on:
  push:
    branches: [gpt/item19b-positive-equivalence-subgroups-v1]

concurrency:
  group: item19b-positive-equivalence-subgroups-review
  cancel-in-progress: true

jobs:
  wall-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run targeted wall tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_physical_wall_candidate_face_pair_equivalence_v1.py \
            tests/test_wall_room_topology_stage_a.py \
            tests/test_physical_wall_candidate_viewport_scope_v1.py
      - name: Download pinned KSTVET source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Run page 54 wall-authority shadow
        run: |
          PYTHONPATH=. python scripts/item19b_kstvet_wall_authority_fast_shadow.py /tmp/kstvet.pdf
