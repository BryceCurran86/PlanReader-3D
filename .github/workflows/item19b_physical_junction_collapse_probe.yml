name: Item19B Physical Junction Collapse Probe

on:
  push:
    branches: [gpt/item19b-component-local-topology-v1]

jobs:
  physical-junctions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Probe physical-group junction incidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from collections import defaultdict

          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateProducer
          from pb_source_wall_topology_authority import _topology_physical_records

          TARGET_SOURCE_PRIMITIVES={
            "d4763i0",
            "d4772i0",
            "d5179i1",
            "d5179i3",
            "d5214i0",
            "d5215i0",
          }

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(
              producer_method="item19b-physical-junction-probe",
              producer_version="1.0",
          )
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-item19b-physical-junction",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          auth=PhysicalWallCandidateProducer.from_authenticated_viewports(
              source,page_ids=("54",)
          ).authority()

          for scope in auth._scopes.values():
              if scope.viewport_id != "view_p54_4":
                  continue
              physical,rejected=_topology_physical_records(scope)
              raw_to_physical={}
              by_phys={}
              for rec in physical:
                  member_ids=tuple(getattr(rec,"_topology_member_ids",(rec.wall_candidate_id,)))
                  by_phys[rec.wall_candidate_id]=rec
                  for mid in member_ids:
                      raw_to_physical[mid]=rec.wall_candidate_id

              target_phys=None
              target_member_primitives={}
              for pid,rec in by_phys.items():
                  primitives=set()
                  member_rows=[]
                  for member in tuple(getattr(rec,"_topology_member_records",(rec,))):
                      ids=set(tuple(getattr(member.physical_identity,"source_primitive_ids",()) or ()))
                      primitives.update(ids)
                      member_rows.append({
                          "wall":member.wall_candidate_id,
                          "source_primitives":sorted(ids),
                      })
                  overlap=sorted(primitives & TARGET_SOURCE_PRIMITIVES)
                  if overlap:
                      target_phys=pid
                      target_member_primitives={
                          "physical":pid,
                          "matched_source_primitives":overlap,
                          "members":member_rows,
                      }
                      break
              if target_phys is None:
                  print("ITEM19B_PHYSICAL_JUNCTIONS "+json.dumps({
                      "error":"target_physical_wall_not_found_by_source_primitives",
                      "target_source_primitives":sorted(TARGET_SOURCE_PRIMITIVES),
                      "physical_count":len(by_phys),
                  },sort_keys=True))
                  raise SystemExit(2)

              node_rows=defaultdict(list)
              for pid,rec in by_phys.items():
                  members=tuple(getattr(rec,"_topology_member_records",(rec,)))
                  for member in members:
                      wall=member.wall_candidate
                      pts=tuple(wall.centerline_pts or ())
                      nodes=tuple(wall.end_node_ids or ())
                      jtypes=tuple(wall.junction_types or ())
                      if len(pts)<2 or len(nodes)!=2:
                          continue
                      endpoint_specs=[
                          (nodes[0],jtypes[0] if len(jtypes)==2 else None,pts[0],pts[1]),
                          (nodes[1],jtypes[1] if len(jtypes)==2 else None,pts[-1],pts[-2]),
                      ]
                      for node,jtype,p0,p1 in endpoint_specs:
                          dx=float(p1[0])-float(p0[0]); dy=float(p1[1])-float(p0[1])
                          angle=(math.degrees(math.atan2(dy,dx))%180.0)
                          node_rows[str(node)].append({
                              "physical":pid,
                              "raw":member.wall_candidate_id,
                              "jtype":getattr(jtype,"value",str(jtype)),
                              "angle":round(angle,3),
                              "p0":[round(float(p0[0]),3),round(float(p0[1]),3)],
                              "p1":[round(float(p1[0]),3),round(float(p1[1]),3)],
                          })

              target_nodes=set()
              trec=by_phys[target_phys]
              for member in getattr(trec,"_topology_member_records",(trec,)):
                  target_nodes.update(str(x) for x in tuple(member.wall_candidate.end_node_ids or ()))

              out=[]
              for node in sorted(target_nodes):
                  rows=node_rows[node]
                  phys=sorted({r["physical"] for r in rows})
                  angles_by_phys={
                      p:sorted({r["angle"] for r in rows if r["physical"]==p})
                      for p in phys
                  }
                  out.append({
                      "node":node,
                      "target_physical":target_phys,
                      "physical_owners":phys,
                      "angles_by_physical":angles_by_phys,
                      "raw_incidence":rows,
                  })
              print("ITEM19B_TARGET_PHYSICAL "+json.dumps(target_member_primitives,sort_keys=True))
              print("ITEM19B_PHYSICAL_JUNCTIONS "+json.dumps(out,sort_keys=True))
          PY
