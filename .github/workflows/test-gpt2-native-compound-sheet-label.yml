name: TEST GPT2 Native Compound Title Field

on:
  pull_request:
    paths:
      - pb_page_title_authority.py
      - tests/test_gpt2_native_compound_sheet_labels.py
      - .github/workflows/test-gpt2-native-compound-sheet-label.yml
  push:
    branches: [main]
    paths:
      - "pb_*.py"
      - "pb_page_title_authority.py"
      - "tests/test_gpt2_native_compound_sheet_labels.py"
      - ".github/workflows/test-gpt2-native-compound-sheet-label.yml"
  workflow_dispatch:

jobs:
  original-cad-title-label:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head guard
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install actual source toolchain
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original SHA and native drawing-title field authority
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_native_compound_sheet_labels.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
