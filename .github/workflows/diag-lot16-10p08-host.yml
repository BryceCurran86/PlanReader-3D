name: DIAG Lot16 10.08 Host

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Inspect host failure
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/diag_lot16_10p08_host.py | tee lot16-10p08-host.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-10p08-host
          path: lot16-10p08-host.json
          retention-days: 1
