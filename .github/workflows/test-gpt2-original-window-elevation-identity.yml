name: TEST GPT2 Original A601 Window Elevation Title Groups

on:
  pull_request:
    paths:
      - tools/diag_original_window_elevation_title_lineage_shadow.py
      - tests/test_gpt2_original_window_elevation_title_lineage.py
      - .github/workflows/test-gpt2-original-window-elevation-identity.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  original-window-elevation-source-ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact original source head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original six window codes four elevation titles and count negatives
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_window_elevation_title_lineage.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
