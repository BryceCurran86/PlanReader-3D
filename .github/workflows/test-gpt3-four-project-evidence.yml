name: TEST GPT3 Four-Project Signed Evidence Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/report_gpt3_four_project_evidence.py"
      - "tools/gpt3_signed_v2_family_trade_integrity.py"
      - "tools/run_gpt3_original_byte_gated_exact_project.py"
      - "tests/test_gpt3_four_project_evidence.py"
      - "tests/test_gpt3_four_project_customer_id_parity.py"
      - "tests/test_gpt3_original_byte_gated_exact_project.py"
      - ".github/workflows/test-gpt3-four-project-evidence.yml"
  workflow_dispatch:

concurrency:
  group: gpt3-four-project-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Test source/quantity/customer/frozen-score gates
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_four_project_evidence.py tests/test_gpt3_original_byte_gated_exact_project.py tests/test_gpt3_four_project_customer_id_parity.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Prove unavailable private sources do not become zero accuracy
        run: |
          set -euo pipefail
          mkdir -p /tmp/gpt3-empty-source /tmp/gpt3-empty-seal /tmp/gpt3-empty-map /tmp/gpt3-empty-customer
          set +e
          PYTHONPATH=. python -m tools.report_gpt3_four_project_evidence \
            --source-dir /tmp/gpt3-empty-source \
            --sealed-dir /tmp/gpt3-empty-seal \
            --identity-map-dir /tmp/gpt3-empty-map \
            --customer-dir /tmp/gpt3-empty-customer \
            --output /tmp/gpt3-evidence-ledger.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          p=json.load(open("/tmp/gpt3-evidence-ledger.json", encoding="utf-8"))
          assert p["publication_status"]=="UNPUBLISHED"
          assert p["frozen_denominator"]==120
          assert p["coverage_accuracy"] is None
          assert len(p["projects"])==4
          assert all(x["publication_status"]=="UNAVAILABLE" for x in p["projects"])
          PY

      # Original customer PDFs were intentionally removed from the PUBLIC tip
      # by #2920. Their SHA-pinned checks remain owner-machine-only; GitHub
      # must prove that absence does not mint quantity or score authority.
      - name: Prove private original PDFs are not required on public runner
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m tools.report_gpt3_four_project_evidence \\
            --source-dir documents/sources \\
            --sealed-dir /tmp/gpt3-empty-seal \\
            --identity-map-dir /tmp/gpt3-empty-map \\
            --customer-dir /tmp/gpt3-empty-customer \\
            --output /tmp/gpt3-real-source-package-ledger.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/gpt3-real-source-package-ledger.json").read_text(encoding="utf-8"))
          assert p["frozen_denominator"] == 120
          assert p["publication_status"] == "UNPUBLISHED"
          assert p["coverage_accuracy"] is None
          assert p["precision_adjusted_accuracy"] is None
          assert p["official_suite_result"] is None
          assert len(p["projects"]) == 4
          for project in p["projects"]:
              assert project["source_sha_verified"] is False, project
              assert project["publication_status"] == "UNAVAILABLE", project
              assert "original_source_not_supplied_in_this_execution" in project["reason_codes"], project
              assert project["exact_project_report"] is None
          PY
