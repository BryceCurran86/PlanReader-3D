name: TEST-ONLY KSTVET After Stacked Schedule 850

on:
  push:
    branches: [diag/kstvet-after-stacked-schedule-850]
  pull_request:
    branches: [main]

jobs:
  kstvet:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/diag/kstvet-after-stacked-schedule-850') || startsWith(github.head_ref, 'diag/kstvet-after-stacked-schedule-850')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download SHA-pinned KSTVET source
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          out=pathlib.Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-850/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              out.write_bytes(r.read())
          got=hashlib.sha256(out.read_bytes()).hexdigest()
          print("SOURCE_SHA256="+got)
          if got != expected:
              raise SystemExit(f"source hash mismatch: {got}")
          PY

      - name: Build exact candidate image
        run: docker build -t planreader-kstvet-850 .

      - name: Run KSTVET benchmark once
        run: |
          set -euo pipefail
          mkdir -p /tmp/kstvet-results
          docker run --rm --cpus=2.0 \
            -v /tmp/kstvet.pdf:/app/kstvet.pdf:ro \
            -v /tmp/kstvet-results:/tmp/results \
            planreader-kstvet-850 \
            python pb_benchmark_accuracy_engine.py \
              --benchmark tenders_ke_kstvet_cbc_classroom \
              --pdf /app/kstvet.pdf \
              --output-dir /tmp/results \
            | tee /tmp/kstvet-benchmark.txt

      - name: Print benchmark item-level result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/kstvet-results/tenders_ke_kstvet_cbc_classroom_accuracy_report.json")
          data=json.loads(p.read_text())
          s=data["summary"]
          focus=[
              item for item in data["item_results"]
              if item.get("item_id") in {"BOQ-C41-B","BOQ-C41-C"}
              or item.get("status") != "exact_match"
          ]
          print("KSTVET_AFTER_STACKED_SCHEDULE_850="+json.dumps({
              "accepted": s["exact_matches"] + s["within_5_percent"],
              "denominator": s["total_items_compared"],
              "accuracy_percentage": s["overall_accuracy_percentage"],
              "strict_exact_percentage": s["strict_exact_accuracy_percentage"],
              "hallucinated": s["hallucinated_items"],
              "gross_mismatches": s["gross_mismatches"],
              "items": focus,
          },sort_keys=True))
          PY

      - name: Print page54 opening schedule rows
        run: |
          cat >/tmp/kstvet_schedule_probe.py <<'PY'
          import json, fitz
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor
          doc=fitz.open("/app/kstvet.pdf")
          try:
              rows=[
                  row.to_dict()
                  for row in GenericScheduleTableExtractor().extract_from_page(doc[53],54)
                  if row.trade_type in {"windows","doors"}
              ]
          finally:
              doc.close()
          print("KSTVET_PAGE54_OPENING_SCHEDULE_ROWS="+json.dumps(rows,sort_keys=True))
          PY
          docker run --rm --cpus=2.0 \
            -v /tmp/kstvet.pdf:/app/kstvet.pdf:ro \
            -v /tmp/kstvet_schedule_probe.py:/tmp/kstvet_schedule_probe.py:ro \
            planreader-kstvet-850 \
            python /tmp/kstvet_schedule_probe.py
