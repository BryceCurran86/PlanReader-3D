name: TEST GPT2 Original Embedded Symbol Glyph Source Proof

on:
  pull_request:
    paths:
      - pb_pdf_text_integrity_authority.py
      - tests/test_gpt2_symbol_source_optin_native_word_integrity.py
      - .github/workflows/test-gpt2-source-symbol-embedded-glyph.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-glyph-true-source:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact original branch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original source glyph test dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt fonttools==4.60.2
      - name: Provision exact private original from trusted main
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: Arch_Combined_Maryborough_Service_Station.pdf
          allow-missing: "false"
      - name: Assert no skipped positive embedded glyph source proof
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          private_script="$RUNNER_TEMP/guarded-original-4.sh"
          private_output="$RUNNER_TEMP/guarded-original-4.log"
          cat > "$private_script" <<'PRIVATE_ORIGINAL_COMMANDS'
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q -rs tests/test_gpt2_symbol_source_optin_native_word_integrity.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
          PRIVATE_ORIGINAL_COMMANDS
          if bash -euo pipefail "$private_script" > "$private_output" 2>&1; then
            echo "PRIVATE ORIGINAL STEP PASS"
          else
            echo "::error::Private original verification failed; source details withheld."
            exit 1
          fi
      - name: Destroy private originals and unpublished diagnostics
        if: always()
        run: |
          rm -rf documents/sources artifacts q5446-original-positive-floor laurel-original-floor-produced laurel-source-positive-core
          rm -f source-before.json source-after.json source-retention.json native-paint-partitions.json
          rm -f "$RUNNER_TEMP"/guarded-original-*.sh "$RUNNER_TEMP"/guarded-original-*.log
  original-source-not-verified:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/original-source-not-run.yml
    with:
      job: original-glyph-true-source
