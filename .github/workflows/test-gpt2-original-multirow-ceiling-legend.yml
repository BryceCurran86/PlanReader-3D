name: TEST GPT2 Original Native Multirow Material Source Legend

on:
  pull_request:
    paths:
      - pb_source_material_semantic_authority.py
      - tests/test_gpt2_original_native_multirow_material_legend.py
      - .github/workflows/test-gpt2-original-multirow-ceiling-legend.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  authentic-original-ceiling-material-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original material source tests
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Original GRID row, CLD3 signage and default material issuer parity
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_original_native_multirow_material_legend.py
          python -m pytest -q tests/test_signed_output_gate_path_coverage.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
