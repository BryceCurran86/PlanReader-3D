name: DIAG Lot16 Host Chain After Whole-Wall Frame

on:
  pull_request:
    branches:
      - gpt4/raster-whole-wall-frame-current-main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused host/frame regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_raster_opening_whole_wall_host.py tests/test_raster_opening_whole_wall_frame.py
      - name: Run Lot16 host-chain differential
        run: |
          PYTHONPATH=. python tools/diag_lot16_raster_host_chain.py | tee lot16-host-chain-after-whole-wall-frame.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-host-chain-after-whole-wall-frame
          path: lot16-host-chain-after-whole-wall-frame.json
          retention-days: 1
