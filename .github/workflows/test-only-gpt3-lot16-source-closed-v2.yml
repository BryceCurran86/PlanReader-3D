name: TEST ONLY GPT3 Lot16 Source-Closed V2

on:
  pull_request:
    branches:
      - gpt3/handoff-source-page-scope

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run Lot16 source-closed production handoff
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/lot16
          PYTHONPATH=. python tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --project-id "au_qld_lot16_power" \
            --workspace-id 1 \
            --output-dir artifacts/lot16 \
            > artifacts/lot16/run.log 2>&1
          code=$?
          echo "$code" > artifacts/lot16/exit_code.txt
          cat artifacts/lot16/run.log
          echo "handoff_exit_code=$code"
      - name: Upload Lot16 handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-source-closed-v2
          path: artifacts/lot16
          if-no-files-found: warn
          retention-days: 1
