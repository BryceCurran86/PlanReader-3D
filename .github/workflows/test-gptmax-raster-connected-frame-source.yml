name: GPT MAX Raster Connected Frame Source
on:
  pull_request:
    paths:
      - pb_opening_host_frame_authority.py
      - pb_physical_wall_candidate_authority.py
      - pb_source_visibility_authority.py
      - pb_raster_source_wall_frame_projection.py
      - tests/test_raster_connected_host_frame.py
      - tests/test_raster_source_wall_frame_projection.py
      - tests/test_raster_visibility_receipt_registration.py
      - tools/diag_opening_wall_face_preservation.py
      - tools/gptmax_compare_source_face_retention.py
      - tests/test_gptmax_compare_source_face_retention.py
      - .github/workflows/test-gptmax-raster-connected-frame-source.yml
concurrency:
  group: gptmax-raster-connected-frame-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Integrity and provider isolation
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          python -m compileall -q .
          ruff check --select F821,F823 .
      - name: Full regression suite
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Smoke test
        run: python tests/ci_smoke.py
  source-proof:
    runs-on: ubuntu-latest
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Real Lot16 source, wall and host handoff
        run: >-
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py
          --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          --page-id 3 --output lot16-connected-frame-source-handoff.json
      - name: Original Lot16 verified production prerequisite
        run: |
          # Compare against the exact current PR base; archive past source regressions separately.
          git worktree add /tmp/gptmax-original-lot16-prerequisite ${{ github.event.pull_request.base.sha }}
          # Execute the diagnostic from the checked-out base, not from the PR head.
          (cd /tmp/gptmax-original-lot16-prerequisite && PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf "documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf" \
            --page-id 3 --output "$GITHUB_WORKSPACE/lot16-connected-frame-prerequisite.json")
      - name: Verify exact source ownership and safety cap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('lot16-connected-frame-source-handoff.json').read_text())
          assert report['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert report['primitive_safety_cap'] == 20_000
          assert report['opening_bindings']
          assert any('raster_source_band_host_resolved' in row['reason_codes'] for row in report['opening_bindings'])
          assert report['source_owned_wall_scope_results']
          assert all(row['source_sha256'] == report['source_sha256'] for row in report['source_owned_wall_scope_results'])
          ids = [row['opening_identity_id'] for row in report['opening_bindings']]
          assert len(ids) == len(set(ids))
          assert 'quantities' not in report
          PY
      - name: Authenticate exactly one opposed original native source hypothesis
        run: |
          PYTHONPATH=. python -u tools/diag_native_opening_source_roles.py \
            --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' \
            --page-id 3 --output lot16-neutral-fill-original-roles.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('lot16-connected-frame-prerequisite.json').read_text())
          after=json.loads(Path('lot16-connected-frame-source-handoff.json').read_text())
          roles=json.loads(Path('lot16-neutral-fill-original-roles.json').read_text())
          sha='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert base['source_sha256']==after['source_sha256']==roles['source_sha256']==sha
          assert base['primitive_safety_cap']==after['primitive_safety_cap']==20000
          assert base['summary']=={'physical_existence_claims':22,'host_bindings':14,'host_frames':9}
          assert after['summary']=={'physical_existence_claims':21,'host_bindings':14,'host_frames':9}
          def by_id(rows):
              ids=[r['opening_identity_id'] for r in rows]
              assert len(ids)==len(set(ids))
              return dict(zip(ids,rows))
          old,new=by_id(base['opening_bindings']),by_id(after['opening_bindings'])
          missing=set(old)-set(new)
          table='physical_opening_existence_b222d5310a7df1d632d5daab1a676645'
          assert missing=={table} and set(new)<=set(old)
          assert all(new[key]==rec for key,rec in old.items() if key in new)
          assert old[table]['record_id'] is None and old[table]['host_wall_id'] is None
          original_frames, current_frames=by_id(base['host_frames']),by_id(after['host_frames'])
          assert original_frames[table]['record_id'] is None
          assert set(current_frames)==set(new)
          assert all(current_frames[key]==record for key,record in original_frames.items()
                     if record['record_id'] is not None)
          matching=[row for row in roles['retained_opposed_candidates']
                    if row['status']=='abstained'
                    and old[table]['representative_observation_id'] in row['candidate']['source_observation_ids']]
          assert len(matching)==1
          assert any(
              atom['kind']=='annotation_border'
              and atom['reason_codes']==['native_unstroked_pale_neutral_fill_boundary']
              and atom['metadata']['polarity']=='opposing'
              and atom['metadata']['paint_type']=='f'
              and atom['metadata']['stroke'] is None
              and atom['metadata']['fill_opacity']==1.0
              and atom['metadata']['all_source_primitives_covered'] is True
              and set(atom['metadata']['source_observation_ids'])==set(matching[0]['candidate']['source_observation_ids'])
              for atom in matching[0]['opposing_evidence_atoms'])
          # Keep original report immutable; a comparison-only copy removes
          # exactly the proven annotation from the prior positive universe.
          source_copy=dict(base)
          source_copy['opening_bindings']=[row for row in base['opening_bindings']
                                         if row['opening_identity_id']!=table]
          source_copy['host_frames']=[row for row in base['host_frames']
                                      if row['opening_identity_id']!=table]
          source_copy['summary']=dict(base['summary'],physical_existence_claims=21)
          Path('lot16-opposed-baseline-for-comparison.json').write_text(
              json.dumps(source_copy,indent=2,sort_keys=True)+'\n')
          assert not roles.get('opening_count_publication_allowed',False)
          assert not roles.get('metric_quantity_publication_allowed',False)
          print({'source_opposed_id':table,'strict_old_host_count':14,'strict_old_frame_count':9})
          PY
      - name: Reject lost or silently changed exact physical host/frame identities
        run: |
          PYTHONPATH=. python tools/gptmax_compare_source_face_retention.py \
            --baseline lot16-opposed-baseline-for-comparison.json \
            --candidate lot16-connected-frame-source-handoff.json \
            --output lot16-connected-frame-identity-retention.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-connected-frame-source-handoff
          path: |
            lot16-connected-frame-source-handoff.json
            lot16-connected-frame-prerequisite.json
            lot16-connected-frame-identity-retention.json
            lot16-opposed-baseline-for-comparison.json
            lot16-neutral-fill-original-roles.json
          retention-days: 14
  maryborough-source-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same exact PR base as the candidate's current source code.
          # Historical 180/3 versus current 183/1 is documented separately.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Produce prerequisite Maryborough source report
        run: |
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf \
            --page-id 7 --page-id 30 --page-id 31 \
            --output maryborough-source-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('maryborough-source-baseline.json').read_text())
          assert report['source_sha256'] == 'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert report['primitive_safety_cap'] == 20_000
          assert report['opening_bindings']
          assert report['source_owned_wall_scope_results']
          assert 'quantities' not in report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maryborough-source-baseline
          path: maryborough-source-baseline.json
          retention-days: 14
  maryborough-source-current:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Produce current Maryborough source report
        run: |
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py \
            --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf \
            --page-id 7 --page-id 30 --page-id 31 \
            --output maryborough-connected-frame-source-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('maryborough-connected-frame-source-handoff.json').read_text())
          assert report['source_sha256'] == 'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert report['primitive_safety_cap'] == 20_000
          assert report['opening_bindings']
          assert report['source_owned_wall_scope_results']
          assert 'quantities' not in report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maryborough-source-current
          path: maryborough-connected-frame-source-handoff.json
          retention-days: 14
  maryborough-source-parity:
    runs-on: ubuntu-latest
    needs: [maryborough-source-baseline, maryborough-source-current]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: maryborough-source-baseline
          path: artifacts/maryborough-source-baseline
      - uses: actions/download-artifact@v4
        with:
          name: maryborough-source-current
          path: artifacts/maryborough-source-current
      - name: Compare exact opening hosts and preserved frames
        run: |
          PYTHONPATH=. python tools/gptmax_compare_source_face_retention.py \
            --baseline artifacts/maryborough-source-baseline/maryborough-source-baseline.json \
            --candidate artifacts/maryborough-source-current/maryborough-connected-frame-source-handoff.json \
            --output maryborough-source-retention.json
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("artifacts/maryborough-source-baseline/maryborough-source-baseline.json").read_text())
          current = json.loads(Path("artifacts/maryborough-source-current/maryborough-connected-frame-source-handoff.json").read_text())
          assert current["source_sha256"] == base["source_sha256"] == "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          assert current["primitive_safety_cap"] == base["primitive_safety_cap"] == 20_000
          assert "quantities" not in current
          print(json.dumps({"base":base["summary"],"candidate":current["summary"],
                            "source_ownership_retained":True},sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maryborough-source-identity-retention
          path: maryborough-source-retention.json
          if-no-files-found: ignore
