name: GPT MAX real original one-end G17 source footprint
on:
  pull_request:
    branches: [main, gptmax/strict-original-signed-retention-witness-20261017, gptmax/physical-g17-short-source-cell-extent-20261017]
    paths:
      - pb_raster_unchanged_band_segments.py
      - pb_source_visibility_authority.py
      - tests/test_gptmax_lot16_original_one_end_source.py tests/test_gptmax_lot16_original_2127_external_wall_ink.py
      - tests/test_gptmax_lot16_original_2127_external_wall_ink.py
      - .github/workflows/test-gptmax-lot16-original-one-end-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sha-pinned-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt pytest
      - run: |
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf' | sha256sum -c
          PYTHONPATH=. python -m pytest -q tests/test_gptmax_lot16_original_one_end_source.py
