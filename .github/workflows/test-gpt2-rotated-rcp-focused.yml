name: TEST GPT2 Rotated RCP Focused
on:
  pull_request:
    paths:
      - pb_viewport_segmentation.py
      - tests/benchmarks/test_mutation_viewport_segmentation.py
      - .github/workflows/test-gpt2-rotated-rcp-focused.yml
  workflow_dispatch:
jobs:
  rotated-rcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify rotated RCP source-frame boundaries
        run: PYTHONPATH=. python -m pytest -q tests/benchmarks/test_mutation_viewport_segmentation.py -k "rotated_rcps or vertical_native_title_length or native_bbox" -x
