name: Item19B #941 Fast Page Map

on:
  push:
    branches: [diag/item19b-941-fast-page-map]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download pinned KSTVET
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: Map exact Item19B source primitives into page wall scope
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_physical_wall_candidate_authority import PhysicalWallCandidateProducer, PhysicalWallCandidateSelector
          from pb_wall_scope_identity_bridge_authority import _resolve_exact_target_group

          TARGET=("d4763i0","d4772i0","d5179i1","d5179i3","d5214i0","d5215i0")

          payload=Path("/tmp/kstvet.pdf").read_bytes()
          source=SourceVisibilityProducer(producer_method="diag-941-fast-page-map",producer_version="1")
          pub=source.ingest_native_pdf_bytes(
              document_id="kstvet-diag-941-fast-map",
              source_bytes=payload,
              source_locator="sha256://6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc",
              page_ids=("54",),
          )
          page=PhysicalWallCandidateProducer.from_source_visibility_producer(source,page_ids=("54",)).authority()
          sel=PhysicalWallCandidateSelector(
              document_id=pub.revision.document_id,
              revision_id=pub.revision.revision_id,
              source_sha256=pub.revision.source_sha256,
              snapshot_id=pub.snapshot.snapshot_id,
              page_id="54",
              decision_scope_id="wall-source:page-54",
          )
          scope=page.resolve_scope(sel)
          resolution=_resolve_exact_target_group(page_scope=scope,source_primitive_ids=TARGET)
          print("FAST_941_PAGE_MAP "+json.dumps({
              "scope_status":scope.status.value,
              "scope_complete":scope.scope_complete,
              "scope_reasons":list(scope.reason_codes),
              "record_count":len(scope.records),
              "equivalence_groups":len(scope.equivalence.equivalence_groups) if scope.equivalence else 0,
              "resolution":(
                  [list(resolution[0]),list(resolution[1]),list(resolution[2])]
                  if resolution is not None else None
              ),
          },sort_keys=True))
          PY
