name: DIAG GPTMAX Lot16 Current 870 Ownership

on:
  pull_request:
    branches:
      - gptmax/exact-two-face-lineage-host-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Trace current 870 ownership
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gptmax_lot16_870_ownership_current.py | tee lot16-870-ownership-current.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-870-ownership-current
          path: lot16-870-ownership-current.json
          retention-days: 2
