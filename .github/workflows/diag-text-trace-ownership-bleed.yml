name: DIAG Text Trace Ownership Bleed

on:
  pull_request:
    branches:
      - gptmax/text-trace-ownership-bleed-v1

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run text ownership and opening ambiguity contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_pdf_text_integrity_source_state_v1.py \
            tests/test_opening_label_dimension_authority.py::test_two_distinct_eligible_callouts_conflict_instead_of_picking_closest
