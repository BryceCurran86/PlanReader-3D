name: TEST-ONLY Claude Murera canonical-environment measurement

# Measurement only. Runs the unmodified benchmark engine for Murera in the
# canonical Linux environment (requirements.txt + Tesseract, no RapidOCR) on
# the production commit this workflow commit sits on top of. Never merged.
on:
  push:
    branches: ['diag/claude-murera-measure-**']

jobs:
  murera-items:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install canonical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned Murera benchmark and print item results
        run: |
          set -euo pipefail
          PRODUCTION_SHA="$(git rev-parse HEAD^)" PYTHONPATH=. python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from pb_public_tender_benchmark import PublicTenderBenchmark
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_portable_raster_ocr_authority import detect_ocr_capabilities

          benchmark_id = "tenders_ke_murera_science_lab"
          bench = PublicTenderBenchmark.load(benchmark_id, base_dir="benchmarks/public_tenders")
          drawing = next(d for d in bench.download_manifest["documents"] if d.get("role") == "architectural_drawings")
          url = bench.download_manifest["source_url"]
          expected = str(drawing["sha256"]).lower()
          path = Path("/tmp/murera.pdf")
          req = urllib.request.Request(url, headers={"User-Agent": "PlanReader-Murera-measure/1.0"})
          with urllib.request.urlopen(req, timeout=120) as r:
              path.write_bytes(r.read())
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual}")

          report = BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/murera-items-result",
          ).evaluate_benchmark(benchmark_id=benchmark_id, pdf_path=path, auto_extract=True)
          caps = detect_ocr_capabilities()
          payload = {
              "production_sha": os.environ["PRODUCTION_SHA"],
              "source_sha256": actual,
              "ocr_backends": list(caps.available_backends),
              "accepted": int(report.exact_matches + report.within_5_percent),
              "denominator": int(report.total_items_compared),
              "accuracy_percentage": report.overall_accuracy_percentage,
              "items": [
                  {k: item.to_dict()[k] for k in ("item_id", "expected_quantity", "extracted_quantity", "status", "pct_error")}
                  for item in report.item_results
              ],
          }
          print("MURERA_MEASURE=" + json.dumps(payload, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"production_sha `{payload['production_sha']}` ocr={payload['ocr_backends']} accepted **{payload['accepted']}/{payload['denominator']}**\n\n")
              fh.write("| item | expected | extracted | status |\n|---|---|---|---|\n")
              for it in payload["items"]:
                  fh.write(f"| {it['item_id']} | {it['expected_quantity']} | {it['extracted_quantity']} | {it['status']} |\n")
          PY
