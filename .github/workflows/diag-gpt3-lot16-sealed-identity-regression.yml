name: DIAG GPT3 Lot16 Sealed Identity Regression

on:
  pull_request:
    branches:
      - main

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download prior authoritative 8-quantity artifact
        uses: actions/download-artifact@v4
        with:
          name: gpt3-lot16-map-only-v5
          path: artifacts/old-authoritative
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37464408630
      - name: Trace current authority chain for prior sealed identities
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_sealed_identity_regression.py \
            | tee artifacts/gpt3-lot16-regression.stdout.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-sealed-identity-regression
          path: |
            artifacts/gpt3-lot16-regression
            artifacts/gpt3-lot16-regression.stdout.json
          retention-days: 3
