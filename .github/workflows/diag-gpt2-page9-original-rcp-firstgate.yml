name: DIAG GPT2 Maryborough Page9 Original RCP First Gates

# Public code checks are source-free. Private original-positive replay must
# execute separately on trusted owner/main/manual immutable offline code.
on:
  push:
    branches: [main]
    paths:
      - tools/diag_gpt2_page9_original_rcp_firstgate.py
      - tests/test_gpt2_page9_original_rcp_firstgate.py
      - tests/test_gpt2_page9_rcp_workflow_privacy.py
      - .github/workflows/diag-gpt2-page9-original-rcp-firstgate.yml
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gpt2_page9_original_rcp_firstgate.py
      - tests/test_gpt2_page9_original_rcp_firstgate.py
      - tests/test_gpt2_page9_rcp_workflow_privacy.py
      - .github/workflows/diag-gpt2-page9-original-rcp-firstgate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt2-page9-rcp-public-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-free:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source-free RCP first-gate and privacy regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python -m pytest -q tests/test_gpt2_page9_original_rcp_firstgate.py tests/test_gpt2_page9_rcp_workflow_privacy.py
      - name: Explicitly label source-free scope
        run: |
          echo '### GPT2 page-9 RCP public source-free validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'No original PDF, physical ceiling ownership, FIRM/customer authority or frozen V2 score is authenticated by this workflow.' >> "$GITHUB_STEP_SUMMARY"
