name: DIAG GPT2 Maryborough Grid Face Path

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Prove label-local grid-only face paths
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-grid-face-path
          git rev-parse HEAD > artifacts/gpt2-grid-face-path/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-grid-face-path/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_grid_face_path.py \
            | tee artifacts/gpt2-grid-face-path/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-grid-face-path
          path: artifacts/gpt2-grid-face-path
          retention-days: 1
