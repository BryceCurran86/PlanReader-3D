name: DIAG GPT1 Maryborough Full Production

on:
  pull_request:
    branches:
      - main

jobs:
  maryborough-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify source SHA
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          expected="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          print({"path":str(path),"sha256":actual,"verified":actual==expected})
          if actual != expected:
              raise SystemExit("Maryborough source SHA mismatch")
          PY
      - name: Run real all-family source-closed handoff
        run: |
          mkdir -p artifacts/maryborough-full
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py             --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf"             --project-id au_qld_maryborough_service_station             --workspace-id 1             --family-group all             --output-dir artifacts/maryborough-full             | tee artifacts/maryborough-full/handoff.stdout.json
      - name: Print sealed quantity inventory
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/maryborough-full")
          summary_path=root/"production_summary.json"
          if summary_path.exists():
              summary=json.loads(summary_path.read_text())
              print("PRODUCTION SUMMARY")
              print(json.dumps(summary,indent=2,sort_keys=True))
          sealed_path=root/"au_qld_maryborough_service_station.json"
          if sealed_path.exists():
              sealed=json.loads(sealed_path.read_text())
              print("SEALED QUANTITIES")
              rows=[]
              for q in sealed.get("quantities",[]):
                  rows.append({
                      "quantity_id":q.get("quantity_id"),
                      "family":q.get("family"),
                      "value":q.get("value"),
                      "unit":q.get("unit"),
                      "object_identity_refs":q.get("object_identity_refs"),
                      "lineage_ok":q.get("lineage_ok"),
                      "abstained":q.get("abstained"),
                  })
              print(json.dumps(rows,indent=2,sort_keys=True))
              print("SEALED_QUANTITY_COUNT",len(rows))
          else:
              print("SEALED RUN NOT CREATED")
          maps=list(Path(".").rglob("*identity_map*.json"))
          print("IDENTITY_MAP_CANDIDATES", [str(p) for p in maps])
          PY
      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt1-maryborough-full-production
          path: artifacts/maryborough-full
          retention-days: 2
