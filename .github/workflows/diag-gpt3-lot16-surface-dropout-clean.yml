name: DIAG GPT3 Lot16 Surface Dropout Clean

on:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run focused surface contracts
        run: |
          PYTHONPATH=. pytest -q tests/test_live_floor_area_quantity_publication.py tests/test_live_ceiling_area_quantity_publication.py
      - name: Inspect Lot16 surface dropout
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_surface_dropout_clean.py | tee lot16-surface-dropout-clean.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-surface-dropout-clean
          path: lot16-surface-dropout-clean.json
          retention-days: 2
