name: TEST GPT2 Native Room Wall Witness Contacts
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt2_room_wall_dimension_endpoints.py"
      - "tests/test_gpt2_room_wall_dimension_endpoints.py"
      - ".github/workflows/test-gpt2-room-wall-witness-contacts.yml"
  workflow_dispatch:
jobs:
  source-contact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Keep frozen truth immutable and reject source-unowned dimensions
        run: |
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. pytest -q tests/test_gpt2_room_wall_dimension_endpoints.py
