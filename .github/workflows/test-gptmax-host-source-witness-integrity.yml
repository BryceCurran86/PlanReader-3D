name: GPT MAX Lot16 Source Witness Integrity

concurrency:
  group: test-gptmax-host-source-witness-integrity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - docs/engineering/gptmax_lot16_host_source_queue_20261016.json
      - tests/test_gptmax_lot16_host_source_queue_integrity.py
      - .github/workflows/test-gptmax-host-source-witness-integrity.yml
  push:
    branches: [main]
    paths:
      - docs/engineering/gptmax_lot16_host_source_queue_20261016.json
      - tests/test_gptmax_lot16_host_source_queue_integrity.py
      - .github/workflows/test-gptmax-host-source-witness-integrity.yml
permissions:
  contents: read
jobs:
  diagnostic-witness-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install narrow test dependency
        run: python -m pip install pytest
      - name: Check pinned witness identities and adversarial mutation guards
        run: python -m pytest -q tests/test_gptmax_lot16_host_source_queue_integrity.py
