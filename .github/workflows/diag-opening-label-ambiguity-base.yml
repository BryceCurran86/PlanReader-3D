name: DIAG Opening Label Ambiguity Base

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact ambiguity regression
        run: |
          PYTHONPATH=. pytest -q tests/test_opening_label_dimension_authority.py::test_two_distinct_eligible_callouts_conflict_instead_of_picking_closest
