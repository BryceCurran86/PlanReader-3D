name: VR Editor Source Witness Contract
on:
  pull_request:
    paths:
      - "pb_vr_editor_scene_manifest.py"
      - "pb_vr_editor_readonly_wsgi.py"
      - "tests/editable_3d/test_vr_editor_scene_manifest.py"
      - "tests/editable_3d/test_vr_editor_readonly_wsgi.py"
      - ".github/workflows/vr-editor-source-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test exact original SHA/revision/path and private tenant gates
        run: |
          PYTHONPATH=.:tests python -m pytest -q \
            tests/editable_3d/test_vr_editor_scene_manifest.py \
            tests/editable_3d/test_vr_editor_readonly_wsgi.py
