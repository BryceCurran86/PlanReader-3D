name: TEST GPT3 Surface Handoff Page Split

on:
  push:
    branches:
      - fix/gpt3-surface-handoff-page-split-v1

concurrency:
  group: test-gpt3-surface-handoff-page-split
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Handoff contracts
        run: PYTHONPATH=. pytest -q tests/test_source_closed_project_handoff.py

  maryborough-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Real Maryborough surfaces
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt3-maryborough-surface-split
          START=$(date +%s)
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
            --project-id au_qld_maryborough_service_station \
            --workspace-id 1 \
            --family-group surfaces \
            --output-dir artifacts/gpt3-maryborough-surface-split \
            | tee artifacts/gpt3-maryborough-surface-split/stdout.json
          END=$(date +%s)
          echo "{\"elapsed_seconds\":$((END-START))}" > artifacts/gpt3-maryborough-surface-split/elapsed.json
      - name: Audit
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/gpt3-maryborough-surface-split")
          summary=json.loads((root/"production_summary.json").read_text())
          combined=root/"au_qld_maryborough_service_station.surfaces.json"
          payload=json.loads(combined.read_text()) if combined.is_file() else {}
          q=payload.get("quantities") or []
          print(json.dumps({
            "summary":summary,
            "quantity_count":len(q),
            "quantities":[{
              "quantity_id":x.get("quantity_id"),
              "family":x.get("family"),
              "semantic_key":x.get("semantic_key"),
              "value":x.get("value"),
              "unit":x.get("unit"),
              "object_identity_refs":x.get("object_identity_refs") or [],
              "evidence_ids":x.get("evidence_ids") or [],
              "trace_evidence_ids":x.get("trace_evidence_ids") or [],
              "lineage_ok":x.get("lineage_ok"),
            } for x in q],
            "lineage_conflicts":sum(not bool(x.get("lineage_ok",False)) for x in q),
            "zero_non_abstained":sum(
              not bool(x.get("abstained",False)) and x.get("value") is not None and float(x["value"])==0.0
              for x in q
            )
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt3-maryborough-surface-split
          path: artifacts/gpt3-maryborough-surface-split
          retention-days: 3
