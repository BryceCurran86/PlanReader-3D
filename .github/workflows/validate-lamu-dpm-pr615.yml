name: Validate LAMU DPM PR615

on:
  push:
    branches: [validation/lamu-dpm-pr615]

jobs:
  lamu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and SHA-verify LAMU source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://lamu.go.ke/wp-content/uploads/2018/11/Bill-of-Quantities-ECD-2No-Classrooms-and-Twin-Toilets-Ishakani.pdf" \
            -o benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf
          echo "fa53c9b72fd35189f11848f9a26ccc3512c8c03b5316e78cad6a4d55c09330f2  benchmarks/sources/lamu-ishakani-ecd-classrooms-boq.pdf" | sha256sum -c -
      - name: Run canonical LAMU benchmark
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf benchmark_results_runtime/lamu
          mkdir -p benchmark_results_runtime/lamu
          python pb_benchmark_accuracy_engine.py \
            --benchmark tenders_ke_lamu_ishakani_ecd_classrooms \
            --auto-extract \
            --output-dir benchmark_results_runtime/lamu
      - name: Print LAMU summary and Accuracy-22 rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark_results_runtime/lamu/tenders_ke_lamu_ishakani_ecd_classrooms_accuracy_report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          s = d["summary"]
          accepted = int(s["exact_matches"]) + int(s["within_5_percent"])
          print(f"LAMU_ACCEPTED={accepted}/{s['total_items_compared']}")
          print(f"LAMU_ACCURACY={s['overall_accuracy_percentage']}")
          print(f"LAMU_EXACT={s['exact_matches']}")
          for row in d.get("item_results", []):
              if row.get("item_id") in {"LMU-E3-A","LMU-E3-C","LMU-E4-A","LMU-E7-A","LMU-E7-C"}:
                  print(json.dumps({
                      "item_id": row.get("item_id"),
                      "status": row.get("status"),
                      "expected_quantity": row.get("expected_quantity"),
                      "extracted_quantity": row.get("extracted_quantity"),
                  }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lamu-pr615-validation
          path: benchmark_results_runtime/lamu/
          if-no-files-found: error
