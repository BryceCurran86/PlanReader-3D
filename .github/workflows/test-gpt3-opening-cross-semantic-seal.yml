name: GPT3 Cross-Semantic Physical Opening Sealed Uniqueness
on:
  pull_request:
    branches: [main]
    paths:
      - pb_source_closed_run_export.py
      - tests/test_gpt3_opening_cross_semantic_source_seal.py
      - .github/workflows/test-gpt3-opening-cross-semantic-seal.yml
permissions:
  contents: read
jobs:
  source-sealed-opening-physical-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Opening physical identity and original eight signed archive
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt3_opening_cross_semantic_source_seal.py tests/test_source_closed_run_export.py
          ruff check --select F821,F823 pb_source_closed_run_export.py tests/test_gpt3_opening_cross_semantic_source_seal.py
