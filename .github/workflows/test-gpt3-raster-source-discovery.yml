name: GPT MAX Four Member Raster Source Discovery
on:
  pull_request:
    paths:
      - pb_opening_host_frame_authority.py
      - pb_physical_wall_candidate_authority.py
      - pb_source_visibility_authority.py
      - pb_raster_source_wall_frame_projection.py
      - tests/test_raster_connected_host_frame.py
      - tests/test_raster_source_wall_frame_projection.py
      - tests/test_raster_visibility_receipt_registration.py
      - tools/diag_opening_wall_face_preservation.py
      - .github/workflows/test-gpt3-raster-source-discovery.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gpt3-raster-source-discovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-proof:
    runs-on: ubuntu-latest
    env:
      ORT_DISABLE_TELEMETRY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37830114626
          name: lot16-connected-frame-source-handoff
          path: prerequisite-lot16
      - name: Real Lot16 source, wall and host handoff
        run: >-
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py
          --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          --page-id 3 --output lot16-connected-frame-source-handoff.json
      - name: Reauthenticate original native pale-fill opposition before changing a source claim
        run: >-
          PYTHONPATH=. python -u tools/diag_native_opening_source_roles.py
          --pdf 'documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          --page-id 3 --output lot16-native-source-roles.json
      - name: Verify exact source ownership and safety cap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('lot16-connected-frame-source-handoff.json').read_text())
          assert report['source_sha256'] == '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert report['primitive_safety_cap'] == 20_000
          assert report['opening_bindings']
          assert any('raster_source_band_host_resolved' in row['reason_codes'] for row in report['opening_bindings'])
          assert report['source_owned_wall_scope_results']
          assert all(row['source_sha256'] == report['source_sha256'] for row in report['source_owned_wall_scope_results'])
          ids = [row['opening_identity_id'] for row in report['opening_bindings']]
          assert len(ids) == len(set(ids))
          assert 'quantities' not in report
          baseline = json.loads(Path('prerequisite-lot16/lot16-connected-frame-source-handoff.json').read_text())
          keyed = lambda rows: {row['opening_identity_id']: row for row in rows}
          assert baseline['source_sha256'] == report['source_sha256']
          assert baseline['primitive_safety_cap'] == report['primitive_safety_cap']
          old_bindings=keyed(baseline['opening_bindings'])
          new_bindings=keyed(report['opening_bindings'])
          assert len(old_bindings)==len(baseline['opening_bindings'])
          assert len(new_bindings)==len(report['opening_bindings'])
          assert set(new_bindings)<=set(old_bindings), 'unproved new source opening'
          assert all(new_bindings[oid]==old_bindings[oid] for oid in new_bindings), (
              'an existing source-backed opening binding changed'
          )
          missing=set(old_bindings)-set(new_bindings)
          assert missing=={'physical_opening_existence_b222d5310a7df1d632d5daab1a676645'}, (
              'source openings were added or a non-table candidate was removed',missing
          )
          roles=json.loads(Path('lot16-native-source-roles.json').read_text())
          assert roles['source_sha256']==report['source_sha256']
          assert roles['summary']['positive_existence_claims']==len(new_bindings)
          for oid in missing:
              previous=old_bindings[oid]
              assert previous['record_id'] is None and previous['host_wall_id'] is None, (
                  'removed opening had an authenticated host',oid
              )
              representative=previous['representative_observation_id']
              matching=[
                  row for row in roles['retained_opposed_candidates']
                  if row['status']=='abstained'
                  and representative in row['candidate']['source_observation_ids']
              ]
              assert len(matching)==1,('original native opposition absent or ambiguous',oid)
              assert any(
                  atom['kind']=='annotation_border' and atom['status']=='candidate'
                  and atom['reason_codes']==['native_unstroked_pale_neutral_fill_boundary']
                  and atom['metadata']['polarity']=='opposing'
                  and atom['metadata']['paint_type']=='f'
                  and atom['metadata']['stroke'] is None
                  and atom['metadata']['fill_opacity']==1.0
                  and atom['metadata']['all_source_primitives_covered'] is True
                  and set(atom['metadata']['source_observation_ids'])
                      ==set(row['candidate']['source_observation_ids'])
                  for row in matching for atom in row['opposing_evidence_atoms']
              ),('original source-owned pale fill does not oppose the complete candidate',oid)
          old_frames, new_frames = keyed(baseline['host_frames']), keyed(report['host_frames'])
          assert len(old_frames)==len(baseline['host_frames'])
          assert len(new_frames)==len(report['host_frames'])
          assert set(new_frames)==set(new_bindings)
          assert all(new_frames[key] == row for key, row in old_frames.items()
                     if row['record_id'] is not None), 'an authenticated source frame changed'
          assert baseline['summary']['host_bindings']==report['summary']['host_bindings']==14
          assert baseline['summary']['host_frames']==report['summary']['host_frames']==9
          advanced = [key for key, row in old_frames.items() if key in new_frames
                      and 'opening_host_frame_selected_opening_not_discovered' in row['reason_codes']
                      and 'opening_host_frame_selected_opening_not_discovered' not in new_frames[key]['reason_codes']]
          assert advanced, 'No previously undiscovered source frame reached its geometry gate'
          print({'source_discovery_advanced': advanced, 'bindings_and_proved_frames_retained': True})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-connected-frame-source-handoff
          path: |
            lot16-connected-frame-source-handoff.json
            lot16-native-source-roles.json
          retention-days: 14
  maryborough-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37830114626
          name: maryborough-connected-frame-source-handoff
          path: prerequisite-maryborough
      - name: Compare real Maryborough source and host identities with prerequisite
        run: |
          PYTHONPATH=. python -u tools/diag_opening_wall_face_preservation.py --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf --page-id 7 --page-id 30 --page-id 31 --output maryborough-connected-frame-source-handoff.json
          cp prerequisite-maryborough/maryborough-connected-frame-source-handoff.json maryborough-source-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('maryborough-source-baseline.json').read_text())
          current = json.loads(Path('maryborough-connected-frame-source-handoff.json').read_text())
          assert current['source_sha256'] == baseline['source_sha256'] == 'b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert current['primitive_safety_cap'] == baseline['primitive_safety_cap'] == 20_000
          keyed = lambda rows: {row['opening_identity_id']: row for row in rows}
          assert keyed(current['opening_bindings']) == keyed(baseline['opening_bindings'])
          assert len(current['opening_bindings']) == len(keyed(current['opening_bindings']))
          old_frames, new_frames = keyed(baseline['host_frames']), keyed(current['host_frames'])
          assert all(new_frames[key] == row for key, row in old_frames.items() if row['record_id'])
          assert 'quantities' not in current
          print(json.dumps({'baseline': baseline['summary'], 'current': current['summary'], 'host_identity_parity': True, 'existing_frame_identity_parity': True}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maryborough-connected-frame-source-handoff
          path: maryborough-*.json
          retention-days: 14
