name: DIAG GPT1 Maryborough Room Ceiling On 1887

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run room to ceiling authority chain
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json,time
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          from pb_live_ceiling_lining_integration import collect_live_ceiling_lining_claims
          from pb_live_floor_area_quantity_publication import publish_live_floor_area_quantities
          from pb_live_ceiling_area_quantity_publication import publish_live_ceiling_area_quantities

          pdf=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")

          t=time.perf_counter()
          claim=collect_live_physical_net_wall_claim(
              pdf,
              pages=(6,8,10,29,30),
              topology_pages=(6,29,30),
              room_area_support_pages=(8,10),
          )
          room_seconds=time.perf_counter()-t
          room_q=tuple(claim.room_area_quantity_evidence)
          floor_q=tuple(publish_live_floor_area_quantities(claim))

          t=time.perf_counter()
          ceiling=collect_live_ceiling_lining_claims(
              pdf,
              pages=tuple(range(31)),
              topology_pages=(6,29,30),
              authoritative_room_area_quantities=room_q,
          )
          ceiling_seconds=time.perf_counter()-t
          ceiling_q=tuple(publish_live_ceiling_area_quantities(ceiling))

          def qrow(q):
              return {
                  "family":q.family,
                  "semantic_key":q.semantic_key,
                  "value":q.value,
                  "unit":q.unit,
                  "status":q.status,
                  "abstained":q.abstained,
                  "authority":q.authority,
                  "metadata":dict(q.metadata or {}),
                  "blocking_reasons":list(q.blocking_reasons),
                  "input_entity_ids":list(q.input_entity_ids),
              }

          print(json.dumps({
              "room_seconds":room_seconds,
              "ceiling_seconds":ceiling_seconds,
              "room_quantity_count":len(room_q),
              "room_quantities":[qrow(q) for q in room_q],
              "floor_quantity_count":len(floor_q),
              "floor_quantities":[qrow(q) for q in floor_q],
              "ceiling_status":getattr(ceiling.status,"value",str(ceiling.status)),
              "ceiling_reason_codes":list(ceiling.reason_codes),
              "ceiling_claim_count":len(ceiling.claims),
              "canonical_ceiling_count":len(ceiling.canonical_ceilings),
              "ceiling_quantity_count":len(ceiling_q),
              "ceiling_quantities":[qrow(q) for q in ceiling_q],
          },indent=2,sort_keys=True))
          PY
