name: DIAG GPT2 Maryborough Grid Composite Face

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prove grid-separated composite room faces
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-grid-composite-face
          git rev-parse HEAD > artifacts/gpt2-grid-composite-face/head_sha.txt
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > artifacts/gpt2-grid-composite-face/source_sha256.txt
          PYTHONPATH=. python -u tools/diag_maryborough_grid_composite_face.py \
            | tee artifacts/gpt2-grid-composite-face/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-grid-composite-face
          path: artifacts/gpt2-grid-composite-face
          retention-days: 1
