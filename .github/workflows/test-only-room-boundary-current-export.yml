name: TEST ONLY Room Boundary Recovery Current Export
# synchronize trigger

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record head
        run: git rev-parse HEAD > ROOM_BOUNDARY_CURRENT_HEAD_SHA.txt
      - name: Pack checkout
        run: git archive --format=tar.gz -o room-boundary-current.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: room-boundary-current
          path: |
            room-boundary-current.tar.gz
            ROOM_BOUNDARY_CURRENT_HEAD_SHA.txt
          retention-days: 1
