name: DIAG GPT3 Lot16 Jamb Pair Candidate Groups

on:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Group two-face candidates by exact jamb topology
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_jamb_pair_candidate_groups.py | tee lot16-jamb-pair-candidate-groups.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-lot16-jamb-pair-candidate-groups
          path: lot16-jamb-pair-candidate-groups.json
          retention-days: 2
