name: DIAG GPT1 Lot16 Label Face Coverage

on:
  push:
    branches:
      - diag/gpt1-lot16-label-face-membership-v1

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Trace target label coverage
        run: |
          PYTHONPATH=. python -u - <<'PY'
          import json, math
          from pathlib import Path
          import fitz
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(2,),
              topology_pages=(2,),
              room_area_support_pages=None,
          )

          rooms=[]
          for room in claim.canonical_rooms:
              pts=tuple(room.polygon_pdf_pts or ())
              if not pts:
                  continue
              xs=[float(p[0]) for p in pts]
              ys=[float(p[1]) for p in pts]
              rooms.append({
                  "room_id":room.physical_room_id,
                  "label":room.room_label,
                  "bbox":[min(xs),min(ys),max(xs),max(ys)],
                  "point_count":len(pts),
              })

          doc=fitz.open(path)
          try:
              words=list(doc[2].get_text("words") or ())
          finally:
              doc.close()
          target={"WIR","GARAGE","WC","LINEN","ENS."}
          labels=[]
          for w in words:
              raw=str(w[4] or "").strip().upper()
              if raw not in target:
                  continue
              x0,y0,x1,y1=map(float,w[:4])
              labels.append({
                  "raw_text":raw,
                  "block_no":int(w[5]),
                  "line_no":int(w[6]),
                  "point":[(x0+x1)/2.0,(y0+y1)/2.0],
                  "bbox":[x0,y0,x1,y1],
              })

          for item in labels:
              x,y=item["point"]
              ranked=[]
              for room in rooms:
                  x0,y0,x1,y1=room["bbox"]
                  dx=max(x0-x,0.0,x-x1)
                  dy=max(y0-y,0.0,y-y1)
                  ranked.append({
                      "room_id":room["room_id"],
                      "label":room["label"],
                      "bbox":room["bbox"],
                      "bbox_distance":math.hypot(dx,dy),
                      "inside_bbox":x0<=x<=x1 and y0<=y<=y1,
                  })
              ranked.sort(key=lambda r:(r["bbox_distance"],r["room_id"]))
              item["nearest_rooms"]=ranked[:8]

          print(json.dumps({
              "room_count":len(rooms),
              "room_bbox_union":[
                  min(r["bbox"][0] for r in rooms),
                  min(r["bbox"][1] for r in rooms),
                  max(r["bbox"][2] for r in rooms),
                  max(r["bbox"][3] for r in rooms),
              ] if rooms else None,
              "targets":labels,
          },indent=2,sort_keys=True))
          PY
