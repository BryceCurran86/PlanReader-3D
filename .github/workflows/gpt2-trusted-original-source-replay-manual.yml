name: GPT2 trusted original replay (manual)

# Owner-run only. No push / PR / pull_request_target source-secret exposure.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select one immutable original replay or all approved targets"
        required: true
        type: choice
        default: all
        options: [all, a600, grid, rcp_ink, finish_page, office_caps]

permissions:
  contents: read

concurrency:
  group: gpt2-trusted-original-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  original:
    # A collaborator rerun retains the ORIGINAL github.actor privileges. Both
    # the initial dispatcher and the rerun initiator must be the owner.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' && github.triggering_actor == 'BryceCurran86' }}
    name: ${{ matrix.target }} original (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        target: ${{ fromJSON(inputs.target == 'a600' && '["a600"]' || inputs.target == 'grid' && '["grid"]' || inputs.target == 'rcp_ink' && '["rcp_ink"]' || inputs.target == 'finish_page' && '["finish_page"]' || inputs.target == 'office_caps' && '["office_caps"]' || '["a600","freezer","d15","rcp","grid","rcp_ink","d15_ink","finish_page","office_caps"]') }}

    steps:
      - name: Checkout the trusted workflow context
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate immutable target and full tree diff before provisioning
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          approved_base=ce322d69bbc9f47b5b2aed001684e01cbe04f48b
          case "$TARGET" in
            a600)
              # Current-main exact diff is four reviewed GPT2 source/test blobs.
              approved_base=65dc4684fbcf1ce36c704457d896fc7c12a651de
              approved_head=f32e01ed58369bf400a7a91a0360fd25963b3d1a
              expected_paths='pb_gpt2_original_a600_table_row_scope_shadow.py|pb_source_door_schedule_authority.py|pb_source_plan_door_correspondence_authority.py|tests/test_gpt2_original_a600_table_row_scope_shadow.py'
              original_test=test_original_private_source_publisher_table_census_if_provisioned
              test_path=tests/test_gpt2_original_a600_table_row_scope_shadow.py
              ;;
            freezer)
              approved_head=2e2e622515db29203f6299d537b1ccb232adea30
              expected_paths='pb_gpt2_original_native_freezer_paint_gap_shadow.py|tests/test_gpt2_original_native_freezer_paint_gap_shadow.py'
              original_test=test_original_freezer_d17_private_pdf_if_provisioned
              test_path=tests/test_gpt2_original_native_freezer_paint_gap_shadow.py
              ;;
            d15)
              approved_head=e8700f3030d66121d793f1a1924f20f7e3b2ddb9
              expected_paths='pb_gpt2_mary_original_figured_door_leader_shadow.py|tests/test_gpt2_mary_original_figured_door_leader_shadow.py'
              original_test=test_private_original_maryborough_native_leader_source_if_provisioned
              test_path=tests/test_gpt2_mary_original_figured_door_leader_shadow.py
              ;;
            rcp)
              approved_head=8db7ef5c931c5f37bf63cdfbbb8b0b7a5fce29a1
              expected_paths='pb_gpt2_original_mary_rcp_native_word_scope_shadow.py|tests/test_gpt2_original_mary_rcp_native_word_scope_shadow.py'
              original_test=test_real_original_page9_native_source_rivals_if_available
              test_path=tests/test_gpt2_original_mary_rcp_native_word_scope_shadow.py
              ;;
            grid)
              # This immutable existing GPT2 source-shadow PR has a distinct
              # approved base; never fetch code from a mutable PR head.
              approved_base=65dc4684fbcf1ce36c704457d896fc7c12a651de
              approved_head=9b0657d54957061a46148857226250500ad35f57
              expected_paths='pb_gpt2_native_grid_row_membership_shadow.py|tests/test_gpt2_native_grid_row_membership_shadow.py'
              original_test=test_private_original_d02_grid_membership_from_published_source_if_provisioned
              test_path=tests/test_gpt2_native_grid_row_membership_shadow.py
              ;;
            rcp_ink)
              # Current exact-head RCP shadow branch incorporates the #4136
              # replay merge; compare to that trusted main tree, not the
              # obsolete pre-merge base (which would include workflow paths).
              approved_base=837befe133e89db7d5cb5878bff141e1e6d08923
              approved_head=20c0b7e9978683ddb1e6f6490bfbfd8c2db259f6
              expected_paths='pb_gpt2_original_mary_rcp_native_word_scope_shadow.py|tests/test_gpt2_original_mary_rcp_native_word_scope_shadow.py'
              original_test=test_real_original_page9_native_source_rivals_if_available
              test_path=tests/test_gpt2_original_mary_rcp_native_word_scope_shadow.py
              ;;
            d15_ink)
              # Source-only D15 glyph-order fix: immutable original-head
              # candidate, never an arbitrary PR head or mutable branch.
              approved_base=b4a9994a98d3d2d8463c490469176f0724b780cc
              approved_head=c52f45f3365b74f3b4070ea051e338329f09de76
              expected_paths='pb_gpt2_mary_original_figured_door_leader_shadow.py|tests/test_gpt2_mary_original_figured_door_leader_shadow.py'
              original_test=test_private_original_maryborough_native_leader_source_if_provisioned
              test_path=tests/test_gpt2_mary_original_figured_door_leader_shadow.py
              ;;
            finish_page)
              # Exact immutable GPT2 source-to-shadow negative; this does NOT
              # authenticate a physical room, a cross-sheet join or a quantity.
              approved_base=f4fd0f786411b45784f77c784546df0ae5f67d6b
              approved_head=cb19b928982f8565f86443af11c7e2ccc0c5f672
              expected_paths='pb_source_floor_finish_occurrence_ownership_shadow.py|pb_source_full_plan_recovery_engine_shadow.py|tests/test_source_floor_finish_occurrence_ownership_shadow.py|tests/test_source_full_plan_recovery_engine_shadow.py'
              original_test=test_private_original_maryborough_p11_ft3_foreign_page_abstains_if_provisioned
              test_path=tests/test_source_full_plan_recovery_engine_shadow.py
              ;;
            office_caps)
              # OFFICE cross-view source-ink negative, not physical W4 authority.
              # Immutable two-file PR tree; never execute mutable branch code.
              approved_base=6be737582400c739c41420c19962e9b30b9c7d37
              approved_head=80ab45ddb082f3364cd9c7f429814f921e8b889d
              expected_paths='pb_gpt2_original_native_crossview_wall_caps_shadow.py|tests/test_gpt2_original_native_crossview_wall_caps_shadow.py'
              original_test=test_original_maryborough_p7_p11_when_owner_pdf_provisioned
              test_path=tests/test_gpt2_original_native_crossview_wall_caps_shadow.py
              ;;
            *)
              echo "::error::Unapproved original-source code selection"
              exit 1
              ;;
          esac
          # Compare immutable Git tree objects, never a mutable branch or an
          # arbitrary caller-provided commit SHA. Any changed workflow,
          # provisioner, dependency, manifest or unreviewed file is a veto.
          git fetch --no-tags --depth=1 origin "$approved_base" "$approved_head"
          observed="$(git diff --name-only "$approved_base" "$approved_head" | LC_ALL=C sort)"
          allowed="$(printf '%s\n' "$expected_paths" | tr '|' '\n' | LC_ALL=C sort)"
          if [[ "$observed" != "$allowed" ]]; then
            echo "::error::Pinned code tree differs from reviewed GPT2 allowlist"
            exit 1
          fi
          # Preserve trusted main as the local-action execution root.
          # Export the immutable reviewed PR tree as inert test data only.
          target_tree="$RUNNER_TEMP/gpt2-approved-target"
          mkdir -p "$target_tree"
          # Name-only diff allowlisting is insufficient: a reviewed .py/.md
          # path may become a symlink, gitlink or executable without changing
          # its name. Only normal nonexecutable blobs can be trusted as inputs
          # to the sealed, offline source-positive test environment.
          while IFS= read -r expected_path; do
            [[ -n "$expected_path" ]] || continue
            entry="$(git ls-tree --format='%(objectmode) %(objecttype) %(path)' "$approved_head" -- "$expected_path")"
            if [[ "$entry" != "100644 blob $expected_path" ]]; then
              echo "::error::Approved GPT2 source/test path has unreviewed Git object type or mode"
              exit 1
            fi
          done <<< "$allowed"
          git archive "$approved_head" | tar -x -C "$target_tree"
          # Nested source mount must exist even when the Git archive omits
          # untracked/private documents/sources entirely.
          mkdir -p "$target_tree/documents/sources"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ -f "$target_tree/$test_path" ]]
          echo "GPT2_APPROVED_TREE=$target_tree" >> "$GITHUB_ENV"
          echo "GPT2_TEST_PATH=$test_path" >> "$GITHUB_ENV"
          echo "GPT2_ORIGINAL_TEST=$original_test" >> "$GITHUB_ENV"
          echo "GPT2_APPROVED_HEAD=$approved_head" >> "$GITHUB_ENV"
          echo "Verified pinned $TARGET source/test diff against trusted main."

      - name: Build sealed Python dependency image before private source exists
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="$RUNNER_TEMP/gpt2-offline.Dockerfile"
          cat > "$dockerfile" <<'DOCKER'
          FROM python:${{ matrix.python-version }}-slim
          WORKDIR /workspace
          COPY requirements.txt requirements-ci-v1228.txt /deps/
          RUN python -m pip install --no-cache-dir -r /deps/requirements.txt -r /deps/requirements-ci-v1228.txt && python -m pip install --no-cache-dir fonttools==4.60.2
          DOCKER
          # Build from ONLY immutable approved-candidate dependency inputs.
          # Independently moving main and candidate code are not image context.
          deps_dir="$RUNNER_TEMP/gpt2-approved-deps"
          mkdir -p "$deps_dir"
          cp -- "$GPT2_APPROVED_TREE/requirements.txt" "$GPT2_APPROVED_TREE/requirements-ci-v1228.txt" "$deps_dir/"
          docker build -q -f "$dockerfile" -t "gpt2-offline:${{ matrix.python-version }}" "$deps_dir"

      - name: Preflight offline pinned test collection before private source exists
        shell: bash
        run: |
          set -euo pipefail
          preflight_original="$RUNNER_TEMP/gpt2-empty-original-preflight"
          mkdir -p "$preflight_original"
          printf "synthetic mount only\\n" > "$preflight_original/NO_REAL_SOURCE.txt"
          output="$RUNNER_TEMP/gpt2-private-preflight.log"
          preflight_rc=0
          docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 \
              --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --mount "type=bind,src=$GPT2_APPROVED_TREE,dst=/workspace,readonly" \
              --mount "type=bind,src=$preflight_original,dst=/workspace/documents/sources,readonly" \
              --workdir /workspace \
              -e HOME=/tmp -e XDG_CACHE_HOME=/tmp \
              -e PYTHONPATH=/workspace -e PYTHONDONTWRITEBYTECODE=1 \
              -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              "gpt2-offline:${{ matrix.python-version }}" \
              python -m pytest --collect-only -q -p no:cacheprovider --tb=no \
              "$GPT2_TEST_PATH::$GPT2_ORIGINAL_TEST" > "$output" 2>&1 || preflight_rc=$?
          if (( preflight_rc != 0 )); then
            echo "::error::Offline preflight failed BEFORE original provisioning (status $preflight_rc); no private source accessed"
            exit 1
          fi
          if ! grep -Eq '1 test collected' "$output"; then
            echo "::error::Offline original-test collection missing; no private source accessed"
            exit 1
          fi
          echo "Offline test environment/collection PASS before original provisioning"

      - name: Provision only SHA-verified Maryborough original
        uses: ./.github/actions/provision-original-sources
        with:
          token: ${{ secrets.ORIGINAL_SOURCES_TOKEN }}
          repository: ${{ vars.ORIGINAL_SOURCES_REPOSITORY }}
          ref: ${{ vars.ORIGINAL_SOURCES_REF }}
          names: |
            Arch_Combined_Maryborough_Service_Station.pdf
          allow-missing: "false"

      - name: Verify original PDF SHA inside isolated read-only source mount
        shell: bash
        env:
          EXPECTED_SHA256: b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
        run: |
          set -euo pipefail
          # Trusted stdlib-only isolated interpreter, -I ignores PR PYTHONPATH.
          # Only a fixed success/failure bit leaves the sandbox; no bytes,
          # filenames from PR code or raw logs reach the public Actions log.
          result="$RUNNER_TEMP/gpt2-private-mount-integrity.log"
          status=0
          docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 \
              --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --mount "type=bind,src=$GPT2_APPROVED_TREE,dst=/workspace,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/documents/sources,dst=/workspace/documents/sources,readonly" \
              --workdir /tmp -e EXPECTED_SHA256 \
              "gpt2-offline:${{ matrix.python-version }}" \
              python -I -c 'import hashlib,os,pathlib,sys; p=pathlib.Path("/workspace/documents/sources/Arch_Combined_Maryborough_Service_Station.pdf"); sys.exit(0 if hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["EXPECTED_SHA256"] else 2)' \
              > "$result" 2>&1 || status=$?
          if (( status != 0 )); then
            echo "::error::Isolated original mount/read/SHA verification FAILED (exit $status); private output withheld"
            exit 1
          fi
          echo "Isolated original mount and full SHA verification PASS"

      - name: Run private original checks inside no-network read-only container
        shell: bash
        env:
          PLANREADER_MARYBOROUGH_SOURCE_SHA256: b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
        run: |
          set -euo pipefail
          # No PR-owned Python executes on the token-bearing host with the PDF.
          # No private test stdout/stderr is ever printed into public logs.
          # Host has a network, isolated test container has none.
          output="$RUNNER_TEMP/gpt2-private-isolated.log"
          run_test() {
            local label="$1"; shift
            : > "$output"
            local docker_rc=0
            docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --pids-limit 128 \
                --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
                --mount "type=bind,src=$GPT2_APPROVED_TREE,dst=/workspace,readonly" \
                --mount "type=bind,src=$GITHUB_WORKSPACE/documents/sources,dst=/workspace/documents/sources,readonly" \
                --workdir /workspace \
                -e HOME=/tmp -e XDG_CACHE_HOME=/tmp \
                -e PYTHONPATH=/workspace -e PYTHONDONTWRITEBYTECODE=1 \
                -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
                -e PLANREADER_MARYBOROUGH_ORIGINAL_PDF="documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" \
                -e PLANREADER_MARYBOROUGH_SOURCE_SHA256 \
                "gpt2-offline:${{ matrix.python-version }}" \
                python -m pytest -q -p no:cacheprovider --tb=no --disable-warnings "$@" \
                > "$output" 2>&1 || docker_rc=$?
            if (( docker_rc != 0 )); then
              # Strictly fixed vocabulary: NEVER print, upload or quote PR-owned
              # stdout/stderr, filenames, arbitrary exception text or PDF content.
              local reason=private_test_failure
              case "$docker_rc" in
                125|126|127) reason=container_launch_failure ;;
                2|3|4|5) reason=pytest_collection_or_runtime_failure ;;
              esac
              if grep -Fq 'ModuleNotFoundError' "$output"; then
                reason=missing_python_module
              elif grep -Fq 'ImportError' "$output"; then
                reason=python_import_error
              elif grep -Fq 'FileNotFoundError' "$output"; then
                reason=missing_file_in_container
              elif grep -Fq 'PermissionError' "$output"; then
                reason=container_permission_error
              elif grep -Fq 'Read-only file system' "$output"; then
                reason=container_readonly_filesystem
              elif grep -Fq 'ERROR: found no collectors for' "$output"; then
                reason=pytest_no_collector
              fi
              echo "::error::Offline GPT2 $label FAIL (exit $docker_rc; class $reason); private log withheld"
              exit 1
            fi
            if ! grep -Eq '(^|[ ,])[1-9][0-9]* passed' "$output"; then
              echo "::error::Isolated GPT2 $label skipped/missing tests"
              exit 1
            fi
            echo "Isolated $label PASS for immutable $GPT2_APPROVED_HEAD"
          }
          run_test source-positive "$GPT2_TEST_PATH::$GPT2_ORIGINAL_TEST"
          run_test full-module "$GPT2_TEST_PATH"
          {
            echo "### GPT2 private original offline replay"
            echo "- Immutable target: $GPT2_APPROVED_HEAD"
            echo "- Offline source-positive + full module: PASS"
            echo "- No FIRM quantity / frozen score implied"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral originals and unpublished test logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/gpt2-private-isolated.log" "$RUNNER_TEMP/gpt2-private-preflight.log" "$RUNNER_TEMP/gpt2-private-mount-integrity.log" "$RUNNER_TEMP/gpt2-offline.Dockerfile"
          rm -rf "$RUNNER_TEMP/gpt2-empty-original-preflight" "$RUNNER_TEMP/gpt2-approved-target" "$RUNNER_TEMP/gpt2-approved-deps" documents/sources
