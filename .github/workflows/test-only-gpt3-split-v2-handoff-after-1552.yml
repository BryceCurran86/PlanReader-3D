name: TEST ONLY GPT3 Split V2 Handoff After 1552

on:
  pull_request:
    branches:
      - gpt3/handoff-source-scoped-execution-final

jobs:
  handoff:
    name: ${{ matrix.project_id }} ${{ matrix.family_group }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: au_qld_maryborough_service_station
            family_group: core
            pdf: documents/sources/Arch_Combined_Maryborough_Service_Station.pdf
          - project_id: au_qld_maryborough_service_station
            family_group: surfaces
            pdf: documents/sources/Arch_Combined_Maryborough_Service_Station.pdf
          - project_id: au_qld_lot16_power
            family_group: core
            pdf: documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf
          - project_id: au_qld_lot16_power
            family_group: surfaces
            pdf: documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Run source-closed split handoff
        continue-on-error: true
        shell: bash
        run: |
          out="artifacts/${{ matrix.project_id }}/${{ matrix.family_group }}"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/head_sha.txt"
          sha256sum "${{ matrix.pdf }}" > "$out/source_sha256.txt"
          set +e
          PYTHONPATH=. python -u tools/run_source_closed_project_handoff.py \
            --pdf "${{ matrix.pdf }}" \
            --project-id "${{ matrix.project_id }}" \
            --workspace-id 1 \
            --family-group "${{ matrix.family_group }}" \
            --output-dir "$out" \
            > "$out/run.log" 2>&1
          code=$?
          echo "$code" > "$out/exit_code.txt"
          cat "$out/run.log"
          exit 0

      - name: Show result
        if: always()
        shell: bash
        run: |
          out="artifacts/${{ matrix.project_id }}/${{ matrix.family_group }}"
          echo "=== files ==="
          find "$out" -maxdepth 3 -type f -print || true
          echo "=== exit ==="
          cat "$out/exit_code.txt" 2>/dev/null || true
          echo "=== summary ==="
          cat "$out/production_summary.json" 2>/dev/null || true
          echo "=== tail ==="
          tail -n 160 "$out/run.log" 2>/dev/null || true

      - name: Upload split handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-${{ matrix.project_id }}-${{ matrix.family_group }}
          path: artifacts/${{ matrix.project_id }}/${{ matrix.family_group }}
          retention-days: 1
          if-no-files-found: warn
