name: GPT MAX Raster Measurement Source Handoff
on:
  pull_request:
    paths:
      - pb_opening_dimension_authority.py
      - pb_schedule_opening_instance_binding_authority.py
      - tests/test_raster_measurement_source_handoff.py
      - .github/workflows/test-gptmax-raster-measurement-source.yml
concurrency:
  group: gptmax-raster-measurement-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      ORT_DISABLE_TELEMETRY: "1"
      # Public omission is not original-source verification.
      PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
      # Indexed receipt packages must not receive unindexed bytecode.
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Integrity and provider isolation
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/planreader-pycache
        run: |
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          python -m compileall -q .
          ruff check --select F821,F823 .
      - name: Source handoff regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_raster_measurement_source_handoff.py
      - name: Full regression suite
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/planreader-pycache
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Smoke test
        run: python tests/ci_smoke.py
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Original Lot16 source-proof NOT RUN on public CI
        run: |
          set -euo pipefail
          echo '::notice::Original Lot16 source-proof NOT RUN on public CI; protected exact-head private replay required before release'
          echo 'Original Lot16 source-proof NOT RUN. This source-neutral check does not validate PDF ownership, customer quantities, signed retention or the frozen120 score.' >> "$GITHUB_STEP_SUMMARY"
