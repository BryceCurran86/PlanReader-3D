name: DIAG GPT2 B03 Maryborough Native Room Map

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt2_maryborough_room_source_map.py"
      - ".github/workflows/diag-gpt2-b03-native-room-map.yml"
  workflow_dispatch:

jobs:
  native-room-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Map source-native candidate labels across 31 pages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-b03-native-room-map
          PYTHONPATH=. python tools/diag_gpt2_maryborough_room_source_map.py \
            --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf \
            --source-sha256 b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007 \
            --output artifacts/gpt2-b03-native-room-map/report.json \
            | tee artifacts/gpt2-b03-native-room-map/summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-b03-native-room-source-map
          path: artifacts/gpt2-b03-native-room-map
          retention-days: 7
