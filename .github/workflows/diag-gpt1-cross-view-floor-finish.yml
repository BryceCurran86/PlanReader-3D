name: DIAG GPT1 Cross-View Floor Finish

on:
  push:
    branches:
      - gpt1/cross-view-floor-finish-ownership-v1

concurrency:
  group: diag-gpt1-cross-view-floor-finish
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Run floor-finish authority tests
        run: |
          PYTHONPATH=. pytest -q             tests/test_cross_view_floor_finish_authority_v1.py             tests/test_live_floor_finish_area_source_closed_export.py
