name: GPT MAX Original Infill Endpoint Opposition
on:
  pull_request:
    branches: [main]
    paths:
      - "pb_g17_infill_endpoint_opposition_shadow.py"
      - "pb_g17_source_infill_opposition_shadow.py"
      - "pb_g17_plan_wall_scope_shadow.py"
      - "tests/test_g17_infill_endpoint_opposition_shadow.py"
      - "tools/verify_g17_original_infill_endpoint_customer_retention.py"
      - ".github/workflows/test-gptmax-infill-endpoint-opposition.yml"
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  endpoint-source-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Source ownership, actual endpoint incidence, remote/short/split cases and unchanged default partition
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_g17_infill_endpoint_opposition_shadow.py tests/test_g17_source_infill_opposition_shadow.py tests/test_g17_plan_wall_scope_shadow.py tests/test_gptmax_w4_identity_abstention_shadow.py tests/test_opening_local_g17_wall_shadow.py tests/test_g17_dual_dpi_source_correspondence_shadow.py tests/test_source_owned_physical_plan_view.py tests/test_g17_w4_equivalence_competitor_shadow.py
          ruff check --select F821,F823 pb_g17_infill_endpoint_opposition_shadow.py pb_g17_plan_wall_scope_shadow.py pb_g17_source_infill_opposition_shadow.py tests/test_g17_infill_endpoint_opposition_shadow.py tools/verify_g17_original_infill_endpoint_customer_retention.py
  original-endpoint-customer-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Immutable original collector, endpoint experiment and exact signed customer retention
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/verify_g17_original_infill_endpoint_customer_retention.py --pdf "$PDF" --page 3 --project-id au_qld_lot16_power --output artifacts/original-infill-endpoint-customer-retention.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/original-infill-endpoint-customer-retention.json').read_text())
          assert r['original_customer_scope_verified'] and r['all_actual_production_receipts_unchanged']
          a,b=r['baseline_customer_receipts'],r['candidate_customer_receipts']
          assert a==b and a['verification']['valid_quantity_count']==len(a['customer_rows'])==8
          p,=r['source_observers']
          assert p['source_sha256']==r['source_sha256'] and p['source_viewport_ownership_id']
          assert p['baseline_w2_geometry_unchanged'] and p['ordinary_source_snapshot_unchanged']
          parts=p['candidate_partitions']
          assert sum(len(part['source_endpoint_opposed_continuations']) for part in parts.values())>0
          assert all(not p[k] for k in ('host_granted','structural_wall_role_granted','physical_wall_equivalence_granted','metric_quantity_granted'))
          for part in parts.values():
              assert len(part['source_opposed_continuations'])==len(part['source_whole_edge_opposed_continuations'])+len(part['source_endpoint_opposed_continuations'])
              for outcome in part['source_endpoint_opposition_outcomes']:
                  for witness in outcome['from_edge_endpoint_witnesses']+outcome['to_edge_endpoint_witnesses']:
                      assert not witness['whole_edge_semantic_role_granted']
                      assert witness['source_observation_id'] and witness['source_primitive_id'] and witness['physical_opening_id']
          print(json.dumps({'verified_customer_rows':8,'endpoint_opposed_continuations':{
              name:len(part['source_endpoint_opposed_continuations']) for name,part in parts.items()}}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-infill-endpoint-actual-customer-retention
          path: artifacts/original-infill-endpoint-customer-retention.json
          retention-days: 21
