name: ChatGPT Export Score Snapshot Eebaaf
on:
  push:
    branches:
      - chatgpt/export-score-snapshot-eebaaf
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        run: |
          tar --exclude=.git -czf /tmp/planreader-score-snapshot-eebaaf.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: planreader-score-snapshot-eebaaf
          path: /tmp/planreader-score-snapshot-eebaaf.tar.gz
          retention-days: 1
