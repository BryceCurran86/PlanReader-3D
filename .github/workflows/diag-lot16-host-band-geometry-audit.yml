name: DIAG Lot16 Host Band Geometry Audit

on:
  pull_request:
    branches:
      - gptmax/raster-candidate-closure-current-main

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Audit real Lot16 host-band geometry
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_lot16_host_band_geometry_audit.py \
            | tee lot16-host-band-geometry-audit.json
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-host-band-geometry-audit
          path: lot16-host-band-geometry-audit.json
          retention-days: 2
