name: GPT MAX Original Candidate Per-Source Membership

concurrency:
  group: test-gptmax-original-candidate-membership-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - pb_physical_opening_authority.py
      - tools/diag_gptmax_source_authority_stages.py
      - tests/test_opening_candidate_source_group_witness.py
      - tests/test_gptmax_raw_source_group_retention.py
      - tools/verify_gptmax_raw_source_group_retention.py
      - .github/workflows/test-gptmax-original-candidate-membership.yml
permissions:
  contents: read
jobs:
  exact-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Positive and adverse per-raw-candidate source membership
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_opening_candidate_source_group_witness.py \
            tests/test_gptmax_raw_source_group_retention.py \
            tests/test_gptmax_source_first_failure_ledger.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  original-lot16-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Reproduce exact original source stage from immutable PDF
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/gptmax-prior "${{ github.event.pull_request.base.sha }}"
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum --check
          (cd /tmp/gptmax-prior &&
            PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages --output "$GITHUB_WORKSPACE/baseline.json")
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages --output current.json
          PYTHONPATH=. python -u tools/diag_gptmax_source_authority_stages.py \
            --pdf "$PDF" --page-id 3 --source-all-pages \
            --include-raw-candidate-source-groups --output grouped.json
      - name: Exact old physical production outputs + truthful raw membership sidecar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('baseline.json').read_text())
          current=json.loads(Path('current.json').read_text())
          grouped=json.loads(Path('grouped.json').read_text())
          sha="10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844"
          assert before==current, "original Lot16 physical source report changed despite diagnostic-only opt-in"
          sidecar=grouped.pop("unresolved_candidate_source_groups")
          assert current==grouped, "opt-in candidate grouping mutated production source results"
          assert current['source_sha256']==sha
          assert current['primitive_safety_cap']==20_000
          assert len(current['source_owned_wall_scopes'][0]['records'])==2094
          for family,key in (('native','native_candidate_closures'),('raster','raster_candidate_closures')):
              closures={str(r['page_id']):r for r in current[key]}
              items={str(r['page_id']):r['groups'] for r in sidecar[family]}
              assert set(closures)==set(items)
              for page,closure in closures.items():
                  rows=items[page]
                  original=set(closure['unresolved_candidate_ids'])
                  assert {r['candidate_id'] for r in rows}==original
                  assert len(rows)==len(original)
                  union={i for row in rows for i in row['source_observation_ids']}
                  assert union <= set(closure['unresolved_observation_ids'])
                  assert all(r['candidate_status']=='unresolved_source_only' for r in rows)
                  assert all(isinstance(r['structural_pattern'],str) and r['structural_pattern'] for r in rows)
                  assert all(r['source_observation_ids'] for r in rows)
                  assert all((r['aperture_bbox_pt'] is None)==(family=='native') for r in rows)
                  assert not closure['candidate_universe_complete'], "fixture unexpectedly claims complete source universe"
          assert sum(len(x['groups']) for x in sidecar['native'])==125
          assert sum(len(x['groups']) for x in sidecar['raster'])==9
          assert before['summary']['authenticated_hosts']==15
          assert current['summary']['authenticated_hosts']==15
          # 1215 SGW was accepted on main (#2648); the raw G17 source
          # candidate universe and physical source receipts stay exactly paired.
          assert current['summary']['resolved_source_frames']==9
          assert current['summary']['physical_existence_claims']==21
          assert 'quantities' not in current
          assert 'quantities' not in grouped
          print({"original_source_unchanged":True,
                 "native_raw_candidate_source_groups":125,
                 "raster_raw_candidate_source_groups":9,
                 "authenticated_hosts":15,"frames":9,"benchmark_matches_claimed":0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-candidate-source-membership
          path: |
            baseline.json
            current.json
            grouped.json
          retention-days: 14
