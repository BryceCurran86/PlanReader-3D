name: Item19B KSTVET Wall Shadow

on:
  pull_request:
    branches: [main]

concurrency:
  group: item19b-kstvet-wall-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kstvet-wall-shadow:
    if: github.event.pull_request.number == 898
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download pinned KSTVET source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2             'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf'             -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -

      - name: Run page 54 wall-authority shadow
        run: |
          PYTHONPATH=. python scripts/wall_finish_face_binding_kstvet_shadow.py /tmp/kstvet.pdf
