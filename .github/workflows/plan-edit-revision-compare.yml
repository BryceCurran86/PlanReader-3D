name: Plan edit revision comparison safety
on:
  pull_request:
    paths:
      - 'pb_plan_edit_revision_compare.py'
      - 'tests/editable_3d/test_plan_edit_revision_compare.py'
      - '.github/workflows/plan-edit-revision-compare.yml'
  push:
    branches: [main]
    paths:
      - 'pb_plan_edit_revision_compare.py'
      - 'tests/editable_3d/test_plan_edit_revision_compare.py'
      - '.github/workflows/plan-edit-revision-compare.yml'
permissions:
  contents: read
jobs:
  compare-saved-revisions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest PyMuPDF numpy pandas plotly
      - name: Test authenticated review-only revision comparison
        run: python -m pytest -q tests/editable_3d/test_plan_edit_revision_compare.py
