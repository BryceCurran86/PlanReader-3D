name: DIAG Raster Swing Negative Census

on:
  pull_request:
    branches:
      - gpt4/raster-swing-local-registration-v1

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run frozen swing contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_raster_door_swing_g17_contract.py \
            tests/test_raster_swing_registration_authority.py \
            tests/test_raster_framed_opening_g17_contract.py
      - name: Run checked-in real-source census
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/diag_raster_swing_negative_census.py | tee raster-swing-negative-census.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-swing-negative-census
          path: raster-swing-negative-census.json
          retention-days: 1
