name: GPT3 MAX Opening Area Review vs Source Issuer

on:
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gpt3_max_area_review_source_issuer_bijection.py
      - tests/test_gpt3_max_area_review_source_issuer_bijection.py
      - tools/diag_gpt3_lot16_max_area_owner_original_replay.py
      - tests/test_gpt3_lot16_max_area_owner_original_replay.py
      - pb_live_opening_area_quantity_publication.py
      - tools/diag_gptmax_lot16_host_frame_gpt1_handoff.py
      - .github/workflows/test-gpt3-max-area-review-source-issuer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-and-signed-archive-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Independent publisher and original-eight signed archive parity
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_gpt3_max_area_review_source_issuer_bijection.py \
            tests/test_gpt3_lot16_max_area_owner_original_replay.py \
            tests/test_live_opening_area_quantity_publication.py \
            tests/test_gptmax_lot16_host_frame_gpt1_handoff.py
          ruff check --select F821,F823 \
            tools/diag_gpt3_max_area_review_source_issuer_bijection.py \
            tools/diag_gpt3_lot16_max_area_owner_original_replay.py \
            tests/test_gpt3_max_area_review_source_issuer_bijection.py
      # Exact client-original PDF is not checked into this public repository.
      # A missing-original test is SKIPPED, never source-positive verified.

  owner-original-lot16-source-replay:
    # Public pull-request runners do not contain private client-owned PDFs.
    # A skipped job is NOT positive original-source verification.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'BryceCurran86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Reproduce actual Lot16 original opening source, MAX and GPT3 seals
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum -c
          PYTHONPATH=. python -u tools/diag_gpt3_lot16_max_area_owner_original_replay.py \
            --pdf "$PDF" --output artifacts/gpt3-lot16-max-original-area-source-replay.json
      - name: Erase private originals and unpublished audit results
        if: always()
        shell: bash
        run: rm -rf documents/sources artifacts
