name: GPT MAX Original F07 Mark Membership

concurrency:
  group: test-gptmax-original-f07-mark-membership-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - tools/diag_gptmax_original_viewport_mark_ownership.py
      - tests/test_gptmax_original_viewport_mark_ownership.py
      - tools/diag_gptmax_f07_native_frame_gate.py
      - tests/test_gptmax_f07_native_frame_gate.py
      - docs/engineering/gptmax_original_viewport_mark_ownership_20261016.md
      - .github/workflows/test-gptmax-original-f07-mark-membership.yml
  push:
    branches: [main]
    paths:
      - tools/diag_gptmax_original_viewport_mark_ownership.py
      - tests/test_gptmax_original_viewport_mark_ownership.py
      - tools/diag_gptmax_f07_native_frame_gate.py
      - tests/test_gptmax_f07_native_frame_gate.py
      - docs/engineering/gptmax_original_viewport_mark_ownership_20261016.md
      - .github/workflows/test-gptmax-original-f07-mark-membership.yml
permissions:
  contents: read
jobs:
  original-native-view-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source and diagnostic dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Exact source-negative tests
        run: |
          PYTHONPATH=.:tools python -m pytest -q tests/test_gptmax_original_viewport_mark_ownership.py tests/test_gptmax_f07_native_frame_gate.py
          ruff check --select F821,F823 tools/diag_gptmax_original_viewport_mark_ownership.py tests/test_gptmax_original_viewport_mark_ownership.py tools/diag_gptmax_f07_native_frame_gate.py tests/test_gptmax_f07_native_frame_gate.py
      - name: SHA-pinned real Lot16 F07 replay
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA=10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum -c
          PYTHONPATH=.:tools python tools/diag_gptmax_original_viewport_mark_ownership.py \
            --pdf "$PDF" --sha256 "$SHA" --page-indices 2 4 \
            --phrase '2127 STACKER' \
            --datum-tokens FSL JL 68560 70660 2100 2590 \
            --output artifacts/gptmax-original-f07-native-mark-ownership.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/gptmax-original-f07-native-mark-ownership.json').read_text())
          assert r['status']=='UNBOUND_NATIVE_F07_VIEWPORT_MEMBERSHIP_CENSUS'
          assert r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['requested_page_indices']==[2,4]
          assert r['source_total_pdf_pages']==13
          assert all(len(p['mark_occurrences'])==1 for p in r['pages'])
          assert all(not r[field] for field in (
              'cross_sheet_physical_identity_proven',
              'specific_opening_dimension_binding_proven',
              'opening_host_proven','opening_kind_proven',
              'opening_count_proven','firm_quantity_granted'))
          for p in r['pages']:
              assert all(v['original_f07_producer_token_valid'] for v in p['viewports'])
              print('index',p['pdf_page_index_zero_based'],'F07',[
                  v['view_id']+':'+v['status'] for v in p['viewports']])
              print('mark',p['mark_occurrences'][0]['viewport_membership_reason'])
          print('No physical instance, per-opening dimension or quantity granted')
          PY
      - name: Native vector frame first-failure source census (no promotion)
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          SHA=10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844
          PYTHONPATH=.:tools python tools/diag_gptmax_f07_native_frame_gate.py \
            --pdf "$PDF" --sha256 "$SHA" --page-index 4 \
            --output artifacts/gptmax-native-f07-vector-frame-gates.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/gptmax-native-f07-vector-frame-gates.json').read_text())
          assert r['status']=='UNBOUND_F07_ORIGINAL_VECTOR_FRAME_CANDIDATE_AUDIT'
          assert r['source_sha256']=='10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844'
          assert r['source_page_index_zero_based']==4 and r['original_pdf_page_count']==13
          assert all(not r[k] for k in ('source_physical_view_correspondence_proven',
              'opening_height_granted','opening_width_granted','opening_host_granted',
              'opening_area_granted','opening_count_granted'))
          assert r['original_titles'], 'native original elevation title absent'
          for title in r['original_titles']:
              assert not title['native_vector_frame_authentication_granted']
              print('original title:',title['source_title_text'],
                    'candidate counts:',title['candidate_stage_counts'],
                    'fail:',title['first_failure_if_not_resolved'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptmax-original-f07-native-mark-ownership
          path: |
            artifacts/gptmax-original-f07-native-mark-ownership.json
            artifacts/gptmax-native-f07-vector-frame-gates.json
          retention-days: 21
