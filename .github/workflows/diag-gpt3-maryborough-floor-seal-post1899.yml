name: DIAG GPT3 Maryborough Floor Seal Post 1899

on:
  pull_request:
    branches: [ main ]

jobs:
  floor-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Verify frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Prove customer-scope floor sealing
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u tools/diag_gpt3_maryborough_floor_seal_post1899.py \
            | tee maryborough-floor-seal-post1899.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt3-maryborough-floor-seal-post1899
          path: maryborough-floor-seal-post1899.json
          retention-days: 3
