name: GPT MAX Original Owned Bifold Quantity Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - "pb_source_plan_opening_callout.py"
      - "pb_opening_label_semantic_authority.py"
      - "pb_opening_label_dimension_authority.py"
      - "pb_live_physical_opening_void_composition.py"
      - "tools/diag_gptmax_owned_bifold_quantity_shadow.py"
      - "tests/test_owned_bifold_descriptor_shadow.py"
      - ".github/workflows/test-gptmax-owned-bifold-quantity-shadow.yml"
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  source-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_owned_bifold_descriptor_shadow.py tests/test_opening_label_semantic_authority.py tests/test_opening_label_dimension_authority.py tests/test_source_plan_opening_callout.py tests/test_live_physical_opening_void_composition.py tests/test_live_opening_area_quantity_publication.py tests/test_live_opening_claim_source_closed_export.py
          ruff check --select F821,F823 pb_source_plan_opening_callout.py pb_opening_label_semantic_authority.py pb_opening_label_dimension_authority.py pb_live_physical_opening_void_composition.py tools/diag_gptmax_owned_bifold_quantity_shadow.py tests/test_owned_bifold_descriptor_shadow.py
  original-source-quantity-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime
      - name: Original physical, host, frame, figured measurement, quantity and customer chain
        run: |
          set -euo pipefail
          PDF='documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf'
          printf '%s  %s\n' '10109b4b6e85e6e27af81f6399ce4b92abfdba80f87dc69dd5887bd6f3a65844' "$PDF" | sha256sum --check
          PYTHONPATH=. python -u tools/diag_gptmax_owned_bifold_quantity_shadow.py --pdf "$PDF" --page-id 3 --output artifacts/original-owned-bifold-quantity-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/original-owned-bifold-quantity-shadow.json').read_text())
          assert p['status']=='UNPUBLISHED_SHADOW_REVIEW'
          assert p['primitive_safety_cap']==20000 and not p['count_granted'] and not p['production_activation_granted']
          assert p['snapshot_id']=='source_snapshot_3fcb6bc5c44b51d930e9600080501d27'
          assert p['original_quantity_and_customer_receipts_unchanged'] and p['original_source_host_frame_receipts_unchanged'] and p['default_recomposition_unchanged']
          a,b=p['baseline_receipts'],p['candidate_receipts']
          assert len(a['quantities'])==len(a['customer_rows'])==8
          assert len(b['quantities'])==len(b['customer_rows'])==9
          assert b['customer_verification']['valid_quantity_count']==9
          old={q['quantity_id']:q for q in a['quantities']}
          new={q['quantity_id']:q for q in b['quantities']}
          assert all(new[k]==v for k,v in old.items())
          assert len(p['additional_quantity_evidence'])==1
          n=p['additional_quantity_evidence'][0]
          assert n['quantity_id']=='opening_area_53a2e26464148e17d0a0c90ee11554a1'
          assert n['quantity']['value']==8.82 and n['quantity']['unit']=='m2'
          assert n['canonical_opening']['physical_opening_id']=='physical_opening_existence_00d50eb9ef77840451522efdc25f2df5'
          assert n['original_snapshot_id']==p['snapshot_id'] and n['original_decision_scope_id']=='wall-source:page-3'
          assert n['host_result']['record']['record_id']=='opening_host_binding_v3_584f77a1c75b8e0abe7a374f62d44655'
          assert n['frame_result']['evidence']['record_id']=='opening_host_frame_v2_a82e8977c20ebd579bc78e59933828e6'
          label=n['figured_label_result']['evidence']
          assert label['raw_text']=='2142 BIFOLD' and label['dimension_values_mm']==[2100.,4200.]
          assert label['area_m2']==8.82 and label['axis_order_resolved'] is False
          assert {r['trusted_text'] for r in n['original_native_text_receipts']}=={'2142','BIFOLD'}
          assert all(r['receipt']['trusted'] and r['receipt']['decode_status']=='validated_tounicode' for r in n['original_native_text_receipts'])
          print({'baseline_quantity_count':8,'candidate_quantity_count':9,'additional_source_quantity_id':n['quantity_id'],'count_granted':False,'axis_order_resolved':False})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gptmax-original-owned-bifold-quantity-shadow
          path: artifacts/original-owned-bifold-quantity-shadow.json
          retention-days: 21
