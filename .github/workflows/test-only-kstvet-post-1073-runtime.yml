name: TEST-ONLY KSTVET Post-1073 Runtime

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify exact KSTVET source
        run: |
          mkdir -p benchmarks/sources
          curl -L --fail --retry 3             -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf             "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -

      - name: Run exact KSTVET benchmark after wall performance fix
        shell: bash
        run: |
          mkdir -p /tmp/kstvet-post-1073
          set +e
          start=$(date +%s)
          PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=30s 1200s             python -u pb_benchmark_accuracy_engine.py               --benchmark tenders_ke_kstvet_cbc_classroom               --pdf benchmarks/sources/1727358888238-bq-nd-drawing.pdf               --output-dir /tmp/kstvet-post-1073             2>&1 | tee /tmp/kstvet-post-1073.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s)
          elapsed=$((end-start))
          echo "KSTVET_POST_1073_EXIT_CODE=$rc"
          echo "KSTVET_POST_1073_ELAPSED_SECONDS=$elapsed"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "KSTVET_POST_1073_TIMEOUT=1"
          else
            echo "KSTVET_POST_1073_TIMEOUT=0"
          fi
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kstvet-post-1073-runtime
          path: |
            /tmp/kstvet-post-1073
            /tmp/kstvet-post-1073.log
