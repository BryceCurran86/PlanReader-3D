name: TEST-ONLY KSTVET Support After 763

on:
  pull_request:
    branches: [main]

jobs:
  kstvet:
    if: startsWith(github.head_ref, 'diag/kstvet-support-after-763')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run SHA-pinned KSTVET benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from pb_public_tender_benchmark import PublicTenderBenchmark
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine

          benchmark_id="tenders_ke_kstvet_cbc_classroom"
          bench=PublicTenderBenchmark.load(benchmark_id,base_dir="benchmarks/public_tenders")
          drawing=next(d for d in bench.download_manifest["documents"] if d.get("role")=="architectural_drawings")
          url=bench.download_manifest["source_url"]
          expected=str(drawing["sha256"]).lower()
          path=Path("/tmp/kstvet.pdf")
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-support-763/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              path.write_bytes(r.read())
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual}")

          report=BenchmarkAccuracyEngine(
              benchmarks_dir="benchmarks/public_tenders",
              output_dir="/tmp/kstvet-result",
          ).evaluate_benchmark(benchmark_id=benchmark_id,pdf_path=path,auto_extract=True)
          target=next(item.to_dict() for item in report.item_results if item.item_id=="BOQ-C47-D")
          payload={
              "source_sha256":actual,
              "production_sha":"bdc6e8e6dc01bc74d81900820fbe8b8b43293a7e",
              "accepted":int(report.exact_matches+report.within_5_percent),
              "denominator":int(report.total_items_compared),
              "accuracy_percentage":report.overall_accuracy_percentage,
              "strict_exact_percentage":report.strict_exact_accuracy_percentage,
              "exact":int(report.exact_matches),
              "within_5":int(report.within_5_percent),
              "gross":int(report.gross_mismatches),
              "missed":int(report.missed_items),
              "hallucinated":int(report.hallucinated_items),
              "target_C47_D":target,
          }
          print("KSTVET_SUPPORT_763="+json.dumps(payload,sort_keys=True),flush=True)
          PY
