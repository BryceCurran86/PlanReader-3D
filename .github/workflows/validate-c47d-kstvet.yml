name: TEST-ONLY C47-D KSTVET Validation — DO NOT MERGE

on:
  pull_request:
    branches: [main]

jobs:
  validate-c47d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download and SHA-verify registered KSTVET source
        run: |
          set -euo pipefail
          mkdir -p benchmarks/sources
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf" \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo "6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf" | sha256sum -c -
      - name: Run production KSTVET benchmark
        env:
          PYTHONPATH: .
        run: |
          mkdir -p benchmark_results_runtime
          python pb_benchmark_accuracy_engine.py \
            --benchmark tenders_ke_kstvet_cbc_classroom \
            --auto-extract \
            --output-dir benchmark_results_runtime
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmark_results_runtime/tenders_ke_kstvet_cbc_classroom_accuracy_report.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          s=d["summary"]
          accepted=int(s["exact_matches"])+int(s["within_5_percent"])
          print("KSTVET_RESULT", accepted, "/", s["total_items_compared"], "accuracy", s["overall_accuracy_percentage"])
          for row in d["item_results"]:
              if row["item_id"]=="BOQ-C47-D":
                  print("C47D_ROW", row["status"], row["extracted_quantity"], row["expected_quantity"])
          PY
