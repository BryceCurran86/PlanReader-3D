name: DIAG GPT2 Independent Original F07 Source Sibling Scope Parity

on:
  pull_request:
    paths:
      - tools/diag_gpt2_independent_f07_original_scope_parity.py
      - tests/test_gpt2_independent_original_f07_scope_parity.py
      - .github/workflows/diag-gpt2-original-f07-sibling-scope.yml

permissions:
  contents: read

jobs:
  original-independent-source-f07:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt rapidocr onnxruntime ruff
      - name: Source stamped sibling roles and source-scope parity adversarial tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gpt2_independent_original_f07_scope_parity.py
          ruff check --select F821,F823 tools/diag_gpt2_independent_f07_original_scope_parity.py tests/test_gpt2_independent_original_f07_scope_parity.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
      - name: Original SHA W4 and independent source F07 all sibling receipt parity
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          mkdir -p artifacts/gpt2-independent-f07-siblings
          git rev-parse HEAD > artifacts/gpt2-independent-f07-siblings/head.txt
          timeout 2300s python -u -m tools.diag_gpt2_independent_f07_original_scope_parity \
            --pdf "$PDF" --sha "$SHA" --page 11 \
            --output artifacts/gpt2-independent-f07-siblings/original-f07-parity.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/gpt2-independent-f07-siblings/original-f07-parity.json')
          v=json.loads(p.read_text())
          assert v['original_source_sha256']=='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          assert v['original_source_snapshot_unchanged']
          assert v['source_f07_ownership_note']=='independently_recomputed_source_F07_not_original_wall_in_memory_views'
          assert len(v['first_original_w4_scopes'])==1
          sc=v['first_original_w4_scopes'][0]
          assert (sc['original_w4_candidate_count'],sc['original_w4_owned_shadow_face_count'])==(890,1235)
          assert sc['original_authoritative_source_room_face_count']==0
          f=v['independent_second_f07_sibling_source_replay']
          assert f['status'] in (
              'independent_source_f07_replay_exact_w4_scope_parity',
              'independent_source_f07_replay_w4_scope_conflict_or_unavailable',
          )
          assert f['all_original_f07_view_count']>=1
          assert all(x['source_view_producer_seal_verified'] for x in f['all_source_owned_views'])
          assert len(f['sibling_source_fingerprint'])==64
          assert f['room_or_wall_authority_granted'] is False
          assert v['new_physical_room_authority'] is False
          assert v['new_finish_occurrence'] is False
          assert v['new_customer_quantities']==[]
          assert not v['frozen_benchmark_scored']
          print('GPT2_F07_SCOPE_EXACT_PARITY',f['original_w4_scope_id_parity_verified'])
          print('GPT2_F07_SIBLING_VIEW_IDS',[
              x['source_f07_view_id'] for x in f['all_source_owned_views']
          ])
          print('GPT2_F07_ORIGINAL_SCOPE_IDS',[x['decision_scope_id'] for x in v['first_original_w4_scopes']])
          print('GPT2_F07_REPLAY_SCOPE_IDS',f['replayed_source_plan_scope_candidates'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-independent-original-f07-sibling-scope-evidence
          path: artifacts/gpt2-independent-f07-siblings
          retention-days: 14
