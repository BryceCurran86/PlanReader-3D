name: GPT MAX Maryborough Commercial Quarantine

on:
  push:
    branches: [gptmax/maryborough-commercial-authority-quarantine-20261108]

permissions:
  contents: read

concurrency:
  group: maryborough-commercial-quarantine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install public regression dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Enforce source privacy and frozen separation
        env:
          BASE_SHA: 4e75e523ae6856351e17f090836c9a44d3d94a70
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=AMRCT --name-only -z "$BASE_SHA" "$HEAD_SHA" | python scripts/check_private_original_source_additions.py
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | python scripts/check_v2_truth_separation.py --nul
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Compile without contaminating archived receipts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/maryborough-quarantine-pycache
        run: python -m compileall -q .
      - name: Check undefined names
        run: ruff check --select F821,F823 .
      - name: Full public production and customer regressions
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          PLANREADER_PRIVATE_ORIGINAL_POLICY: skip_missing_in_public_ci
        run: python -m pytest -q -rs tests/
      - name: State verification limits
        if: always()
        run: |
          echo '### Maryborough commercial quarantine regression' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public/synthetic verification only. Skipped originals are not source passes; no new quantity or benchmark score.' >> "$GITHUB_STEP_SUMMARY"
