name: GPT MAX fresh source G17 policy isolation
on:
  pull_request:
    branches:
      - main
      - gptmax/original-inclusive-unmeasured-pier-capture-20261017
    paths:
      - pb_source_visibility_authority.py
      - tests/test_gptmax_g17_source_policy_isolation.py
      - .github/workflows/test-gptmax-g17-source-policy-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy-fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_gptmax_g17_source_policy_isolation.py tests/test_gptmax_unmeasured_g17_flank_capture.py
