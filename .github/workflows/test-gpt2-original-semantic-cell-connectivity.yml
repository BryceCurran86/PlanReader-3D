name: TEST GPT2 Original Semantic Table Source Cell Connectivity

on:
  pull_request:
    paths:
      - tools/diag_source_connected_semantic_cell_shadow.py
      - tests/test_gpt2_source_connected_semantic_cell_shadow.py
      - .github/workflows/test-gpt2-original-semantic-cell-connectivity.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  original-a120-false-table-firstgate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Guard exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tests
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Source-original rectangle cell contact with false table negatives
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA=b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007
          echo "$SHA  $PDF" | sha256sum --check
          python -m pytest -q tests/test_gpt2_source_connected_semantic_cell_shadow.py
          python scripts/check_full_plan_v2_integrity.py
          python scripts/check_provider_gold_isolation.py
