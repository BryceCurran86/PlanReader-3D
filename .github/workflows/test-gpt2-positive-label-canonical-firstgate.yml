name: GPT2 Original Maryborough Source Label to Canonical First-Gate
on:
  pull_request:
    paths:
      - "tools/diag_gpt2_positive_room_label_canonical_projection.py"
      - "tests/test_gpt2_positive_room_label_canonical_projection.py"
      - ".github/workflows/test-gpt2-positive-label-canonical-firstgate.yml"
      - "docs/engineering/gpt2_positive_label_canonical_firstgate.md"
concurrency:
  group: gpt2-positive-room-label-firstgate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13","3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Require exact source face receipt ownership, no label proximity
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_gpt2_positive_room_label_canonical_projection.py
          python -m compileall -q tools/diag_gpt2_positive_room_label_canonical_projection.py
          ruff check --select F821,F823 tools/diag_gpt2_positive_room_label_canonical_projection.py tests/test_gpt2_positive_room_label_canonical_projection.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Authenticate identical original PDF in direct face label and full canonical collectors
        run: |
          set -euo pipefail
          PDF='documents/sources/Arch_Combined_Maryborough_Service_Station.pdf'
          SHA='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          printf '%s  %s\n' "$SHA" "$PDF" | sha256sum --check
          PYTHONPATH=. python -u - <<'PY'
          import json
          from pathlib import Path
          from tools.diag_gptmax_maryborough_room_first_owner_gate import replay_original_maryborough_room_gate
          from tools.diag_gpt2_positive_room_label_canonical_projection import original_source_label_to_canonical_first_gates
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim
          path=Path('documents/sources/Arch_Combined_Maryborough_Service_Station.pdf')
          sha='b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007'
          direct=replay_original_maryborough_room_gate(
              path.read_bytes(), expected_source_sha=sha,
          )
          live=collect_live_physical_net_wall_claim(
              path,pages=(6,),topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          d=original_source_label_to_canonical_first_gates(
              direct,tuple(live.canonical_rooms),expected_original_sha=sha,
          )
          assert d['original_source_sha256']==sha
          assert d['diagnostic_only'] is True
          assert d['benchmark_accuracy'] is None
          assert d['no_nearest_label_fallback'] is True
          assert any(r['original_direct_label']=='SALES'
                     for r in d['first_projection_gates'])
          assert all(
              r['source_room_geometry_inferred'] is False
              and r['source_wall_ownership_inferred'] is False
              and r['metric_area_or_finish_published'] is False
              and r['original_source_face_receipt_id']
              and r['original_source_text_observation_ids']
              for r in d['first_projection_gates']
          )
          Path('original-maryborough-source-label-canonical-gates.json').write_text(
              json.dumps(d,indent=2,sort_keys=True)+'\n',
          )
          print('GPT2_ORIGINAL_SOURCE_LABEL_CANONICAL_GATES',
                json.dumps([(r['original_direct_label'],
                             r['first_unproved_projection_gate'],
                             r['original_source_face_receipt_id'])
                            for r in d['first_projection_gates']],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-original-maryborough-positive-label-canonical
          path: original-maryborough-source-label-canonical-gates.json
          retention-days: 30
