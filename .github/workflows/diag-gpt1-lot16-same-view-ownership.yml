name: DIAG GPT1 Lot16 Same View Ownership

on:
  push:
    branches:
      - diag/gpt1-lot16-same-view-ownership-v1

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Trace real Lot16 same-view ownership
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-same-view-ownership.json
          import hashlib
          import json
          from pathlib import Path

          from pb_drawing_evidence_binding import DrawingViewType
          from pb_live_canonical_room_composition import LiveCanonicalRoomComposition
          from pb_live_physical_net_wall_integration import (
              LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION,
              collect_live_physical_net_wall_claim,
          )
          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_same_view_room_area_authority import SameViewRoomAreaProducer
          from pb_source_visibility_authority import SourceVisibilityProducer
          from pb_cross_view_room_area_authority import (
              _dimension_is_immediate_label_annotation,
              _figured_pair_scale_consistent,
              _line_inside_dimension_pair,
              _norm_label,
              _trusted_lines_for_page,
              _trusted_native_dimensions_for_page,
              _witness_systems_intersect,
          )
          from pb_dimension_graph_constraint_engine import DimensionOrientation

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          payload=path.read_bytes()
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(2,),
              topology_pages=(2,),
              room_area_support_pages=None,
          )

          rooms=LiveCanonicalRoomComposition(
              status=claim.canonical_room_status,
              reason_codes=claim.canonical_room_reason_codes,
              rooms=claim.canonical_rooms,
              source_pages=claim.canonical_room_source_pages,
          )

          source_sha=hashlib.sha256(payload).hexdigest()
          source=SourceVisibilityProducer(
              producer_method="live-physical-net-wall",
              producer_version=LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION,
          )
          published=source.ingest_native_pdf_bytes(
              document_id=f"live-source:{source_sha[:32]}",
              source_bytes=payload,
              source_locator="memory://live-physical-net-wall-source.pdf",
              page_ids=("3",),
          )

          same=SameViewRoomAreaProducer.from_source(
              source=source,
              rooms=rooms,
          ).publish()

          groups={}
          for room in rooms.rooms:
              groups.setdefault(
                  (str(room.page_id), _norm_label(room.room_label)),
                  [],
              ).append(room)

          census=[]
          for room in rooms.rooms:
              label=_norm_label(room.room_label)
              key=(str(room.page_id),label)
              duplicate_count=len(groups.get(key,()))
              row={
                  "physical_room_id":room.physical_room_id,
                  "room_label":room.room_label,
                  "normalized_label":label,
                  "page_id":room.page_id,
                  "geometry_complete":room.geometry_complete,
                  "has_source_face":bool(str(room.source_room_face_record_id or "").strip()),
                  "has_label_binding":bool(str(room.room_label_binding_record_id or "").strip()),
                  "label_evidence_count":len(room.room_label_evidence_ids),
                  "same_page_label_duplicate_count":duplicate_count,
                  "trusted_label_line_count":0,
                  "trusted_dimension_count":0,
                  "horizontal_count":0,
                  "vertical_count":0,
                  "strict_pair_count":0,
                  "immediate_pair_count":0,
                  "pair_values":[],
              }
              if (
                  room.geometry_complete
                  and label
                  and duplicate_count == 1
                  and str(room.room_label_binding_record_id or "").strip()
                  and room.room_label_evidence_ids
              ):
                  lines=tuple(
                      line
                      for line in _trusted_lines_for_page(
                          source,
                          revision_id=published.revision.revision_id,
                          page_id=str(room.page_id),
                          candidate_labels=(room.room_label,),
                      )
                      if _norm_label(line.text) == label
                  )
                  row["trusted_label_line_count"]=len(lines)
                  if len(lines)==1:
                      dims=_trusted_native_dimensions_for_page(
                          source,
                          revision_id=published.revision.revision_id,
                          page_id=str(room.page_id),
                          candidate_lines=lines,
                          view_type=DrawingViewType.FLOOR_PLAN.value,
                      )
                      hs=tuple(d for d in dims if d.orientation==DimensionOrientation.HORIZONTAL.value)
                      vs=tuple(d for d in dims if d.orientation==DimensionOrientation.VERTICAL.value)
                      row["trusted_dimension_count"]=len(dims)
                      row["horizontal_count"]=len(hs)
                      row["vertical_count"]=len(vs)
                      line=lines[0]
                      strict=[]
                      for h in hs:
                          for v in vs:
                              if (
                                  _line_inside_dimension_pair(line,h,v)
                                  and _figured_pair_scale_consistent(
                                      page_id=str(room.page_id),
                                      horizontal=h,
                                      vertical=v,
                                  )
                                  and _witness_systems_intersect(h,v)
                              ):
                                  strict.append((h,v))
                      owned_h=tuple(d for d in hs if _dimension_is_immediate_label_annotation(line,d))
                      owned_v=tuple(d for d in vs if _dimension_is_immediate_label_annotation(line,d))
                      immediate=[]
                      for h in owned_h:
                          for v in owned_v:
                              if _figured_pair_scale_consistent(
                                  page_id=str(room.page_id),
                                  horizontal=h,
                                  vertical=v,
                              ):
                                  immediate.append((h,v))
                      row["strict_pair_count"]=len(strict)
                      row["immediate_pair_count"]=len(immediate)
                      pairs=strict if strict else immediate
                      row["pair_values"]=[
                          {
                              "horizontal_mm":h.value_mm,
                              "vertical_mm":v.value_mm,
                              "horizontal_id":h.dimension_id,
                              "vertical_id":v.dimension_id,
                          }
                          for h,v in pairs[:20]
                      ]
              census.append(row)

          out={
              "canonical_room_count":len(rooms.rooms),
              "same_view_status":same.status.value,
              "same_view_reason_codes":list(same.reason_codes),
              "same_view_record_count":len(same.records),
              "same_view_unresolved_count":len(same.unresolved_physical_room_ids),
              "records":[
                  {
                      "physical_room_id":r.physical_room_id,
                      "room_label":r.room_label,
                      "horizontal_dimension_id":r.horizontal_dimension_id,
                      "vertical_dimension_id":r.vertical_dimension_id,
                      "area_m2":r.area_evidence.normalized_value,
                  }
                  for r in same.records
              ],
              "census":census,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-same-view-ownership
          path: lot16-same-view-ownership.json
          retention-days: 3
