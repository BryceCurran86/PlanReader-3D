name: DIAG GPT1 Lot16 Same View Ownership

on:
  push:
    branches:
      - diag/gpt1-lot16-same-view-ownership-v1

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Trace real Lot16 source room-label authority
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' | tee lot16-room-label-authority.json
          import hashlib
          import json
          import traceback
          from pathlib import Path

          from pb_live_physical_net_wall_integration import (
              LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION,
          )
          from pb_live_wall_opening_authority_composition import (
              compose_live_wall_opening_authority,
          )
          from pb_migration_contracts import EvidenceResolutionStatus
          from pb_source_room_face_authority import (
              SourceRoomFaceSelector,
              build_source_room_face_authority,
          )
          from pb_source_room_label_authority import (
              SourceRoomLabelProducer,
              SourceRoomLabelSelector,
          )
          from pb_source_visibility_authority import SourceVisibilityProducer

          path=Path("documents/sources/1. Construction Plans - Lot 16 Power (REV E).pdf")
          payload=path.read_bytes()
          source_sha=hashlib.sha256(payload).hexdigest()
          source=SourceVisibilityProducer(
              producer_method="live-physical-net-wall",
              producer_version=LIVE_PHYSICAL_NET_WALL_INTEGRATION_SCHEMA_VERSION,
          )
          published=source.ingest_native_pdf_bytes(
              document_id=f"live-source:{source_sha[:32]}",
              source_bytes=payload,
              source_locator="memory://live-physical-net-wall-source.pdf",
              page_ids=("3",),
          )

          wall_opening=compose_live_wall_opening_authority(
              source_visibility_producer=source,
              revision_id=published.revision.revision_id,
              page_ids=("3",),
          )
          published=source.published_snapshot_for_revision(published.revision.revision_id)
          room_authority=build_source_room_face_authority(
              wall_opening.physical_wall_candidate_authority
          )
          room_selector=SourceRoomFaceSelector(
              document_id=published.revision.document_id,
              revision_id=published.revision.revision_id,
              source_sha256=published.revision.source_sha256,
              snapshot_id=published.snapshot.snapshot_id,
              page_id="3",
              decision_scope_id="wall-source:page-3",
          )
          room_scope=room_authority.resolve_scope(room_selector)

          out={
              "room_scope_status":room_scope.status.value,
              "room_scope_reason_codes":list(room_scope.reason_codes),
              "room_scope_complete":room_scope.scope_complete,
              "room_face_count":len(room_scope.records),
              "face_universe_complete":room_scope.face_universe_complete,
          }

          try:
              producer=SourceRoomLabelProducer.from_authorities(
                  source,
                  room_authority,
                  page_ids=("3",),
              )
              results=producer.published_results()
              out["producer_exception"]=None
              out["label_results"]=[
                  {
                      "status":result.status.value,
                      "reason_codes":list(result.reason_codes),
                      "record_count":len(result.records),
                      "records":[
                          {
                              "label":record.label,
                              "face_id":record.face_id,
                              "source_room_face_record_id":record.source_room_face_record_id,
                              "source_bbox":list(record.source_bbox),
                              "observation_ids":list(record.observation_ids),
                              "authority_kinds":[w.authority_kind for w in record.word_evidence],
                          }
                          for record in result.records
                      ],
                      "split_face_candidate_count":len(result.split_face_candidates),
                      "split_face_candidates":[
                          {
                              "label":candidate.label,
                              "word_face_ids":list(candidate.word_face_ids),
                              "source_room_face_record_ids":list(candidate.source_room_face_record_ids),
                              "source_bbox":list(candidate.source_bbox),
                              "observation_ids":list(candidate.observation_ids),
                          }
                          for candidate in result.split_face_candidates
                      ],
                  }
                  for result in results
              ]
          except Exception as exc:
              out["producer_exception"]={
                  "type":type(exc).__name__,
                  "message":str(exc),
                  "traceback":traceback.format_exc(),
              }
              out["label_results"]=[]

          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot16-room-label-authority
          path: lot16-room-label-authority.json
          retention-days: 3
