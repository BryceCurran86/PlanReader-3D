name: DIAG Lot16 Raster Label Ownership

on:
  pull_request:
    branches:
      - gpt4/raster-opening-label-ownership-v3

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run Lot16 raster label ownership diagnostic
        run: |
          PYTHONPATH=. python tools/diag_lot16_raster_label_ownership.py | tee lot16-raster-label-ownership.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot16-raster-label-ownership
          path: lot16-raster-label-ownership.json
          retention-days: 1
