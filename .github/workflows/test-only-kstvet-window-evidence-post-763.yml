name: TEST-ONLY KSTVET Window Evidence Post 763

on:
  pull_request:
    branches: [main]

jobs:
  kstvet-window-evidence:
    if: startsWith(github.head_ref, 'diag/kstvet-window-evidence-post-763')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Probe KSTVET W1 W2 source evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          import fitz

          from pb_drawing_ocr_evidence_layer import DrawingOCREngine
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor

          url="https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf"
          expected_sha="6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc"
          req=urllib.request.Request(url,headers={"User-Agent":"PlanReader-KSTVET-window-evidence-post-763/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=r.read()
          actual=hashlib.sha256(payload).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"source hash mismatch: {actual}")
          source=Path("/tmp/kstvet.pdf")
          source.write_bytes(payload)

          candidate_re=re.compile(
              r"(?i)(?:\bW\s*[-_/]?\s*0?\d\b|\bwindow\b|\bcasement\b|"
              r"\b3000\b|\b2900\b|\b1200\b|\bqty\b|\bquantity\b|"
              r"\boverall\b|\bno\.?s?\b)"
          )

          def candidate_lines(rows):
              out=[]
              for row in rows:
                  text=str(row.get("text") or "").strip()
                  if candidate_re.search(text):
                      out.append({
                          "text":text,
                          "bbox":row.get("bounding_box"),
                          "confidence":row.get("confidence"),
                      })
              return out

          doc=fitz.open(source)
          extractor=GenericPlanReaderExtractor()
          schedule_extractor=GenericScheduleTableExtractor()
          engine=DrawingOCREngine()
          try:
              pages=[53,54]
              drawing_pages=[p for p in pages if extractor.is_drawing_page(doc[p].get_text("text"),doc[p])]
              result={"source_sha256":actual,"production_sha":"65bbdb077333e376e2c0ee0cb6dd002afa28197c","drawing_pages":[p+1 for p in drawing_pages],"pages":[]}
              result["schedule_rows"]=[r.to_dict() for r in schedule_extractor.extract_from_document(doc,pages=drawing_pages) if r.trade_type in ("windows","doors")]

              for pno in drawing_pages:
                  page=doc[pno]
                  native=page.get_text("text") or ""
                  words=page.get_text("words") or []
                  native_lines=[ln.strip() for ln in native.splitlines() if ln.strip()]
                  relevant_native=[ln for ln in native_lines if candidate_re.search(ln)]

                  chains=[]
                  try:
                      for chain in extract_dimension_chains_from_page(page,page_num=pno+1,view_id=f"page_{pno+1}"):
                          obs=list(getattr(chain,"observations",()) or ())
                          vals=[round(float(o.value_m)*1000.0,2) for o in obs]
                          if len(vals) >= 3 and any(650 <= v <= 3800 for v in vals):
                              chains.append({
                                  "chain_id":str(getattr(chain,"chain_id","")),
                                  "values_mm":vals,
                                  "bboxes":[list(o.bbox) if getattr(o,"bbox",None) else None for o in obs],
                              })
                  except Exception as exc:
                      chains=[{"error":repr(exc)}]

                  image_rows=[]
                  for image_index,img in enumerate(page.get_images(full=True) or []):
                      xref=int(img[0])
                      rects=[]
                      try:
                          rects=[list(r) for r in page.get_image_rects(xref)]
                      except Exception:
                          rects=[]
                      image_rec={"index":image_index,"xref":xref,"meta":list(img[:10]),"rects":rects,"ocr":[]}
                      for rect_index,coords in enumerate(rects[:8]):
                          rect=fitz.Rect(coords)
                          if rect.is_empty or rect.width < 5 or rect.height < 5:
                              continue
                          for dpi in (240,320):
                              rows=engine.recognize_page_rect(page,clip_rect=rect,dpi=dpi)
                              hits=candidate_lines(rows)
                              if hits:
                                  image_rec["ocr"].append({"rect_index":rect_index,"dpi":dpi,"hits":hits[:120]})
                      image_rows.append(image_rec)

                  full_ocr={}
                  for dpi in (180,240):
                      rows=engine.recognize_page_rect(page,dpi=dpi)
                      full_ocr[str(dpi)]=candidate_lines(rows)[:180]

                  result["pages"].append({
                      "page":pno+1,
                      "page_rect":list(page.rect),
                      "native_char_count":len(native),
                      "native_relevant":relevant_native[:240],
                      "word_relevant":[
                          {"text":str(w[4]),"bbox":[float(w[0]),float(w[1]),float(w[2]),float(w[3])]}
                          for w in words if candidate_re.search(str(w[4]))
                      ][:240],
                      "dimension_chains":chains[:160],
                      "images":image_rows,
                      "full_ocr":full_ocr,
                  })
              print("KSTVET_WINDOW_EVIDENCE_POST_763="+json.dumps(result,sort_keys=True),flush=True)
          finally:
              doc.close()
          PY
