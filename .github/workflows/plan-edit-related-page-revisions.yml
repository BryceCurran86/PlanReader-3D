name: Plan edit related-page revision safety
on:
  pull_request:
    paths:
      - 'pb_plan_edit_revision_*.py'
      - 'pb_plan_edit_related_page_resolver.py'
      - 'pb_plan_edit_verified_vector_overlay.py'
      - 'pb_vr_editor_readonly_wsgi.py'
      - 'tests/editable_3d/test_plan_edit_revision_*.py'
      - 'tests/editable_3d/test_plan_edit_verified_vector_overlay.py'
      - '.github/workflows/plan-edit-related-page-revisions.yml'
  push:
    branches: [main]
    paths:
      - 'pb_plan_edit_revision_*.py'
      - 'pb_plan_edit_related_page_resolver.py'
      - 'pb_plan_edit_verified_vector_overlay.py'
      - 'pb_vr_editor_readonly_wsgi.py'
      - 'tests/editable_3d/test_plan_edit_revision_*.py'
      - 'tests/editable_3d/test_plan_edit_verified_vector_overlay.py'
      - '.github/workflows/plan-edit-related-page-revisions.yml'
jobs:
  related-page-transaction:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest PyMuPDF numpy pandas plotly
      - name: Test original source, related pages, PDF lineage and atomic save
        run: |
          python -m pytest -q tests/editable_3d/test_plan_edit_revision_store.py tests/editable_3d/test_plan_edit_revision_wsgi.py tests/editable_3d/test_plan_edit_verified_vector_overlay.py
