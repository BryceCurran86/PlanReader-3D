services:
  - type: web
    name: premier-brushworks-planreader-3d
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PLANREADER_DATA_DIR
        value: /var/data/planreader
      - key: PGCONNECT_TIMEOUT
        value: "5"
      - key: JOBHUB_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: OpenAI
    disk:
      name: planreader-data
      mountPath: /var/data
      sizeGB: 10
